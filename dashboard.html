<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paraguay Briefing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#F0F4FF;color:#1E293B;line-height:1.6;min-height:100vh}
a{color:#3B82F6;text-decoration:none}a:hover{text-decoration:underline}
.header{background:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;border-bottom:3px solid #3B82F6}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;flex-shrink:0}
.header-left h1{font-size:20px;font-weight:700;color:#1E293B}
.header-left .subtitle{font-size:12px;color:#64748B;margin-top:2px}
.header-right{display:flex;gap:8px;align-items:center}
.btn-lang{background:#EEF2FF;color:#4F46E5;font-weight:700;font-size:12px;padding:8px 14px;border-radius:20px;border:none;cursor:pointer}
.btn-lang:hover{background:#E0E7FF}
.btn-primary{background:#3B82F6;color:#fff;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-primary:hover{background:#2563EB;transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.3)}
.btn-secondary{background:#F1F5F9;color:#475569;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:#E2E8F0}
.btn-sm{font-size:11px;padding:6px 12px}
.update-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:moFade .2s}
.update-modal{background:#fff;border-radius:14px;padding:24px 28px;width:440px;max-width:90vw;box-shadow:0 24px 80px rgba(0,0,0,.25);animation:moZoom .25s}
.update-modal h3{font-size:17px;font-weight:700;color:#1E293B;margin-bottom:16px}
.update-modal label{display:block;font-size:12px;font-weight:600;color:#64748B;margin-bottom:4px}
.update-modal select,.update-modal input{width:100%;padding:8px 12px;border:1px solid #CBD5E1;border-radius:8px;font-size:13px;margin-bottom:14px;color:#1E293B;background:#fff}
.update-modal .btn-row{display:flex;gap:8px;justify-content:flex-end}
.time-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.time-preset{padding:5px 12px;border-radius:14px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #CBD5E1;background:#fff;color:#64748B;transition:all .12s}
.time-preset:hover,.time-preset.active{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.history-list{max-height:300px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid #E2E8F0;border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.history-item:hover{background:#F8FAFC;border-color:#CBD5E1}
.history-item .hi-title{font-weight:600;font-size:13px;color:#1E293B}
.history-item .hi-meta{font-size:11px;color:#94A3B8}
.history-item .hi-count{font-size:11px;font-weight:600;color:#3B82F6;background:#EEF2FF;padding:2px 8px;border-radius:10px}
.loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid #CBD5E1;border-top-color:#3B82F6;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.standalone-banner{background:#FEF3C7;color:#92400E;text-align:center;padding:6px 16px;font-size:12px;border-bottom:1px solid #FDE68A;display:none}
.standalone-banner code{background:#FDE68A;padding:1px 5px;border-radius:3px;font-size:11px}

.stats-row{max-width:1400px;margin:0 auto;padding:12px 32px 16px;display:flex;flex-direction:column;gap:8px}
.stats-row-total{display:flex;justify-content:center}
.stats-row-sections{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:768px){.stats-row-sections{grid-template-columns:repeat(2,1fr)}}
.stat-pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;cursor:pointer;transition:all .2s;border:2px solid transparent;font-size:13px;font-weight:600;user-select:none;min-width:0}
.stat-pill:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.pill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pill-label{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-count{font-size:14px;font-weight:700;margin-left:auto;flex-shrink:0;background:rgba(255,255,255,.5);padding:1px 8px;border-radius:10px}
.stat-pill.pill-total{background:#1E293B;color:#fff;font-weight:700;border-radius:24px;display:inline-flex}
.stat-pill.pill-total .pill-count{background:rgba(255,255,255,.2)}

.content{max-width:1400px;margin:0 auto;padding:0 32px 60px}
.section{background:#fff;border-radius:14px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden;border-top:4px solid #3B82F6}
.section.s0{border-top-color:#3B82F6}.section.s1{border-top-color:#EF4444}.section.s2{border-top-color:#10B981}
.section.s3{border-top-color:#8B5CF6}.section.s4{border-top-color:#06B6D4}.section.s5{border-top-color:#F59E0B}
.section.s6{border-top-color:#6366F1}.section.s7{border-top-color:#EC4899}.section.tier2{background:#FAFBFC}
.section-header{padding:16px 22px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-header h2{font-size:16px;font-weight:700;color:#1E293B}
.section-header .badge{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;background:#F1F5F9;color:#64748B;white-space:nowrap}
.section-desc{padding:4px 22px 10px;font-size:12px;color:#94A3B8}
.events-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 22px 18px}
@media(max-width:860px){.events-grid{grid-template-columns:1fr}.event-card{flex-direction:column}.event-card .event-img{width:100%!important;min-height:120px;max-height:180px}}
.event-card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;transition:all .2s;display:flex}
.event-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-1px);border-color:#CBD5E1}
.event-card .event-img{width:160px;min-height:140px;flex-shrink:0;position:relative;overflow:hidden}
.event-card .event-img img{width:100%;height:100%;object-fit:cover;display:block}
.event-card .event-img .img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.event-card .event-body{padding:12px 15px;flex:1;min-width:0;display:flex;flex-direction:column}
.event-card .event-meta{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.event-card .event-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.event-tag.date{background:#F1F5F9;color:#64748B}.event-tag.gov{background:#DCFCE7;color:#15803D}
.event-tag.auth{background:#DBEAFE;color:#1D4ED8}.event-tag.source{background:#FEF3C7;color:#A16207}
.event-tag.client{background:#FCE7F3;color:#BE185D}
.event-card .event-preview{font-size:13px;color:#334155;line-height:1.6;flex:1;overflow:visible;max-height:none}
.event-card .event-link{font-size:11px;margin-top:6px;color:#3B82F6;font-weight:500}
.analysis-body{padding:4px 22px 20px;font-size:13px;line-height:1.8;color:#334155}
.analysis-body h3{font-size:15px;font-weight:700;margin:14px 0 6px;color:#1E293B}
.analysis-body ul{padding-left:0;list-style:none}
.analysis-body li{padding:2px 0 2px 18px;position:relative}
.analysis-body li::before{content:"•";position:absolute;left:2px;color:#3B82F6;font-weight:bold}
.tier-divider{text-align:center;padding:16px 0 8px;margin:8px 0}
.tier-divider span{background:linear-gradient(135deg,#3B82F6,#6366F1);color:#fff;padding:8px 28px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(59,130,246,.25)}
.footer{text-align:center;padding:20px 32px 40px;color:#94A3B8;font-size:12px;max-width:1400px;margin:0 auto}
.macro-dashboard{background:#fff;border-radius:14px;margin-bottom:18px;padding:16px 22px 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-top:4px solid #1E293B}
.macro-title{font-size:15px;font-weight:700;color:#1E293B;margin-bottom:2px}
.macro-period{font-size:11px;font-weight:400;color:#94A3B8;margin-left:6px}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media(max-width:900px){.macro-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.macro-grid{grid-template-columns:1fr}}
.macro-card{background:#F8FAFC;border-radius:8px;padding:10px 8px 4px;border:1px solid #E2E8F0}
.macro-card-title{font-size:10.5px;font-weight:600;color:#475569;margin-bottom:4px;text-align:center;line-height:1.3;min-height:28px;display:flex;align-items:center;justify-content:center}
.macro-card{position:relative}
.macro-source{position:absolute;top:6px;right:8px;font-size:7.5px;color:#94A3B8;font-weight:500;background:#fff;padding:1px 5px;border-radius:3px;border:1px solid #E2E8F0;z-index:1;pointer-events:none}
.macro-latest{display:flex;justify-content:center;align-items:baseline;gap:4px;margin-top:2px;padding:3px 0}
.macro-latest-label{font-size:9px;color:#94A3B8;font-weight:500}
.macro-latest-val{font-size:15px;font-weight:700;color:#1E293B}
.macro-latest-unit{font-size:9px;color:#64748B;font-weight:500}
.macro-latest-date{font-size:9px;color:#94A3B8}
.macro-note{font-size:9px;color:#94A3B8;margin-top:1px}
.macro-card{cursor:pointer;transition:transform .15s,box-shadow .15s}
.macro-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.macro-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:moFade .2s}
.macro-modal-card{background:#fff;border-radius:16px;padding:24px 28px 18px;width:680px;max-width:94vw;max-height:90vh;overflow-y:auto;cursor:default;box-shadow:0 24px 80px rgba(0,0,0,.25);position:relative;animation:moZoom .25s}
.macro-modal-card .macro-card{border:none;padding:0;background:transparent;cursor:default}
.macro-modal-card .macro-card:hover{transform:none;box-shadow:none}
.macro-modal-card .macro-card-title{font-size:15px;min-height:auto;margin-bottom:10px}
.macro-modal-card .macro-legend,.macro-modal-card [style*=legend]{font-size:11px!important}
.macro-modal-close{position:absolute;top:10px;right:16px;font-size:26px;cursor:pointer;color:#94A3B8;background:none;border:none;line-height:1;z-index:10;padding:4px 8px;border-radius:6px}
.macro-modal-close:hover{color:#475569;background:#F1F5F9}
.macro-data-section{margin-top:14px;border-top:1px solid #E2E8F0;padding-top:10px}
.macro-data-toggle{background:#F8FAFC;border:1px solid #CBD5E1;padding:6px 16px;border-radius:6px;font-size:12px;color:#64748B;cursor:pointer;font-weight:500}
.macro-data-toggle:hover{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.macro-data-table-wrap{margin-top:10px;max-height:340px;overflow-y:auto;border:1px solid #E2E8F0;border-radius:8px}
.macro-data-table{width:100%;border-collapse:collapse;font-size:12px}
.macro-data-table th{background:#F8FAFC;padding:7px 12px;text-align:right;font-weight:600;color:#475569;border-bottom:2px solid #E2E8F0;position:sticky;top:0}
.macro-data-table th:first-child{text-align:left}
.macro-data-table td{padding:5px 12px;text-align:right;border-bottom:1px solid #F1F5F9;color:#334155;font-variant-numeric:tabular-nums}
.macro-data-table td:first-child{text-align:left;color:#64748B;font-weight:500}
.macro-data-table tbody tr:hover td{background:#EEF2FF}
.macro-na{color:#CBD5E1!important}
@keyframes moFade{from{opacity:0}to{opacity:1}}
@keyframes moZoom{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:768px){.header{padding:14px 16px}.header-left h1{font-size:16px}.stats-row{padding:10px 14px;gap:6px}.stat-pill{padding:8px 12px;font-size:12px}.pill-label{font-size:11px}.content{padding:0 12px 40px}.section-header{padding:12px 14px 0}.events-grid{grid-template-columns:1fr;padding:4px 14px 14px}}
</style>
</head>

window.EMBEDDED_BRIEFINGS = {"zh": {"topic": "巴拉圭简报", "time_span": "2026年11月15日 — 2026年11月22日", "time_label": "最近一周", "tiers": [{"name": "Part I: Key News & Developments", "description": "Macro economy, politics, social security, international relations, industry and key client movements in Paraguay"}, {"name": "Part II: Analysis & Recommendations", "description": "Enterprise impact assessment and China-specific strategic recommendations"}], "sections": [{"title": "一、宏观经济动态", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "巴拉圭央行将政策利率维持在5.50%，因经济增长降温，施赖纳权衡货币政策体制转变（2026-11-20）", "date": "2026-11-20", "source_url": "https://www.lanacion.com.py/negocios/2026/11/20/cpm-mantiene-posicion-neutral-de-la-tasa-de-politica-monetaria-en-550/", "source_name": "La Nación", "summary": "中央银行货币政策委员会11月20日将政策利率维持在5.50%，并称政策立场为中性。9月经济活动月度指数同比增长3.9%，主要受电力与水、制造业和服务业拉动，经济信心指数上升2.5%；累计增幅分别达到5.5%和4.3%。10月整体通胀率同比为1.7%，接近3.5%±2个百分点目标区间的下限，通胀预期仍锚定在3.5%。委员会指出，外部不确定性包括布伦特原油价格接近92美元、大宗商品价格以及美国利率上升的风险，而私营部门预测仍将2026年GDP增长率维持在4.5%。另外，新任巴拉圭央行行长豪尔赫·施赖纳表示，他已请求国际货币基金组织对通胀目标制与更侧重货币总量的框架进行比较，预计约六个月内作出决定；他称3.5%的目标“不容谈判”。", "image_url": "https://www.lanacion.com.py/resizer/v2/S2ECUEST2NEH3DASRYJRUAEZYU.jpeg?auth=5d384d2624069a0b9478cb4c92610ec0af2ef07268754e4837f30f58397a24c0&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "美元跃升至G. 6,400，乌埃诺、财政风险及惠誉的负面观察打击瓜拉尼（2026-11-20）", "date": "2026-11-20", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/negocios/2026/11/20/el-dolar-vuelve-a-elevarse-y-se-ubica-en-g-6400/", "source_name": "La Nación", "summary": "美元在11月20日星期五意外跳升至G. 6,400，买入价报G. 6,200，卖出价报G. 6,400——较前一交易日的G. 6,150/6,280高出100多点，较周初的G. 6,020/6,180高出约200点。巴拉圭央行官方牌价表将参考汇率定为每美元G. 6,407.06，而11月13日为G. 6,215.89，10月底为G. 5,944.76，三周内波动约7.8%。交易员将这一走势归因于进口需求、乌埃诺银行处置案及其带来的财政不确定性，以及惠誉决定将巴拉圭的BB+评级列入负面观察名单。央行曾在11月初进行2026年首次干预，此后一直未入市，任由参考汇率消化调整。", "image_url": "https://www.lanacion.com.py/resizer/v2/DIJTSV67S5EEJKYKNIK7MXO45I.jpg?auth=0da4169d2b5edad93b805bb246fba67213fb2f6277cd5fd4f944203d515f7537&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "商业团体警告乌埃诺丑闻正导致经济停滞，小企业营运资金短缺（2026-11-20）", "date": "2026-11-20", "source_url": "https://www.ultimahora.com/escandalo-de-ueno-causa-desaceleracion-en-la-economia-alertan-empresarios", "source_name": "Última Hora", "summary": "巴拉圭主要商业联合会，包括生产行会联盟、生产合作社联合会和农村协会，表示乌埃诺银行丑闻正在造成明显放缓，在一些行业甚至出现“瘫痪”。阿西姆科帕尔商人协会报告销售额下降30%至40%，并称该银行倒闭后有300至500名商户资金受到限制。商界领袖要求实行支出纪律和制定切合实际的2027年预算，而不是增税，并警告信心冲击正在传导至订单、库存和就业。政府已作出回应，通过约50家金融机构为中小微企业提供金融发展局流动资金信贷额度，并成立了一个由工业和贸易部、财政部和银行协会组成的联合工作组，负责11月和12月的工作。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/c777f7c/2147483647/strip/true/crop/1258x708+0+66/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fde%2F5a%2F33f0f7d442c29598e95c89964603%2Fempresarios-3.jpeg", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭央行发现乌埃诺银行6亿美元“合格”资产，存款担保覆盖180万储户（2026-11-15）", "date": "2026-11-15", "source_url": "https://www.lanacion.com.py/negocios_edicion_impresa/2026/11/15/ueno-bank-en-resolucion-usd-600-millones-de-activos-potables/", "source_name": "La Nación", "summary": "巴拉圭央行表示，初步审计已确定乌埃诺银行约有6亿美元的“可饮用”或健康资产，可用于覆盖养老金相关负债，最终资产负债表将在约十天内出炉。存款保障基金已向约180万储户支付了大约6.44亿美元，约占被覆盖储户的97%，并持有约16亿美元。乌埃诺银行的资产及相关存款将分批拍卖给其他银行，以避免形成“超级银行”。巴拉圭央行截至9月的数据显示，存款市场规模约为325亿美元：Continental银行以18.9%（61.5亿美元）领先，Itaú银行以13.6%紧随其后，前五大银行占66.2%；乌埃诺银行以28.4亿美元（8%）位居第六，但客户基础最大。社会保障协会在乌埃诺银行存放了超过5.16亿美元，并对养老金资金拥有法律优先权。", "image_url": "https://www.lanacion.com.py/resizer/v2/VH5BJXVGRFFYRAAWZMJ3TSYQ2Q.jpg?auth=8e3b79a89a7c44077deff5685fda729293e5574c004b0e419252e08eb0052be9&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}]}, {"title": "二、政治与政策变化", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "总检察长埃米利亚诺·罗隆在因乌埃诺调查而面临弹劾的前夕辞职（2026-11-17）", "date": "2026-11-17", "source_url": "https://www.lanacion.com.py/politica/2026/11/17/emiliano-rolon-renuncia-a-la-fiscalia-general-del-estado/", "source_name": "La Nación", "summary": "总检察长埃米利亚诺·罗隆·费尔南德斯于11月17日辞职，此前反对派和红党持不同政见派别的众议员以“履职不力”为由正式提交弹劾申诉。此前，红党全国共和联盟（ANR）的A、B议员团决定支持审判，据报道是奉奥拉西奥·卡特斯之命，使罗隆失去政治保护。批评者指控他处理乌埃诺银行调查不当，将针对前总统圣地亚哥·培尼亚的非法致富投诉搁置七个月，并拖延突击搜查和证据收集。罗隆前一天曾表示不会辞职。他任命副检察长阿尔巴·罗西奥·坎特罗·维拉为临时负责人；11月20日，他请求联合国法官和律师独立性问题特别报告员审查他所说的政治和司法迫害。", "image_url": "https://www.lanacion.com.py/resizer/v2/4TZ7CJ43DZEN5AGMI3YMV654LY.jpeg?auth=5ba0def9df84bd4bc42d6ee9a695188e84e60fe509d57feeb0662a5f38d1dcb1&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Alba Cantero 宣誓就任临时总检察长，将完成 2023-2028 年任期（2026-11-18）", "date": "2026-11-18", "source_url": "https://www.lanacion.com.py/politica/2026/11/18/juro-la-nueva-fiscal-general-del-estado-alba-cantero/", "source_name": "La Nación", "summary": "阿尔瓦·罗西奥·坎特罗·维拉于11月18日宣誓就任临时国家总检察长，接替前一天辞职的埃米利亚诺·罗隆，并将完成至2028年的宪法任期。坎特罗是一名资深刑事检察官，由罗隆依据《公共部组织法》（第1562/2000号法律）第51条指定，并在一个敏感阶段接手了乌埃诺银行案：八名高管被拘留，7000万美元和1.62万亿瓜拉尼的预防性查封已经实施，检察官正在寻求阿根廷、卢森堡和美国的合作。她的任命消除了制度不确定性的一个来源，但并未解决关于由谁监督调查的根本冲突，因为国会已经推进了对罗隆的弹劾程序。", "image_url": "https://www.lanacion.com.py/resizer/v2/XOHMMG6ROBGSDJUMQ3QRFSRZY4.jpeg?auth=91945940b540edcac79ed6dd920d963049c23d53bfe5526e82e2eb25a9092d8d&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "阿利亚纳承诺就乌埃诺事件说出“真相”，再削减1亿美元并更换总统护卫队指挥官（2026-11-16）", "date": "2026-11-16", "source_url": "https://www.lanacion.com.py/politica/2026/11/16/los-paraguayos-merecemos-saber-la-verdad-el-mensaje-de-alliana-en-su-segunda-semana-de-gestion/", "source_name": "La Nación", "summary": "在就任第二周之际发布的一份声明中，总统佩德罗·阿利亚纳表示，继巴拉圭央行、内阁和民事内阁改组之后，各公共机构还将进行进一步调整，并承诺对乌埃诺银行保持透明，同时宣称“巴拉圭人民有权了解真相”。他将所有法律上可用的行政部门资源交由检察官处置，并下令由卡洛斯·米格尔·佩雷斯·罗德里格斯上校接替何塞·大卫·达尤布上校，担任总统护卫团指挥官，圣地亚哥·培尼亚目前被软禁在该团。随后，他宣布在2027年预算中再削减约1亿美元支出，其中包括从“零饥饿”学校供餐计划中削减8000万美元，此外还重新分配4000亿瓜拉尼给卫生部门、1500亿瓜拉尼给公共工程以及720亿瓜拉尼给教育部门。", "image_url": "https://www.lanacion.com.py/resizer/v2/TBHJ3GJHKFDAFIRM3KGPOH466E.jpeg?auth=1f888a61c5cda5dbc4279f58f0fed497c8b7e9729ca255be31c12b23a0fcd028&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "参议院将2027年预算推迟至11月24日，距宪法截止日期仅剩十天（2026-11-18）", "date": "2026-11-18", "source_url": "https://www.ultimahora.com/senado-tratara-proyecto-de-pgn-2027-la-proxima-semana-a-dias-de-vencer-el-plazo", "source_name": "Última Hora", "summary": "参议院要到11月24日星期二才开始辩论2027年预算案，距离宪法规定的11月28日截止日期仅剩数天；若国会在该日期前未采取行动，该预算案将被视为自动批准。众议院已于11月12日对该法案给予半批准，批准了行政机构的版本以及第二份增编，净调整额约为2.76亿美元。预算总额为166.32万亿瓜拉尼，约合257.5亿美元，较2026年增长11.2%，预计赤字占GDP的3.9%，而财政责任规则要求为1.5%，经济增长预期为4.2%，通胀率为3.5%。参议员拉斐尔·菲利佐拉对众议院所做的修改提出质疑。如果参议院修改文本，则必须退回众议院，国会须在12月20日之前将最终版本送交行政机构。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/63ae09f/2147483647/strip/true/crop/4096x2304+0+226/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F01%2F70%2F9bdf152246199bb60b824c947bc8%2Fsenado.png", "is_gov_source": false, "is_authoritative": true}, {"title": "阿利亚纳确认妇女部、交通部、文化部和亚西雷塔双边实体再有四项任命（2026-11-21）", "date": "2026-11-21", "source_url": "https://www.lanacion.com.py/politica_edicion_impresa/2026/11/21/alliana-realiza-mas-cambios-en-su-gabinete-y-otras-instituciones/", "source_name": "La Nación", "summary": "阿利亚纳总统于11月21日签署法令，正式确定四项新任命，将机构改组扩展至妇女部、交通副部长办公室、国家文化秘书处以及亚西雷塔双边实体（EBY）理事会。此前，巴拉圭央行领导层、多名部长和民事内阁已被更换，他还警告称“没有任何职位是有保障的”。此次人事更迭意在显示与培尼亚政府决裂，并在乌埃诺银行倒闭后重建信心，但也可能削弱那些对乌埃诺资产追回和2027年预算执行至关重要的机构的制度记忆。商业团体对强调透明度的表态表示欢迎，同时敦促在营运资金支持和支出纪律方面加快行动。", "image_url": "https://www.lanacion.com.py/resizer/v2/7Q22AVZ3F5DGNMVHPLAMZ4SVMY.jpg?auth=7734ceeadd26e1d10192cf53874975c91a1c94115c63b5b6a455bb69d06a03c8&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}]}, {"title": "三、社会与安全形势", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "武装团伙在亚松森市中心绑架并缴械两名警察，加剧了人们对一起被挫败的大规模抢劫的担忧（2026-11-19）", "date": "2026-11-19", "source_url": "https://www.lanacion.com.py/pais/2026/11/19/investigan-rapto-y-posterior-robo-de-armas-a-agentes-policiales-en-asuncion/", "source_name": "La Nación", "summary": "11月19日黎明前，第三大都会警察局的两名警员在亚松森市中心的哥伦比亚共和国街与塔夸里街拐角处遭到伏击。五名头戴兜帽、身穿防弹背心并携带步枪的男子制伏了他们，夺走了他们的执勤枪支和无线电，并将他们捆绑后遗弃在卢克市西尔维奥·佩蒂罗西机场附近的一处林地；工人用角磨机将他们解救。绑架者讲西班牙语、瓜拉尼语和葡萄牙语，并使用了无线电设备。警方表示，他们认为该团伙正准备实施更大规模的行动，因警员出现而中止。11月21日，警方对卢克一处疑似安全屋发动突袭，查获信号干扰器、无线电、战术手套、弹匣以及带有国家缉毒局标志的臂章，进一步佐证了存在一个装备精良、冒充安全部队的犯罪团伙的说法。", "image_url": "https://www.lanacion.com.py/resizer/v2/T2CU7LZLRJGB3AJJLCXCVA4Y5M.jpeg?auth=af3dff7a13b05229256441b61f7351af192881a65bf171368f53b3956f0f8126&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "在弗朗哥总统城开展的缉毒突袭中发现六支枪、一个消音器、一架无人机和五台加密货币矿机（2026-11-19）", "date": "2026-11-19", "source_url": "https://www.lanacion.com.py/pais/2026/11/19/imputaron-a-dos-detenidos-tras-hallazgo-de-seis-armas-de-fuego-silenciador-y-droga/", "source_name": "La Nación", "summary": "缉毒检察官和警方于11月19日突击搜查了上巴拉那省弗朗哥总统城圣达米安街区的两处住宅，逮捕了38岁的马西亚尔·洛佩斯·菲格雷多和25岁的维克托·曼努埃尔·坎特罗·波蒂略。他们缴获了六支枪支——一支12号口径霰弹枪、一支序列号被抹去的英特拉泰克.22口径冲锋手枪、装有夜视瞄准镜和望远瞄准镜的步枪以及一支.32口径左轮手枪——外加一个消音器、弹药、一架无人机、迷彩服和五台正常运行的加密货币挖矿机。检察官怀疑该处所是一个持械抢劫团伙的安全屋。此次突袭表明，加密货币挖矿设备和军用风格装备已成为三国边境地区有组织犯罪后勤的一部分。", "image_url": "https://www.lanacion.com.py/resizer/v2/6VZQABMBRJCP3PIR64SR3SKS3M.jpg?auth=93e71fd19eb9619923f98f1838786afd941ea6f83ca23bb0eaec807734e2388e&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "社会保障局向9.1万名养老金领取者提前一天发放1.3亿美元的11月养老金和年度奖金（2026-11-19）", "date": "2026-11-19", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/negocios/2026/11/19/pago-a-jubilados-y-pensionados-del-ips-moviliza-usd-130-millones-a-la-economia/", "source_name": "La Nación", "summary": "社会保障局已提前一天向超过91,000名退休人员和养老金领取者发放了11月养老金和年度奖金（圣诞节奖金），该局称，这向经济注入了约1.3亿美元。约32,000名此前通过乌埃诺银行领取款项的受益人，已被自动重新分配至社会保障局指定的八家银行，无需强制亲自到场办理手续；这些银行开设了领取柜台，发放银行卡和个人识别码。社会保障局澄清称，养老金由劳动者和雇主缴费供资，奖金由投资收益供资，因此此次发放从未因乌埃诺银行处置而面临风险；在该处置中，该局对约5.16亿美元存款拥有法定优先权。", "image_url": "https://www.lanacion.com.py/resizer/v2/RAL5XGR3ONCB5HG62C7UBXTDSI.jpg?auth=4c79543a3012057d7782e42e077f7192ae26826ccee84398a9ba83d1350060dd&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}]}, {"title": "四、国际关系与外交动态", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "阿利亚纳接受卢拉的邀请，伊泰普电价12月31日截止日期临近（2026-11-19）", "date": "2026-11-19", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/politica_edicion_impresa/2026/11/19/alliana-tratara-anexo-c-con-lula-y-confirma-viaje-a-cumbre-de-mercosur/", "source_name": "La Nación", "summary": "外长鲁本·拉米雷斯·莱斯卡诺确认，阿利亚纳总统已接受巴西总统路易斯·伊纳西奥·卢拉·达席尔瓦的邀请，将在巴西利亚举行双边会晤，日期尚待确定。两国政府计划在12月31日现行协议到期前确定伊泰普电价，并在2027年期间处理1973年条约附件C的审查——这是在错过2024年、2025年和2026年期限后的又一次推迟。技术团队先由巴拉圭工业部长马科·里克尔梅和巴西矿业和能源部长亚历山大·西尔韦拉牵头，随后由两国外长和总统接手。2024至2026年现行电价为每千瓦月19.28美元，每年产生约12.5亿美元；巴西正推动将电价降至10至12美元，巴拉圭则倾向于逐步下调。分析人士警告，若不能达成政治协议，严格成本电价可能使巴拉圭每年损失约6.5亿美元的特别资金。阿利亚纳还任命乌戈·萨拉特为伊泰普临时主任，并更新了理事会。", "image_url": "https://www.lanacion.com.py/resizer/v2/IKAVHXGUCBBNDIBHBE6UIV3EZI.jpg?auth=06556d2f560bb9b6447b5dba9c45a3f1067a82a355f0438f4942137b0a317908&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "阿利亚纳将于12月4日出席其首次南方共同市场峰会，台湾之行被搁置（2026-11-18）", "date": "2026-11-18", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/politica/2026/11/18/el-presidente-pedro-alliana-evalua-una-agenda-internacional/", "source_name": "La Nación", "summary": "外交部长鲁本·拉米雷斯·莱斯卡诺11月18日表示，阿利亚纳总统有一系列国际邀请，将逐一权衡；他确认总统将于12月4日前往蒙得维的亚出席第69届南方共同市场国家元首峰会——这是他上任以来首次出席，且为当日往返。原定于11月24日的对台湾正式访问已被推迟，尚未确定新日期，政府表示总统将留在巴拉圭处理乌埃诺危机；巴拉圭与台北保持外交关系。卡塔尔埃米尔的访问也在考虑之中。", "image_url": "https://www.lanacion.com.py/resizer/v2/IRO2E7X2IVEMZOBCH5JWSMIWFM.jpeg?auth=fb2fd3c8a07c2fe6bb8542c021c309f646aa20af9c7c2b82ccfa623908121ef7&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭-巴西博览会闭幕，尽管存在政治危机，商业意向仍达6.4亿美元（2026-11-15）", "date": "2026-11-15", "source_url": "https://www.lanacion.com.py/negocios/2026/11/15/expo-paraguay-brasil-supero-expectativas-reunio-a-mas-de-mil-empresas-y-proyecta-negocios-por-usd-640-millones/", "source_name": "La Nación", "summary": "第17届巴拉圭-巴西博览会——11月11日至13日在埃尔南达里亚斯举行的巴拉圭商业周的核心活动——闭幕时预计成交额达6.4亿美元，高于6亿美元的目标，并比上一届的4.21亿美元高出52%。组织者巴拉圭-巴西商会报告称，共举行了超过3100场商务洽谈，来自7个国家的1182家企业参展，主要参会者达1283人，观众达15637人次（增长74%），展商达362家。巴西占国际参与度的69.8%，巴拉圭以29.1%位居第二，来自阿根廷、乌拉圭、西班牙、美国和秘鲁的代表团规模较小。建筑、食品和饮料、金属加工、技术、专业服务、物流、能源和农业综合企业是主要行业。组织者强调，巴西对投资者通行证、第60/90号法律激励措施和出口加工制度表现出浓厚兴趣，并表示计划在2027年再次举办该活动。", "image_url": "https://www.lanacion.com.py/resizer/v2/I5NGA3R2ERAG5JJMESZ5R6TFLE.jpeg?auth=e1f73d8d8fa00e074ef4794222525e59671b721ef512bd1870991b5048555ccc&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}]}, {"title": "五、行业专题：通讯、运营商、数字能源与AI", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "1月至10月电力需求增长16%，伊泰普供应系统92%的电力（2026-11-16）", "date": "2026-11-16", "source_url": "https://www.hoy.com.py/nacionales/2026/11/16/el-consumo-electrico-en-paraguay-subio-un-16-entre-enero-y-octubre", "source_name": "Diario HOY / ANDE", "summary": "国家电力管理局（ANDE）报告称，1月至10月累计电力需求达到27,407.1吉瓦时，比2025年同期增长16%。仅10月的需求为2,712,712兆瓦时，同比增长7.2%，增速低于4月35.4%的激增；4月激增部分受高耗电加密货币挖矿客户推动。在十个月里，伊泰普水电站向国家电力管理局供电24,121吉瓦时，增长16.23%，并覆盖了10月需求的92.3%；亚西雷塔水电站贡献了6.5%，供电量增长43%；阿卡拉伊水电站贡献了1.2%。位于查科的埃斯佩兰萨港太阳能电站注入约33兆瓦时，这是太阳能首次为互联系统做出贡献。电力行业专业学会（IPPSE）警告称，2028-2030年将是关键时期：需求每年增长超过500兆瓦，到2030年代可能达到每年800至1000兆瓦；巴拉圭在伊泰普的配额可能到2030年被全部消纳；除非落实可靠装机容量、区域电力进口或20年规划，否则2031年起可能出现缺口。", "image_url": "https://www.lanacion.com.py/resizer/v2/PSBVOY4NVNG43DXWQVSSSL4MEE.jpg?auth=fc7ad85e2ec53d806f24fc1f536eb46433120dd5f8e6da251b18873ddc83f9b5&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "巴拉圭首次主办伊比利亚美洲人工智能大会 IBERAMIA 2026（2026-11-18）", "date": "2026-11-18", "source_url": "https://www.pol.una.py/2026/la-fp-una-fue-sede-de-los-workshops-de-iberamia-2026-encuentro-internacional-de-inteligencia-artificial/", "source_name": "FP-UNA", "summary": "亚松森国立大学理工学院（FP-UNA）于11月17日在其圣洛伦索校区承办了第19届伊比利亚美洲人工智能会议（IBERAMIA 2026）的研讨会和辅导活动，当晚在科穆内拉大学举行开幕式。主要全体会议和技术分会于11月18日至20日在天主教大学圣利夫拉达校区的科技学院举行。这是巴拉圭首次主办该会议，会议由亚松森国立大学和天主教大学组织，并得到科穆内拉大学和巴拉圭人工智能学会的支持；录用论文发表在施普林格《人工智能讲义》上。本次会议使巴拉圭研究人员与伊比利亚美洲团队在机器学习、知识表示、自然语言处理和应用人工智能等领域建立联系，正值政府试图通过一项与台湾合作的主权数据中心项目以及一项人工智能法案，从人工智能消费者转变为开发者之际；该法案已于2025年10月获参议院批准，但众议院尚未通过。", "image_url": "https://www.pol.una.py/wp-content/uploads/IMG_0075-scaled.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "政府通报农村学校已安装800套星链设备，另有400套到位（2026-11-21）", "date": "2026-11-21", "source_url": "http://tw.tokenpost.com/news/blockchain/74786", "source_name": "TokenPost / MITIC", "summary": "政府表示，截至11月16日，农村学校已安装800套星链设备，为1600套目标的一半，最新一处连接位于圣佩德罗省北部亚泰蒂的圣卢西亚。信息与通信技术部表示，另有400套设备于11月20日运抵，将使该项目覆盖计划中1600个学校连接点中的1200个。该项目由信息与通信技术部、国有电信公司科帕科、国家电信委员会和教育部共同实施，旨在让偏远地区学生和教师能够访问教育平台和数字教材；政府估计超过5万名师生将受益。司法部正组织在押人员制造天线支架。埃隆·马斯克于11月21日发帖称“星链助力教育”，扩大了该项目的影响。在乌埃诺危机背景下，这些数字是政府数字议程中难得的利好消息。", "image_url": "https://www.lanacion.com.py/resizer/v2/CSM3GWJXURGYJPHK6XLEC4J7MA.jpg?auth=e67ad4b19436cf40c552a94a912f4ba7a787ab37df800b3ec7a082ff243a0cfc&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}]}, {"title": "六、主要客户动向", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "Tigo与中小微企业副部长办公室合作，为小企业提供数字工具和电子商务（2026-11-20）", "date": "2026-11-20", "source_url": "https://revistafoco.com.py/2026/11/20/mipymes-suman-aliados-para-vender-por-internet-e-impulsar-el-diseno/", "source_name": "Revista FOCO", "client_tag": "Tigo", "summary": "在巴拉圭商业周期间，中小微企业副部长署与巴拉圭Tigo公司以及巴拉圭设计与创新商会签署了合作协议，以使小企业能够获得数字工具、电子商务和新市场准入。副部长古斯塔沃·希门尼斯表示，网络连接是在线商务的基本条件，而且正在与巴拉圭电子商务商会共同准备一揽子数字解决方案。该联盟将利用Tigo的通信网络，使小公司不仅能够投放广告，还能完成销售并进入国外市场。对Tigo而言，该协议加深了其在中小企业细分市场的地位，而当前乌埃诺危机正在挤压营运资金并推动商户转向线上。这还与Tigo的网络投资及其5G义务相辅相成：根据2026年8月颁发的牌照，该运营商必须在2027年2月前开通其首个5G基站，并在四年内开通至少100个站点。", "image_url": "https://www.lanacion.com.py/resizer/v2/BQSNZNE6TVGTBHOXOPULFTCO6I.jpg?auth=b1715f59f1af3a13b18197c6178567d55d9713a0f69348e59f63c31017267b76&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Personal旗下Flow平台在巴拉圭第25频道播出玛丽亚·贝塞拉演唱会（2026-11-15）", "date": "2026-11-15", "source_url": "https://eldoce.tv/show/2026/11/12/maria-becerra-llega-a-flow-con-su-quimera-tour-360-cuando-y-donde-ver-el-show-en-vivo/", "source_name": "El Doce / Telecom Argentina", "client_tag": "Personal", "summary": "阿根廷电信旗下“个人”品牌的付费电视和流媒体平台“弗洛”于11月15日（星期日）21:00在布宜诺斯艾利斯的M竞技场现场直播了玛丽亚·贝塞拉的《奇美拉》巡演360°。该演出向阿根廷（605频道）、乌拉圭（119频道）和巴拉圭（25频道）的“弗洛”客户提供，并仍可按需点播回看。这一活动虽然规模不大，却是“个人”品牌跨境内容战略的一个有用信号：该运营商利用阿根廷制作的内容实现其在巴拉圭付费电视和宽带服务的差异化，同时为5G上线做准备。“个人”品牌通过核心股份有限公司持有2026年8月获授的3.7-3.8 GHz频段100 MHz频谱，必须在2027年2月之前启用其首个5G基站，并在四年内建成至少100个站点。阿根廷电信报告2026年前9个月营收为17.78亿美元，增长18%，调整后息税折旧摊销前利润为6.42亿美元。", "image_url": "https://eldoce.tv/resizer/v2/R62KMDRUYBHADAI2PEWDFZIMQE.png?auth=ee8bd277bd8a89eb57e624ce8a605f019b75c2a75e2afcd79aa71a714cc8353f&width=1023", "is_gov_source": false, "is_authoritative": true}]}, {"title": "七、对企业经营的综合影响分析", "tier": 2, "impact_analysis": "🔴 巴拉圭已从流动性冲击演变为一场缓慢发酵的信心与治理危机。乌埃诺银行的处置情况好于此前担忧——已向180万储户支付约6.44亿美元，识别出6亿美元健康资产，存款保障基金约为16亿美元——但二阶效应现已显现。瓜拉尼汇率从10月底的5,945瓜拉尼兑1美元，到11月13日的6,216，再到11月20日的6,407，三周内贬值7.8%，推高进口成本、美元债务偿付成本和定价不确定性。巴拉圭央行将政策利率维持在5.50%，通胀率保持在1.7%，但其新任行长正在公开审视货币政策框架，即便3.5%的目标得到重申，也增加了中期不确定性。\n\n🟡 财政与政治日程是近期的主要风险。2027年预算为166.3万亿瓜拉尼（约257.5亿美元），财政赤字占国内生产总值的3.9%，而财政规则为1.5%；参议院要到11月24日才辩论该预算，距宪法规定的最后期限仅四天；任何修正案都会将其退回众议院，使时间窗口压缩至12月20日。 惠誉将BB+评级列入负面观察名单，穆迪发出治理警告，这意味着原定于2027年初重返国际债券市场的计划将面临更高成本。总检察长罗隆被免职、临时检察官获任命，并未解决由谁主导乌埃诺案调查的问题，且机构层面可能进一步出现人事更迭。\n\n🟢 实体经济仍在增长——9月月度经济活动指数（IMAEP）增长3.9%，出口创纪录，电力需求增长16%——乌埃诺案迄今仍属个案，而非系统性问题。但商业调查显示，受影响商户销售额下降30%至40%，中小微企业营运资金短缺，而政府的发展金融局（AFD）信贷额度以及工商部—财政部—巴拉圭银行协会工作组只能起到部分缓解作用。对企业而言，优先事项包括：将交易对手从存在乌埃诺敞口的机构中分散出去、积极开展外汇对冲、收紧对当地经销商的信用条款，并密切监测11月24日至28日的预算窗口和12月31日的伊泰普电价截止期限——这些因素可能使能源成本和财政收入出现数亿美元的变动。", "user_notes": ""}, {"title": "八、对中资企业的专项影响与建议", "tier": 2, "impact_analysis": "🟡 银行与资金管理：将存款和支付流分散到至少两家顶级银行（Continental银行、Itaú银行、Sudameris银行、GNB银行），避免将运营现金集中于尚未解决乌埃诺风险敞口的机构。在存款担保赔付和资产拍卖持续期间，每周对账应收和应付款项，并要求当地交易对手确认其账户和信贷额度未受影响。巴拉圭央行的参考汇率（11月20日为 G. 6,407.06）应作为合同基准；在2027年预算中建立5%至8%的外汇区间，并考虑对以美元计价的进口和债务进行远期套保。\n🔴 财政与监管观察：11月24日至28日的2027年预算辩论以及12月20日的截止日期是税收、支出和采购变化的关键窗口。政府已削减约1亿美元的可自由支配支出和“零饥饿”计划的8000万美元，企业团体正在施压要求进一步收紧财政纪律；任何增税都将打击正规部门的利润率。中国企业应梳理自身对公共部门合同和付款周期的敞口，并避免采用依赖于1.5%财政规则得到遵守的定价假设。 惠誉的负面观察还提高了本地发行的担保和履约保函的成本。\n\n🟢 能源与数字机遇：电力需求每年增长16%，伊泰普供应系统92%以上的电力，政府优先发展人工智能数据中心而非加密货币挖矿，提供15年期合同，价格为48.91-56.39美元/兆瓦时，目前有6,300兆瓦的待处理申请排队。这对中国设备、工程总承包和冷却供应商来说是真正的机会，但阿拉伊科/克鲁索和伊瓜苏数字合同在政治上存在争议，新人工智能类别的电价将加密货币排除在外，12月31日的伊泰普截止日期可能改变整个成本基础。与当地开发商合作，在投入资本之前获得承购协议和并网承诺，并预计电信和数据中心领域对中国技术的审查将更加严格。\n\n🟡 安全与运营：亚松森市中心两名警察遭绑架，以及上巴拉那查获军用装备和加密矿机，表明有组织犯罪在三国边境地区十分活跃。审查在卡宁德尤、阿曼拜和边境走廊开展运营的路线风险、护送方案、保险和员工跟踪。 在电信领域，Tigo和Personal须在2027年2月前推出5G，Claro已经投入运营，因此企业连接和物联网产品到2027年将持续改善；应趁运营商争夺企业账户之际，立即就多年期合同展开谈判。", "user_notes": ""}]}, "en": {"topic": "Paraguay Briefing", "time_span": "November 15 – November 22, 2026", "time_label": "Last week", "tiers": [{"name": "Part I: Key News & Developments", "description": "Macro economy, politics, social security, international relations, industry and key client movements in Paraguay"}, {"name": "Part II: Analysis & Recommendations", "description": "Enterprise impact assessment and China-specific strategic recommendations"}], "sections": [{"title": "I. Macroeconomic Developments", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "BCP holds the policy rate at 5.50% as growth cools and Schreiner weighs a monetary-regime shift (2026-11-20)", "date": "2026-11-20", "source_url": "https://www.lanacion.com.py/negocios/2026/11/20/cpm-mantiene-posicion-neutral-de-la-tasa-de-politica-monetaria-en-550/", "source_name": "La Nación", "summary": "The Central Bank's Monetary Policy Committee kept the policy rate at 5.50% on 20 November, describing the stance as neutral. The IMAEP activity index rose 3.9% year-on-year in September, led by electricity and water, manufacturing and services, while the ECN confidence indicator gained 2.5%; cumulative growth reached 5.5% and 4.3% respectively. Headline inflation was 1.7% year-on-year in October, near the lower bound of the 3.5% ± 2pp target range, and expectations remain anchored at 3.5%. The committee flagged external uncertainty from Brent crude near USD 92, commodity prices and the risk of higher US rates, while private forecasts keep 2026 GDP growth at 4.5%. Separately, new BCP president Jorge Schreiner said he has asked the IMF to compare inflation targeting with a framework giving more weight to monetary aggregates, with a decision expected in about six months; he called the 3.5% target 'non-negotiable'.", "image_url": "https://www.lanacion.com.py/resizer/v2/S2ECUEST2NEH3DASRYJRUAEZYU.jpeg?auth=5d384d2624069a0b9478cb4c92610ec0af2ef07268754e4837f30f58397a24c0&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "The dollar jumps to G. 6,400 as Ueno, fiscal risk and Fitch's negative watch hit the guaraní (2026-11-20)", "date": "2026-11-20", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/negocios/2026/11/20/el-dolar-vuelve-a-elevarse-y-se-ubica-en-g-6400/", "source_name": "La Nación", "summary": "The dollar jumped unexpectedly to G. 6,400 on Friday 20 November, quoted at G. 6,200 bid and G. 6,400 ask — more than 100 points above the previous session's G. 6,150/6,280 and roughly 200 points above the G. 6,020/6,180 at the start of the week. The BCP's official planilla fixed the reference rate at G. 6,407.06 per dollar, against G. 6,215.89 on 13 November and G. 5,944.76 at end-October, a swing of about 7.8% in three weeks. Traders attributed the move to import demand, the Ueno Bank resolution and the fiscal uncertainty around it, and Fitch's decision to place Paraguay's BB+ rating on negative watch. The central bank, which intervened for the first time in 2026 in early November, has stayed out of the market since, leaving the reference rate to absorb the adjustment.", "image_url": "https://www.lanacion.com.py/resizer/v2/DIJTSV67S5EEJKYKNIK7MXO45I.jpg?auth=0da4169d2b5edad93b805bb246fba67213fb2f6277cd5fd4f944203d515f7537&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Business groups warn the Ueno scandal is stalling the economy as small firms run short of working capital (2026-11-20)", "date": "2026-11-20", "source_url": "https://www.ultimahora.com/escandalo-de-ueno-causa-desaceleracion-en-la-economia-alertan-empresarios", "source_name": "Última Hora", "summary": "Paraguay's main business federations, including the UGP, Fecoprod and the rural association ARP, said the Ueno Bank scandal is causing a visible slowdown and, in some sectors, 'paralysis'. The merchants' association Asimcopar reported sales falls of 30-40% and said 300-500 traders have funds restricted after the bank's collapse. Business leaders demanded spending discipline and a realistic 2027 budget rather than tax increases, warning that the confidence shock is now feeding through to orders, inventories and employment. The government has responded with AFD working-capital lines for MSMEs through about 50 financial institutions and a joint MIC-Treasury-Asoban working group for November and December.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/c777f7c/2147483647/strip/true/crop/1258x708+0+66/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fde%2F5a%2F33f0f7d442c29598e95c89964603%2Fempresarios-3.jpeg", "is_gov_source": false, "is_authoritative": true}, {"title": "BCP finds USD 600m of 'potable' Ueno assets as the deposit guarantee reaches 1.8m savers (2026-11-15)", "date": "2026-11-15", "source_url": "https://www.lanacion.com.py/negocios_edicion_impresa/2026/11/15/ueno-bank-en-resolucion-usd-600-millones-de-activos-potables/", "source_name": "La Nación", "summary": "The BCP said preliminary audits had identified about USD 600 million of 'potable' or healthy assets at Ueno Bank that could cover pension-related liabilities, with a definitive balance sheet due within about ten days. The Deposit Guarantee Fund has already paid roughly USD 644 million to about 1.8 million depositors, around 97% of those covered, and holds about USD 1.6 billion. Ueno's assets and associated deposits are to be auctioned in lots to other banks to avoid creating a 'megabank'. BCP data to September show the deposit market at about USD 32.5 billion: Banco Continental leads with 18.9% (USD 6.15 billion), Itaú follows with 13.6%, and the top five hold 66.2%; Ueno was sixth with USD 2.84 billion (8%) but had the largest client base. The IPS had more than USD 516 million parked at Ueno and has legal priority over pension money.", "image_url": "https://www.lanacion.com.py/resizer/v2/VH5BJXVGRFFYRAAWZMJ3TSYQ2Q.jpg?auth=8e3b79a89a7c44077deff5685fda729293e5574c004b0e419252e08eb0052be9&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}]}, {"title": "II. Political & Policy Developments", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "Fiscal General Emiliano Rolón resigns on the eve of impeachment over the Ueno investigation (2026-11-17)", "date": "2026-11-17", "source_url": "https://www.lanacion.com.py/politica/2026/11/17/emiliano-rolon-renuncia-a-la-fiscalia-general-del-estado/", "source_name": "La Nación", "summary": "Fiscal General Emiliano Rolón Fernández resigned on 17 November as deputies from the opposition and dissident Colorado factions formally filed an impeachment complaint for 'poor performance'. The move followed a decision by the Colorado ANR's A and B benches, reportedly on a line from Horacio Cartes, to support the trial, leaving Rolón without political cover. Critics accused him of mishandling the Ueno Bank investigation, holding for seven months a complaint of illicit enrichment against former president Santiago Peña, and delaying raids and evidence-gathering. Rolón had said the previous day that he would not resign. He appointed deputy prosecutor Alba Rocío Cantero Vera as interim head; on 20 November he asked the UN Special Rapporteur on the independence of judges and lawyers to examine what he called political and judicial persecution.", "image_url": "https://www.lanacion.com.py/resizer/v2/4TZ7CJ43DZEN5AGMI3YMV654LY.jpeg?auth=5ba0def9df84bd4bc42d6ee9a695188e84e60fe509d57feeb0662a5f38d1dcb1&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Alba Cantero is sworn in as interim Fiscal General and will serve out the 2023-2028 term (2026-11-18)", "date": "2026-11-18", "source_url": "https://www.lanacion.com.py/politica/2026/11/18/juro-la-nueva-fiscal-general-del-estado-alba-cantero/", "source_name": "La Nación", "summary": "Alba Rocío Cantero Vera was sworn in on 18 November as interim Fiscal General del Estado, a day after Emiliano Rolón's resignation, and will complete the constitutional term running to 2028. Cantero, a senior criminal prosecutor, was designated by Rolón under article 51 of the Organic Law of the Public Ministry (1562/2000) and takes over the Ueno Bank case at a sensitive stage: eight executives are detained, preventive embargoes of USD 70 million and G. 1.62 trillion are in place, and prosecutors are seeking cooperation from Argentina, Luxembourg and the United States. Her appointment removes one source of institutional uncertainty but does not settle the underlying conflict over who supervises the investigation, since Congress had already advanced the impeachment process against Rolón.", "image_url": "https://www.lanacion.com.py/resizer/v2/XOHMMG6ROBGSDJUMQ3QRFSRZY4.jpeg?auth=91945940b540edcac79ed6dd920d963049c23d53bfe5526e82e2eb25a9092d8d&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "Alliana promises 'the truth' on Ueno, cuts another USD 100m and replaces the presidential escort commander (2026-11-16)", "date": "2026-11-16", "source_url": "https://www.lanacion.com.py/politica/2026/11/16/los-paraguayos-merecemos-saber-la-verdad-el-mensaje-de-alliana-en-su-segunda-semana-de-gestion/", "source_name": "La Nación", "summary": "In a message marking his second week in office, President Pedro Alliana said further changes would be made across public institutions after the BCP, cabinet and Civil Cabinet reshuffles, promised transparency on Ueno Bank and declared that 'Paraguayans deserve to know the truth'. He placed all Executive resources legally available at the disposal of prosecutors and ordered the replacement of Colonel José David Dayub as commander of the Presidential Escort Regiment, where Santiago Peña is under house arrest, with Colonel Carlos Miguel Pérez Rodríguez. He then announced about USD 100 million of additional spending cuts in the 2027 budget, including USD 80 million from the Hambre Cero school-meals programme, plus reallocations of G. 400 billion to health, G. 150 billion to public works and G. 72 billion to education.", "image_url": "https://www.lanacion.com.py/resizer/v2/TBHJ3GJHKFDAFIRM3KGPOH466E.jpeg?auth=1f888a61c5cda5dbc4279f58f0fed497c8b7e9729ca255be31c12b23a0fcd028&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Senate delays the 2027 budget to 24 November, ten days before the constitutional deadline (2026-11-18)", "date": "2026-11-18", "source_url": "https://www.ultimahora.com/senado-tratara-proyecto-de-pgn-2027-la-proxima-semana-a-dias-de-vencer-el-plazo", "source_name": "Última Hora", "summary": "The Senate will not begin debating the 2027 budget until Tuesday 24 November, leaving only days before the constitutional deadline of 28 November, when the project is deemed sanctioned if Congress has not acted. The Chamber of Deputies gave the bill a half-sanction on 12 November, approving the Executive's version plus a second addendum with a net adjustment of about USD 276 million. The budget totals G. 166.32 trillion, about USD 25.75 billion, an 11.2% increase over 2026, with a projected deficit of 3.9% of GDP against the 1.5% fiscal-responsibility rule, growth of 4.2% and inflation of 3.5%. Senator Rafael Filizzola questioned the changes made by Deputies. If the Senate amends the text it must return to the lower house, and Congress has until 20 December to send the final version to the Executive.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/63ae09f/2147483647/strip/true/crop/4096x2304+0+226/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F01%2F70%2F9bdf152246199bb60b824c947bc8%2Fsenado.png", "is_gov_source": false, "is_authoritative": true}, {"title": "Alliana confirms four more appointments at the Women's Ministry, Transport, Culture and EBY (2026-11-21)", "date": "2026-11-21", "source_url": "https://www.lanacion.com.py/politica_edicion_impresa/2026/11/21/alliana-realiza-mas-cambios-en-su-gabinete-y-otras-instituciones/", "source_name": "La Nación", "summary": "President Alliana signed decrees formalising four new appointments on 21 November, extending the institutional reshuffle into the Women's Ministry, the vice-ministry of Transport, the National Culture Secretariat and the council of the binational Yacyretá entity (EBY). The changes follow the earlier replacement of the BCP leadership, several ministers and the Civil Cabinet, and his warning that 'no job is guaranteed'. The turnover is intended to signal a break with the Peña administration and to rebuild confidence after the Ueno Bank collapse, but it also risks weakening institutional memory in agencies that are central to the Ueno asset recovery and to the 2027 budget execution. Business groups have welcomed the transparency rhetoric while pressing for speed on working-capital support and spending discipline.", "image_url": "https://www.lanacion.com.py/resizer/v2/7Q22AVZ3F5DGNMVHPLAMZ4SVMY.jpg?auth=7734ceeadd26e1d10192cf53874975c91a1c94115c63b5b6a455bb69d06a03c8&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}]}, {"title": "III. Social & Security Landscape", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "Armed gang kidnaps and disarms two policemen in central Asunción, fuelling fears of a foiled mass robbery (2026-11-19)", "date": "2026-11-19", "source_url": "https://www.lanacion.com.py/pais/2026/11/19/investigan-rapto-y-posterior-robo-de-armas-a-agentes-policiales-en-asuncion/", "source_name": "La Nación", "summary": "Two officers of the Third Metropolitan Police Station were ambushed before dawn on 19 November at the corner of República de Colombia and Tacuary in central Asunción. Five hooded men wearing bullet-proof vests and carrying rifles overpowered them, stripped them of their service weapons and radios, and left them tied up in a wooded area near Silvio Pettirossi airport in Luque; workers freed them with a grinder. The captors spoke Spanish, Guaraní and Portuguese and used radio equipment. Police said they believe the gang was preparing a larger operation that was aborted by the officers' presence. A raid on a suspected safe house in Luque on 21 November seized signal jammers, radios, tactical gloves, magazines and patches bearing the SENAD logo, reinforcing the theory of a well-equipped criminal cell posing as security forces.", "image_url": "https://www.lanacion.com.py/resizer/v2/T2CU7LZLRJGB3AJJLCXCVA4Y5M.jpeg?auth=af3dff7a13b05229256441b61f7351af192881a65bf171368f53b3956f0f8126&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Anti-drug raid in Presidente Franco finds six guns, a silencer, a drone and five crypto-mining rigs (2026-11-19)", "date": "2026-11-19", "source_url": "https://www.lanacion.com.py/pais/2026/11/19/imputaron-a-dos-detenidos-tras-hallazgo-de-seis-armas-de-fuego-silenciador-y-droga/", "source_name": "La Nación", "summary": "Anti-narcotics prosecutors and police raided two homes in the San Damián neighbourhood of Presidente Franco, Alto Paraná, on 19 November, arresting Marcial López Figueredo, 38, and Víctor Manuel Cantero Portillo, 25. They seized six firearms — a 12-gauge shotgun, an Intratec .22 submachine pistol with an erased serial number, rifles fitted with night and telescopic sights and a .32 revolver — plus a silencer, ammunition, a drone, camouflage uniforms and five working crypto-mining machines. Prosecutors suspect the property was a safe house for an armed robbery gang. The raid shows how crypto-mining equipment and military-style gear have become part of the logistics of organised crime in the tri-border area.", "image_url": "https://www.lanacion.com.py/resizer/v2/6VZQABMBRJCP3PIR64SR3SKS3M.jpg?auth=93e71fd19eb9619923f98f1838786afd941ea6f83ca23bb0eaec807734e2388e&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "IPS pays 91,000 pensioners USD 130m in November pensions and bonus a day early (2026-11-19)", "date": "2026-11-19", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/negocios/2026/11/19/pago-a-jubilados-y-pensionados-del-ips-moviliza-usd-130-millones-a-la-economia/", "source_name": "La Nación", "summary": "The Instituto de Previsión Social paid November pensions and the annual bonus, the aguinaldo, to more than 91,000 retirees and pensioners one day ahead of the scheduled date, injecting about USD 130 million into the economy, the institute said. Around 32,000 beneficiaries who used to be paid through Ueno Bank were reassigned automatically to eight banks designated by the IPS, with no compulsory in-person procedure; the banks opened collection counters to hand out cards and PINs. The IPS clarified that pensions are funded by worker and employer contributions and the bonus by investment income, so the payout was never at risk from the Ueno resolution, in which the institute has legal priority over roughly USD 516 million of deposits.", "image_url": "https://www.lanacion.com.py/resizer/v2/RAL5XGR3ONCB5HG62C7UBXTDSI.jpg?auth=4c79543a3012057d7782e42e077f7192ae26826ccee84398a9ba83d1350060dd&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}]}, {"title": "IV. International Relations & Diplomacy", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "Alliana accepts Lula's invitation as the Itaipú tariff deadline of 31 December approaches (2026-11-19)", "date": "2026-11-19", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/politica_edicion_impresa/2026/11/19/alliana-tratara-anexo-c-con-lula-y-confirma-viaje-a-cumbre-de-mercosur/", "source_name": "La Nación", "summary": "Foreign Minister Rubén Ramírez Lezcano confirmed that President Alliana has accepted an invitation from Brazil's Luiz Inácio Lula da Silva for a bilateral meeting in Brasília, with the date still to be fixed. The two governments aim to set the Itaipú tariff before 31 December, when the current agreement expires, and to address the review of Annex C of the 1973 treaty during 2027 — a further postponement after missed 2024, 2025 and 2026 deadlines. Technical teams are led by Industry Minister Marco Riquelme for Paraguay and Mines and Energy Minister Alexandre Silveira for Brazil, before the foreign ministers and presidents take over. The current tariff is USD 19.28 per kW-month for 2024-2026, generating about USD 1.25 billion a year; Brazil is pressing for USD 10-12, while Paraguay favours a gradual reduction. Analysts warn that without a political deal the strict-cost tariff could cost Paraguay about USD 650 million a year in extraordinary funds. Alliana also named Hugo Zárate as interim director of Itaipú and renewed the council.", "image_url": "https://www.lanacion.com.py/resizer/v2/IKAVHXGUCBBNDIBHBE6UIV3EZI.jpg?auth=06556d2f560bb9b6447b5dba9c45a3f1067a82a355f0438f4942137b0a317908&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "Alliana to attend his first Mercosur summit on 4 December as the Taiwan trip is shelved (2026-11-18)", "date": "2026-11-18", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/politica/2026/11/18/el-presidente-pedro-alliana-evalua-una-agenda-internacional/", "source_name": "La Nación", "summary": "Foreign Minister Rubén Ramírez Lezcano said on 18 November that President Alliana has a series of international invitations he will weigh one by one, confirming that the president will travel to Montevideo on 4 December for the 69th Mercosur summit of heads of state — his first since taking office, and a same-day round trip. A planned official visit to Taiwan, originally set for 24 November, was postponed with no new date, with the government saying the president will stay in Paraguay to manage the Ueno crisis; Paraguay keeps its diplomatic ties with Taipei. A visit by the Emir of Qatar is also under consideration.", "image_url": "https://www.lanacion.com.py/resizer/v2/IRO2E7X2IVEMZOBCH5JWSMIWFM.jpeg?auth=fb2fd3c8a07c2fe6bb8542c021c309f646aa20af9c7c2b82ccfa623908121ef7&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Expo Paraguay-Brasil closes with USD 640m in business intentions despite the political crisis (2026-11-15)", "date": "2026-11-15", "source_url": "https://www.lanacion.com.py/negocios/2026/11/15/expo-paraguay-brasil-supero-expectativas-reunio-a-mas-de-mil-empresas-y-proyecta-negocios-por-usd-640-millones/", "source_name": "La Nación", "summary": "The 17th Expo Paraguay-Brasil, the core of Paraguay Business Week held in Hernandarias from 11 to 13 November, closed with USD 640 million in projected business, above the USD 600 million target and 52% more than the USD 421 million of the previous edition. The organisers, the Paraguay-Brazil chamber of commerce, reported more than 3,100 business meetings, 1,182 participating companies from seven countries, 1,283 principal participants, 15,637 visitors — up 74% — and 362 exhibitors. Brazil accounted for 69.8% of international participation, followed by Paraguay at 29.1%, with smaller delegations from Argentina, Uruguay, Spain, the United States and Peru. Construction, food and beverages, metalworking, technology, professional services, logistics, energy and agribusiness were the main sectors. Organisers highlighted Brazilian interest in the Investor Pass, Law 60/90 incentives and the maquila regime, and said they intend to repeat the event in 2027.", "image_url": "https://www.lanacion.com.py/resizer/v2/I5NGA3R2ERAG5JJMESZ5R6TFLE.jpeg?auth=e1f73d8d8fa00e074ef4794222525e59671b721ef512bd1870991b5048555ccc&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}]}, {"title": "V. Industry Focus: Telecom, Digital Energy & AI", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "Electricity demand rises 16% in January-October as Itaipú supplies 92% of the system (2026-11-16)", "date": "2026-11-16", "source_url": "https://www.hoy.com.py/nacionales/2026/11/16/el-consumo-electrico-en-paraguay-subio-un-16-entre-enero-y-octubre", "source_name": "Diario HOY / ANDE", "summary": "ANDE reported that accumulated electricity demand reached 27,407.1 GWh between January and October, 16% more than in the same period of 2025. October demand alone was 2,712,712 MWh, up 7.2% year-on-year, a slower pace than the 35.4% surge in April that was partly driven by high-consumption crypto-mining customers. Itaipú supplied 24,121 GWh to ANDE in the ten months, up 16.23%, and covered 92.3% of October demand; Yacyretá contributed 6.5% with a 43% increase, and Acaray 1.2%. The Puerto Esperanza solar plant in the Chaco injected about 33 MWh, the first solar contribution to the interconnected system. The electricity-sector professionals' institute IPPSE warned that 2028-2030 will be critical: demand is growing by more than 500 MW a year and could reach 800-1,000 MW in the 2030s, Paraguay's Itaipú quota could be fully absorbed by 2030, and deficits could appear from 2031 unless firm capacity, regional imports or a 20-year plan are put in place.", "image_url": "https://www.lanacion.com.py/resizer/v2/PSBVOY4NVNG43DXWQVSSSL4MEE.jpg?auth=fc7ad85e2ec53d806f24fc1f536eb46433120dd5f8e6da251b18873ddc83f9b5&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "Paraguay hosts IBERAMIA 2026, its first Ibero-American AI conference (2026-11-18)", "date": "2026-11-18", "source_url": "https://www.pol.una.py/2026/la-fp-una-fue-sede-de-los-workshops-de-iberamia-2026-encuentro-internacional-de-inteligencia-artificial/", "source_name": "FP-UNA", "summary": "The Polytechnic Faculty of the National University of Asunción (FP-UNA) hosted the workshops and tutorials of IBERAMIA 2026, the 19th Ibero-American Conference on Artificial Intelligence, on 17 November at its San Lorenzo campus, with the official opening that evening at the Universidad Comunera. The main plenary and technical sessions ran from 18 to 20 November at the Faculty of Science and Technology on the Catholic University's Santa Librada campus. It is the first time Paraguay has hosted the conference, organised by the UNA and the Catholic University with support from the Universidad Comunera and the Paraguayan AI Society, and accepted papers are published in Springer's Lecture Notes in Artificial Intelligence. The event put Paraguayan researchers in contact with Ibero-American teams across machine learning, knowledge representation, natural language processing and applied AI at a moment when the government is trying to move from AI consumer to developer, through a sovereign data-centre project with Taiwan and an AI bill that the Senate approved in October 2025 but the Chamber of Deputies has yet to pass.", "image_url": "https://www.pol.una.py/wp-content/uploads/IMG_0075-scaled.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Government reports 800 Starlink kits in rural schools and another 400 arrive (2026-11-21)", "date": "2026-11-21", "source_url": "http://tw.tokenpost.com/news/blockchain/74786", "source_name": "TokenPost / MITIC", "summary": "The government said 800 Starlink kits had been installed in rural schools by 16 November, half of the 1,600 target, with the latest connection in Santa Lucía, Yataity del Norte, in San Pedro department. MITIC said a further 400 kits arrived on 20 November, which would take the programme to 1,200 of the 1,600 school connections planned. The project is run by MITIC and the state telecoms company COPACO with Conatel and the Ministry of Education, and is intended to give students and teachers in hard-to-reach areas access to education platforms and digital materials; the government estimates more than 50,000 students and teachers will benefit. The Justice Ministry is manufacturing the antenna mounts with inmates. Elon Musk amplified the programme on 21 November with a post saying 'Starlink helps education'. The figures are a rare piece of good news for the government's digital agenda amid the Ueno crisis.", "image_url": "https://www.lanacion.com.py/resizer/v2/CSM3GWJXURGYJPHK6XLEC4J7MA.jpg?auth=e67ad4b19436cf40c552a94a912f4ba7a787ab37df800b3ec7a082ff243a0cfc&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}]}, {"title": "VI. Key Client Developments", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "Tigo partners with the MSME vice-ministry on digital tools and e-commerce for small firms (2026-11-20)", "date": "2026-11-20", "source_url": "https://revistafoco.com.py/2026/11/20/mipymes-suman-aliados-para-vender-por-internet-e-impulsar-el-diseno/", "source_name": "Revista FOCO", "client_tag": "Tigo", "summary": "During Paraguay Business Week, the vice-ministry of MSMEs signed cooperation agreements with Tigo Paraguay and the Paraguayan Chamber of Design and Innovation to give small firms access to digital tools, e-commerce and new markets. Vice-minister Gustavo Giménez said connectivity is a basic condition for online commerce and that a package of digital solutions is being prepared with the Paraguayan E-commerce Chamber. The alliance will use Tigo's connectivity network so that small companies can not only advertise but also close sales and reach foreign markets. For Tigo, the agreement deepens its position in the SME segment at a time when the Ueno crisis is squeezing working capital and pushing merchants online. It also complements Tigo's network investment and its 5G obligations: the operator must light its first 5G base station by February 2027 and at least 100 sites within four years under the licences awarded in August 2026.", "image_url": "https://www.lanacion.com.py/resizer/v2/BQSNZNE6TVGTBHOXOPULFTCO6I.jpg?auth=b1715f59f1af3a13b18197c6178567d55d9713a0f69348e59f63c31017267b76&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Personal's Flow broadcasts the María Becerra concert in Paraguay on channel 25 (2026-11-15)", "date": "2026-11-15", "source_url": "https://eldoce.tv/show/2026/11/12/maria-becerra-llega-a-flow-con-su-quimera-tour-360-cuando-y-donde-ver-el-show-en-vivo/", "source_name": "El Doce / Telecom Argentina", "client_tag": "Personal", "summary": "Flow, the pay-TV and streaming platform of Telecom Argentina's Personal, broadcast María Becerra's Quimera Tour 360° live from the M. Arena in Buenos Aires on Sunday 15 November at 21:00. The show was available to Flow customers in Argentina on channel 605, Uruguay on channel 119 and Paraguay on channel 25, and remains available on demand. The event is a small but useful signal of Personal's cross-border content strategy: the operator uses Argentine-produced content to differentiate its Paraguayan pay-TV and broadband offer while it prepares its 5G launch. Personal, through Núcleo S.A., holds 100 MHz in the 3.7-3.8 GHz band awarded in August 2026 and must activate its first 5G base station by February 2027, with at least 100 sites within four years. Telecom Argentina reported 9M26 revenue of USD 1,778 million, up 18%, and adjusted EBITDA of USD 642 million.", "image_url": "https://eldoce.tv/resizer/v2/R62KMDRUYBHADAI2PEWDFZIMQE.png?auth=ee8bd277bd8a89eb57e624ce8a605f019b75c2a75e2afcd79aa71a714cc8353f&width=1023", "is_gov_source": false, "is_authoritative": true}]}, {"title": "VII. Integrated Impact Analysis for Business", "tier": 2, "impact_analysis": "🔴 Paraguay has moved from a liquidity shock to a slow-burn confidence and governance crisis. The resolution of Ueno Bank is being managed better than feared — about USD 644 million paid to 1.8 million depositors, USD 600 million of healthy assets identified and a deposit-guarantee fund of roughly USD 1.6 billion — but the second-order effects are now visible. The guaraní has swung from G. 5,945 at end-October to G. 6,216 on 13 November and G. 6,407 on 20 November, a 7.8% depreciation in three weeks that raises import costs, dollar-debt service and pricing uncertainty. The BCP has held the policy rate at 5.50% and kept inflation at 1.7%, but its new president is openly reviewing the monetary framework, which adds medium-term uncertainty even as the 3.5% target is reaffirmed.\n\n🟡 The fiscal and political calendar is the main near-term risk. The 2027 budget of G. 166.3 trillion (about USD 25.75 billion) carries a 3.9% of GDP deficit against a 1.5% fiscal rule, and the Senate will not debate it until 24 November, four days before the constitutional deadline; any amendment sends it back to Deputies, compressing the window to 20 December. Fitch's negative watch on BB+ and Moody's governance warning mean that the planned return to international bond markets in early 2027 will be more expensive. The removal of Fiscal General Rolón and the appointment of an interim prosecutor do not resolve the question of who controls the Ueno investigation, and further institutional turnover is likely.\n\n🟢 The real economy is still growing — IMAEP +3.9% in September, record exports and 16% electricity-demand growth — and the Ueno case remains, so far, idiosyncratic rather than systemic. But business surveys show sales falls of 30-40% among affected merchants, MSMEs are short of working capital, and the government's AFD lines and MIC-Treasury-Asoban working group are only a partial bridge. For companies, the priorities are counterparty diversification away from institutions with Ueno exposure, active FX hedging, tighter credit terms for local distributors, and close monitoring of the 24-28 November budget window and the 31 December Itaipú tariff deadline, which could shift energy costs and fiscal revenue by several hundred million dollars.", "user_notes": ""}, {"title": "VIII. Targeted Recommendations for Chinese Enterprises", "tier": 2, "impact_analysis": "🟡 Banking and treasury: diversify deposits and payment flows across at least two top-tier banks (Continental, Itaú, Sudameris, GNB) and avoid concentrating operating cash in institutions with unresolved Ueno exposure. Reconcile receivables and payables weekly while the deposit-guarantee payouts and asset auctions continue, and require local counterparties to confirm that their accounts and credit lines are unaffected. The BCP's reference rate (G. 6,407.06 on 20 November) should be the contractual benchmark; build a 5-8% FX band into 2027 budgets and consider forward cover for dollar-denominated imports and debt.\n\n🔴 Fiscal and regulatory watch: the 2027 budget debate on 24-28 November and the 20 December deadline are the key windows for tax, spending and procurement changes. The government has cut about USD 100 million of discretionary spending and USD 80 million from Hambre Cero, and business groups are pressing for further discipline; any tax increase would hit formal-sector margins. Chinese firms should map their exposure to public-sector contracts and payment cycles, and avoid pricing assumptions that depend on the 1.5% fiscal rule being met. Fitch's negative watch also raises the cost of locally issued guarantees and performance bonds.\n\n🟢 Energy and digital opportunities: electricity demand is growing 16% a year, Itaipú supplies over 92% of the system, and the government is prioritising AI data centres over crypto-mining, with 15-year contracts at USD 48.91-56.39/MWh and a 6,300 MW queue of pending requests. This is a genuine opening for Chinese equipment, EPC and cooling suppliers, but the Araico/Crusoe and Yguazú Digital contracts are politically contested, the tariff for the new AI category excludes crypto, and the 31 December Itaipú deadline could change the entire cost base. Partner with local developers, secure off-take and grid-connection commitments before committing capital, and assume stricter screening of Chinese technology in telecoms and data centres.\n\n🟡 Security and operations: the kidnapping of two policemen in central Asunción and the seizure of military-style gear and crypto rigs in Alto Paraná show that organised crime is active in the tri-border area. Review route risk, escort protocols, insurance and staff tracking for operations in Canindeyú, Amambay and the border corridor. On telecoms, Tigo and Personal must launch 5G by February 2027 and Claro is already live, so enterprise connectivity and IoT offers will improve through 2027; negotiate multi-year contracts now while operators compete for corporate accounts.", "user_notes": ""}]}};
