<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paraguay Briefing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#F0F4FF;color:#1E293B;line-height:1.6;min-height:100vh}
a{color:#3B82F6;text-decoration:none}a:hover{text-decoration:underline}
.header{background:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;border-bottom:3px solid #3B82F6}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;flex-shrink:0}
.header-left h1{font-size:20px;font-weight:700;color:#1E293B}
.header-left .subtitle{font-size:12px;color:#64748B;margin-top:2px}
.header-right{display:flex;gap:8px;align-items:center}
.btn-lang{background:#EEF2FF;color:#4F46E5;font-weight:700;font-size:12px;padding:8px 14px;border-radius:20px;border:none;cursor:pointer}
.btn-lang:hover{background:#E0E7FF}
.btn-primary{background:#3B82F6;color:#fff;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-primary:hover{background:#2563EB;transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.3)}
.btn-secondary{background:#F1F5F9;color:#475569;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:#E2E8F0}
.btn-sm{font-size:11px;padding:6px 12px}
.update-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:moFade .2s}
.update-modal{background:#fff;border-radius:14px;padding:24px 28px;width:440px;max-width:90vw;box-shadow:0 24px 80px rgba(0,0,0,.25);animation:moZoom .25s}
.update-modal h3{font-size:17px;font-weight:700;color:#1E293B;margin-bottom:16px}
.update-modal label{display:block;font-size:12px;font-weight:600;color:#64748B;margin-bottom:4px}
.update-modal select,.update-modal input{width:100%;padding:8px 12px;border:1px solid #CBD5E1;border-radius:8px;font-size:13px;margin-bottom:14px;color:#1E293B;background:#fff}
.update-modal .btn-row{display:flex;gap:8px;justify-content:flex-end}
.time-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.time-preset{padding:5px 12px;border-radius:14px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #CBD5E1;background:#fff;color:#64748B;transition:all .12s}
.time-preset:hover,.time-preset.active{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.history-list{max-height:300px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid #E2E8F0;border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.history-item:hover{background:#F8FAFC;border-color:#CBD5E1}
.history-item .hi-title{font-weight:600;font-size:13px;color:#1E293B}
.history-item .hi-meta{font-size:11px;color:#94A3B8}
.history-item .hi-count{font-size:11px;font-weight:600;color:#3B82F6;background:#EEF2FF;padding:2px 8px;border-radius:10px}
.loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid #CBD5E1;border-top-color:#3B82F6;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.standalone-banner{background:#FEF3C7;color:#92400E;text-align:center;padding:6px 16px;font-size:12px;border-bottom:1px solid #FDE68A;display:none}
.standalone-banner code{background:#FDE68A;padding:1px 5px;border-radius:3px;font-size:11px}

.stats-row{max-width:1400px;margin:0 auto;padding:12px 32px 16px;display:flex;flex-direction:column;gap:8px}
.stats-row-total{display:flex;justify-content:center}
.stats-row-sections{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:768px){.stats-row-sections{grid-template-columns:repeat(2,1fr)}}
.stat-pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;cursor:pointer;transition:all .2s;border:2px solid transparent;font-size:13px;font-weight:600;user-select:none;min-width:0}
.stat-pill:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.pill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pill-label{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-count{font-size:14px;font-weight:700;margin-left:auto;flex-shrink:0;background:rgba(255,255,255,.5);padding:1px 8px;border-radius:10px}
.stat-pill.pill-total{background:#1E293B;color:#fff;font-weight:700;border-radius:24px;display:inline-flex}
.stat-pill.pill-total .pill-count{background:rgba(255,255,255,.2)}

.content{max-width:1400px;margin:0 auto;padding:0 32px 60px}
.section{background:#fff;border-radius:14px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden;border-top:4px solid #3B82F6}
.section.s0{border-top-color:#3B82F6}.section.s1{border-top-color:#EF4444}.section.s2{border-top-color:#10B981}
.section.s3{border-top-color:#8B5CF6}.section.s4{border-top-color:#06B6D4}.section.s5{border-top-color:#F59E0B}
.section.s6{border-top-color:#6366F1}.section.s7{border-top-color:#EC4899}.section.tier2{background:#FAFBFC}
.section-header{padding:16px 22px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-header h2{font-size:16px;font-weight:700;color:#1E293B}
.section-header .badge{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;background:#F1F5F9;color:#64748B;white-space:nowrap}
.section-desc{padding:4px 22px 10px;font-size:12px;color:#94A3B8}
.events-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 22px 18px}
@media(max-width:860px){.events-grid{grid-template-columns:1fr}.event-card{flex-direction:column}.event-card .event-img{width:100%!important;min-height:120px;max-height:180px}}
.event-card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;transition:all .2s;display:flex}
.event-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-1px);border-color:#CBD5E1}
.event-card .event-img{width:160px;min-height:140px;flex-shrink:0;position:relative;overflow:hidden}
.event-card .event-img img{width:100%;height:100%;object-fit:cover;display:block}
.event-card .event-img .img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.event-card .event-body{padding:12px 15px;flex:1;min-width:0;display:flex;flex-direction:column}
.event-card .event-meta{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.event-card .event-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.event-tag.date{background:#F1F5F9;color:#64748B}.event-tag.gov{background:#DCFCE7;color:#15803D}
.event-tag.auth{background:#DBEAFE;color:#1D4ED8}.event-tag.source{background:#FEF3C7;color:#A16207}
.event-tag.client{background:#FCE7F3;color:#BE185D}
.event-card .event-preview{font-size:13px;color:#334155;line-height:1.6;flex:1;overflow:visible;max-height:none}
.event-card .event-link{font-size:11px;margin-top:6px;color:#3B82F6;font-weight:500}
.analysis-body{padding:4px 22px 20px;font-size:13px;line-height:1.8;color:#334155}
.analysis-body h3{font-size:15px;font-weight:700;margin:14px 0 6px;color:#1E293B}
.analysis-body ul{padding-left:0;list-style:none}
.analysis-body li{padding:2px 0 2px 18px;position:relative}
.analysis-body li::before{content:"•";position:absolute;left:2px;color:#3B82F6;font-weight:bold}
.tier-divider{text-align:center;padding:16px 0 8px;margin:8px 0}
.tier-divider span{background:linear-gradient(135deg,#3B82F6,#6366F1);color:#fff;padding:8px 28px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(59,130,246,.25)}
.footer{text-align:center;padding:20px 32px 40px;color:#94A3B8;font-size:12px;max-width:1400px;margin:0 auto}
.macro-dashboard{background:#fff;border-radius:14px;margin-bottom:18px;padding:16px 22px 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-top:4px solid #1E293B}
.macro-title{font-size:15px;font-weight:700;color:#1E293B;margin-bottom:2px}
.macro-period{font-size:11px;font-weight:400;color:#94A3B8;margin-left:6px}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media(max-width:900px){.macro-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.macro-grid{grid-template-columns:1fr}}
.macro-card{background:#F8FAFC;border-radius:8px;padding:10px 8px 4px;border:1px solid #E2E8F0}
.macro-card-title{font-size:10.5px;font-weight:600;color:#475569;margin-bottom:4px;text-align:center;line-height:1.3;min-height:28px;display:flex;align-items:center;justify-content:center}
.macro-card{position:relative}
.macro-source{position:absolute;top:6px;right:8px;font-size:7.5px;color:#94A3B8;font-weight:500;background:#fff;padding:1px 5px;border-radius:3px;border:1px solid #E2E8F0;z-index:1;pointer-events:none}
.macro-latest{display:flex;justify-content:center;align-items:baseline;gap:4px;margin-top:2px;padding:3px 0}
.macro-latest-label{font-size:9px;color:#94A3B8;font-weight:500}
.macro-latest-val{font-size:15px;font-weight:700;color:#1E293B}
.macro-latest-unit{font-size:9px;color:#64748B;font-weight:500}
.macro-latest-date{font-size:9px;color:#94A3B8}
.macro-note{font-size:9px;color:#94A3B8;margin-top:1px}
.macro-card{cursor:pointer;transition:transform .15s,box-shadow .15s}
.macro-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.macro-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:moFade .2s}
.macro-modal-card{background:#fff;border-radius:16px;padding:24px 28px 18px;width:680px;max-width:94vw;max-height:90vh;overflow-y:auto;cursor:default;box-shadow:0 24px 80px rgba(0,0,0,.25);position:relative;animation:moZoom .25s}
.macro-modal-card .macro-card{border:none;padding:0;background:transparent;cursor:default}
.macro-modal-card .macro-card:hover{transform:none;box-shadow:none}
.macro-modal-card .macro-card-title{font-size:15px;min-height:auto;margin-bottom:10px}
.macro-modal-card .macro-legend,.macro-modal-card [style*=legend]{font-size:11px!important}
.macro-modal-close{position:absolute;top:10px;right:16px;font-size:26px;cursor:pointer;color:#94A3B8;background:none;border:none;line-height:1;z-index:10;padding:4px 8px;border-radius:6px}
.macro-modal-close:hover{color:#475569;background:#F1F5F9}
.macro-data-section{margin-top:14px;border-top:1px solid #E2E8F0;padding-top:10px}
.macro-data-toggle{background:#F8FAFC;border:1px solid #CBD5E1;padding:6px 16px;border-radius:6px;font-size:12px;color:#64748B;cursor:pointer;font-weight:500}
.macro-data-toggle:hover{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.macro-data-table-wrap{margin-top:10px;max-height:340px;overflow-y:auto;border:1px solid #E2E8F0;border-radius:8px}
.macro-data-table{width:100%;border-collapse:collapse;font-size:12px}
.macro-data-table th{background:#F8FAFC;padding:7px 12px;text-align:right;font-weight:600;color:#475569;border-bottom:2px solid #E2E8F0;position:sticky;top:0}
.macro-data-table th:first-child{text-align:left}
.macro-data-table td{padding:5px 12px;text-align:right;border-bottom:1px solid #F1F5F9;color:#334155;font-variant-numeric:tabular-nums}
.macro-data-table td:first-child{text-align:left;color:#64748B;font-weight:500}
.macro-data-table tbody tr:hover td{background:#EEF2FF}
.macro-na{color:#CBD5E1!important}
@keyframes moFade{from{opacity:0}to{opacity:1}}
@keyframes moZoom{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:768px){.header{padding:14px 16px}.header-left h1{font-size:16px}.stats-row{padding:10px 14px;gap:6px}.stat-pill{padding:8px 12px;font-size:12px}.pill-label{font-size:11px}.content{padding:0 12px 40px}.section-header{padding:12px 14px 0}.events-grid{grid-template-columns:1fr;padding:4px 14px 14px}}
</style>
</head>
<body>

<div class="standalone-banner" id="standaloneBanner">Offline mode · Run <code>python3 web_app.py</code> for live updates</div>

<header class="header">
  <div class="header-left"><div class="header-logo">PY</div><div><h1>巴拉圭简报</h1><div class="subtitle" id="headerSubtitle"></div></div></div>
  <div class="header-right"><button class="btn-secondary" id="btnMacro" onclick="openMacroModal()" title="更新CPI/RIN">Macro</button><button class="btn-secondary" id="btnHistory" onclick="showHistory()">History</button><button class="btn-primary" id="btnUpdate" onclick="refreshBriefing()">Refresh</button><button class="btn-lang" id="langBtn" onclick="switchLanguage()">中文</button></div>
</header>

<div class="stats-row" id="statsRow"></div>
<div class="content" id="contentArea"></div>
<div class="footer">Paraguay Briefing · Data sourced from public news and government websites</div>

<script>

window.EMBEDDED_BRIEFINGS = {"zh": {"topic": "巴拉圭简报", "time_span": "2026年8月1日 — 2026年8月8日", "time_label": "最近一周", "sections": [{"title": "一、宏观经济动态", "tier": 1, "events": [{"title": "美元跌破6000瓜拉尼，为2018年以来首次（2026-08-05）", "date": "2026-08-05", "source_url": "https://www.lanacion.com.py/negocios/2026/08/05/el-dolar-esta-debajo-de-los-g-6000-y-vuelve-a-niveles-de-2018/", "source_name": "La Nación", "summary": "美元兑瓜拉尼汇率跌破G. 6,000关口，为2018年以来首次。截至8月5日，兑换所报价G. 5,920（买入）/ G. 5,970（卖出），央行参考汇率为G. 5,966.06。瓜拉尼在十个月内从接近G. 8,000/USD升值近25%，主要驱动因素包括创纪录的大豆收成、全球美元走弱以及瓜拉尼收入美元化需求减少。巴拉圭央行保持中性立场，未进行外汇干预。", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "7月CPI环比下降0.14%，年化通胀率降至1.58%（2026-08-04）", "date": "2026-08-04", "source_url": "https://www.infobae.com/america/america-latina/2026/08/04/paraguay-registro-una-inflacion-del-01-en-julio-por-las-bajas-en-alimentos-y-bienes-importados/", "source_name": "Infobae", "summary": "巴拉圭7月CPI环比下降0.14%，主要受食品价格下降和瓜拉尼升值导致进口商品（汽车、电子产品）价格走低影响。年化通胀率降至1.58%，远低于央行3.5%的目标。央行将年末通胀预测从3.5%下调至3.3%。7月为连续第二个月通缩（6月-0.28%），核心通胀保持低位。CPI同比已连续12个月低于目标区间下限。", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "美元贷款激增67%，企业和个人押注美元持续走弱（2026-08-06）", "date": "2026-08-06", "source_url": "https://www.lanacion.com.py/negocios_edicion_impresa/2026/08/06/los-prestamos-en-dolares-se-disparan-hasta-el-67/", "source_name": "La Nación", "summary": "外币贷款同比增长22.47%至137亿美元，其中服务业贷款激增67%。企业和个人纷纷增加美元借款以利用瓜拉尼强势的优势，但这使其面临美元反弹时的汇率风险。IMF已指出消费信贷快速增长值得密切关注。贷款美元化趋势反映出市场对瓜拉尼长期维持强势的普遍预期。", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "农业机械进口激增30%，瓜拉尼强势与农业繁荣双重推动（2026-08-05）", "date": "2026-08-05", "source_url": "https://www.lanacion.com.py/negocios/2026/08/05/boom-del-agro-y-el-dolar-bajo-generaron-aumento-de-casi-30-en-la-importacion-de-maquinarias/", "source_name": "La Nación", "summary": "2026年上半年巴拉圭进口农业机械1,893台，货值1.774亿美元，同比增长近30%。拖拉机进口增长44.5%，喷雾机增长66.7%，播种机增长1.6%。这一激增既受益于创纪录的大豆收成带来的农业繁荣，也得益于汇率优势使进口资本 亚松森和卢克被捕。", "image_url": null, "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "四、国际关系与外交动态", "tier": 1, "events": [{"title": "副总统阿里亚纳称巴拉圭-美国关系正处于'历史最好时期'，双边议程全面扩展（2026-08-04）", "date": "2026-08-04", "source_url": "https://www.infobae.com/estados-unidos/2026/08/04/pedro-alliana-vicepresidente-del-paraguay-la-relacion-bilateral-con-estados-unidos-atraviesa-un-momento-extraordinario/", "source_name": "Infobae", "summary": "副总统Pedro Alliana和外交部长Ramírez访问华盛顿，与美国国务卿卢比奥及副国务卿Landau会晤。主要成果包括签署核合作谅解备忘录（123协定）、讨论'美洲之盾'安全倡议以及在Pax Silica框架下就关键矿产进行合作。培尼亚总统于8月3日与卢比奥通电话，称双边议程'令人振奋'。美国方面表示双边关系在过去一年半经历了'历史性增长'。", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭在美洲国家组织共同发起针对尼加拉瓜危机的外长会议倡议（2026-08-06）", "date": "2026-08-06", "source_url": "https://www.lanacion.com.py/politica/2026/08/06/paraguay-copatrocina-pedido-a-la-oea-de-una-reunion-de-cancilleres-sobre-nicaragua/", "source_name": "La Nación", "summary": "巴拉圭与美国共同发起在美洲国家组织召开外长特别会议讨论尼加拉瓜危机的倡议。常驻代表Raúl Florentín大使发表强硬讲话，称奥尔特加取消自由选举的计划'危及半球安全'。会议拟在2026年9月宪法改革计划之前举行。巴拉圭与阿根廷、哥斯达黎加、厄瓜多尔、巴拿马、乌拉圭和美国共同推动超越口头谴责的集体行动。", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "台湾向巴拉圭学生颁发76项奖学金，邦交70周年纪念临近（2026-08-07）", "date": "2026-08-07", "source_url": "https://www.ultimahora.com/embajada-de-taiwan-otorgo-76-becas-en-distintas-disciplinas-y-niveles-academicos", "source_name": "Última Hora", "summary": "台湾驻巴拉圭使馆颁发76项各学科奖学金，自1991年以来累计授予894项奖学金。两国正在为2027年建交70周年做准备。巴拉圭仍是台湾在南美洲的唯一邦交国，也是南方共同市场中唯一未与中国大陆建交的成员。培尼亚总统于2026年5月访问台湾，中国大陆对此予以强烈谴责。巴拉圭外长表示愿与中国大陆发展贸易但拒绝放弃与台湾的关系。", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "南共市-欧盟贸易协定临时生效，巴拉圭要求公平分配出口配额（2026-06-29）", "date": "2026-06-29", "source_url": "https://www.ip.gov.py/ip/2026/06/29/paraguay-highlights-achievements-of-its-pro-tempore-presidency-of-mercosur-and-reaffirms-equity-criteria-within-the-bloc/", "source_name": "Agencia IP", "summary": "南方共同市场-欧盟自由贸易协定自2026年5月1日起临时生效，在覆盖7亿人口的市场中取消90%以上贸易商品的关税。在6月29日共同市场理事会会议上，外长Ramírez要求获得'公平而非特权'的欧盟出口配额分配，拒绝仅以历史贸易量为基础的分配方式，称其为'不合理'，并警告这将损害巴拉圭实际市场准入。此前巴拉圭已成功轮值担任南共市主席国。", "image_url": null, "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "五、行业专题：通讯、运营商、数字能源与AI", "tier": 1, "events": [{"title": "第二轮5G频谱拍卖完成：Tigo获2.3GHz、Personal获3.7GHz频段（2026-08-06）", "date": "2026-08-06", "source_url": "https://www.telesemana.com/blog/2026/08/06/segunda-subasta-5g-en-paraguay-tigo-se-queda-con-2-3-ghz-y-personal-con-3-7-ghz/", "source_name": "TeleSemana", "summary": "国家电信委员会（CONATEL）完成了第二轮5G频谱拍卖，Tigo获得2.3-2.4 GHz频段（100 MHz），Personal获得3.7-3.8 GHz频段（100 MHz）。两家运营商须在180天内启动商用服务（截止2027年2月），各自承诺投资至少4,000万美元用于采用可信供应商设备的安全网络基础设施。许可证仅5年有效期——拉丁美洲最短，引发投资回报担忧。", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo、Personal——5G频谱获取，各投资4000万美元以上"}, {"title": "彭博社将巴拉圭列为清洁能源和AI投资的拉美标杆（2026-08-07）", "date": "2026-08-07", "source_url": "https://www.lanacion.com.py/negocios/2026/08/07/bloomberg-pone-a-paraguay-como-ejemplo-regional-de-energia-limpia-y-destino-para-la-ia/", "source_name": "La Nación", "summary": "彭博社专题报道巴拉圭为拉丁美洲吸引技术基础设施投资潜力最大的国家，强调其是该地区唯一100%可再生发电的国家。报道指出每100兆瓦能源可吸引约40亿美元数据中心投资。电价为全球最具竞争力之列：商业用电约0.046美元/千瓦时对比全球平均0.164美元/千瓦时。水电来自伊泰普和亚西雷塔两座世界级水电站。", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "数据中心和AI运营商——巴拉圭定位为清洁能源AI基础设施区域枢纽"}, {"title": "巴拉圭-台湾AI中心超级项目宣布：分三阶段建设至1GW容量（2026-05-11）", "date": "2026-05-11", "source_url": "https://www.upi.com/Top_News/World-News/2026/05/11/Paraguay-Taiwan-announce-ambitious-AI-hub-plan-for-South-America/2731778522952/", "source_name": "UPI", "summary": "培尼亚总统宣布与台湾50:50合资建设全球最大AI中心之一，结合台湾半导体技术（占全球90%份额）与巴拉圭水电优势。计划分三阶段：第一阶段10兆瓦数据中心、第二阶段100兆瓦、第三阶段1吉瓦。培尼亚将这一雄心与伊泰普水电站建设相提并论。选址和建设时间表尚未公布。该项目将进一步巩固巴拉圭作为区域数字基础设施中心的地位。", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "华为、中兴、数据中心设备供应商——大规模基础设施机遇"}, {"title": "HIVE Digital在巴拉圭上线首个AI GPU集群，计划100兆瓦扩张（2026-08-08）", "date": "2026-08-08", "source_url": "https://www.theblock.co/post/394138/hive-launches-first-ai-gpu-cluster-paraguay-miner-expands-beyond-bitcoin", "source_name": "The Block", "summary": "HIVE Digital Technologies在亚松森一座Tier III数据中心上线巴拉圭首个AI GPU集群，与哥伦比亚大学研究人员合作运行LLM训练生产负载。HIVE在巴拉圭运营约300兆瓦水电基础设施，另有100兆瓦在开发中。计划2027年进行大规模HPC扩张，在Yguazú增设Tier III数据中心容量。此举将巴拉圭定位为纽约和亚松森之间的AI计算桥梁，也是该国从比特币挖矿向AI计算转型的标志性事件。", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "NVIDIA、GPU供应商、数据中心基础设施厂商——算力基础设施机遇"}], "impact_analysis": "", "user_notes": ""}, {"title": "六、主要客户动向", "tier": 1, "events": [{"title": "Tigo（Millicom）：获2.3GHz 5G频谱；IDB Invest和Proparco注资1亿美元；本地债券融资7700万美元（2026-08-06）", "date": "2026-08-06", "source_url": "https://dplnews.com/personal-tigo-licencias-5g-paraguay/", "source_name": "DPL News", "summary": "Tigo在巴拉圭第二轮5G拍卖中获得2.3-2.4 GHz频段，须在180天内启动商用服务。2026年3月，IDB Invest和Proparco通过私募债券向Millicom承诺1亿美元，用于拉美地区的4G/4.5G/5G网络现代化和光纤扩展（包括巴拉圭）。Tigo Paraguay于2026年1月发行约7700万美元本地货币债券，创造了历史。Tigo是市场领导者，拥有316万移动互联网用户，2026年Q1调整后EBITDA利润率为56.3%。巴拉圭约占Millicom集团收入的11%。", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Millicom/Tigo——5G部署、网络现代化、光纤扩展；网络设备、基础设施"}, {"title": "Personal（阿根廷电信）：获3.7GHz 5G频谱，FTTH市场领先（2026-08-06）", "date": "2026-08-06", "source_url": "https://www.telesemana.com/blog/2026/08/06/segunda-subasta-5g-en-paraguay-tigo-se-queda-con-2-3-ghz-y-personal-con-3-7-ghz/", "source_name": "TeleSemana", "summary": "Personal在第二轮5G拍卖中获得优质3.7-3.8 GHz频段（与其母公司阿根廷电信在阿根廷使用的频段相同）。该公司在2026年巴塞罗那世界移动通信大会上被Ookla评为巴拉圭最快固定网络。Personal（由Núcleo S.A.运营）在FTTH市场处于领先地位，在主要城市部署光纤最为积极，是第二大移动运营商，拥有166万用户。5G商用部署的180天期限将目标锁定在2027年2月。", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "阿根廷电信/Personal——5G部署、FTTH扩展；网络设备、光纤基础设施"}, {"title": "Claro（América Móvil）：首个5G网络自2025年12月投入运营，计划全国扩张（2026-08-06）", "date": "2026-08-06", "source_url": "https://www.bnamericas.com/en/news/paraguay-greenlights-claro-and-nubicom-to-ignite-5g-race", "source_name": "BNamericas", "summary": "Claro Paraguay于2025年12月启用该国首个5G网络，初始投资3,500万美元，采用Nokia基础设施，覆盖大亚松森、东方市、恩卡纳西翁、奥维耶多上校城和佩德罗胡安卡瓦列罗。Claro在2025年拍卖中以202万美元获得3.5 GHz频段200 MHz。总经理Alfredo Alcaraz确认2026年将继续扩展。Claro是第三大运营商，手机用户94.7万。作为唯一的5G先行者，Claro在5G市场具有先发优势。", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "América Móvil/Claro——5G网络扩张、全国覆盖；Nokia基础设施、网络设备"}, {"title": "Nubicom因5G违约被调查，承诺的2亿美元投资未兑现（2026-08-06）", "date": "2026-08-06", "source_url": "https://www.bnamericas.com/en/news/paraguay-greenlights-claro-and-nubicom-to-ignite-5g-race", "source_name": "BNamericas", "summary": "阿根廷互联网服务商Nubicom在2025年拍卖中获得3.5 GHz频段200 MHz并承诺投资2亿美元，因未履行频谱部署义务，正接受审计总署调查。自获得许可证近一年来未见任何5G网络部署进展。此案引发对巴拉圭5G市场新进入者可行性的担忧，并可能导致频谱被收回。该情况也为现有运营商获取额外频谱创造了潜在机会。", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom——5G牌照违约；频谱重新分配的潜在机会"}], "impact_analysis": "", "user_notes": ""}, {"title": "七、对企业经营的综合影响分析", "tier": 2, "events": [], "impact_analysis": "🟡 汇率与竞争力：瓜拉尼持续升值（G. 5,952/USD，十个月内从G. 8,000下跌约25%）创造了双刃剑效应。资本品进口商（机械、电信设备）受益于更便宜的美元计价采购——农业机械进口激增30%和美元贷款猛增67%即为明证。但出口商和以美元计价收入的企业面临利润率压缩。央行不干预的立场意味着强势瓜拉尼将持续，企业需更积极地对冲外汇敞口。🔴 财政风险：尽管巴拉圭投资级评级（穆迪Baa3、标普BBB-）保持不变，但实际财政赤字可能接近GDP的4%，隐藏供应商债务约20亿美元。政府的财政收敛计划目标是在2028年回归1.5%法定上限，但执行风险显著。任何降级都将推高主权借贷成本并可能引发资本外流。拟发行的20亿美元30年期国债将进一步加重公共债务负担（目前为GDP的38.1%）。🟢 机遇——数字基础设施：5G拍卖（三大运营商现均持有频谱）、彭博社对巴拉圭清洁能源AI枢纽的认可、台湾AI中心超级项目以及HIVE首个GPU集群部署，共同标志着巴拉圭向区域数字基础设施中心的转型。供应电信设备（大规模MIMO、光纤、数据中心基础设施）、云服务和AI算力的企业应抓住机遇。100%可再生电网和0.046美元/千瓦时商业电价是具有全球竞争力且不易被侵蚀的优势。🟡 安全与运营风险：上巴拉那省安全形势恶化（武装突击队抢劫银行、警局换帅）及与黄金走私相关的有组织犯罪增加了在边境省份有物流、分支机构或人员的企业运营风险。全国医生罢工（8月24-28日）将扰乱公共医疗服务获取，可能影响劳动力出勤和生产力。🔴 监管不确定性——电信：CONATEL仅授予5G许可证5年有效期（对比国际标准的15-20年），给运营商的投资回报造成了显著监管风险。5G部署排除中国设备供应商（华为、中兴），虽然在政治上与美国保持一致，但限制了技术选择并可能增加部署成本。Nubicom的违约调查进一步增加了监管环境的不确定性。", "user_notes": ""}, {"title": "八、对中资企业的专项影响与建议", "tier": 2, "events": [], "impact_analysis": "🔴 高风险——外交约束：巴拉圭仍是台湾在南美洲的唯一邦交国。培尼亚总统2026年5月访问台湾以及即将到来的邦交70周年（2027年）强化了现状。中国多次谴责这些举动，声明不承认一个中国原则就不会有贸易好处。中资企业面临潜在声誉风险，在涉足巴拉圭相关项目前应进行彻底合规审查。5G设备排除（华为、中兴）是这一外交立场的最直接体现，在现政策下可能持续。🟡 中风险——间接市场准入：尽管存在外交壁垒，中国商品在巴拉圭进口结构中占据主导地位（手机、计算机设备、轮胎）。中资企业可通过巴西、阿根廷或智利的区域子公司或贸易中介继续间接服务巴拉圭市场。南方共同市场-欧盟贸易协定的临时生效开辟了更多间接贸易渠道。中国电信设备供应商应探索与非中国集成商的合作模式，或聚焦不受公共5G拍卖限制的企业/专网领域。🟢 机遇——基础设施与能源：巴拉圭4.8亿美元铁路项目（亚松森-卢克走廊，由阿联酋Etihad Rail以G2G模式主导）和拟议的20亿美元矿业投资是基础设施大单，中国承包商和设备供应商可通过与非中国伙伴的联合体安排参与。台湾AI中心三阶段项目（最高1吉瓦）将需要大规模电力基础设施升级——中国电气设备和输电技术可通过间接渠道供应。🟢 机遇——农业综合与机械：农业机械进口激增30%显示了对资本品的强劲需求。中国拖拉机制造商、收割机、灌溉系统和农产品加工设备可以在品牌认知面临挑战的情况下，依靠价格性能比在瓜拉尼强势使进口设备更便宜的市场中竞争。与已在巴拉圭运营的巴西或阿根廷经销商建立合资企业是可行的入市策略。🟡 注意——安全与劳工：8月24-28日全国医生罢工和边境省份的安全恶化虽然是局部性的，但可能干扰运营。各区有外派人员或现场作业的中资企业应审查安全预案。最低工资上调至PYG 3,044,000（2026年7月起+5%）和法定的16.5% IPS雇主缴费意味着劳动力成本——虽仍是拉美最低之一——正在上升。适当的劳动力规划应考虑第13个月工资和强制性福利。", "user_notes": ""}]}, "en": {"topic": "Paraguay Briefing", "time_span": "August 1 – August 8, 2026", "time_label": "Past Week", "sections": [{"title": "I. Macroeconomic Developments", "tier": 1, "events": [{"title": "USD Falls Below G. 6,000 for First Time Since 2018 (2026-08-05)", "date": "2026-08-05", "source_url": "https://www.lanacion.com.py/negocios/2026/08/05/el-dolar-esta-debajo-de-los-g-6000-y-vuelve-a-niveles-de-2018/", "source_name": "La Nación", "summary": "The US dollar fell below G. 6,000 for the first time since 2018, trading at G. 5,920 (buy) / G. 5,970 (sell) at exchange houses as of August 5. The BCP reference rate stood at G. 5,966.06. The guaraní has appreciated nearly 25% in ten months from almost G. 8,000/USD, driven by a record soybean harvest, global dollar weakness, and reduced demand for dollarization of guaraní-denominated income. The BCP maintains a neutral stance with no FX intervention.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay Records -0.1% Deflation in July as Food and Import Prices Fall (2026-08-04)", "date": "2026-08-04", "source_url": "https://www.infobae.com/america/america-latina/2026/08/04/paraguay-registro-una-inflacion-del-01-en-julio-por-las-bajas-en-alimentos-y-bienes-importados/", "source_name": "Infobae", "summary": "Paraguay registered consumer price deflation of -0.1% in July 2026, driven by lower food prices and cheaper imported goods (vehicles, electronics) resulting from the strong guaraní. Annual inflation stands at approximately 2.1%, well below the BCP's 3.5% target. The BCP projects year-end inflation at 3.3%, revised downward from 3.5%.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Dollar-Denominated Lending Surges 67% as Borrowers Bet on Weak Dollar (2026-08-06)", "date": "2026-08-06", "source_url": "https://www.lanacion.com.py/negocios_edicion_impresa/2026/08/06/los-prestamos-en-dolares-se-disparan-hasta-el-67/", "source_name": "La Nación", "summary": "Foreign-currency credits surged 22.47% year-on-year to USD 13.7 billion, with the services sector alone expanding 67%. Businesses and individuals are increasingly borrowing in dollars to take advantage of the strong guaraní, though this exposes them to exchange rate risk if the dollar rebounds. The IMF has flagged rapid consumer credit growth as warranting close monitoring.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Agricultural Machinery Imports Jump 30% on Strong Guaraní and Agribusiness Boom (2026-08-05)", "date": "2026-08-05", "source_url": "https://www.lanacion.com.py/negocios/2026/08/05/boom-del-agro-y-el-dolar-bajo-generaron-aumento-de-casi-30-en-la-importacion-de-maquinarias/", "source_name": "La Nación", "summary": "Paraguay imported 1,893 units of agricultural machinery worth USD 177.4 million in the first half of 2026, a nearly 30% increase year-on-year. Tractor imports surged 44.5%, sprayers 66.7%, and seeders 1.6%. The boom reflects both the record soybean harvest and the favorable exchange rate making imported capital goods cheaper in guaraní terms.", "image_url": null, "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "II. Political & Policy Developments", "tier": 1, "events": [{"title": "President Peña Promises Zero Debt with State Suppliers by 2027 (2026-08-06)", "date": "2026-08-06", "source_url": "https://www.latribuna.com.py/politica/2026/08/06/pena-promete-cancelar-deuda-con-las-empresas-proveedoras-para-el-2027/", "source_name": "La Tribuna", "summary": "President Santiago Peña pledged to clear all outstanding government debts to suppliers by the 2027 fiscal year, with accumulated obligations exceeding USD 1.27 billion, of which approximately USD 1 billion is owed to the Ministry of Health for medicines, supplies, and services, and USD 220 million to the MOPC for construction companies. A USD 2 billion 30-year bond issuance has been proposed as a financing mechanism.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "New Fiscal Convergence Plan Sets Deficit Path: 3.2% in 2026, 1.5% by 2028 (2026-08-07)", "date": "2026-08-07", "source_url": "https://www.latribuna.com.py/negocios/economia/2026/08/07/nuevo-plan-de-convergencia-busca-honrar-las-deudas/", "source_name": "La Tribuna", "summary": "The government presented a new Fiscal Convergence Plan setting deficit targets of 3.2% of GDP for 2026, 3.9% for 2027, and a return to the Fiscal Responsibility Law limit of 1.5% by 2028. Business groups (ADEC) endorsed the plan but called for improved quality of public spending. Economist Sergio Sapena warned that the real fiscal deficit may be closer to 4% of GDP with USD 2 billion in accumulated hidden debts, potentially threatening the investment-grade rating.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay Signs '123 Agreement' on Civil Nuclear Cooperation with the US (2026-08-05)", "date": "2026-08-05", "source_url": "https://www.larepublica.co/globoeconomia/paraguay-firma-con-estados-unidos-el-acuerdo-123-de-cooperacion-nuclear-civil-4451961", "source_name": "La República", "summary": "Paraguay signed the '123 Agreement' with the United States for civil nuclear cooperation, joining over 25 nations with similar agreements. The MoU enables transfer of civilian nuclear technology for energy and scientific purposes under IAEA oversight, following the discovery of uranium deposits in Paraguay with US investment in exploration.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Government Advances New Mining Code to Unlock USD 2 Billion in Investments (2026-08-06)", "date": "2026-08-06", "source_url": "https://conexionparaguay.com/nota/8405/tras-la-oferta-de-marco-rubio-el-gobierno-avanza-en-el-nuevo-codigo-minero-para-destrabar-inversiones/", "source_name": "Conexión Paraguay", "summary": "Following discussions with US Secretary of State Marco Rubio, the Peña administration is advancing a new Mining Code to unlock an estimated USD 2 billion in mining investments, according to the Paraguayan Mining Chamber (Capami). The code may also open possibilities for hydrocarbon and mineral exploration in protected areas such as Médanos del Chaco National Park.", "image_url": null, "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "III. Social & Security Landscape", "tier": 1, "events": [{"title": "National Doctors' Strike Called for August 24–28 Amid Healthcare Crisis (2026-08-07)", "date": "2026-08-07", "source_url": "https://www.ultimahora.com/las-condiciones-laborales-de-los-medicos-afectan-la-atencion-a-la-ciudadania", "source_name": "Última Hora", "summary": "The National Doctors' Union (Sinamed) called a nationwide strike for August 24–28, demanding salary adjustments to recover 2012 purchasing power levels, double pay for holiday shifts, permanent appointments for approximately 9,000 doctors on precarious contracts (many with over 10 years of service), and provision of basic medical supplies. Union president Rosanna González described the situation as one of the worst crises in Paraguay's public health system.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Police Leadership Replaced in Alto Paraná as Security Crisis Deepens (2026-08-05)", "date": "2026-08-05", "source_url": "https://www.laclave.com.py/2026/08/05/relevo-policial-confirma-fracaso-de-seguridad-en-alto-parana/", "source_name": "La Clave", "summary": "The Police Directorate of Alto Paraná department replaced its commander (Crio. José Félix Vega replaced by Crio. Jorge Ramón Aquino Aguayo), a move interpreted as recognition of the failure to contain escalating organized crime. The most dramatic incident occurred on June 16 in Santa Rita, where over 20 armed criminals simultaneously attacked three banks and an exchange house using explosives and rifles. The government launched Operation 'Responsum', deploying combined police and military forces.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Police Brutality and 'Gatillo Fácil' Cases Draw National Outcry (2026-08-06)", "date": "2026-08-06", "source_url": "https://www.ultimahora.com/brutalidad-de-la-policia-y-gatillo-facil-son-un-mal-recuerdo-de-la-dictadura", "source_name": "Última Hora", "summary": "Última Hora documented multiple cases of police brutality, including a journalist (Lorenzo Villalba) beaten and tortured while filming police operations, two brothers receiving a 30-minute beating and chemical assault in a police cell, and a 22-year-old man killed by 37 bullet wounds (one to the head) at a police checkpoint in Alberdi, Ñeembucú. The report characterized these actions as reminiscent of dictatorship-era practices.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Double Homicide in Encarnación Linked to Gold Transaction; Five Foreign Nationals Arrested (2026-08-06)", "date": "2026-08-06", "source_url": "https://www.elterritorio.com.ar/noticias/2026/08/06/904582-intentaron-comprar-oro-y-terminaron-asesinados-en-encarnacion", "source_name": "El Territorio", "summary": "Two Paraguayans were murdered during an alleged gold transaction in Encarnación. Five foreign nationals were arrested: three Bolivians and two Spaniards (father and son). The victims were restrained, bound, and shot; the robbery involved approximately G. 370 million. The case highlights growing organized crime activity linked to gold smuggling in border regions.", "image_url": null, "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "IV. International Relations & Diplomacy", "tier": 1, "events": [{"title": "VP Alliana: Paraguay-US Relations at 'Best Moment in History' as Bilateral Agenda Expands (2026-08-04)", "date": "2026-08-04", "source_url": "https://www.infobae.com/estados-unidos/2026/08/04/pedro-alliana-vicepresidente-del-paraguay-la-relacion-bilateral-con-estados-unidos-atraviesa-un-momento-extraordinario/", "source_name": "Infobae", "summary": "Vice President Pedro Alliana and Foreign Minister Rubén Ramírez visited Washington D.C., meeting with Secretary of State Marco Rubio and Deputy Secretary Chris Landau. Key outcomes included the signing of a nuclear cooperation MoU (123 Agreement), discussions on the 'Shield of the Americas' security initiative, and collaboration on critical minerals under the Pax Silica framework. President Peña also held a phone call with Rubio on August 3, characterizing the bilateral agenda as 'spectacular.'", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay Co-Sponsors OAS Foreign Ministers' Meeting on Nicaragua Crisis (2026-08-06)", "date": "2026-08-06", "source_url": "https://www.lanacion.com.py/politica/2026/08/06/paraguay-copatrocina-pedido-a-la-oea-de-una-reunion-de-cancilleres-sobre-nicaragua/", "source_name": "La Nación", "summary": "Paraguay co-sponsored a US-led initiative at the OAS to convene an extraordinary meeting of foreign ministers on Nicaragua, with Ambassador Raúl Florentín declaring that Ortega's plans to eliminate free elections 'compromise hemispheric security.' The meeting was proposed to occur before September 2026, when constitutional reforms are planned. Paraguay joined Argentina, Costa Rica, Ecuador, Panama, Uruguay, and the US in the initiative.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Taiwan Grants 76 Scholarships to Paraguayan Students as 70th Anniversary of Diplomatic Ties Approaches (2026-08-07)", "date": "2026-08-07", "source_url": "https://www.ultimahora.com/embajada-de-taiwan-otorgo-76-becas-en-distintas-disciplinas-y-niveles-academicos", "source_name": "Última Hora", "summary": "Taiwan's embassy in Paraguay awarded 76 scholarships across various disciplines, bringing the total to 894 scholarships granted since 1991. The two countries are preparing to mark the 70th anniversary of diplomatic relations in 2027. Paraguay remains Taiwan's sole diplomatic ally in South America and the only Mercosur member without ties to China. President Peña visited Taiwan in May 2026; China strongly condemned the visit.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Mercosur-EU Trade Deal Enters Provisional Application; Paraguay Demands Equitable Export Quotas (2026-06-29)", "date": "2026-06-29", "source_url": "https://www.ip.gov.py/ip/2026/06/29/paraguay-highlights-achievements-of-its-pro-tempore-presidency-of-mercosur-and-reaffirms-equity-criteria-within-the-bloc/", "source_name": "Agencia IP", "summary": "The Mercosur-EU free trade agreement entered provisional application from May 1, 2026, eliminating tariffs on over 90% of traded goods across a 700-million-person market. At the June 29 CMC meeting, Foreign Minister Ramírez demanded 'equity, not privileges' in EU export quota allocation, rejecting distribution based solely on historical trade volumes as 'unreasonable' for Paraguay and warning it undermines real market access.", "image_url": null, "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "V. Industry Focus: Telecom, Digital Energy & AI", "tier": 1, "events": [{"title": "Second 5G Auction Concludes: Tigo Wins 2.3 GHz, Personal Wins 3.7 GHz (2026-08-06)", "date": "2026-08-06", "source_url": "https://www.telesemana.com/blog/2026/08/06/segunda-subasta-5g-en-paraguay-tigo-se-queda-con-2-3-ghz-y-personal-con-3-7-ghz/", "source_name": "TeleSemana", "summary": "CONATEL concluded its second 5G spectrum auction, awarding Tigo the 2.3-2.4 GHz band (100 MHz) and Personal the 3.7-3.8 GHz band (100 MHz). Both operators have 180 days to launch commercial services (deadline February 2027). Each committed to invest at least USD 40 million in secure network infrastructure with trusted-vendor equipment. License duration is only 5 years — the shortest in Latin America, raising concerns about return on investment.", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo, Personal — 5G spectrum acquisition, USD 40M+ investment each"}, {"title": "Bloomberg Highlights Paraguay as Regional Leader in Clean Energy and AI Destination (2026-08-07)", "date": "2026-08-07", "source_url": "https://www.lanacion.com.py/negocios/2026/08/07/bloomberg-pone-a-paraguay-como-ejemplo-regional-de-energia-limpia-y-destino-para-la-ia/", "source_name": "La Nación", "summary": "Bloomberg featured Paraguay as the Latin American country with the greatest potential to attract technology infrastructure investments, noting it is the only country in the region with 100% renewable electricity generation. The report highlighted that every 100 MW of energy can attract approximately USD 4 billion in data center investment. Electricity rates are among the world's most competitive: ~USD 0.046/kWh commercial vs. global average of USD 0.164/kWh.", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Data center and AI operators — Paraguay positioning as regional clean energy hub for AI infrastructure"}, {"title": "Paraguay-Taiwan AI Hub Megaproject Announced: Three-Phase Plan to 1 Gigabit Capacity (2026-05-11)", "date": "2026-05-11", "source_url": "https://www.upi.com/Top_News/World-News/2026/05/11/Paraguay-Taiwan-announce-ambitious-AI-hub-plan-for-South-America/2731778522952/", "source_name": "UPI", "summary": "President Peña announced a 50/50 joint venture with Taiwan to build one of the world's largest AI centers in Paraguay, combining Taiwanese semiconductor technology (90% global share) with Paraguayan hydropower. The three-phase plan targets: Phase 1 — 10 MW data center, Phase 2 — 100 MW, Phase 3 — 1 GW. Peña compared the ambition to the construction of Itaipú. Location and construction timeline are yet to be disclosed.", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Huawei, ZTE, data center equipment suppliers — large-scale infrastructure opportunity"}, {"title": "HIVE Digital Launches First AI GPU Cluster in Paraguay, Plans 100 MW Expansion (2026-08-08)", "date": "2026-08-08", "source_url": "https://www.theblock.co/post/394138/hive-launches-first-ai-gpu-cluster-paraguay-miner-expands-beyond-bitcoin", "source_name": "The Block", "summary": "HIVE Digital Technologies launched Paraguay's first AI GPU cluster at a Tier III data center in Asunción, running production workloads with Columbia University researchers for LLM training. HIVE operates approximately 300 MW of hydroelectric infrastructure in Paraguay with another 100 MW in development. A large-scale HPC expansion is planned for 2027, with additional Tier III data center capacity in Yguazú, positioning Paraguay as a bridge for AI computing between New York and Asunción.", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "NVIDIA, GPU suppliers, data center infrastructure vendors — compute infrastructure opportunity"}], "impact_analysis": "", "user_notes": ""}, {"title": "VI. Key Client Developments", "tier": 1, "events": [{"title": "Tigo (Millicom): Wins 2.3 GHz 5G Spectrum; IDB Invest + Proparco Inject USD 100M; Local Bond Raises USD 77M (2026-08-06)", "date": "2026-08-06", "source_url": "https://dplnews.com/personal-tigo-licencias-5g-paraguay/", "source_name": "DPL News", "summary": "Tigo secured the 2.3-2.4 GHz band in Paraguay's second 5G auction with 180 days to launch commercial service. In March 2026, IDB Invest and Proparco committed USD 100 million via a private bond to Millicom for 4G/4.5G/5G network modernization and fiber expansion across Latin America, including Paraguay. Tigo Paraguay also raised approximately USD 77 million in a landmark local-currency bond issue in January 2026. Tigo is the market leader with 3.16 million mobile internet users and posted a 56.3% adjusted EBITDA margin in Q1 2026. Paraguay represents approximately 11% of Millicom's group revenue.", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Millicom/Tigo — 5G rollout, network modernization, fiber expansion; network equipment, infrastructure"}, {"title": "Personal (Telecom Argentina): Wins 3.7 GHz 5G Spectrum, Leads FTTH Market (2026-08-06)", "date": "2026-08-06", "source_url": "https://www.telesemana.com/blog/2026/08/06/segunda-subasta-5g-en-paraguay-tigo-se-queda-con-2-3-ghz-y-personal-con-3-7-ghz/", "source_name": "TeleSemana", "summary": "Personal won the prime 3.7-3.8 GHz band in the second 5G auction (same band used by parent Telecom Argentina). The company was recognized by Ookla at MWC Barcelona 2026 as having the fastest fixed network in Paraguay. Personal (operated by Núcleo S.A.) leads the FTTH market with aggressive urban fiber deployment and is the second-largest mobile operator with 1.66 million users. The 180-day deployment deadline for 5G commercial launch places the target in February 2027.", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Telecom Argentina/Personal — 5G deployment, FTTH expansion; network equipment, fiber infrastructure"}, {"title": "Claro (América Móvil): First 5G Network Operational Since Dec 2025, Plans Nationwide Expansion (2026-08-06)", "date": "2026-08-06", "source_url": "https://www.bnamericas.com/en/news/paraguay-greenlights-claro-and-nubicom-to-ignite-5g-race", "source_name": "BNamericas", "summary": "Claro Paraguay activated the country's first 5G network in December 2025 with an initial USD 35 million investment and Nokia infrastructure, covering Greater Asunción, Ciudad del Este, Encarnación, Coronel Oviedo, and Pedro Juan Caballero. Claro acquired 200 MHz in the 3.5 GHz band (USD 2.02 million) in the 2025 auction. General Manager Alfredo Alcaraz confirmed continued expansion throughout 2026. Claro is the third-largest operator with 947,000 mobile users.", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "América Móvil/Claro — 5G network expansion, nationwide coverage; Nokia infrastructure, network equipment"}, {"title": "Nubicom Under Investigation for 5G Non-Compliance; USD 200M Pledge Unfulfilled (2026-08-06)", "date": "2026-08-06", "source_url": "https://www.bnamericas.com/en/news/paraguay-greenlights-claro-and-nubicom-to-ignite-5g-race", "source_name": "BNamericas", "summary": "Argentine ISP Nubicom, which won 200 MHz in the 3.5 GHz band in the 2025 auction with a pledged USD 200 million investment, is under investigation by the Comptroller General for failure to comply with spectrum deployment obligations. No 5G network deployment has been reported nearly one year after the license award. The case raises concerns about the viability of new entrants in Paraguay's 5G market and may lead to spectrum reclamation.", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom — non-performing 5G license; potential spectrum reallocation opportunity for existing operators"}], "impact_analysis": "", "user_notes": ""}, {"title": "VII. Integrated Impact Analysis for Business Operations", "tier": 2, "events": [], "impact_analysis": "🟡 Exchange Rate & Competitiveness: The guaraní's sustained appreciation (G. 5,952/USD, down ~25% from G. 8,000 ten months ago) creates a dual-edged business environment. Importers of capital goods (machinery, telecom equipment) benefit from cheaper dollar-denominated purchases, as evidenced by the 30% surge in agricultural machinery imports and 67% jump in dollar loans. However, exporters and companies with USD-denominated revenue face margin compression. The BCP's neutral intervention stance suggests the strong guaraní will persist, requiring businesses to hedge FX exposure more actively. 🔴 Fiscal Risk: While Paraguay's investment-grade ratings (Moody's Baa3, S&P BBB-) remain intact, the real fiscal deficit may be closer to 4% of GDP with approximately USD 2 billion in hidden supplier debts. The government's Fiscal Convergence Plan targets a return to the 1.5% legal limit by 2028, but execution risk is significant. Any downgrade would raise sovereign borrowing costs and could trigger capital outflows. The proposed USD 2 billion 30-year bond issue would add to the public debt burden (currently 38.1% of GDP). 🟢 Opportunity — Digital Infrastructure: The convergence of 5G auctions (all three major operators now hold spectrum), Bloomberg's recognition of Paraguay as a clean-energy AI destination, the Taiwan AI hub megaproject, and HIVE's first GPU cluster deployment signal a structural shift toward Paraguay as a regional digital infrastructure hub. Companies supplying telecom equipment (massive MIMO, fiber, data center infrastructure), cloud services, and AI compute should position now. The 100% renewable grid and USD 0.046/kWh commercial electricity rates are globally competitive advantages that are unlikely to erode. 🟡 Security & Operational Risk: The deterioration of security in Alto Paraná (bank heists by armed commandos, police leadership changes) and growing organized crime linked to gold smuggling (Encarnación double homicide) raise operational risk for businesses with logistics, branch networks, or personnel in border departments. The national doctors' strike (August 24-28) will disrupt public healthcare access, potentially affecting workforce availability and productivity. 🔴 Regulatory Uncertainty — Telecom: CONATEL's decision to grant 5G licenses for only 5 years (versus the 15-20 year international standard) creates significant regulatory risk for telecom operators' return on investment. The exclusion of Chinese equipment vendors (Huawei, ZTE) from 5G deployments, while politically aligned with US interests, limits technology options and may increase deployment costs. Nubicom's non-compliance investigation further clouds the regulatory landscape.", "user_notes": ""}, {"title": "VIII. Targeted Recommendations for Chinese Enterprises", "tier": 2, "events": [], "impact_analysis": "🔴 High Risk — Diplomatic Constraints: Paraguay remains Taiwan's sole diplomatic ally in South America. President Peña's May 2026 visit to Taiwan and the approaching 70th anniversary of bilateral ties (2027) reinforce the status quo. China has repeatedly condemned these moves and stated there will be no trade benefits without recognition of the One-China Principle. Chinese enterprises face potential reputational risks and should conduct thorough compliance reviews before entering Paraguay-linked projects. The 5G equipment exclusion (Huawei, ZTE) is a direct manifestation of this diplomatic alignment and is likely to persist under current policy. 🟡 Medium Risk — Indirect Market Access: Despite diplomatic barriers, Chinese goods dominate Paraguay's import basket (mobile phones, computer equipment, tires). Chinese enterprises can continue serving the Paraguayan market indirectly through regional subsidiaries in Brazil, Argentina, or Chile, or via trading intermediaries. The Mercosur-EU trade deal's provisional application opens additional indirect trade channels. Chinese telecom equipment vendors should explore partnership models with non-Chinese integrators or focus on enterprise/private network segments not covered by the public 5G auction restrictions. 🟢 Opportunity — Infrastructure & Energy: Paraguay's USD 480 million railway project (Asunción-Luque corridor, led by UAE's Etihad Rail under G2G agreement) and the proposed USD 2 billion mining code investments represent large-scale infrastructure opportunities where Chinese contractors and equipment suppliers could participate through consortium arrangements with non-Chinese partners. The three-phase Taiwan AI hub project (up to 1 GW) will require massive power infrastructure upgrades — Chinese electrical equipment and transmission technology could be sourced indirectly. 🟢 Opportunity — Agribusiness & Machinery: The 30% surge in agricultural machinery imports demonstrates strong demand for capital goods. Chinese manufacturers of tractors, harvesters, irrigation systems, and agro-processing equipment, while facing brand perception challenges, can compete on price-performance in a market where the strong guaraní makes imported equipment more affordable. Joint ventures with Brazilian or Argentine distributors already operating in Paraguay offer a viable entry strategy. 🟡 Caution — Security & Labor: The healthcare strike and security deterioration in border departments (Alto Paraná) are localized but can disrupt operations. Chinese enterprises with expatriate staff or field operations in these areas should review security protocols. The minimum wage increase to PYG 3,044,000 (+5% from July 2026) and the statutory 16.5% IPS employer contribution mean that labor costs, while still among the lowest in Latin America, are rising. Proper workforce planning should account for the aguinaldo (13th month) and mandatory benefits.", "user_notes": ""}]}};

  s+='</svg>';return s;
}
function renderMacroCardGDP(){var d=MACRO_GDP;return'<div class="macro-card" onclick="expandMacroCard(\'GDP\')" title="'+L('点击放大','Click to enlarge')+'"><span class="macro-source">'+L('BCP / IMF','BCP / IMF')+'</span><div class="macro-card-title">'+esc(L(d.t[0],d.t[1]))+'</div>'+renderMacroSVG(d,{bars:true,line:true,barMax:52,lineMax:6,dual:true,step:1,labels:['2023','2024','2025','2026F'],forecastFrom:3})+'</div>';}
function renderMacroCardCPI(){var d=MACRO_CPI,v=d.line[d.line.length-1];var lastH='<div class="macro-latest"><span class="macro-latest-label">'+L('最新','Latest')+'</span><span class="macro-latest-val">'+v.toFixed(1)+'%</span><span class="macro-latest-date">(2026.06)</span></div>';return'<div class="macro-card" onclick="expandMacroCard(\'CPI\')" title="'+L('点击放大','Click to enlarge')+'"><span class="macro-source">BCP</span><div class="macro-card-title">'+esc(L(d.t[0],d.t[1]))+'</div>'+renderMacroSVG(d,{line:true,lineMax:9,lineMin:0,step:6})+lastH+renderMacroLegend(d)+'</div>';}
function renderMacroCardFX(){var d=MACRO_FX,dl=d.line||d.monthly;var dstr=window.MACRO_FX_DATE||'2026.08.07';var displayVal=d.monthly[d.monthly.length-1];var lastH='<div class="macro-latest"><span class="macro-latest-label">'+L('最新','Latest')+'</span><span class="macro-latest-val">'+Math.round(displayVal)+'</span><span class="macro-latest-unit">'+d.lu+'</span><span class="macro-latest-date">('+dstr+')</span></div>';var step=dl.length>200?182:6;return'<div class="macro-card" onclick="expandMacroCard(\'FX\')" title="'+L('点击放大','Click to enlarge')+'"><span class="macro-source">BCP</span><div class="macro-card-title">'+esc(L(d.t[0],d.t[1]))+'</div>'+renderMacroSVG(d,{line:true,lineMax:8000,lineMin:5800,step:step})+lastH+'</div>';}
function renderMacroCardRIN(){var d=MACRO_RIN,v=d.line[d.line.length-1];var unit=L(d.lu[0],d.lu[1]);var lastH='<div class="macro-latest"><span class="macro-latest-label">'+L('最新','Latest')+'</span><span class="macro-latest-val">'+Math.round(v).toLocaleString()+'</span><span class="macro-latest-unit">'+unit+'</span><span class="macro-latest-date">(2026.07.31)</span></div>';return'<div class="macro-card" onclick="expandMacroCard(\'RIN\')" title="'+L('点击放大','Click to enlarge')+'"><span class="macro-source">BCP</span><div class="macro-card-title">'+esc(L(d.t[0],d.t[1]))+'</div>'+renderMacroSVG(d,{line:true,lineMax:12500,lineMin:9000,step:6})+lastH+renderMacroLegend(d)+'</div>';}
function renderMacroLegend(d){return'<div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:2px;font-size:8px;color:#64748B"><span style="display:inline-block;width:12px;height:2px;background:'+d.lc+';vertical-align:middle;border-radius:1px"></span> '+L(d.yl[0],d.yl[1])+'</div>';}
function renderMacroLegend2(d){return'<div style="display:flex;justify-content:center;gap:14px;margin-top:2px;font-size:8px;color:#64748B"><span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:'+d.lc+';vertical-align:middle;margin-right:3px"></span>'+L(d.yl[0],d.yl[1])+'</span><span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:'+d.lc2+';vertical-align:middle;margin-right:3px"></span>'+L(d.yl2[0],d.yl2[1])+'</span></div>';}
function expandMacroCard(type){
  var fnMap={GDP:renderMacroCardGDP,CPI:renderMacroCardCPI,FX:renderMacroCardFX,RIN:renderMacroCardRIN};
  var fn=fnMap[type];if(!fn)return;
  var inner=fn().replace(' class="macro-card"',' class="macro-card" style="cursor:default"');
  var dataSection='';
  if(type!=='GDP'){
    if(type==='FX')dataSection=renderFXDailyTable(MACRO_FX,MACRO_FX.lu);
    else{var dMap={CPI:MACRO_CPI,RIN:MACRO_RIN};var unitMap={CPI:MACRO_CPI.lu,RIN:L(MACRO_RIN.lu[0],MACRO_RIN.lu[1])};dataSection=renderMacroDataTable(dMap[type],unitMap[type]);}
  }
  var h='<div class="macro-modal-overlay" id="macroModal" onclick="closeMacroModal(event)"><div class="macro-modal-card" onclick="event.stopPropagation()"><button class="macro-modal-close" onclick="closeMacroModal()">&times;</button>'+inner+dataSection+'</div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
  document.addEventListener('keydown',onMacroModalKey);
}
function renderMacroDataTable(d,unit){
  var MONTHS_L=[['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']];
  var h='<div class="macro-data-section"><button class="macro-data-toggle" onclick="toggleDataTable(this)">'+L('查看月度源数据 ▼','View Monthly Data ▼')+'</button>';
  h+='<div class="macro-data-table-wrap" style="display:none"><table class="macro-data-table"><thead><tr><th>'+L('月份','Month')+'</th><th>2023</th><th>2024</th><th>2025</th><th>2026*</th></tr></thead><tbody>';
  for(var m=0;m<12;m++){
    h+='<tr><td>'+L(MONTHS_L[0][m],MONTHS_L[1][m])+'</td>';
    var src=d.monthly||d.line;for(var y=0;y<4;y++){var idx=y*12+m,v=src[idx];if(v!=null)h+='<td>'+(v>=100?Math.round(v):v.toFixed(1))+(unit||'')+'</td>';else h+='<td class="macro-na">—</td>';}
    h+='</tr>';
  }
  h+='</tbody></table><div style="font-size:9px;color:#94A3B8;margin-top:4px">* 2026 '+L('为1–5月数据','Jan–May YTD')+'</div></div></div>';
  return h;
}
function renderFXDailyTable(d,unit){
  var DM=[31,28,31,30,31,30,31,31,30,31,30,31],dl=d.line||[];
  var h='<div class="macro-data-section"><button class="macro-data-toggle" onclick="toggleDataTable(this)">'+L('查看每日源数据 ▼','View Daily Data ▼')+'</button>';
  h+='<div class="macro-data-table-wrap" style="display:none"><table class="macro-data-table"><thead><tr><th>'+L('日期','Date')+'</th><th>PYG/USD</th></tr></thead><tbody>';
  var dates=[],day=1,mo=0,yr=2023;
  for(var i=0;i<dl.length;i++){
    dates.push(yr+'-'+(mo<9?'0'+(mo+1):(mo+1))+'-'+(day<10?'0'+day:day));
    day++;var dim=DM[mo];if(mo===1&&yr%4===0)dim=29;
    if(day>dim){day=1;mo++;if(mo>11){mo=0;yr++;}}
  }
  for(var i=dl.length-1;i>=0;i--){
    h+='<tr><td>'+dates[i]+'</td><td>'+Math.round(dl[i])+(unit||'')+'</td></tr>';
  }
  h+='</tbody></table></div></div>';
  return h;
}
function toggleDataTable(btn){
  var wrap=btn.nextElementSibling;
  if(wrap.style.display==='none'){wrap.style.display='block';btn.innerHTML=btn.innerHTML.replace('查看','隐藏').replace('View','Hide').replace(' ▼',' ▲');}
  else{wrap.style.display='none';btn.innerHTML=btn.innerHTML.replace('隐藏','查看').replace('Hide','View').replace(' ▲',' ▼');}
}
function closeMacroModal(e){
  if(e&&e.type==='keydown'){if(e.key!=='Escape')return;}
  else if(e&&e.target&&!e.target.closest('#macroModal'))return;
  var m=document.getElementById('macroModal');if(m){m.remove();document.removeEventListener('keydown',onMacroModalKey);}
}
function onMacroModalKey(e){if(e.key==='Escape')closeMacroModal(e);}
function renderMacroDashboard(){return'<div class="macro-dashboard"><div class="macro-title">'+L('巴拉圭宏观数据看板','Paraguay Macro Dashboard')+'<span class="macro-period">2023–2026</span></div><div class="macro-note">'+L('数据来源：BCP，月度数据为趋势估算值','Sources: BCP; monthly figures are trend estimates')+'</div><div class="macro-grid">'+renderMacroCardGDP()+renderMacroCardCPI()+renderMacroCardFX()+renderMacroCardRIN()+'</div></div>';}
function renderAll(){
  if(!briefingData)return;
  var d=briefingData;
  document.getElementById('headerSubtitle').textContent=(d.topic||'')+' · '+(d.time_span||'');

  var sections=d.sections||[],tier1=[],tier2=[];
  for(var i=0;i<sections.length;i++){
    if(sections[i].tier===2)tier2.push(sections[i]);else tier1.push(sections[i]);
  }
  var total=0;
  for(var i=0;i<tier1.length;i++)total+=(tier1[i].events||[]).length;

  var pills='<div class="stats-row-total"><div class="stat-pill pill-total" onclick="scrollToSec(null)"><span class="pill-label">'+L('全部事件','All Events')+'</span><span class="pill-count">'+total+'</span></div></div>';
  for(var row=0;row<2;row++){
    pills+='<div class="stats-row-sections">';
    for(var col=0;col<3;col++){
      var idx=row*3+col;if(idx>=tier1.length)break;
      var sec=tier1[idx],c=PCOL[idx],cnt=(sec.events||[]).length;
      pills+='<div class="stat-pill" style="background:'+c.bg+';color:'+c.text+';" onclick="scrollToSec('+idx+')"><span class="pill-dot" style="background:'+c.dot+'"></span><span class="pill-label">'+stripNum(sec.title)+'</span><span class="pill-count">'+cnt+'</span></div>';
    }
    pills+='</div>';
  }
  document.getElementById('statsRow').innerHTML=pills;

  var html=renderMacroDashboard();
  for(var i=0;i<tier1.length;i++)html+=renderSection(tier1[i],i);
  if(tier2.length>0&&tier1.length>0){
    html+='<div class="tier-divider"><span>'+L('形势分析与行动建议','Analysis & Recommendations')+'</span></div>';
  }
  for(var j=0;j<tier2.length;j++)html+=renderSection(tier2[j],tier1.length+j);
  document.getElementById('contentArea').innerHTML=html;
}

function renderSection(sec,idx){
  var events=sec.events||[],isT2=sec.tier===2;
  var g=GRAD[idx%8],icon=ICONS[idx%8];
  var body='';
  if(isT2||events.length===0){
    if(sec.impact_analysis)body='<div class="analysis-body">'+fmt(sec.impact_analysis)+'</div>';
    else if(!isT2)body='<div style="padding:4px 22px 16px;color:#94A3B8;font-size:13px;">'+L('暂无此时间段内的事件','No events in this period')+'</div>';
  }else{
    var cards='';
    for(var i=0;i<events.length;i++)cards+=renderCard(events[i],g[0],g[1],icon);
    body='<div class="events-grid">'+cards+'</div>';
  }
  var badge=events.length>0?'<span class="badge">'+events.length+L(' 条事件',' events')+'</span>':'';
  return '<div class="section s'+(idx%8)+(isT2?' tier2':'')+'" id="sec-'+idx+'"><div class="section-header"><h2>'+esc(sec.title||'')+'</h2>'+badge+'</div>'+(sec.description?'<div class="section-desc">'+esc(sec.description)+'</div>':'')+body+'</div>';
}

function renderCard(evt,phFrom,phTo,icon){
  var img=evt.image_url,hasImg=img&&img.indexOf('http')===0;
  var ih='';
  if(hasImg)ih='<img src="'+esc(img)+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">';
  ih+='<div class="img-placeholder" style="background:linear-gradient(135deg,'+phFrom+','+phTo+');'+(hasImg?'display:none':'display:flex')+';font-size:32px;color:#fff;">'+icon+'</div>';

  var tags='';
  if(evt.date)tags+='<span class="event-tag date">'+esc(evt.date)+'</span>';
  if(evt.client_tag)tags+='<span class="event-tag client">'+esc(evt.client_tag)+'</span>';
  if(evt.is_gov_source)tags+='<span class="event-tag gov">'+L('政府官网','Government')+'</span>';
  else if(evt.is_authoritative)tags+='<span class="event-tag auth">'+L('权威媒体','Authoritative')+'</span>';
  if(evt.source_name)tags+='<span class="event-tag source">'+esc(evt.source_name)+'</span>';

  var link=evt.source_url?'<a class="event-link" href="'+esc(evt.source_url)+'" target="_blank" rel="noopener">'+L('查看原文 →','Read more →')+'</a>':'';
  var preview=evt.summary||'';if(!preview&&evt.title)preview=evt.title;
  return '<div class="event-card"><div class="event-img">'+ih+'</div><div class="event-body"><div class="event-meta">'+tags+'</div><div class="event-preview">'+esc(ss(preview))+'</div>'+link+'</div></div>';
}

function fmt(text){
  var h=esc(text);
  h=h.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
  h=h.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
  h=h.replace(/\n/g,'<br>');
  return h;
}

function scrollToSec(idx){
  var pills=document.querySelectorAll('.stat-pill');
  for(var i=0;i<pills.length;i++)pills[i].style.outline='';
  if(idx===null||idx===undefined){window.scrollTo({top:0,behavior:'smooth'});return;}
  var el=document.getElementById('sec-'+idx);
  if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.style.boxShadow='0 0 0 3px #3B82F6';
  setTimeout(function(){el.style.boxShadow='';},1500);
}

function showHistory(){
  fetch('/api/briefings').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(list){
    if(!list||!list.length){alert(L('没有找到历史简报','No saved briefings found.'));return;}
    var h='<div class="update-modal-overlay" id="histModal" onclick="closeUpdateModal(\'histModal\')"><div class="update-modal" onclick="event.stopPropagation()"><h3>'+L('历史简报','Saved Briefings')+'</h3><div class="history-list">';
    for(var i=0;i<list.length;i++){var b=list[i];h+='<div class="history-item" onclick="loadBriefing(\''+esc(b.filename)+'\')"><div><div class="hi-title">'+esc(b.topic||b.filename)+'</div><div class="hi-meta">'+esc(b.time_span||'')+'</div></div><span class="hi-count">'+(b.event_count||0)+L(' 条',' evts')+'</span></div>';}
    h+='</div><div class="btn-row" style="margin-top:12px"><button class="btn-secondary" onclick="closeUpdateModal(\'histModal\')">'+L('关闭','Close')+'</button></div></div></div>';
    document.body.insertAdjacentHTML('beforeend',h);
  }).catch(function(){
    alert(L('此功能需要启动 Flask 服务器。\n请在终端运行: python3 web_app.py\n然后访问 http://127.0.0.1:5000','This feature requires the Flask server.\nRun: python3 web_app.py\nThen visit http://127.0.0.1:5000'));
  });
}
function loadBriefing(filename){
  fetch('/api/briefing/'+encodeURIComponent(filename)).then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    DATA['zh']=data;DATA['en']=data;briefingData=data;renderAll();closeUpdateModal('histModal');
  }).catch(function(){alert(L('加载失败','Failed to load briefing.'));});
}
function refreshBriefing(){
  var btn=document.getElementById('btnUpdate');
  btn.disabled=true;btn.textContent='...';
  fetch('/api/briefing/briefing_en.json').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    DATA['en']=data;briefingData=data;renderAll();
    fetch('/api/briefing/briefing.json').then(function(r){if(r.ok)return r.json();}).then(function(zh){if(zh)DATA['zh']=zh;}).catch(function(){});
  }).catch(function(){alert(L('刷新失败','Refresh failed'));}).finally(function(){
    btn.disabled=false;btn.textContent=L('刷新简报','Refresh');
  });
}
function openMacroModal(){
  var h='<div class="update-modal-overlay" id="macroModal" onclick="closeUpdateModal(\'macroModal\')"><div class="update-modal" onclick="event.stopPropagation()"><h3>'+L('更新宏观数据','Update Macro Data')+'</h3>';
  h+='<p style="font-size:11px;color:#94A3B8;margin-bottom:12px">'+L('下载最新 BCP Excel 后填入文件名','Fill in latest BCP Excel filenames')+'</p>';
  h+='<input type="text" id="cpiFileName" placeholder="'+L('CPI文件，如 AE_IPC-26.6.xlsx','CPI file, e.g. AE_IPC-26.6.xlsx')+'" style="width:100%;font-size:12px;padding:8px 10px;border:1px solid #CBD5E1;border-radius:6px;margin-bottom:8px">';
  h+='<input type="text" id="rinFileName" placeholder="'+L('RIN文件，如 reservas...xlsx','RIN file, e.g. reservas...xlsx')+'" style="width:100%;font-size:12px;padding:8px 10px;border:1px solid #CBD5E1;border-radius:6px;margin-bottom:12px">';
  h+='<div class="btn-row"><button class="btn-secondary" onclick="closeUpdateModal(\'macroModal\')">'+L('取消','Cancel')+'</button><button class="btn-primary" onclick="refreshMacroData()">'+L('更新','Update')+'</button></div>';
  h+='<div id="genStatus" style="margin-top:10px;font-size:12px;color:#64748B;display:none"></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
}
function refreshMacroData(){
  var cpiFile=document.getElementById('cpiFileName').value.trim();
  var rinFile=document.getElementById('rinFileName').value.trim();
  if(!cpiFile&&!rinFile){alert(L('请至少输入一个文件名','Please enter at least one filename.'));return;}
  var st=document.getElementById('genStatus');
  st.style.display='block';st.innerHTML='<span class="loading-spinner"></span>'+L('正在读取宏观数据文件…','Reading macro data files…');
  fetch('/api/update-macro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cpi_file:cpiFile,rin_file:rinFile})}).then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    var msgs=[];
    if(data.cpi&&data.cpi.length){MACRO_CPI.line=data.cpi;msgs.push(L('CPI已更新('+data.cpi.length+'个月)','CPI updated ('+data.cpi.length+' mo)'));}
    if(data.cpi_error)msgs.push(L('CPI错误: ','CPI error: ')+data.cpi_error);
    if(data.rin&&data.rin.length){MACRO_RIN.line=data.rin;msgs.push(L('RIN已更新('+data.rin.length+'个月)','RIN updated ('+data.rin.length+' mo)'));}
    if(data.rin_error)msgs.push(L('RIN错误: ','RIN error: ')+data.rin_error);
    if(msgs.length){renderAll();st.innerHTML='<span style="color:#10B981">'+msgs.join('; ')+'</span>';}
    else st.innerHTML='<span style="color:#EF4444">'+L('更新失败','Update failed')+'</span>';
  }).catch(function(){st.innerHTML='<span style="color:#EF4444">'+L('更新失败，请确保 Flask 服务器已启动','Failed. Make sure Flask server is running.')+'</span>';});
}
function closeUpdateModal(id){
  var m=document.getElementById(id||'updateModal');if(m)m.remove();
  var h=document.getElementById('histModal');if(h&&id!=='histModal')h.remove();
}
document.addEventListener('DOMContentLoaded',function(){
  if(window.IS_STANDALONE)document.getElementById('standaloneBanner').style.display='block';
  if(MACRO_FX.monthly&&!MACRO_FX.line)MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
  briefingData=DATA['en'];
  currentLang='en';
  renderAll();
  updateLangBtn();
  if(!window.IS_STANDALONE)fetchLiveFX();
});
function fetchLiveFX(){
  fetch('/api/macro/fx').then(function(r){if(!r.ok)return;return r.json();}).then(function(d){
    if(!d||!d.rate)return;
    var arr=MACRO_FX.monthly||MACRO_FX.line||[];
    arr[arr.length-1]=d.rate;
    window.MACRO_FX_DATE=(d.date||'').replace(/-/g,'.');
    MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
    renderAll();
  }).catch(function(){});
}
</script>
</body>
