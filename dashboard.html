<style>

.update-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:moFade .2s}
.update-modal{background:#fff;border-radius:14px;padding:24px 28px;width:440px;max-width:90vw;box-shadow:0 24px 80px rgba(0,0,0,.25);animation:moZoom .25s}
.update-modal h3{font-size:17px;font-weight:700;color:#1E293B;margin-bottom:16px}
.update-modal label{display:block;font-size:12px;font-weight:600;color:#64748B;margin-bottom:4px}
.update-modal select,.update-modal input{width:100%;padding:8px 12px;border:1px solid #CBD5E1;border-radius:8px;font-size:13px;margin-bottom:14px;color:#1E293B;background:#fff}
.update-modal .btn-row{display:flex;gap:8px;justify-content:flex-end}
.time-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.time-preset{padding:5px 12px;border-radius:14px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #CBD5E1;background:#fff;color:#64748B;transition:all .12s}
.time-preset:hover,.time-preset.active{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.history-list{max-height:300px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid #E2E8F0;border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.history-item:hover{background:#F8FAFC;border-color:#CBD5E1}
.history-item .hi-title{font-weight:600;font-size:13px;color:#1E293B}
.history-item .hi-meta{font-size:11px;color:#94A3B8}
.history-item .hi-count{font-size:11px;font-weight:600;color:#3B82F6;background:#EEF2FF;padding:2px 8px;border-radius:10px}
.loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid #CBD5E1;border-top-color:#3B82F6;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.standalone-banner{background:#FEF3C7;color:#92400E;text-align:center;padding:6px 16px;font-size:12px;border-bottom:1px solid #FDE68A;display:none}
.standalone-banner code{background:#FDE68A;padding:1px 5px;border-radius:3px;font-size:11px}

.stats-row{max-width:1400px;margin:0 auto;padding:12px 32px 16px;display:flex;flex-direction:column;gap:8px}
.stats-row-total{display:flex;justify-content:center}
.stats-row-sections{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:768px){.stats-row-sections{grid-template-columns:repeat(2,1fr)}}
.stat-pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;cursor:pointer;transition:all .2s;border:2px solid transparent;font-size:13px;font-weight:600;user-select:none;min-width:0}
.stat-pill:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.pill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pill-label{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-count{font-size:14px;font-weight:700;margin-left:auto;flex-shrink:0;background:rgba(255,255,255,.5);padding:1px 8px;border-radius:10px}
.stat-pill.pill-total{background:#1E293B;color:#fff;font-weight:700;border-radius:24px;display:inline-flex}
.stat-pill.pill-total .pill-count{background:rgba(255,255,255,.2)}

.content{max-width:1400px;margin:0 auto;padding:0 32px 60px}
.section{background:#fff;border-radius:14px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden;border-top:4px solid #3B82F6}
.section.s0{border-top-color:#3B82F6}.section.s1{border-top-color:#EF4444}.section.s2{border-top-color:#10B981}
.section.s3{border-top-color:#8B5CF6}.section.s4{border-top-color:#06B6D4}.section.s5{border-top-color:#F59E0B}
.section.s6{border-top-color:#6366F1}.section.s7{border-top-color:#EC4899}.section.tier2{background:#FAFBFC}
.section-header{padding:16px 22px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-header h2{font-size:16px;font-weight:700;color:#1E293B}
.section-header .badge{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;background:#F1F5F9;color:#64748B;white-space:nowrap}
.section-desc{padding:4px 22px 10px;font-size:12px;color:#94A3B8}
.events-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 22px 18px}
@media(max-width:860px){.events-grid{grid-template-columns:1fr}.event-card{flex-direction:column}.event-card .event-img{width:100%!important;min-height:120px;max-height:180px}}
.event-card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;transition:all .2s;display:flex}
.event-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-1px);border-color:#CBD5E1}
.event-card .event-img{width:160px;min-height:140px;flex-shrink:0;position:relative;overflow:hidden}
.event-card .event-img img{width:100%;height:100%;object-fit:cover;display:block}
.event-card .event-img .img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.event-card .event-body{padding:12px 15px;flex:1;min-width:0;display:flex;flex-direction:column}
.event-card .event-meta{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.event-card .event-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.event-tag.date{background:#F1F5F9;color:#64748B}.event-tag.gov{background:#DCFCE7;color:#15803D}
.event-tag.auth{background:#DBEAFE;color:#1D4ED8}.event-tag.source{background:#FEF3C7;color:#A16207}
.event-tag.client{background:#FCE7F3;color:#BE185D}
.event-card .event-preview{font-size:13px;color:#334155;line-height:1.6;flex:1;overflow:visible;max-height:none}
.event-card .event-link{font-size:11px;margin-top:6px;color:#3B82F6;font-weight:500}
.analysis-body{padding:4px 22px 20px;font-size:13px;line-height:1.8;color:#334155}
.analysis-body h3{font-size:15px;font-weight:700;margin:14px 0 6px;color:#1E293B}
.analysis-body ul{padding-left:0;list-style:none}
.analysis-body li{padding:2px 0 2px 18px;position:relative}
.analysis-body li::before{content:"•";position:absolute;left:2px;color:#3B82F6;font-weight:bold}
.tier-divider{text-align:center;padding:16px 0 8px;margin:8px 0}

.footer{text-align:center;padding:20px 32px 40px;color:#94A3B8;font-size:12px;max-width:1400px;margin:0 auto}
.macro-dashboard{background:#fff;border-radius:14px;margin-bottom:18px;padding:16px 22px 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-top:4px solid #1E293B}
.macro-title{font-size:15px;font-weight:700;color:#1E293B;margin-bottom:2px}
.macro-period{font-size:11px;font-weight:400;color:#94A3B8;margin-left:6px}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media(max-width:900px){.macro-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.macro-grid{grid-template-columns:1fr}}
.macro-card{background:#F8FAFC;border-radius:8px;padding:10px 8px 4px;border:1px solid #E2E8F0}
.macro-card-title{font-size:10.5px;font-weight:600;color:#475569;margin-bottom:4px;text-align:center;line-height:1.3;min-height:28px;display:flex;align-items:center;justify-content:center}
.macro-card{position:relative}
.macro-source{position:absolute;top:6px;right:8px;font-size:7.5px;color:#94A3B8;font-weight:500;background:#fff;padding:1px 5px;border-radius:3px;border:1px solid #E2E8F0;z-index:1;pointer-events:none}
.macro-latest{display:flex;justify-content:center;align-items:baseline;gap:4px;margin-top:2px;padding:3px 0}
.macro-latest-label{font-size:9px;color:#94A3B8;font-weight:500}
.macro-latest-val{font-size:15px;font-weight:700;color:#1E293B}
.macro-latest-unit{font-size:9px;color:#64748B;font-weight:500}
.macro-latest-date{font-size:9px;color:#94A3B8}
.macro-note{font-size:9px;color:#94A3B8;margin-top:1px}
.macro-card{cursor:pointer;transition:transform .15s,box-shadow .15s}
.macro-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.macro-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:moFade .2s}
.macro-modal-card{background:#fff;border-radius:16px;padding:24px 28px 18px;width:680px;max-width:94vw;max-height:90vh;overflow-y:auto;cursor:default;box-shadow:0 24px 80px rgba(0,0,0,.25);position:relative;animation:moZoom .25s}
.macro-modal-card .macro-card{border:none;padding:0;background:transparent;cursor:default}
.macro-modal-card .macro-card:hover{transform:none;box-shadow:none}
.macro-modal-card .macro-card-title{font-size:15px;min-height:auto;margin-bottom:10px}
.macro-modal-card .macro-legend,.macro-modal-card [style*=legend]{font-size:11px!important}
.macro-modal-close{position:absolute;top:10px;right:16px;font-size:26px;cursor:pointer;color:#94A3B8;background:none;border:none;line-height:1;z-index:10;padding:4px 8px;border-radius:6px}
.macro-modal-close:hover{color:#475569;background:#F1F5F9}
.macro-data-section{margin-top:14px;border-top:1px solid #E2E8F0;padding-top:10px}
.macro-data-toggle{background:#F8FAFC;border:1px solid #CBD5E1;padding:6px 16px;border-radius:6px;font-size:12px;color:#64748B;cursor:pointer;font-weight:500}
.macro-data-toggle:hover{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.macro-data-table-wrap{margin-top:10px;max-height:340px;overflow-y:auto;border:1px solid #E2E8F0;border-radius:8px}
.macro-data-table{width:100%;border-collapse:collapse;font-size:12px}
.macro-data-table th{background:#F8FAFC;padding:7px 12px;text-align:right;font-weight:600;color:#475569;border-bottom:2px solid #E2E8F0;position:sticky;top:0}
.macro-data-table th:first-child{text-align:left}
.macro-data-table td{padding:5px 12px;text-align:right;border-bottom:1px solid #F1F5F9;color:#334155;font-variant-numeric:tabular-nums}
.macro-data-table td:first-child{text-align:left;color:#64748B;font-weight:500}
.macro-data-table tbody tr:hover td{background:#EEF2FF}
.macro-na{color:#CBD5E1!important}
@keyframes moFade{from{opacity:0}to{opacity:1}}
@keyframes moZoom{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:768px){.header{padding:14px 16px}.header-left h1{font-size:16px}.stats-row{padding:10px 14px;gap:6px}.stat-pill{padding:8px 12px;font-size:12px}.pill-label{font-size:11px}.content{padding:0 12px 40px}.section-header{padding:12px 14px 0}.events-grid{grid-template-columns:1fr;padding:4px 14px 14px}}
</style>

window.EMBEDDED_BRIEFINGS = {"zh": {"topic": "巴拉圭简报", "time_span": "2026年9月6日 — 2026年9月12日", "time_label": "最近一周", "sections": [{"title": "一、宏观经济动态", "tier": 1, "events": [{"title": "美元在触及疫情前低点5,910瓜拉尼后反弹至6,000瓜拉尼上方（2026-09-11）", "date": "2026-09-11", "source_url": "https://www.lanacion.com.py/negocios/2026/09/11/el-dolar-repunta-y-vuelve-a-ubicarse-por-encima-de-los-g-6000/", "source_name": "La Nación", "summary": "9月11日，瓜拉尼连续第二个交易日走弱，推动美元重新站上6,000瓜拉尼上方，此前美元曾触及2019年初以来最低水平。零售报价为5,920瓜拉尼（买入价）和6,020瓜拉尼（卖出价），而巴拉圭央行银行间参考汇率收于6,014.84瓜拉尼，从几天前录得的5,910瓜拉尼年度低点反弹。这一走势是在瓜拉尼同比升值约20%之后出现的——一年前美元兑瓜拉尼汇率接近7,400——推动因素包括创纪录的农产品出口流入、投资级资本流入以及全球美元走软。巴拉圭央行继续表示，当前汇率水平与宏观经济基本面相符。", "image_url": "https://www.lanacion.com.py/resizer/v2/3FF6KK6Y4NAUNGRYQS4NT4JJQ4.jpeg?auth=9cd828e59675908b9c2a014d6bae6a3175875c3a5a67804a37bc2b903aba3788&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "瓜拉尼升值削减出口商本币收入，竞争力担忧加剧（2026-09-11）", "date": "2026-09-11", "source_url": "https://www.lanacion.com.py/negocios/2026/09/11/apreciacion-del-guarani-frente-al-dolar-reduce-ingresos-locales-de-los-exportadores/", "source_name": "La Nación", "summary": "出口商正因本币走强而承受瓜拉尼计价收入的直接冲击：每一美元出口销售收入兑换成的瓜拉尼比一年前少了约20%。大豆、牛肉和谷物产业链——巴拉圭主要的外汇收入来源——即便国际销量强劲，也面临利润率收窄，因为投入成本和本地工资仍以瓜拉尼计价。行业组织警告这会对农村就业和投资产生连锁影响。分析师指出，这种挤压是结构性的而非周期性的，而巴拉圭央行拒绝捍卫某一具体汇率水平，这使得自然对冲（远期合约、成本美元化）成为出口商的实际应对之道。", "image_url": "https://www.lanacion.com.py/resizer/v2/GJ72VNGI4RG4VEBJZWB5VFTNGA.jpg?auth=ee03e7b101f93d50ae84ea1a4f9d7732379a77e567ff80ce617e1a4099e56950&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭央行排除汇市干预可能性，行业商会要求采取行动（2026-09-09）", "date": "2026-09-09", "source_url": "https://marketdata.com.py/noticias/bcp-descarta-intervenir-en-el-mercado-cambiario-y-asegura-que-el-dolar-responde-a-los-fundamentos-economicos-154255/", "source_name": "MarketData", "summary": "巴拉圭中央银行公开排除干预外汇市场的可能性，称瓜拉尼走强反映了真实的宏观基本面：稳健增长、生产率提升、投资级评级上调、国家风险下降以及上半年出口增长23.6%。巴拉圭央行在一份技术报告中警告称，系统性地买入美元以维持人为汇率水平将造成扭曲、通胀压力和准财政成本，并重申其没有汇率目标。这一立场遭到西斯皮、卡佩克斯和阿佩克的反对，这些机构报告了竞争力丧失和利润率侵蚀，而外汇兑换所协会则支持不干预。巴拉圭央行指出，远期合约是出口商可用的对冲工具。", "image_url": "https://marketdata.com.py/wp-content/uploads/2023/09/Superintendencia-de-Valores-abre-sus-puertas-este-lunes-con-nueva-nomina-y-estructura-listas.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "经济学家表示，尽管外部存在不确定性，巴拉圭将继续保持高于地区的增长速度（2026-09-09）", "date": "2026-09-09", "source_url": "https://www.abc.com.py/negocios/2026/09/09/paraguay-mantendra-un-crecimiento-economico-por-encima-del-promedio-regional-afirman-economistas/", "source_name": "ABC Color", "summary": "巴拉圭本地经济学家预计，在农业、服务业、电力和建筑业支撑下，巴拉圭将在2026年和2027年保持高于拉丁美洲平均水平的经济增长。共识预期将2026年GDP增长率定为4.3%——巴拉圭央行自身预测为4.5%，2025年经济增长确认在6%左右——而年末通胀预期已从3.5%下调至3.3%，向3.5%的目标靠拢。分析师提示外部风险：美联储在更长时间内维持较高利率的路径、接近每桶90美元的高位布伦特原油价格以及波动的粮食价格。普遍看法认为，政策利率将在2026年全年维持在5.50%，2027年降至5.25%；巴拉圭央行下一次货币政策会议将于9月21日召开。", "image_url": null, "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": "", "description": "好的，请发送需要翻译的英文内容。"}, {"title": "二、政治与政策变化", "tier": 1, "events": [{"title": "反对派领导人在奥拉西奥·卡特斯住所外抗议时遭拘留，引发政治争端（2026-09-08）", "date": "2026-09-08", "source_url": "https://www.abc.com.py/policiales/2026/09/08/llamar-la-atencion-de-manera-sobrenormal-policia-explica-intervencion-frente-a-casa-de-cartes/", "source_name": "ABC Color", "summary": "亚松森市议员巴勃罗·卡伊索和市政候选人塞巴斯蒂安·加赖均为亲爱祖国党成员，于9月7日在西班牙大道前总统、红党（全国共和协会）领导人奥拉西奥·卡特斯住所外举行的“毛绒玩具示威”中被拘留。此次抗议支持公共部门医生的薪酬诉求。\n\n警察指挥官弗朗西斯科·阿瓦洛斯表示，参与者拒绝离开或表明身份；被拘留者则称遭到镇压，被戴上手铐、带至警察局，并在与公共部联系后获释。\n\n政治反应出现严重分歧，一名执政党众议员支持逮捕行动，而反对派议员——包括约翰娜·奥尔特加、罗西奥·巴列霍和马里奥·帕斯·卡斯坦——警告说，在距亚松森10月4日市政选举不到一个月之际，此事可能开创限制公共自由的先例。", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "副总统阿利亚纳宣布历史性“多余开支”削减，以资助医生和教师的要求（2026-09-11）", "date": "2026-09-11", "source_url": "https://www.lanacion.com.py/politica_edicion_impresa/2026/09/12/alliana-afirma-que-el-pgn-2027-respondera-a-reclamos-sociales/", "source_name": "La Nación", "summary": "副总统佩德罗·阿利亚纳宣布，2027年国家总预算（PGN 2027）将对非必要开支进行历史性削减，以用于满足医疗工会和教师工会的薪资要求，同时坚称削减不得触及选举法院等关键机构。行政机关于9月1日提交的预算草案总额为166.3万亿瓜拉尼（约合257亿美元，增长11.2%），已将卫生列为优先事项，拨款18.2万亿瓜拉尼，教育拨款10.4万亿瓜拉尼，并包括将2390名医生转正，但不包含医务人员的普遍加薪。在10月市政选举前，教师定于9月17日至18日、医生定于9月21日至22日举行罢工，这一宣布将在这一背景下引发一场激烈的国会预算辩论。", "image_url": "https://www.lanacion.com.py/resizer/v2/TV5MDP2MAZGPTNN63AU2SSQTIQ.jpg?auth=07d68545116d59085bac903a7e5a4cff5e9ed49cc85f0681acd1338414266c52&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "巴拉圭投资者通行证上半年筹集3100万美元并签发140份投资证书（2026-09-10）", "date": "2026-09-10", "source_url": "https://www.latribuna.com.py/negocios/economia/2026/09/10/investor-pass-moviliza-usd-31-millones-y-suma-140-certificaciones-de-inversion/", "source_name": "La Tribuna", "summary": "巴拉圭投资者通行证——通过外国投资者认证（CIE）赋予外国投资者直接永久居留权——在2026年上半年签发了140份认证，申报投资额为3103万美元，预计新增1026个正规就业岗位。按投资者人数计巴西居首，按投资额计西班牙居首。该计划依据工业和贸易部第283/2026号决议并与国家移民总局协调设立，最低投资额分别为7万美元（生产性投资，须创造5个正规就业岗位）、15万美元（旅游业）和20万美元（房地产或金融业）。截至7月，更广泛投资体制下的批准额达到4.48亿美元，同比增长32%，其中3.34亿美元为国内资本。", "image_url": "https://www.latribuna.com.py/resizer/v2/QMFHPSQEIJFDZDCSAK2UN2HQDE.jpg?smart=true&auth=69a28cc4c437c51b07fa45fd8e9350eacab9233857ba79b1c665cf60a292386b&width=1200&height=630", "is_gov_source": true, "is_authoritative": true}, {"title": "执政党全国共和协会（红党）否认内部分裂，卡蒂斯派与佩尼亚派紧张关系在市政选举前显现（2026-09-11）", "date": "2026-09-11", "source_url": "https://www.lanacion.com.py/politica/2026/09/11/baruja-descarta-roces-internos-la-anr-atraviesa-su-mejor-momento/", "source_name": "La Nación", "summary": "红党高层人物采取行动，淡化有关总统圣地亚哥·培尼亚与党主席奥拉西奥·卡特斯之间关系破裂的报道。胡安·卡洛斯·巴鲁哈表示，国家共和联盟正处于“最佳时刻”，并否认内部摩擦，而古斯塔沃·莱特排除了决裂的可能性，但承认在政府管理方面存在分歧，尤其是在卫生领域。摩擦加剧的原因是三名“荣誉科罗拉多”派参议员要求巴拉圭央行就乌埃诺银行提交一份报告，以及参议院分裂成三个红党党团争夺议院的控制权。反对派参议员称这一裂痕真实存在且正在加深，而反对派正努力将焦点保持在10月4日市政选举上，然后再转向2028年大选。", "image_url": "https://www.lanacion.com.py/resizer/v2/M57MBCPRXND2HIL22SG34CMOCE.jpg?auth=7d71660beb47a644ff15e1d55288b28c46c988d88e950ccb89aa0401d94967e4&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": "", "description": "请提供需要翻译的英文内容，我会按照您的要求将其完整翻译为简体中文。"}, {"title": "三、社会与安全形势", "tier": 1, "events": [{"title": "全国医生工会（SINAMED）确认，在参议院调解失败后，将于9月21日至22日举行新的全国罢工（2026-09-09）。", "date": "2026-09-09", "source_url": "https://www.infobae.com/america/agencias/2026/09/09/conflicto-entre-medicos-y-gobierno-paraguayo-continua-pese-a-mediacion-del-senado/", "source_name": "Infobae / EFE", "summary": "尽管参议院进行调解，医生与政府之间的冲突仍在继续，全国医生工会正式通知劳工部，将于9月21日至22日举行新的48小时全国罢工。在8月下旬为期五天的全国罢工之后，该工会一致拒绝了政府的薪级方案——为工龄0至5年的医生初步加薪90万瓜拉尼，外加固定的100万瓜拉尼假日津贴。医生们要求将基本工资从500万至540万瓜拉尼（848至916美元）提高到800万瓜拉尼（约1,356美元），并要求双倍假日工资。参议院设立了一个特别危机委员会进行调解，但工资差距仍未解决，医院服务受到严重干扰。", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "卫生部为保障基本服务拒绝446名专科医生辞职；医疗团体出现分歧（2026-09-10）", "date": "2026-09-10", "source_url": "https://efe.com/mundo/2026-09-10/paraguay-deniega-renuncias-medicos/", "source_name": "EFE", "summary": "卫生部长玛丽亚·特蕾莎·巴兰发布决议，拒绝接受数百名公立医院专科医生的辞职，以确保基本医疗服务。此前，辞职人数已升至多达446人，涉及新生儿科、儿科重症监护、小儿外科和麻醉科等关键领域。一组重症监护专科医生同意撤回辞呈，不参加罢工。然而，巴拉圭医生协会和巴拉圭重症医学会澄清，该协议仅涵盖一个群体——并非整个医疗行业——并重申支持全国医生工会的要求，谴责分裂工会的企图。这一分裂使政府孤立罢工领导层的努力变得更加复杂。", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "公立学校教师号召于9月17日至18日举行罢工，扩大反对2027年预算的阵线（2026-09-10）", "date": "2026-09-10", "source_url": "https://www.expreso.ec/internacional/paraguay-discute-presupuesto-2027-acorralado-conflicto-laboral-medico-294995.html", "source_name": "Expreso", "summary": "公立学校教师号召于9月17日至18日举行罢工，要求薪资上调8%并增加教育预算，在国会审议2027年预算之际扩大社会冲突。预算草案为教育拨款10.4万亿瓜拉尼，并规定从2027年1月起为教师加薪2.4%，远低于工会的要求。教师行动紧随医生停工之后，同时卫生预算将增至18.2万亿瓜拉尼（约30.7亿美元），其中药品和耗材支出几乎翻倍，达到约7.72亿美元，另有已确认的卫生部门债务约10.5亿美元。两场罢工都发生在10月4日市政选举之前，推高了达成和解的政治代价。", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "警方在东方市启动“皮亚瓜皮”行动打击摩托车劫匪；内政部长视察上巴拉那（2026-09-10）", "date": "2026-09-10", "source_url": "https://www.laclave.com.py/2026/09/10/policia-lanza-operativo-pya-guapy-para-combatir-frontalmente-a-los-motochorros/", "source_name": "Diario La Clave", "summary": "国家警察在上巴拉那省启动了“皮阿瓜皮（安宁）”行动，命令部队进入“红色区域”——东方市的圣拉斐尔、圣安东尼奥、圣米格尔和雷曼西托街区以及贝伦定居点——以打击摩托车抢劫。12小时内，警员拘留了三名有未执行逮捕令的人员，并在追捕后拘留了第四人。此次行动恰逢内政部长恩里克·里埃拉于9月11日访问东方市，为新的“猞猁小组”驻地揭幕，并宣布增加警员、装备以及翻修约200个警察局。里埃拉因赞扬当地警察局长而受到批评，尽管三国边境地区抢劫、入室抢劫和公路盗抢持续不断。", "image_url": "https://www.laclave.com.py/wp-content/uploads/2026/09/PAG-12-A-4-1400x900.jpg", "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": "", "description": "好的，请发送需要翻译的英文内容。"}, {"title": "四、国际关系与外交动态", "tier": 1, "events": [{"title": "巴拉圭将南方共同市场—欧盟出口配额争端诉至布鲁塞尔，坚持平等享有25%份额（2026-09-08）", "date": "2026-09-08", "source_url": "https://www.latribuna.com.py/negocios/economia/2026/09/08/paraguay-exige-a-la-ue-cuotas-iguales-dentro-del-bloque-mercosur/", "source_name": "La Tribuna", "summary": "外交部长鲁文·拉米雷斯·莱斯卡诺前往布鲁塞尔，推动巴拉圭的要求，即在与欧盟的贸易协定下，南方共同市场四个成员对每一配额均享25%的平等份额。该协定于5月1日开始临时适用。巴拉圭主张自己是唯一的内陆创始成员国，承担更高的物流成本。阿根廷和乌拉圭提议按历史出口平均值分配，巴西则按世界贸易份额分配——三种立场均对巴拉圭不利。9月2日在蒙得维的亚举行的非正式外长会议未达成协议，决定推迟45至60天再作决定；下一次南方共同市场峰会定于12月3日至4日在乌拉圭举行。", "image_url": "https://www.latribuna.com.py/resizer/v2/S35ZTKXR6RG43OKRY7C4Q5WYQQ.jpg?smart=true&auth=a6b33a7caf22043d1e1feecce5950ebe23c8ced8b32891a8a1f360a494f11e47&width=1200&height=630", "is_gov_source": true, "is_authoritative": true}, {"title": "第三届台湾—巴拉圭科技论坛在巴拉圭央行开幕，以人工智能为核心主题（2026-09-11）", "date": "2026-09-11", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/negocios/2026/09/08/tercer-foro-tecnologico-taiwanparaguay-tendra-como-eje-a-la-inteligencia-artificial/", "source_name": "La Nación", "summary": "第三届台湾—巴拉圭科技论坛于9月11日至12日在巴拉圭中央银行会议中心举行，由台湾—巴拉圭理工大学与台湾驻巴拉圭大使馆共同主办，重点讨论人工智能在工业4.0、能源、智慧农业、数字健康、物流、金融创新、网络安全和数字政府等领域的应用。总统圣地亚哥·培尼亚在论坛上表示，巴拉圭已决定不再“坐在看台上观望”，而要成为人工智能革命的主角，并列举了清洁能源、投资级评级和年轻人口等优势。台湾大使伊万·李强调了互补性——巴拉圭的能源和人才与台湾的半导体和数字技术专长相结合——并警示需要推进网络安全、数据保护以及政府—大学—企业之间的协同。", "image_url": "https://www.lanacion.com.py/resizer/v2/QVZLCRWKONHAXPSS7QFV6VA54A.jpeg?auth=65f7725d291939fa18b78a36131dbec614b038d0296bbc5933880aa635a5a4aa&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭瞄准美国新增30万吨牛肉配额的10%，关税暂停90天（2026-09-06）", "date": "2026-09-06", "source_url": "https://www.abc.com.py/negocios/abc-campo/2026/08/29/como-la-carne-paraguaya-puede-ganar-terreno-en-ee-uu-y-que-beneficio-trae-la-suspension-de-aranceles/", "source_name": "ABC Color", "summary": "巴拉圭的目标是争取美国30万吨瘦牛肉修割肉临时配额中最多10%的份额，该配额以“先到先得”方式分配，从9月至11月分三批、每月各10万吨发放。巴拉圭国家动物卫生和质量服务局局长何塞·卡洛斯·马丁表示，该国并不寻求获得全部配额。目前，每年年初共享的6.4万吨“其他国家”配额用完后，巴拉圭牛肉进入美国需缴纳约26.4%的关税，因此这90天的关税暂停是一个难得的窗口。截至8月31日，对美出口量已达3.5万吨，预计2026年全年将接近6万吨，增长约20%。阿根廷和乌拉圭因拥有特定配额而不在此列。", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "工业和商业部与美国商会绘制人工智能、数据中心和巴拉圭-巴拉那水道的贸易与投资机遇图谱（2026-09-08）", "date": "2026-09-08", "source_url": "https://diarioparaguayo.com/noticia/mic-y-amcham-analizan-oportunidades-para-fortalecer-el-comercio-bilateral-y-atraer-inversiones", "source_name": "Diario Paraguayo", "summary": "工业和贸易部于9月8日会见了巴拉圭美国商会，以确定双边贸易和投资机会，重点领域包括技术（人工智能和数据中心）、物流、食品、巴拉圭-巴拉那水道基础设施、近岸外包和粮食安全。此次会议与《贸易与投资框架协定》框架相配合；在该框架下，第四届贸易与投资理事会会议已在亚松森举行，议题涵盖农业、贸易便利化、市场准入、数字贸易与人工智能、不公平贸易做法、知识产权和劳工标准，下一届会议定于华盛顿举行。巴拉圭正将自身定位为与美国保持一致的技术和能源密集型投资目的地。", "image_url": "https://diarioparaguayo.com/uploads/news/news_1785459663_d949681f.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "巴西推动对华贸易协议重燃巴拉圭的台湾问题辩论（2026-09-08）", "date": "2026-09-08", "source_url": "https://www.abc.com.py/politica/2026/07/05/taiwan-interes-del-brasil-de-un-acuerdo-con-china-reavivo-cruce-con-paraguay/", "source_name": "ABC Color", "summary": "巴西总统卢拉推动南方共同市场—中国贸易协定的提议，重新引发了关于巴拉圭对台湾外交承认的辩论。外交部长鲁文·拉米雷斯·莱斯卡诺将台湾关系形容为“红线”，表示巴拉圭不会为了与北京开展贸易而给与台北的关系附加条件或断绝关系，同时仍对商业关系持开放态度。中国外交部发言人郭嘉昆敦促巴拉圭“站在历史正确的一边”。巴拉圭是唯一承认台湾的南美洲国家，也是南方共同市场中唯一与北京没有外交关系的成员，但中国已经是其最大的商品供应国，占进口总额的三分之一以上。", "image_url": null, "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": "", "description": "在巴拉圭首都亚松森这座充满活力的城市，金融区一派繁忙景象。距历史悠久的英雄殿仅一步之遥，巴拉圭中央银行的经济学家们正在分析南方共同市场贸易协定框架下的通胀趋势。这一场景是财经新闻中的常见内容，折射出该国的经济脉搏。"}, {"title": "五、行业专题：通讯、运营商、数字能源与AI", "tier": 1, "events": [{"title": "培尼亚将巴拉圭定位为人工智能主角，依托伊瓜苏数字主权计算中心（2026-09-12）", "date": "2026-09-12", "source_url": "https://www.infobae.com/america/agencias/2026/09/12/pena-dice-que-paraguay-busca-ser-protagonista-de-la-revolucion-de-la-ia/", "source_name": "Infobae / EFE", "summary": "圣地亚哥·培尼亚总统利用台湾—巴拉圭科技论坛，将巴拉圭定位为人工智能革命中的积极参与者，称该国将“上场参赛，而不是在看台上观战”。核心项目是“伊瓜苏数字计划”——该协议于2026年5月与台湾签署，仿照伊泰普两国共有模式（50/50），分三个阶段建设主权人工智能计算中心：10兆瓦，耗资2亿至3亿美元，供国家使用；100兆瓦，耗资30亿至50亿美元；最后1吉瓦阶段，耗资300亿至400亿美元。政府称这是巴拉圭历史上最大的投资。培尼亚还宣布提供7,000个奖学金名额，并指出清洁能源、投资级评级和年轻劳动力是该国的比较优势。", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "工业部招揽构建国内人工智能生态系统的企业（2026-09-11）", "date": "2026-09-11", "source_url": "https://www.lanacion.com.py/negocios/2026/09/11/paraguay-apunta-a-empresas-que-desarrollen-ecosistema-en-ia-afirma-ministro-de-industria/", "source_name": "La Nación", "summary": "工业和商务部长马尔科·里克尔梅表示，巴拉圭正瞄准那些真正建立本土人工智能生态系统的企业，而不仅仅是消费进口技术，并指出能源和林业部门是外国投资的重点方向。他提到打破发电垄断的法律——允许私营企业发电和售电——以及已可加工的10万公顷桉树。该战略将伊瓜苏数字计算项目与台湾-巴拉圭理工大学相结合，后者预计每年培养500多名工程师，并正在增设工程科学硕士学位，其中包括在台湾科技大学的交流环节。政府现在表示，必须解决的关键制约因素是人才供给，而不是资本。", "image_url": "https://www.lanacion.com.py/resizer/v2/YFOUKC2JGNGL7EWGGOE4FFMALE.jpeg?auth=6859d2a2d5f619332780ed4e8608072f83c29a42f253b0a16a6289949154557a&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "巴拉圭国家电力管理局各工会召开全国全体会议，反对能源改革及电费上调风险（2026年9月12日）", "date": "2026-09-12", "source_url": "https://www.ultimahora.com/convocan-a-una-gran-plenaria-en-defensa-de-la-ande-y-contra-el-modelo-energetico-oficial", "source_name": "Última Hora", "summary": "国家电力管理局工人工会及其在国家电力管理局内的结盟工会于9月12日在亚松森召开全国全体会议，围绕五个核心议题展开：能源作为一项人权、扩大社会电价、电力收益的主权与合理使用、拒绝为高耗电企业提供补贴，以及反对国家电力管理局任何形式的私有化。这些工会反对政府设立能源部和能源监管机构的计划；该计划拟通过征收2%的电价附加费提供资金。工会警告称，这将提高用户成本并剥夺国家电力管理局的自主权。塞阿雷研究援引的数据显示，当前平均电价与国家电力管理局覆盖成本所需水平之间存在近39%的差距，部分预测显示电价涨幅可能高达45.6%。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/eddccf1/2147483647/strip/true/crop/1000x563+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F5f%2Ffd%2Fe38daf6a482282ba1f635673b24c%2Fande.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "蜂巢数字公司的100兆瓦伊瓜苏变电站定于9月投运，为人工智能/高性能计算扩张提供支撑（2026-09-12）", "date": "2026-09-12", "source_url": "https://www.hivedigitaltechnologies.com/news/hive-digital-technologies-targets-35-ehs-in-2026-with-newly-signed-100-mw-hydroelectric-expansion-in-paraguay-and-a-5x-growth-in-hpc-and-ai-operations-through-strategic-partnerships-with-bell-canada/", "source_name": "HIVE Digital Technologies", "summary": "蜂巢数字技术公司将于2026年9月在其位于巴拉圭伊瓜苏的场址投运一座100兆瓦变电站，土建工程已经完成，使该设施在伊泰普水电基础上达到其设计的300兆瓦容量。一座三级数据中心的建设计划于2026年秋季开工，目标在2027年下半年投入服务。此次扩建是在2025年4月和9月完成一期和二期工程之后进行的，并支持蜂巢公司实现2026年全球比特币算力超过35 EH/s的目标，同时实现高性能计算和人工智能业务五倍增长。哥伦比亚大学此前的一项研究验证了在蜂巢公司巴拉圭图形处理器上进行跨洲人工智能训练的可行性，进一步巩固了该国作为人工智能算力中心的定位。", "image_url": "https://www.hivedigitaltechnologies.com/static/hivesite/images/banner.webp", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": "", "description": "您给出了详细的翻译指令，但似乎没有附上需要翻译的英文内容。请提供待翻译的巴拉圭宏观经济简报英文原文，我将严格按照您的要求进行翻译。"}, {"title": "六、主要客户动向", "tier": 1, "events": [{"title": "努比科姆的5G牌照受到审查：总审计长对在10月13日基站截止日期前启动商用提出质疑（2026-09-07）", "date": "2026-09-07", "source_url": "https://www.abc.com.py/economia/2026/08/17/donde-estan-los-clientes-y-las-radiobases-de-nubicom-conatel-alega-que-hay-indicios-de-que-ofrecera-telefonia/", "source_name": "ABC Color", "summary": "努比科姆面临日益加大的监管压力：总审计长的专项审计发现，相关文件仅能证明其进行了初步技术运营——没有活跃用户、合同、计费或商业流量——并警告称，若该公司无法证明提供了有效服务，可能会被吊销5G牌照。国家电信委员会坚称，努比科姆于2026年4月在亚松森的维拉莫拉区开始商业5G运营，仅设有一座基站；并表示有“迹象”显示，该公司在申请网络运营商编号和码号资源后，还将提供移动电话服务。牌照要求努比科姆在2026年10月13日前在全国部署22座基站；部署核查定于10月进行，届时可能启动行政程序，处罚可能包括罚款直至吊销牌照。", "image_url": null, "is_gov_source": true, "is_authoritative": true, "client_tag": "Nubicom — 5G licence compliance risk"}, {"title": "蒂戈（米利康）转向5G与基础设施：取得2.3 GHz频谱，向阿蒂斯出售281座铁塔并签订15年回租协议（2026年9月7日）", "date": "2026-09-07", "source_url": "https://www.telesemana.com/blog/2026/08/06/segunda-subasta-5g-en-paraguay-tigo-se-queda-con-2-3-ghz-y-personal-con-3-7-ghz/", "source_name": "Telesemana", "summary": "米雷康姆旗下巴拉圭子公司特莱塞尔在巴拉圭国家电信委员会第二次5G拍卖中以160万美元获得2.3–2.4 GHz频段，加上其现有2300/2600 MHz频段中的50 MHz频谱。该牌照要求90天内完成详细工程设计，180天内（即2027年2月前）实现商用启动，两年内建设至少10个服务于国家机构的基站，四年内在全国建设100个基站，并强制要求共享无源基础设施。米雷康姆首席执行官马塞洛·贝尼特斯表示，铁塔、天线和电气设备已具备5G就绪条件。与此同时，巴拉圭竞争管理局批准了阿蒂斯集团收购米雷康姆旗下铁塔公司拉蒂巴拉圭的交易，该公司拥有281座铁塔，交易采取15年期售后回租安排。美洲开发银行投资部和普罗帕科承诺向米雷康姆提供1亿美元，用于包括巴拉圭在内的光纤和移动网络现代化。", "image_url": "https://www.telesemana.com/wp-content/uploads/2025/04/FWA.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo / Millicom — 5G rollout & tower monetization"}, {"title": "个人（核心股份公司）赢得3.7 GHz 5G频段，并连续第五年保持固定网络排名第一（2026-09-07）", "date": "2026-09-07", "source_url": "https://blog.nperf.com/mejores-redes-fijas-en-paraguay-2026-personal-lidera-por-quinto-ano-consecutivo/", "source_name": "nPerf", "summary": "作为阿根廷电信子公司的Núcleo S.A.以Personal品牌运营，在巴拉圭国家电信委员会第二次5G拍卖中以100万美元获得3.7–3.8 GHz频段，须履行与Tigo相同的90天工程设计和180天商业启动义务，截止日期为2027年2月。在固定网络方面，nPerf的2026年晴雨表显示，Personal连续第五年在巴拉圭固定网络中排名第一，领先于Claro和Tigo，其光纤套餐可提供400 Mbps下行和100 Mbps上行速度，月费约15万瓜拉尼起，Claro则提供600 Mbps。Tigo和Personal的5G承诺合计约7900万至8000万美元，五年内部署约750个基站，项目覆盖250至500个站点。", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal / Núcleo S.A. — 5G licence & fixed-network leadership"}, {"title": "克拉罗以100个基站引领5G建设，而努比科姆仅有一个（2026-09-07）", "date": "2026-09-07", "source_url": "https://dplnews.com/paraguay-claro-instala-100-radiobases-5g-nubicom-tiene-una/", "source_name": "DPL News", "summary": "克拉罗（AMX巴拉圭、美洲移动）仍是巴拉圭5G部署中遥遥领先的运营商，已安装100个基站，而努比科姆仅有一个运营站点。克拉罗在2025年拍卖中获得3.5吉赫频段200兆赫频谱，初始投资为3500万美元，并于2025年12月率先商用，使用诺基亚AirScale设备和大规模MIMO无线电。其第一阶段覆盖大亚松森、埃斯特城、恩卡纳西翁、科罗内尔·奥维耶多和佩德罗·胡安·卡瓦列罗。三家运营商——克拉罗、蒂戈和个人电信——构成的5G格局，如今与努比科姆停滞不前的部署形成鲜明对比，后者仍处于总审计长审计和监管风险之中。", "image_url": "https://dplnews.com/wp-content/uploads/2025/10/dplnews_claro_mc21025.png", "is_gov_source": false, "is_authoritative": true, "client_tag": "Claro / AMX Paraguay — 5G network leadership"}], "impact_analysis": "", "user_notes": "", "description": "请提供需要翻译的英文内容。"}, {"title": "七、对企业经营的综合影响分析", "tier": 2, "events": [], "impact_analysis": "🟡 货币制度是主导操作变量：瓜拉尼在9月11日反弹至G. 6,000上方（巴拉圭央行银行间汇率G. 6,014.84），此前一度触及疫情前低点G. 5,910，录得约20%的同比升值。巴拉圭央行现已公开并明确排除为捍卫某一汇率水平而进行干预，并将这一强势归因于基本面驱动（经济增长、投资级评级、上半年出口增长23.6%）。对于任何拥有美元收入和瓜拉尼成本的企业——出口商、旅游业、以美元计价的服务合同——利润率会机械性地压缩；实际的对冲工具是远期合约，巴拉圭央行自身也在推广这一工具。对于进口商和以瓜拉尼融资的资本支出而言，购买力处于多年高位，这几乎是近十年来最有利的采购窗口。\n\n🔴 社会冲突现在是进度风险，而非背景噪音：医生罢工已确认于9月21日至22日举行，教师罢工于9月17日至18日举行，政府正在拒绝446名专科医生的辞呈以维持医院运转。两场罢工都发生在10月4日市镇选举之前，这在结构上压缩了政府在薪资问题上让步的空间。预计公立医院服务将出现间歇性中断，全体会议和罢工日期前后可能出现道路封锁（包括9月12日国家电力管理局工会全体会议），国会立法注意力在9月至10月期间将被分散。凡是依赖公共部门审批、港口和海关吞吐量或罢工日陆路运输的进度安排，都应留出缓冲。\n\n🟢 预算和公共采购正转向卫生、教育和安全领域：2027年国家总预算草案（257亿美元，增长11.2%）将新增资金的76%用于行政权，其中卫生拨款18.2万亿瓜拉尼，药品和耗材支出几乎翻倍，达到约7.72亿美元；公共工程和通信部获得9.2万亿瓜拉尼，另有道路、疏浚以及供水和环境卫生方面的追加资金。副总统阿利亚纳宣布“历史性”削减多余开支，以满足薪资诉求。医疗设备、药品、医院信息技术和供水基础设施的公开招标最有可能在2027年增加。\n\n🔴 能源改革是数据中心经济的关键摇摆因素：政府计划设立能源部以及一个由2%电价附加费资助的监管机构，但面临有组织的工会抵制（9月12日全体会议；接近39%的电价缺口研究）。巴拉圭国家电力公司（ANDE）与阿托梅（Atome）之间的绿氢电价谈判已暂停，原因是该电力公司拒绝锁定为期15年的低价电价。任何人工智能/数据中心的商业论证都取决于长期、可融资的电力价格；而这一框架仍未立法，电价缺口计算（巴拉圭国家电力公司每年需要约6亿美元用于投资）意味着工业电价面临的上涨压力是基准情形，而非例外。", "user_notes": "", "description": "请提供需要翻译的英文内容，我会按照您的要求将其完整翻译为简体中文。"}, {"title": "八、对中资企业的专项影响与建议", "tier": 2, "events": [], "impact_analysis": "🔴 Geopolitical Channel Remains Closed for Direct Public-Sector Participation: Paraguay reaffirmed its Taiwan alignment during the September 11–12 Taiwan–Paraguay Technology Forum (AI-centred, at the BCP) and through Foreign Minister Ramírez Lezcano's 'red line' framing against a Mercosur–China deal. The 5G auction rules require supply-chain security standards and commercial/diplomatic reciprocity that indirectly exclude Chinese vendors; both Tigo and Personal stayed out of the 2025 round for this reason, and the requirement persists in the 2026 second auction. Chinese firms should not bid directly into CONATEL, ANDE, state data-centre or critical-infrastructure tenders, and should route any engagement through locally incorporated partners with independent compliance review.\n\n🟢 进口与设备供应是开放且能产生现金的通道：随着瓜拉尼汇率接近1美元兑6000瓜拉尼，外汇远期余额已飙升约30%，达到20.5亿美元，进口购买力处于多年高位，而巴拉圭央行正积极推广远期合约作为对冲工具。中国电信无源基础设施、电力设备、光纤、医疗设备和一般工业品供应商所销售的市场，买方本币成本正处于历史低位。这是确定性最高的商业通道，且不需要外交层面的接触——但需将远期合约成本计入价格，并预计买方会要求以瓜拉尼计价或对冲的条款。\n\n🟡 5G部署周期是两年的设备需求窗口：蒂戈（2.3吉赫，160万美元）和佩尔索纳尔（3.7吉赫，100万美元）必须在2027年2月前启动商用，并将在五年内联合部署约750个基站和7900万至8000万美元，每家各建100个基站，10%预留给国家机构。它们选用的供应商为非中国厂商（克拉罗使用诺基亚），因此直接无线接入设备销售实际上已被排除——但铁塔、无源基础设施（阿蒂斯现拥有281座原属米利康的铁塔，按15年售后回租协议持有）、电力系统、光纤和站址土建工程仍有切入空间。努比康的许可证正在接受总审计署审计，其22个基站应于10月13日建成，但只有1个在运行，属于高风险交易对手：在开展任何业务前须核实付款保障。\n\n🟡 人工智能/数据中心雄心超出其电力框架——观望，勿贸然承诺：伊瓜苏数字项目（一期10兆瓦，2–3亿美元；终期1吉瓦，300–400亿美元）以及HIVE公司100兆瓦伊瓜苏变电站于9月通电，均表明势头真实存在，且政府正明确招揽生态系统建设者，而非技术消费者。然而，电价、国家电力管理局改革立法以及Atome项目暂停均未解决，而人工智能劳动力被明确列为约束性瓶颈。中国数据中心工程总承包、冷却及配电供应商应在承诺前跟踪国家电力管理局监管框架及2027年预算结果——采购触发因素将是立法确定的电价制度，而非新闻稿。", "user_notes": "", "description": "请提供需要翻译的英文内容，我会将其完整翻译为简体中文。"}]}, "en": {"topic": "Paraguay Briefing", "time_span": "September 6 – September 12, 2026", "time_label": "Last week", "sections": [{"title": "I. Macroeconomic Developments", "tier": 1, "events": [{"title": "Dollar Rebounds Above G. 6,000 After Touching Pre-Pandemic Low of G. 5,910 (2026-09-11)", "date": "2026-09-11", "source_url": "https://www.lanacion.com.py/negocios/2026/09/11/el-dolar-repunta-y-vuelve-a-ubicarse-por-encima-de-los-g-6000/", "source_name": "La Nación", "summary": "The guaraní weakened for a second straight session on September 11, pushing the dollar back above G. 6,000 after the currency had touched its lowest level since early 2019. Retail quotes stood at G. 5,920 (bid) and G. 6,020 (ask), while the BCP interbank reference closed at G. 6,014.84, rebounding from the annual floor of G. 5,910 recorded days earlier. The move follows a roughly 20% year-on-year appreciation of the guaraní — a year ago the dollar traded near G. 7,400 — driven by record agricultural export inflows, investment-grade capital flows and a softer global dollar. The central bank continues to describe the level as consistent with macroeconomic fundamentals.", "image_url": "https://www.lanacion.com.py/resizer/v2/3FF6KK6Y4NAUNGRYQS4NT4JJQ4.jpeg?auth=9cd828e59675908b9c2a014d6bae6a3175875c3a5a67804a37bc2b903aba3788&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Guaraní Appreciation Cuts Local Income of Exporters as Competitiveness Concerns Mount (2026-09-11)", "date": "2026-09-11", "source_url": "https://www.lanacion.com.py/negocios/2026/09/11/apreciacion-del-guarani-frente-al-dolar-reduce-ingresos-locales-de-los-exportadores/", "source_name": "La Nación", "summary": "Exporters are absorbing a direct hit to guaraní-denominated revenue as the currency strengthens: every dollar of export sales converts into roughly 20% fewer guaraníes than a year ago. Soybean, beef and grains complexes — Paraguay's main foreign-exchange earners — face compressed margins even with strong international volumes, because input costs and local payroll remain in guaraní. Sector associations warn of knock-on effects on rural employment and investment. Analysts note the squeeze is structural rather than cyclical while the BCP declines to defend a specific exchange-rate level, making natural hedging (forwards, cost dollarization) the practical remedy for exporters.", "image_url": "https://www.lanacion.com.py/resizer/v2/GJ72VNGI4RG4VEBJZWB5VFTNGA.jpg?auth=ee03e7b101f93d50ae84ea1a4f9d7732379a77e567ff80ce617e1a4099e56950&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "BCP Rules Out Currency-Market Intervention as Industry Chambers Demand Action (2026-09-09)", "date": "2026-09-09", "source_url": "https://marketdata.com.py/noticias/bcp-descarta-intervenir-en-el-mercado-cambiario-y-asegura-que-el-dolar-responde-a-los-fundamentos-economicos-154255/", "source_name": "MarketData", "summary": "The Central Bank of Paraguay publicly ruled out intervening in the foreign-exchange market, arguing the guaraní's strength reflects genuine macro fundamentals: solid growth, productivity gains, the investment-grade upgrade, lower country risk and first-half export growth of 23.6%. In a technical note the BCP warned that systematically buying dollars to hold an artificial level would generate distortions, inflationary pressure and quasi-fiscal costs, and reiterated it has no exchange-rate target. The position met pushback from Cispy, Capex and Appec, which reported lost competitiveness and margin erosion, while the association of exchange houses backed non-intervention. The BCP pointed to forward contracts as the available hedging tool for exporters.", "image_url": "https://marketdata.com.py/wp-content/uploads/2023/09/Superintendencia-de-Valores-abre-sus-puertas-este-lunes-con-nueva-nomina-y-estructura-listas.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "Economists Say Paraguay Will Keep Outgrowing the Region Despite External Uncertainty (2026-09-09)", "date": "2026-09-09", "source_url": "https://www.abc.com.py/negocios/2026/09/09/paraguay-mantendra-un-crecimiento-economico-por-encima-del-promedio-regional-afirman-economistas/", "source_name": "ABC Color", "summary": "Local economists expect Paraguay to sustain growth above the Latin American average through 2026 and 2027, supported by agriculture, services, electricity and construction. Consensus estimates put 2026 GDP growth at 4.3% — with the BCP's own projection at 4.5% and 2025 growth confirmed around 6% — while year-end inflation expectations were revised down to 3.3% from 3.5%, converging toward the 3.5% target. Analysts flag external risks: a higher-for-longer US Federal Reserve path, elevated Brent crude near USD 90 per barrel and volatile grain prices. The consensus view is that the policy rate will stay at 5.50% through 2026 before easing to 5.25% in 2027, with the next BCP monetary policy meeting on September 21.", "image_url": null, "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "II. Political & Policy Developments", "tier": 1, "events": [{"title": "Detention of Opposition Leaders at Protest Outside Horacio Cartes' Residence Sparks Political Row (2026-09-08)", "date": "2026-09-08", "source_url": "https://www.abc.com.py/policiales/2026/09/08/llamar-la-atencion-de-manera-sobrenormal-policia-explica-intervencion-frente-a-casa-de-cartes/", "source_name": "ABC Color", "summary": "Asunción councilman Pablo Callizo and municipal candidate Sebastián Garay, both of Partido Patria Querida, were detained on September 7 during a 'stuffed-toy demonstration' on Avenida España outside the residence of former president and ANR leader Horacio Cartes. The protest backed public-sector doctors' pay demands. Police commander Francisco Ávalos said participants refused to move or identify themselves; the detainees alleged repression, were handcuffed, taken to a police station and released after contact with the Public Ministry. Political reactions split sharply, with a ruling-party deputy endorsing the arrests and opposition legislators — including Johanna Ortega, Rocío Vallejo and Mario Paz Castaing — warning of a precedent restricting public freedoms less than a month before Asunción's October 4 municipal elections.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Vice President Alliana Announces Historic 'Superfluous Spending' Cut to Fund Doctors' and Teachers' Demands (2026-09-11)", "date": "2026-09-11", "source_url": "https://www.lanacion.com.py/politica_edicion_impresa/2026/09/12/alliana-afirma-que-el-pgn-2027-respondera-a-reclamos-sociales/", "source_name": "La Nación", "summary": "Vice President Pedro Alliana announced that the 2027 national budget (PGN 2027) will carry a historic cut in superfluous spending to fund the salary demands of the medical and teaching unions, while insisting the reductions must not touch essential bodies such as the Electoral Court. The Executive's draft budget, submitted September 1 and totalling G. 166.3 trillion (about USD 25.7 billion, up 11.2%), already prioritizes health at G. 18.2 trillion and education at G. 10.4 trillion, and includes the formalization of 2,390 doctors but no general medical pay raise. The announcement sets up a contentious congressional budget debate against a backdrop of strikes scheduled for September 17–18 (teachers) and September 21–22 (doctors) ahead of October municipal elections.", "image_url": "https://www.lanacion.com.py/resizer/v2/TV5MDP2MAZGPTNN63AU2SSQTIQ.jpg?auth=07d68545116d59085bac903a7e5a4cff5e9ed49cc85f0681acd1338414266c52&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "Paraguay Investor Pass Mobilizes USD 31 Million and 140 Investment Certificates in First Half (2026-09-10)", "date": "2026-09-10", "source_url": "https://www.latribuna.com.py/negocios/economia/2026/09/10/investor-pass-moviliza-usd-31-millones-y-suma-140-certificaciones-de-inversion/", "source_name": "La Tribuna", "summary": "Paraguay's Investor Pass — which grants direct permanent residency to foreign investors via Foreign Investor Certification (CIE) — generated 140 certifications and USD 31.03 million in declared investment in the first half of 2026, with a projected 1,026 new formal jobs. Brazil led by number of investors and Spain by volume. The program, created by MIC Resolution 283/2026 in coordination with the National Migration Directorate, sets minimum investments of USD 70,000 (productive, with five formal jobs), USD 150,000 (tourism), and USD 200,000 (real estate or financial). Approvals under the broader investment regime reached USD 448 million through July, up 32% year-on-year, of which USD 334 million was domestic capital.", "image_url": "https://www.latribuna.com.py/resizer/v2/QMFHPSQEIJFDZDCSAK2UN2HQDE.jpg?smart=true&auth=69a28cc4c437c51b07fa45fd8e9350eacab9233857ba79b1c665cf60a292386b&width=1200&height=630", "is_gov_source": true, "is_authoritative": true}, {"title": "Ruling ANR Party Denies Internal Split as Cartismo–Peñismo Tensions Surface Before Municipal Vote (2026-09-11)", "date": "2026-09-11", "source_url": "https://www.lanacion.com.py/politica/2026/09/11/baruja-descarta-roces-internos-la-anr-atraviesa-su-mejor-momento/", "source_name": "La Nación", "summary": "Senior Colorado Party figures moved to tamp down reports of a rupture between President Santiago Peña and party leader Horacio Cartes. Juan Carlos Baruja said the ANR is enjoying 'its best moment' and dismissed internal friction, while Gustavo Leite ruled out a break but acknowledged differences over government management, particularly in health. The friction has been fuelled by three Honor Colorado senators' request for a BCP report on ueno bank, and by the Senate splitting into three Colorado benches contesting control of the chamber. Opposition senators describe the rift as real and deepening, while the opposition is trying to keep its focus on the October 4 municipal elections before turning to 2028.", "image_url": "https://www.lanacion.com.py/resizer/v2/M57MBCPRXND2HIL22SG34CMOCE.jpg?auth=7d71660beb47a644ff15e1d55288b28c46c988d88e950ccb89aa0401d94967e4&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "III. Social & Security Landscape", "tier": 1, "events": [{"title": "Doctors' Union SINAMED Confirms New National Strike for September 21–22 as Senate Mediation Fails (2026-09-09)", "date": "2026-09-09", "source_url": "https://www.infobae.com/america/agencias/2026/09/09/conflicto-entre-medicos-y-gobierno-paraguayo-continua-pese-a-mediacion-del-senado/", "source_name": "Infobae / EFE", "summary": "The doctors–government conflict continued despite Senate mediation, with SINAMED formally notifying the Labour Ministry of a new 48-hour national strike on September 21–22. The union had unanimously rejected the government's salary-scale offer — a G. 900,000 initial increase for doctors with 0–5 years of service plus a fixed G. 1,000,000 holiday payment — after a five-day national stoppage in late August. Doctors are demanding the base salary rise from between G. 5.0 and 5.4 million (USD 848–916) to G. 8 million (about USD 1,356) plus double holiday pay. The Senate installed a special crisis committee to mediate, but the salary gap remains unresolved and hospital services are seriously disrupted.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Health Ministry Denies Resignations of 446 Specialists to Protect Essential Services; Medical Groups Split (2026-09-10)", "date": "2026-09-10", "source_url": "https://efe.com/mundo/2026-09-10/paraguay-deniega-renuncias-medicos/", "source_name": "EFE", "summary": "Health Minister María Teresa Barán issued a resolution denying the resignations of hundreds of public-hospital specialists in order to guarantee essential services, after the number of resignations rose to as many as 446 in critical areas such as neonatology, pediatric intensive care, pediatric surgery and anesthesiology. A group of critical-care specialists agreed to withdraw their resignations and not join the strike. However, the Círculo Paraguayo de Médicos and the Paraguayan Society of Critical Medicine clarified that the agreement covers only one sector — not the profession as a whole — and reaffirmed support for SINAMED's demands, denouncing attempts to divide the union. The split complicates the government's effort to isolate the strike leadership.", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "Public-School Teachers Call Strike for September 17–18, Widening the Front Against the 2027 Budget (2026-09-10)", "date": "2026-09-10", "source_url": "https://www.expreso.ec/internacional/paraguay-discute-presupuesto-2027-acorralado-conflicto-laboral-medico-294995.html", "source_name": "Expreso", "summary": "Public-school teachers called a strike for September 17–18 demanding an 8% salary adjustment and a larger education budget, broadening social conflict as Congress debates the 2027 budget. The draft allocates G. 10.4 trillion to education and provides a 2.4% raise for teachers from January 2027, far below the union's demand. The teachers' action follows the doctors' stoppage and sits alongside a health budget that would rise to G. 18.2 trillion (about USD 3.07 billion) with medicine and supplies spending nearly doubling to roughly USD 772 million, alongside a recognized health-sector debt of about USD 1.05 billion. Both strikes land before the October 4 municipal elections, raising the political cost of a settlement.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Police Launch 'Py'a Guapy' Operation Against Motorcycle Robbers in Ciudad del Este; Interior Minister Visits Alto Paraná (2026-09-10)", "date": "2026-09-10", "source_url": "https://www.laclave.com.py/2026/09/10/policia-lanza-operativo-pya-guapy-para-combatir-frontalmente-a-los-motochorros/", "source_name": "Diario La Clave", "summary": "The National Police launched operation 'Py'a Guapy' (Tranquility) in Alto Paraná, ordering units into 'red zones' — the San Rafael, San Antonio, San Miguel and Remansito neighbourhoods of Ciudad del Este plus the Belén settlement — to combat motorcycle-borne robbery. Within 12 hours officers detained three people with outstanding arrest warrants and a fourth after a pursuit. The operation coincided with Interior Minister Enrique Riera's visit to Ciudad del Este on September 11 to open a new Grupo Lince pavilion and announce additional officers, equipment and the refurbishment of some 200 police stations. Riera drew criticism for praising the local police chief despite persistent robberies, home invasions and highway piracy in the tri-border area.", "image_url": "https://www.laclave.com.py/wp-content/uploads/2026/09/PAG-12-A-4-1400x900.jpg", "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "IV. International Relations & Diplomacy", "tier": 1, "events": [{"title": "Paraguay Takes Mercosur–EU Export Quota Dispute to Brussels, Insisting on Equal 25% Shares (2026-09-08)", "date": "2026-09-08", "source_url": "https://www.latribuna.com.py/negocios/economia/2026/09/08/paraguay-exige-a-la-ue-cuotas-iguales-dentro-del-bloque-mercosur/", "source_name": "La Tribuna", "summary": "Foreign Minister Rubén Ramírez Lezcano travelled to Brussels to press Paraguay's demand for an equal 25% share of each quota for all four Mercosur members under the trade agreement with the EU, which entered provisional application on May 1. Paraguay argues it is the only landlocked founding member and absorbs higher logistics costs. Argentina and Uruguay propose allocating by historical export averages and Brazil by share of world trade — three positions aligned against Paraguay. A September 2 informal foreign ministers' meeting in Montevideo ended without agreement, deferring the decision 45–60 days; the next Mercosur summit is set for December 3–4 in Uruguay.", "image_url": "https://www.latribuna.com.py/resizer/v2/S35ZTKXR6RG43OKRY7C4Q5WYQQ.jpg?smart=true&auth=a6b33a7caf22043d1e1feecce5950ebe23c8ced8b32891a8a1f360a494f11e47&width=1200&height=630", "is_gov_source": true, "is_authoritative": true}, {"title": "Third Taiwan–Paraguay Technology Forum Opens at BCP with Artificial Intelligence as Central Theme (2026-09-11)", "date": "2026-09-11", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/negocios/2026/09/08/tercer-foro-tecnologico-taiwanparaguay-tendra-como-eje-a-la-inteligencia-artificial/", "source_name": "La Nación", "summary": "The third Taiwan–Paraguay Technology Forum was held on September 11–12 at the Central Bank of Paraguay convention centre, organized by the Taiwan–Paraguay Polytechnic University with Taiwan's embassy, focused on artificial intelligence across Industry 4.0, energy, smart agriculture, digital health, logistics, financial innovation, cybersecurity and digital government. President Santiago Peña told the forum that Paraguay has decided not to 'watch from the stands' but to be a protagonist of the AI revolution, citing clean energy, investment-grade status and a young population. Taiwan's ambassador Iván Lee highlighted complementarity — Paraguayan energy and talent paired with Taiwanese semiconductors and digital expertise — and warned of the need to advance cybersecurity, data protection and state-university-enterprise coordination.", "image_url": "https://www.lanacion.com.py/resizer/v2/QVZLCRWKONHAXPSS7QFV6VA54A.jpeg?auth=65f7725d291939fa18b78a36131dbec614b038d0296bbc5933880aa635a5a4aa&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay Targets 10% of New US 300,000-Tonne Beef Quota as Tariffs Are Suspended for 90 Days (2026-09-06)", "date": "2026-09-06", "source_url": "https://www.abc.com.py/negocios/abc-campo/2026/08/29/como-la-carne-paraguaya-puede-ganar-terreno-en-ee-uu-y-que-beneficio-trae-la-suspension-de-aranceles/", "source_name": "ABC Color", "summary": "Paraguay aims to capture up to 10% of the United States' temporary 300,000-tonne quota of lean beef trimmings, distributed in three monthly 100,000-tonne tranches from September through November under a 'first come, first served' allocation. Senacsa president José Carlos Martin said the country is not seeking the entire volume. Paraguayan beef currently enters the US paying about 26.4% tariffs once the shared 64,000-tonne 'other countries' quota is exhausted early each year, so the 90-day suspension is an unusual window. Shipments to the US reached 35,000 tonnes through August 31 and are projected to close 2026 near 60,000 tonnes, roughly 20% growth. Argentina and Uruguay are excluded because they hold specific quotas.", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "MIC and Amcham Map Trade and Investment Opportunities in AI, Data Centres and the Paraguay-Paraná Waterway (2026-09-08)", "date": "2026-09-08", "source_url": "https://diarioparaguayo.com/noticia/mic-y-amcham-analizan-oportunidades-para-fortalecer-el-comercio-bilateral-y-atraer-inversiones", "source_name": "Diario Paraguayo", "summary": "The Ministry of Industry and Commerce met the American Chamber of Commerce in Paraguay on September 8 to identify bilateral trade and investment opportunities, with emphasis on technology — artificial intelligence and data centres — logistics, food, Paraguay-Paraná waterway infrastructure, nearshoring and food security. The meeting sits alongside the TIFA framework, under which the fourth meeting of the Trade and Investment Council was held in Asunción covering agriculture, trade facilitation, market access, digital trade and AI, unfair trade practices, intellectual property and labour standards, with the next session scheduled in Washington. Paraguay is positioning itself as a US-aligned destination for technology and energy-intensive investment.", "image_url": "https://diarioparaguayo.com/uploads/news/news_1785459663_d949681f.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "Brazil's Push for a China Trade Deal Revives Paraguay's Taiwan Debate (2026-09-08)", "date": "2026-09-08", "source_url": "https://www.abc.com.py/politica/2026/07/05/taiwan-interes-del-brasil-de-un-acuerdo-con-china-reavivo-cruce-con-paraguay/", "source_name": "ABC Color", "summary": "Brazilian President Lula's proposal to advance a Mercosur–China trade agreement revived the debate over Paraguay's diplomatic recognition of Taiwan. Foreign Minister Rubén Ramírez Lezcano has described the Taiwan relationship as a 'red line', stating Paraguay will not condition or break ties with Taipei in exchange for trade with Beijing, while remaining open to commercial relations. China's foreign ministry spokesman Guo Jiakun urged Paraguay to 'stand on the right side of history'. Paraguay is the only South American country recognizing Taiwan and the only Mercosur member without diplomatic relations with Beijing, yet China is already its largest supplier of goods, accounting for more than a third of imports.", "image_url": null, "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "V. Industry Focus: Telecom, Digital Energy & AI", "tier": 1, "events": [{"title": "Peña Positions Paraguay as an AI Protagonist, Anchored on Yguazú Digital Sovereign Compute Centre (2026-09-12)", "date": "2026-09-12", "source_url": "https://www.infobae.com/america/agencias/2026/09/12/pena-dice-que-paraguay-busca-ser-protagonista-de-la-revolucion-de-la-ia/", "source_name": "Infobae / EFE", "summary": "President Santiago Peña used the Taiwan–Paraguay Technology Forum to position Paraguay as an active player in the AI revolution, saying the country will 'play the match on the field, not watch from the stands'. The centrepiece is Yguazú Digital, an agreement signed with Taiwan in May 2026 modelled on the binational Itaipú structure (50/50), to build a sovereign AI computing centre in three phases: 10 MW for USD 200–300 million for state use; 100 MW for USD 3–5 billion; and a final 1 GW phase for USD 30–40 billion. The government describes it as the largest investment in Paraguay's history. Peña also announced 7,000 scholarships and pointed to clean energy, investment-grade status and a young workforce as the country's comparative advantages.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Industry Ministry Courts Companies That Build a Domestic AI Ecosystem (2026-09-11)", "date": "2026-09-11", "source_url": "https://www.lanacion.com.py/negocios/2026/09/11/paraguay-apunta-a-empresas-que-desarrollen-ecosistema-en-ia-afirma-ministro-de-industria/", "source_name": "La Nación", "summary": "Industry and Commerce Minister Marco Riquelme said Paraguay is targeting companies that develop a genuine domestic AI ecosystem rather than merely consume imported technology, citing the energy and forestry sectors as the priority axes for foreign investment. He pointed to the law that demonopolizes electricity generation — allowing private firms to generate and sell power — and to 100,000 hectares of eucalyptus ready for processing. The strategy pairs the Yguazú Digital compute project with the Taiwan–Paraguay Polytechnic University, which expects to graduate more than 500 engineers a year and is adding a Master's in Engineering Science with an exchange component at Taiwan Tech. Talent supply, not capital, is the binding constraint the government now says it must solve.", "image_url": "https://www.lanacion.com.py/resizer/v2/YFOUKC2JGNGL7EWGGOE4FFMALE.jpeg?auth=6859d2a2d5f619332780ed4e8608072f83c29a42f253b0a16a6289949154557a&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "ANDE Unions Convene National Plenary Against Energy Reform and Tariff Increase Risk (2026-09-12)", "date": "2026-09-12", "source_url": "https://www.ultimahora.com/convocan-a-una-gran-plenaria-en-defensa-de-la-ande-y-contra-el-modelo-energetico-oficial", "source_name": "Última Hora", "summary": "Sitrande and allied ANDE unions convened a national plenary on September 12 in Asunción around five axes: energy as a human right, expansion of the social tariff, sovereignty and proper use of electricity rents, rejection of subsidies for electro-intensive companies, and rejection of any privatization of ANDE. The unions oppose the government's plan to create a Ministry of Energy and an Energy Regulator funded by a 2% surcharge on electricity tariffs, warning it would raise user costs and strip ANDE of autonomy. A Ceare study cited a near-39% gap between current average tariffs and the level ANDE needs to cover costs, with some projections pointing to increases of up to 45.6%.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/eddccf1/2147483647/strip/true/crop/1000x563+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F5f%2Ffd%2Fe38daf6a482282ba1f635673b24c%2Fande.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "HIVE Digital's 100 MW Yguazú Substation Energization Set for September Underpins AI/HPC Expansion (2026-09-12)", "date": "2026-09-12", "source_url": "https://www.hivedigitaltechnologies.com/news/hive-digital-technologies-targets-35-ehs-in-2026-with-newly-signed-100-mw-hydroelectric-expansion-in-paraguay-and-a-5x-growth-in-hpc-and-ai-operations-through-strategic-partnerships-with-bell-canada/", "source_name": "HIVE Digital Technologies", "summary": "HIVE Digital Technologies is commissioning a 100 MW substation at its Yguazú site in Paraguay in September 2026, with civil works complete, bringing the facility to its designed 300 MW capacity on Itaipú hydroelectric power. Construction of a Tier-III data centre is scheduled to begin in autumn 2026 with service targeted for the second half of 2027. The expansion follows the completion of phases one and two in April and September 2025 and supports HIVE's target of more than 35 EH/s of global bitcoin capacity in 2026 alongside fivefold growth in HPC and AI operations. A Columbia University study previously validated intercontinental AI training on HIVE's Paraguayan GPUs, reinforcing the country's positioning as an AI compute location.", "image_url": "https://www.hivedigitaltechnologies.com/static/hivesite/images/banner.webp", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "VI. Key Client Developments", "tier": 1, "events": [{"title": "Nubicom's 5G Licence Under Scrutiny: Comptroller Questions Commercial Launch Ahead of October 13 Base-Station Deadline (2026-09-07)", "date": "2026-09-07", "source_url": "https://www.abc.com.py/economia/2026/08/17/donde-estan-los-clientes-y-las-radiobases-de-nubicom-conatel-alega-que-hay-indicios-de-que-ofrecera-telefonia/", "source_name": "ABC Color", "summary": "Nubicom faces mounting regulatory pressure: the Comptroller General's special audit found documentation evidencing only initial technical operation — no active users, contracts, billing or commercial traffic — and warned the company could lose its 5G licence if it cannot demonstrate effective service. Conatel maintains Nubicom began commercial 5G operations in April 2026 limited to Villa Morra, Asunción, with a single base station, and says there are 'indications' it will also offer mobile telephony after requesting a network operator number and numbering. The licence obliges Nubicom to deploy 22 nationwide base stations by October 13, 2026; verification of the rollout is due in October, when an administrative proceeding and penalties from fines to licence cancellation could follow.", "image_url": null, "is_gov_source": true, "is_authoritative": true, "client_tag": "Nubicom — 5G licence compliance risk"}, {"title": "Tigo (Millicom) Pivots to 5G and Infrastructure: 2.3 GHz Spectrum Secured, 281 Towers Sold to Atis Under 15-Year Leaseback (2026-09-07)", "date": "2026-09-07", "source_url": "https://www.telesemana.com/blog/2026/08/06/segunda-subasta-5g-en-paraguay-tigo-se-queda-con-2-3-ghz-y-personal-con-3-7-ghz/", "source_name": "Telesemana", "summary": "Millicom's Paraguayan unit Telecel secured the 2.3–2.4 GHz band in Conatel's second 5G auction for USD 1.6 million, adding to its existing 50 MHz in 2300/2600 MHz. The licence requires detailed engineering within 90 days, commercial launch within 180 days (by February 2027), at least 10 base stations serving state institutions within two years and 100 nationwide within four years, with passive infrastructure sharing mandated. Millicom CEO Marcelo Benítez said towers, antennas and electrical equipment are already 5G-ready. In parallel, Paraguay's competition authority CONACOM cleared Atis Group's purchase of Lati Paraguay, Millicom's tower unit with 281 towers, under a 15-year sale-and-leaseback. IDB Invest and Proparco committed USD 100 million to Millicom for fibre and mobile network modernization including Paraguay.", "image_url": "https://www.telesemana.com/wp-content/uploads/2025/04/FWA.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo / Millicom — 5G rollout & tower monetization"}, {"title": "Personal (Núcleo S.A.) Wins 3.7 GHz 5G Block and Retains Top Ranking for Fixed Networks for a Fifth Straight Year (2026-09-07)", "date": "2026-09-07", "source_url": "https://blog.nperf.com/mejores-redes-fijas-en-paraguay-2026-personal-lidera-por-quinto-ano-consecutivo/", "source_name": "nPerf", "summary": "Núcleo S.A., which operates the Personal brand as a Telecom Argentina subsidiary, was awarded the 3.7–3.8 GHz block in Conatel's second 5G auction for USD 1 million, subject to the same 90-day engineering and 180-day commercial launch obligations as Tigo, with a February 2027 deadline. On the fixed side, nPerf's 2026 barometer ranked Personal first among Paraguayan fixed networks for the fifth consecutive year, ahead of Claro and Tigo, with fibre plans reaching 400 Mbps down and 100 Mbps up from around G. 150,000 per month and 600 Mbps available from Claro. Combined 5G commitments by Tigo and Personal total roughly USD 79–80 million and about 750 base stations over five years, with projects spanning 250 to 500 sites.", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal / Núcleo S.A. — 5G licence & fixed-network leadership"}, {"title": "Claro Leads 5G Build-Out with 100 Base Stations While Nubicom Has One (2026-09-07)", "date": "2026-09-07", "source_url": "https://dplnews.com/paraguay-claro-instala-100-radiobases-5g-nubicom-tiene-una/", "source_name": "DPL News", "summary": "Claro (AMX Paraguay, América Móvil) remains the runaway leader in Paraguayan 5G deployment, having installed 100 base stations against a single operational site for Nubicom. Claro won 200 MHz in the 3.5 GHz band in the 2025 auction with an initial investment of USD 35 million and was the first operator to launch commercially, in December 2025, using Nokia AirScale equipment with massive MIMO radios. Its first phase covers Gran Asunción, Ciudad del Este, Encarnación, Coronel Oviedo and Pedro Juan Caballero. The three-operator 5G landscape — Claro, Tigo and Personal — now contrasts sharply with Nubicom's stalled rollout, which remains under Comptroller audit and regulatory risk.", "image_url": "https://dplnews.com/wp-content/uploads/2025/10/dplnews_claro_mc21025.png", "is_gov_source": false, "is_authoritative": true, "client_tag": "Claro / AMX Paraguay — 5G network leadership"}], "impact_analysis": "", "user_notes": ""}, {"title": "VII. Integrated Impact Analysis for Business Operations", "tier": 2, "events": [], "impact_analysis": "🟡 Currency Regime Is the Dominant Operating Variable: The guaraní rebounded above G. 6,000 on September 11 (BCP interbank G. 6,014.84) after touching a pre-pandemic low of G. 5,910, capping a roughly 20% year-on-year appreciation. The BCP has now publicly and explicitly ruled out intervening to defend a level, framing the strength as fundamentals-driven (growth, investment grade, 23.6% first-half export growth). For any business with USD revenue and guaraní costs — exporters, tourism, dollar-denominated service contracts — margins compress mechanically; the practical hedge is forward contracts, which the BCP itself is promoting. For importers and guaraní-funded capex, purchasing power is at a multi-year high and this is the most favourable procurement window in almost a decade.\n\n🔴 Social Conflict Is Now a Schedule Risk, Not Background Noise: The doctors' strike is confirmed for September 21–22, teachers for September 17–18, and the government is denying 446 specialist resignations to keep hospitals running. Both land before the October 4 municipal elections, which structurally reduces the government's room to concede on salaries. Expect intermittent disruption to public-hospital services, possible road blockades around the plenary and strike dates (including the September 12 ANDE union plenary), and a legislatively distracted Congress through September–October. Build buffer into any schedule that depends on public-sector approvals, port and customs throughput, or land transport on strike days.\n\n🟢 Budget and Public Procurement Are Shifting Toward Health, Education and Security: The PGN 2027 draft (USD 25.7 billion, +11.2%) directs 76% of the increase to the Executive, with health at G. 18.2 trillion, medicine and supplies spending nearly doubling to about USD 772 million, G. 9.2 trillion for MOPC and additional road, dredging and water/sanitation funding. Vice President Alliana has announced a 'historic' cut in superfluous spending to fund salary demands. Public tenders in medical equipment, pharmaceuticals, hospital IT and water infrastructure are the most likely to grow in 2027.\n\n🔴 Energy Reform Is the Key Swing Factor for Data-Centre Economics: The government's plan for a Ministry of Energy and a regulator funded by a 2% tariff surcharge faces organized union resistance (September 12 plenary, near-39% tariff-gap study). The ANDE–Atome green-hydrogen tariff negotiation has been suspended over the utility's refusal to lock a cheap 15-year rate. Any AI/data-centre business case depends on a long-term, bankable power price; that framework is still not legislated, and the tariff-deficit arithmetic (ANDE needs roughly USD 600 million a year for investment) means upward pressure on industrial tariffs is the base case, not the exception.", "user_notes": ""}, {"title": "VIII. Targeted Recommendations for Chinese Enterprises", "tier": 2, "events": [], "impact_analysis": "🔴 Geopolitical Channel Remains Closed for Direct Public-Sector Participation: Paraguay reaffirmed its Taiwan alignment during the September 11–12 Taiwan–Paraguay Technology Forum (AI-centred, at the BCP) and through Foreign Minister Ramírez Lezcano's 'red line' framing against a Mercosur–China deal. The 5G auction rules require supply-chain security standards and commercial/diplomatic reciprocity that indirectly exclude Chinese vendors; both Tigo and Personal stayed out of the 2025 round for this reason, and the requirement persists in the 2026 second auction. Chinese firms should not bid directly into CONATEL, ANDE, state data-centre or critical-infrastructure tenders, and should route any engagement through locally incorporated partners with independent compliance review.\n\n🟢 Import and Equipment Supply Is the Open, Cash-Generating Channel: With the guaraní near G. 6,000/USD and FX forward balances having jumped ~30% to USD 2.05 billion, import purchasing power is at a multi-year high while the BCP actively promotes forwards as the hedging tool. Chinese suppliers of telecom passive infrastructure, power equipment, fibre, medical equipment and general industrial goods sell into a market where buyers' local-currency costs are historically cheap. This is the highest-conviction commercial lane and does not require diplomatic engagement — but price in forward-contract costs and expect buyers to demand guaraní-denominated or hedged terms.\n\n🟡 5G Deployment Cycle Is a Two-Year Equipment Demand Window: Tigo (2.3 GHz, USD 1.6 million) and Personal (3.7 GHz, USD 1 million) must launch commercially by February 2027 and deploy roughly 750 base stations and USD 79–80 million jointly over five years, with 100 base stations each and 10% reserved for state institutions. Their chosen vendors are non-Chinese (Claro uses Nokia), so direct radio-access equipment sales are effectively foreclosed — but towers, passive infrastructure (Atis now owns 281 ex-Millicom towers under a 15-year leaseback), power systems, fibre and site civil works remain addressable. Nubicom, whose licence is under Comptroller audit with 22 base stations due October 13 and only one operating, is a distressed counter-party: verify payment security before any engagement.\n\n🟡 AI/Data-Centre Ambition Exceeds Its Power Framework — Watch, Don't Commit: Yguazú Digital (10 MW first phase, USD 200–300 million; 1 GW final phase, USD 30–40 billion) and HIVE's 100 MW Yguazú substation energization in September signal real momentum, and the government is explicitly courting ecosystem builders rather than technology consumers. However, power tariffs, the ANDE reform legislation and the Atome suspension are all unresolved, and the AI workforce is the stated binding constraint. Chinese data-centre EPC, cooling and power-distribution suppliers should track the ANDE regulatory framework and the 2027 budget outcome before committing — the procurement trigger will be a legislated tariff regime, not a press release.", "user_notes": ""}]}};

function renderAll(){

  var sections=d.sections||[],tier1=[],tier2=[];

  for(var i=0;i<tier1.length;i++)total+=(tier1[i].events||[]).length;

function renderSection(sec,idx){
  var events=sec.events||[],isT2=sec.tier===2;

  var body='';

  }

function renderCard(evt,phFrom,phTo,icon){
  var img=evt.image_url,hasImg=img&&img.indexOf('http')===0;
  var ih='';

  ih+='<div class="img-placeholder" style="background:linear-gradient(135deg,'+phFrom+','+phTo+');'+(hasImg?'display:none':'display:flex')+';font-size:32px;color:#fff;">'+icon+'</div>';

  var tags='';
  if(evt.date)tags+='<span class="event-tag date">'+esc(evt.date)+'</span>';
  if(evt.client_tag)tags+='<span class="event-tag client">'+esc(evt.client_tag)+'</span>';
  if(evt.is_gov_source)tags+='<span class="event-tag gov">'+L('政府官网','Government')+'</span>';
  else if(evt.is_authoritative)tags+='<span class="event-tag auth">'+L('权威媒体','Authoritative')+'</span>';
  if(evt.source_name)tags+='<span class="event-tag source">'+esc(evt.source_name)+'</span>';

  var link=evt.source_url?'<a class="event-link" href="'+esc(evt.source_url)+'" target="_blank" rel="noopener">'+L('查看原文 →','Read more →')+'</a>':'';
  var preview=evt.summary||'';if(!preview&&evt.title)preview=evt.title;
  return '<div class="event-card"><div class="event-img">'+ih+'</div><div class="event-body"><div class="event-meta">'+tags+'</div><div class="event-preview">'+esc(preview)+'</div>'+link+'</div></div>';
}

function fmt(text){
  var h=esc(text);
  h=h.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
  h=h.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
  h=h.replace(/\n/g,'<br>');
  return h;
}

function scrollToSec(idx){
  var pills=document.querySelectorAll('.stat-pill');
  for(var i=0;i<pills.length;i++)pills[i].style.outline='';
  if(idx===null||idx===undefined){window.scrollTo({top:0,behavior:'smooth'});return;}
  var el=document.getElementById('sec-'+idx);
  if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.style.boxShadow='0 0 0 3px #3B82F6';
  setTimeout(function(){el.style.boxShadow='';},1500);
}

function showHistory(){
  fetch('/api/briefings').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(list){
    if(!list||!list.length){alert(L('没有找到历史简报','No saved briefings found.'));return;}
    var h='<div class="update-modal-overlay" id="histModal" onclick="closeUpdateModal(\'histModal\')"><div class="update-modal" onclick="event.stopPropagation()"><h3>'+L('历史简报','Saved Briefings')+'</h3><div class="history-list">';
    for(var i=0;i<list.length;i++){var b=list[i];h+='<div class="history-item" onclick="loadBriefing(\''+esc(b.filename)+'\')"><div><div class="hi-title">'+esc(b.topic||b.filename)+'</div><div class="hi-meta">'+esc(b.time_span||'')+'</div></div><span class="hi-count">'+(b.event_count||0)+L(' 条',' evts')+'</span></div>';}
    h+='</div><div class="btn-row" style="margin-top:12px"><button class="btn-secondary" onclick="closeUpdateModal(\'histModal\')">'+L('关闭','Close')+'</button></div></div></div>';
    document.body.insertAdjacentHTML('beforeend',h);
  }).catch(function(){
    alert(L('此功能需要启动 Flask 服务器。\n请在终端运行: python3 web_app.py\n然后访问 http://127.0.0.1:5000','This feature requires the Flask server.\nRun: python3 web_app.py\nThen visit http://127.0.0.1:5000'));
  });
}
function loadBriefing(filename){
  fetch('/api/briefing/'+encodeURIComponent(filename)).then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    DATA['zh']=data;DATA['en']=data;briefingData=data;renderAll();closeUpdateModal('histModal');
  }).catch(function(){alert(L('加载失败','Failed to load briefing.'));});
}
function refreshBriefing(){
  var btn=document.getElementById('btnUpdate');
  btn.disabled=true;btn.textContent='...';
  fetch('/api/briefing/briefing_en.json').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    DATA['en']=data;briefingData=data;renderAll();
    fetch('/api/briefing/briefing.json').then(function(r){if(r.ok)return r.json();}).then(function(zh){if(zh)DATA['zh']=zh;}).catch(function(){});
  }).catch(function(){alert(L('刷新失败','Refresh failed'));}).finally(function(){
    btn.disabled=false;btn.textContent=L('刷新简报','Refresh');
  });
}
function openMacroModal(){
  var h='<div class="update-modal-overlay" id="macroModal" onclick="closeUpdateModal(\'macroModal\')"><div class="update-modal" onclick="event.stopPropagation()"><h3>'+L('更新宏观数据','Update Macro Data')+'</h3>';
  h+='<p style="font-size:11px;color:#94A3B8;margin-bottom:12px">'+L('下载最新 BCP Excel 后填入文件名','Fill in latest BCP Excel filenames')+'</p>';
  h+='<input type="text" id="cpiFileName" placeholder="'+L('CPI文件，如 AE_IPC-26.6.xlsx','CPI file, e.g. AE_IPC-26.6.xlsx')+'" style="width:100%;font-size:12px;padding:8px 10px;border:1px solid #CBD5E1;border-radius:6px;margin-bottom:8px">';
  h+='<input type="text" id="rinFileName" placeholder="'+L('RIN文件，如 reservas...xlsx','RIN file, e.g. reservas...xlsx')+'" style="width:100%;font-size:12px;padding:8px 10px;border:1px solid #CBD5E1;border-radius:6px;margin-bottom:12px">';
  h+='<div class="btn-row"><button class="btn-secondary" onclick="closeUpdateModal(\'macroModal\')">'+L('取消','Cancel')+'</button><button class="btn-primary" onclick="refreshMacroData()">'+L('更新','Update')+'</button></div>';
  h+='<div id="genStatus" style="margin-top:10px;font-size:12px;color:#64748B;display:none"></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
}
function refreshMacroData(){
  var cpiFile=document.getElementById('cpiFileName').value.trim();
  var rinFile=document.getElementById('rinFileName').value.trim();
  if(!cpiFile&&!rinFile){alert(L('请至少输入一个文件名','Please enter at least one filename.'));return;}
  var st=document.getElementById('genStatus');
  st.style.display='block';st.innerHTML='<span class="loading-spinner"></span>'+L('正在读取宏观数据文件…','Reading macro data files…');
  fetch('/api/update-macro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cpi_file:cpiFile,rin_file:rinFile})}).then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    var msgs=[];
    if(data.cpi&&data.cpi.length){MACRO_CPI.line=data.cpi;msgs.push(L('CPI已更新('+data.cpi.length+'个月)','CPI updated ('+data.cpi.length+' mo)'));}
    if(data.cpi_error)msgs.push(L('CPI错误: ','CPI error: ')+data.cpi_error);
    if(data.rin&&data.rin.length){MACRO_RIN.line=data.rin;msgs.push(L('RIN已更新('+data.rin.length+'个月)','RIN updated ('+data.rin.length+' mo)'));}
    if(data.rin_error)msgs.push(L('RIN错误: ','RIN error: ')+data.rin_error);
    if(msgs.length){renderAll();st.innerHTML='<span style="color:#10B981">'+msgs.join('; ')+'</span>';}
    else st.innerHTML='<span style="color:#EF4444">'+L('更新失败','Update failed')+'</span>';
  }).catch(function(){st.innerHTML='<span style="color:#EF4444">'+L('更新失败，请确保 Flask 服务器已启动','Failed. Make sure Flask server is running.')+'</span>';});
}
function closeUpdateModal(id){
  var m=document.getElementById(id||'updateModal');if(m)m.remove();
  var h=document.getElementById('histModal');if(h&&id!=='histModal')h.remove();
}
document.addEventListener('DOMContentLoaded',function(){
  if(window.IS_STANDALONE)document.getElementById('standaloneBanner').style.display='block';
  if(MACRO_FX.monthly&&!MACRO_FX.line)MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
  briefingData=DATA['en'];
  currentLang='en';
  renderAll();
  updateLangBtn();
  if(!window.IS_STANDALONE)fetchLiveFX();
});
function fetchLiveFX(){
  fetch('/api/macro/fx').then(function(r){if(!r.ok)return;return r.json();}).then(function(d){
    if(!d||!d.rate)return;
    var arr=MACRO_FX.monthly||MACRO_FX.line||[];
    arr[arr.length-1]=d.rate;
    window.MACRO_FX_DATE=(d.date||'').replace(/-/g,'.');
    MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
    renderAll();
  }).catch(function(){});
}
</script>
</body>
</html>
