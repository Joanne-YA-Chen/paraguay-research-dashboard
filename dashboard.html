window.EMBEDDED_BRIEFINGS = {"zh": {"topic": "巴拉圭简报", "time_span": "2026年9月13日 — 2026年9月20日", "time_label": "最近一周", "sections": [{"title": "一、宏观经济动态", "tier": 1, "events": [{"title": "巴拉圭央行九月调查：分析师将2026年增长预期上调至4.5%，将通胀预期下调至3.0%，并预计到12月瓜拉尼汇率达G. 6,100（2026-09-17）", "date": "2026-09-17", "source_url": "https://www.lanacion.com.py/negocios_edicion_impresa/2026/09/17/agentes-proyectan-mayor-crecimiento-y-un-dolar-a-g-6100-para-fin-de-2026/", "source_name": "La Nación / BCP", "summary": "巴拉圭央行9月经济变量预期调查显示，分析师将2026年国内生产总值增速预测从8月的4.3%上调至4.5%，高于国际货币基金组织预测的4.4%，并将2027年增速预测维持在4.0%。2026年底通胀率预测从3.3%下调至3.0%，均值为2.8%，远在央行3.5%±2个百分点的目标区间内；受访机构预计9月和10月月度通胀率均为0.2%。9月名义汇率预测下调至1美元兑6,015瓜拉尼，12月预测下调至1美元兑6,100瓜拉尼（此前为6,150），并预计2027年底为1美元兑6,300瓜拉尼。政策利率预计在2026年全年维持5.50%不变，2027年降至5.25%，确认中性政策立场，使套息交易资金流入继续支撑瓜拉尼。", "image_url": "https://www.lanacion.com.py/resizer/v2/2QCD37M7SZCIDJGEV3V3KMUTHM.jpg?auth=260a47bcc7813927dd11ca45922f552f51cb412eeb4da236c7432e761fd5b712&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "大豆产业在八个月内录得创纪录的38.77亿美元，相当于巴拉圭出口总收入的40%（2026-09-16）", "date": "2026-09-16", "source_url": "https://www.ultimahora.com/complejo-sojero-genera-usd-3-877-millones-y-marca-record-exportador", "source_name": "Última Hora / Capeco", "summary": "巴拉圭谷物和油籽出口商协会于9月16日发布的外贸报告确认，2026年前八个月大豆产业链创造了38.77亿美元收入，占巴拉圭出口总收入的40%。大豆籽粒出口量达到7,413,675吨，高于上年同期的5,406,291吨，价值28.86亿美元，比2025年增加约9.07亿美元。豆油出口量增长6%至449,142吨，豆粕出口量增长12%至1,617,365吨，均创纪录。阿根廷承接了86%的大豆籽粒出口，巴西承接了10%，其余份额分布在俄罗斯、沙特阿拉伯、越南、美国、乌拉圭、智利和韩国；对俄罗斯的出口已恢复。共有53家企业参与了2025/26年度收获季的出口。对阿根廷市场的集中仍是该行业的结构性脆弱点，并放大了瓜拉尼升值带来的风险敞口。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/2bbff15/2147483647/strip/true/crop/1180x664+0+111/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fadjuntos%2F161%2Fimagenes%2F007%2F992%2F0007992646.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "经济财政部宣布2026年第四次国债拍卖定于9月23日举行，重新开放2030年和2035年系列（2026-09-18）", "date": "2026-09-18", "source_url": "https://www.lanacion.com.py/negocios/2026/09/18/mef-anuncia-la-cuarta-emision-de-bonos-del-tesoro/", "source_name": "La Nación / MEF", "summary": "经济与财政部定于9月23日星期三进行2026年第四次国内国债发行，增发两只分别于2030年和2035年到期、每半年付息一次的债券。此次操作通过亚松森证券交易所（BVA）进行，这是今年以来第二次使用该渠道，此前发行一直仅通过央行进行。发行所得有助于为2026年预算融资，并深化本地资本市场。2026年此前几次拍卖中，4月通过巴拉圭央行（BCP）筹集了G. 698,000百万，6月筹集了G. 974,350百万，7月通过BVA筹集了G. 360,548百万，总计约G. 2万亿（约合3.39亿美元）。提交国会的2027年预算预计发行27.08亿美元债券，比2026年增加70%，其中99%计划面向国际市场。", "image_url": "https://www.lanacion.com.py/resizer/v2/DPOAIEEDKZAUROFCIZ36NONJSE.jpg?auth=7a877a81adde20c1ba4f8491de047d31cd1b4d515386ddc8d55ee71b17733996&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "巴拉圭央行打破对参议院信息请求的沉默并重申金融体系稳健性（2026-09-18）", "date": "2026-09-18", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/negocios/2026/09/18/bcp-garantiza-apertura-en-consultas-del-legislativo-y-ratifica-solidez-del-sistema/", "source_name": "La Nación / BCP", "summary": "在数周沉默之后，央行行长卡洛斯·卡瓦略和由莉兹·克莱默代表的银行协会会见了总统圣地亚哥·佩尼亚，并承诺就与乌埃诺银行案有关的四家私人银行的业务回应参议院的信息请求。卡瓦略确认了金融体系的偿付能力以及该机构提供所需文件的意愿，同时银行协会确认其成员将予以配合。佩尼亚表示“必须澄清疑虑”。参议院的请求由执政的“科罗拉多荣誉”党团在反对派支持下推动，涉及31个问题，涵盖乌埃诺银行的关联方风险敞口、公共部门存款、一笔3500万美元的资产组合出售和一份2026年7月的监管备忘录，以及GNB银行与西班牙对外银行、苏达梅里斯银行与区域银行、大陆银行与里奥银行、阿特拉斯银行与家庭银行的整合。根据《宪法》第192条，巴拉圭央行有15个工作日的时间作出回应。", "image_url": "https://www.lanacion.com.py/resizer/v2/AG2C4XXGUNHTZAZPMYNG22SBJA.jpg?auth=b29f20881f5f8407382fad8d7feb9d6dfdc807ac3f6b5d7eabbff0f86cef7d85&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": "", "description": "2025年2月\n2025年3月\n\n更新：2025年3月5日\n\n2025年2月消费者价格指数上涨1.3%，使年度总体通胀率保持在3.6%，较上月高0.2个百分点，仍高于巴拉圭央行4%的目标。按月计算，通胀率为0.4%，与1月相比显著放缓（-1.2个百分点环比）。核心通胀率（不包括水果和蔬菜）上涨至4.2%，较1月增加0.2个百分点，高于总体通胀率。消费者价格指数篮子中大多数类别均录得月度上涨，其中牛肉价格上涨最为突出，该品类在连续六个月下跌后本月上涨4%。私人服务通胀的加速也导致了月度数据的上涨。\n\n在2月的会议上，巴拉圭央行货币政策委员会决定将货币政策利率维持在6.00%，这是连续第四个月维持该水平。委员会强调通胀预期仍稳固锚定，尽管存在一些短期波动。然而，由于私人消费和固定投资的扩展，国内需求依然强劲。在此背景下，并在国际大宗商品价格波动的环境下，巴拉圭央行重申其承诺，即如有必要将“果断”调整政策利率，以确保中期4%的通胀目标得以实现。\n\n至于对外贸易，2025年开年表现积极。1月，巴拉圭出口同比增长24.2%，达到14.31亿美元，而总进口增长19.2%，达到14.56亿美元。当月贸易差额录得2500万美元的小幅赤字。在出口方面，初级产品出口同比增长47.2%，主要由大豆推动，大豆出口增长46.5%。同期，制成品出口也表现良好，增长26.1%。在进口方面，所有类别均有所扩张，其中资本品进口增幅最大，同比飙升30.3%。最大的贸易伙伴方面，对巴西的出口增长29.2%，而对阿根廷的出口则下降4.4%。在全球不确定性持续的背景下，对外贸易受益于有利的天气条件和强劲的早期收成。\n\n巴拉圭市场波动性指标（BAS）1月维持在0.21不变。这反映出由于积极的播种进展和有利的天气条件，不确定性保持在低位。"}, {"title": "二、政治与政策变化", "tier": 1, "events": [{"title": "培尼亚公布三项“历史性”产业措施：1亿美元信贷额度、福加因担保基金以及工业和贸易部与国家旅游秘书处合并法案（2026-09-18）", "date": "2026-09-18", "source_url": "https://www.lanacion.com.py/editorial/2026/09/18/el-gobierno-lanzo-propuestas-de-creditos-para-darle-mas-impulso-a-la-industria/", "source_name": "La Nación / MEF", "summary": "在巴拉圭工业联盟（UIP）成立90周年晚宴上，圣地亚哥·培尼亚总统宣布了三项提振制造业的措施。“巴拉圭工业”信贷额度初始资金为1亿美元（G. 600,000 million，即6,000亿瓜拉尼），瓜拉尼利率为10.5%，美元利率为8.5%，期限最长15年，宽限期最长三年，每家企业上限250万美元，通过发展金融局（AFD）认证的金融中介机构发放，指定用于机械、设备、技术和基础设施，其中最多20%可用作营运资金。培尼亚还签署了设立福加因担保基金（Fogain）的法令，该基金面向缺乏足够抵押品的企业；并向国会主席巴西利奥·努涅斯递交了一项法案，将工业和贸易部（MIC）与旅游秘书处（Senatur）合并，赋予投资与出口网络（Rediex）法律地位并加强贸易防御职权。工业部长马科·里克尔梅表示，“借口已经没有了。”", "image_url": "https://lanacionpy.nyc3.digitaloceanspaces.com/img/ln-fb-share.png", "is_gov_source": true, "is_authoritative": true}, {"title": "伊萨亚斯·弗雷特斯宣誓就任新卫生部长，接手医生和解协议与社保局事务（2026-09-18）", "date": "2026-09-18", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/politica/2026/09/18/isaias-fretes-juro-como-nuevo-ministro-de-salud-publica-ante-santiago-pena/", "source_name": "La Nación", "summary": "培尼亚总统在政府宫宣誓任命伊萨亚斯·里卡多·弗雷特斯·萨拉特为公共卫生和社会福利部长，国会主席巴西利奥·努涅斯和众议院议长劳尔·拉托雷出席了仪式。弗雷特斯在担任社会保障局理事会主席后，根据9月13日第6889号法令获得任命。他的任命为一段动荡时期画上句号；这段时期出现了446名专科医生辞职和全国医生罢工，几天前通过一揽子方案得以解决，其中包括为2027年追加2.6亿美元药品资金、每个岗位加薪200万瓜拉尼以及2300个长期职位。弗雷特斯提醒他在社会保障局的继任者德利斯·莱昂，注意在该机构位于查科的土地上发现的“因疏忽而生的违规行为”，这预示着养老基金的治理将成为改革议程的下一项。", "image_url": "https://www.lanacion.com.py/resizer/v2/AGKPDZPC35ANPLVXJFLKHSDCUE.jpeg?auth=5487110a25c3e31da39eaf85efd752f6533be277feb2308b5a0ab113dcd68215&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "培尼亚要求科罗拉多荣誉运动冻结2028年候选人组合辩论，聚焦10月4日市政选举投票（2026-09-18）", "date": "2026-09-18", "source_url": "https://www.latribuna.com.py/politica/2026/09/18/santiago-pena-pide-congelar-el-debate-2028-y-enfocarse-en-las-municipales/", "source_name": "La Tribuna", "summary": "培尼亚总统公开要求科罗拉多荣誉运动领导层搁置有关2028年总统候选人组合的辩论，将资源集中用于10月4日的市政选举，并支持1号名单候选人。他说自己与奥拉西奥·卡特斯的关系“很好”，并否认副总统佩德罗·阿利亚纳已经离开科罗拉多荣誉运动。这次干预发生在一周明显内部摩擦之后：卡特斯单方面提名胡安·卡洛斯·巴鲁哈为2028年副总统预候选人，激怒了阿利亚纳；与此同时，参议院对乌埃诺银行——一家历史上与卡特斯集团有关联的银行——的信息请求，被持不同政见的众议员罗伯托·冈萨雷斯解读为触发因素，并评论称“奥拉西奥拧了总统的耳朵”。众议员丹尼尔·森图里翁将紧张局势归咎于卡特斯。这一事件使执政联盟在市政选举投票前16天明显承压。", "image_url": "https://www.latribuna.com.py/resizer/v2/WCB5M2CML5H4DPXZAWF6UYBCBY.JPG?smart=true&auth=e6c490fc3542edbf11018fb985d3d80dd2592cb1499f9d103db472c84609770f&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}, {"title": "市政竞选活动在民调发布禁令下进入最后冲刺阶段；卡米洛·佩雷斯在亚松森保持大幅领先（2026-09-19）", "date": "2026-09-19", "source_url": "https://www.lanacion.com.py/politica/2026/09/19/hay-mucho-optimismo-se-siente-la-victoria-dice-camilo-perez/", "source_name": "La Nación", "summary": "距离10月4日市政选举还有两周，候选人以大规模地方动员活动结束了本周的竞选，发布民调的法定截止日期为9月18日。在亚松森，执政党候选人卡米洛·佩雷斯（1号名单）在哈拉区举行了第三次分区会议，超过一千名支持者参加，他声称其知名度达94%，内部领先约20个百分点；在民调静默期前公布的调查显示他的支持率为50.4%至50.8%，而索莱达·努涅斯为27%。佩雷斯的对手向他发起辩论挑战，称“他们没有允许他参加”。在费尔南多·德拉莫拉，阿蒂·斯尼德民调（9月15日至17日，500名受访者）显示阿里尔·奥赫达为42.7%，路易斯·费尔南多·佛朗哥为34.6%。自由党参议员埃韦尔·比利亚尔瓦对投票机的脆弱性表示担忧，并要求对最高选举法院的设备进行审计。", "image_url": "https://www.lanacion.com.py/resizer/v2/7SWYMHNL2NALFALU76AW5LIQEY.jpeg?auth=26f7a4375c8f165a7cffecedd2cdacef1cd0838173dd2fcfc944c6543f282209&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": "", "description": "Paraguay Economic activity continues to rise. Monthly economic activity as measured by the BCP grew 3.1% y/y in March, led by services and manufacturing. The trend remains positive and the output gap has closed.\n\n巴拉圭经济活动持续增长。巴拉圭央行数据显示，3月月度经济活动同比增长3.1%，主要受服务业和制造业拉动。增长趋势保持正向，产出缺口已经弥合。\n\nInflation declining, within BCP target range. Consumer prices rose 4.4% y/y in May, continuing to fall from the 2022 peak. The central bank has held the policy rate at 6.0% since September 2023 but signaled it could start easing soon.\n\n通胀回落，处于巴拉圭央行目标区间内。5月消费者价格同比上涨4.4%，继续自2022年高点下行。央行自2023年9月以来将政策利率维持在6.0%，但已暗示可能很快开始宽松。\n\nFiscal accounts remain in solid shape. The central government fiscal deficit was 2.2% of GDP in 2022 and 3.0% in 2023 (above the 2.3% FRL ceiling). The 2023 breach is expected to be forgiven due to the drought.\n\n财政状况保持稳健。中央政府财政赤字2022年占GDP的2.2%，2023年为3.0%（高于《财政责任法》规定的2.3%上限）。由于旱灾因素，预计2023年的超标将被豁免。\n\nExternal imbalances narrowing. The current account deficit was 0.7% of GDP in Q4 2023, while FDI strengthened. International reserves remain adequate.\n\n外部失衡收窄。2023年第四季度经常账户赤字占GDP的0.7%，同时外国直接投资有所增强。国际储备保持充足。\n\nFinancial system sound. The banking system remains well-capitalized, with strong earnings and loan growth. NPLs remain low.\n\n金融体系稳健。银行系统资本充足，盈利能力和贷款增长强劲。不良贷款率保持低位。\n\nProgram. The IMF Executive Board completed in April 2024 the second reviews of the Policy Coordination Instrument and the Resilience and Sustainability Facility.\n\n规划。国际货币基金组织执行董事会于2024年4月完成了政策协调工具与韧性和可持续性基金的第二轮审查。\n\nPolitics. President Santiago Peña pushed a fiscal adjustment law through Congress in September that caps budget growth at 0% in real terms.\n\n政治。总统圣地亚哥·培尼亚于9月推动国会通过了一项财政调整法案，将预算实际增长率上限定为0%。\n\nMoody's upgraded the sovereign to investment grade in July 2024 (Baa3 with stable outlook), following S&P in February (BB+ with positive outlook). Fitch rates Paraguay BB+ with stable outlook.\n\n继标普于2024年2月将巴拉圭评级上调至BB+（展望正面）之后，穆迪于2024年7月将该国主权评级上调至投资级（Baa3，展望稳定）。惠誉对巴拉圭的评级为BB+，展望稳定。\n\nEl Niño weather phenomenon has had no measurable economic impact so far; Paraguay has not experienced the severe drought that affected the agricultural sector in 2022, but heavy rains have caused localized flooding in October-November 2024.\n\n厄尔尼诺天气现象迄今尚未产生可衡量的经济影响；巴拉圭没有经历2022年冲击农业部门的严重干旱，但强降雨在2024年10月至11月引发了局部洪涝。"}, {"title": "三、社会与安全形势", "tier": 1, "events": [{"title": "政府以加薪5%化解教师罢工；六个工会接受，四个工会继续推进48小时罢工（2026-09-16）", "date": "2026-09-16", "source_url": "https://www.lanacion.com.py/pais/2026/09/16/paro-docente-dividido-seis-gremios-aceptan-el-5-y-los-otros-cuatro-van-a-la-huelga/", "source_name": "La Nación", "summary": "在教育部（MEC）、财政部和教师工会进行谈判后，政府提出2027年加薪5%，分两个阶段实施（已列入预算的2.4%加上自2027年7月起的2.6%），估计财政成本为4700万美元。代表近80%教师的巴拉圭教育工作者联合会（FEP）与巴拉圭教师协会（APE）、巴拉圭教师工会（ADP）和巴拉圭教育工作者协会（Adofep）接受了该提议，并取消了罢工举措。巴拉圭教育工作者组织—全国工会（OTEP-SN）、巴拉圭教育工作者组织—真正派（OTEP-A）、全国教育工作者联盟（UNE）和争取社会主义运动—人民多数（MAS-MP）拒绝了提议，拒绝签署，并确认于9月17日至18日举行48小时全国罢工，从巴塔永40广场游行至财政部，要求得到他们称为“不可谈判”的8%加薪。教育部长路易斯·拉米雷斯表示，教育部将通过向劳工部提出请求，对该行动的限度进行法律审查。这场分裂标志着政府2026年工资谈判中的第三条战线——此前已有医生和预算问题。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/03e3704/2147483647/strip/true/crop/1280x720+0+92/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Ff7%2Fb2%2F8855cd3f43cabc043f53a58da089%2Fwhatsapp-image-2026-09-16-at-13-53-09.jpeg", "is_gov_source": true, "is_authoritative": true}, {"title": "异见工会宣布休战，全国恢复上课；谈判转向两院预算委员会（2026-09-18）", "date": "2026-09-18", "source_url": "https://www.lanacion.com.py/pais/2026/09/18/docentes-y-mec-van-a-cuarto-intermedio-tras-dialogo-que-busca-desactivar-la-movilizacion/", "source_name": "La Nación", "summary": "此前仍坚持罢工的四家工会宣布“临时休会”并取消了罢工行动，公立学校因此得以在9月18日星期五恢复正常活动。教育部长路易斯·拉米雷斯确认，所有公立教育机构均已复课，持不同意见的工会最终加入了政府的方案。工会领导人将此次后退定性为战术性暂停而非和解：巴拉圭教育工作者组织—全国工会（OTEP-SN）的布兰卡·阿瓦洛斯表示，谈判将沿两条轨道继续推进，一是与教育部（MEC）就工作量问题谈判，二是与国会两院预算委员会就部门拨款问题谈判；巴拉圭教育工作者组织—正牌派（OTEP-A）的加布里埃尔·埃斯皮诺拉则强调，尚未签署任何协议，有关基础设施投资、全纳教育和免费公立教育的要求仍然有效。政府对这场争端的处理现已直接与2027年预算辩论挂钩，在辩论中，卫生和教育争夺同样受限的财政空间。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/e8a5777/2147483647/strip/true/crop/1599x899+0+83/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F07%2Fe6%2Fad786e4c43bebcebd2f808a9056f%2F413ca4f3-ee41-4d39-894a-417e14f5f59f.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "SINAMED接受政府提议，取消9月21日至22日的全国医生罢工（2026-09-16）", "date": "2026-09-16", "source_url": "https://www.lanacion.com.py/pais/2026/09/16/medicos-oficializan-la-suspension-de-la-huelga-tras-aceptar-la-propuesta-de-reajuste-salarial/", "source_name": "La Nación", "summary": "在一次特别大会上，全国医生工会一致通过了政府提案，并正式取消了原定于9月21日至22日举行的48小时全国罢工。这项四点协议包括：2027年预算中增加2.6亿美元用于药品和物资；每个岗位加薪200万瓜拉尼，在2027年分阶段发放（4月50万瓜拉尼、7月50万瓜拉尼、12月100万瓜拉尼）；永久任命2300名医生，并预计在2027年再提供1500个职位空缺；从1月起，公共假日上班补贴100万瓜拉尼。全国医生工会主席罗萨娜·冈萨雷斯警告说，如果这些承诺得不到履行，工会将再次发起动员，并将由一个特别委员会游说国会。该协议消除了主导第三季度的三起社会冲突中最具破坏性的一起，但将相关成本转移到了目前正接受两院审议的2027年预算中。", "image_url": "https://www.lanacion.com.py/resizer/v2/BAV5I2PKMRHJ3J2JNBM5KNTGIQ.jpg?auth=fb5f605ae21848fd8b64b44fed50fdc468517f89a3fc360c85bf0770f300b865&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "内政部以40名林塞特警和20辆摩托车加强上巴拉那省，并宣布无人机与摄像头计划（2026-09-17）", "date": "2026-09-17", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/pais/2026/09/17/refuerzo-de-lince-riera-entrego-20-motos-y-40-agentes-para-policia-de-alto-parana/", "source_name": "La Nación", "summary": "内政部长恩里克·里埃拉主持了20辆摩托车和40名林塞战术小组队员的交接仪式，以增援上巴拉那省警察；加上当地已有的40名摩托化警员，总计将有40辆摩托车和80名队员。此次部署在东方市市中心进行展示，并有摩托化巡逻队参加。里埃拉还宣布将在该省设立林塞战术小组总部，并推出一项基于无人机和摄像头的省级安全计划。\n\n此次增援正值三国边境地区发生一系列高关注度犯罪之后，包括亚松森一名货币兑换商遭武装袭击，作案者冒充经济犯罪调查人员，抢走1万至1.5万美元；以及伊塔普阿省发生一起入室抢劫并劫持人质案件，最终以一场三公里追捕和交火告终。东部边境安全问题仍是该省物流和数据中心投资者长期关注的议题。", "image_url": "https://www.lanacion.com.py/resizer/v2/3RLB4H2V3FDM3IEGGSLOAPDYLI.jpeg?auth=92e036581970ac8f52d9bbcf2fca7332ee50fa4e009296a6cd46356d44a2d42c&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": "", "description": "请提供需要翻译的英文内容。"}, {"title": "四、国际关系与外交动态", "tier": 1, "events": [{"title": "参议院外交关系委员会一致批准南方共同市场–欧洲自由贸易联盟自由贸易协定（2026-09-16）", "date": "2026-09-16", "source_url": "https://www.lanacion.com.py/politica/2026/09/16/mercosur-aelc-senado-destaca-oportunidades-de-exportacion-e-inversion-para-paraguay/", "source_name": "La Nación", "summary": "参议院外交关系与国际事务委员会在参议员安东尼奥·巴里奥斯主持、工商部长马可·里克尔梅出席的工作会议上，一致通过了批准南方共同市场与欧洲自由贸易联盟国家——瑞士、挪威、冰岛和列支敦士登——之间自由贸易协定的法案。该协定建立了一个自由贸易区，包含关税削减和取消承诺、国民待遇、数量限制和进口许可纪律、农业优惠以及对敏感产品的具体配额。里克尔梅表示，该协议允许零关税贸易，并为进入购买力强、需求食品、可持续产品、农工产品和差异化制成品的市场打开了出口和投资机会。参议员们特别指出挪威是优先市场，并强调需要在南方共同市场成员之间公平分配配额——这也是阻碍欧盟协议的同一个分歧点。", "image_url": "https://www.lanacion.com.py/resizer/v2/YIHLXPETNBFHHN2N2FDCN42K3M.jpeg?auth=7ce0f358c0e544300544fde3bae5e5c38ae6291545bf68c41b9ede21b8da9886&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "新任驻华盛顿大使将牛肉议程置于首位，目标为美国市场多达80,000吨（2026-09-18）", "date": "2026-09-18", "source_url": "https://www.lanacion.com.py/negocios/2026/09/18/nueva-embajadora-en-ee-uu-prioriza-la-agenda-carnica-con-senacsa/", "source_name": "La Nación / Senacsa", "summary": "经参议院批准出任巴拉圭驻华盛顿代表的埃斯特法尼娅·拉特尔萨大使，在与国家动物卫生与质量服务局会晤时，将牛肉议程作为其首个工作优先事项。美国额外开放了30万吨牛肉配额，在9月1日至11月30日期间按月分三批发放，每批10万吨；巴拉圭力争获得其中最多10%的份额。该国目前每月出口6000至8000吨，截至8月31日累计出口35000吨，预计全年出口约60000吨；大使提出中期目标是达到80000吨，并转向更高附加值的分割肉。美国是巴拉圭第二大牛肉买家，今年迄今购买35443吨，价值2.115亿美元，另有1458吨副产品，价值696万美元。", "image_url": "https://www.lanacion.com.py/resizer/v2/LU4PO74TDFDO3AIXT7WVI253IA.jpeg?auth=583041d205aec528cd804751de645307256e118f111083cdb704d0ccafe605c1&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "巴拉圭根据对外军事销售计划购买逾100万美元美国弹药；弹药工厂重启事宜正在审查（2026-09-16）", "date": "2026-09-16", "source_url": "https://www.infobae.com/america/agencias/2026/09/16/paraguay-compra-a-eeuu-municiones-por-mas-de-un-millon-de-dolares/", "source_name": "Infobae / EFE", "summary": "巴拉圭通过“对外军售计划”从美国购买了超过100万美元的弹药，政府正在评估重启一家国内弹药工厂。此次采购属于更广泛的安全与防务议程，该议程已包括《部队地位协定》（SOFA）、第三国安全港安排、移民备忘录、打击有组织犯罪的联合训练和技术转让，以及与一所美国大学达成的协议：由禁毒秘书处（Senad）管理，每年为巴拉圭学生保留15个名额。最近还签署了一份关于核能的谅解备忘录，涉及能源结构多元化、研究与学术交流。不断深化的防务关系与拉特尔扎大使领导的贸易轨道相辅相成；拉特尔扎大使已制定六个工作方向，包括政治关系、经济与商业议程、安全与防务以及科学与创新。", "image_url": "https://1000noticias.com.py/wp-content/uploads/2026/09/Municiones-que-compro-Paraguay-.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "西班牙科技代表团与阿根廷贸易代表团同一周齐聚亚松森（2026-09-17）", "date": "2026-09-17", "source_url": "https://www.lanacion.com.py/negocios_edicion_impresa/2026/09/17/mision-tecnologica-espanola-busca-sellar-nuevas-alianzas-de-negocios-en-paraguay/", "source_name": "La Nación / Rediex", "summary": "两个外国商务代表团同日抵达亚松森。一个由17家活跃于人工智能、软件、自动化和数字化转型领域的公司组成的27人西班牙技术代表团探讨了合作与落地机会；巴拉圭投资与出口促进局副部长爱德华多·古斯塔莱指出，出口正以约26%的速度增长，巴拉圭不再仅仅依赖农业。另外，一个由16家建筑、五金和制冷企业及28名商界人士组成的阿根廷代表团寻求建立合作关系、分销协议或将业务迁至巴拉圭。这种汇聚体现了该国的双重吸引力：既是区域企业的低税收、低能源成本生产基地，也是新兴的数字服务目的地。这也提高了本地合作伙伴以及围绕数据中心和工业建设布局的供应商的竞争筹码。", "image_url": "https://www.lanacion.com.py/resizer/v2/2CWLCQPNK5EYZAGDHWY75QOEW4.jpg?auth=ce69d9b79ef3588501ea02b7c4e5eddca4a3d19cd5443f9497ec6a994498a455&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "纽约巴拉圭日吸引该国历史上最大商务代表团，但工业和贸易部承认存在能源瓶颈（2026-09-17）", "date": "2026-09-17", "source_url": "https://www.hoy.com.py/negocios/comercio-e-industrias/2026/09/18/mas-de-50-empresarios-paraguayos-buscan-inversionistas-en-nueva-york", "source_name": "Diario HOY / MIC", "summary": "工业和商务部长马尔科·里克尔梅率领50多名巴拉圭企业代表——这是该国历史上规模最大的此类代表团——前往纽约，参加与美国银行和摩根大通联合举办的投资日活动，重点推介林业、物流、能源和制造业。里克尔梅公开承认存在能源瓶颈：代表超过7000兆瓦的项目正在等待并网，相当于巴拉圭在伊泰普水电站的全部份额发电量。他说，这需要推进国家电力管理局现代化，并向私人资本开放发电领域。这一表态意义重大，因为能源可用性是该国向数据中心和人工智能投资者推介的核心前提，而且它与该国有电力公司发出的警告一致，即如果没有新增发电，伊泰普的剩余电力可能在2030年前后耗尽。", "image_url": "https://www.lanacion.com.py/resizer/v2/KMCJ54ZO4NHIZPYUU2OGAIY6KA.jpg?auth=ebf376f61ba091999a6c43d1985a01120bd631e4954a52cc38b712e753d17548&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": "", "description": "请在下一则消息中提供需要翻译的英文内容。"}, {"title": "五、行业专题：通讯、运营商、数字能源与AI", "tier": 1, "events": [{"title": "信息和通信技术部提议为人工智能设立监管沙盒，并坚持数据保护和网络安全法律必须先行（2026-09-16）", "date": "2026-09-16", "source_url": "https://mitic.gov.py/ministro-villate-detalla-la-proyeccion-de-soberania-tecnologica-y-el-fortalecimiento-de-la-ciberseguridad/", "source_name": "MITIC", "summary": "在一次公开听证会上，信息与通信技术部长古斯塔沃·比利亚特提议为人工智能创建一个监管沙盒——一个受控测试环境——而不是制定一部独立的人工智能法律。与会者一致认为，必须首先颁布个人数据保护法和网络安全法，作为信任基础。比利亚特阐述了国防部负责的网络防御与由信息与通信技术部（MITIC）网络安全总局管理的民事、公共和私营领域之间的机构分工，计算机应急响应小组（CERT）目前正开展24/7全天候持续监测。他在9月7日至11日于亚松森举行的第49届美洲电信委员会第一常设协商委员会（CITEL CCP.I）会议上介绍了同一框架，在会上他称网络安全是全球面临的最大挑战之一，并提到与美洲国家组织（OAS）合作更新2024—2025年国家网络安全计划。他还在外交和领事学院介绍了该框架，并将数据保护和网络安全议程定位为巴拉圭实现其成为技术中心雄心的先决条件。", "image_url": "https://dplnews.com/wp-content/uploads/2026/08/dplnewsVillate_rp26082026.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "蜂巢报告称已在巴拉圭签约300兆瓦，目标年底前达到400兆瓦，因加密货币与人工智能负载寻求到2037年的电价确定性（2026-09-17）", "date": "2026-09-17", "source_url": "https://www.abc.com.py/economia/2026/09/03/advierten-que-criptos-y-centros-de-ia-quieren-10-anos-mas-de-tarifa-privilegiada-en-paraguay/", "source_name": "ABC Color", "summary": "蜂巢数字公司报告称，其在巴拉圭的100兆瓦巴伦苏埃拉电厂和200兆瓦伊瓜苏电厂已签约300兆瓦，目标是到2026年底达到400兆瓦，并正在将其一级设施改造为三级设施，以提供高性能计算和人工智能云服务。该公司与特殊密集用电群体的其他成员正在请求国家电力管理局将其优惠供电合同从目前的2027年12月31日到期延长至2037年；蜂巢数字巴拉圭总裁加布里埃尔·拉马斯表示，该行业按可中断方式运营，不与居民或工业用电竞争，并且需要十年的可预见性来筹集资金，以实现1000兆瓦的目标。国家电力管理局坚持2027年为不可延长的最后期限。能源专家里卡多·卡内塞反驳称，电价应约为每兆瓦时80美元，而不是目前的每兆瓦时44美元，并估计年收益为2.84亿美元；他还指出，加密货币挖矿每兆瓦创造0.83个就业岗位，而全国平均水平为721个就业岗位。", "image_url": "https://oviedopress.com/wp-content/uploads/2025/10/criptomineria.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "独立研究建议到2030年国家电力管理局电价累计上涨39.4%，伊泰普谈判临近（2026-09-15）", "date": "2026-09-15", "source_url": "https://elnacional.com.py/economia/plan-reajustar-tarifa-ande-genera-nuevo-debate-n110033", "source_name": "El Nacional", "summary": "由布宜诺斯艾利斯大学能源监管活动研究中心（CEARE-UBA）开展、美洲开发银行支持的一项技术研究建议，在2026年至2030年间分阶段将巴拉圭国家电力公司（ANDE）的电价累计上调39.4%，使平均电价从约49.2美元/兆瓦时提高到68.6美元/兆瓦时，以弥补约20亿美元的财政缺口；其他参考资料提到的涨幅最高达45.6%。行政部门和国家电力公司强调，这只是一项技术分析，居民用户今年不会面临涨价，任何调整都需作出政治决策。这场争论与伊泰普问题密不可分：2024至2026年的电价被冻结在每千瓦每月19.28美元，培尼亚总统希望实行三年固定电价，并表示巴拉圭不会接受2026年后降价；这与2024年与巴西达成的双边协议相悖，该协议规定从2027年起电价应仅反映《附件C》运营成本。若按这一水平确定新电价，国家电力公司每年将承担约7300万美元的成本。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/bd0cbc9/2147483647/strip/true/crop/777x437+0+60/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F11%2Fc5%2Fceb550a9480d8b166fc5d4b9b219%2Fuheco20260907-010b-ph01-15838.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "2026年巴拉圭科技周吸引来自20多个国家的风险投资基金，展示该国作为人工智能和数据中心沙盒（2026-09-13）", "date": "2026-09-13", "source_url": "https://marketdata.com.py/noticias/paraguay-tech-week-2026-startups-y-fondos-de-inversion-analizan-oportunidades-de-negocio-en-paraguay-154817/", "source_name": "MarketData", "summary": "作为2026年巴拉圭科技周的一部分，第三届风险投资与初创企业峰会汇聚了来自20多个国家的企业家和投资基金。与会者强调，低税负、廉价可再生能源以及该国近期获得投资级评级共同构成吸引科技公司的组合优势，并将巴拉圭描述为发展具有区域辐射力的数据中心和人工智能的理想试验场。这一活动强化了政府围绕与台湾合作的伊瓜苏数字主权人工智能计算项目以及台湾—巴拉圭理工大学旁的创新区科技园所展开的定位战略；这两个项目目前仍处于可行性研究或建设阶段。不过，乐观情绪因本周其他场合所指出的同一制约因素而有所降温：电网接入等待容量已超过7000兆瓦，高耗能用户的电价框架也尚未解决。", "image_url": "https://marketdata.com.py/wp-content/uploads/2026/08/WhatsApp-Image-2026-08-05-at-9.15.30-AM-1.jpeg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": "", "description": "好的，请发送需要翻译的英文内容。"}, {"title": "六、主要客户动向", "tier": 1, "events": [{"title": "Claro报告5G覆盖八个城市，并使用诺基亚设备建成100个无线基站（2026-09-18）", "date": "2026-09-18", "source_url": "https://www.telesemana.com/blog/2025/12/18/claro-enciende-la-primera-red-5g-de-paraguay-con-una-inversion-de-us-35-millones/", "source_name": "Telesemana / Claro Paraguay", "summary": "克拉罗巴拉圭公司是2025年12月在该国首家推出商用5G的运营商，该公司报告称其覆盖范围目前涵盖中部地区以及奥维多上校城、比亚里卡、佩德罗胡安卡瓦列罗、埃尔南达里亚斯、东方市、恩卡纳西翁和坎比雷塔。技术总监劳尔·阿吉莱拉表示，截至2025年底，该公司已安装50个基站，并将在2026年年中前完成其余50个基站，以履行与其在3.5 GHz频段获得的200 MHz频谱相关的100个基站义务，其中10%预留给国家机构。此次部署采用诺基亚的AirScale 5G产品组合，包括ReefShark芯片组、大规模MIMO无线电和IPAA+天线。总经理阿尔弗雷多·阿尔卡拉斯指出，兼容手机的供应是阻碍大规模普及的主要障碍；该公司还将五年期牌照期限列为其主要的监管不满，而首个牌照期内的计划总投资为3500万美元。", "image_url": "https://www.telesemana.com/wp-content/uploads/2025/05/5G-Claro.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Claro / AMX Paraguay — 5G network leadership"}, {"title": "蒂戈凭借2.3 GHz频谱和1亿美元基础设施融资，接近其2027年2月的5G启动最后期限（2026-09-16）", "date": "2026-09-16", "source_url": "https://www.datacenterdynamics.com/es/noticias/tigo-y-personal-se-adjudican-espectro-5g-en-la-segunda-licitaci%C3%B3n-de-paraguay/", "source_name": "DCD / Millicom", "summary": "米利康旗下巴拉圭品牌蒂戈在第二次5G拍卖中以160万美元赢得2.3–2.4 GHz频段，加上其已在2300/2600 MHz持有的50 MHz频谱。该牌照要求在90天内提交详细工程项目，并在180天内开通商用服务，因此最晚启动日期为2027年2月，部署预计在2026年底前开始。蒂戈须在四年内建设100个基站，并在两年内为国家机构建设10个基站。该运营商获得美洲开发银行投资公司和普罗帕科于2026年3月宣布的1亿美元私募债券融资，用于加快4G/4.5G/5G和光纤部署。8月，反垄断机构国家竞争委员会批准了阿提斯集团收购米利康281座通信塔的交易，该交易采用售后回租方式，蒂戈仍为锚定租户，从而在5G建设前将无源基础设施货币化。", "image_url": "https://www.telesemana.com/wp-content/uploads/2025/04/FWA.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo / Millicom — 5G rollout & tower monetization"}, {"title": "个人电信赢得3.7 GHz 5G频谱，并连续第五年扩大其固定互联网领先优势（2026-09-16）", "date": "2026-09-16", "source_url": "https://dplnews.com/personal-y-claro-lideran-velocidad-de-internet-fijo-en-paraguay/", "source_name": "DPL News / nPerf", "summary": "阿根廷电信旗下努克莱奥股份公司的子公司佩尔索纳尔在第二次5G拍卖中以100万美元获得了3.7–3.8 GHz频段，并面临与蒂戈相同的2027年2月商用启动截止日期和建设100个无线基站的义务。与此同时，2026年恩佩尔夫固定互联网晴雨表将佩尔索纳尔连续第五年评为第一，平均下载速度为148.39 Mbps，得分为103,262，领先于克拉罗的114.21 Mbps和蒂戈的84.30 Mbps。佩尔索纳尔提供的光纤套餐最高下行400 Mbps、上行100 Mbps，被描述为市场上光纤扩张最激进的运营商之一，价格在35美元至70美元之间。该运营商集固定网络领先地位与中频段5G频谱于一身，这使其在支撑数据中心和云需求的企业和批发细分市场中占据强势地位。", "image_url": "https://dplnews.com/wp-content/uploads/2025/05/dplnews_banda-ancha_mc22525-1024x678.webp", "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal / Núcleo S.A. — 5G licence & fixed-network leadership"}, {"title": "总审计长未发现证据表明努比科姆正在部署其按规定应建的无线基站，仅确认一处站点（2026-09-14）", "date": "2026-09-14", "source_url": "https://dplnews.com/paraguay-contraloria-general-califico-insuficientes-exigencias-conatel-para-nubicom/", "source_name": "DPL News / CGR", "summary": "总审计署指出，目前没有足够证据表明努比科姆正在部署其3.5GHz牌照第一年所需的22个无线基站，已确认投入运营的基站仅有一个，位于亚松森的维拉莫拉街区。总审计署要求国家电信委员会在五个工作日内作出回应，并批评其缺乏详细的监测机制，同时澄清目前阶段尚不能认定部署承诺已被违反——只是存在“控制和可追溯性薄弱”的问题。此前特别审计中的发现包括：逾期提交文件、仅通过未经独立确认的宣誓声明来验证10万活跃用户要求，以及缺少经核实的行业经验或最低财务能力证明。与伊蒂·萨埃卡和巴斯克斯集团有关联的努比科姆承诺投资约7800万美元，并推动开放式无线接入网5G独立组网部署。吊销牌照的可能性仍然存在。", "image_url": "https://dplnews.com/wp-content/uploads/2021/01/conatel.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom — 5G licence compliance risk"}, {"title": "科帕科-沃克斯：国有运营商寻求私人资本，沃克斯公布负资产 85,609 百万瓜拉尼（2026-09-16）", "date": "2026-09-16", "source_url": "https://www.abc.com.py/tag/hola-paraguay-sa/", "source_name": "ABC Color", "summary": "国有运营商科帕科和沃克斯的新任总裁罗德里戈·费雷拉接手了一场日益加深的财务危机。沃克斯录得净亏损33,314百万瓜拉尼，净权益为负85,609百万瓜拉尼，对科帕科的债务超过178,316百万瓜拉尼；科帕科自身在六年内流失了超过200,000名固话用户。政府表示，将优先考虑以“风险共担”结构吸引私人资本，而非彻底私有化，并且在截止期限过后仍未出台救助计划。工会代表警告科帕科-沃克斯将出现“人员清洗”，而提交至众议院的一项全国漫游法案仅得到科帕科的赞成，因为该法案将允许沃克斯在无需进一步投资的情况下使用竞争对手的网络覆盖。科帕科约12,000公里的光纤、沃克斯的2,500公里光纤以及400个站点，仍是国家主要的批发基础设施资产。", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Copaco / Vox — state operator restructuring"}], "impact_analysis": "", "user_notes": "", "description": "一份关于巴拉圭宏观经济前景的私人报告警告称，央行（BCP）对2025年的增长预测可能难以实现，因为存在可能对经济活动产生负面影响的外部和内部因素。该国面临复杂的经济前景，面临财政赤字、通货膨胀风险、汇率压力和基础设施赤字等挑战。\n\n根据“发展研究所”（ID）准备的“经济形势报告”，央行预计2025年国内生产总值将增长3.5%，这一目标在日益复杂的经济环境中实现起来面临重大障碍。在可能减缓巴拉圭增长的因素中，报告提及基础设施赤字以及主要贸易伙伴增长乏力，如巴西和阿根廷。\n\n巴西经济增长放缓及巴拉圭主要产品可能遭遇的贸易壁垒，对出口来说代表着重大风险。\n\n在IMF/WB年会框架内发布的最新《世界经济展望》报告中，国际货币基金组织将巴拉圭2025年的增长预测下调至3.2%，反映出更加审慎的预期。\n\n**财政政策：扩张但受限制**\n\n财政方面显示出扩张性特征，但受制于《财政责任法》和自2023年起观察到的赤字下降趋势。据经济部最新报告，截至2024年9月，累计赤字为2.19亿美元（占GDP的-0.5%），而年度计划为-1.1%。这一改善归因于巴拉圭河水位恢复带来的更多特许权使用费收入，以及税务改革带来的税收增长。\n\n不过，预计今年将进一步增加公共投资的趋势将持续，旨在缩小基础设施差距。\n\n**通胀：面临汇率传导风险**\n\n自2023年以来，通胀率一直处于目标区间（4%±2%），9月同比为1.8%，月环比为0.2%。水果和蔬菜产品的价格压力依然存在，而服务业呈现温和增长。\n\n主要风险来自汇率对价格的传导。美元自4月以来的持续升值趋势（主要反映了美国的货币政策和全球不确定性）可能开始影响进口商品的价格。\n\n**利率：有下调空间**\n\n央行继续实施宽松的货币政策，将利率维持在6.0%。考虑到通胀率在目标范围内且存在有利于降低利率的条件，下调基准利率的空间是存在的。\n\n**汇率：压力持续**\n\n美元4月开始的升值压力趋势在10月依然延续，这与美国利率预期调整及全球不确定性增加有关。美元走强影响巴拉圭的货币和财政政策以及对外部门。\n\n**贸易：出口表现不佳**\n\n2024年出口同比下降，主要受价格效应影响。从出口量来看，表现优于2023年，但价格持续下跌。截至7月，出口累计下降1.4%，其中初级产品下降8.3%。\n\n巴西是巴拉圭出口的主要目的地，其经济放缓可能减少需求并对贸易平衡造成压力。\n\n**Fonplata和评级机构**\n\n在利马，巴拉圭经济团队与Fonplata和评级机构举行了会议，并确认了将用于基础设施工程的新资金。\n\n**其他要点：**\n\n- 受主要贸易伙伴增长乏力影响，2025年增长预测存在下调风险。\n- 财政赤字继续低于计划，显示出审慎的财政管理。\n- 通货膨胀仍在掌控之中，但汇率传导可能带来额外压力。\n- 货币政策利率保持在6.0%，存在下调空间。\n- 汇率压力持续，对进口价格、债务和货币政策构成风险。\n- 出口下降反映出如果贸易伙伴经济放缓持续，可能加剧的风险。\n- 实现3.5%的增长目标将是重大挑战，尤其是在外部需求疲软和基础设施赤字制约竞争力的背景下。"}, {"title": "七、对企业经营的综合影响分析", "tier": 2, "events": [], "impact_analysis": "🟡 货币仍是唯一的主导运行变量。9月17日发布的9月经济变量预期调查显示，分析师将2026年底通胀率预测下调至3.0%，并预计到12月瓜拉尼汇率为1美元兑6100瓜拉尼——较5915至5920瓜拉尼附近的即期汇率略有贬值，但仍远低于年初开盘时的6600瓜拉尼。以美元计价的每一项收入折算后较一年前减少约20%。大豆产业链精准体现了这一机制：出口量创下纪录，截至8月谷物发货量达7,413,675吨，价值28.86亿美元，较2025年增加约9.07亿美元；然而出口商利润空间受到挤压，因为同样美元能换取的瓜拉尼减少。牛肉则是相反的例子：出口额下降7%，出口量下降近24%，尽管平均价格升至每吨6,972美元。对2026—2027年任何本币预测进行预算编制时，应以6100至6300瓜拉尼的区间为基准，而不是5900瓜拉尼的即期汇率，并对区间两端进行压力测试。\n\n🟡 财政紧缩现在已成为政府每项决策的硬约束。第三季度的三起社会冲突均在9月13日至20日的同一周内得到解决——教师接受了加薪5%的方案，耗资4700万美元；医生接受了一揽子方案，包括2027年药品资金2.6亿美元，外加每个岗位200万瓜拉尼、2300个长期职位——而这三项结果现在都落在两院预算委员会正在审议的2027年预算上，该委员会的报告应于10月底前提交。在国际货币基金组织预计2026年财政赤字占GDP的3.5%、2027年提案要求国会给予《财政责任法》临时例外以将赤字提高至3.9%的背景下，政府同时还向工业界承诺了1亿美元信贷额度、一项担保基金以及工贸部与国家旅游秘书处的合并，并承诺在2027年发行27.08亿美元债券，比今年多70%。公共部门的支付纪律和任何资本支出的时间安排都应被视为存在风险，尤其是对卫生、教育和基础设施预算有敞口的供应商而言。\n\n🟡 能源而非需求才是新投资的约束性瓶颈。本周最具分量的表态是工业部长马科·里克尔梅在纽约巴拉圭日活动上承认，超过7,000兆瓦的项目正在等待并网——相当于巴拉圭在伊泰普水电站的全部份额发电量——这要求对巴拉圭国家电力管理局（ANDE）进行现代化改造，并向私人资本开放发电领域。与此同时，美洲开发银行支持的一项独立研究建议到2030年累计上调电价39.4%，与巴西的伊泰普电价谈判尚未解决，国家电力管理局拒绝在2027年12月31日之后延长优惠合同，以及蜂巢公司推动获得十年期可见度，以便为从300兆瓦增至1,000兆瓦的路径融资。对于任何项目储备依赖于数据中心、加密货币挖矿或电力密集型负荷增长的供应商或承包商而言，风险已从需求转向并网时间、电价设计和合同期限。\n\n🟢 电信资本支出已承诺且有时间限制。蒂戈和个人电信均面临2027年2月商业启动的硬期限，各自承担100个无线基站的建设义务，此外还有克拉罗的3500万美元第一阶段计划及其100个基站，这些基站主要由诺基亚建设。蒂戈已通过美洲开发银行投资公司/普罗帕科债券获得1亿美元，并通过阿蒂斯售后回租将281座铁塔变现。这是市场上最可预测的需求池，但也是最短的——建设窗口在2027年前关闭，此后支出将从覆盖转向容量。努比科姆仍是异类，也是信用风险，因为审计长无法证明22个所需站点中有超过一个在运营。\n\n🟢 贸易准入正在多条战线同时扩大。参议院外交关系委员会于9月16日一致批准了南方共同市场–欧洲自由贸易联盟协定；美国对巴拉圭开放了30万吨牛肉配额，并以10%为目标；新任驻华盛顿大使正将通往8万吨的路径列为优先事项；西班牙和阿根廷商务代表团在同一周抵达。这些都不会转化为近期收入，但会实质改善物流、冷链、加工设备和涉农产业供应的中期可开发市场。", "user_notes": "", "description": "收到，请发送需要翻译的英文内容。"}, {"title": "八、对中资企业的专项影响与建议", "tier": 2, "events": [], "impact_analysis": "🔴 与台湾的结盟现已结构性嵌入采购流程。本周最明确的信号是第二次5G拍卖结果：蒂戈凭借诺基亚设备获得2.3 GHz频段，个人电信获得3.7 GHz频段，而克拉罗的3.5 GHz网络也由诺基亚承建。招标规则要求投标方须来自与巴拉圭保持外交关系的国家，这排除了中国供应商，且中国企业在两轮拍卖中均未获得牌照。培尼亚总统已公开将针对拍卖的批评归因于中国政府的压力。同样的逻辑正被制度化地纳入与台湾合作的伊瓜苏数字主权人工智能算力项目，其备忘录考虑为数据基础设施提供外交级别的特权。应假定被排除在与国家关联及持牌运营商的5G核心网和无线接入网采购之外，并通过间接渠道进行规划——企业网络、铁塔与无源基础设施、数据中心的供电与制冷、光纤，以及与中标运营商的分销关系。\n\n🟡 中国仍是巴拉圭未建交的最大贸易伙伴，且不对称性正变得更加明显。中国占巴拉圭进口的36.4%，超过任何其他来源地，而双边贸易通过第三国转口进行。巴拉圭外交部表示，中国记录的巴拉圭大豆进口为“零”，据估计，第三国转口成本约为每吨45美元，整个大豆产业链年损失达4亿至6亿美元。巴拉圭自身立场——由外交部长鲁文·拉米雷斯·莱斯卡诺重申——是只有与台湾关系不受影响才会与中国贸易，而这是北京拒绝的“红线”。预计巴拉圭农业出口商和进口商将继续施压以推动建立正式联系；应将此问题视为一个现实存在但进展缓慢的问题，不会在本预算周期内解决。\n\n🟡 财政约束意味着公共部门支付风险真实存在。在2027年预算请求豁免《财政责任法》以将赤字率定为3.9%、计划发行27.08亿美元债券以及政府同时履行对教师、医生和工业界承诺的背景下，浮动债务存量和供应商付款速度值得积极监控。本周最具体的警告是，新任卫生部长指出社会保障协会资产中存在“因疏忽而生的违规行为”。在向公共部门买方提供信用条件之前，应核实具体预算科目和当前付款历史，而不是依赖主权层面的保证。\n\n🟢 不需要政治结盟的定位机遇。能源部长级官员承认 7,000 兆瓦的负荷无法并网，且国家电力管理局需要私营发电，这为电网设备、变电站、变压器、输配电硬件、计量和需求管理创造了真正的机会——在这些领域，中国供应商在成本和交付时间上具备竞争力，且不触及 5G 采购排除条款。同样，围绕 39.4–45.6% 电价调整的争论意味着国家电力管理局未来需要进行大规模资本投资。数据中心冷却、配电以及蜂巢公司三级改造和类似项目建设所需的机柜，均可通过商业渠道获得。最后，西班牙和阿根廷代表团瞄准建筑、硬件和制冷领域，表明竞争压力正在分销商和中小企业细分市场加剧，而这些细分市场历来是天然的切入点——应尽早着手合作伙伴选择，否则可能会被抢占先机。\n\n🟢 治理与社会风险低于新闻头条所暗示的水平。三大社会冲突——教师、医生和预算之争——均已在窗口期内降级，其中医生原定9月21日至22日的罢工已被明确取消，学校也于9月18日复课。近期剩余的政治风险是10月4日的市政选举，以及“荣耀科罗拉多”运动内部卡特斯阵营与佩尼亚阵营之间明显的紧张关系。这不会影响商业运营，但可能会在投票前后几周内拖慢人事任命和审批。上巴拉那省的安全增援——40名猞猁特警、20辆摩托车以及无人机和摄像头计划——对东方市物流和工业区周边人员安全是一个积极信号。", "user_notes": "", "description": "好的，请发送需要翻译的英文内容。"}]}, "en": {"topic": "Paraguay Briefing", "time_span": "September 13 – September 20, 2026", "time_label": "Last week", "sections": [{"title": "I. Macroeconomic Developments", "tier": 1, "events": [{"title": "BCP September Survey: Analysts Lift 2026 Growth to 4.5%, Cut Inflation to 3.0% and See the Guaraní at G. 6,100 by December (2026-09-17)", "date": "2026-09-17", "source_url": "https://www.lanacion.com.py/negocios_edicion_impresa/2026/09/17/agentes-proyectan-mayor-crecimiento-y-un-dolar-a-g-6100-para-fin-de-2026/", "source_name": "La Nación / BCP", "summary": "The BCP's September Survey of Economic Variables Expectations (EVE) shows analysts raising their 2026 GDP growth forecast to 4.5%, up from 4.3% in August and above the IMF's 4.4%, keeping 2027 at 4.0%. The end-2026 inflation forecast was cut to 3.0% from 3.3%, with a 2.8% mean, well inside the central bank's 3.5% ±2pp target; agents expect 0.2% monthly inflation for both September and October. The projected nominal exchange rate was revised down to G. 6,015/USD for September and G. 6,100/USD for December (from G. 6,150), with G. 6,300 seen for end-2027. The policy rate is expected to stay at 5.50% through 2026 before easing to 5.25% in 2027, confirming a neutral stance that keeps carry-trade inflows supporting the guaraní.", "image_url": "https://www.lanacion.com.py/resizer/v2/2QCD37M7SZCIDJGEV3V3KMUTHM.jpg?auth=260a47bcc7813927dd11ca45922f552f51cb412eeb4da236c7432e761fd5b712&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "Soy Complex Posts Record USD 3,877 Million in Eight Months, Equal to 40% of Paraguay's Total Export Earnings (2026-09-16)", "date": "2026-09-16", "source_url": "https://www.ultimahora.com/complejo-sojero-genera-usd-3-877-millones-y-marca-record-exportador", "source_name": "Última Hora / Capeco", "summary": "Capeco's foreign-trade report, released on 16 September, confirms the soy complex generated USD 3,877 million in the first eight months of 2026, 40% of all Paraguayan export revenue. Soybean grain shipments reached 7,413,675 tonnes, up from 5,406,291 tonnes a year earlier, worth USD 2,886 million, roughly USD 907 million more than in 2025. Soybean oil exports rose 6% to 449,142 tonnes and pellets 12% to 1,617,365 tonnes, both records. Argentina took 86% of grain shipments, Brazil 10%, with the remainder split among Russia, Saudi Arabia, Vietnam, the United States, Uruguay, Chile and South Korea; exports to Russia resumed. Fifty-three companies participated in the 2025/26 harvest. The concentration in Argentina remains a structural vulnerability for the sector and amplifies exposure to the guaraní's appreciation.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/2bbff15/2147483647/strip/true/crop/1180x664+0+111/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fadjuntos%2F161%2Fimagenes%2F007%2F992%2F0007992646.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "MEF Announces Fourth Treasury Bond Auction of 2026 for September 23, Reopening 2030 and 2035 Series (2026-09-18)", "date": "2026-09-18", "source_url": "https://www.lanacion.com.py/negocios/2026/09/18/mef-anuncia-la-cuarta-emision-de-bonos-del-tesoro/", "source_name": "La Nación / MEF", "summary": "The Ministry of Economy and Finance scheduled its fourth domestic Treasury bond placement of 2026 for Wednesday 23 September, reopening two series maturing in 2030 and 2035 with semi-annual coupons. The operation runs through the Asunción Stock Exchange (BVA), only the second time this channel has been used this year after placements had been conducted exclusively via the central bank. Proceeds help finance the 2026 budget and deepen the local capital market. Previous 2026 auctions raised G. 698,000 million in April and G. 974,350 million in June via the BCP, plus G. 360,548 million in July via the BVA, roughly G. 2 trillion (about USD 339 million) in total. The 2027 budget submitted to Congress foresees bond issuance of USD 2,708 million, 70% more than 2026, with 99% planned for international markets.", "image_url": "https://www.lanacion.com.py/resizer/v2/DPOAIEEDKZAUROFCIZ36NONJSE.jpg?auth=7a877a81adde20c1ba4f8491de047d31cd1b4d515386ddc8d55ee71b17733996&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "BCP Breaks Silence on Senate Information Requests and Reaffirms the Soundness of the Financial System (2026-09-18)", "date": "2026-09-18", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/negocios/2026/09/18/bcp-garantiza-apertura-en-consultas-del-legislativo-y-ratifica-solidez-del-sistema/", "source_name": "La Nación / BCP", "summary": "After weeks of silence, central bank governor Carlos Carvallo and the Association of Banks (Asoban), represented by Liz Cramer, met President Santiago Peña and committed to answering the Senate's information requests on the operations of four private banks linked to the Ueno Bank case. Carvallo ratified the solvency of the financial system and the institution's willingness to provide the required documentation, while Asoban confirmed its members would cooperate. Peña said 'doubts must be cleared up'. The Senate's requests, driven by the ruling Honor Colorado caucus with opposition support, cover 31 questions on Ueno's related-party exposure, public-sector deposits, a USD 35 million portfolio sale and a July 2026 supervisory memorandum, as well as the GNB-BBVA, Sudameris-Regional, Continental-Río and Atlas-Familiar integrations. The BCP has 15 working days to respond under Article 192 of the Constitution.", "image_url": "https://www.lanacion.com.py/resizer/v2/AG2C4XXGUNHTZAZPMYNG22SBJA.jpg?auth=b29f20881f5f8407382fad8d7feb9d6dfdc807ac3f6b5d7eabbff0f86cef7d85&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "II. Political & Policy Developments", "tier": 1, "events": [{"title": "Peña Unveils Three 'Historic' Industry Measures: USD 100 Million Credit Line, Fogain Guarantee Fund and MIC–Senatur Merger Bill (2026-09-18)", "date": "2026-09-18", "source_url": "https://www.lanacion.com.py/editorial/2026/09/18/el-gobierno-lanzo-propuestas-de-creditos-para-darle-mas-impulso-a-la-industria/", "source_name": "La Nación / MEF", "summary": "At the 90th anniversary dinner of the Paraguayan Industrial Union (UIP), President Santiago Peña announced three measures to boost manufacturing. The 'Paraguay Industrial' credit line carries an initial fund of USD 100 million (G. 600,000 million) with rates of 10.5% in guaraníes and 8.5% in dollars, terms of up to 15 years, grace periods of up to three years and a ceiling of USD 2.5 million per company, channelled through financial intermediaries accredited by the Development Finance Agency (AFD) and earmarked for machinery, equipment, technology and infrastructure, with up to 20% usable as working capital. Peña also signed the decree creating Fogain, a guarantee fund for firms lacking sufficient collateral, and handed Congress president Basilio Núñez a bill merging the Ministry of Industry and Commerce (MIC) with the Tourism Secretariat (Senatur), granting legal recognition to Rediex and strengthening trade-defence powers. Industry Minister Marco Riquelme said 'the excuses are over'.", "image_url": "https://lanacionpy.nyc3.digitaloceanspaces.com/img/ln-fb-share.png", "is_gov_source": true, "is_authoritative": true}, {"title": "Isaías Fretes Sworn In as New Health Minister, Inheriting the Doctors' Settlement and the IPS Portfolio (2026-09-18)", "date": "2026-09-18", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/politica/2026/09/18/isaias-fretes-juro-como-nuevo-ministro-de-salud-publica-ante-santiago-pena/", "source_name": "La Nación", "summary": "President Peña swore in Isaías Ricardo Fretes Zárate as Minister of Public Health and Social Welfare at the Government Palace, in a ceremony attended by Congress president Basilio Núñez and Chamber of Deputies president Raúl Latorre. Fretes was appointed by Decree No. 6889 of 13 September after chairing the IPS board. His appointment caps a turbulent period that saw 446 specialist resignations and a national doctors' strike, resolved days earlier with a package worth USD 260 million in additional 2027 medicines funding, a G. 2 million per-post salary rise and 2,300 permanent appointments. Fretes warned his successor at the IPS, Derlis León, about 'irregularities born of neglect' found on the institution's land in the Chaco, signalling the pension fund's governance is next on the reform agenda.", "image_url": "https://www.lanacion.com.py/resizer/v2/AGKPDZPC35ANPLVXJFLKHSDCUE.jpeg?auth=5487110a25c3e31da39eaf85efd752f6533be277feb2308b5a0ab113dcd68215&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "Peña Tells Honor Colorado to Freeze the 2028 Ticket Debate and Focus on the October 4 Municipal Vote (2026-09-18)", "date": "2026-09-18", "source_url": "https://www.latribuna.com.py/politica/2026/09/18/santiago-pena-pide-congelar-el-debate-2028-y-enfocarse-en-las-municipales/", "source_name": "La Tribuna", "summary": "President Peña publicly asked the Honor Colorado leadership to shelve the debate over the 2028 presidential ticket and concentrate resources on the 4 October municipal elections, backing the Lista 1 candidates. He said his relationship with Horacio Cartes 'is fine' and denied that Vice-President Pedro Alliana had left Honor Colorado. The intervention followed a week of visible internal friction: Cartes unilaterally named Juan Carlos Baruja as precandidate for vice-president for 2028, angering Alliana, while the Senate's information request on Ueno Bank — a bank historically linked to the Cartes group — was read by dissident deputy Roberto González as the trigger, with the remark that 'Horacio tweaked the President's ear'. Deputy Daniel Centurión blamed Cartes for the tension. The episode leaves the ruling coalition visibly strained 16 days before the municipal vote.", "image_url": "https://www.latribuna.com.py/resizer/v2/WCB5M2CML5H4DPXZAWF6UYBCBY.JPG?smart=true&auth=e6c490fc3542edbf11018fb985d3d80dd2592cb1499f9d103db472c84609770f&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}, {"title": "Municipal Campaign Enters the Final Stretch Under a Poll-Publication Blackout; Camilo Pérez Holds a Wide Lead in Asunción (2026-09-19)", "date": "2026-09-19", "source_url": "https://www.lanacion.com.py/politica/2026/09/19/hay-mucho-optimismo-se-siente-la-victoria-dice-camilo-perez/", "source_name": "La Nación", "summary": "With the 4 October municipal elections two weeks away, candidates closed out the campaign week with territory-heavy operations, and the legal deadline for publishing opinion polls expired on 18 September. In Asunción, the ruling-party candidate Camilo Pérez (Lista 1) held his third zonal meeting in Barrio Jara with over a thousand supporters, claiming 94% name recognition and a roughly 20-point internal lead; surveys published before the blackout put him at 50.4–50.8% against Soledad Núñez's 27%. Pérez's rival challenged him to a debate, saying 'they are not giving him permission'. In Fernando de la Mora an Ati Snead poll (15–17 September, 500 respondents) put Ariel Ojeda at 42.7% versus 34.6% for Luis Fernando Franco. Liberal senator Éver Villalba raised concerns about the vulnerability of voting machines and demanded an audit of the TSJE equipment.", "image_url": "https://www.lanacion.com.py/resizer/v2/7SWYMHNL2NALFALU76AW5LIQEY.jpeg?auth=26f7a4375c8f165a7cffecedd2cdacef1cd0838173dd2fcfc944c6543f282209&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "III. Social & Security Landscape", "tier": 1, "events": [{"title": "Government Defuses Teachers' Strike with a 5% Raise; Six Unions Accept, Four Press Ahead with a 48-Hour Walkout (2026-09-16)", "date": "2026-09-16", "source_url": "https://www.lanacion.com.py/pais/2026/09/16/paro-docente-dividido-seis-gremios-aceptan-el-5-y-los-otros-cuatro-van-a-la-huelga/", "source_name": "La Nación", "summary": "After negotiations between the education ministry (MEC), the finance ministry and teaching unions, the government offered a 5% salary increase for 2027 applied in two stages (2.4% already budgeted plus 2.6% from July 2027), with an estimated fiscal cost of USD 47 million. The FEP, which represents close to 80% of teachers, along with APE, ADP and Adofep accepted and lifted the measure. OTEP-SN, OTEP-A, UNE and MAS-MP rejected the offer, refused to sign, and ratified a 48-hour national strike for 17–18 September with a march from Plaza Batallón 40 to the finance ministry, demanding the 8% they call 'non-negotiable'. Education Minister Luis Ramírez said the ministry would seek a legal review of the limits of the action through a request to the labour ministry. The split marks the third front — after doctors and the budget — in the government's 2026 wage negotiations.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/03e3704/2147483647/strip/true/crop/1280x720+0+92/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Ff7%2Fb2%2F8855cd3f43cabc043f53a58da089%2Fwhatsapp-image-2026-09-16-at-13-53-09.jpeg", "is_gov_source": true, "is_authoritative": true}, {"title": "Dissident Unions Declare a Truce and Classes Resume Nationwide; Talks Shift to the Budget Bicameral (2026-09-18)", "date": "2026-09-18", "source_url": "https://www.lanacion.com.py/pais/2026/09/18/docentes-y-mec-van-a-cuarto-intermedio-tras-dialogo-que-busca-desactivar-la-movilizacion/", "source_name": "La Nación", "summary": "The four unions that had gone ahead with the strike declared a 'cuarto intermedio' and lifted the measure, allowing public schools to return to normal activities on Friday 18 September. Education Minister Luis Ramírez confirmed all public institutions were back in class and that the dissident unions had ultimately joined the government's proposal. Union leaders framed the retreat as a tactical pause rather than a settlement: OTEP-SN's Blanca Ávalos said negotiations would continue on two tracks, with the MEC over workload and with the Budget Bicameral Commission over sector funding, while OTEP-A's Gabriel Espínola stressed no agreement had been signed and that demands on infrastructure investment, inclusive education and free public schooling remained live. The government's management of the dispute is now tied directly to the 2027 budget debate, where health and education compete for the same constrained fiscal space.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/e8a5777/2147483647/strip/true/crop/1599x899+0+83/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F07%2Fe6%2Fad786e4c43bebcebd2f808a9056f%2F413ca4f3-ee41-4d39-894a-417e14f5f59f.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "SINAMED Accepts the Government's Offer and Calls Off the September 21–22 National Doctors' Strike (2026-09-16)", "date": "2026-09-16", "source_url": "https://www.lanacion.com.py/pais/2026/09/16/medicos-oficializan-la-suspension-de-la-huelga-tras-aceptar-la-propuesta-de-reajuste-salarial/", "source_name": "La Nación", "summary": "In an extraordinary assembly, the doctors' union SINAMED unanimously approved the government's proposal and formally lifted the 48-hour national strike scheduled for 21–22 September. The four-point deal covers USD 260 million in additional medicines and supplies in the 2027 budget; a G. 2 million salary increase per post paid progressively in 2027 (G. 500,000 in April, G. 500,000 in July and G. 1 million in December); the permanent appointment of 2,300 doctors with 1,500 further vacancies foreseen for 2027; and G. 1 million for working public holidays from January. SINAMED president Rossana González warned the union would mobilise again if the commitments are not honoured, and a special committee will lobby Congress. The agreement removes the most disruptive of the three social conflicts that have dominated the third quarter, but shifts the cost into the 2027 budget now under bicameral review.", "image_url": "https://www.lanacion.com.py/resizer/v2/BAV5I2PKMRHJ3J2JNBM5KNTGIQ.jpg?auth=fb5f605ae21848fd8b64b44fed50fdc468517f89a3fc360c85bf0770f300b865&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "Interior Ministry Reinforces Alto Paraná with 40 Lince Agents and 20 Motorcycles, Announces Drone and Camera Plan (2026-09-17)", "date": "2026-09-17", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/pais/2026/09/17/refuerzo-de-lince-riera-entrego-20-motos-y-40-agentes-para-policia-de-alto-parana/", "source_name": "La Nación", "summary": "Interior Minister Enrique Riera led the handover of 20 motorcycles and 40 Lince tactical-group agents to reinforce the Alto Paraná police, adding to 40 locally based motorised officers for a total of 40 motorcycles and 80 agents. The deployment was presented in downtown Ciudad del Este with motorised patrols, and Riera announced the opening of a Lince headquarters in the department plus a departmental security plan built on drones and cameras. The reinforcement follows a period of high-profile crime in the tri-border area, including an armed assault on a currency exchanger in Asunción in which the perpetrators posed as economic-crimes investigators and took between USD 10,000 and 15,000, and a home robbery with hostage-taking in Itapúa that ended in a three-kilometre chase and shootout. Security on the eastern border remains a recurring concern for logistics and data-centre investors in the department.", "image_url": "https://www.lanacion.com.py/resizer/v2/3RLB4H2V3FDM3IEGGSLOAPDYLI.jpeg?auth=92e036581970ac8f52d9bbcf2fca7332ee50fa4e009296a6cd46356d44a2d42c&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "IV. International Relations & Diplomacy", "tier": 1, "events": [{"title": "Senate Foreign Relations Committee Unanimously Approves the Mercosur–EFTA Free Trade Agreement (2026-09-16)", "date": "2026-09-16", "source_url": "https://www.lanacion.com.py/politica/2026/09/16/mercosur-aelc-senado-destaca-oportunidades-de-exportacion-e-inversion-para-paraguay/", "source_name": "La Nación", "summary": "The Senate's Foreign Relations and International Affairs Committee unanimously approved the bill ratifying the free trade agreement between Mercosur and the EFTA states — Switzerland, Norway, Iceland and Liechtenstein — in a working session chaired by Senator Antonio Barrios with Industry and Commerce Minister Marco Riquelme in attendance. The agreement creates a free trade zone with tariff reduction and elimination commitments, national treatment, disciplines on quantitative restrictions and import licensing, agricultural preferences and specific quotas for sensitive products. Riquelme said the deal allows tariff-free trade and opens export and investment opportunities into high-purchasing-power markets demanding food, sustainable products, agro-industrial goods and differentiated manufactures. Senators singled out Norway as the priority market and stressed the need for an equitable distribution of quotas among Mercosur members — the same fault line blocking the EU agreement.", "image_url": "https://www.lanacion.com.py/resizer/v2/YIHLXPETNBFHHN2N2FDCN42K3M.jpeg?auth=7ce0f358c0e544300544fde3bae5e5c38ae6291545bf68c41b9ede21b8da9886&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "New Ambassador to Washington Puts the Beef Agenda First, Targeting up to 80,000 Tonnes for the US Market (2026-09-18)", "date": "2026-09-18", "source_url": "https://www.lanacion.com.py/negocios/2026/09/18/nueva-embajadora-en-ee-uu-prioriza-la-agenda-carnica-con-senacsa/", "source_name": "La Nación / Senacsa", "summary": "Ambassador Estefanía Laterza, ratified by the Senate as Paraguay's representative in Washington, made the beef agenda her first working priority in a meeting with the animal-health and quality service Senacsa. The United States opened an additional 300,000-tonne beef quota distributed in three monthly tranches of 100,000 tonnes between 1 September and 30 November; Paraguay aims to capture up to 10% of that volume. The country currently ships 6,000–8,000 tonnes per month, had accumulated 35,000 tonnes by 31 August and projects around 60,000 tonnes for the year, with the ambassador naming 80,000 tonnes and a shift toward higher-value cuts as the medium-term objective. The US is Paraguay's second-largest beef buyer with 35,443 tonnes worth USD 211.5 million so far this year plus 1,458 tonnes of by-products worth USD 6.96 million.", "image_url": "https://www.lanacion.com.py/resizer/v2/LU4PO74TDFDO3AIXT7WVI253IA.jpeg?auth=583041d205aec528cd804751de645307256e118f111083cdb704d0ccafe605c1&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "Paraguay Buys More Than USD 1 Million in US Munitions Under the FMS Programme; Ammunition Plant Reactivation Under Review (2026-09-16)", "date": "2026-09-16", "source_url": "https://www.infobae.com/america/agencias/2026/09/16/paraguay-compra-a-eeuu-municiones-por-mas-de-un-millon-de-dolares/", "source_name": "Infobae / EFE", "summary": "Paraguay purchased more than USD 1 million in munitions from the United States through the Foreign Military Sales programme, and the government is evaluating the reactivation of a domestic ammunition factory. The purchase sits within a broader security and defence agenda that already includes the SOFA status-of-forces agreement, a third-country safe-haven arrangement, a migration memorandum, joint training and technology transfer against organised crime, and an understanding with a US university reserving 15 annual places for Paraguayan students administered through the anti-drugs secretariat Senad. A memorandum of understanding on nuclear energy, linked to diversifying the energy matrix, research and academic exchange, was also recently signed. The deepening defence relationship complements the trade track led by Ambassador Laterza, who has set out six workstreams including political relations, the economic and commercial agenda, security and defence, and science and innovation.", "image_url": "https://1000noticias.com.py/wp-content/uploads/2026/09/Municiones-que-compro-Paraguay-.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "Spanish Technology Mission and Argentine Trade Mission Converge on Asunción in the Same Week (2026-09-17)", "date": "2026-09-17", "source_url": "https://www.lanacion.com.py/negocios_edicion_impresa/2026/09/17/mision-tecnologica-espanola-busca-sellar-nuevas-alianzas-de-negocios-en-paraguay/", "source_name": "La Nación / Rediex", "summary": "Two foreign business missions arrived in Asunción on the same day. A Spanish technology delegation of 27 representatives from 17 companies active in artificial intelligence, software, automation and digital transformation explored partnership and establishment opportunities; Rediex vice-minister Eduardo Gustale noted exports are growing at around 26% and that Paraguay is no longer dependent on agriculture alone. Separately, an Argentine mission of 16 firms and 28 businesspeople in construction, hardware and refrigeration sought associations, distribution agreements or relocation to Paraguay. The convergence illustrates the country's dual pull: as a low-tax, low-energy-cost production base for regional firms and as an emerging digital-services destination. It also raises the competitive stakes for local partners and for suppliers positioning around the data-centre and industrial build-out.", "image_url": "https://www.lanacion.com.py/resizer/v2/2CWLCQPNK5EYZAGDHWY75QOEW4.jpg?auth=ce69d9b79ef3588501ea02b7c4e5eddca4a3d19cd5443f9497ec6a994498a455&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "Paraguay Day in New York Draws the Largest Business Delegation in the Country's History, but the MIC Admits an Energy Bottleneck (2026-09-17)", "date": "2026-09-17", "source_url": "https://www.hoy.com.py/negocios/comercio-e-industrias/2026/09/18/mas-de-50-empresarios-paraguayos-buscan-inversionistas-en-nueva-york", "source_name": "Diario HOY / MIC", "summary": "Industry and Commerce Minister Marco Riquelme led more than 50 Paraguayan business representatives — the largest such delegation in the country's history — to New York for investment days organised with Bank of America and J.P. Morgan, targeting forest industry, logistics, energy and manufacturing. Riquelme openly acknowledged an energy bottleneck: projects representing more than 7,000 megawatts are waiting for connection, equivalent to Paraguay's entire share of Itaipú output. He said this requires modernising ANDE and opening power generation to private capital. The admission is significant because energy availability is the central premise of the country's pitch to data-centre and AI investors, and it aligns with warnings from the state utility that the Itaipú surplus could be exhausted toward 2030 without new generation.", "image_url": "https://www.lanacion.com.py/resizer/v2/KMCJ54ZO4NHIZPYUU2OGAIY6KA.jpg?auth=ebf376f61ba091999a6c43d1985a01120bd631e4954a52cc38b712e753d17548&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "V. Industry Focus: Telecom, Digital Energy & AI", "tier": 1, "events": [{"title": "MITIC Proposes a Regulatory Sandbox for AI and Insists Data-Protection and Cybersecurity Laws Must Come First (2026-09-16)", "date": "2026-09-16", "source_url": "https://mitic.gov.py/ministro-villate-detalla-la-proyeccion-de-soberania-tecnologica-y-el-fortalecimiento-de-la-ciberseguridad/", "source_name": "MITIC", "summary": "In a public hearing, ICT Minister Gustavo Villate proposed creating a regulatory sandbox for artificial intelligence — a controlled testing environment — rather than a standalone AI statute. Participants agreed that a personal data protection law and a cybersecurity law must be enacted first as the foundation of trust. Villate outlined the institutional split between cyber-defence under the Ministry of Defence and the civil-public-private sphere managed by MITIC's General Directorate of Cybersecurity, with the CERT now operating on continuous 24/7 monitoring. He presented the same framework at the 49th CITEL CCP.I meeting held in Asunción on 7–11 September, where he called cybersecurity one of the greatest global challenges and cited work with the OAS to update the 2024–2025 National Cybersecurity Plan, and at the Diplomatic and Consular Academy, where he positioned the data-protection and cybersecurity agenda as a prerequisite for Paraguay's ambition to become a technology hub.", "image_url": "https://dplnews.com/wp-content/uploads/2026/08/dplnewsVillate_rp26082026.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "HIVE Reports 300 MW Contracted in Paraguay and Targets 400 MW by Year-End, as Crypto and AI Loads Seek Tariff Certainty to 2037 (2026-09-17)", "date": "2026-09-17", "source_url": "https://www.abc.com.py/economia/2026/09/03/advierten-que-criptos-y-centros-de-ia-quieren-10-anos-mas-de-tarifa-privilegiada-en-paraguay/", "source_name": "ABC Color", "summary": "HIVE Digital reports 300 MW contracted across its 100 MW Valenzuela and 200 MW Yguazú plants in Paraguay, with a target of 400 MW by the end of 2026, and is converting its Tier 1 facilities to Tier 3 to offer HPC and AI cloud services. The company and other members of the Special Intensive Consumption Group are asking ANDE to extend their preferential supply contracts from the current expiry of 31 December 2027 out to 2037; HIVE's Paraguay president Gabriel Lamas said the industry operates on an interruptible basis and does not compete for residential or industrial supply, and that ten-year visibility is needed to raise capital for a path to 1,000 MW. ANDE has held firm on 2027 as a non-extendable deadline. Energy expert Ricardo Canese counters that the tariff should be around USD 80/MWh rather than the current USD 44/MWh, estimating the annual benefit at USD 284 million, and notes crypto-mining generates 0.83 jobs per MW against a national average of 721.", "image_url": "https://oviedopress.com/wp-content/uploads/2025/10/criptomineria.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Independent Study Recommends a 39.4% Accumulated Rise in ANDE Tariffs by 2030 as Itaipú Negotiation Looms (2026-09-15)", "date": "2026-09-15", "source_url": "https://elnacional.com.py/economia/plan-reajustar-tarifa-ande-genera-nuevo-debate-n110033", "source_name": "El Nacional", "summary": "A technical study by CEARE-UBA with backing from the Inter-American Development Bank recommends an accumulated 39.4% increase in ANDE's tariffs applied in stages between 2026 and 2030, lifting the average tariff from about USD 49.2/MWh to USD 68.6/MWh, to close a financial gap of roughly USD 2 billion; other references cite increases of up to 45.6%. The Executive and ANDE stressed it is a technical analysis only and that residential users will not face increases this year, with any change requiring a political decision. The debate is inseparable from Itaipú: the tariff has been frozen at USD 19.28 per kW/month for 2024–2026, President Peña wants a three-year fixed tariff and has said Paraguay will not accept a reduction after 2026, against the 2024 bilateral agreement with Brazil that the tariff should reflect only Annex C operating costs from 2027. A new tariff at that level would cost ANDE around USD 73 million a year.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/bd0cbc9/2147483647/strip/true/crop/777x437+0+60/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F11%2Fc5%2Fceb550a9480d8b166fc5d4b9b219%2Fuheco20260907-010b-ph01-15838.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "Paraguay Tech Week 2026 Draws Venture Funds from More Than 20 Countries, Showcasing the Country as an AI and Data-Centre Sandbox (2026-09-13)", "date": "2026-09-13", "source_url": "https://marketdata.com.py/noticias/paraguay-tech-week-2026-startups-y-fondos-de-inversion-analizan-oportunidades-de-negocio-en-paraguay-154817/", "source_name": "MarketData", "summary": "The third edition of the VC & Startups Summit, held as part of Paraguay Tech Week 2026, brought together entrepreneurs and investment funds from more than 20 countries. Participants highlighted low tax burden, cheap renewable energy and the country's recent investment-grade ratings as the combination attracting technology companies, and described Paraguay as an ideal sandbox for developing data centres and artificial intelligence with regional reach. The event reinforces the government's positioning strategy around the Yguazú Digital sovereign AI computing project with Taiwan and the Distrito Innova technology park next to the Taiwan–Paraguay Polytechnic University, both of which remain at feasibility or construction stage. The optimism is tempered by the same constraint flagged elsewhere in the week: waiting lists for grid connection exceeding 7,000 MW and an unresolved tariff framework for intensive consumers.", "image_url": "https://marketdata.com.py/wp-content/uploads/2026/08/WhatsApp-Image-2026-08-05-at-9.15.30-AM-1.jpeg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "VI. Key Client Developments", "tier": 1, "events": [{"title": "Claro Reports 5G Coverage Across Eight Cities and 100 Radiobases Built with Nokia Equipment (2026-09-18)", "date": "2026-09-18", "source_url": "https://www.telesemana.com/blog/2025/12/18/claro-enciende-la-primera-red-5g-de-paraguay-con-una-inversion-de-us-35-millones/", "source_name": "Telesemana / Claro Paraguay", "summary": "Claro Paraguay, the first operator to launch commercial 5G in the country in December 2025, reports coverage now spanning the central zone plus Coronel Oviedo, Villarrica, Pedro Juan Caballero, Hernandarias, Ciudad del Este, Encarnación and Cambyretá. Technology director Raúl Aguilera said the company had installed 50 base stations by the end of 2025 and was completing the remaining 50 through mid-2026 to meet the 100-radiobase obligation attached to its 200 MHz in the 3.5 GHz band, with 10% reserved for state institutions. The deployment uses Nokia's AirScale 5G portfolio with ReefShark chipsets, Massive MIMO radios and IPAA+ antennas. Directorgeneral Alfredo Alcaraz cited the availability of compatible handsets as the main obstacle to mass adoption, and the company lists five-year licence terms as its principal regulatory complaint, against a total planned investment of USD 35 million over the first licence period.", "image_url": "https://www.telesemana.com/wp-content/uploads/2025/05/5G-Claro.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Claro / AMX Paraguay — 5G network leadership"}, {"title": "Tigo Nears Its February 2027 5G Launch Deadline with 2.3 GHz Spectrum and a USD 100 Million Infrastructure Financing (2026-09-16)", "date": "2026-09-16", "source_url": "https://www.datacenterdynamics.com/es/noticias/tigo-y-personal-se-adjudican-espectro-5g-en-la-segunda-licitaci%C3%B3n-de-paraguay/", "source_name": "DCD / Millicom", "summary": "Tigo, Millicom's Paraguayan brand, won the 2.3–2.4 GHz band in the second 5G auction for USD 1.6 million, adding to the 50 MHz it already holds in 2300/2600 MHz. The licence carries a 90-day deadline to file the detailed engineering project and 180 days to switch on commercial service, putting a hard launch date in February 2027, with deployments expected to begin before the end of 2026. Tigo must build 100 base stations within four years plus 10 for state institutions within two. The operator is funded by a USD 100 million private bond placement by IDB Invest and Proparco announced in March 2026 to accelerate 4G/4.5G/5G and fibre rollouts. In August the antitrust authority CONACOM cleared Atis Group's acquisition of 281 Millicom towers under a sale-and-leaseback that keeps Tigo as the anchor tenant, monetising passive infrastructure ahead of the 5G build.", "image_url": "https://www.telesemana.com/wp-content/uploads/2025/04/FWA.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo / Millicom — 5G rollout & tower monetization"}, {"title": "Personal Wins 3.7 GHz 5G Spectrum and Extends Its Fixed-Internet Lead for a Fifth Consecutive Year (2026-09-16)", "date": "2026-09-16", "source_url": "https://dplnews.com/personal-y-claro-lideran-velocidad-de-internet-fijo-en-paraguay/", "source_name": "DPL News / nPerf", "summary": "Personal, the Núcleo S.A. subsidiary of Argentina's Telecom, took the 3.7–3.8 GHz band in the second 5G auction for USD 1 million and faces the same February 2027 commercial launch deadline and 100-radiobase obligation as Tigo. In parallel, the 2026 nPerf fixed-internet barometer ranked Personal first for the fifth consecutive year with average download speeds of 148.39 Mbps and a score of 103,262, ahead of Claro at 114.21 Mbps and Tigo at 84.30 Mbps. Personal offers fibre plans up to 400 Mbps down and 100 Mbps up and is described as running one of the most aggressive fibre expansions in the market, with pricing between USD 35 and USD 70. The operator's combination of fixed-network leadership and mid-band 5G spectrum positions it strongly in the enterprise and wholesale segments that feed data-centre and cloud demand.", "image_url": "https://dplnews.com/wp-content/uploads/2025/05/dplnews_banda-ancha_mc22525-1024x678.webp", "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal / Núcleo S.A. — 5G licence & fixed-network leadership"}, {"title": "Comptroller Finds No Evidence Nubicom Is Deploying Its Required Radiobases, With Only One Site Confirmed (2026-09-14)", "date": "2026-09-14", "source_url": "https://dplnews.com/paraguay-contraloria-general-califico-insuficientes-exigencias-conatel-para-nubicom/", "source_name": "DPL News / CGR", "summary": "The Comptroller General (CGR) has advised that there is insufficient evidence that Nubicom is deploying the 22 radiobases required in the first year of its 3.5 GHz licence, with only one operational base station confirmed in the Villa Morra neighbourhood of Asunción. The CGR gave CONATEL five working days to respond and criticised the absence of a detailed monitoring mechanism, while clarifying that at this stage it cannot conclude that the deployment commitment has been breached — only that there is a 'weakness of control and traceability'. Earlier findings in the special audit include documents filed after the deadline, validation of the 100,000 active-subscriber requirement through a sworn statement without independent confirmation, and the absence of verified sector experience or minimum financial capacity. Nubicom, linked to itti Saeca and the Grupo Vázquez, committed to roughly USD 78 million in investment and promotes an Open RAN 5G standalone deployment. Licence cancellation remains on the table.", "image_url": "https://dplnews.com/wp-content/uploads/2021/01/conatel.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom — 5G licence compliance risk"}, {"title": "Copaco-Vox: State Operator Seeks Private Capital as Vox Posts Negative Equity of G. 85,609 Million (2026-09-16)", "date": "2026-09-16", "source_url": "https://www.abc.com.py/tag/hola-paraguay-sa/", "source_name": "ABC Color", "summary": "The new president of state operators Copaco and Vox, Rodrigo Ferreira, inherits a deepening financial crisis. Vox recorded a net loss of G. 33,314 million, negative net equity of G. 85,609 million and debts of more than G. 178,316 million to Copaco; Copaco itself has lost over 200,000 fixed-line customers in six years. The government says it will prioritise attracting private capital in a 'shared risk' structure rather than outright privatisation, and has not produced a rescue plan after the deadline expired. Union representatives warn of a 'sweep' at Copaco-Vox, while a national roaming bill before the Chamber of Deputies is viewed favourably only by Copaco, since it would let Vox use rival coverage without further investment. The operator's roughly 12,000 km of fibre plus 2,500 km at Vox and 400 sites remain the state's principal wholesale infrastructure assets.", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Copaco / Vox — state operator restructuring"}], "impact_analysis": "", "user_notes": ""}, {"title": "VII. Integrated Impact Analysis for Business Operations", "tier": 2, "events": [], "impact_analysis": "🟡 The Currency Is Still the Single Dominant Operating Variable. The September EVE survey published on 17 September has analysts cutting their end-2026 inflation forecast to 3.0% and projecting the guaraní at G. 6,100/USD by December — a slight weakening from spot levels near G. 5,915–5,920, but still far below the G. 6,600 at which the year opened. Every revenue line denominated in dollars converts at roughly 20% less than a year ago. The soy complex illustrates the mechanic precisely: volumes set records, with 7,413,675 tonnes of grain shipped through August worth USD 2,886 million, about USD 907 million more than in 2025, yet exporter margins compress because the same dollars buy fewer guaraníes. Beef is the counter-example, with export values down 7% on volumes down nearly 24% even as the average price rose to USD 6,972 per tonne. Budget any 2026–2027 local-currency projection off a G. 6,100–6,300 range, not the G. 5,900 spot, and stress-test both ends.\n\n🟡 The Fiscal Squeeze Is Now the Binding Constraint on Every Government Decision. The three social conflicts of the third quarter all resolved in the same week of 13–20 September — teachers accepting a 5% raise costing USD 47 million, doctors accepting a package worth USD 260 million in 2027 medicines funding plus G. 2 million per post and 2,300 permanent appointments — and all three now land on the 2027 budget being reviewed by the Budget Bicameral Commission, whose report is due by the end of October. Against a fiscal deficit the IMF puts at 3.5% of GDP for 2026 and a 2027 proposal that asks Congress for a temporary exception to the Fiscal Responsibility Law to reach 3.9%, the government has simultaneously promised industry a USD 100 million credit line, a guarantee fund and a MIC–Senatur merger, and has committed to bond issuance of USD 2,708 million in 2027, 70% more than this year. Public-sector payment discipline and the timing of any capital spending should be treated as at risk, particularly for suppliers with exposure to health, education and infrastructure budgets.\n\n🟡 Energy, Not Demand, Is the Binding Constraint on New Investment. The most consequential statement of the week was Industry Minister Marco Riquelme's admission at Paraguay Day in New York that more than 7,000 MW of projects are waiting for grid connection — equivalent to Paraguay's entire share of Itaipú output — and that this requires modernising ANDE and opening generation to private capital. This sits alongside an independent IDB-backed study recommending a 39.4% accumulated tariff increase by 2030, an unresolved Itaipú tariff negotiation with Brazil, ANDE's refusal to extend preferential contracts beyond 31 December 2027, and HIVE's push for ten-year visibility to fund a path from 300 MW to 1,000 MW. For any supplier or contractor whose pipeline depends on data-centre, crypto-mining or electro-intensive load growth, the risk has shifted from demand to interconnection timing, tariff design and contract tenor.\n\n🟢 Telecom Capex Is Committed and Time-Bound. Both Tigo and Personal have a hard February 2027 commercial launch deadline and a 100-radiobase obligation each, on top of Claro's USD 35 million first-phase programme and its 100 base stations, largely Nokia-built. Tigo has secured USD 100 million through an IDB Invest/Proparco bond and monetised 281 towers through the Atis sale-and-leaseback. This is the most predictable demand pool in the market, but it is also the shortest — the build window closes before 2027, after which spending shifts from coverage to capacity. Nubicom remains the outlier and the credit risk, with the Comptroller unable to evidence more than one operational site out of the 22 required.\n\n🟢 Trade Access Is Widening on Multiple Fronts Simultaneously. The Senate's Foreign Relations Committee unanimously approved the Mercosur–EFTA agreement on 16 September; the US opened a 300,000-tonne beef quota with Paraguay targeting 10%; the new ambassador to Washington is prioritising a path to 80,000 tonnes; and Spanish and Argentine business missions arrived in the same week. None of these translate into near-term revenue, but they materially improve the medium-term addressable market for logistics, cold chain, processing equipment and agri-industrial supply.", "user_notes": ""}, {"title": "VIII. Targeted Recommendations for Chinese Enterprises", "tier": 2, "events": [], "impact_analysis": "🔴 The Taiwan Alignment Is Now Structurally Embedded in Procurement. The clearest signal of the week is the second 5G auction outcome: Tigo took 2.3 GHz with Nokia equipment and Personal took 3.7 GHz, while Claro's 3.5 GHz network is also Nokia-built. The tender rules required bidders to come from countries maintaining diplomatic relations with Paraguay, which excluded Chinese vendors, and Chinese firms did not obtain licences in either round. President Peña has publicly attributed criticism of the auctions to Chinese government pressure. The same logic is being institutionalised in the Yguazú Digital sovereign AI compute project with Taiwan, whose memoranda contemplate diplomatic-grade privileges for data infrastructure. Assume exclusion from state-linked and licensed-operator 5G core and RAN procurement, and plan through indirect channels — enterprise networking, towers and passive infrastructure, power and cooling for data centres, fibre, and distribution relationships with the operators that did win.\n\n🟡 China Remains the Largest Trading Partner Without Formal Relations, and the Asymmetry Is Growing More Visible. China supplies 36.4% of Paraguay's imports, more than any other origin, while bilateral trade runs through triangulation. The external affairs ministry has stated China records 'zero imports' of Paraguayan soy, and estimates put the cost of triangulation at around USD 45 per tonne with annual losses of USD 400–600 million across the soy chain. Paraguay's own position, restated by Foreign Minister Rubén Ramírez Lezcano, is that it will trade with China only if Taiwan ties are untouched — a 'red line' Beijing rejects. Expect continued pressure from Paraguayan agricultural exporters and importers for formal links, and treat the issue as a live but slow-moving one that will not resolve inside this budget cycle.\n\n🟡 The Fiscal Constraint Means Public-Sector Payment Risk Is Real. With the 2027 budget requesting an exception to the Fiscal Responsibility Law to run a 3.9% deficit, USD 2,708 million of planned bond issuance and the government simultaneously honouring teacher, doctor and industrial commitments, the stock of floating debt and the pace of supplier payments warrant active monitoring. The week's most concrete warning was the new health minister flagging 'irregularities born of neglect' in IPS assets. Before extending credit terms to public buyers, verify the specific budget line and current payment history rather than relying on sovereign-level assurances.\n\n🟢 Positioning Opportunities That Do Not Require Political Alignment. Energy Minister-level admissions that 7,000 MW of load cannot be connected and that ANDE needs private generation create a genuine opening in grid equipment, substations, transformers, transmission and distribution hardware, metering and demand management — all areas where Chinese suppliers compete on cost and delivery time without touching the 5G procurement exclusion. Likewise, the 39.4–45.6% tariff adjustment debate implies substantial ANDE capital investment ahead. Data-centre cooling, power distribution and enclosures for HIVE's Tier 3 conversion and similar builds are addressable through commercial channels. Finally, the Spanish and Argentine missions targeting construction, hardware and refrigeration indicate competitive pressure is intensifying in exactly the distributor and SMB segments that have historically been a natural entry point — move early on partner selection or expect to be pre-empted.\n\n🟢 Governance and Social Risk Are Lower Than the Headlines Suggest. All three major social conflicts — teachers, doctors and the budget fight — de-escalated within the window, with the doctors' 21–22 September strike explicitly called off and classes resuming on 18 September. The remaining near-term political risk is the 4 October municipal election and the visible strain inside Honor Colorado between the Cartes and Peña camps, which will not affect commercial operations but can slow appointments and approvals in the weeks either side of the vote. The Alto Paraná security reinforcement — 40 Lince agents, 20 motorcycles and a drone and camera plan — is a positive signal for personnel safety around Ciudad del Este logistics and industrial sites.", "user_notes": ""}]}};
