<title>Paraguay Briefing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#F0F4FF;color:#1E293B;line-height:1.6;min-height:100vh}
a{color:#3B82F6;text-decoration:none}a:hover{text-decoration:underline}
.header{background:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;border-bottom:3px solid #3B82F6}

.header-left h1{font-size:20px;font-weight:700;color:#1E293B}
.header-left .subtitle{font-size:12px;color:#64748B;margin-top:2px}
.header-right{display:flex;gap:8px;align-items:center}
.btn-lang{background:#EEF2FF;color:#4F46E5;font-weight:700;font-size:12px;padding:8px 14px;border-radius:20px;border:none;cursor:pointer}
.btn-lang:hover{background:#E0E7FF}
.btn-primary{background:#3B82F6;color:#fff;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-primary:hover{background:#2563EB;transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.3)}
.btn-secondary{background:#F1F5F9;color:#475569;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:#E2E8F0}
.btn-sm{font-size:11px;padding:6px 12px}
.update-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:moFade .2s}
.update-modal{background:#fff;border-radius:14px;padding:24px 28px;width:440px;max-width:90vw;box-shadow:0 24px 80px rgba(0,0,0,.25);animation:moZoom .25s}
.update-modal h3{font-size:17px;font-weight:700;color:#1E293B;margin-bottom:16px}
.update-modal label{display:block;font-size:12px;font-weight:600;color:#64748B;margin-bottom:4px}
.update-modal select,.update-modal input{width:100%;padding:8px 12px;border:1px solid #CBD5E1;border-radius:8px;font-size:13px;margin-bottom:14px;color:#1E293B;background:#fff}
.update-modal .btn-row{display:flex;gap:8px;justify-content:flex-end}
.time-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.time-preset{padding:5px 12px;border-radius:14px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #CBD5E1;background:#fff;color:#64748B;transition:all .12s}
.time-preset:hover,.time-preset.active{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.history-list{max-height:300px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid #E2E8F0;border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.history-item:hover{background:#F8FAFC;border-color:#CBD5E1}
.history-item .hi-title{font-weight:600;font-size:13px;color:#1E293B}
.history-item .hi-meta{font-size:11px;color:#94A3B8}
.history-item .hi-count{font-size:11px;font-weight:600;color:#3B82F6;background:#EEF2FF;padding:2px 8px;border-radius:10px}
.loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid #CBD5E1;border-top-color:#3B82F6;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.standalone-banner{background:#FEF3C7;color:#92400E;text-align:center;padding:6px 16px;font-size:12px;border-bottom:1px solid #FDE68A;display:none}
.standalone-banner code{background:#FDE68A;padding:1px 5px;border-radius:3px;font-size:11px}

.stats-row{max-width:1400px;margin:0 auto;padding:12px 32px 16px;display:flex;flex-direction:column;gap:8px}
.stats-row-total{display:flex;justify-content:center}
.stats-row-sections{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:768px){.stats-row-sections{grid-template-columns:repeat(2,1fr)}}
.stat-pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;cursor:pointer;transition:all .2s;border:2px solid transparent;font-size:13px;font-weight:600;user-select:none;min-width:0}
.stat-pill:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.pill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pill-label{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-count{font-size:14px;font-weight:700;margin-left:auto;flex-shrink:0;background:rgba(255,255,255,.5);padding:1px 8px;border-radius:10px}
.stat-pill.pill-total{background:#1E293B;color:#fff;font-weight:700;border-radius:24px;display:inline-flex}
.stat-pill.pill-total .pill-count{background:rgba(255,255,255,.2)}

.content{max-width:1400px;margin:0 auto;padding:0 32px 60px}
.section{background:#fff;border-radius:14px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden;border-top:4px solid #3B82F6}
.section.s0{border-top-color:#3B82F6}.section.s1{border-top-color:#EF4444}.section.s2{border-top-color:#10B981}
.section.s3{border-top-color:#8B5CF6}.section.s4{border-top-color:#06B6D4}.section.s5{border-top-color:#F59E0B}
.section.s6{border-top-color:#6366F1}.section.s7{border-top-color:#EC4899}.section.tier2{background:#FAFBFC}
.section-header{padding:16px 22px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-header h2{font-size:16px;font-weight:700;color:#1E293B}
.section-header .badge{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;background:#F1F5F9;color:#64748B;white-space:nowrap}
.section-desc{padding:4px 22px 10px;font-size:12px;color:#94A3B8}
.events-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 22px 18px}
@media(max-width:860px){.events-grid{grid-template-columns:1fr}.event-card{flex-direction:column}.event-card .event-img{width:100%!important;min-height:120px;max-height:180px}}
.event-card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;transition:all .2s;display:flex}
.event-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-1px);border-color:#CBD5E1}
.event-card .event-img{width:160px;min-height:140px;flex-shrink:0;position:relative;overflow:hidden}
.event-card .event-img img{width:100%;height:100%;object-fit:cover;display:block}
.event-card .event-img .img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.event-card .event-body{padding:12px 15px;flex:1;min-width:0;display:flex;flex-direction:column}
.event-card .event-meta{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.event-card .event-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.event-tag.date{background:#F1F5F9;color:#64748B}.event-tag.gov{background:#DCFCE7;color:#15803D}
.event-tag.auth{background:#DBEAFE;color:#1D4ED8}.event-tag.source{background:#FEF3C7;color:#A16207}
.event-tag.client{background:#FCE7F3;color:#BE185D}
.event-card .event-preview{font-size:13px;color:#334155;line-height:1.6;flex:1;overflow:visible;max-height:none}
.event-card .event-link{font-size:11px;margin-top:6px;color:#3B82F6;font-weight:500}
.analysis-body{padding:4px 22px 20px;font-size:13px;line-height:1.8;color:#334155}
.analysis-body h3{font-size:15px;font-weight:700;margin:14px 0 6px;color:#1E293B}
.analysis-body ul{padding-left:0;list-style:none}
.analysis-body li{padding:2px 0 2px 18px;position:relative}
.analysis-body li::before{content:"•";position:absolute;left:2px;color:#3B82F6;font-weight:bold}
.tier-divider{text-align:center;padding:16px 0 8px;margin:8px 0}
.tier-divider span{background:linear-gradient(135deg,#3B82F6,#6366F1);color:#fff;padding:8px 28px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(59,130,246,.25)}
.footer{text-align:center;padding:20px 32px 40px;color:#94A3B8;font-size:12px;max-width:1400px;margin:0 auto}
.macro-dashboard{background:#fff;border-radius:14px;margin-bottom:18px;padding:16px 22px 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-top:4px solid #1E293B}
.macro-title{font-size:15px;font-weight:700;color:#1E293B;margin-bottom:2px}
.macro-period{font-size:11px;font-weight:400;color:#94A3B8;margin-left:6px}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media(max-width:900px){.macro-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.macro-grid{grid-template-columns:1fr}}
.macro-card{background:#F8FAFC;border-radius:8px;padding:10px 8px 4px;border:1px solid #E2E8F0}
.macro-card-title{font-size:10.5px;font-weight:600;color:#475569;margin-bottom:4px;text-align:center;line-height:1.3;min-height:28px;display:flex;align-items:center;justify-content:center}
.macro-latest{display:flex;justify-content:center;align-items:baseline;gap:4px;margin-top:2px;padding:3px 0}
.macro-latest-label{font-size:9px;color:#94A3B8;font-weight:500}
.macro-latest-val{font-size:15px;font-weight:700;color:#1E293B}
.macro-latest-unit{font-size:9px;color:#64748B;font-weight:500}
.macro-latest-date{font-size:9px;color:#94A3B8}
.macro-note{font-size:9px;color:#94A3B8;margin-top:1px}
.macro-card{cursor:pointer;transition:transform .15s,box-shadow .15s}
.macro-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.macro-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:moFade .2s}
.macro-modal-card{background:#fff;border-radius:16px;padding:24px 28px 18px;width:680px;max-width:94vw;max-height:90vh;overflow-y:auto;cursor:default;box-shadow:0 24px 80px rgba(0,0,0,.25);position:relative;animation:moZoom .25s}
.macro-modal-card .macro-card{border:none;padding:0;background:transparent;cursor:default}
.macro-modal-card .macro-card:hover{transform:none;box-shadow:none}
.macro-modal-card .macro-card-title{font-size:15px;min-height:auto;margin-bottom:10px}
.macro-modal-card .macro-legend,.macro-modal-card [style*=legend]{font-size:11px!important}
.macro-modal-close{position:absolute;top:10px;right:16px;font-size:26px;cursor:pointer;color:#94A3B8;background:none;border:none;line-height:1;z-index:10;padding:4px 8px;border-radius:6px}
.macro-modal-close:hover{color:#475569;background:#F1F5F9}
.macro-data-section{margin-top:14px;border-top:1px solid #E2E8F0;padding-top:10px}
.macro-data-toggle{background:#F8FAFC;border:1px solid #CBD5E1;padding:6px 16px;border-radius:6px;font-size:12px;color:#64748B;cursor:pointer;font-weight:500}
.macro-data-toggle:hover{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.macro-data-table-wrap{margin-top:10px;max-height:340px;overflow-y:auto;border:1px solid #E2E8F0;border-radius:8px}
.macro-data-table{width:100%;border-collapse:collapse;font-size:12px}
.macro-data-table th{background:#F8FAFC;padding:7px 12px;text-align:right;font-weight:600;color:#475569;border-bottom:2px solid #E2E8F0;position:sticky;top:0}
.macro-data-table th:first-child{text-align:left}
.macro-data-table td{padding:5px 12px;text-align:right;border-bottom:1px solid #F1F5F9;color:#334155;font-variant-numeric:tabular-nums}
.macro-data-table td:first-child{text-align:left;color:#64748B;font-weight:500}
.macro-data-table tbody tr:hover td{background:#EEF2FF}
.macro-na{color:#CBD5E1!important}
@keyframes moFade{from{opacity:0}to{opacity:1}}
@keyframes moZoom{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:768px){.header{padding:14px 16px}.header-left h1{font-size:16px}.stats-row{padding:10px 14px;gap:6px}.stat-pill{padding:8px 12px;font-size:12px}.pill-label{font-size:11px}.content{padding:0 12px 40px}.section-header{padding:12px 14px 0}.events-grid{grid-template-columns:1fr;padding:4px 14px 14px}}
</style>
</head>

s_gov_source": false, "is_authoritative": true}, {"title": "瓜拉尼大幅升值21.9%：USD/PYG从7,784降至6,082，冲击海关税收和边境贸易（2026年7月3日）", "date": "2026-07-03", "source_url": "https://prensamercosur.org/2026/07/02/paraguay-la-dnit-cierra-el-primer-semestre-de-2026-con-un-crecimiento-de-18-pero-junio-expone-la-fragilidad-del-modelo-aduanero/", "source_name": "Prensa Mercosur / DNIT", "summary": "瓜拉尼对美元同比升值21.9%，USD/PYG从去年6月的7,784降至今年6月的6,081.67。强势本币导致海关税收上半年同比下降11.6%（尽管进口量增长7%、进口额增长10%），“液化”了瓜拉尼税基。DNIT上半年总收入21.73万亿瓜拉尼，同比仅增1.8%。边境贸易遭受重创：Alberdi-Formosa口岸阿根廷买家日均从1,200人骤降至400-500人。", "image_url": null, "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "二、政治与政策变化", "description": "重大立法、政策调整、外资监管、税制改革、投资激励措施", "tier": 1, "events": [{"title": "培尼亚施政报告：任内通过164部法律，推进历史性改革——涵盖税收激励、铁路开放、养老金改革（2026年7月1日）", "date": "2026-07-01", "source_url": "https://rcc.com.py/nacionales/pena-destaca-que-la-estabilidad-politica-permitio-aprobar-164-leyes-y-avanzar-en-reformas-historicas-para-el-paraguay/", "source_name": "RCC / Presidencia", "summary": "培尼亚总统在施政报告中强调，政治稳定为改革提供了基础。任内通过164部法律，包括：新的投资激励法（取代60/90法）、资本市场法（接近OECD标准）、数据保护法、养老金体系改革、铁路部门开放法（7665/2026）等。新投资激励法已通过国会，将现代化税收激励制度，面向国内外投资者。", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "巴拉圭与智利签署双重征税协定，扩大国际税收协定网络（2026年7月初）", "date": "2026-07-03", "source_url": "https://www.adndigital.com.py/paraguay-y-chile-sellan-acuerdo-tributario-para-impulsar-inversiones-y-evitar-doble-imposicion/", "source_name": "ADN Digital", "summary": "巴拉圭与智利签署避免双重征税和防止逃避税协定，标志着巴拉圭国际税收协定网络进一步扩大，此前已与乌拉圭和阿联酋签署类似协定。协定降低跨境股息、利息和特许权使用费的预扣税率（可低至5-10%），有助于吸引外国直接投资并提升巴拉圭作为区域投资枢纽的竞争力。", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭开放铁路行业引入国际资本——Etihad Rail投资4.8亿美元建设亚松森通勤铁路（2026年6月10日生效）", "date": "2026-06-10", "source_url": "https://marcasur.com/en/noticia/paraguay-opens-its-railway-sector-to-international-capital&f=07-2026", "source_name": "Marcasur / Congreso", "summary": "第7665/2026号法律修改并扩展了通勤铁路法，引入G2G协议制度。Etihad Rail PJSC（阿联酋）将通过巴拉圭SPV（75%阿联酋/25%巴拉圭）承建第一阶段Asunción-Luque走廊（18公里/4.8亿美元）。法律包含不可撤销的美元延期支付义务（PDI）、AFD信托担保、国际仲裁条款以及广泛的税收和海关豁免。标志着巴拉圭基础设施融资模式的重大创新。", "image_url": null, "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "三、社会与安全形势", "description": "劳动力市场、社会稳定、公共安全、就业数据", "tier": 1, "events": [{"title": "就业形势创纪录：失业率降至Q1历史最低5.3%，正式就业突破84.2万人，7/10新非农就业为正式岗位（2026年7月1日）", "date": "2026-07-01", "source_url": "https://www.hoy.com.py/nacionales/2026/07/01/pena-destaca-que-desempleo-baja-al-36-y-el-salario-minimo-logra-aumento-historico", "source_name": "Diario HOY", "summary": "培尼亚总统施政报告披露：2025年Q4失业率3.6%为历史最低，2026年Q1为5.3%（Q1历来数据偏高，仍为Q1历史最低）。IPS正式就业人数突破842,023人创纪录，自2023年8月以来新增134,000名参保人员。正式就业率首次突破40%。7/10的新非农就业岗位为正式岗位，标志着就业正规化取得显著进展。", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "安全形势显著改善：抢劫车辆案下降39%、摩托车抢劫下降38%，万名新警力部署、Botón Lince快速响应系统上线（2026年7月2日）", "date": "2026-07-02", "source_url": "https://www.hoy.com.py/nacionales/2026/07/02/informe-de-pena-2025-vs-2026-crecimiento-economico-empleo-y-seguridad", "source_name": "Diario HOY", "summary": "施政报告安全数据显示：两年内新增10,000名警察（2025年5,000人+2026年5,000人），抢劫车辆案件同比下降39%，摩托车抢劫下降38%。推出“Botón Lince”应用程序，在关键区域实现4分钟以内警力响应。SENAD执行8,947次缉毒行动，对毒品贩运造成2.12亿美元经济损失。培尼亚称“巴拉圭不再被称为拉丁美洲的可卡因走廊”。", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "智利总统卡斯特访问巴拉圭，呼吁区域联合打击有组织犯罪，巴拉圭加入“圣地亚哥承诺”（2026年7月1日）", "date": "2026-07-01", "source_url": "https://efe.com/mundo/chile-jose-antonio-kast-visita-paraguay/", "source_name": "EFE / Agencia IP", "summary": "智利总统何塞·安东尼奥·卡斯特首次正式访问巴拉圭，与培尼亚总统会谈。卡斯特呼吁区域联合打击有组织犯罪，称'面对有组织犯罪，中立不作为不是选择'。巴拉圭加入了由智利推动的'圣地亚哥承诺'，阿根廷、玻利维亚、厄瓜多尔和秘鲁也参与其中，旨在加强跨国犯罪的信息共享和联合执法。", "image_url": null, "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "四、国际关系与外交动态", "description": "巴拉圭与大国关系、南方共同市场动态、两岸关系、多边参与", "tier": 1, "events": [{"title": "南共市峰会争议：巴拉圭要求25%欧盟出口配额，培尼亚称现行制度“不公平、不可接受”（2026年7月1日）", "date": "2026-07-01", "source_url": "https://misionesonline.net/2026/07/01/paraguay-se-quejo-por-las-exportaciones-a-la-ue/", "source_name": "MisionesOnline / Agencia IP", "summary": "在亚松森举行的南共市峰会上，巴拉圭对欧盟贸易协定的配额分配机制提出强烈异议。培尼亚总统称现行'先到先得'制度对巴拉圭'不公平、具有冒犯性且不可接受'。巴拉圭要求按产品类别固定25%配额，而巴西、阿根廷和乌拉圭倾向基于历史出口平均值分配。巴拉圭还将配额争议与FOCEM结构趋同基金挂钩，要求加大对内陆国家的基础设施补偿。欧盟-南共市FTA已于5月1日临时生效，乌拉圭将于7月起接任轮值主席国。", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "巴拉圭对华/对台政策：外长重申愿与中国大陆贸易但“不放弃台湾”，中国外交部回应“不能接受”（2026年7月1日）", "date": "2026-07-01", "source_url": "https://www.lanacion.com.py/politica/2026/07/01/mercosur-paraguay-ratifica-disposicion-a-negociar-con-china-pero-mantiene-como-limite-su-vinculo-con-taiwan/", "source_name": "La Nación", "summary": "南共市峰会期间，巴拉圭外长拉米雷斯·莱斯卡诺重申：巴拉圭愿在南共市框架下与中国大陆展开贸易谈判，但不会以放弃对台关系为条件。中国外交部回应称巴拉圭'站在历史的错误一边'，不接受'一边维持与台湾的关系一边与中国贸易'的做法。巴西总统卢拉推动南共市与中国展开贸易谈判，给巴拉圭带来额外压力——巴是南共市唯一未与中国建交的成员国。", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭当选联合国大会第81届会议副主席，与台湾筹备2027年建交70周年纪念活动（2026年6月底）", "date": "2026-06-29", "source_url": "https://www.ip.gov.py/ip/2026/06/17/paraguay-and-taiwan-strengthen-cooperation-and-strategic-partnership/", "source_name": "Agencia IP", "summary": "巴拉圭当选联合国大会第81届会议（2026-2027年度）副主席，台湾对此表示祝贺并感谢巴方持续支持台湾参与国际组织。6月中旬台湾副外长陈明祺访问亚松森，与拉米雷斯外长回顾了5月培尼亚访台成果，推进美-台-巴三方在AI、5G和网络安全领域合作，并筹备2027年建交70周年纪念议程。", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "巴拉圭深化与美国合作：推进牛肉对美出口准入，国防合作全面升级（2026年6-7月）", "date": "2026-07-01", "source_url": "https://www.ip.gov.py/ip/2026/06/15/pena-discusses-investment-agenda-and-hemispheric-security-with-u-s-secretary-of-state/", "source_name": "Agencia IP / USTR", "summary": "巴拉圭继续深化对美战略合作。6月培尼亚与国务卿鲁比奥会晤讨论牛肉配额、直航航线、核能合作和数字基础设施等领域。5月外长在华盛顿与USTR就巴拉圭牛肉对美市场准入进行谈判，推动TIFA框架下配额落地。国防层面，SOFA协定已签署，马萨诸塞州国民警卫队SPP伙伴关系迎来25周年，Northrop Grumman雷达系统谈判加速推进。", "image_url": null, "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "五、行业聚焦：电信、数字能源与人工智能", "description": "5G频谱与商用部署、光纤基础设施、数字能源投资、人工智能数据中心开发、行业监管", "tier": 1, "events": [{"title": "CONATEL完成2.3GHz/3.5GHz频谱招标公众咨询期，预计下半年发布最终招标文件（2026年7月）", "date": "2026-07-01", "source_url": "https://www.gmalabs.com/post/paraguay-conatel-mobile-broadband-consultation-2026-opens-for-key-spectrum-bands", "source_name": "GMA Labs / CONATEL", "summary": "国家电信委员会（CONATEL）第790/2026号决议启动了2,300MHz和3,500MHz频段移动宽带和5G服务招标条款的公开征求意见，意见征集于5月15日截止。同时，第3339/2025号决议已将3,700-3,800MHz频段重新指定用于IMT（5G NR），将3.3-3.8GHz配置为10×50MHz的TDD子频段。最终招标文件预计2026年下半年发布，将明确覆盖义务、服务质量和投资承诺等条件。", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "HIVE Digital在巴拉圭推出BUZZ Cloud AI平台——Tier III级数据中心，300MW水电容量，计划再扩100MW（2026年6月）", "date": "2026-06-24", "source_url": "https://www.proactiveinvestors.com/companies/news/1085923/hive-digital-expands-into-paraguay-with-buzz-cloud-ai-platform-launch.html", "source_name": "Proactive Investors / HIVE (NASDAQ)", "summary": "HIVE Digital Technologies（纳斯达克：HIVE）在亚松森正式推出BUZZ Cloud AI云平台，托管于Tier III级数据中心，与巴拉圭领先电信运营商合作运营。平台利用巴拉圭国家暗光纤网络及现有300MW剩余水电（Itaipu/Yacyretá），计划2026年内再扩容100MW。GPU集群将为南美洲客户提供AI训练、推理及数据密集型工作负载。HIVE目前在巴拉圭拥有400MW总容量（全球540MW）。", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭-台湾AI数据中心合资企业：一期10MW起步，三期目标1GW“全球最大AI中心”（2026年5月宣布，持续推进中）", "date": "2026-07-01", "source_url": "https://www.ip.gov.py/ip/2026/05/14/alliance-with-taiwan-positions-paraguay-in-the-global-race-for-ai-development-pena-highlights/", "source_name": "Agencia IP", "summary": "培尼亚总统在施政报告中特别强调与台湾的AI合作：双方50/50合资建设AI数据中心，一期10MW起步、二期扩展至100MW、三期目标约1GW——有望成为全球最大AI数据中心。巴拉圭依托100%可再生水电、Decreto 5306/2026（AI和云计算特别电价，美元计价15年合同期）和Decreto 5307/2026（Power-to-X），将能源优势转化为数字产业竞争力。BID提供1.3亿美元融资支持数字基础设施现代化。", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "MITIC数字转型报告：1.8万公里光纤、1,600个Starlink终端、3,234所学校接入互联网（2026年7月）", "date": "2026-07-01", "source_url": "https://dplnews.com/paraguay-tercer-informe-presidencial-destaca-al-mitic-como-actor-clave-en-la-transformacion-digital/", "source_name": "DPL News / MITIC", "summary": "培尼亚施政报告高度评价MITIC在数字转型中的关键作用。截至2026年6月：全国光纤网络达18,000公里，包括Ñeembucú省新增超1,000公里；与SpaceX合作部署1,600个Starlink终端服务于偏远学校和医疗中心；在全国400+公共场所提供免费WiFi，惠及超过130万市民；3,234所教育机构接入互联网，受益学生超100万；Villa Hayes国家Tier III数据中心和Innova科技园区在建中。", "image_url": null, "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "六、主要客户动态", "description": "追踪巴拉圭主要电信客户的战略动向、投资计划、网络部署及技术选型", "tier": 1, "events": [{"title": "Claro——5G商用启动在即，3,500万美元初期部署，核心网已完成5G改造（2026年7月）", "date": "2026-07-01", "source_url": "https://www.bnamericas.com/en/news/paraguay-greenlights-claro-and-nubicom-to-ignite-5g-race", "source_name": "BNamericas", "summary": "Claro（América Móvil）在2025年8月拍卖中赢得3.5-3.7GHz频段200MHz频谱（许可费约200万美元），初期投资3,500万美元在12个重点都市区部署5G。根据6个月部署义务，商业服务预计2026年Q2在大亚松森地区率先开通。移动核心网已完成5G升级。每100MHz需部署100个基站，其中10%服务政府机构。Claro有望成为巴拉圭首家商用5G的主要运营商。", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Claro"}, {"title": "Tigo——未参与5G频谱拍卖，专注4G/光纤扩建，获BID Invest+Proparco 1亿美元融资（2026年7月）", "date": "2026-07-01", "source_url": "https://idbinvest.org/en/news-media/idb-invest-and-proparco-partner-millicom-expand-digital-infrastructure-across-latin", "source_name": "BID Invest / BNamericas", "summary": "Tigo（Millicom）作为巴拉圭最大移动运营商（用户320万，市场份额47.3%），因中国供应商（华为/中兴）限制条款退出2025年8月5G频谱拍卖。公司当前聚焦：3G向4G迁移、光纤到户（FTTH）扩张、Tigo Money金融科技增长。2026年3月，BID Invest和Proparco联合向Millicom投资1亿美元（哥伦比亚比索私募债券），覆盖巴拉圭等7国4G/4.5G/5G和光纤网络扩展。2026年1月，Tigo巴拉圭完成7,700万美元瓜拉尼本币债券历史性发行。公司持续与政府就5G频谱替代方案进行谈判。", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo"}, {"title": "Personal——未参与5G拍卖，坚持低成本定位，面临被Nubicom取代第三大运营商的风险（2026年7月）", "date": "2026-07-01", "source_url": "https://www.bnamericas.com/en/news/paraguay-greenlights-claro-and-nubicom-to-ignite-5g-race", "source_name": "BNamericas", "summary": "Personal（Telecom Argentina旗下）拥有约240万用户（市场份额35.5%），因中国设备供应商限制同样未参与5G频谱拍卖，且未公布独立5G部署计划。公司继续聚焦低成本细分市场，网络覆盖集中在城市区域，Asunción以外覆盖能力较弱。若无法升级网络，可能被Nubicom取代失去第三大移动运营商地位。未有显著的基础设施投资公告。", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal"}, {"title": "Nubicom——新进入者，宣布2亿美元5G建设投资，从零构建移动网络，预计2026年Q2启动商用（2026年7月）", "date": "2026-07-01", "source_url": "https://www.datacenterdynamics.com/en/news/?tag=nubicom", "source_name": "DataCenterDynamics / BNamericas", "summary": "Nubicom（阿根廷萨尔塔省固网运营商）在5G拍卖中赢得3.3-3.5GHz频段200MHz频谱（许可费约200万美元），宣布2亿美元投资建设巴拉圭迄今最大规模5G网络。公司须在6周内成立本地子公司，从零开始构建移动基础设施，每100MHz需部署至少100个基站。作为此前仅在阿根廷提供固网服务的运营商，从零建设移动网络面临巨大挑战，但也为设备供应商和基础设施合作伙伴提供了全新市场机会。", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom"}], "impact_analysis": "", "user_notes": ""}, {"title": "七、对企业经营的综合影响分析", "description": "综合宏观趋势、行业动态及客户动向，评估巴拉圭企业运营环境", "tier": 2, "events": [], "impact_analysis": "## 一、成本维度 🟡\n\n基于本周数据对成本压力的综合评估：\n\n- **汇率成本**：瓜拉尼同比升值21.9%（USD/PYG从7,784降至6,082），是区域升值幅度最大的货币之一。以瓜拉尼计价的运营成本（本地薪资、服务采购）折算美元后大幅上升，压缩出口导向型企业的利润空间。但进口设备和原材料成本显著降低，利好依赖进口的电信、数据中心等行业。\n- **劳动力成本**：最低工资5%的温和上调（自7月1日起生效）符合通胀水平（6月CPI同比仅2.09%），实际单位劳动成本基本可控。正式就业率突破40%，IPS参保人数突破84.2万，劳动力市场趋紧但工资压力温和。\n- **能源成本**：Decreto 5306/2026和5307/2026提供美元计价、最长15年固定期限的特别电价，为数据中心和AI企业创造了全球最具竞争力的能源成本结构之一。HIVE Digital和X8 Cloud的落地验证了这一优势。但Villeta项目电价政策逆转（1月总统令被6月撤销）提醒企业：能源成本仍取决于政策连续性。\n- **税收成本**：强势瓜拉尼导致海关税收同比下降11.6%（尽管进口量+7%），DNIT上半年总收入仅增1.8%，远低于全年13.4%的增收目标。这可能引发下半年出台新的税收征管措施或调整部分税收政策以弥补财政缺口。\n\n## 二、市场维度 🟢\n\n巴拉圭市场机遇在数字基础设施和投资便利化领域显著扩大：\n\n- **5G与电信设备市场**：CONATEL新一轮2.3/3.5GHz频谱招标即将在下半年启动，为电信设备和基础设施供应商创造新一轮采购机会。Claro和Nubicom的5G部署义务（各100个基站/100MHz）意味着短期内至少200个5G基站的设备和工程服务需求。美国支持的设备排除政策利好非中国供应商。\n- **AI与数据中心产业链**：HIVE BUZZ Cloud平台上线、台巴AI数据中心合资项目（一期10MW→三期1GW）和X8 Cloud项目（长期500亿美元）将拉动数据中心建设相关需求：电力设备、冷却系统、光纤连接、网络安全、专业IT服务。IDB 1.3亿美元数字基础设施融资提供了额外资金支持。\n- **基础设施与物流**：铁路开放法（7665/2026）引入Etihad Rail的4.8亿美元通勤铁路项目，创造了轨交设备、工程和运营服务的市场机会。G2G模式下的不可撤销美元支付安排为供应商提供了付款保障。\n- **欧盟市场准入**：EU-Mercosur FTA自5月1日临时生效，但配额分配争议悬而未决。若巴拉圭成功争取25%配额，牛肉、禽肉、糖等产品的出口将大幅增长。反之，如果'先到先得'维持现状，阿根廷和巴西将继续占据大部分配额。\n\n## 三、合规维度 🟡\n\n合规环境总体向好，但需关注政策波动：\n\n- **投资便利化**：投资者通行证（Decreto 0283/2026）和更新版移民局要求已生效，四条投资路径（最低7万美元/10个就业→永久居留）清晰可行，股息税率从15%降至8%为投资者带来实质性收益。\n- **税收协定**：智利双重征税协定的签署标志着巴拉圭税务合规框架进一步国际化，面向跨境投资者的预扣税率降低将改善投资回报。\n- **劳动合规**：WhatsApp最低工资投诉热线开通表明执法力度加强，在7月1日工资调整后企业应及时完成薪酬合规审查。\n- **财政风险**：IMF第四条磋商指出，2026年赤字可能因供应商欠款清理（建筑商2.2亿美元+药企约5亿美元）超出目标。虽然短期无碍投资级评级，但需关注潜在的税收政策调整以弥补缺口。\n\n## 综合评估\n\n本周监测的24项事件（其中8项来自政府渠道）呈现以下图景：巴拉圭宏观经济持续强劲（IMF预测2026年GDP增长4.4%，通胀2.09%远低于目标），但在强势瓜拉尼冲击税收和边境贸易、EU-Mercosur配额争议白热化、能源政策偶发逆转的背景下，企业需保持风险管理敏感度。数字基础设施和AI领域的投资浪潮是本周期最突出的结构性和机遇。", "user_notes": ""}, {"title": "八、对中资企业的专项影响与建议", "description": "为中国企业在巴拉圭经营或考虑进入巴拉圭市场量身定制的分析，涵盖外交风险、政策风险及战略建议", "tier": 2, "events": [], "impact_analysis": "## 一、风险预警\n\n🔴 **高优先级：**\n\n- **外交壁垒持续强化**：南共市峰会期间，巴拉圭外长公开重申\"愿与中国贸易但不放弃台湾\"的立场，中方已明确表示\"不能接受\"。巴西（卢拉）推动南共市对华谈判给巴拉圭带来额外压力，但短期内巴拉圭不会改变对台关系。中国企业仍面临项目审批的非正式壁垒和更高的政治审查风险。\n- **电信设备供应商排除制度化**：CONATEL通过5G频谱拍卖规则（\"贸易互惠\"条款）实质性排除华为/中兴，该先例已通过Claro和Nubicom的频谱授予正式执行。新的2.3/3.5GHz招标预计将维持相同规则。这一排除机制可能通过\"网络安全\"和\"供应链安全\"话语扩展至其他关键基础设施领域（如数据中心、智慧城市项目）。\n\n🟡 **中等优先级：**\n\n- **美国-台湾-巴拉圭三角深化**：巴拉圭加入美国主导的\"圣地亚哥承诺\"、签署SOFA协定、推进Northrop Grumman雷达采购、美台巴三方AI/5G/网络安全合作框架的落地，进一步巩固了排除中国企业的地缘政治架构。在巴拉圭参与的敏感基础设施项目中，中国企业面临的不仅是商业竞争，更是体系性准入壁垒。\n- **汇率风险**：瓜拉尼同比升值21.9%，已是拉美最强势货币。已在巴拉圭投资的中资企业以瓜拉尼计价的利润折算人民币后大幅缩水，需评估汇率对冲策略。\n- **财政调整风险**：DNIT上半年税收仅增1.8%，远低于全年13.4%目标。下半年可能出台新的税收征管措施（如强化转让定价审查、进口估值调整），影响中资贸易和投资企业的税务合规成本。\n\n## 二、机遇分析\n\n🟢 **可操作机遇：**\n\n- **数字基础设施非设备角色**：尽管电信设备准入受限，但HIVE、台巴AI数据中心、X8 Cloud等项目的落地表明数据中心建设、可再生能源整合、冷却系统、光纤布线、电力设备和工程总承包（EPC）需求旺盛。中国企业可以探索不涉及电信核心设备的配套角色：电气设备供应（变压器、UPS、配电柜）、冷却解决方案、太阳能+储能配套、数据中心建筑工程。\n- **农业科技与绿色转型**：巴拉圭以大豆和牛肉出口为经济支柱（GDP增长6.6%主要由农业驱动），对精准农业、IoT传感器、供应链数字化、冷链物流技术有强劲需求。中国农业科技企业可在不触发安全审查的领域竞争。\n- **南共市间接通道**：已在巴西或阿根廷布局的中资企业可利用EU-Mercosur FTA框架获取对欧出口优惠。巴拉圭的配额争议实际上为中资企业提供了观察和影响南共市内部贸易治理的窗口期。\n- **新能源与Power-to-X**：Decreto 5307/2026为绿氢、氨、甲醇和合成燃料提供美元计价特别电价和长期合同。巴拉圭过剩的水电资源（Itaipu 14,000MW + Yacyretá）为电解水制氢和绿色燃料生产提供了全球最具成本竞争力的能源基础。中国在电解槽制造和绿色甲醇领域的技术积累可在此找到应用场景。\n\n## 三、战略建议\n\n**立即行动：**\n- 对照7月1日生效的新最低工资标准和移民局第407/2026号决议更新劳动合规和居留文件，确保现有派驻人员和新投资项目符合最新要求。\n- 评估因瓜拉尼升值21.9%对现有巴拉圭业务以美元/人民币计价的财务影响，考虑是否需要建立汇率对冲机制。\n\n**短期（1-3个月）：**\n- 密切跟踪CONATEL新一轮2.3/3.5GHz频谱招标进展，尽管设备直接准入受限，但关注是否有通过第三方（如欧洲子公司）参与投标或提供配套设备和服务的路径。\n- 主动对接HIVE Digital、X8 Cloud和台巴AI数据中心项目的基础设施配套需求（电力、冷却、建筑），以非敏感供应商身份参与供应链。\n- 安排在亚松森的现场政策调研，与MIC（工商部）、AND（国家电力管理局）、MITIC建立直接沟通渠道，及时获取投资政策和电价变动信息。\n\n**中期（3-12个月）：**\n- 研究通过南共市其他国家（巴西/阿根廷）的间接准入策略，利用EU-Mercosur FTA框架实现巴拉圭市场的\"曲线进入\"。\n- 评估在绿色氢能和Power-to-X领域的投资可行性，利用Decreto 5307/2026的政策窗口和巴拉圭的能源成本优势。\n- 持续监测巴拉圭外交政策走向——若未来出现对华关系调整，将为中国企业开辟全新的市场准入格局。建议每季度进行一次巴拉圭宏观政治风险评估更新。"}]}, "en": {"topic": "Paraguay Briefing", "time_span": "June 27 – July 4, 2026", "tiers": [{"name": "Part I: Key News & Developments", "description": "Macro economy, politics, social security, international relations, industry, and key client movements in Paraguay"}, {"name": "Part II: Analysis & Recommendations", "description": "Enterprise impact assessment and China-specific strategic recommendations"}], "sections": [{"title": "I. Macroeconomic Developments", "description": "GDP growth, inflation, exchange rate, monetary policy, fiscal position, key sector performance", "tier": 1, "events": [{"title": "IMF Concludes Article IV Consultation: Projects Paraguay 2026 GDP Growth at 4.4%, Praises Inflation Targeting Framework (2026-06-29)", "date": "2026-06-29", "source_url": "https://www.imf.org/en/news/articles/2026/06/29/cs-062926-paraguay-imf-staff-concluding-statement-2026-aiv-consultation-mission", "source_name": "IMF", "summary": "The IMF completed its Article IV consultation mission to Paraguay (June 15-26). Key projections: 2026 GDP growth of 4.4%, converging to 3.8% medium-term. The IMF praised Paraguay's inflation targeting regime, flexible exchange rate, and fiscal discipline. Paraguay was largely insulated from the Middle East conflict due to 100% renewable electricity generation and favorable soybean production/prices. The IMF sees scope for gradual further rate easing if energy shocks prove temporary.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "President Peña Delivers Third Annual Report: 2025 GDP Growth at 6.6% (12-Year High), Unemployment Falls to 5.3% Historic Q1 Low (2026-07-01)", "date": "2026-07-01", "source_url": "https://www.hoy.com.py/nacionales/2026/07/02/informe-de-pena-2025-vs-2026-crecimiento-economico-empleo-y-seguridad", "source_name": "Diario HOY", "summary": "President Santiago Peña presented his third annual management report to Congress. Key metrics: 2025 GDP growth of 6.6% (highest in 12 years, #1 in Latin America); Q1 2026 growth of 5.8%; Q4 2025 unemployment at 3.6% (historic low); poverty at 16% and extreme poverty at 2.4% (both historic lows); IPS formal employment at a record 842,023; two investment-grade ratings obtained (Moody's and S&P).", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "BCP Holds Policy Rate at 5.50% for Fourth Consecutive Month; June CPI at Just 2.09% YoY (2026-07-02)", "date": "2026-07-02", "source_url": "https://www.itau.com.br/itaubba-pt/analises-economicas/latam/paraguay-bcp-on-hold-again-at-5-50-as-expected", "source_name": "Itau BBA / BCP", "summary": "The BCP unanimously held the benchmark rate at 5.50% in June, maintaining a neutral stance since February 2026. Latest CPI data (AE_IPC-26.6) shows June CPI fell 0.28% MoM with annual inflation at just 2.09%, well below the 3.5% target. Next policy meeting is July 23; markets expect rates to remain unchanged through year-end. The BCP flagged Middle East conflict and US tariff uncertainty as key external risks.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Guarani Appreciates 21.9% YoY: USD/PYG Falls from 7,784 to 6,082, Hitting Customs Revenue and Border Trade (2026-07-03)", "date": "2026-07-03", "source_url": "https://prensamercosur.org/2026/07/02/paraguay-la-dnit-cierra-el-primer-semestre-de-2026-con-un-crecimiento-de-18-pero-junio-expone-la-fragilidad-del-modelo-aduanero/", "source_name": "Prensa Mercosur / DNIT", "summary": "The Guarani appreciated 21.9% year-on-year against the USD, from PYG 7,784 to PYG 6,081.67. Customs revenue fell 11.6% in H1 2026 despite import volumes rising 7% and import values rising 10% - the strong currency 'liquefied' the Guarani tax base. Total DNIT revenue reached PYG 21.73 trillion, up only 1.8% YoY. Border trade was severely affected: daily Argentine shoppers at Alberdi-Formosa plummeted from 1,200 to 400-500.", "image_url": null, "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "II. Political & Policy Developments", "description": "Major legislation, policy adjustments, foreign investment regulation, tax reform, investment incentives", "tier": 1, "events": [{"title": "Pena Administration Passes 164 Laws: Historic Reforms in Tax Incentives, Railway Liberalization, Pension Reform (2026-07-01)", "date": "2026-07-01", "source_url": "https://rcc.com.py/nacionales/pena-destaca-que-la-estabilidad-politica-permitio-aprobar-164-leyes-y-avanzar-en-reformas-historicas-para-el-paraguay/", "source_name": "RCC / Presidencia", "summary": "President Pena highlighted political stability as the foundation for reform in his annual report. The administration passed 164 laws, including: a new Investment Incentives Law (replacing Law 60/90), Capital Markets Law (approaching OECD standards), Data Protection Law, pension system reform, and Railway Sector Liberalization Law (7665/2026). The new investment incentives framework modernizes tax benefits for both domestic and foreign investors.", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "Paraguay and Chile Sign Double Taxation Agreement, Expanding International Tax Treaty Network (2026-07 Early)", "date": "2026-07-03", "source_url": "https://www.adndigital.com.py/paraguay-y-chile-sellan-acuerdo-tributario-para-impulsar-inversiones-y-evitar-doble-imposicion/", "source_name": "ADN Digital", "summary": "Paraguay and Chile signed a Double Taxation Avoidance Agreement, further expanding Paraguay's international tax treaty network following agreements with Uruguay and UAE. The agreement reduces withholding tax rates on cross-border dividends, interest, and royalties (as low as 5-10%), enhancing Paraguay's competitiveness as a regional investment hub.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay Opens Railway Sector to International Capital: Etihad Rail Invests USD 480M in Asuncion Commuter Rail (Effective 2026-06-10)", "date": "2026-06-10", "source_url": "https://marcasur.com/en/noticia/paraguay-opens-its-railway-sector-to-international-capital&f=07-2026", "source_name": "Marcasur / Congreso", "summary": "Law 7665/2026 expands the Commuter Rail Law and introduces a Government-to-Government (G2G) agreement regime. Etihad Rail PJSC (UAE) will construct Phase I (Asuncion-Luque, 18km, USD 480M) through a Paraguayan SPV (75% UAE / 25% Paraguay). Key features: irrevocable USD deferred payment obligations, AFD trust guarantee, international arbitration, and comprehensive tax/customs exemptions - a major innovation in Paraguay's infrastructure financing model.", "image_url": null, "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "III. Social & Security Situation", "description": "Labor market, social stability, public security, employment data", "tier": 1, "events": [{"title": "Record Employment: Q1 Unemployment at Historic Low of 5.3%, Formal Employment Exceeds 842,000; 7 of 10 New Non-Agricultural Jobs Are Formal (2026-07-01)", "date": "2026-07-01", "source_url": "https://www.hoy.com.py/nacionales/2026/07/01/pena-destaca-que-desempleo-baja-al-36-y-el-salario-minimo-logra-aumento-historico", "source_name": "Diario HOY", "summary": "President Pena's report disclosed: Q4 2025 unemployment at 3.6% (historic low), Q1 2026 at 5.3% (lowest Q1 on record). IPS formal employment exceeded 842,023 - a new record - with 134,000 new contributors since August 2023. The formalization rate surpassed 40% for the first time. Seven out of ten new non-agricultural jobs created in the past year were formal, signaling significant progress in labor formalization.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Security Situation Improves Significantly: Vehicle Robbery Down 39%, Motorcycle Robbery Down 38%; 10,000 New Police, Boton Lince Rapid Response System Launched (2026-07-02)", "date": "2026-07-02", "source_url": "https://www.hoy.com.py/nacionales/2026/07/02/informe-de-pena-2025-vs-2026-crecimiento-economico-empleo-y-seguridad", "source_name": "Diario HOY", "summary": "Security metrics from the presidential report: 10,000 new police officers added in two years (5,000 each in 2025 and 2026); aggravated vehicle robbery down 39%; motorcycle robbery down 38%. 'Boton Lince' mobile app rolled out, achieving sub-4-minute police response in critical zones. SENAD executed 8,947 anti-drug operations, inflicting USD 212 million in losses on narcotrafficking. Pena declared: 'Paraguay has ceased to be known as Latin America's cocaine corridor.'", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Chilean President Kast Visits Paraguay, Calls for Regional Unity Against Organized Crime; Paraguay Joins 'Santiago Commitment' (2026-07-01)", "date": "2026-07-01", "source_url": "https://efe.com/mundo/chile-jose-antonio-kast-visita-paraguay/", "source_name": "EFE / Agencia IP", "summary": "Chilean President Jose Antonio Kast made his first official visit to Paraguay, meeting with President Pena. Kast called for regional unity against organized crime, stating 'neutrality is not an option in the face of organized crime.' Paraguay joined the 'Santiago Commitment' promoted by Chile, alongside Argentina, Bolivia, Ecuador, and Peru, strengthening information sharing and joint law enforcement against transnational crime.", "image_url": null, "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "IV. International Relations & Diplomacy", "description": "Paraguay's relations with major powers, Mercosur dynamics, cross-strait relations, multilateral engagement", "tier": 1, "events": [{"title": "Mercosur Summit Controversy: Paraguay Demands 25% EU Export Quota Share; Pena Calls Current System 'Unfair, Unacceptable' (2026-07-01)", "date": "2026-07-01", "source_url": "https://misionesonline.net/2026/07/01/paraguay-se-quejo-por-las-exportaciones-a-la-ue/", "source_name": "MisionesOnline / Agencia IP", "summary": "At the Mercosur Summit in Asuncion, Paraguay lodged a strong protest against EU trade agreement quota distribution. President Pena called the current 'first-come, first-served' system 'unfair, offensive, and unacceptable' for Paraguay. Paraguay demands a fixed 25% allocation by product category, while Brazil, Argentina, and Uruguay favor allocation based on historical export averages. Paraguay linked the quota debate to strengthening FOCEM structural convergence funds, demanding greater compensation for landlocked countries' logistics costs. The EU-Mercosur FTA provisionally entered force on May 1; Uruguay assumes the rotating presidency from July.", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "Paraguay's China/Taiwan Policy: FM Reaffirms Willingness to Trade with China but 'Won't Abandon Taiwan'; China Says 'Unacceptable' (2026-07-01)", "date": "2026-07-01", "source_url": "https://www.lanacion.com.py/politica/2026/07/01/mercosur-paraguay-ratifica-disposicion-a-negociar-con-china-pero-mantiene-como-limite-su-vinculo-con-taiwan/", "source_name": "La Nacion", "summary": "During the Mercosur Summit, FM Ramirez Lezcano reiterated that Paraguay is willing to negotiate trade with China within the Mercosur framework, but will not condition this on abandoning relations with Taiwan. China's Foreign Ministry responded that Paraguay is 'on the wrong side of history' and cannot 'maintain Taiwan ties while trading with China.' Brazil's President Lula is pushing Mercosur to initiate trade talks with China, adding pressure on Paraguay - the only bloc member without diplomatic relations with Beijing.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay Elected Vice President of 81st UN General Assembly; Preparing 70th Anniversary of Taiwan Diplomatic Relations in 2027 (2026-06-29)", "date": "2026-06-29", "source_url": "https://www.ip.gov.py/ip/2026/06/17/paraguay-and-taiwan-strengthen-cooperation-and-strategic-partnership/", "source_name": "Agencia IP", "summary": "Paraguay was elected Vice President of the 81st UN General Assembly session (2026-2027). Taiwan congratulated Paraguay and expressed appreciation for its continued support for Taiwan's participation in international organizations. In mid-June, Taiwan's Deputy FM Chen Ming-chi visited Asuncion, reviewing progress since Pena's May visit to Taiwan and advancing US-Taiwan-Paraguay trilateral cooperation in AI, 5G, and cybersecurity. Both sides are preparing a commemorative agenda for the 70th anniversary of diplomatic relations in 2027.", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "Paraguay Deepens US Cooperation: Advancing Beef Market Access, Comprehensive Defense Cooperation Upgrade (2026-06 to 07)", "date": "2026-07-01", "source_url": "https://www.ip.gov.py/ip/2026/06/15/pena-discusses-investment-agenda-and-hemispheric-security-with-u-s-secretary-of-state/", "source_name": "Agencia IP / USTR", "summary": "Paraguay continues to deepen strategic cooperation with the US. In June, Pena met with Secretary of State Rubio to discuss beef quotas, direct flight routes, nuclear energy cooperation, and digital infrastructure. In May, the FM met with USTR Deputy Representative in Washington to advance Paraguayan beef market access under the TIFA framework. On defense: SOFA agreement signed, Massachusetts National Guard SPP partnership marks 25 years, and Northrop Grumman radar system negotiations are accelerating.", "image_url": null, "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "V. Industry Focus: Telecom, Digital Energy & AI", "description": "5G spectrum & commercial deployment, fiber infrastructure, digital energy investment, AI data center development, industry regulation", "tier": 1, "events": [{"title": "CONATEL Completes Public Consultation on 2.3GHz/3.5GHz Spectrum Tender; Final Bidding Documents Expected H2 2026 (2026-07)", "date": "2026-07-01", "source_url": "https://www.gmalabs.com/post/paraguay-conatel-mobile-broadband-consultation-2026-opens-for-key-spectrum-bands", "source_name": "GMA Labs / CONATEL", "summary": "CONATEL Resolution 790/2026 launched public consultation on tender terms for 2,300MHz and 3,500MHz bands for mobile broadband and 5G services; submissions closed May 15. Resolution 3339/2025 had already redesignated 3,700-3,800MHz for IMT (5G NR), configuring 3.3-3.8GHz as 10x50MHz TDD sub-bands. Final bidding documents expected H2 2026, specifying coverage obligations, QoS standards, and investment commitments.", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "HIVE Digital Launches BUZZ Cloud AI Platform in Paraguay: Tier III Data Center, 300MW Hydro Capacity, 100MW Expansion Planned (2026-06)", "date": "2026-06-24", "source_url": "https://www.proactiveinvestors.com/companies/news/1085923/hive-digital-expands-into-paraguay-with-buzz-cloud-ai-platform-launch.html", "source_name": "Proactive Investors / HIVE (NASDAQ)", "summary": "HIVE Digital Technologies (NASDAQ: HIVE) officially launched its BUZZ Cloud AI platform in Asuncion, hosted in a Tier III data center in partnership with Paraguay's leading telecom operator. The platform leverages Paraguay's national dark fiber network and 300MW of surplus hydroelectric capacity (Itaipu/Yacyreta), with a further 100MW expansion planned in 2026. GPU clusters will serve AI training, inference, and data-intensive workloads for South American clients. HIVE total Paraguay capacity now at 400MW (540MW globally).", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay-Taiwan AI Data Center JV: Phase 1 at 10MW, Phase 3 Targeting ~1GW as 'World's Largest AI Center' (Announced May 2026, Ongoing)", "date": "2026-07-01", "source_url": "https://www.ip.gov.py/ip/2026/05/14/alliance-with-taiwan-positions-paraguay-in-the-global-race-for-ai-development-pena-highlights/", "source_name": "Agencia IP", "summary": "President Pena highlighted Taiwan AI cooperation in his annual report: a 50/50 JV for AI data center construction - Phase 1 at 10MW, Phase 2 scaling to 100MW, and Phase 3 targeting approximately 1GW, potentially the world's largest AI data center. Paraguay leverages 100% renewable hydropower, Decreto 5306/2026 (special USD-denominated AI/cloud tariffs with 15-year contracts), and Decreto 5307/2026 (Power-to-X). The IDB is providing USD 130 million to support digital infrastructure modernization.", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "MITIC Digital Transformation Report: 18,000km Fiber, 1,600 Starlink Terminals, 3,234 Schools Connected (2026-07)", "date": "2026-07-01", "source_url": "https://dplnews.com/paraguay-tercer-informe-presidencial-destaca-al-mitic-como-actor-clave-en-la-transformacion-digital/", "source_name": "DPL News / MITIC", "summary": "President Pena's report highlighted MITIC's role in digital transformation. As of June 2026: national fiber optic network reaches 18,000km, including 1,000+ km newly activated in Neembucu department; 1,600 Starlink satellite terminals deployed with SpaceX for remote schools and health centers; 400+ free public WiFi points nationwide serving 1.3M+ citizens; 3,234 educational institutions connected to internet, benefiting 1M+ students; Villa Hayes National Tier III Data Center and Innova Technology Park under construction.", "image_url": null, "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "VI. Key Client Movements", "description": "Tracking strategic moves, investment plans, network deployment, and technology choices of major Paraguayan telecom clients", "tier": 1, "events": [{"title": "Claro - 5G Commercial Launch Imminent; USD 35M Initial Deployment; Mobile Core 5G-Upgraded (2026-07)", "date": "2026-07-01", "source_url": "https://www.bnamericas.com/en/news/paraguay-greenlights-claro-and-nubicom-to-ignite-5g-race", "source_name": "BNamericas", "summary": "Claro (America Movil) won 200MHz in the 3.5-3.7GHz band (license fee ~USD 2M) in the August 2025 auction, deploying an initial USD 35M for 5G across 12 key metropolitan areas. Under the 6-month deployment obligation, commercial services expected in Q2 2026, starting in Greater Asuncion. Mobile core network upgraded for 5G. Requirements: 100 base stations per 100MHz, 10% serving government entities. Claro poised to become Paraguay's first major commercial 5G operator.", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Claro"}, {"title": "Tigo - Did Not Participate in 5G Auction; Focused on 4G/Fiber Expansion; Secured USD 100M BID Invest+Proparco Financing (2026-07)", "date": "2026-07-01", "source_url": "https://idbinvest.org/en/news-media/idb-invest-and-proparco-partner-millicom-expand-digital-infrastructure-across-latin", "source_name": "BID Invest / BNamericas", "summary": "Tigo (Millicom), Paraguay's largest mobile operator (3.2M users, 47.3% share), withdrew from the August 2025 5G auction due to Chinese vendor (Huawei/ZTE) restrictions. Current focus: 3G-to-4G migration, FTTH expansion, Tigo Money fintech growth. In March 2026, BID Invest and Proparco invested USD 100M in Millicom bonds covering network modernization in 7 countries including Paraguay. In January 2026, Tigo Paraguay completed a historic USD 77M Guarani bond issuance. The company continues alternative 5G spectrum negotiations with the government.", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo"}, {"title": "Personal - Did Not Bid in 5G Auction; Maintains Low-Cost Positioning; Risks Losing Third-Operator Status to Nubicom (2026-07)", "date": "2026-07-01", "source_url": "https://www.bnamericas.com/en/news/paraguay-greenlights-claro-and-nubicom-to-ignite-5g-race", "source_name": "BNamericas", "summary": "Personal (Telecom Argentina), with ~2.4M users (35.5% share), also did not participate in the 5G auction due to Chinese vendor restrictions and has announced no independent 5G deployment plans. The company continues to focus on the low-cost segment, with coverage concentrated in urban areas and weak outside Asuncion. Without network upgrades, Personal risks losing third-operator status to Nubicom. No significant infrastructure investment announcements.", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal"}, {"title": "Nubicom - New Entrant, USD 200M 5G Build-from-Scratch Investment; Commercial Launch Expected Q2 2026 (2026-07)", "date": "2026-07-01", "source_url": "https://www.datacenterdynamics.com/en/news/?tag=nubicom", "source_name": "DataCenterDynamics / BNamericas", "summary": "Nubicom (fixed internet provider from Salta, Argentina) won 200MHz in the 3.3-3.5GHz band (license fee ~USD 2M) and announced a USD 200M investment - Paraguay's largest single 5G deployment. Must establish local subsidiary within 6 weeks and build mobile infrastructure from scratch, with at least 100 base stations per 100MHz. As an operator with no prior mobile infrastructure, building a new network presents challenges but also creates a major market opportunity for equipment vendors and infrastructure partners.", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom"}], "impact_analysis": "", "user_notes": ""}, {"title": "VII. Comprehensive Enterprise Impact Analysis", "description": "Integrating macro trends, industry dynamics, and client movements to assess Paraguay's enterprise operating environment", "tier": 2, "events": [], "impact_analysis": "## I. Cost Dimension \n\nComprehensive assessment of cost pressures based on this week's data:\n\n- **Exchange Rate Costs**: The Guarani appreciated 21.9% YoY (USD/PYG from 7,784 to 6,082), among the strongest currencies in the region. USD-denominated operating costs (local salaries, service procurement) rise significantly, squeezing export margins. However, imported equipment and raw material costs are significantly lower, benefiting import-dependent sectors such as telecom and data centers.\n- **Labor Costs**: The 5% minimum wage increase (effective July 1) is moderate and aligns with inflation (June CPI just 2.09% YoY). Real unit labor costs remain manageable. Formal employment rate exceeding 40% and IPS contributors at 842,023 signal a tightening but still affordable labor market.\n- **Energy Costs**: Decreto 5306/2026 and 5307/2026 offer USD-denominated special tariffs with up to 15-year fixed terms, creating among the world's most competitive energy cost structures for data centers and AI enterprises. HIVE Digital and X8 Cloud validate this advantage. However, the Villeta tariff policy reversal reminds that energy costs depend on policy continuity.\n- **Tax Costs**: The strong Guarani caused customs revenue to fall 11.6% in H1 2026 (despite import volumes +7%). DNIT total revenue grew only 1.8%, far below the 13.4% annual target. This may trigger new tax enforcement measures or policy adjustments in H2 2026.\n\n## II. Market Dimension \n\nParaguay's market opportunities are expanding significantly in digital infrastructure and investment facilitation:\n\n- **5G & Telecom Equipment Market**: CONATEL's new 2.3/3.5GHz spectrum tender expected in H2 2026, creating procurement opportunities for equipment and infrastructure vendors. Claro and Nubicom's deployment obligations (100 base stations each per 100MHz) mean at least 200 5G base stations' worth of demand in the near term. US-backed equipment exclusion policies favor non-Chinese suppliers.\n- **AI & Data Center Supply Chain**: HIVE BUZZ Cloud launch, Paraguay-Taiwan AI data center JV (Phase 1: 10MW to Phase 3: ~1GW), and X8 Cloud (up to USD 50B) will drive demand for: power equipment, cooling systems, fiber connectivity, cybersecurity, professional IT services. IDB's USD 130M digital facility provides additional funding.\n- **Infrastructure & Logistics**: Railway Law 7665/2026 brings Etihad Rail's USD 480M commuter rail project, creating opportunities in rail equipment, engineering, and operations. G2G model's irrevocable USD payments provide supplier payment security.\n- **EU Market Access**: EU-Mercosur FTA provisionally effective since May 1, but quota allocation unresolved. If Paraguay secures 25% quota, beef, poultry, sugar exports surge. If 'first-come, first-served' persists, Argentina and Brazil will continue capturing most quotas.\n\n## III. Compliance Dimension \n\nThe compliance environment is generally improving but requires monitoring of policy volatility:\n\n- **Investment Facilitation**: Investor Pass (Decreto 0283/2026) and updated immigration requirements in effect with four investment pathways (min USD 70K/5 jobs to permanent residency). Dividend tax cut from 15% to 8% provides substantial benefits.\n- **Tax Treaties**: Chile DTA signing marks further internationalization of Paraguay's tax compliance framework. Lower withholding rates improve investment returns.\n- **Labor Compliance**: WhatsApp minimum wage complaint hotline signals increased enforcement. Companies should complete payroll compliance audits following July 1 wage adjustment.\n- **Fiscal Risk**: IMF Article IV noted 2026 deficit may overshoot targets due to supplier arrears (USD 220M construction + ~USD 500M pharmaceuticals). Monitor potential tax adjustments to close the gap.\n\n## Overall Assessment\n\nThe 24 monitored events this week (8 from government sources) paint a picture of sustained macroeconomic strength (IMF projects 2026 GDP growth 4.4%, inflation just 2.09%). However, enterprises must maintain risk sensitivity amid strong Guarani impacts, heated EU-Mercosur quota disputes, and occasional energy policy reversals. The wave of investment in digital infrastructure and AI represents this cycle's most prominent structural opportunity.", "user_notes": ""}, {"title": "VIII. China-Specific Enterprise Risk & Opportunity Analysis", "description": "Tailored analysis for Chinese enterprises operating in or considering entry into Paraguay, covering diplomatic risks, policy risks, and strategic recommendations", "tier": 2, "events": [], "impact_analysis": "## I. Risk Warnings\n\nHigh Priority:\n\n- **Diplomatic Barriers Continually Strengthening**: At the Mercosur Summit, Paraguay's FM publicly reiterated 'willing to trade with China but won't abandon Taiwan.' China explicitly stated this is 'unacceptable.' Brazil (Lula) pushing Mercosur toward China talks adds pressure, but no near-term policy shift expected. Chinese enterprises face informal barriers in project approvals and heightened political scrutiny.\n- **Telecom Equipment Supplier Exclusion Institutionalized**: CONATEL substantively excluded Huawei/ZTE through 5G auction rules ('trade reciprocity' clause), now formally executed via Claro and Nubicom spectrum awards. New 2.3/3.5GHz tender expected to maintain identical rules. Exclusion may extend to other critical infrastructure sectors (data centers, smart city projects) through 'cybersecurity' and 'supply chain security' narratives.\n\nMedium Priority:\n\n- **US-Taiwan-Paraguay Triangle Deepening**: Paraguay's accession to the 'Santiago Commitment,' SOFA agreement, Northrop Grumman radar procurement, and US-Taiwan-Paraguay trilateral AI/5G/cybersecurity cooperation further entrench the architecture excluding Chinese enterprises. In sensitive infrastructure projects, Chinese firms face systemic access barriers, not just commercial competition.\n- **Exchange Rate Risk**: Guarani's 21.9% YoY appreciation makes it Latin America's strongest currency. RMB-equivalent profits for Chinese enterprises already in Paraguay have significantly shrunk. Hedging strategies require evaluation.\n- **Fiscal Adjustment Risk**: DNIT H1 2026 revenue grew only 1.8%, far below 13.4% annual target. H2 2026 may see new tax enforcement measures (strengthened transfer pricing reviews, import valuation adjustments), affecting Chinese enterprises' tax compliance costs.\n\n## II. Opportunity Analysis\n\nActionable Opportunities:\n\n- **Non-Equipment Roles in Digital Infrastructure**: Despite telecom equipment access restrictions, HIVE, Paraguay-Taiwan AI data center, and X8 Cloud projects demonstrate strong demand for data center construction, renewable energy integration, cooling systems, fiber cabling, power equipment, and EPC services. Chinese enterprises can explore complementary roles: electrical equipment (transformers, UPS, power distribution), cooling solutions, solar-plus-storage, data center construction engineering.\n- **Agri-Tech & Green Transformation**: Paraguay's economy is anchored by soybean and beef exports (GDP growth 6.6% largely agriculture-driven). Strong demand for precision agriculture, IoT sensors, supply chain digitization, and cold chain logistics. Chinese agri-tech enterprises can compete in areas not triggering security reviews.\n- **Mercosur Indirect Channel**: Chinese enterprises already in Brazil or Argentina can leverage the EU-Mercosur FTA for preferential EU export access. Paraguay's quota dispute provides a window to observe and influence Mercosur trade governance.\n- **New Energy & Power-to-X**: Decreto 5307/2026 offers USD-denominated tariffs and long-term contracts for green hydrogen, ammonia, methanol, and synthetic fuels. Paraguay's surplus hydroelectric resources provide globally competitive energy costs. China's electrolyzer and green methanol technology finds potential application here.\n\n## III. Strategic Recommendations\n\n**Immediate Actions:**\n- Update labor compliance and residency documentation against July 1 new minimum wage and Immigration Resolution 407/2026 requirements.\n- Assess financial impact of 21.9% Guarani appreciation on existing Paraguay operations in USD/RMB terms. Evaluate FX hedging needs.\n\n**Short-Term (1-3 Months):**\n- Closely monitor CONATEL's new 2.3/3.5GHz spectrum tender progress. Explore pathways for participation through third-country subsidiaries (e.g., European entities) for complementary equipment and services.\n- Proactively engage HIVE Digital, X8 Cloud, and Paraguay-Taiwan AI data center projects for infrastructure ancillary demands (power, cooling, construction) as non-sensitive suppliers.\n- Arrange on-the-ground policy research in Asuncion, establishing direct channels with MIC, ANDE, and MITIC for timely policy updates.\n\n**Medium-Term (3-12 Months):**\n- Study indirect market access strategies through other Mercosur countries (Brazil/Argentina), leveraging EU-Mercosur FTA for 'curved entry' into Paraguay.\n- Evaluate investment feasibility in green hydrogen and Power-to-X, capitalizing on Decreto 5307/2026 policy window and Paraguay's energy cost advantages.\n- Continuously monitor Paraguay's foreign policy trajectory - any future adjustment in China relations would open new market access dynamics. Recommend quarterly Paraguay macro-political risk assessment updates.", "user_notes": ""}]}};

  if(type!=='GDP'){
    if(type==='FX')dataSection=renderFXDailyTable(MACRO_FX,MACRO_FX.lu);
    else{var dMap={CPI:MACRO_CPI,RIN:MACRO_RIN};var unitMap={CPI:MACRO_CPI.lu,RIN:L(MACRO_RIN.lu[0],MACRO_RIN.lu[1])};dataSection=renderMacroDataTable(dMap[type],unitMap[type]);}
  }
  var h='<div class="macro-modal-overlay" id="macroModal" onclick="closeMacroModal(event)"><div class="macro-modal-card" onclick="event.stopPropagation()"><button class="macro-modal-close" onclick="closeMacroModal()">&times;</button>'+inner+dataSection+'</div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
  document.addEventListener('keydown',onMacroModalKey);
}
function renderMacroDataTable(d,unit){
  var MONTHS_L=[['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']];
  var h='<div class="macro-data-section"><button class="macro-data-toggle" onclick="toggleDataTable(this)">'+L('查看月度源数据 ▼','View Monthly Data ▼')+'</button>';
  h+='<div class="macro-data-table-wrap" style="display:none"><table class="macro-data-table"><thead><tr><th>'+L('月份','Month')+'</th><th>2023</th><th>2024</th><th>2025</th><th>2026*</th></tr></thead><tbody>';
  for(var m=0;m<12;m++){
    h+='<tr><td>'+L(MONTHS_L[0][m],MONTHS_L[1][m])+'</td>';
    var src=d.monthly||d.line;for(var y=0;y<4;y++){var idx=y*12+m,v=src[idx];if(v!=null)h+='<td>'+(v>=100?Math.round(v):v.toFixed(1))+(unit||'')+'</td>';else h+='<td class="macro-na">—</td>';}
    h+='</tr>';
  }
  h+='</tbody></table><div style="font-size:9px;color:#94A3B8;margin-top:4px">* 2026 '+L('为1–5月数据','Jan–May YTD')+'</div></div></div>';
  return h;
}
function renderFXDailyTable(d,unit){
  var DM=[31,28,31,30,31,30,31,31,30,31,30,31],dl=d.line||[];
  var h='<div class="macro-data-section"><button class="macro-data-toggle" onclick="toggleDataTable(this)">'+L('查看每日源数据 ▼','View Daily Data ▼')+'</button>';
  h+='<div class="macro-data-table-wrap" style="display:none"><table class="macro-data-table"><thead><tr><th>'+L('日期','Date')+'</th><th>PYG/USD</th></tr></thead><tbody>';
  var dates=[],day=1,mo=0,yr=2023;
  for(var i=0;i<dl.length;i++){
    dates.push(yr+'-'+(mo<9?'0'+(mo+1):(mo+1))+'-'+(day<10?'0'+day:day));
    day++;var dim=DM[mo];if(mo===1&&yr%4===0)dim=29;
    if(day>dim){day=1;mo++;if(mo>11){mo=0;yr++;}}
  }
  for(var i=dl.length-1;i>=0;i--){
    h+='<tr><td>'+dates[i]+'</td><td>'+Math.round(dl[i])+(unit||'')+'</td></tr>';
  }
  h+='</tbody></table></div></div>';
  return h;
}
function toggleDataTable(btn){
  var wrap=btn.nextElementSibling;
  if(wrap.style.display==='none'){wrap.style.display='block';btn.innerHTML=btn.innerHTML.replace('查看','隐藏').replace('View','Hide').replace(' ▼',' ▲');}
  else{wrap.style.display='none';btn.innerHTML=btn.innerHTML.replace('隐藏','查看').replace('Hide','View').replace(' ▲',' ▼');}
}
function closeMacroModal(e){
  if(e&&e.type==='keydown'){if(e.key!=='Escape')return;}
  else if(e&&e.target&&!e.target.closest('#macroModal'))return;
  var m=document.getElementById('macroModal');if(m){m.remove();document.removeEventListener('keydown',onMacroModalKey);}
}
function onMacroModalKey(e){if(e.key==='Escape')closeMacroModal(e);}
function renderMacroDashboard(){return'<div class="macro-dashboard"><div class="macro-title">'+L('巴拉圭宏观数据看板','Paraguay Macro Dashboard')+'<span class="macro-period">2023–2026</span></div><div class="macro-note">'+L('数据来源：BCP，月度数据为趋势估算值','Sources: BCP; monthly figures are trend estimates')+'</div><div class="macro-grid">'+renderMacroCardGDP()+renderMacroCardCPI()+renderMacroCardFX()+renderMacroCardRIN()+'</div></div>';}
function renderAll(){
  if(!briefingData)return;
  var d=briefingData;
  document.getElementById('headerSubtitle').textContent=(d.topic||'')+' · '+(d.time_span||'');

  var sections=d.sections||[],tier1=[],tier2=[];
  for(var i=0;i<sections.length;i++){
    if(sections[i].tier===2)tier2.push(sections[i]);else tier1.push(sections[i]);
  }
  var total=0;
  for(var i=0;i<tier1.length;i++)total+=(tier1[i].events||[]).length;

  var pills='<div class="stats-row-total"><div class="stat-pill pill-total" onclick="scrollToSec(null)"><span class="pill-label">'+L('全部事件','All Events')+'</span><span class="pill-count">'+total+'</span></div></div>';
  for(var row=0;row<2;row++){
    pills+='<div class="stats-row-sections">';
    for(var col=0;col<3;col++){
      var idx=row*3+col;if(idx>=tier1.length)break;
      var sec=tier1[idx],c=PCOL[idx],cnt=(sec.events||[]).length;
      pills+='<div class="stat-pill" style="background:'+c.bg+';color:'+c.text+';" onclick="scrollToSec('+idx+')"><span class="pill-dot" style="background:'+c.dot+'"></span><span class="pill-label">'+stripNum(sec.title)+'</span><span class="pill-count">'+cnt+'</span></div>';
    }
    pills+='</div>';
  }
  document.getElementById('statsRow').innerHTML=pills;

  var html=renderMacroDashboard();
  for(var i=0;i<tier1.length;i++)html+=renderSection(tier1[i],i);
  if(tier2.length>0&&tier1.length>0){
    html+='<div class="tier-divider"><span>'+L('形势分析与行动建议','Analysis & Recommendations')+'</span></div>';
  }
  for(var j=0;j<tier2.length;j++)html+=renderSection(tier2[j],tier1.length+j);
  document.getElementById('contentArea').innerHTML=html;
}

function renderSection(sec,idx){
  var events=sec.events||[],isT2=sec.tier===2;
  var g=GRAD[idx%8],icon=ICONS[idx%8];
  var body='';
  if(isT2||events.length===0){
    if(sec.impact_analysis)body='<div class="analysis-body">'+fmt(sec.impact_analysis)+'</div>';
    else if(!isT2)body='<div style="padding:4px 22px 16px;color:#94A3B8;font-size:13px;">'+L('暂无此时间段内的事件','No events in this period')+'</div>';
  }else{
    var cards='';
    for(var i=0;i<events.length;i++)cards+=renderCard(events[i],g[0],g[1],icon);
    body='<div class="events-grid">'+cards+'</div>';
  }
  var badge=events.length>0?'<span class="badge">'+events.length+L(' 条事件',' events')+'</span>':'';
  return '<div class="section s'+(idx%8)+(isT2?' tier2':'')+'" id="sec-'+idx+'"><div class="section-header"><h2>'+esc(sec.title||'')+'</h2>'+badge+'</div>'+(sec.description?'<div class="section-desc">'+esc(sec.description)+'</div>':'')+body+'</div>';
}

function renderCard(evt,phFrom,phTo,icon){
  var img=evt.image_url,hasImg=img&&img.indexOf('http')===0;
  var ih='';
  if(hasImg)ih='<img src="'+esc(img)+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">';
  ih+='<div class="img-placeholder" style="background:linear-gradient(135deg,'+phFrom+','+phTo+');'+(hasImg?'display:none':'display:flex')+';font-size:32px;color:#fff;">'+icon+'</div>';

  var tags='';
  if(evt.date)tags+='<span class="event-tag date">'+esc(evt.date)+'</span>';
  if(evt.client_tag)tags+='<span class="event-tag client">'+esc(evt.client_tag)+'</span>';
  if(evt.is_gov_source)tags+='<span class="event-tag gov">'+L('政府官网','Government')+'</span>';
  else if(evt.is_authoritative)tags+='<span class="event-tag auth">'+L('权威媒体','Authoritative')+'</span>';
  if(evt.source_name)tags+='<span class="event-tag source">'+esc(evt.source_name)+'</span>';

  var link=evt.source_url?'<a class="event-link" href="'+esc(evt.source_url)+'" target="_blank" rel="noopener">'+L('查看原文 →','Read more →')+'</a>':'';
  var preview=evt.summary||'';if(!preview&&evt.title)preview=evt.title;
  return '<div class="event-card"><div class="event-img">'+ih+'</div><div class="event-body"><div class="event-meta">'+tags+'</div><div class="event-preview">'+esc(ss(preview))+'</div>'+link+'</div></div>';
}

function fmt(text){
  var h=esc(text);
  h=h.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
  h=h.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
  h=h.replace(/\n/g,'<br>');
  return h;
}

function scrollToSec(idx){
  var pills=document.querySelectorAll('.stat-pill');
  for(var i=0;i<pills.length;i++)pills[i].style.outline='';
  if(idx===null||idx===undefined){window.scrollTo({top:0,behavior:'smooth'});return;}
  var el=document.getElementById('sec-'+idx);
  if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.style.boxShadow='0 0 0 3px #3B82F6';
  setTimeout(function(){el.style.boxShadow='';},1500);
}

function showHistory(){
  fetch('/api/briefings').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(list){
    if(!list||!list.length){alert(L('没有找到历史简报','No saved briefings found.'));return;}
    var h='<div class="update-modal-overlay" id="histModal" onclick="closeUpdateModal(\'histModal\')"><div class="update-modal" onclick="event.stopPropagation()"><h3>'+L('历史简报','Saved Briefings')+'</h3><div class="history-list">';
    for(var i=0;i<list.length;i++){var b=list[i];h+='<div class="history-item" onclick="loadBriefing(\''+esc(b.filename)+'\')"><div><div class="hi-title">'+esc(b.topic||b.filename)+'</div><div class="hi-meta">'+esc(b.time_span||'')+'</div></div><span class="hi-count">'+(b.event_count||0)+L(' 条',' evts')+'</span></div>';}
    h+='</div><div class="btn-row" style="margin-top:12px"><button class="btn-secondary" onclick="closeUpdateModal(\'histModal\')">'+L('关闭','Close')+'</button></div></div></div>';
    document.body.insertAdjacentHTML('beforeend',h);
  }).catch(function(){
    alert(L('此功能需要启动 Flask 服务器。\n请在终端运行: python3 web_app.py\n然后访问 http://127.0.0.1:5000','This feature requires the Flask server.\nRun: python3 web_app.py\nThen visit http://127.0.0.1:5000'));
  });
}
function loadBriefing(filename){
  fetch('/api/briefing/'+encodeURIComponent(filename)).then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    DATA['zh']=data;DATA['en']=data;briefingData=data;renderAll();closeUpdateModal('histModal');
  }).catch(function(){alert(L('加载失败','Failed to load briefing.'));});
}
function refreshBriefing(){
  var btn=document.getElementById('btnUpdate');
  btn.disabled=true;btn.textContent='...';
  fetch('/api/briefing/briefing_en.json').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    DATA['en']=data;briefingData=data;renderAll();
    fetch('/api/briefing/briefing.json').then(function(r){if(r.ok)return r.json();}).then(function(zh){if(zh)DATA['zh']=zh;}).catch(function(){});
  }).catch(function(){alert(L('刷新失败','Refresh failed'));}).finally(function(){
    btn.disabled=false;btn.textContent=L('刷新简报','Refresh');
  });
}
function openMacroModal(){
  var h='<div class="update-modal-overlay" id="macroModal" onclick="closeUpdateModal(\'macroModal\')"><div class="update-modal" onclick="event.stopPropagation()"><h3>'+L('更新宏观数据','Update Macro Data')+'</h3>';
  h+='<p style="font-size:11px;color:#94A3B8;margin-bottom:12px">'+L('下载最新 BCP Excel 后填入文件名','Fill in latest BCP Excel filenames')+'</p>';
  h+='<input type="text" id="cpiFileName" placeholder="'+L('CPI文件，如 AE_IPC-26.6.xlsx','CPI file, e.g. AE_IPC-26.6.xlsx')+'" style="width:100%;font-size:12px;padding:8px 10px;border:1px solid #CBD5E1;border-radius:6px;margin-bottom:8px">';
  h+='<input type="text" id="rinFileName" placeholder="'+L('RIN文件，如 reservas...xlsx','RIN file, e.g. reservas...xlsx')+'" style="width:100%;font-size:12px;padding:8px 10px;border:1px solid #CBD5E1;border-radius:6px;margin-bottom:12px">';
  h+='<div class="btn-row"><button class="btn-secondary" onclick="closeUpdateModal(\'macroModal\')">'+L('取消','Cancel')+'</button><button class="btn-primary" onclick="refreshMacroData()">'+L('更新','Update')+'</button></div>';
  h+='<div id="genStatus" style="margin-top:10px;font-size:12px;color:#64748B;display:none"></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
}
function refreshMacroData(){
  var cpiFile=document.getElementById('cpiFileName').value.trim();
  var rinFile=document.getElementById('rinFileName').value.trim();
  if(!cpiFile&&!rinFile){alert(L('请至少输入一个文件名','Please enter at least one filename.'));return;}
  var st=document.getElementById('genStatus');
  st.style.display='block';st.innerHTML='<span class="loading-spinner"></span>'+L('正在读取宏观数据文件…','Reading macro data files…');
  fetch('/api/update-macro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cpi_file:cpiFile,rin_file:rinFile})}).then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    var msgs=[];
    if(data.cpi&&data.cpi.length){MACRO_CPI.line=data.cpi;msgs.push(L('CPI已更新('+data.cpi.length+'个月)','CPI updated ('+data.cpi.length+' mo)'));}
    if(data.cpi_error)msgs.push(L('CPI错误: ','CPI error: ')+data.cpi_error);
    if(data.rin&&data.rin.length){MACRO_RIN.line=data.rin;msgs.push(L('RIN已更新('+data.rin.length+'个月)','RIN updated ('+data.rin.length+' mo)'));}
    if(data.rin_error)msgs.push(L('RIN错误: ','RIN error: ')+data.rin_error);
    if(msgs.length){renderAll();st.innerHTML='<span style=\"color:#10B981\">'+msgs.join('; ')+'</span>';}
    else st.innerHTML='<span style=\"color:#EF4444\">'+L('更新失败','Update failed')+'</span>';
  }).catch(function(){st.innerHTML='<span style=\"color:#EF4444\">'+L('更新失败，请确保 Flask 服务器已启动','Failed. Make sure Flask server is running.')+'</span>';});
}
function closeUpdateModal(id){
  var m=document.getElementById(id||'updateModal');if(m)m.remove();
  var h=document.getElementById('histModal');if(h&&id!=='histModal')h.remove();
}
document.addEventListener('DOMContentLoaded',function(){
  if(window.IS_STANDALONE)document.getElementById('standaloneBanner').style.display='block';
  if(MACRO_FX.monthly&&!MACRO_FX.line)MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
  briefingData=DATA['en'];
  currentLang='en';
  renderAll();
  updateLangBtn();
  if(!window.IS_STANDALONE)fetchLiveFX();
});
function fetchLiveFX(){
  fetch('/api/macro/fx').then(function(r){if(!r.ok)return;return r.json();}).then(function(d){
    if(!d||!d.rate)return;
    var arr=MACRO_FX.monthly||MACRO_FX.line||[];
    arr[arr.length-1]=d.rate;
    window.MACRO_FX_DATE=(d.date||'').replace(/-/g,'.');
    MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
    renderAll();
  }).catch(function(){});
}
</script>
</body>
</html>
