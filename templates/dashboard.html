<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paraguay Briefing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#F0F4FF;color:#1E293B;line-height:1.6;min-height:100vh}
a{color:#3B82F6;text-decoration:none}a:hover{text-decoration:underline}
.header{background:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;border-bottom:3px solid #3B82F6}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;flex-shrink:0}
.header-left h1{font-size:20px;font-weight:700;color:#1E293B}
.header-left .subtitle{font-size:12px;color:#64748B;margin-top:2px}
.header-right{display:flex;gap:8px;align-items:center}
.btn-lang{background:#EEF2FF;color:#4F46E5;font-weight:700;font-size:12px;padding:8px 14px;border-radius:20px;border:none;cursor:pointer}
.btn-lang:hover{background:#E0E7FF}
.btn-primary{background:#3B82F6;color:#fff;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-primary:hover{background:#2563EB;transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.3)}
.btn-secondary{background:#F1F5F9;color:#475569;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:#E2E8F0}
.btn-sm{font-size:11px;padding:6px 12px}
.update-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:moFade .2s}
.update-modal{background:#fff;border-radius:14px;padding:24px 28px;width:440px;max-width:90vw;box-shadow:0 24px 80px rgba(0,0,0,.25);animation:moZoom .25s}
.update-modal h3{font-size:17px;font-weight:700;color:#1E293B;margin-bottom:16px}
.update-modal label{display:block;font-size:12px;font-weight:600;color:#64748B;margin-bottom:4px}
.update-modal select,.update-modal input{width:100%;padding:8px 12px;border:1px solid #CBD5E1;border-radius:8px;font-size:13px;margin-bottom:14px;color:#1E293B;background:#fff}
.update-modal .btn-row{display:flex;gap:8px;justify-content:flex-end}
.time-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.time-preset{padding:5px 12px;border-radius:14px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #CBD5E1;background:#fff;color:#64748B;transition:all .12s}
.time-preset:hover,.time-preset.active{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.history-list{max-height:300px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid #E2E8F0;border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.history-item:hover{background:#F8FAFC;border-color:#CBD5E1}
.history-item .hi-title{font-weight:600;font-size:13px;color:#1E293B}
.history-item .hi-meta{font-size:11px;color:#94A3B8}
.history-item .hi-count{font-size:11px;font-weight:600;color:#3B82F6;background:#EEF2FF;padding:2px 8px;border-radius:10px}
.loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid #CBD5E1;border-top-color:#3B82F6;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.standalone-banner{background:#FEF3C7;color:#92400E;text-align:center;padding:6px 16px;font-size:12px;border-bottom:1px solid #FDE68A;display:none}
.standalone-banner code{background:#FDE68A;padding:1px 5px;border-radius:3px;font-size:11px}

.stats-row{max-width:1400px;margin:0 auto;padding:12px 32px 16px;display:flex;flex-direction:column;gap:8px}
.stats-row-total{display:flex;justify-content:center}
.stats-row-sections{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:768px){.stats-row-sections{grid-template-columns:repeat(2,1fr)}}
.stat-pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;cursor:pointer;transition:all .2s;border:2px solid transparent;font-size:13px;font-weight:600;user-select:none;min-width:0}
.stat-pill:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.pill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pill-label{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-count{font-size:14px;font-weight:700;margin-left:auto;flex-shrink:0;background:rgba(255,255,255,.5);padding:1px 8px;border-radius:10px}
.stat-pill.pill-total{background:#1E293B;color:#fff;font-weight:700;border-radius:24px;display:inline-flex}
.stat-pill.pill-total .pill-count{background:rgba(255,255,255,.2)}

.content{max-width:1400px;margin:0 auto;padding:0 32px 60px}
.section{background:#fff;border-radius:14px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden;border-top:4px solid #3B82F6}
.section.s0{border-top-color:#3B82F6}.section.s1{border-top-color:#EF4444}.section.s2{border-top-color:#10B981}
.section.s3{border-top-color:#8B5CF6}.section.s4{border-top-color:#06B6D4}.section.s5{border-top-color:#F59E0B}
.section.s6{border-top-color:#6366F1}.section.s7{border-top-color:#EC4899}.section.tier2{background:#FAFBFC}
.section-header{padding:16px 22px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-header h2{font-size:16px;font-weight:700;color:#1E293B}
.section-header .badge{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;background:#F1F5F9;color:#64748B;white-space:nowrap}
.section-desc{padding:4px 22px 10px;font-size:12px;color:#94A3B8}
.events-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 22px 18px}
@media(max-width:860px){.events-grid{grid-template-columns:1fr}.event-card{flex-direction:column}.event-card .event-img{width:100%!important;min-height:120px;max-height:180px}}
.event-card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;transition:all .2s;display:flex}
.event-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-1px);border-color:#CBD5E1}
.event-card .event-img{width:160px;min-height:140px;flex-shrink:0;position:relative;overflow:hidden}
.event-card .event-img img{width:100%;height:100%;object-fit:cover;display:block}
.event-card .event-img .img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.event-card .event-body{padding:12px 15px;flex:1;min-width:0;display:flex;flex-direction:column}
.event-card .event-meta{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.event-card .event-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.event-tag.date{background:#F1F5F9;color:#64748B}.event-tag.gov{background:#DCFCE7;color:#15803D}
.event-tag.auth{background:#DBEAFE;color:#1D4ED8}.event-tag.source{background:#FEF3C7;color:#A16207}
.event-tag.client{background:#FCE7F3;color:#BE185D}
.event-card .event-preview{font-size:13px;color:#334155;line-height:1.6;flex:1;overflow:visible;max-height:none}
.event-card .event-link{font-size:11px;margin-top:6px;color:#3B82F6;font-weight:500}
.analysis-body{padding:4px 22px 20px;font-size:13px;line-height:1.8;color:#334155}
.analysis-body h3{font-size:15px;font-weight:700;margin:14px 0 6px;color:#1E293B}
.analysis-body ul{padding-left:0;list-style:none}
.analysis-body li{padding:2px 0 2px 18px;position:relative}
.analysis-body li::before{content:"•";position:absolute;left:2px;color:#3B82F6;font-weight:bold}
.tier-divider{text-align:center;padding:16px 0 8px;margin:8px 0}
.tier-divider span{background:linear-gradient(135deg,#3B82F6,#6366F1);color:#fff;padding:8px 28px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(59,130,246,.25)}
.footer{text-align:center;padding:20px 32px 40px;color:#94A3B8;font-size:12px;max-width:1400px;margin:0 auto}
.macro-dashboard{background:#fff;border-radius:14px;margin-bottom:18px;padding:16px 22px 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-top:4px solid #1E293B}
.macro-title{font-size:15px;font-weight:700;color:#1E293B;margin-bottom:2px}
.macro-period{font-size:11px;font-weight:400;color:#94A3B8;margin-left:6px}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media(max-width:900px){.macro-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.macro-grid{grid-template-columns:1fr}}
.macro-card{background:#F8FAFC;border-radius:8px;padding:10px 8px 4px;border:1px solid #E2E8F0}
.macro-card-title{font-size:10.5px;font-weight:600;color:#475569;margin-bottom:4px;text-align:center;line-height:1.3;min-height:28px;display:flex;align-items:center;justify-content:center}
.macro-latest{display:flex;justify-content:center;align-items:baseline;gap:4px;margin-top:2px;padding:3px 0}
.macro-latest-label{font-size:9px;color:#94A3B8;font-weight:500}
.macro-latest-val{font-size:15px;font-weight:700;color:#1E293B}
.macro-latest-unit{font-size:9px;color:#64748B;font-weight:500}
.macro-latest-date{font-size:9px;color:#94A3B8}
.macro-note{font-size:9px;color:#94A3B8;margin-top:1px}
.macro-card{cursor:pointer;transition:transform .15s,box-shadow .15s}
.macro-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.macro-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:moFade .2s}
.macro-modal-card{background:#fff;border-radius:16px;padding:24px 28px 18px;width:680px;max-width:94vw;max-height:90vh;overflow-y:auto;cursor:default;box-shadow:0 24px 80px rgba(0,0,0,.25);position:relative;animation:moZoom .25s}
.macro-modal-card .macro-card{border:none;padding:0;background:transparent;cursor:default}
.macro-modal-card .macro-card:hover{transform:none;box-shadow:none}
.macro-modal-card .macro-card-title{font-size:15px;min-height:auto;margin-bottom:10px}
.macro-modal-card .macro-legend,.macro-modal-card [style*=legend]{font-size:11px!important}
.macro-modal-close{position:absolute;top:10px;right:16px;font-size:26px;cursor:pointer;color:#94A3B8;background:none;border:none;line-height:1;z-index:10;padding:4px 8px;border-radius:6px}
.macro-modal-close:hover{color:#475569;background:#F1F5F9}
.macro-data-section{margin-top:14px;border-top:1px solid #E2E8F0;padding-top:10px}
.macro-data-toggle{background:#F8FAFC;border:1px solid #CBD5E1;padding:6px 16px;border-radius:6px;font-size:12px;color:#64748B;cursor:pointer;font-weight:500}
.macro-data-toggle:hover{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.macro-data-table-wrap{margin-top:10px;max-height:340px;overflow-y:auto;border:1px solid #E2E8F0;border-radius:8px}
.macro-data-table{width:100%;border-collapse:collapse;font-size:12px}
.macro-data-table th{background:#F8FAFC;padding:7px 12px;text-align:right;font-weight:600;color:#475569;border-bottom:2px solid #E2E8F0;position:sticky;top:0}
.macro-data-table th:first-child{text-align:left}
.macro-data-table td{padding:5px 12px;text-align:right;border-bottom:1px solid #F1F5F9;color:#334155;font-variant-numeric:tabular-nums}
.macro-data-table td:first-child{text-align:left;color:#64748B;font-weight:500}
.macro-data-table tbody tr:hover td{background:#EEF2FF}
.macro-na{color:#CBD5E1!important}
@keyframes moFade{from{opacity:0}to{opacity:1}}
@keyframes moZoom{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:768px){.header{padding:14px 16px}.header-left h1{font-size:16px}.stats-row{padding:10px 14px;gap:6px}.stat-pill{padding:8px 12px;font-size:12px}.pill-label{font-size:11px}.content{padding:0 12px 40px}.section-header{padding:12px 14px 0}.events-grid{grid-template-columns:1fr;padding:4px 14px 14px}}
</style>
</head>

tive": true}, {"title": "市场参与者下调汇率预测：2026年底汇率预期修正为6300巴拉圭瓜拉尼/美元（2026年7月17日）", "date": "2026-07-17", "source_url": "https://www.lanacion.com.py/negocios/2026/07/17/los-agentes-economicos-rebajan-sus-previsiones-para-el-tipo-de-cambio/", "source_name": "La Nación / BCP-EVE", "summary": "巴拉圭央行7月《预期变量调查》显示，市场参与者下调了各期限汇率预测：2026年7月为6100瓜拉尼（此前为6200），8月为6150，2026年底为6300（此前为6393），2027年底为6500。7月17日巴拉圭央行官方汇率为1美元兑6060.78瓜拉尼。受农业出口强劲流入、金融体系流动性充裕及全球美元走弱推动，瓜拉尼兑美元年初至今已升值约8.5%。巴拉圭央行连续第四个月维持政策利率5.50%不变，下次议息会议定于7月23日举行。实际事前利率2.0%仍处于中性区间（1.3%-2.6%）内。截至2026年5月，私营部门信贷同比增长15.3%，存款同比增长18.5%。", "image_url": "https://www.lanacion.com.py/resizer/v2/4Q2AWHLAZJBELARN5A2R42HWEE.jpeg?auth=7062fce9b62067801f643d7bc74443c67b9cf47c82a8a1b566f6e1543796ec58&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "截至7月10日，国际净储备为113.29亿美元，低于7月3日的115.05亿美元（2026年7月10日）", "date": "2026-07-10", "source_url": "https://www.bcp.gov.py/", "source_name": "BCP", "summary": "据巴拉圭央行初步数据显示，截至2026年7月10日，巴拉圭净国际储备为113.2901亿美元。较7月3日的115.0483亿美元减少1.758亿美元。此次下降主要源于\"其他储备资产\"从98.919亿美元降至97.266亿美元，部分被黄金储备10.871亿美元及特别提款权4.517亿美元所抵消。年初至今，储备从1月的109.61亿美元强劲增长至3月峰值117.2亿美元，随后逐步回落。当前储备水平依然稳健，可覆盖约8个月的进口需求，为外部经济提供有力缓冲。", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "2026年上半年，国家税务收入仅增长2.1%，远低于9%的预算目标；总统佩尼亚下令下半年加强税收征管（2026年7月11日）", "date": "2026-07-11", "source_url": "https://www.ultimahora.com/el-fmi-pidio-cuentas-completas", "source_name": "Última Hora / MEF", "summary": "巴拉圭税务机关国家税务与海关总局（DNIT）报告称，2026年上半年财政收入增长率仅为2.1%，远低于全年预算设定的9%目标。总统圣地亚哥·佩尼亚已下令下半年加强征收力度以缩小差距。国际货币基金组织（IMF）在6月29日发布的第四条磋商报告中已警告，由于累积国内欠款的规范化处理，财政赤字将超过国内生产总值（GDP）1.5%的目标，其中包括欠建筑企业的2.2亿美元及欠制药行业的约10亿美元。IMF预计，赤字率需至2028年才能收敛至1.5%的目标水平，并呼吁公共账目实现完全透明。2026年上半年，公共支出累计增长11.7%。", "image_url": null, "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "二、政治与政策动态", "description": "重大立法、政策调整、外商投资监管、税收改革、投资激励措施", "tier": 1, "events": [{"title": "国会要求提交关于技术投资激励措施及关键矿产发展战略的报告（2026年7月16日）", "date": "2026-07-16", "source_url": "https://www.diputados.gov.py/noticias/noticias/2434", "source_name": "Cámara de Diputados", "summary": "众议院批准两项决议案，要求行政部门就以下事项提交报告：（1）信息技术与通信部关于利用巴拉圭清洁水力能源吸引高能耗及技术型企业（数据中心、云计算、人工智能）的激励计划、基础设施可行性、投资布局及路线图；（2）矿业与能源副部长办公室关于锂、钛、铀及其他战略矿产开发的特许权信息、地质图更新、战略投资计划及立法改革，包括修订《矿业法》（第3180/07号法律）中关于税收优惠、特许权使用费及开采时限的条款。", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "总统佩尼亚排除新能源法令，将电价决策权下放至国家电力公司（ANDE），在阿尼亚夸访问期间作出表态（2026年7月17日）", "date": "2026-07-17", "source_url": "https://www.lapoliticaonline.com/paraguay/energia-py/pena-apura-el-proyecto-ana-cua-para-aumentar-la-generacion-de-energia-en-plena-cruzada-del-gobierno-por-la-ia-7440/", "source_name": "La Política Online", "summary": "在对阿尼亚瓜扩建项目（亚西雷塔水电站，工程进度76%）进行实地考察时，总统圣地亚哥·佩尼亚表示，行政部门不会为能源密集型产业发布新的能源法令，并明确电价决策属于国家电力管理局（ANDE）根据其1960年代框架法律所拥有的法定权限。佩尼亚强调，政府的工作重点在于发电能力而非消费补贴，这与巴拉圭将自身定位为人工智能数据中心及高能耗产业目的地的战略相一致。阿尼亚瓜扩建项目将新增270兆瓦发电能力（使亚西雷塔水电站发电量提升10%），首台涡轮机将于2028年投入运行。佩尼亚还指出，伊泰普水电站附件C的重新谈判因巴西2026年11月大选而陷入停滞。", "image_url": "https://www.lapoliticaonline.com/files/image/293/293643/6a5a8a6f45af8_1200_630!.jpg?s=f3b8fe7891896c2fc07b657f791c45cc&d=1784257200", "is_gov_source": false, "is_authoritative": true}, {"title": "IPS紧急情况：参议院评估发行3.04亿美元主权债券以救助社会保障体系（2026年7月17日）", "date": "2026-07-17", "source_url": "https://elnacional.com.py/politica/ips-recibiria-inyeccion-mas-usd-300-millones-n109098", "source_name": "El Nacional", "summary": "参议院正在评估对社会保障局（IPS）紧急法案的修改，该法案已于2026年5月获得众议院批准。拟议措施包括发行高达3.04亿美元的主权债券，并争取多边贷款以救助养老金和医疗体系。2026年第一季度，IPS面临40%的药品短缺，基础设施也在持续恶化。紧急状态的宣布反映出社会保障义务带来的财政压力日益增大，穆迪已将其列为巴拉圭财政整顿路径的中期风险。", "image_url": "https://statics.elnacional.com.py/2026/07/6a586c8be398f.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "工业和贸易部将柴油中强制掺混生物柴油的比例提高至8%-10%，目标是在2026年7月17日前实现每年节省3亿美元的进口支出。", "date": "2026-07-17", "source_url": "https://www.lapoliticaonline.com/paraguay/energia-py/pena-apura-el-proyecto-ana-cua-para-aumentar-la-generacion-de-energia-en-plena-cruzada-del-gobierno-por-la-ia-7440/", "source_name": "MIC / La Política Online", "summary": "工业和商业部（MIC）发布第472/2026号决议，将普通柴油中强制性生物柴油掺混比例从此前水平提高至8%至10%。该措施旨在减少对进口柴油的依赖，预计每年可节省高达3亿美元的外汇支出。此举与政府更广泛的能源独立战略相契合，补充了推动可再生能源发电和促进电动交通的举措。", "image_url": "https://www.lapoliticaonline.com/files/image/293/293643/6a5a8a6f45af8_1200_630!.jpg?s=f3b8fe7891896c2fc07b657f791c45cc&d=1784257200", "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "三、社会与劳动领域动态", "description": "劳动力市场、社会稳定、公共安全、就业数据", "tier": 1, "events": [{"title": "新最低工资标准于7月1日生效：每月3,044,000瓜拉尼，涨幅5%（2026年7月1日）", "date": "2026-07-01", "source_url": "https://www.ultimahora.com/expo-empleo-atrajo-2-000-personas-para-1-410-cupos", "source_name": "MTESS / Última Hora", "summary": "巴拉圭私营部门新法定最低工资于2026年7月1日生效，依据第6225/2026号法令，基于国家最低工资委员会建议及同比消费者物价指数变动上调5%。新的月最低工资为3,044,000瓜拉尼（按当前汇率约合502美元），日最低工资为117,077瓜拉尼。劳动、就业及社会保障部获授权对特定行业及分级职业的最低工资进行监管并发布具体标准。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/4e4284c/2147483647/strip/true/crop/1171x659+0+55/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F21%2Ff5%2F8fc4d14a4cc38cda46fcdc30c030%2Fuheco20260717-012a-ph01-5337.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "2026年就业博览会吸引超2000名求职者，40家企业提供1410个岗位（2026年7月17日）", "date": "2026-07-17", "source_url": "https://www.ultimahora.com/expo-empleo-atrajo-2-000-personas-para-1-410-cupos", "source_name": "Última Hora / MTESS", "summary": "由劳动、就业与社会保障部与巴拉圭农村协会联合举办的2026年就业博览会共吸引超过2000名求职者登记，涵盖制药、安保、清洁、零售及工业等行业的40家企业提供1410个岗位。通过EmpleaPy平台共收到超过9000份在线申请。根据岗位和行业不同，提供的薪资范围从最低的3,044,000瓜拉尼至6,500,000瓜拉尼。劳动、就业与社会保障部、国家职业培训系统与巴拉圭农村协会签署合作协议，将通过培训和劳动能力认证提升就业能力。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/4e4284c/2147483647/strip/true/crop/1171x659+0+55/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F21%2Ff5%2F8fc4d14a4cc38cda46fcdc30c030%2Fuheco20260717-012a-ph01-5337.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "医生宣布将于8月举行全国罢工；政府承诺保障关键医疗服务（2026年7月9日）", "date": "2026-07-09", "source_url": "https://www.hoy.com.py/nacionales/2026/07/09/medicos-anuncian-huelga-en-agosto-salud-blindara-servicios-criticos", "source_name": "Hoy / Ministerio de Salud", "summary": "医疗专业人员宣布将于2026年8月举行全国性罢工，要求改善工作条件、提高薪资并解决巴拉圭社会保险学会（IPS）药品短缺问题。卫生部表示将在罢工期间实施应急计划以保障关键医疗服务。此次劳工行动加剧了巴拉圭医疗体系本已承受的压力——该体系已因IPS紧急状态（40%药品缺口）及基础设施老化而捉襟见肘。", "image_url": "https://www.lanacion.com.py/resizer/v2/PDWKSZCPUNDXLDDT5XCG5VAL6A.jpg?auth=1512391132b72a2e61d7d035edccfab4bccdb1a3eee03a245941350a70e489df&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "四、国际关系与外交", "description": "巴拉圭与主要大国的关系、南方共同市场动态、以及两岸关系。", "tier": 1, "events": [{"title": "巴拉圭释放对华贸易开放信号，但不与台湾断交；北京拒绝有条件接触（2026年7月1日）", "date": "2026-07-01", "source_url": "https://www.bssnews.net/business/401489", "source_name": "BSS News / Global Times", "summary": "在卢克举行的南方共同市场峰会上，巴拉圭外长鲁本·拉米雷斯表示，只要不要求与台湾断绝外交关系，巴拉圭愿与中国开展贸易，并宣称：\"若以此为条件，我方无任何限制。\"中国外交部发言人郭嘉昆当即驳斥这一立场，敦促巴拉圭\"站在历史正确一边\"，恪守一个中国原则。《环球时报》（7月12日）将巴拉圭立场定性为\"外交投机主义\"，指出一个中国原则是\"不容谈判的红线\"。巴拉圭目前仍是南美洲唯一与台湾保持\"邦交\"的国家，也是南方共同市场成员国中唯一未与中国建交的国家。与此同时，台湾驻巴拉圭\"大使\"李应元于7月17日为2026年巴拉圭农牧业博览会台湾馆揭幕，凸显双方持续开展的双边合作。", "image_url": "https://www.bssnews.net/assets/news_photos/2026/07/01/image-401489-1782879776.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "南方共同市场峰会：巴拉圭要求欧盟肉类配额按25%平均分配；乌拉圭接任轮值主席国（2026年7月1日）", "date": "2026-07-01", "source_url": "https://rurales.elpais.com.uy/region/paraguay-mantiene-firme-su-postura-de-dividir-la-cuota-carnica-con-la-ue-en-partes-iguales", "source_name": "El País Uruguay / Mercosur", "summary": "在亚松森举行的第68届南方共同市场峰会上，总统圣地亚哥·佩尼亚坚决要求欧盟关税配额（特别是9.9万吨牛肉配额）实现25%的平等分配，称这是\"正义之举，而非任性妄为\"，并指出巴拉圭作为内陆国家面临更高的物流成本，而现行制度未能解决这一问题。关于糖、牛肉、大米和蜂蜜配额的争端仍未解决。此次峰会标志着轮值主席国从巴拉圭移交至乌拉圭，同时也是该集团成立35周年。阿根廷总统哈维尔·米莱未出席，改派外长代表参会。欧盟-南方共同市场自由贸易协定于2026年5月1日临时生效，但仍需欧洲议会及南方共同市场各成员国立法机构批准。德国于7月1日承认，在欧盟批准前仍存在若干问题。", "image_url": "https://imgs.elpais.com.uy/dims4/default/4996b07/2147483647/strip/true/crop/566x275+0+23/resize/1440x700!/quality/90/?url=https%3A%2F%2Fel-pais-uruguay-production-web.s3.us-east-1.amazonaws.com%2Fbrightspot%2F98%2F5d%2F6e84797647a2ae028f2d131f404b%2Fganaderia-paraguay.JPG", "is_gov_source": false, "is_authoritative": true}, {"title": "南方共同市场启动与日本的贸易谈判，推进与阿联酋、加拿大和越南的磋商（2026年7月1日）", "date": "2026-07-01", "source_url": "https://www.tribuneindia.com/news/world/mercosur-leaders-defend-unity-amid-global-tensions-launch-new-trade-talks/", "source_name": "Tribune India / Mercosur", "summary": "在亚松森峰会期间，南方共同市场领导人正式启动与日本的经济伙伴关系协定谈判（2025年双边贸易额达137亿美元），并确认了与阿联酋和加拿大缔结自由贸易协定的意向，与越南的首轮谈判定于2026年下半年在布宜诺斯艾利斯举行。深化与印度的贸易优惠安排以及落实欧洲自由贸易联盟协定也被列为优先事项。欧盟-南方共同市场协定被明确视为在保护主义抬头背景下（尤其是特朗普时代潜在关税的影响）对多边主义的一次押注。西班牙贸易国务秘书7月15日在亚松森强调，欧盟-南方共同市场协定开启了\"贸易与投资的新阶段\"，并指出巴拉圭在再造林、工业化和食品生产领域存在发展机遇。", "image_url": "https://www.tribuneindia.com/sortd-service/imaginary/v22-01/jpg/large/high?url=dGhldHJpYnVuZS1zb3J0ZC1wcm8tcHJvZC1zb3J0ZC9tZWRpYTg2ZGY3OGIwLTc2MTEtMTFmMS1hZmFlLTJkNzNlMTMwYzExYi5qcGc=", "is_gov_source": false, "is_authoritative": true}, {"title": "台湾-巴拉圭“伊瓜苏数字”人工智能数据中心项目推进，获2亿美元台湾融资（2026年7月6日）", "date": "2026-07-06", "source_url": "https://nearshoreamericas.com/taiwan-backs-paraguays-ai-data-center-push/", "source_name": "Nearshore Americas / European Values Center", "summary": "台湾与巴拉圭的\"伊瓜苏数字\"项目正推进中，这是一个各占50%股权的双边合作项目，旨在建设全球最大的人工智能数据中心之一，台湾方面已提供2亿美元融资。该数据中心初始容量为10兆瓦，未来将扩展至1吉瓦（1000兆瓦），预计2027年底投入运营。据报道，这是全球首个由政府间双边合作建设人工智能计算基础设施的计划。在北京对亚松森施加外交压力之际，该项目被视为台湾与巴拉圭战略关系的深化。该计划还涉及巴拉圭由台湾支持的伊泰普科技园，预计将带动人工智能、云计算和数字基础设施领域的更广泛投资。", "image_url": "https://nearshoreamericas.com/wp-content/uploads/2026/07/Paraguay.jpg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "五、行业聚焦：电信、数字能源与人工智能", "description": "5G频谱与商用部署、光纤基础设施、数字能源投资、人工智能数据中心、产业政策", "tier": 1, "events": [{"title": "Tigo与Personal参与巴拉圭第二次5G频谱拍卖，承诺投入超4000万美元用于基础设施建设（2026年7月18日）", "date": "2026-07-18", "source_url": "https://www.bnamericas.com/en/news/tigo-personal-bid-for-5g-spectrum-in-paraguay-auction", "source_name": "BNamericas / CONATEL", "summary": "Tigo（Millicom）与Personal（Núcleo）已向巴拉圭国家电信委员会（CONATEL）提交了第二次5G频谱拍卖（招标编号01/2026）的投标书，申请获取2.3 GHz和3.5 GHz频段的频率。此前，这两家运营商均未参与2025年的首次拍卖，原因是相关限制条款实质上将中国供应商（华为、中兴）排除在外。新一轮拍卖要求中标方在安全网络基础设施领域至少投资4000万美元，并采用兼容5G NR R15及以上版本的\"可信供应商\"设备。这标志着竞争格局的重大转变：巴拉圭两大移动运营商（Tigo拥有316万用户，Personal拥有166万用户）现已准备加入Claro（拥有94.7万用户，于2025年12月推出5G服务）的5G竞赛。本次拍卖还提供了Claro此前未获得的频谱资源，包括2.3 GHz频段。", "image_url": "https://cdnimg.bnamericas.com/FvjMDYAwWcUqnPyNWfhcfmpgpqPbViwKPGHRMRvncgEvpMPdLlMpFHTUrpPPeWyB.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo, Personal"}, {"title": "HIVE数字技术公司扩大巴拉圭业务：100兆瓦变电站即将完工，计划建设三级数据中心（2026年7月18日）", "date": "2026-07-18", "source_url": "https://www.nasdaq.com/press-release/hive-digital-technologies-expands-paraguay-launching-one-first-purpose-built-ai-buzz", "source_name": "Nasdaq / HIVE Digital Technologies", "summary": "HIVE数字技术公司正在加速其在巴拉圭的扩张：位于伊瓜苏的一座100兆瓦变电站已完成土建工程，预计于2026年9月通电；一座新的三级数据中心将于2026年秋季开工建设，预计2027年下半年投入运营。HIVE目前在巴拉圭运营约300兆瓦的一级数据中心，并于2026年1月在亚松森推出BUZZ AI云平台，面向学术、医疗和企业客户。巴拉圭的电力成本比巴西低至多2.8倍，且拥有100%可再生水电矩阵，这是其关键竞争优势。该公司在巴拉圭的整体布局使其跻身该国最大的数字基础设施投资者之列。", "image_url": "https://www.nasdaq.com/sites/acquia.prod/files/2024/04/05/Nasdaq%20default%20share%20image.jpg?703664432", "is_gov_source": false, "is_authoritative": true, "client_tag": "HIVE Digital"}, {"title": "Nubicom 5G部署因未履行2亿美元投资承诺而接受调查（2026年7月18日）", "date": "2026-07-18", "source_url": "https://www.bnamericas.com/en/news/tigo-personal-bid-for-5g-spectrum-in-paraguay-auction", "source_name": "BNamericas / CONATEL", "summary": "在巴拉圭首次5G频谱拍卖（2025年8月）中以2亿美元投资承诺赢得3.5吉赫频段200兆赫频谱的阿根廷互联网服务提供商努比康公司，目前正因未报告任何部署进展而接受巴拉圭国家电信委员会调查。该公司须在六周内设立本地子公司，并在六个月内启动基础设施部署，商业服务预计于2026年3月至4月推出。努比康在阿根廷和巴拉圭均无既有移动网络基础设施，这使得其2亿美元投资承诺显得尤为激进。此次违规行为引发了对国家电信委员会频谱分配监管的质疑，可能导致频谱牌照被吊销，从而为该频段重新向竞争运营商开放创造条件。", "image_url": "https://cdnimg.bnamericas.com/FvjMDYAwWcUqnPyNWfhcfmpgpqPbViwKPGHRMRvncgEvpMPdLlMpFHTUrpPPeWyB.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom"}, {"title": "阿尼亚瓜水电站扩建工程已完成76%；将为巴拉圭电网增加270兆瓦装机容量，首台涡轮机将于2028年投入运行（2026年7月17日）", "date": "2026-07-17", "source_url": "https://www.lapoliticaonline.com/paraguay/energia-py/pena-apura-el-proyecto-ana-cua-para-aumentar-la-generacion-de-energia-en-plena-cruzada-del-gobierno-por-la-ia-7440/", "source_name": "La Política Online / Yacyretá", "summary": "截至总统培尼亚7月17日现场视察时，亚西雷塔水电站阿尼亚夸扩建工程已完成76%的实体建设。该项目将新增270兆瓦发电能力（约占亚西雷塔当前发电量的10%），三台涡轮机组中的首台计划于2028年投入运营。该扩建工程是巴拉圭将自身定位为人工智能数据中心及能源密集型产业清洁能源枢纽战略的核心环节。结合伊泰普水电站现有发电能力，新增发电量进一步巩固了巴拉圭作为全球最大人均电力出口国及南美洲可再生能源占比最高国家的地位。", "image_url": "https://www.lapoliticaonline.com/files/image/293/293643/6a5a8a6f45af8_1200_630!.jpg?s=f3b8fe7891896c2fc07b657f791c45cc&d=1784257200", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭光纤宽带市场预计以5.7%的复合年增长率增长，到2029年市场规模达2.89亿美元；Tigo和Personal引领市场扩张（2026年3月12日）", "date": "2026-03-12", "source_url": "https://www.globenewswire.com/fr/news-release/2026/03/12/3254431/28124/en/Paraguay-Telecom-Operators-Intelligence-Report-2026-Featuring-Tigo-Claro-Personal-COPACO-and-VOX.html", "source_name": "GlobeNewsWire / 6W Research", "summary": "巴拉圭固定宽带服务市场规模预计将从2024年的2.193亿美元增长至2029年的2.891亿美元（年复合增长率5.7%），主要驱动力包括私营部门对光纤到户网络的投资、国家宽带发展目标以及向服务不足的农村地区拓展。蒂戈（拥有316万移动互联网用户）和佩尔索纳尔（拥有166万用户）是推动光纤扩张的主要运营商，此外还有科帕科（国有运营商）和沃克斯。尽管互联网普及率已达68%，但城乡之间的网络连接差距依然显著，这为持续的基础设施投资提供了机遇。移动数据业务板块预计到2029年将达到5.329亿美元（以2024年4.406亿美元为基数，年复合增长率3.9%）。", "image_url": "https://ml.globenewswire.com/Resource/Download/908fb457-7f8e-4a08-9081-5565e3dfb3d7", "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo, Personal"}], "impact_analysis": "", "user_notes": ""}, {"title": "六、主要客户动态", "description": "追踪巴拉圭主要电信运营商的战略重新定位、投资计划、网络扩展及技术选择", "tier": 1, "events": [{"title": "Tigo（Millicom）：通过频谱拍卖竞标进入巴拉圭5G竞争；以316万移动用户位居市场领先地位（2026年7月18日）", "date": "2026-07-18", "source_url": "https://www.bnamericas.com/en/news/tigo-personal-bid-for-5g-spectrum-in-paraguay-auction", "source_name": "BNamericas / Millicom", "summary": "Tigo（Millicom）在巴拉圭第二次5G频谱拍卖中提交了投标，承诺在安全网络基础设施方面投入至少4000万美元。作为拥有316万移动互联网用户（同比增长7%）及最大光纤网络的市场领导者，Tigo的5G入局将显著重塑竞争格局。此前，Tigo因供应商限制条款（排除华为和中兴）而缺席首次拍卖。该运营商正同步将光纤网络扩展至服务不足的农村地区，同时面临Claro凭借5G先发优势（2025年12月商用）争夺市场份额的挑战。Millicom的拉美整体战略仍聚焦于连接基础设施，投资者正密切关注其长期增长前景。", "image_url": "https://cdnimg.bnamericas.com/FvjMDYAwWcUqnPyNWfhcfmpgpqPbViwKPGHRMRvncgEvpMPdLlMpFHTUrpPPeWyB.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo"}, {"title": "个人（核心业务）：在加速光纤扩张的同时竞标5G频谱；拥有166万移动用户（2026年7月18日）", "date": "2026-07-18", "source_url": "https://www.bnamericas.com/en/news/tigo-personal-bid-for-5g-spectrum-in-paraguay-auction", "source_name": "BNamericas / Núcleo", "summary": "巴拉圭第二大移动运营商Personal（核心品牌）拥有166万移动互联网用户，该公司与Tigo共同参与了第二次5G频谱拍卖。Personal正同步加速光纤网络向服务薄弱区域的扩展，为移动5G与固定宽带双线增长布局。该运营商积极投身FTTP市场，通过部署GPON与EPON技术弥合城乡数字鸿沟。其\"5G移动+光纤宽带\"双引擎战略将助力其在两大领域抢占增长机遇，预计到2029年巴拉圭固定宽带市场规模将达2.891亿美元。", "image_url": "https://cdnimg.bnamericas.com/FvjMDYAwWcUqnPyNWfhcfmpgpqPbViwKPGHRMRvncgEvpMPdLlMpFHTUrpPPeWyB.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal"}, {"title": "克拉罗（美洲移动公司）：自2025年12月起，5G网络已投入运营，初始投资3500万美元；计划于2026年持续扩大覆盖范围（2026年3月12日）", "date": "2026-03-12", "source_url": "https://www.bnamericas.com/en/news/paraguay-greenlights-claro-and-nubicom-to-ignite-5g-race", "source_name": "BNamericas / Claro Paraguay", "summary": "巴拉圭克拉罗公司（Claro Paraguay）作为该国首家推出商用5G服务的运营商（2025年12月），正以3500万美元的初始投资持续推进网络扩建。其覆盖范围涵盖大亚松森、东方市、恩卡纳西翁、科罗内尔奥维耶多及佩德罗胡安卡瓦列罗。该运营商持有3.5GHz频段200兆赫频谱（以200万美元购得），并与诺基亚合作部署5G无线设备及大规模多输入多输出设备。然而，克拉罗公司仍为第三大运营商，仅拥有94.7万移动互联网用户，且随着蒂戈公司（Tigo）和佩尔索纳尔公司（Personal）通过第二次频谱拍卖进入5G市场，竞争日趋激烈。克拉罗公司总经理阿尔弗雷多·阿拉卡兹表示，计划在2026年前实现\"持续扩建以覆盖更多国土\"。", "image_url": "https://cdnimg.bnamericas.com/POjyKcsMosNhPZELKycnexVTCIJVYkuGWGwnoaKLyxfeXJXJIBUyjNZapDzARxCo.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Claro"}, {"title": "努比康：2亿美元5G投资承诺因未履约被调查；尚无部署进展报告（2026年7月18日）", "date": "2026-07-18", "source_url": "https://www.bnamericas.com/en/news/tigo-personal-bid-for-5g-spectrum-in-paraguay-auction", "source_name": "BNamericas / CONATEL", "summary": "阿根廷固定无线提供商努比康（Nubicom）在巴拉圭首次5G频谱拍卖中以2亿美元部署承诺赢得3.5 GHz频段200 MHz频谱，但因未报告任何基础设施部署进展而面临巴拉圭国家电信委员会（CONATEL）调查。该公司须在六周内设立本地子公司，并在六个月内启动部署，商业服务预计于2026年3月至4月推出。努比康此前无移动网络运营经验，其履约失败显著提升了交易对手风险。国家电信委员会可能撤销其频谱分配，从而释放3.3-3.5 GHz频段，供参与第二轮拍卖的蒂戈（Tigo）或佩尔索纳尔（Personal）重新竞标。此事件凸显了资本密集型5G部署中新进入运营商面临的执行风险。", "image_url": "https://cdnimg.bnamericas.com/FvjMDYAwWcUqnPyNWfhcfmpgpqPbViwKPGHRMRvncgEvpMPdLlMpFHTUrpPPeWyB.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom"}], "impact_analysis": "", "user_notes": ""}, {"title": "七、对商业运营的综合影响分析", "description": "整合宏观、政策、行业及客户动态，从成本、市场与合规三个维度评估对企业的影响。", "tier": 2, "events": [], "impact_analysis": "**宏观环境：总体有利，财政需关注**\n\n巴拉圭进入2026年下半年，宏观经济基本面依然强劲。巴拉圭央行将国内生产总值增长预测上调至4.5%，穆迪连续第三年确认Baa3评级，为企业规划提供了稳定且可预测的环境。瓜拉尼持续走强（1美元兑6060瓜拉尼，年初至今升值8.5%），有利于设备和技术进口商——这对电信基础设施投资是利好——但同时给出口导向型行业带来压力。私人信贷同比增长15.3%，表明金融中介健康运转，支持企业投资。\n\n然而，有两项财政风险需要关注：（1）国家税务总局上半年收入仅增长2.1%，而预算目标为9%，这表明下半年可能出现财政紧缩，影响公共采购和基础设施支出；（2）社会保障局紧急情况以及可能发行的3.04亿美元债券，为主权资产负债表增加了或有负债，尽管穆迪评估认为这些在当前评级下是可控的。国际货币基金组织对国内欠款（超过12亿美元）的警告表明，结构性财政压力尚未解决，最终可能通过提高税收或减少公共投资影响商业环境。\n\n**政治与监管：支持投资，监管初现**\n\n政策环境依然强烈支持投资，这体现在投资者通行证计划、铁路行业向国际资本开放（2026年第7665号法律，第一阶段与阿联酋阿提哈德铁路公司合作投资4.8亿美元），以及维持来料加工制度激励措施。然而，国会于7月16日要求就科技投资激励措施和关键矿产战略提交详细报告，这表明立法机构对外国投资的监督正在加强，尤其是在战略领域（数据中心、采矿、人工智能基础设施）。这尚未构成限制，但表明监管框架正朝着更高透明度要求演变。\n\n佩尼亚宣布不发布新的能源法令，这是一个混合信号：它提供了监管稳定性（没有不可预测的电价变化），但也意味着新市场进入者无法协商定制电价，只能依赖国家电力管理局的标准框架。对于能源密集型项目（数据中心、人工智能计算），与之前的环境相比，这可能会减缓交易进程。\n\n**行业动态：5G竞争加剧——设备与基础设施供应商的窗口期**\n\nTigo和Personal参与5G频谱拍卖，标志着巴拉圭电信市场的结构性转变。在Claro于2025年12月单独推出5G之后，市场正朝着三家运营商共同运营5G的格局发展，这将推动：\n- 加速基础设施投资（仅拍卖阶段每家运营商最低投资4000万美元，外加部署成本）\n- 对可信供应商5G设备的需求增加（诺基亚已向Claro供货；Tigo/Personal的供应商选择待定）\n- 光纤回传扩容以支持5G密集化部署\n- 为管理部署成本而可能进行的网络共享或基础设施合作\n\nNubicom的不合规调查是一个警示案例，但也创造了机遇：如果其200兆赫的3.5吉赫频谱被撤销并重新分配，竞争格局可能进一步变化。设备供应商和基础设施服务提供商应密切关注拍卖结果及随后的供应商选择流程。\n\n**数字基础设施：巴拉圭定位为区域人工智能枢纽——但执行差距依然存在**\n\n台湾地区2亿美元的伊瓜苏数字承诺、HIVE的100兆瓦变电站加三级数据中心，以及阿尼亚库阿270兆瓦扩建项目，共同为巴拉圭成为区域人工智能/计算枢纽创造了可信的势头。然而，关键差距依然存在：\n- 电网容量限制在约5吉瓦，制约了已公布项目的规模（X8 Cloud的500亿美元/30年愿景似乎过于宏大）\n- 目前尚无专门的数据中心监管框架\n- 伊泰普水电站附件C重新谈判（在巴西2026年11月大选前陷入停滞）给长期电价带来不确定性\n- 人工智能、工程和数据中心运营领域的人力资本短缺\n\n数字基础设施领域的企业应对已公布的数字持适当怀疑态度，同时认识到真正的结构性优势（廉价可再生能源、战略位置、政府支持）。", "user_notes": ""}, {"title": "八、中国相关风险评估与建议", "description": "针对中国企业的特殊风险与机遇分析，包括政策风险、外交风险及商业建议", "tier": 2, "events": [], "impact_analysis": "**外交环境：摩擦升级，短期内无解**\n\n巴拉圭与中国之间的外交僵局在本时期进一步加剧。巴拉圭于7月1日提出的\"不承认即贸易\"方案遭到北京方面明确拒绝，《环球时报》将巴拉圭的立场定性为\"外交机会主义\"。中国驻圣保罗总领馆7月中旬发表声明，驳斥巴拉圭关于网络活动的指控，这为两国关系增添了新的紧张因素。对中国企业而言，核心制约因素依然未变：缺乏外交关系意味着没有双边投资协定保护、没有优惠贸易准入，且高调投资项目可能面临政治阻力。\n\n**然而，窗口并未完全关闭。** 巴拉圭的出口导向型行业（尤其是农业）日益呼吁进入中国市场。南方共同市场推动贸易伙伴多元化——包括与日本、阿联酋和越南的谈判——反映了更广泛的区域再平衡趋势，这可能间接惠及中国的商业利益。拥有强大本地合作伙伴关系且专注于非敏感领域（基础设施、可再生能源设备、电动汽车供应链）的中国企业，仍可利用巴拉圭开放的投资体制和来料加工激励政策开展业务。\n\n**🔴 高风险因素：**\n- 直接参与政府采购合同面临政治审查风险\n- 电信设备（华为、中兴）在第二次频谱拍卖中，因国家电信委员会的可信供应商要求，实际上仍被排除在5G部署之外\n- 高调绿地投资项目可能引发台北和华盛顿的外交关注\n- 缺乏双边投资协定保护意味着争端解决只能依赖合同条款和巴拉圭法院\n\n**🟡 中等风险/监测事项：**\n- 国会7月16日要求提交技术投资报告，可能导致针对特定行业的外国投资审查机制\n- 关键矿产战略（锂、钛、稀土）既是潜在机遇，也是敏感领域，中国参与将引发地缘政治关注\n- 伊泰普水电站附件C重新谈判结果（2026年11月后）将影响数据中心投资的长期电价\n\n**🟢 机遇：**\n- 光纤和宽带基础设施设备供应（不受5G无线接入网相同的供应商限制）\n- 根据第6034号法令，为巴拉圭非水电可再生能源发展提供设备（太阳能板、风力涡轮机、电池储能）\n- 电动汽车及电动出行供应链（工商部生物柴油强制令表明对能源转型持开放态度）\n- 数据中心建设和冷却基础设施（土建工程、电气系统）——政治敏感性低于人工智能计算层\n- 农业技术和机械（巴拉圭大豆产量创纪录凸显农业技术需求）\n\n**战略建议：**\n\n【立即行动】\n- 避免直接竞标政府采购的电信或关键基础设施项目；优先考虑企业对企业及私营部门机会\n- 监测第二次5G频谱拍卖结果及Tigo、Personal运营商的供应商选择流程——这将明确可信供应商框架是否可能演变\n- 梳理巴拉圭光纤宽带扩张计划，作为近期设备供应机会\n\n【短期（1-3个月）】\n- 探索与现有运营商（Tigo、Personal、Claro）的合作模式，开展设备供应、托管服务或基础设施共享——运营合作面临的政治障碍少于直接市场进入\n- 评估根据第6034号法令参与巴拉圭非水电可再生能源供应链（太阳能、储能）的可能性\n- 跟踪国会技术投资报告结果（7月16日要求后数周内提交），以获取监管变化的早期信号\n\n【中期（3-12个月）】\n- 为台湾与巴拉圭外交关系可能的变化做好准备——任何转变都将迅速改变中国企业的经营环境\n- 评估来料加工制度下的制造机会（增值税1%），为巴西和南锥体市场生产设备组装或零部件\n- 为伊泰普水电站附件C重新谈判结果做好准备：如果巴拉圭获得对巴西更高的售电价格，国内电价结构可能更有利于工业用户", "user_notes": ""}]}, "en": {"topic": "Paraguay Briefing", "time_span": "July 11 – July 18, 2026", "tiers": [{"name": "Part I: Key News & Developments", "description": "Macro economy, politics, social security, international relations, industry, and key client movements in Paraguay"}, {"name": "Part II: Analysis & Recommendations", "description": "Enterprise impact assessment and China-specific strategic recommendations"}], "sections": [{"title": "I. Macroeconomic Developments", "description": "GDP growth, inflation, exchange rate, monetary policy, fiscal position, key industry performance", "tier": 1, "events": [{"title": "BCP raises 2026 GDP growth forecast to 4.5%, lowers inflation projection to 3.3% (2026-07-15)", "date": "2026-07-15", "source_url": "https://www.infobae.com/america/agencias/2026/07/15/el-banco-central-eleva-a-45-la-proyeccion-de-crecimiento-del-pib-de-paraguay-este-ano/", "source_name": "Infobae / BCP", "summary": "The Central Bank of Paraguay (BCP) released its July Monetary Policy Report (IPoM), upgrading the 2026 GDP growth forecast from 4.2% to 4.5%, driven by record soybean harvest, stronger manufacturing (oils & chemicals), and dynamic services. Sectoral revisions: agriculture 4.7% (from 3.2%), manufacturing 4.6% (from 4.1%), electricity & water 7.4% (from 5.7%). Livestock was cut to 0.1% due to herd retention. The BCP simultaneously lowered its end-2026 inflation forecast from 3.5% to 3.3%, with core inflation (IPCSAE) revised down from 3.1% to 2.8%. June YoY inflation stood at just 2.09%. The EVE survey of market agents, however, maintained more conservative projections: 4.2% GDP growth and 3.5% inflation.", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "Moody's affirms Paraguay's Baa3 investment grade for third consecutive year, outlook stable (2026-07-17)", "date": "2026-07-17", "source_url": "https://www.ultimahora.com/moodys-mantiene-grado-de-inversion-a-paraguay-por-tercer-ano-consecutivo", "source_name": "Última Hora / Moody's", "summary": "Moody's Ratings affirmed Paraguay's sovereign credit rating at Baa3 with a stable outlook for the third consecutive year since the initial upgrade in July 2024. Paraguay now holds double investment grade (Moody's Baa3 and S&P BBB-), with Fitch at BB+ (one notch below). Moody's highlighted Paraguay's robust economic growth, low and stable public debt (~41% of GDP), and credible monetary policy. Key challenges cited include limited government revenue base (14% of GDP tax pressure), high proportion of foreign-currency debt exposing the country to FX volatility, and structural dependence on agriculture and hydroelectricity. FDI reached a record USD 1,180 million in 2025 per ECLAC data.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/bd9a7e7/2147483647/strip/true/crop/1422x800+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Ff0%2Fcf%2Fa8c29f6842f4913888daf5582991%2Fvista-de-asuncion.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Market agents cut exchange rate forecasts: end-2026 revised down to PYG 6,300/USD (2026-07-17)", "date": "2026-07-17", "source_url": "https://www.lanacion.com.py/negocios/2026/07/17/los-agentes-economicos-rebajan-sus-previsiones-para-el-tipo-de-cambio/", "source_name": "La Nación / BCP-EVE", "summary": "The BCP's July EVE survey shows market agents revised down exchange rate projections across all horizons: July 2026 at PYG 6,100 (from 6,200), August at 6,150, end-2026 at 6,300 (from 6,393), and end-2027 at 6,500. The BCP official rate on July 17 stood at PYG 6,060.78 per USD. The guaraní has appreciated ~8.5% YTD against the dollar, driven by robust agro-export inflows, ample financial system liquidity, and global dollar weakness. The BCP held its policy rate at 5.50% for the fourth consecutive month, with the next meeting scheduled for July 23. The real ex-ante rate of 2.0% remains within the neutral range (1.3%–2.6%). Private-sector credit grew 15.3% YoY and deposits 18.5% YoY as of May 2026.", "image_url": "https://www.lanacion.com.py/resizer/v2/4Q2AWHLAZJBELARN5A2R42HWEE.jpeg?auth=7062fce9b62067801f643d7bc74443c67b9cf47c82a8a1b566f6e1543796ec58&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Net international reserves at USD 11,329M as of July 10, down from USD 11,505M on July 3 (2026-07-10)", "date": "2026-07-10", "source_url": "https://www.bcp.gov.py/", "source_name": "BCP", "summary": "Paraguay's net international reserves (RIN) stood at USD 11,329.01 million as of July 10, 2026, according to preliminary BCP data. This represents a decrease of USD 175.8 million from USD 11,504.83 million on July 3. The decline was primarily driven by a reduction in 'Other reserve assets' from USD 9,891.9M to USD 9,726.6M, partially offset by gold holdings at USD 1,087.1M and SDR holdings at USD 451.7M. Year-to-date reserves have shown strong accumulation from USD 10,961M in January to a peak of USD 11,720M in March, followed by gradual moderation. The reserve position remains robust, covering approximately 8 months of imports and providing a strong external buffer.", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "DNIT tax revenue grew only 2.1% in H1 2026 vs. 9% budgeted target; President Peña orders intensified H2 collection (2026-07-11)", "date": "2026-07-11", "source_url": "https://www.ultimahora.com/el-fmi-pidio-cuentas-completas", "source_name": "Última Hora / MEF", "summary": "Paraguay's tax authority DNIT reported H1 2026 revenue growth of only 2.1%, significantly below the 9% target budgeted for the full year. President Santiago Peña ordered intensified collection efforts for H2 to close the gap. The IMF's Article IV consultation (June 29) had already warned that the fiscal deficit will exceed the 1.5% GDP target due to regularization of accumulated domestic arrears, including USD 220M to construction firms and approximately USD 1B to the pharmaceutical sector. The IMF projects convergence to the 1.5% deficit target only by 2028 and called for full transparency in public accounts. Public spending grew 11.7% cumulatively in H1 2026.", "image_url": null, "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "II. Political & Policy Developments", "description": "Major legislation, policy adjustments, foreign investment regulation, tax reform, investment incentives", "tier": 1, "events": [{"title": "Congress requests reports on tech investment incentives and critical minerals development strategy (2026-07-16)", "date": "2026-07-16", "source_url": "https://www.diputados.gov.py/noticias/noticias/2434", "source_name": "Cámara de Diputados", "summary": "The Chamber of Deputies approved two resolution projects requesting the Executive Branch to report on: (1) MITIC's plan for incentives, infrastructure feasibility, investment mapping, and roadmap to attract high-energy-demand and technology-based companies (data centers, cloud computing, AI), leveraging Paraguay's clean hydroelectric energy; and (2) the Vice-Ministry of Mines and Energy's information on concessions, geological map updates, strategic investment plan, and legislative reforms for the development of lithium, titanium, uranium, and other strategic minerals, including updating the Mining Code (Law 3180/07) on tax incentives, royalties, and exploitation timelines.", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "President Peña rules out new energy decrees, delegates tariff decisions to ANDE during Aña Cuá visit (2026-07-17)", "date": "2026-07-17", "source_url": "https://www.lapoliticaonline.com/paraguay/energia-py/pena-apura-el-proyecto-ana-cua-para-aumentar-la-generacion-de-energia-en-plena-cruzada-del-gobierno-por-la-ia-7440/", "source_name": "La Política Online", "summary": "During a site visit to the Aña Cuá expansion project (Yacyretá, 76% completion), President Santiago Peña stated the Executive will not issue new energy decrees for energy-intensive industries, clarifying that tariff decisions fall within ANDE's legal purview under its 1960s-era framework law. Peña emphasized the government's focus on generation capacity rather than consumption subsidies, in line with Paraguay's strategy to position itself as a destination for AI data centers and high-energy-demand industries. The Aña Cuá expansion will add 270 MW (10% increase to Yacyretá's output), with the first turbine operational in 2028. Peña also noted that Itaipú Annex C renegotiation is stalled pending Brazil's November 2026 elections.", "image_url": "https://www.lapoliticaonline.com/files/image/293/293643/6a5a8a6f45af8_1200_630!.jpg?s=f3b8fe7891896c2fc07b657f791c45cc&d=1784257200", "is_gov_source": false, "is_authoritative": true}, {"title": "IPS emergency: Senate evaluates USD 304M sovereign bond issuance to rescue social security system (2026-07-17)", "date": "2026-07-17", "source_url": "https://elnacional.com.py/politica/ips-recibiria-inyeccion-mas-usd-300-millones-n109098", "source_name": "El Nacional", "summary": "The Senate is evaluating modifications to the IPS (Social Security Institute) emergency bill, already approved by the Chamber of Deputies in May 2026. Proposed measures include issuing sovereign bonds of up to USD 304 million and securing multilateral loans to rescue the pension and healthcare system. The IPS faces a 40% medication shortage in Q1 2026 and deteriorating infrastructure. The emergency declaration reflects growing fiscal pressure from social security obligations, which Moody's has flagged as a medium-term risk to Paraguay's fiscal consolidation path.", "image_url": "https://statics.elnacional.com.py/2026/07/6a586c8be398f.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "MIC raises mandatory biodiesel blend to 8-10% in diesel, targeting USD 300M annual import savings (2026-07-17)", "date": "2026-07-17", "source_url": "https://www.lapoliticaonline.com/paraguay/energia-py/pena-apura-el-proyecto-ana-cua-para-aumentar-la-generacion-de-energia-en-plena-cruzada-del-gobierno-por-la-ia-7440/", "source_name": "MIC / La Política Online", "summary": "The Ministry of Industry and Commerce (MIC) issued Resolution No. 472/2026 raising the mandatory biodiesel blend in regular diesel to between 8% and 10%, up from previous levels. The measure aims to reduce dependence on diesel imports and could generate annual foreign currency savings of up to USD 300 million. This aligns with the government's broader energy independence strategy, complementing the push for renewable electricity generation and the promotion of electric mobility.", "image_url": "https://www.lapoliticaonline.com/files/image/293/293643/6a5a8a6f45af8_1200_630!.jpg?s=f3b8fe7891896c2fc07b657f791c45cc&d=1784257200", "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "III. Social & Labor Developments", "description": "Labor market, social stability, public security, employment data", "tier": 1, "events": [{"title": "New minimum wage takes effect July 1: Gs. 3,044,000/month, a 5% increase (2026-07-01)", "date": "2026-07-01", "source_url": "https://www.ultimahora.com/expo-empleo-atrajo-2-000-personas-para-1-410-cupos", "source_name": "MTESS / Última Hora", "summary": "The new legal minimum wage for Paraguay's private sector took effect on July 1, 2026, under Decree No. 6225/2026, with a 5% increase based on CONASAM recommendations and the year-on-year CPI variation. The new monthly minimum is Gs. 3,044,000 (approximately USD 502 at the current exchange rate), with a daily minimum of Gs. 117,077. The MTESS was authorized to regulate and publish specific minimum wages for particular activities and scaled occupations.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/4e4284c/2147483647/strip/true/crop/1171x659+0+55/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F21%2Ff5%2F8fc4d14a4cc38cda46fcdc30c030%2Fuheco20260717-012a-ph01-5337.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "Expo Empleo 2026 attracts over 2,000 job seekers for 1,410 positions across 40 companies (2026-07-17)", "date": "2026-07-17", "source_url": "https://www.ultimahora.com/expo-empleo-atrajo-2-000-personas-para-1-410-cupos", "source_name": "Última Hora / MTESS", "summary": "The Expo Empleo ARP 2026, organized by MTESS in partnership with the Rural Association of Paraguay (ARP), attracted over 2,000 registrants for 1,410 job openings across 40 companies in sectors including pharmaceuticals, security, cleaning, retail, and industry. Over 9,000 online applications were received via the EmpleaPy platform. Salaries offered ranged from the minimum Gs. 3,044,000 to Gs. 6,500,000 depending on position and sector. A cooperation agreement was signed between MTESS, Sinafocal, and ARP to strengthen employability through training and labor competency certification.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/4e4284c/2147483647/strip/true/crop/1171x659+0+55/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F21%2Ff5%2F8fc4d14a4cc38cda46fcdc30c030%2Fuheco20260717-012a-ph01-5337.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "Doctors announce nationwide strike for August; government pledges to protect critical services (2026-07-09)", "date": "2026-07-09", "source_url": "https://www.hoy.com.py/nacionales/2026/07/09/medicos-anuncian-huelga-en-agosto-salud-blindara-servicios-criticos", "source_name": "Hoy / Ministerio de Salud", "summary": "Medical professionals have announced a nationwide strike scheduled for August 2026, demanding improved working conditions, salary increases, and resolution of the IPS medication shortage. The Ministry of Health stated it will implement contingency plans to protect critical services during the strike. This labor action compounds existing pressures on Paraguay's healthcare system, which is already strained by the IPS emergency (40% medication deficit) and infrastructure deterioration.", "image_url": "https://www.lanacion.com.py/resizer/v2/PDWKSZCPUNDXLDDT5XCG5VAL6A.jpg?auth=1512391132b72a2e61d7d035edccfab4bccdb1a3eee03a245941350a70e489df&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "IV. International Relations & Diplomacy", "description": "Paraguay's relations with major powers, Mercosur dynamics, cross-strait relations", "tier": 1, "events": [{"title": "Paraguay signals openness to China trade without cutting Taiwan ties; Beijing rejects conditional approach (2026-07-01)", "date": "2026-07-01", "source_url": "https://www.bssnews.net/business/401489", "source_name": "BSS News / Global Times", "summary": "At the Mercosur Summit in Luque, Foreign Minister Rubén Ramírez stated Paraguay is open to trade with China provided it is not required to sever diplomatic ties with Taiwan, declaring: 'If those are the conditions, we have no restrictions.' Beijing's Foreign Ministry spokesperson Guo Jiakun immediately rejected this stance, urging Paraguay to 'stand on the right side of history' and adhere to the One China Principle. The Global Times (July 12) labeled the Paraguayan position as 'diplomatic opportunism,' stating the One China Principle is a 'non-negotiable red line.' Paraguay remains South America's only Taiwan ally and the sole Mercosur member without China relations. In parallel, Taiwan's Ambassador Ivan Lee inaugurated the Taiwan Pavilion at Expo Paraguay ARP 2026 on July 17, highlighting ongoing bilateral cooperation.", "image_url": "https://www.bssnews.net/assets/news_photos/2026/07/01/image-401489-1782879776.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Mercosur Summit: Paraguay demands equal 25% distribution of EU meat quota; Uruguay assumes rotating presidency (2026-07-01)", "date": "2026-07-01", "source_url": "https://rurales.elpais.com.uy/region/paraguay-mantiene-firme-su-postura-de-dividir-la-cuota-carnica-con-la-ue-en-partes-iguales", "source_name": "El País Uruguay / Mercosur", "summary": "At the 68th Mercosur Summit in Asunción, President Santiago Peña firmly demanded an equal 25% distribution of EU tariff-rate quotas (particularly the 99,000-ton beef quota), calling it a 'matter of justice, not caprice,' noting that Paraguay as a landlocked country faces higher logistics costs that the current system fails to address. The dispute over sugar, beef, rice, and honey quotas remained unresolved. The summit marked the transfer of the rotating presidency from Paraguay to Uruguay and the bloc's 35th anniversary. Argentine President Javier Milei did not attend, sending his foreign minister instead. The EU-Mercosur FTA entered provisional application on May 1, 2026, but still requires ratification by the European Parliament and Mercosur legislatures. Germany acknowledged on July 1 that issues remain before EU ratification.", "image_url": "https://imgs.elpais.com.uy/dims4/default/4996b07/2147483647/strip/true/crop/566x275+0+23/resize/1440x700!/quality/90/?url=https%3A%2F%2Fel-pais-uruguay-production-web.s3.us-east-1.amazonaws.com%2Fbrightspot%2F98%2F5d%2F6e84797647a2ae028f2d131f404b%2Fganaderia-paraguay.JPG", "is_gov_source": false, "is_authoritative": true}, {"title": "Mercosur launches trade negotiations with Japan, advances talks with UAE, Canada, and Vietnam (2026-07-01)", "date": "2026-07-01", "source_url": "https://www.tribuneindia.com/news/world/mercosur-leaders-defend-unity-amid-global-tensions-launch-new-trade-talks/", "source_name": "Tribune India / Mercosur", "summary": "During the Asunción summit, Mercosur leaders formally launched an economic partnership agreement negotiation with Japan (bilateral trade of USD 13.7 billion in 2025) and confirmed intentions to conclude FTAs with the UAE and Canada, with Vietnam's first round scheduled for H2 2026 in Buenos Aires. India trade preference deepening and EFTA implementation were also prioritized. The EU-Mercosur deal was explicitly framed as a bet on multilateralism against rising protectionism, particularly in the context of potential Trump-era tariffs. Spain's Secretary of State for Trade highlighted in Asunción on July 15 that the EU-Mercosur agreement opens a 'new stage for trade and investment,' identifying opportunities for Paraguay in reforestation, industrialization, and food production.", "image_url": "https://www.tribuneindia.com/sortd-service/imaginary/v22-01/jpg/large/high?url=dGhldHJpYnVuZS1zb3J0ZC1wcm8tcHJvZC1zb3J0ZC9tZWRpYTg2ZGY3OGIwLTc2MTEtMTFmMS1hZmFlLTJkNzNlMTMwYzExYi5qcGc=", "is_gov_source": false, "is_authoritative": true}, {"title": "Taiwan-Paraguay 'Yguazú Digital' AI data center project advances with USD 200M Taiwanese financing (2026-07-06)", "date": "2026-07-06", "source_url": "https://nearshoreamericas.com/taiwan-backs-paraguays-ai-data-center-push/", "source_name": "Nearshore Americas / European Values Center", "summary": "The Taiwan-Paraguay 'Yguazú Digital' project, a 50-50 bilateral alliance to develop one of the world's largest AI data centers, is advancing with USD 200 million in Taiwanese financing. The center will start at 10 MW and scale to 1 GW (1,000 MW), with operations expected by end-2027. It is reportedly the world's first bilateral government plan to build AI computing infrastructure. The project is seen as a strategic deepening of Taiwan-Paraguay ties amid Beijing's diplomatic pressure on Asunción. The initiative also involves Paraguay's Taiwan-backed Parque Tecnológico Itaipú (PTI-PY) and is expected to catalyze broader investments in AI, cloud computing, and digital infrastructure.", "image_url": "https://nearshoreamericas.com/wp-content/uploads/2026/07/Paraguay.jpg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "V. Industry Focus: Telecom, Digital Energy & AI", "description": "5G spectrum and commercial rollout, fiber infrastructure, digital energy investment, AI data centers, industry policy", "tier": 1, "events": [{"title": "Tigo and Personal bid in Paraguay's second 5G spectrum auction, committing USD 40M+ in infrastructure (2026-07-18)", "date": "2026-07-18", "source_url": "https://www.bnamericas.com/en/news/tigo-personal-bid-for-5g-spectrum-in-paraguay-auction", "source_name": "BNamericas / CONATEL", "summary": "Tigo (Millicom) and Personal (Núcleo) submitted bids in CONATEL's second 5G spectrum auction (Licitación No. 01/2026), offering frequencies in the 2.3 GHz and 3.5 GHz bands. Both operators had abstained from the first 2025 auction over restrictions that effectively excluded Chinese vendors (Huawei, ZTE). The new auction requires a minimum USD 40 million investment in secure network infrastructure with trusted-vendor equipment compatible with 5G NR Release 15 or higher. This marks a major competitive shift: Paraguay's two largest mobile operators (Tigo: 3.16M users, Personal: 1.66M users) are now set to join Claro (947K users, 5G launched Dec 2025) in the 5G race. The auction also offers spectrum Claro did not acquire, including the 2.3 GHz band.", "image_url": "https://cdnimg.bnamericas.com/FvjMDYAwWcUqnPyNWfhcfmpgpqPbViwKPGHRMRvncgEvpMPdLlMpFHTUrpPPeWyB.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo, Personal"}, {"title": "HIVE Digital Technologies expands Paraguay operations: 100MW substation near completion, Tier III data center planned (2026-07-18)", "date": "2026-07-18", "source_url": "https://www.nasdaq.com/press-release/hive-digital-technologies-expands-paraguay-launching-one-first-purpose-built-ai-buzz", "source_name": "Nasdaq / HIVE Digital Technologies", "summary": "HIVE Digital Technologies is accelerating its Paraguay expansion: a 100 MW substation in Yguazú has civil works completed with energization expected by September 2026, and construction of a new Tier III data center will begin in autumn 2026 with service readiness in H2 2027. HIVE currently operates approximately 300 MW in Tier I data centers in Paraguay and launched the BUZZ AI Cloud platform in Asunción (January 2026) targeting academic, healthcare, and enterprise clients. Paraguay's electricity costs — up to 2.8x cheaper than Brazil — and 100% renewable hydro matrix are key competitive advantages. The company's total Paraguay footprint positions it among the country's largest digital infrastructure investors.", "image_url": "https://www.nasdaq.com/sites/acquia.prod/files/2024/04/05/Nasdaq%20default%20share%20image.jpg?703664432", "is_gov_source": false, "is_authoritative": true, "client_tag": "HIVE Digital"}, {"title": "Nubicom 5G deployment under investigation for non-compliance with USD 200M investment commitment (2026-07-18)", "date": "2026-07-18", "source_url": "https://www.bnamericas.com/en/news/tigo-personal-bid-for-5g-spectrum-in-paraguay-auction", "source_name": "BNamericas / CONATEL", "summary": "Nubicom, the Argentine internet provider that won 200 MHz of 3.5 GHz spectrum in Paraguay's first 5G auction (August 2025) with a USD 200 million investment pledge, is under CONATEL investigation for failing to report any deployment progress. The company was required to establish a local subsidiary within six weeks and begin infrastructure deployment within six months, with commercial services expected by March-April 2026. Nubicom has no prior mobile network infrastructure in Argentina or Paraguay, making the USD 200M commitment particularly ambitious. The non-compliance raises questions about CONATEL's spectrum allocation oversight and may lead to spectrum revocation, potentially reopening the band to competing operators.", "image_url": "https://cdnimg.bnamericas.com/FvjMDYAwWcUqnPyNWfhcfmpgpqPbViwKPGHRMRvncgEvpMPdLlMpFHTUrpPPeWyB.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom"}, {"title": "Aña Cuá expansion at 76% completion; will add 270 MW to Paraguay's grid, first turbine operational by 2028 (2026-07-17)", "date": "2026-07-17", "source_url": "https://www.lapoliticaonline.com/paraguay/energia-py/pena-apura-el-proyecto-ana-cua-para-aumentar-la-generacion-de-energia-en-plena-cruzada-del-gobierno-por-la-ia-7440/", "source_name": "La Política Online / Yacyretá", "summary": "The Aña Cuá expansion of the Yacyretá hydroelectric dam reached 76% physical completion as of President Peña's July 17 site visit. The project will add 270 MW of generation capacity (approximately 10% of Yacyretá's current output), with the first of three turbines scheduled to begin operations in 2028. The expansion is central to Paraguay's strategy of positioning itself as a clean energy hub for AI data centers and energy-intensive industries. Combined with Itaipú's existing capacity, the additional generation reinforces Paraguay's status as the world's largest per-capita electricity exporter, with the highest share of renewable electricity in South America.", "image_url": "https://www.lapoliticaonline.com/files/image/293/293643/6a5a8a6f45af8_1200_630!.jpg?s=f3b8fe7891896c2fc07b657f791c45cc&d=1784257200", "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay's fiber broadband market projected to grow at 5.7% CAGR to USD 289M by 2029; Tigo and Personal lead expansion (2026-03-12)", "date": "2026-03-12", "source_url": "https://www.globenewswire.com/fr/news-release/2026/03/12/3254431/28124/en/Paraguay-Telecom-Operators-Intelligence-Report-2026-Featuring-Tigo-Claro-Personal-COPACO-and-VOX.html", "source_name": "GlobeNewsWire / 6W Research", "summary": "Paraguay's fixed broadband services market is projected to grow from USD 219.3 million in 2024 to USD 289.1 million by 2029 (5.7% CAGR), driven by private investment in fiber-to-the-premises (FTTP) networks, national broadband targets, and expansion into underserved rural areas. Tigo (3.16M mobile internet users) and Personal (1.66M) are the primary operators driving fiber expansion, alongside COPACO (state-owned) and VOX. Despite 68% internet penetration, significant urban-rural connectivity gaps persist, presenting ongoing infrastructure investment opportunities. The mobile data segment is projected to reach USD 532.9 million by 2029 (3.9% CAGR from USD 440.6M in 2024).", "image_url": "https://ml.globenewswire.com/Resource/Download/908fb457-7f8e-4a08-9081-5565e3dfb3d7", "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo, Personal"}], "impact_analysis": "", "user_notes": ""}, {"title": "VI. Key Client Movements", "description": "Tracking strategic repositioning, investment plans, network expansion, and technology choices of Paraguay's major telecom operators", "tier": 1, "events": [{"title": "Tigo (Millicom): Enters Paraguay 5G race with spectrum auction bid; market leader with 3.16M mobile users (2026-07-18)", "date": "2026-07-18", "source_url": "https://www.bnamericas.com/en/news/tigo-personal-bid-for-5g-spectrum-in-paraguay-auction", "source_name": "BNamericas / Millicom", "summary": "Tigo (Millicom) submitted a bid in Paraguay's second 5G spectrum auction, committing at least USD 40 million in secure network infrastructure. As the market leader with 3.16 million mobile internet users (+7% YoY) and the largest fiber network, Tigo's 5G entry significantly reshapes the competitive landscape. Tigo had previously abstained from the first auction over vendor restrictions excluding Huawei and ZTE. The operator is simultaneously expanding its fiber optic network to underserved rural areas and faces the challenge of defending market share against Claro's first-mover 5G advantage (launched Dec 2025). Millicom's broader Latin American strategy remains focused on connectivity infrastructure with investors watching long-term growth.", "image_url": "https://cdnimg.bnamericas.com/FvjMDYAwWcUqnPyNWfhcfmpgpqPbViwKPGHRMRvncgEvpMPdLlMpFHTUrpPPeWyB.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo"}, {"title": "Personal (Núcleo): Bids for 5G spectrum while accelerating fiber expansion; 1.66M mobile users (2026-07-18)", "date": "2026-07-18", "source_url": "https://www.bnamericas.com/en/news/tigo-personal-bid-for-5g-spectrum-in-paraguay-auction", "source_name": "BNamericas / Núcleo", "summary": "Personal (Núcleo), Paraguay's second-largest mobile operator with 1.66 million mobile internet users, submitted a bid alongside Tigo in the second 5G auction. Personal is simultaneously accelerating fiber optic network expansion to underserved areas, positioning itself for both mobile 5G and fixed broadband growth. The operator has been actively participating in the FTTP market, with GPON and EPON deployments aimed at closing the urban-rural connectivity gap. Personal's dual play (5G mobile + fiber broadband) positions it to capture growth across both segments, with the fixed broadband market projected to reach USD 289.1M by 2029.", "image_url": "https://cdnimg.bnamericas.com/FvjMDYAwWcUqnPyNWfhcfmpgpqPbViwKPGHRMRvncgEvpMPdLlMpFHTUrpPPeWyB.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal"}, {"title": "Claro (América Móvil): 5G network operational since Dec 2025 with USD 35M initial investment; sustained expansion planned for 2026 (2026-03-12)", "date": "2026-03-12", "source_url": "https://www.bnamericas.com/en/news/paraguay-greenlights-claro-and-nubicom-to-ignite-5g-race", "source_name": "BNamericas / Claro Paraguay", "summary": "Claro Paraguay, the first operator to launch commercial 5G services in the country (December 2025), continues its network expansion with an initial USD 35 million investment. Coverage spans Gran Asunción, Ciudad del Este, Encarnación, Coronel Oviedo, and Pedro Juan Caballero. The operator holds 200 MHz in the 3.5 GHz band (acquired for USD 2M) and partnered with Nokia for 5G radio and Massive MIMO equipment. However, Claro remains the third-largest operator with only 947,000 mobile internet users, and faces intensifying competition as Tigo and Personal now enter the 5G market through the second auction. Claro's general manager Alfredo Alcaraz stated 'sustained expansion to cover more of the national territory' is planned through 2026.", "image_url": "https://cdnimg.bnamericas.com/POjyKcsMosNhPZELKycnexVTCIJVYkuGWGwnoaKLyxfeXJXJIBUyjNZapDzARxCo.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Claro"}, {"title": "Nubicom: USD 200M 5G investment pledge under investigation for non-compliance; no deployment progress reported (2026-07-18)", "date": "2026-07-18", "source_url": "https://www.bnamericas.com/en/news/tigo-personal-bid-for-5g-spectrum-in-paraguay-auction", "source_name": "BNamericas / CONATEL", "summary": "Nubicom, the Argentine fixed-wireless provider that won 200 MHz of 3.5 GHz spectrum in Paraguay's first 5G auction with an ambitious USD 200 million deployment pledge, faces a CONATEL investigation for failing to report any infrastructure deployment progress. The company was required to establish a local subsidiary (within six weeks) and begin deployment (within six months), with commercial services expected by March-April 2026. Nubicom has no prior mobile network experience, and its failure to execute raises significant counterparty risk. CONATEL may revoke the spectrum allocation, potentially freeing the 3.3-3.5 GHz band for reallocation to Tigo or Personal, who are bidding in the second auction. The situation underscores the execution risks associated with new-entrant operators in capital-intensive 5G deployments.", "image_url": "https://cdnimg.bnamericas.com/FvjMDYAwWcUqnPyNWfhcfmpgpqPbViwKPGHRMRvncgEvpMPdLlMpFHTUrpPPeWyB.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom"}], "impact_analysis": "", "user_notes": ""}, {"title": "VII. Comprehensive Impact Analysis for Business Operations", "description": "Integrating macro, policy, industry, and client developments to assess enterprise impact across cost, market, and compliance dimensions", "tier": 2, "events": [], "impact_analysis": "**Macro Environment: Broadly Favorable with Fiscal Watchpoints**\n\nParaguay's macroeconomic fundamentals remain strong entering H2 2026. The BCP's upgraded 4.5% GDP growth forecast and Moody's Baa3 affirmation (third consecutive year) provide a stable and predictable environment for business planning. The guaraní's continued strength (PYG 6,060/USD, -8.5% YTD) benefits importers of equipment and technology — a tailwind for telecom infrastructure investment — while pressuring export-oriented sectors. Private credit expanding at 15.3% YoY signals healthy financial intermediation supporting business investment.\n\nHowever, two fiscal risks require monitoring: (1) DNIT's H1 revenue growth of only 2.1% vs. the 9% budget target suggests potential fiscal tightening in H2 that could affect public procurement and infrastructure spending; (2) the IPS emergency and potential USD 304M bond issuance add contingent liabilities to the sovereign balance sheet, though Moody's assessment suggests these are manageable within the current rating. The IMF's warning on domestic arrears (USD 1.2B+) indicates unresolved structural fiscal pressures that could eventually affect the business environment through higher taxes or reduced public investment.\n\n**Political & Regulatory: Pro-Investment with Emerging Oversight**\n\nThe policy environment remains strongly pro-investment, as evidenced by the Investor Pass program, the railway sector opening to international capital (Law 7665/2026, USD 480M Phase I with UAE's Etihad Rail), and maintained Maquila regime incentives. However, Congress's July 16 request for detailed reports on tech investment incentives and critical minerals strategy signals increasing legislative oversight of foreign investment, particularly in strategic sectors (data centers, mining, AI infrastructure). This is not yet restrictive but suggests the regulatory framework is evolving toward greater transparency requirements.\n\nPeña's stated decision to not issue new energy decrees is a mixed signal: it provides regulatory stability (no unpredictable tariff changes) but also means new market entrants cannot negotiate bespoke electricity rates, relying instead on ANDE's standard framework. For energy-intensive projects (data centers, AI computing), this may slow deal-making compared to the previous environment.\n\n**Industry Dynamics: 5G Competition Intensifying — A Window for Equipment and Infrastructure Providers**\n\nThe entry of Tigo and Personal into the 5G auction marks a structural shift in Paraguay's telecom market. After Claro's solo 5G launch in December 2025, the market is moving toward a three-operator 5G landscape, which will drive:\n- Accelerated infrastructure investment (minimum USD 40M per operator in the auction alone, plus deployment costs)\n- Increased demand for trusted-vendor 5G equipment (Nokia already supplying Claro; Tigo/Personal vendor choices TBD)\n- Fiber backhaul expansion to support 5G densification\n- Potential for network sharing or infrastructure collaboration to manage deployment costs\n\nNubicom's non-compliance investigation is a cautionary tale but also creates opportunity: if its 200 MHz of 3.5 GHz spectrum is revoked and reallocated, the competitive dynamics could shift further. Equipment vendors and infrastructure service providers should closely track the auction outcome and subsequent vendor selection processes.\n\n**Digital Infrastructure: Paraguay Positioning as Regional AI Hub — But Execution Gaps Remain**\n\nThe convergence of Taiwan's USD 200M Yguazú Digital commitment, HIVE's 100MW substation + Tier III data center, and the Aña Cuá 270MW expansion creates credible momentum for Paraguay as a regional AI/compute hub. However, key gaps persist:\n- Grid capacity limited to approximately 5 GW constrains the scale of announced projects (X8 Cloud's USD 50B/30-year vision appears aspirational)\n- No specific data center regulatory framework exists yet\n- Itaipú Annex C renegotiation (stalled until after Brazil's November 2026 elections) creates uncertainty about long-term electricity pricing\n- Human capital shortages in AI, engineering, and data center operations\n\nBusinesses in digital infrastructure should treat announced figures with appropriate skepticism while recognizing the genuine structural advantages (cheap renewable power, strategic location, government backing).", "user_notes": ""}, {"title": "VIII. China-Specific Risk Assessment & Recommendations", "description": "Special risk and opportunity analysis for Chinese enterprises, including policy risk, diplomatic risk, and business recommendations", "tier": 2, "events": [], "impact_analysis": "**Diplomatic Environment: Elevated Friction with No Near-Term Resolution**\n\nThe diplomatic standoff between Paraguay and China intensified in this period. Paraguay's July 1 proposal for trade-without-recognition was categorically rejected by Beijing, with the Global Times labeling Paraguay's position 'diplomatic opportunism.' The Chinese Consulate in São Paulo's mid-July statement rejecting Paraguay-US cyber-activity accusations added another layer of tension. For Chinese enterprises, the core constraint remains unchanged: the absence of diplomatic relations means no bilateral investment treaty (BIT) protection, no preferential trade access, and potential political headwinds for high-profile investments.\n\n**However, the window is not closed.** Paraguay's export-oriented sectors (particularly agriculture) increasingly advocate for China market access. The Mercosur's push to diversify trade partners — including negotiations with Japan, UAE, and Vietnam — reflects a broader regional rebalancing that could indirectly benefit Chinese commercial interests. Chinese enterprises with strong local partnerships and non-sensitive sector focus (infrastructure, renewable energy equipment, EV supply chain) can still operate in Paraguay, leveraging the country's open investment regime and Maquila incentives.\n\n**🔴 High-Risk Factors:**\n- Direct government procurement contracts face political vetting risk\n- Telecom equipment (Huawei, ZTE) remains effectively excluded from 5G deployment under CONATEL's trusted-vendor requirements in the second auction\n- High-profile greenfield investments may attract diplomatic scrutiny from both Taipei and Washington\n- No BIT protection means dispute resolution relies on contractual provisions and Paraguayan courts\n\n**🟡 Medium-Risk / Monitoring Items:**\n- Congress's July 16 request for tech investment reports could lead to sector-specific foreign investment review mechanisms\n- The critical minerals strategy (lithium, titanium, rare earths) represents a potential opportunity but also a sensitive sector where Chinese involvement would draw geopolitical attention\n- Itaipú Annex C renegotiation outcome (post-November 2026) will affect long-term electricity pricing for data center investments\n\n**🟢 Opportunities:**\n- Fiber optic and broadband infrastructure equipment supply (not subject to the same vendor restrictions as 5G RAN)\n- Renewable energy equipment (solar panels, wind turbines, battery storage) for Paraguay's non-hydro renewable push under Decree 6034\n- EV and electric mobility supply chain (MIC's biodiesel mandate signals openness to energy transition)\n- Data center construction and cooling infrastructure (civil works, electrical systems) — less politically sensitive than AI computing layer\n- Agricultural technology and machinery (Paraguay's record soybean harvest underscores agtech demand)\n\n**Strategic Recommendations:**\n\n【Immediate】\n- Avoid direct bidding on government-procured telecom or critical infrastructure projects; prioritize B2B and private-sector opportunities\n- Monitor the outcome of the second 5G auction and Tigo/Personal vendor selection processes — this will clarify whether the trusted-vendor framework may evolve\n- Map Paraguay's fiber broadband expansion plans as a near-term equipment supply opportunity\n\n【Short-Term (1-3 months)】\n- Explore partnership models with existing operators (Tigo, Personal, Claro) for equipment supply, managed services, or infrastructure sharing — operational partnerships face fewer political barriers than direct market entry\n- Assess participation in Paraguay's non-hydro renewable energy supply chain (solar, storage) under Decree 6034\n- Track Congressional tech investment report outcomes (due within weeks of July 16 request) for early signals of regulatory changes\n\n【Medium-Term (3-12 months)】\n- Prepare for potential Taiwan-Paraguay diplomatic evolution — any shift would rapidly transform the operating environment for Chinese enterprises\n- Evaluate Maquila-regime manufacturing opportunities (1% tax on value-added) for equipment assembly or component production serving the Brazilian and Southern Cone markets\n- Position for Itaipú Annex C renegotiation outcome: if Paraguay secures higher electricity sale prices to Brazil, the domestic tariff structure may become more favorable for industrial consumers", "user_notes": ""}]}};

  if(opts.dual){s+='<rect x="'+(mL+2)+'" y="4" width="10" height="10" fill="'+d.bc+'" rx="2" opacity="0.85"/>';s+='<text x="'+(mL+14)+'" y="13" font-size="8" fill="#475569">'+L(d.yl[0],d.yl[1])+'</text>';s+='<line x1="'+(mL+50)+'" y1="9" x2="'+(mL+64)+'" y2="9" stroke="'+d.lc+'" stroke-width="2"/>';s+='<circle cx="'+(mL+57)+'" cy="9" r="3" fill="#fff" stroke="'+d.lc+'" stroke-width="2"/>';s+='<text x="'+(mL+68)+'" y="13" font-size="8" fill="#475569">'+L(d.yr[0],d.yr[1])+'</text>';if(opts.forecastFrom!=null){s+='<rect x="'+(mL+108)+'" y="5" width="8" height="8" fill="'+d.bc+'" rx="1.5" opacity="0.4" stroke="'+d.bc+'" stroke-width="1" stroke-dasharray="2,2"/>';s+='<text x="'+(mL+119)+'" y="13" font-size="7" fill="#94A3B8">'+L('预测','F')+'</text>';}}
  s+='</svg>';return s;
}

    else{var dMap={CPI:MACRO_CPI,RIN:MACRO_RIN};var unitMap={CPI:MACRO_CPI.lu,RIN:L(MACRO_RIN.lu[0],MACRO_RIN.lu[1])};dataSection=renderMacroDataTable(dMap[type],unitMap[type]);}

function renderMacroDataTable(d,unit){
  var MONTHS_L=[['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']];
  var h='<div class="macro-data-section"><button class="macro-data-toggle" onclick="toggleDataTable(this)">'+L('查看月度源数据 ▼','View Monthly Data ▼')+'</button>';
  h+='<div class="macro-data-table-wrap" style="display:none"><table class="macro-data-table"><thead><tr><th>'+L('月份','Month')+'</th><th>2023</th><th>2024</th><th>2025</th><th>2026*</th></tr></thead><tbody>';
  for(var m=0;m<12;m++){
    h+='<tr><td>'+L(MONTHS_L[0][m],MONTHS_L[1][m])+'</td>';
    var src=d.monthly||d.line;for(var y=0;y<4;y++){var idx=y*12+m,v=src[idx];if(v!=null)h+='<td>'+(v>=100?Math.round(v):v.toFixed(1))+(unit||'')+'</td>';else h+='<td class="macro-na">—</td>';}
    h+='</tr>';
  }
  h+='</tbody></table><div style="font-size:9px;color:#94A3B8;margin-top:4px">* 2026 '+L('为1–5月数据','Jan–May YTD')+'</div></div></div>';
  return h;
}
function renderFXDailyTable(d,unit){
  var DM=[31,28,31,30,31,30,31,31,30,31,30,31],dl=d.line||[];
  var h='<div class="macro-data-section"><button class="macro-data-toggle" onclick="toggleDataTable(this)">'+L('查看每日源数据 ▼','View Daily Data ▼')+'</button>';
  h+='<div class="macro-data-table-wrap" style="display:none"><table class="macro-data-table"><thead><tr><th>'+L('日期','Date')+'</th><th>PYG/USD</th></tr></thead><tbody>';
  var dates=[],day=1,mo=0,yr=2023;
  for(var i=0;i<dl.length;i++){
    dates.push(yr+'-'+(mo<9?'0'+(mo+1):(mo+1))+'-'+(day<10?'0'+day:day));
    day++;var dim=DM[mo];if(mo===1&&yr%4===0)dim=29;
    if(day>dim){day=1;mo++;if(mo>11){mo=0;yr++;}}
  }
  for(var i=dl.length-1;i>=0;i--){
    h+='<tr><td>'+dates[i]+'</td><td>'+Math.round(dl[i])+(unit||'')+'</td></tr>';
  }
  h+='</tbody></table></div></div>';
  return h;
}
function toggleDataTable(btn){

  else{wrap.style.display='none';btn.innerHTML=btn.innerHTML.replace('隐藏','查看').replace('Hide','View').replace(' ▲',' ▼');}
}

function renderAll(){

  var sections=d.sections||[],tier1=[],tier2=[];

  for(var i=0;i<tier1.length;i++)total+=(tier1[i].events||[]).length;

  var pills='<div class="stats-row-total"><div class="stat-pill pill-total" onclick="scrollToSec(null)"><span class="pill-label">'+L('全部事件','All Events')+'</span><span class="pill-count">'+total+'</span></div></div>';
  for(var row=0;row<2;row++){
    pills+='<div class="stats-row-sections">';

      var idx=row*3+col;if(idx>=tier1.length)break;
      var sec=tier1[idx],c=PCOL[idx],cnt=(sec.events||[]).length;
      pills+='<div class="stat-pill" style="background:'+c.bg+';color:'+c.text+';" onclick="scrollToSec('+idx+')"><span class="pill-dot" style="background:'+c.dot+'"></span><span class="pill-label">'+stripNum(sec.title)+'</span><span class="pill-count">'+cnt+'</span></div>';
    }

  }

function renderSection(sec,idx){
  var events=sec.events||[],isT2=sec.tier===2;
  var g=GRAD[idx%8],icon=ICONS[idx%8];
  var body='';
  if(isT2||events.length===0){
    if(sec.impact_analysis)body='<div class="analysis-body">'+fmt(sec.impact_analysis)+'</div>';
    else if(!isT2)body='<div style="padding:4px 22px 16px;color:#94A3B8;font-size:13px;">'+L('暂无此时间段内的事件','No events in this period')+'</div>';
  }else{
    var cards='';
    for(var i=0;i<events.length;i++)cards+=renderCard(events[i],g[0],g[1],icon);

  }
  var badge=events.length>0?'<span class="badge">'+events.length+L(' 条事件',' events')+'</span>':'';
  return '<div class="section s'+(idx%8)+(isT2?' tier2':'')+'" id="sec-'+idx+'"><div class="section-header"><h2>'+esc(sec.title||'')+'</h2>'+badge+'</div>'+(sec.description?'<div class="section-desc">'+esc(sec.description)+'</div>':'')+body+'</div>';

function renderCard(evt,phFrom,phTo,icon){
  var img=evt.image_url,hasImg=img&&img.indexOf('http')===0;
  var ih='';
  if(hasImg)ih='<img src="'+esc(img)+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">';
  ih+='<div class="img-placeholder" style="background:linear-gradient(135deg,'+phFrom+','+phTo+');'+(hasImg?'display:none':'display:flex')+';font-size:32px;color:#fff;">'+icon+'</div>';

  var tags='';
  if(evt.date)tags+='<span class="event-tag date">'+esc(evt.date)+'</span>';
  if(evt.client_tag)tags+='<span class="event-tag client">'+esc(evt.client_tag)+'</span>';
  if(evt.is_gov_source)tags+='<span class="event-tag gov">'+L('政府官网','Government')+'</span>';
  else if(evt.is_authoritative)tags+='<span class="event-tag auth">'+L('权威媒体','Authoritative')+'</span>';
  if(evt.source_name)tags+='<span class="event-tag source">'+esc(evt.source_name)+'</span>';

  var link=evt.source_url?'<a class="event-link" href="'+esc(evt.source_url)+'" target="_blank" rel="noopener">'+L('查看原文 →','Read more →')+'</a>':'';
  var preview=evt.summary||'';if(!preview&&evt.title)preview=evt.title;
  return '<div class="event-card"><div class="event-img">'+ih+'</div><div class="event-body"><div class="event-meta">'+tags+'</div><div class="event-preview">'+esc(ss(preview))+'</div>'+link+'</div></div>';
}

function fmt(text){
  var h=esc(text);
  h=h.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
  h=h.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
  h=h.replace(/\n/g,'<br>');
  return h;
}

function scrollToSec(idx){
  var pills=document.querySelectorAll('.stat-pill');
  for(var i=0;i<pills.length;i++)pills[i].style.outline='';
  if(idx===null||idx===undefined){window.scrollTo({top:0,behavior:'smooth'});return;}
  var el=document.getElementById('sec-'+idx);
  if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.style.boxShadow='0 0 0 3px #3B82F6';
  setTimeout(function(){el.style.boxShadow='';},1500);
}

  }).catch(function(){st.innerHTML='<span style=\"color:#EF4444\">'+L('更新失败，请确保 Flask 服务器已启动','Failed. Make sure Flask server is running.')+'</span>';});
}
function closeUpdateModal(id){
  var m=document.getElementById(id||'updateModal');if(m)m.remove();
  var h=document.getElementById('histModal');if(h&&id!=='histModal')h.remove();
}
document.addEventListener('DOMContentLoaded',function(){
  if(window.IS_STANDALONE)document.getElementById('standaloneBanner').style.display='block';
  if(MACRO_FX.monthly&&!MACRO_FX.line)MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
  briefingData=DATA['en'];
  currentLang='en';
  renderAll();
  updateLangBtn();
  if(!window.IS_STANDALONE)fetchLiveFX();
});
function fetchLiveFX(){
  fetch('/api/macro/fx').then(function(r){if(!r.ok)return;return r.json();}).then(function(d){
    if(!d||!d.rate)return;
    var arr=MACRO_FX.monthly||MACRO_FX.line||[];
    arr[arr.length-1]=d.rate;
    window.MACRO_FX_DATE=(d.date||'').replace(/-/g,'.');
    MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
    renderAll();
  }).catch(function(){});
}
</script>
</body>
</html>
