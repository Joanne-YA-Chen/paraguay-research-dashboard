async function switchLanguage() {
  if (window.IS_STANDALONE && window.EMBEDDED_BRIEFINGS) {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    briefingData = window.EMBEDDED_BRIEFINGS[currentLang] || window.EMBEDDED_BRIEFINGS.zh;
    document.getElementById('langBtn').textContent = currentLang === 'zh' ? 'EN' : '中文'; updateUITexts();
    renderAll();
    showToast(t(currentLang === 'zh' ? 'switchedZh' : 'switchedEn'), 'success');
    return;
  }

  // Server mode: try to load the opposite language file
  const targetFile = currentLang === 'zh' ? 'briefing_en.json' : 'briefing.json';
  try {
    const resp = await fetch('/api/briefing/' + targetFile);
    if (resp.ok) {
      briefingData = await resp.json();
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      document.getElementById('langBtn').textContent = currentLang === 'zh' ? 'EN' : '中文'; updateUITexts();
      renderAll();
      showToast(t(currentLang === 'zh' ? 'switchedZh' : 'switchedEn'), 'success');
    }
  } catch (e) { console.error(e); }
}

// ====== Render ======
function renderAll() {
  if (!briefingData) return;
  const d = briefingData;

  // Header
  document.getElementById('headerSubtitle').textContent =
    `${d.topic || ''} · ${d.time_span || ''}`;

  // Stats row: total + 2 rows of 3 section pills
  const sections = d.sections || [];
  const tier1 = sections.filter(s => s.tier === 1 || !s.tier);
  const tier2 = sections.filter(s => s.tier === 2);
  const totalEvents = tier1.reduce((sum, s) => sum + (s.events || []).length, 0);

  const pillColors = [
    { bg: '#EFF6FF', dot: '#3B82F6', text: '#2563EB' },
    { bg: '#FEF2F2', dot: '#EF4444', text: '#DC2626' },
    { bg: '#ECFDF5', dot: '#10B981', text: '#059669' },
    { bg: '#F5F3FF', dot: '#8B5CF6', text: '#7C3AED' },
    { bg: '#ECFEFF', dot: '#06B6D4', text: '#0891B2' },
    { bg: '#FFFBEB', dot: '#F59E0B', text: '#D97706' },
  ];

  // Helper: strip number prefix from section title
  const stripNum = (t) => t.replace(/^[一二三四五六七八]、\s*/, '').replace(/^\d+\.\s*/, '');

  // Row 1: Total events (centered)
  let pillsHtml = `<div class="stats-row-total">
    <div class="stat-pill pill-total" onclick="scrollToSection(null)" title="查看全部事件">
      <span class="pill-label">${t('allEvents')}</span><span class="pill-count">${totalEvents}</span>
    </div>
  </div>`;

  // Row 2 + Row 3: 3 section pills each
  for (let row = 0; row < 2; row++) {
    pillsHtml += '<div class="stats-row-sections">';
    for (let col = 0; col < 3; col++) {
      const i = row * 3 + col;
      if (i >= tier1.length) break;
      const sec = tier1[i];
      const c = pillColors[i % pillColors.length];
      const cnt = (sec.events || []).length;
      const fullTitle = stripNum(sec.title);
      pillsHtml += `<div class="stat-pill" style="background:${c.bg};color:${c.text};"
        onclick="scrollToSection(${i})" title="${sec.title} · ${cnt} 条事件">
        <span class="pill-dot" style="background:${c.dot}"></span>
        <span class="pill-label">${fullTitle}</span><span class="pill-count">${cnt}</span>
      </div>`;
    }
    pillsHtml += '</div>';
  }

  document.getElementById('statsRow').innerHTML = pillsHtml;

  document.getElementById('statsRow').innerHTML = pillsHtml;

  // Content with anchor IDs
  const contentArea = document.getElementById('contentArea');

  let html = tier1.map((sec, idx) => renderSection(sec, idx)).join('');

  if (tier2.length > 0 && tier1.length > 0) {
    html += `<div class="tier-divider"><span>${t('tierDivider')}</span></div>`;
  }

  html += tier2.map((sec, idx) => renderSection(sec, tier1.length + idx)).join('');
  contentArea.innerHTML = html;
}

function renderSection(sec, colorIdx) {
  const events = sec.events || [];
  const isTier2 = sec.tier === 2;
  const colorClass = `s-color-${(colorIdx % 8) + 1}`;
  const [phFrom, phTo] = SECTION_GRADIENTS[colorIdx % 8];
  const icon = SECTION_ICONS[colorIdx % 8];

  let bodyHtml = '';
  if (isTier2 || events.length === 0) {
    const analysis = sec.impact_analysis || '';
    if (analysis) {
      bodyHtml = `<div class="analysis-body">${formatAnalysis(analysis)}</div>`;
    } else if (!isTier2) {
      bodyHtml = `<div style="padding:4px 22px 16px;color:#94A3B8;font-size:13px;">${t('noEvents')}</div>`;
    }
  } else {
    let cardsHtml = events.map((evt) => renderEventCard(evt, phFrom, phTo, icon)).join('');
    bodyHtml = `<div class="events-grid">${cardsHtml}</div>`;
  }

  return `
    <div class="section ${colorClass} ${isTier2 ? 'tier-2' : ''}" id="sec-${colorIdx}">
      <div class="section-header">
        <h2>${sec.title || ''}</h2>
        ${events.length > 0 ? `<span class="badge">${events.length}${t('eventsSuffix')}</span>` : ''}
      </div>
      ${sec.description ? `<div class="section-desc">${sec.description}</div>` : ''}
      ${bodyHtml}
    </div>`;
}

function renderEventCard(evt, phFrom, phTo, icon) {
  const imgUrl = evt.image_url || null;
  const dateStr = evt.date || '';
  const sourceName = evt.source_name || '';
  const hasValidImg = imgUrl && imgUrl.startsWith('http');

  let imgHtml = '';
  if (hasValidImg) {
    imgHtml = `<img src="${escapeHtml(imgUrl)}" alt="" loading="lazy"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
      onload="this.nextElementSibling.style.display='none';">`;
  }
  // Always include a fallback placeholder (hidden if image loads)
  const phDisplay = hasValidImg ? '' : 'display:flex';
  imgHtml += `<div class="img-placeholder" style="background:linear-gradient(135deg,${phFrom},${phTo});${phDisplay};font-size:32px;color:#fff;">${icon}</div>`;

  let tagsHtml = '';
  if (dateStr) tagsHtml += `<span class="event-tag date">${escapeHtml(dateStr)}</span>`;
  if (evt.is_gov_source) tagsHtml += `<span class="event-tag gov">${t('govSource')}</span>`;
  if (evt.is_authoritative && !evt.is_gov_source) tagsHtml += `<span class="event-tag auth">${t('authSource')}</span>`;
  if (sourceName) tagsHtml += `<span class="event-tag source">${escapeHtml(sourceName)}</span>`;

  return `
    <div class="event-card">
      <div class="event-img">
        ${imgHtml}
      </div>
      <div class="event-body">
        <div class="event-meta">${tagsHtml}</div>
        <div class="event-preview">${escapeHtml(evt.summary || evt.title || '')}</div>
        ${evt.source_url ? `<a class="event-link" href="${escapeHtml(evt.source_url)}" target="_blank" rel="noopener">${t('readMore')}</a>` : ''}
      </div>
    </div>`;
}

function formatAnalysis(text) {
  let html = escapeHtml(text);
  html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ====== Modal ======
function buildPresetGrid() {
  const presets = [
    { label: t('preset1w'), dates: dateRange(-7), span: dateRange(-7) },
    { label: t('preset2w'), dates: dateRange(-14), span: dateRange(-14) },
    { label: t('preset1m'), dates: dateRange(-30), span: dateRange(-30) },
    { label: t('preset3m'), dates: dateRange(-90), span: dateRange(-90) },
    { label: t('preset6m'), dates: dateRange(-180), span: dateRange(-180) },
    { label: t('presetYtd'), dates: ytdRange(), span: ytdRange() },
  ];

  document.getElementById('presetGrid').innerHTML = presets.map((p, i) => `
    <button class="preset-btn" data-idx="${i}" onclick="selectPreset(${i}, '${p.span}')">
      <div class="preset-label">${p.label}</div>
      <div class="preset-dates">${p.dates}</div>
    </button>`).join('');

  document.getElementById('customStart').value = toDateInput(new Date(Date.now() - 7*86400000));
  document.getElementById('customEnd').value = toDateInput(new Date());
}

function dateRange(days) {
  const end = new Date();
  const start = new Date(Date.now() - Math.abs(days) * 86400000);
  return `${start.getFullYear()}年${start.getMonth()+1}月${start.getDate()}日 — ${end.getFullYear()}年${end.getMonth()+1}月${end.getDate()}日`;
}

function ytdRange() {
  const end = new Date();
  return `${end.getFullYear()}年1月1日 — ${end.getFullYear()}年${end.getMonth()+1}月${end.getDate()}日`;
}

function toDateInput(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function selectPreset(idx, span) {
  selectedPreset = span;
  customStartDate = null;
  customEndDate = null;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('selected'));
  document.querySelector(`.preset-btn[data-idx="${idx}"]`).classList.add('selected');
}

function onCustomDate() {
  const s = document.getElementById('customStart').value;
  const e = document.getElementById('customEnd').value;
  if (s && e) {
    selectedPreset = null;
    customStartDate = s;
    customEndDate = e;
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('selected'));
  }
}

function openModal() {
  if (window.IS_STANDALONE) {
    showToast(t('offlineNoUpdate'), 'error');
    return;
  }
  document.getElementById('modalOverlay').classList.add('active');
  if (!selectedPreset && !customStartDate) selectPreset(0, dateRange(-7));
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('active');
}

function getSelectedTimeSpan() {
  if (customStartDate && customEndDate) {
    const s = new Date(customStartDate);
    const e = new Date(customEndDate);
    return `${s.getFullYear()}年${s.getMonth()+1}月${s.getDate()}日 — ${e.getFullYear()}年${e.getMonth()+1}月${e.getDate()}日`;
  }
  return selectedPreset || dateRange(-7);
}

// ====== Generate ======
async function startGenerate() {
  const timeSpan = getSelectedTimeSpan();
  const topic = document.getElementById('topicInput').value.trim() || '巴拉圭宏观环境与行业动态调研';

  document.getElementById('modalOverlay').classList.remove('active');
  document.getElementById('loadingOverlay').classList.add('active');

  const loadingMsgs = [
    { text: t('searchMacro'), sub: 'Section 1/8', delay: 500 },
    { text: t('searchPolitics'), sub: 'Section 2/8', delay: 3500 },
    { text: t('searchSocial'), sub: 'Section 3/8', delay: 6500 },
    { text: t('searchIntl'), sub: 'Section 4/8', delay: 9500 },
    { text: t('searchIndustry'), sub: 'Section 5/8', delay: 12500 },
    { text: t('searchClients'), sub: 'Section 6/8', delay: 15500 },
    { text: t('compiling'), sub: t('compilingSub'), delay: 18500 },
    { text: t('almostDone'), sub: t('almostDoneSub'), delay: 21000 },
  ];

  const loadingText = document.getElementById('loadingText');
  const loadingSub = document.getElementById('loadingSub');
  const timers = loadingMsgs.map(m =>
    setTimeout(() => { loadingText.textContent = m.text; loadingSub.textContent = m.sub; }, m.delay)
  );

  try {
    const resp = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic, time_span: timeSpan }),
    });
    timers.forEach(clearTimeout);
    if (!resp.ok) { const err = await resp.json(); throw new Error(err.error || t('generateFailed')); }
    briefingData = await resp.json();
    document.getElementById('loadingOverlay').classList.remove('active');
    updateLangButton();
    renderAll();
    showToast(t('generateSuccess'), 'success');
  } catch (e) {
    timers.forEach(clearTimeout);
    document.getElementById('loadingOverlay').classList.remove('active');
    showToast(t('generateFailed') + ': ' + e.message, 'error');
    console.error(e);
  }
}

// ====== Switch Briefing ======
async function switchBriefing() {
  if (window.IS_STANDALONE) {
    if (window.EMBEDDED_BRIEFINGS) {
      const briefings = window.EMBEDDED_BRIEFINGS;
      const list = document.getElementById('briefingList');
      list.innerHTML = Object.entries(briefings).map(([lang, b]) => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #F1F5F9;cursor:pointer;border-radius:6px;"
             onclick="currentLang='${lang}';briefingData=window.EMBEDDED_BRIEFINGS['${lang}'];closeSwitchModal();updateLangButton();renderAll();showToast(lang==='zh'?'已切换到中文':'Switched to English','success');"
             onmouseover="this.style.background='#F8FAFC'" onmouseout="this.style.background=''">
          <div>
            <div style="font-weight:600;font-size:14px;">${escapeHtml(b.topic)}</div>
            <div style="font-size:12px;color:#94A3B8;">${escapeHtml(b.time_span)} · ${sumEvents(b)} 条事件</div>
          </div>
          <span style="color:#64748B;font-size:11px;">${lang === 'zh' ? '中文版' : 'English'}</span>
        </div>`).join('');
    }
    document.getElementById('switchOverlay').classList.add('active');
    return;
  }

  document.getElementById('switchOverlay').classList.add('active');
  try {
    const resp = await fetch('/api/briefings');
    const briefings = await resp.json();
    const list = document.getElementById('briefingList');
    if (briefings.length === 0) {
      list.innerHTML = '<p style="color:#94A3B8;text-align:center;padding:20px;">' + t('noHistory') + '</p>';
      return;
    }
    list.innerHTML = briefings.map(b => `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #F1F5F9;cursor:pointer;border-radius:6px;"
           onclick="loadBriefingFile('${escapeHtml(b.filename)}')"
           onmouseover="this.style.background='#F8FAFC'" onmouseout="this.style.background=''">
        <div>
          <div style="font-weight:600;font-size:14px;">${escapeHtml(b.topic)}</div>
          <div style="font-size:12px;color:#94A3B8;">${escapeHtml(b.time_span)} · ${b.event_count} 条事件</div>
        </div>
        <span style="color:#3B82F6;font-size:12px;">查看 →</span>
      </div>`).join('');
  } catch (e) { console.error(e); }
}

function sumEvents(b) { return (b.sections||[]).reduce((a,s) => a + (s.events||[]).length, 0); }

function closeSwitchModal(e) {
  if (e && e.target !== document.getElementById('switchOverlay')) return;
  document.getElementById('switchOverlay').classList.remove('active');
}

async function loadBriefingFile(filename) {
  document.getElementById('switchOverlay').classList.remove('active');
  document.getElementById('loadingOverlay').classList.add('active');
  document.getElementById('loadingText').textContent = t('loadingBriefing');
  document.getElementById('loadingSub').textContent = filename;
  try {
    const resp = await fetch('/api/briefing/' + encodeURIComponent(filename));
    if (resp.ok) {
      briefingData = await resp.json();
      updateLangButton();
    } else {
      const err = await resp.json();
      throw new Error(err.error || t('loadFailed'));
    }
  } catch (e) { console.error(e); showToast(t('loadFailed') + ': ' + e.message, 'error'); }
  document.getElementById('loadingOverlay').classList.remove('active');
  renderAll();
}

// ====== Toast ======
function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type}`;
  setTimeout(() => { toast.className = ''; toast.textContent = ''; }, 3500);
}

// Navigate to section on pill click
function scrollToSection(idx) {
  // Clear all pill highlights
  document.querySelectorAll('.stat-pill').forEach(p => { p.style.outline = ''; });

  if (idx === null || idx === undefined) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    // Highlight total pill
    const totalPill = document.querySelector('.pill-total');
    if (totalPill) totalPill.style.outline = '2px solid #3B82F6';
    return;
  }
  const el = document.getElementById('sec-' + idx);
  if (!el) return;

  el.scrollIntoView({ behavior: 'smooth', block: 'start' });

  // Highlight the clicked pill
  document.querySelectorAll('.stat-pill').forEach(p => {
    const oc = p.getAttribute('onclick') || '';
    if (oc === 'scrollToSection(' + idx + ')') {
      p.style.outline = '2px solid #3B82F6';
      p.style.borderColor = '#3B82F6';
    }
  });

  // Brief flash on target section
  el.style.boxShadow = '0 0 0 3px #3B82F6';
  setTimeout(() => { el.style.boxShadow = ''; }, 1500);
}


function updateUITexts() {
  // Update static UI elements
  const el = document.getElementById('historyBtn');
  if (el) el.textContent = t('historyBriefing');
  // Re-render to update all dynamic content
  if (briefingData) renderAll();
}

// Close modals with Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('modalOverlay').classList.remove('active');
    document.getElementById('switchOverlay').classList.remove('active');
  }
});
</script>
