<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paraguay Briefing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#F0F4FF;color:#1E293B;line-height:1.6;min-height:100vh}
a{color:#3B82F6;text-decoration:none}a:hover{text-decoration:underline}
.header{background:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;border-bottom:3px solid #3B82F6}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;flex-shrink:0}
.header-left h1{font-size:20px;font-weight:700;color:#1E293B}
.header-left .subtitle{font-size:12px;color:#64748B;margin-top:2px}
.header-right{display:flex;gap:8px;align-items:center}
.btn-lang{background:#EEF2FF;color:#4F46E5;font-weight:700;font-size:12px;padding:8px 14px;border-radius:20px;border:none;cursor:pointer}
.btn-lang:hover{background:#E0E7FF}
.btn-primary{background:#3B82F6;color:#fff;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-primary:hover{background:#2563EB;transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.3)}
.btn-secondary{background:#F1F5F9;color:#475569;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:#E2E8F0}
.btn-sm{font-size:11px;padding:6px 12px}
.update-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:moFade .2s}
.update-modal{background:#fff;border-radius:14px;padding:24px 28px;width:440px;max-width:90vw;box-shadow:0 24px 80px rgba(0,0,0,.25);animation:moZoom .25s}
.update-modal h3{font-size:17px;font-weight:700;color:#1E293B;margin-bottom:16px}
.update-modal label{display:block;font-size:12px;font-weight:600;color:#64748B;margin-bottom:4px}
.update-modal select,.update-modal input{width:100%;padding:8px 12px;border:1px solid #CBD5E1;border-radius:8px;font-size:13px;margin-bottom:14px;color:#1E293B;background:#fff}
.update-modal .btn-row{display:flex;gap:8px;justify-content:flex-end}
.time-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.time-preset{padding:5px 12px;border-radius:14px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #CBD5E1;background:#fff;color:#64748B;transition:all .12s}
.time-preset:hover,.time-preset.active{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.history-list{max-height:300px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid #E2E8F0;border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.history-item:hover{background:#F8FAFC;border-color:#CBD5E1}
.history-item .hi-title{font-weight:600;font-size:13px;color:#1E293B}
.history-item .hi-meta{font-size:11px;color:#94A3B8}
.history-item .hi-count{font-size:11px;font-weight:600;color:#3B82F6;background:#EEF2FF;padding:2px 8px;border-radius:10px}
.loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid #CBD5E1;border-top-color:#3B82F6;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.standalone-banner{background:#FEF3C7;color:#92400E;text-align:center;padding:6px 16px;font-size:12px;border-bottom:1px solid #FDE68A;display:none}
.standalone-banner code{background:#FDE68A;padding:1px 5px;border-radius:3px;font-size:11px}

.stats-row{max-width:1400px;margin:0 auto;padding:12px 32px 16px;display:flex;flex-direction:column;gap:8px}
.stats-row-total{display:flex;justify-content:center}
.stats-row-sections{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:768px){.stats-row-sections{grid-template-columns:repeat(2,1fr)}}
.stat-pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;cursor:pointer;transition:all .2s;border:2px solid transparent;font-size:13px;font-weight:600;user-select:none;min-width:0}
.stat-pill:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.pill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pill-label{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-count{font-size:14px;font-weight:700;margin-left:auto;flex-shrink:0;background:rgba(255,255,255,.5);padding:1px 8px;border-radius:10px}
.stat-pill.pill-total{background:#1E293B;color:#fff;font-weight:700;border-radius:24px;display:inline-flex}
.stat-pill.pill-total .pill-count{background:rgba(255,255,255,.2)}

.content{max-width:1400px;margin:0 auto;padding:0 32px 60px}
.section{background:#fff;border-radius:14px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden;border-top:4px solid #3B82F6}
.section.s0{border-top-color:#3B82F6}.section.s1{border-top-color:#EF4444}.section.s2{border-top-color:#10B981}
.section.s3{border-top-color:#8B5CF6}.section.s4{border-top-color:#06B6D4}.section.s5{border-top-color:#F59E0B}
.section.s6{border-top-color:#6366F1}.section.s7{border-top-color:#EC4899}.section.tier2{background:#FAFBFC}
.section-header{padding:16px 22px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-header h2{font-size:16px;font-weight:700;color:#1E293B}
.section-header .badge{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;background:#F1F5F9;color:#64748B;white-space:nowrap}
.section-desc{padding:4px 22px 10px;font-size:12px;color:#94A3B8}
.events-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 22px 18px}
@media(max-width:860px){.events-grid{grid-template-columns:1fr}.event-card{flex-direction:column}.event-card .event-img{width:100%!important;min-height:120px;max-height:180px}}
.event-card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;transition:all .2s;display:flex}
.event-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-1px);border-color:#CBD5E1}
.event-card .event-img{width:160px;min-height:140px;flex-shrink:0;position:relative;overflow:hidden}
.event-card .event-img img{width:100%;height:100%;object-fit:cover;display:block}
.event-card .event-img .img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.event-card .event-body{padding:12px 15px;flex:1;min-width:0;display:flex;flex-direction:column}
.event-card .event-meta{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.event-card .event-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.event-tag.date{background:#F1F5F9;color:#64748B}.event-tag.gov{background:#DCFCE7;color:#15803D}
.event-tag.auth{background:#DBEAFE;color:#1D4ED8}.event-tag.source{background:#FEF3C7;color:#A16207}
.event-tag.client{background:#FCE7F3;color:#BE185D}
.event-card .event-preview{font-size:13px;color:#334155;line-height:1.6;flex:1;overflow:visible;max-height:none}
.event-card .event-link{font-size:11px;margin-top:6px;color:#3B82F6;font-weight:500}
.analysis-body{padding:4px 22px 20px;font-size:13px;line-height:1.8;color:#334155}
.analysis-body h3{font-size:15px;font-weight:700;margin:14px 0 6px;color:#1E293B}
.analysis-body ul{padding-left:0;list-style:none}
.analysis-body li{padding:2px 0 2px 18px;position:relative}
.analysis-body li::before{content:"•";position:absolute;left:2px;color:#3B82F6;font-weight:bold}
.tier-divider{text-align:center;padding:16px 0 8px;margin:8px 0}
.tier-divider span{background:linear-gradient(135deg,#3B82F6,#6366F1);color:#fff;padding:8px 28px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(59,130,246,.25)}
.footer{text-align:center;padding:20px 32px 40px;color:#94A3B8;font-size:12px;max-width:1400px;margin:0 auto}
.macro-dashboard{background:#fff;border-radius:14px;margin-bottom:18px;padding:16px 22px 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-top:4px solid #1E293B}
.macro-title{font-size:15px;font-weight:700;color:#1E293B;margin-bottom:2px}
.macro-period{font-size:11px;font-weight:400;color:#94A3B8;margin-left:6px}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media(max-width:900px){.macro-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.macro-grid{grid-template-columns:1fr}}
.macro-card{background:#F8FAFC;border-radius:8px;padding:10px 8px 4px;border:1px solid #E2E8F0}
.macro-card-title{font-size:10.5px;font-weight:600;color:#475569;margin-bottom:4px;text-align:center;line-height:1.3;min-height:28px;display:flex;align-items:center;justify-content:center}
.macro-card{position:relative}
.macro-source{position:absolute;top:6px;right:8px;font-size:7.5px;color:#94A3B8;font-weight:500;background:#fff;padding:1px 5px;border-radius:3px;border:1px solid #E2E8F0;z-index:1;pointer-events:none}
.macro-latest{display:flex;justify-content:center;align-items:baseline;gap:4px;margin-top:2px;padding:3px 0}
.macro-latest-label{font-size:9px;color:#94A3B8;font-weight:500}
.macro-latest-val{font-size:15px;font-weight:700;color:#1E293B}
.macro-latest-unit{font-size:9px;color:#64748B;font-weight:500}
.macro-latest-date{font-size:9px;color:#94A3B8}
.macro-note{font-size:9px;color:#94A3B8;margin-top:1px}
.macro-card{cursor:pointer;transition:transform .15s,box-shadow .15s}
.macro-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.macro-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:moFade .2s}
.macro-modal-card{background:#fff;border-radius:16px;padding:24px 28px 18px;width:680px;max-width:94vw;max-height:90vh;overflow-y:auto;cursor:default;box-shadow:0 24px 80px rgba(0,0,0,.25);position:relative;animation:moZoom .25s}
.macro-modal-card .macro-card{border:none;padding:0;background:transparent;cursor:default}
.macro-modal-card .macro-card:hover{transform:none;box-shadow:none}
.macro-modal-card .macro-card-title{font-size:15px;min-height:auto;margin-bottom:10px}
.macro-modal-card .macro-legend,.macro-modal-card [style*=legend]{font-size:11px!important}
.macro-modal-close{position:absolute;top:10px;right:16px;font-size:26px;cursor:pointer;color:#94A3B8;background:none;border:none;line-height:1;z-index:10;padding:4px 8px;border-radius:6px}
.macro-modal-close:hover{color:#475569;background:#F1F5F9}
.macro-data-section{margin-top:14px;border-top:1px solid #E2E8F0;padding-top:10px}
.macro-data-toggle{background:#F8FAFC;border:1px solid #CBD5E1;padding:6px 16px;border-radius:6px;font-size:12px;color:#64748B;cursor:pointer;font-weight:500}
.macro-data-toggle:hover{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.macro-data-table-wrap{margin-top:10px;max-height:340px;overflow-y:auto;border:1px solid #E2E8F0;border-radius:8px}
.macro-data-table{width:100%;border-collapse:collapse;font-size:12px}
.macro-data-table th{background:#F8FAFC;padding:7px 12px;text-align:right;font-weight:600;color:#475569;border-bottom:2px solid #E2E8F0;position:sticky;top:0}
.macro-data-table th:first-child{text-align:left}
.macro-data-table td{padding:5px 12px;text-align:right;border-bottom:1px solid #F1F5F9;color:#334155;font-variant-numeric:tabular-nums}
.macro-data-table td:first-child{text-align:left;color:#64748B;font-weight:500}
.macro-data-table tbody tr:hover td{background:#EEF2FF}
.macro-na{color:#CBD5E1!important}
@keyframes moFade{from{opacity:0}to{opacity:1}}
@keyframes moZoom{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:768px){.header{padding:14px 16px}.header-left h1{font-size:16px}.stats-row{padding:10px 14px;gap:6px}.stat-pill{padding:8px 12px;font-size:12px}.pill-label{font-size:11px}.content{padding:0 12px 40px}.section-header{padding:12px 14px 0}.events-grid{grid-template-columns:1fr;padding:4px 14px 14px}}
</style>
</head>
<body>

<div class="standalone-banner" id="standaloneBanner">Offline mode · Run <code>python3 web_app.py</code> for live updates</div>

<header class="header">
  <div class="header-left"><div class="header-logo">PY</div><div><h1>巴拉圭简报</h1><div class="subtitle" id="headerSubtitle"></div></div></div>
  <div class="header-right"><button class="btn-secondary" id="btnMacro" onclick="openMacroModal()" title="Update CPI/RIN">Macro</button><button class="btn-secondary" id="btnHistory" onclick="showHistory()">History</button><button class="btn-primary" id="btnUpdate" onclick="refreshBriefing()">Refresh</button><button class="btn-lang" id="langBtn" onclick="switchLanguage()">中文</button></div>

<script>

window.EMBEDDED_BRIEFINGS = {"zh": {"topic": "巴拉圭简报", "time_span": "2026年9月20日 — 2026年9月27日", "time_label": "最近一周", "sections": [{"title": "一、宏观经济动态", "tier": 1, "events": [{"title": "巴拉圭央行连续第七次会议将政策利率维持在5.50%，通胀率为1.5%（2026-09-22）", "date": "2026-09-22", "source_url": "https://1000noticias.com.py/2026/09/22/bcp-mantiene-la-tasa-de-interes-en-550-anual-ante-la-baja-inflacion-y-riesgos-externos/", "source_name": "1000 Noticias / BCP", "summary": "巴拉圭中央银行货币政策委员会于9月22日一致投票决定将基准利率维持在年化5.50%不变，这是自1月和2月两次各25个基点的降息将利率从6.00%下调以来，连续第七次维持不变。巴拉圭央行称，这一决定符合既不刺激也不抑制信贷的中性立场。8月整体通胀同比为1.5%，核心通胀为1.3%，远低于3.5%±2个百分点的目标，央行预计到2026年12月通胀将逐步升至3.3%，随后趋向3.5%。经济活动仍是制衡因素：截至7月，巴拉圭月度经济活动指数上涨5.6%，与2026年GDP增长4.5%的预测一致。委员会指出，中东紧张局势下的布伦特原油价格、谷物价格上涨以及美联储“在更长时间内维持更高利率”的路径，是主要外部风险。下次会议定于2026年10月23日举行。", "image_url": "https://1000noticias.com.py/wp-content/uploads/2026/09/banco-cenytral-del-paraguay.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "瓜拉尼突破5,900瓜拉尼关口，创八年新高，巴拉圭央行维持不干预立场（2026-09-25）", "date": "2026-09-25", "source_url": "https://www.lanacion.com.py/negocios/2026/09/25/el-dolar-cierra-la-semana-a-la-baja-llegando-a-niveles-de-ocho-anos-atras/", "source_name": "La Nación", "summary": "美元在9月25日当周收于买入价5,760瓜拉尼/卖出价5,880瓜拉尼，与2018年9月25日水平相当，再创八年新低。当周跌势加快：9月23日报5,900瓜拉尼（5,800/5,900，已是年内最低），9月24日进一步跌破关口至5,780/5,890。过去12个月，瓜拉尼对美元升值约25%，从2025年4月高于8,000瓜拉尼和2026年开年高于6,600瓜拉尼的水平升至当前价位。当地分析师提到的驱动因素包括创纪录的1,100万吨大豆收成、每年超过10亿美元的外国直接投资、以瓜拉尼计价的主权债券发行、边境贸易流动以及每年约10万名新增外国居民。巴拉圭央行拒绝干预现货市场，转而提供远期合约；截至8月底，远期合约成交量同比增长30%，达到20.5亿美元。此前将12月汇率预测定为6,100瓜拉尼的分析师如今承认，这一目标似乎已难以实现，一些市场人士甚至公开讨论在企稳之前可能跌向5,500瓜拉尼。", "image_url": "https://www.lanacion.com.py/resizer/v2/D2M6KBCJLVF2VJQSG6Q47ATHD4.jpg?auth=76ac20dbb1162b89331cdf0c3f690a4e55b306df53d65b2676e57442bb523746&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "出口商量化损失：巴拉圭农村协会将畜牧业损失定为3.49亿美元，巴拉圭肉类工业商会要求6,300至6,600瓜拉尼汇率区间（2026-09-24）", "date": "2026-09-24", "source_url": "https://www.abc.com.py/negocios/2026/09/23/dolar-en-paraguay-por-que-baja-la-cotizacion-pese-al-endurecimiento-de-tasas-de-la-fed/", "source_name": "ABC Color", "summary": "在瓜拉尼汇率升至八年高位之际，巴拉圭出口游说团体加大了对巴拉圭央行（BCP）不干预汇率政策的反对力度。巴拉圭农村协会（ARP）估计，在2025年9月至2026年8月期间，本币升值使畜牧业产值损失2.06万亿瓜拉尼（约3.49亿美元）；而巴拉圭可持续工业商会（Cispy）则认为，均衡汇率应介于6,300至6,600瓜拉尼之间，比即期汇率低约7%至12%。两大行业组织均正式请求央行进行干预。巴拉圭央行的回应是提供远期合约窗口，而非即期购汇：截至8月底，远期交易额同比增长30%，达到20.5亿美元。这种对冲工具能锁定未来特定业务的汇率，但对已实现的收入毫无帮助。这一僵局对每一个赚取美元的出口商都至关重要，包括牛肉、大豆和来料加工企业，也标志着政府反通胀成果与可贸易部门利润率压力之间迄今最尖锐的分化。", "image_url": "https://www.ratioparaguay.com.py/wp-content/uploads/2025/12/692606d302b306d992e22fc3_dolar12.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "8月生产者价格停滞，指数同比下降1.7%，强化反通胀态势（2026-09-26）", "date": "2026-09-26", "source_url": "https://www.lanacion.com.py/negocios_edicion_impresa/2026/09/26/el-indice-de-precios-del-productor-se-estanco/", "source_name": "La Nación / BCP", "summary": "根据巴拉圭央行9月26日公布的数据，巴拉圭生产者价格指数8月持平，月度变动为0.0%，年初至今累计为-0.7%，同比为-1.7%。上游价格的停滞是目前为止最清晰的印证，表明贯穿消费者价格指数的通胀放缓——8月整体CPI同比为1.5%，核心CPI为1.3%——并非由单一波动项驱动的一次性现象，而是反映了生产链条上真实的价格疲软。再加上瓜拉尼升值机械地压低了进口投入品的本币成本，这一读数解释了为何巴拉圭央行在9月22日会议上没有感到调整政策利率的压力，以及为何分析师在9月经济预期调查中将2026年末通胀预测下调至3.0%。对工业和农业企业经营者而言，信号是双重的：投入成本稳中有降，但产出定价能力同样疲弱，在瓜拉尼走强的环境下从两个方向挤压利润空间。", "image_url": "https://www.lanacion.com.py/resizer/v2/DCKYZJGJX5D7ROE762U3TYACJU.jpg?auth=c6974d66a7c80697537e126eb311772f2c186bbd5b7d55637d745a6f5d040b25&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}]}, {"title": "二、政治与政策变化", "tier": 1, "events": [{"title": "学校手机禁令因众议员未达法定人数而自动批准成为法律（2026-09-25）", "date": "2026-09-25", "source_url": "https://www.hoy.com.py/nacionales/2026/09/25/queda-sancionada-la-ley-que-prohibe-celulares-en-las-escuelas", "source_name": "Diario HOY", "summary": "9月25日（星期五），在众议院丧失法定人数、未能在宪法规定的期限内采取行动之后，禁止巴拉圭学校使用手机的法案以拟制批准（即自动制裁）方式成为法律。该法律禁止学生在校园内任何地方、任何时间（包括课间休息）使用手机、智能手表、平板电脑和无线耳机，并将禁令扩大至教师和教职员工。该法适用于公立、私立和受资助的教育机构，从初始教育阶段起生效，但不包括大学；与众议员何塞·罗德里格斯推动的最初全面禁止文本相比，参议院已将限制力度弱化。适用三项例外：医疗或安全紧急情况；经上级主管部门授权、在教师直接监督下计划开展的教学活动；以及为残疾学生提供的无障碍支持。该法案文本现已提交总统圣地亚哥·培尼亚，他可以按原文颁布，也可以提出全部或部分否决；将禁令扩大适用于成年人的条款最有可能招致部分否决。实施工作由教育与科学部和信息与通信技术部负责，两部门必须起草授权实施细则以便逐步推行。巴拉圭与巴西、智利和法国一样，开始限制课堂上的电子屏幕使用。", "image_url": "https://www.lanacion.com.py/resizer/v2/P6CIOOKR55GBNDPGTFFXVII77E.jpg?auth=5960c986ffba7e85be6636ce7d0a103157bf1745f98cf7da919e411e6c2ac9d5&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "众议员批准全国福音派教会日，将十月最后一个星期日纳入校历（2026-09-22）", "date": "2026-09-22", "source_url": "https://www.diputados.gov.py/noticias/noticias/2934", "source_name": "Cámara de Diputados", "summary": "众议院于9月22日批准了该法案，宣布每年10月的最后一个星期日为巴拉圭国家福音派教会日。此前，参议院于8月26日经修改后通过该法案，至此完成了国会审议程序。原提案将日期定在10月31日，恰逢宗教改革纪念日，但在参议院审议期间被改为该月最后一个星期日。该法案由参议员奥兰多·彭纳、利萨雷拉·瓦连特、布兰卡·奥韦拉尔和古斯塔沃·莱特提出，要求教育与科学部将这一日期纳入全国校历。法案已送交行政部门颁布。\n\n这一举措反映出巴拉圭福音派教会日益增长的政治分量。该群体在过去二十年间迅速扩大，如今在10月4日市政选举和2028年大选前的红党选举盘算中占据突出位置。这是一项低成本、高曝光度的让步，不会产生财政影响。", "image_url": "https://cms.evangelicodigital.com/upload/imagenes/6ab2d6b1c2f0f_paraguaydiputadosG.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "市政竞选进入最后一周：卡米洛·佩雷斯称在亚松森领先20个百分点，最高选举法院开始部署14,711套选票材料包（2026-09-27）", "date": "2026-09-27", "source_url": "https://www.latribuna.com.py/politica/2026/09/25/lt-breves-tsje-y-candidatos-ultiman-detalles-rumbo-al-4-de-octubre/", "source_name": "La Tribuna / TSJE", "summary": "距离10月4日市政选举仅剩一周，竞选活动进入收尾阶段，选举机器开始运转。最高选举法院（TSJE）于9月27日开始装载14,711套选票物资，从上巴拉圭省开始部署，至10月3日在首都（亚松森）完成，共动用539辆中型车辆、130辆面包车和25辆重型车辆。在亚松森，红党候选人卡米洛·佩雷斯——位列1号名单，以“亚松森可以改变”为口号，由副议长劳尔·拉托雷担任竞选负责人，图里·卡佩罗担任副协调员——定于9月28日星期一以大型车队游行结束竞选活动。拉托雷表示，内部民调显示佩雷斯在首都平均领先约20个百分点，佩雷斯则声称拥有81,446张基础选票。他在最后阶段会见了国家共和联盟（红党）主席奥拉西奥·卡特斯，并获得公开背书。反对派候选人、“亚松森团结联盟”的索莱达·努涅斯正围绕反对延续现状、透明度、交通、垃圾管理和青年议题开展竞选，并要求有审计人员到场监督。此次投票将是2023年大选以来首次全国性选举考验，也是红党在2028年之前内部格局的风向标。", "image_url": "https://www.latribuna.com.py/resizer/v2/7ZV7KM6JOVECJKKFSAN45EPAVQ.jpeg?smart=true&auth=b5df189032da4dae8595eda95b75a8a4dcf12bbfcfee8ec9bf438f17b0d6697e&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}, {"title": "内内乔·罗德里格斯给索莱达·努涅斯24小时撤回“抢劫”指控，并警告将有“后果”（2026-09-25）", "date": "2026-09-25", "source_url": "https://www.abc.com.py/politica/2026/09/25/molesto-por-acusacion-de-robo-nenecho-emplaza-a-soledad-nunez/", "source_name": "ABC Color", "summary": "9月25日，亚松森市长选战出现尖锐的个人化转折——前市长奥斯卡·“内内乔”·罗德里格斯要求反对派候选人索莱达·努涅斯在24小时内删除一则指控他抢劫的竞选帖，并警告若不删除将有“后果”。这场对峙将这座城市近期的市政管理——罗德里格斯因一起涉及市政债券收益处理的腐败案而被停职，随后被免职——直接卷入了竞选收官阶段，而此前选战大体上还围绕延续与变革展开。这一事件也横切了红党阵营，因为罗德里格斯在党内仍是一个两极分化的人物，而官方候选人卡米洛·佩雷斯则在卡特斯的支持下主打与过去切割的竞选纲领。努涅斯的团队将这次交锋描述为，即将卸任的政府想打官司而不是辩论的证据。由于民调发布禁令一直持续到选举日，诸如此类的表态是选民在10月4日前能看到的仅剩的少数信号之一。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/29db623/2147483647/strip/true/crop/765x430+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F11%2Fa2%2F6ed257fb47b6992b731effbf03b4%2Fuhpol20260926-005b-ph01-1054.jpg", "is_gov_source": false, "is_authoritative": true}]}, {"title": "三、社会与安全形势", "tier": 1, "events": [{"title": "卫生工作者升级行动：28个组织要求加薪50%并建立卫生职业发展路径，威胁发起全国罢工（2026-09-22）", "date": "2026-09-22", "source_url": "https://www.adndigital.com.py/trabajadores-de-salud-endurecen-protesta-y-analizan-ir-a-un-paro-nacional/", "source_name": "ADN Digital", "summary": "全国卫生工作者联合会（FNTS）及28个联盟组织于9月22日在亚松森公共卫生部外动员，汇集了生物化学家、牙医、放射科医生、物理治疗师、产科医生和麻醉师——其基础约为45,000至49,000名工作人员。他们的诉求是加薪50%并落实承诺已久的卫生职业阶梯（医疗卫生职业晋升体系）；他们称工资已被冻结14年，购买力已损失约77%。抗议活动一度封闭了西尔维奥·佩蒂罗西大道，并向国会行进，领导人在那里讨论了发起全国罢工甚至关闭实验室的可能性。代表们会见了新任卫生部长伊萨亚斯·弗雷特斯，后者称预算受限；谈判休会至10月3日，而动员仍在继续。这场争端是医生冲突的直接后续，那场冲突在9月中旬导致前部长玛丽亚·特蕾莎·巴兰去职，并迫使给医生统一加薪200万瓜拉尼——非医生卫生人员现在将这一解决方案作为证明自身诉求合理的先例。将同等幅度的加薪扩展到45,000多名工作人员所产生的财政成本，恰恰是2027年预算无法承受的压力。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/103643a/2147483647/strip/true/crop/1599x899+0+83/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F42%2Fd1%2F82e0754b481e9a679a0cfe458ecf%2Fhuelga-de-trabajadores-de-la-salud-1.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "内政部启动一项以技术为驱动的东方市安全计划，配备无人机、人脸识别和45辆新巡逻车（2026-09-24）", "date": "2026-09-24", "source_url": "https://www.hoy.com.py/nacionales/2026/09/24/policia-lanza-plan-de-seguridad-para-contrarrestar-incesante-delincuencia-en-cde", "source_name": "Diario HOY", "summary": "内政部长恩里克·里埃拉和国家警察司令塞萨尔·西尔格罗于9月24日在东方市与上巴拉那省省长塞萨尔·“兰迪”·托雷斯及当地商会共同发布了“省会安全计划”。该计划的核心是技术：与911系统更深度整合，包括定于11月投入使用的东方市新呼叫中心；扩大视频监控网格，配备100多个具备面部和车牌识别功能的智能摄像头；警力资源地理定位；四架捐赠的无人机（三架覆盖市中心，一架部署在警察总部，升限3000米，航程约30公里）；为林塞小组摩托车队配备执法记录仪；为特种行动组战术单位配备便携式无线电；以及“林塞按钮”紧急报警按钮。警力增援部分增加45辆巡逻车、40名警员以及摩托车和25部对讲机。同场活动还为位于上巴拉那省政府场地的新林塞小组战术摩托车总部启用揭牌，这是一栋底层加两层的建筑，可容纳80多名警员，预计约45天内完工。里埃拉另行宣布了一项总额9200万美元、为期三年的警察现代化计划，涵盖500辆巡逻车、1万件武器和防弹背心以及16个新的警察总部。该计划是对上巴拉那省持续犯罪潮的回应——就在发布会前，明加瓜苏一家水配送商被抢走一个保险箱、一支霰弹枪和一辆皮卡，东方市市中心核心区还有一辆汽车被盗。", "image_url": "https://www.lanacion.com.py/resizer/v2/X5VKDRCLLJD7BJRPMQQ3EBZBTY.jpg?auth=469f4a0a30210fb7df1e87ccd353c12061c8f455b004b6874e37b86fc805168d&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "奥雷利亚行动捣毁一个通过巴拿马将亚马逊黄金转运至土耳其的黄金走私团伙，查获700万美元并逮捕四人（2026-09-25）", "date": "2026-09-25", "source_url": "https://www.lanacion.com.py/pais/2026/09/24/operativo-aurelia-tras-serie-de-allanamientos-detienen-a-cuatro-personas-por-trafico-de-oro/", "source_name": "La Nación / Fiscalía", "summary": "9月24日，警察和检察官执行了“奥雷利亚行动”，在亚松森和中央省约八至十处地点同时开展突袭——包括卡梅利塔斯和马诺拉街区、伊帕内、林皮奥、费尔南多·德拉莫拉、卢克以及西尔维奥·佩蒂罗西国际机场——打击一个国际黄金走私和洗钱网络。四人被拘留：杰西卡·卡罗琳娜·阿吉莱拉·里克尔梅（36岁，巴拉圭籍）、阿里·卡伊德（19岁，叙利亚裔巴拉圭人）、瓦利德·卡齐姆（53岁，瑞典-伊拉克籍，此前在巴西有非法黄金运输记录）和卡罗尔·玛加利·努涅斯·阿拉尔孔（23岁，巴拉圭籍）。据称头目为伊拉克籍的莱斯·阿尔扎耶克，他在巴拉圭居住了20年，曾因在土耳其盗窃金锭和在巴西走私留有前科，目前仍在逃，另有3至9份逮捕令尚未执行。该网络将高纯度（约99%）黄金从巴西亚马逊地区的非法矿区经巴拉圭作为过境国运出，再经巴拿马和迪拜，最终乘商业航班运抵伊斯坦布尔，路线为亚松森—巴拿马—伊斯坦布尔，返程经迪拜和圣保罗。调查人员正在调查该网络与巴西“首都第一司令部”（PCC）和“红色司令部”的联系。查获的资产估计价值700万美元，包括豪华车辆、多种货币、珠宝、武器、精密秤、光谱仪和电子设备。一名法官于9月25日以走私和犯罪团伙罪名下令对四人进行预防性拘留。该案可追溯到此前在机场的两次查获：2025年11月查获22公斤，2026年4月查获27公斤。", "image_url": "https://www.lanacion.com.py/resizer/v2/Q3SCUM4SDJEJHGBXBN42W53JGQ.png?auth=4d76a9c75fca4655297cf0d012a8b1e010cc8d966a00c3c5609ba24e2fcff071&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "武装团伙在上巴拉那抢劫潮持续之际从明加瓜苏一家水务公司盗走保险箱和一辆皮卡（2026-09-24）", "date": "2026-09-24", "source_url": "https://www.lanacion.com.py/pais/2026/09/24/policia-analiza-imagenes-de-cctv-tras-robo-de-caja-fuerte-y-vehiculo-a-empresa/", "source_name": "La Nación", "summary": "三至四名武装人员袭击了上巴拉那省明加瓜苏的塞尔茨水务公司，制服了安保人员加布里埃尔·帕雷德斯·米兰达，并带着一个装有近1亿瓜拉尼的保险箱、一辆三菱蒙特罗皮卡和一支霰弹枪逃离。车辆后来在东方市被发现遗弃；警方正在检察官奥斯瓦尔多·萨拉乔的领导下审查闭路电视录像。这起抢劫是同一周该省发生的一系列事件之一：在J.奥古斯托·萨尔迪瓦尔，一起光天化日下的摩托车抢劫从一处缴费亭抢走约1100万瓜拉尼；在马里亚诺·罗克·阿隆索，三名冒充缉毒警察的男子抢劫了一名88岁老妇及其孙子，抢走50万瓜拉尼和两部手机；在比亚海斯雷曼西托，一名废品回收者被抢走1500万瓜拉尼后遭枪击两次并住院。这种模式——小规模、暴力、低风险团伙在该国第二大经济极肆无忌惮地作案——正是新的东方市安全计划所要扭转的，也解释了为什么上巴拉那省的商业协会一直是要求以技术为主导的应对措施的最强烈声音。", "image_url": "https://www.lanacion.com.py/resizer/v2/DWJSZY55YNEWZK5UBQQCCGZOEE.jpg?auth=c83ad7ecb99c48532fbadef9f61308a374030116f6ff07b5d8979f202931083b&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}]}, {"title": "四、国际关系与外交动态", "tier": 1, "events": [{"title": "培尼亚在联合国大会：安理会改革、拉美籍秘书长以及委内瑞拉、古巴、尼加拉瓜和海地的自由选举（2026-09-23）", "date": "2026-09-23", "source_url": "https://www.hoy.com.py/nacionales/2026/09/23/venezuela-apertura-de-ormuz-y-apoyo-a-taiwan-el-discurso-de-pena-en-la-onu", "source_name": "Diario HOY / United Nations", "summary": "9月23日，在纽约举行的第81届联合国大会一般性辩论上发言时，总统圣地亚哥·培尼亚呼吁下一任联合国秘书长应来自拉丁美洲和加勒比地区，并主张必须改革安全理事会，因为它“仅由少数国家主导”，而且“必须不再是1945年世界的一幅漂亮照片”。他为自己最近访问加拉加斯辩护——尽管两国已中断外交关系，此访仍成行——称其开启了一个对话渠道，旨在推动民主过渡以及委内瑞拉最终重新融入国际社会和南方共同市场；他坚称“我去委内瑞拉不是为了给一个政权背书”，并呼吁在委内瑞拉、古巴、尼加拉瓜和海地举行自由选举。他敦促立即停止敌对行动，保障霍尔木兹海峡和曼德海峡的完全航行自由，并警告这对最脆弱群体的粮食和能源安全造成的后果。在人工智能问题上，他表示人工智能必须服务于人的尊严，而不是取代人的尊严，并且必须保留人类对决策的责任。其核心信息是，“人们不再想要口号，他们想要解决方案”，并列举国内成就作为证明：投资级评级、失业率下降以及贫困率的历史性下降。培尼亚还感谢了台湾当局，后者公开承认了这一支持。", "image_url": "https://www.lanacion.com.py/resizer/v2/BLSL5YICZFCDVGT6WQVPK2NEFE.jpg?auth=fe09cdb05166dba0b55e2ccbdde7e83d89e7b51f9f52554c8da92ea6f945cac3&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "台湾感谢巴拉圭在联合国的支持，同时培尼亚在纽约会见台湾国际合作发展基金会，以推进伊瓜苏数字人工智能项目（2026-09-24）", "date": "2026-09-24", "source_url": "https://www.lanacion.com.py/politica/2026/09/24/autoridades-de-taiwan-agradecen-respaldo-de-pena-en-discurso-ante-la-onu/", "source_name": "La Nación", "summary": "在培尼亚于联合国大会发表讲话后，包括台湾当局领导人赖清德在内的台湾当局公开感谢巴拉圭。培尼亚在讲话中重申支持台湾参与联合国及其专门机构，并表示巴拉圭在台湾海峡问题上“并非中立”。前一天，培尼亚在纽约与台湾国际合作发展基金会秘书长黄云林举行双边会晤，进一步强化了这一支持表态；培尼亚在会上称这一“战略联盟”正在加强，并重点推进伊瓜苏数字项目——一个巴拉圭与台湾各占50%股份的合资项目，仿照伊泰普水电站的治理模式，由巴拉圭提供土地和水电，台湾提供算力和半导体。台湾国际合作发展基金会的支持主要面向数字化转型、技术和人才培养。巴拉圭仍是南美洲唯一与台北保持“外交关系”的国家，这一关系可追溯至1957年，双方将在2027年纪念建交70周年。工业和商业部长马尔科·里克尔梅为这一联盟辩护，理由是优先进入台湾市场——对包括猪肉和小麦粉在内的众多产品实行零关税——能够在巴拉圭开拓更广阔市场之前增强生产能力。", "image_url": "https://www.lanacion.com.py/resizer/v2/MLWGXZSHJ5CDVG7ULCR4IZCZQI.jpg?auth=5fa31335f0d361642a5b01dd9aaebef7d3fbb145d05153ee18404215b8027fa9&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "南方共同市场在欧盟出口配额问题上的内部分歧持续：巴拉圭坚持25%均分，而集团正考虑先到先得（2026-09-22）", "date": "2026-09-22", "source_url": "https://www.ultimahora.com/sugieren-fortalecer-cadenas-de-valor-para-negociar-cupos-con-ue", "source_name": "Última Hora", "summary": "南方共同市场—欧盟协定已签署、获得四个成员国批准，并自2026年5月1日起临时适用，但该集团在如何分配布鲁塞尔授予的出口配额问题上仍陷于僵局。巴拉圭提议对接近10万吨的总量由每个成员国平均分配25%；阿根廷和乌拉圭希望按对欧历史平均出口量分配配额；巴西则倾向于按各国在世界贸易中所占份额加权。在蒙得维的亚举行的一次非正式外长会议上，巴拉圭外长鲁文·拉米雷斯·莱斯卡诺坚持25%的立场，乌拉圭外长马里奥·卢贝特金承认“没有达成一致意见”，并指出在没有商定配额的情况下，数量将按先到先得原则分配。经济学家阿尔多·森图里翁以约6万吨的希尔顿牛肉配额说明这种不对称，其中阿根廷持有29,389吨，巴西10,000吨，巴拉圭仅1,000吨；他建议逐产品谈判并加强价值链，目标是在五年内逐步达到15%的份额，十年内达到20%。外长们确定45至60天内在蒙得维的亚再举行一次线下会议，赶在定于12月3日至4日在乌拉圭举行的南方共同市场峰会之前。对巴拉圭出口商而言，实际利害在于，这个仅占南方共同市场对欧盟出口不到1%的国家，是获得有保障的份额，还是必须按到货顺序竞争。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/40597a4/2147483647/strip/true/crop/777x437+0+60/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F8d%2F65%2Fd36148854ef7b486018a1057718a%2Fcarne-vacuna-jpg.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭在不与台湾断交的情况下保持对华贸易大门敞开，农业出口商施压要求直接准入（2026-09-24）", "date": "2026-09-24", "source_url": "https://www.newsofbahrain.com/world/136451.html", "source_name": "News of Bahrain / AFP", "summary": "巴拉圭官员重申，该国愿意在不与台湾断绝外交关系的情况下与中国建立商业关系，但这一方案一直遭到北京拒绝，因为它要求承认一个中国原则。外交部长鲁文·拉米雷斯·莱斯卡诺表示，巴拉圭对贸易安排持开放态度，总统培尼亚则称自己“完全愿意”通过南方共同市场而非双边渠道推动商业协议——这条路径绕开了外交问题，但进展缓慢，需要四个成员国达成共识。压力来自国内且具有结构性：大豆和牛肉出口商无法直接向中国销售，而中国却已成为巴拉圭最大的商品供应国，占其进口的三分之一以上，因此贸易关系严重偏向中国，且没有可抵消的出口渠道。一项被引用的调查显示，近90%的巴拉圭人支持与北京改善关系。政府将2027年巴拉圭与台湾关系七十周年定位为一个契机，将这一关系转化为全面的经济、技术和生产联盟，这是对出口商游说团体利益算盘的政治回应。", "image_url": "https://www.newsofbahrain.com/admin/post/upload/A_j2CJKksUiG_2026-07-01_1782898105resized_pic.jpg", "is_gov_source": false, "is_authoritative": true}]}, {"title": "五、行业专题：通讯、运营商、数字能源与AI", "tier": 1, "events": [{"title": "Nubicom 10月13日截止日期临近，所需22个无线基站中仅1个在播，审计长警告可能吊销许可证（2026-09-25）", "date": "2026-09-25", "source_url": "https://dplnews.com/paraguay-nubicom-debe-desplegar-22-radiobases-octubre/", "source_name": "DPL News / CONATEL / CGR", "summary": "巴拉圭Nubicom股份公司必须在2026年10月13日之前在全国投入运行至少22个5G无线基站，即2025年10月13日授予许可证一周年之际；而据国家电信委员会自己的说法，该运营商目前只有一个正在运行的基站，位于亚松森维拉莫拉区的Teisa数据中心，互联网覆盖范围有限。国家电信委员会负责人维克托·马丁内斯表示，部署本质上具有渐进性，招标并不要求在最初几个月就有用户，合规情况将于10月正式核查——他甚至表示初步迹象显示Nubicom有望超过要求。正在对该项授标和运营进行即时特别审计的国家总审计长办公室则持不同看法：该办公室未发现有足够证据表明除一个基站和核心网络之外还有更多部署，国家电信委员会也没有详细、可衡量、最新的跟踪机制——没有一份矩阵标明22个站点的位置、进展、日期或受益地区。 共和国总审计署未直接宣布努比科姆不合规，但称其为“警示信号”，表明控制和可追溯性薄弱，并补充说，它无法核实努比科姆声称的10万名阿根廷用户或招标要求的1000万美元最低净资产。它敦促国家电信委员会加强监管，指出一旦出现违约应启动包括撤销或废止在内的制裁程序；审计长卡米洛·贝尼特斯表示，最终报告将在10月之后发布。培尼亚总统已公开质疑审计长的说法，并维护该公司称其符合招标要求。努比科姆与克拉罗的中标来自2025年3.5 GHz频段的首次拍卖，该拍卖排除了华为供应——这是当时蒂戈和佩尔索纳尔均拒绝接受的条件。", "image_url": "https://dplnews.com/wp-content/uploads/2025/10/dplnews_nubicom_mc31025.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭国家电力管理局工程师提议将数据中心、人工智能和加密货币挖矿用电上限设为700兆瓦，通过升价拍卖授予，底价为56美元/兆瓦时（2026-09-22）", "date": "2026-09-22", "source_url": "https://www.abc.com.py/economia/2026/07/22/ingenieros-de-ande-proponen-subasta-de-precios-y-limitar-energia-a-700-mw-a-criptomineras-y-data-centers/", "source_name": "ABC Color / UIA-ANDE", "summary": "国家电力管理局工程师联合会（UIA）提议，将‘融合产业’——数据中心、人工智能和加密挖矿——的可签约总电力限制在700兆瓦，约占巴拉圭装机容量的10%，通过升价拍卖分配，底价为每兆瓦时56美元，由44美元技术电价加上12美元对让渡给巴西能源的补偿构成，合同期限为三至五年。按照该时间表，新框架要到2028年、700兆瓦额度招标完成后才会生效；现有高耗电运营商所持合同将于2027年到期。该提议落在政策真空中：政府于2026年1月批准第5306号和第5307号法令，为高耗能群体设定每兆瓦时26至32美元、最长15年的特别电价，随后于4月通过第5860号和第5861号法令进行调整，将‘能源转X’项目上限设定为250兆瓦，最终于6月在巴拉圭国家电力管理局Sitrande工会和技术部门的压力下将这些法令全部废除；这些部门认为国家每兆瓦时损失超过40美元。与此同时，政府成立了一个工作组重新设计电价制度，并新设了能源部和一个监管机构，要求在9月初明确电价。特殊集约消费集团（GCIE）——加密矿工和人工智能数据中心——要求将合同延长至十年、直至2037年，并要求制定专门的人工智能电价，提出如果获得可预见性，将在18个月内使签约电力成倍增长。英国阿托姆公司（Atome）被作为特殊情况处理，被认定为2022年购电协议（PPA）下的现有客户，该协议为其位于维莱塔的价值6.65亿美元、145兆瓦绿色化肥厂提供约33美元/兆瓦时、220千伏的电力。", "image_url": "https://www.ratioparaguay.com.py/wp-content/uploads/2026/07/6a6113cb59551e8c67dc0112_data-center2.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "伊瓜苏数字三期：2.5亿美元建设10兆瓦主权人工智能中心，随后50亿美元，再400亿美元和1吉瓦（2026-09-24）", "date": "2026-09-24", "source_url": "https://www.bnamericas.com/en/news/paraguay-deepens-taiwan-ties-on-data-centers-and-ai", "source_name": "BNamericas", "summary": "巴拉圭—台湾伊瓜苏数字合资项目按照伊泰普治理模式设立为50/50平等合资架构，正以三个逐步升级的阶段进行推介。第一阶段需要2亿至3亿美元，建设一个10兆瓦的主权人工智能中心，供政府使用——涵盖医院记录、税务登记和监控——目标于2027年底投入运营。第二阶段将耗资50亿美元，用电量为100兆瓦，不到全国电力的2%，政府认为其影响相当于GDP的10%。第三阶段是400亿美元的投资，耗电1000兆瓦——几乎是阿卡赖电站容量（210兆瓦）的五倍，接近1.5台伊泰普水轮机（每台700兆瓦）的容量。该方案的基础是巴拉圭的富余水电：彭博社强调，得益于伊泰普和亚西雷塔水电站，该国是拉丁美洲唯一电力100%来自可再生能源的国家，居民电价为0.055美元/千瓦时，商业电价为0.046美元/千瓦时，而全球平均水平分别为0.176美元和0.164美元。反对意见来自技术和人力两个层面。能源专家维多里奥·奥西利亚·达瓦洛斯警告说，输电网络普遍饱和，国家电力管理局的扩建计划滞后，建议将数据中心设在伊泰普附近或伊瓜苏和巴伦苏埃拉变电站等战略节点。巴拉圭人工智能学会称，由于缺乏人力资本，该提议是“妄想”。与此同时，政府还面临阿托姆电价案的争议。另外，韩国企业爱诺森于9月3日与伊泰普科技园签署协议，建设一个人工智能教育数据中心，并计划长期扩展至1吉瓦。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/4b10f08/2147483647/strip/true/crop/3552x1998+0+223/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F4f%2F52%2Fa0aaaf804f4ba6c9e3c761ffce4c%2Fvictorio-oxilia-docente-politecnica-46916341.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "亚松森国立大学（UNA）下令实施预防性DNS和IP屏蔽，并限国家电信委员会（CONATEL）及四大互联网服务提供商在24小时内执行（2026-09-25）", "date": "2026-09-25", "source_url": "https://www.una.py/comunicado-oficial-del-rectorado-de-la-una-25-09-2026", "source_name": "Universidad Nacional de Asunción", "summary": "亚松森国立大学于9月25日发布正式公报，下令在巴拉圭境内通过DNS和IP对司法裁决中列明的域名和URL实施预防性屏蔽。校长办公室紧急通知国家电信委员会，并指示该国互联网服务提供商——科帕科、蒂戈、个人电信和克拉罗——在最多24小时内从技术上实施该限制。公共部专门网络犯罪处和国家警察网络犯罪局已立案调查，以查明并惩处行为人、共犯和从犯。亚松森国立大学表示，将穷尽一切法律和行政途径，以消除数字暴力并保护其成员的权利。这一事件是对巴拉圭四家运营商接入市场能多快、多彻底地执行法院下令的删除的一次实战检验，并为内容屏蔽请求开创了先例，这些请求将同样适用于第六节所跟踪的运营商。这也使国家电信委员会处于在一个法律敏感事项上协调私营网络执行措施的境地，而该监管机构同时因自3月以来未依照第5282/14号法律更新其自身透明度门户而受到批评。", "image_url": "https://www.una.py/wp-content/uploads/2026/09/Portada-COMUNICADO-25_SEPT_2026.png", "is_gov_source": true, "is_authoritative": true}]}, {"title": "六、主要客户动向", "tier": 1, "events": [{"title": "蒂戈/米雷康姆承诺未来五年再投入5亿美元建设“数字高速公路”，并完成向阿蒂斯集团售后回租281座铁塔（2026-09-22）", "date": "2026-09-22", "source_url": "https://www.telesemana.com/blog/2026/08/19/el-organo-de-competencia-de-paraguay-aprobo-la-venta-de-281-torres-de-millicom-a-atis/", "source_name": "Telesemana / Millicom", "summary": "蒂戈宣布未来五年再投资5亿美元，用于强化其“数字高速公路”；这一宣布恰逢时任米雷康姆首席执行官毛里西奥·拉莫斯访问巴拉圭以及该公司在该国运营30年之际。与这笔投资并列的是，美洲开发银行投资公司和法国开发署私营部门融资机构提供了1亿美元融资方案，用于支持米雷康姆在玻利维亚、哥伦比亚、萨尔瓦多、危地马拉、洪都拉斯、巴拿马和巴拉圭扩展光纤覆盖并推进移动网络现代化。在无源基础设施方面，巴拉圭竞争主管部门国家竞争委员会8月批准阿蒂斯集团从米雷康姆旗下基础设施子公司拉蒂巴拉圭收购281座铁塔，交易以15年期售后回租方式进行，蒂戈继续使用该网络，同时承诺在15年内再建设至少200座铁塔并转售给阿蒂斯。在战略层面，剥离蒂戈移动支付后，米雷康姆已将业务聚焦于连接、基础设施和数据领域，首席执行官马塞洛·贝尼特斯5月表示，“铁塔、天线和电气设备已具备5G就绪条件”，并将频谱拍卖、5G部署和新的数据中心投资列为下一阶段目标。米雷康姆2025年以创纪录的8.5亿美元利润收官。", "image_url": "https://www.telesemana.com/wp-content/uploads/2023/02/torres-antenas-kabiur-rahman-riyad-YzZJUXjb9aw-unsplash-e1676670022939.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo / Millicom — USD 500M capex, tower sale-leaseback, 5G readiness"}, {"title": "个人电信公司以100万美元赢得3.7 GHz频段，并面临180天首座无线基站倒计时，标志其进入5G（2026-09-22）", "date": "2026-09-22", "source_url": "https://dplnews.com/personal-tigo-licencias-5g-paraguay/", "source_name": "DPL News / CONATEL", "summary": "以“个人”品牌运营的阿根廷电信子公司努克莱奥股份公司在国家电信委员会第二次5G频谱招标中获得3,700–3,800 MHz频段，价格为100万美元，并通过第1628/2026号董事会决议正式确定。蒂戈以160万美元获得成对的2,300–2,400 MHz频段。两家公司是本次招标中仅有的投标方，且均未参加2025年第一次拍卖。招标规则规定，每家牌照持有人须在90天内提交详细技术部署方案，并在180天内安装首个无线基站并开始商业服务，还须在四年内部署至少100个无线基站。合计承诺为前五年投入8000万美元、建设约750个无线基站，并须在技术可行的情况下强制共享铁塔和站址等无源基础设施。180天期限是供应商参与的关键近期节点：个人公司的3.7 GHz频段意味着将进行面向密集城市覆盖的容量层部署，而蒂戈获得的2.3 GHz频段更适合实现更广覆盖。个人公司还在固定互联网方面连续第五个时期扩大了领先优势。", "image_url": "https://dplnews.com/wp-content/uploads/2026/06/Gemini_Generated_Image_2s4av12s4av12s4a-1024x572.png", "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal / Núcleo — 3.7 GHz licence, 100 radiobases in four years"}, {"title": "克拉罗依托100个无线基站在八座城市运营5G，参议院决议要求国家电信委员会就全部四家运营商提交完整报告（2026-09-22）", "date": "2026-09-22", "source_url": "https://www.telesemana.com/panorama-de-mercado/paraguay/", "source_name": "Telesemana / CONATEL / Senado", "summary": "克拉罗巴拉圭公司于2025年12月率先推出商用5G，现报告其覆盖范围已扩大至中部地区以及奥维多上校、比亚里卡、佩德罗·胡安·卡瓦列罗、埃尔南达里亚斯、东方市、恩卡纳西翁和坎比雷塔，共建有100个无线基站，配备诺基亚AirScale设备、ReefShark芯片组、大规模MIMO射频设备及IPAA+天线，履行了与其在3.5 GHz频段所持200 MHz频谱相关的基站义务，其中10%预留给国家机构。技术总监劳尔·阿吉莱拉和总经理阿尔弗雷多·阿尔卡拉斯指出，终端供应是阻碍大规模普及的主要障碍，5年牌照期限是公司主要的监管诉求；公司计划在首个牌照期内总投资3500万美元。AMX巴拉圭公司为100%墨西哥资本。与此同时，参议院第534号决议正式要求国家电信委员会报告Tigo巴拉圭股份公司、Personal巴拉圭、AMX巴拉圭股份公司（克拉罗）和Hola巴拉圭股份公司（Vox）所提供的服务，内容涵盖监管规定、合同、许可证、活跃线路、申报收入、费用和电子金融服务。参议员拉斐尔·菲利佐拉另指控主要5G频段授予受到操控，将合计拥有约70%移动用户的Tigo和Personal排除在外，并警告用户须更换运营商才能使用该技术。", "image_url": "https://statics.forbes.com.py/2026/05/6a1b0b9a1d012.png", "is_gov_source": false, "is_authoritative": true, "client_tag": "Claro / AMX Paraguay — 5G coverage, Nokia build, Senate scrutiny"}, {"title": "努比康进入十月：仅有1个在用无线基站，而合同义务为22个站点，审计长审计尚未结案（2026-09-25）", "date": "2026-09-25", "source_url": "https://dplnews.com/paraguay-nubicom-debe-desplegar-22-radiobases-octubre/", "source_name": "DPL News / CONATEL / CGR", "summary": "由巴斯克斯集团支持、在2025年首场拍卖中以200万美元获得3.5吉赫频段频谱的巴拉圭努比科姆股份公司，须在2026年10月13日前在全国部署22个5G无线基站，目前仅在亚松森维拉莫拉的泰萨数据中心运营一个基站。国家电信委员会坚称，该公司仍处于合同规定的时间表内，且招标并未要求在开通后的最初几个月达到用户数量；正在开展即时专项审计的总审计长办公室发现，部署证据不足，监管机构没有可衡量的跟踪矩阵，并且既无法核实该公司声称的10万阿根廷用户，也无法核实招标要求的1000万美元最低净资产。总审计署并未直接宣布其违约，但指出控制与可追溯性薄弱，并警告称，不合规应触发制裁，最高可吊销许可证或解除合同。培尼亚总统公开站在该公司一边，并驳斥了总审计长的意见。这一结果将为整个5G框架确立执法先例：许可义务究竟是有约束力的承诺，还是可以重新谈判的目标。", "image_url": "https://dplnews.com/wp-content/uploads/2025/10/dplnews_nubicom_mc31025.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom — 22-radiobase deadline, licence at risk"}, {"title": "科帕科和沃克斯寻求私人资本而非私有化，因沃克斯负资产达到G. 85,609百万且233名员工被裁（2026-09-22）", "date": "2026-09-22", "source_url": "https://marketdata.com.py/secciones/laboratorio/entrevistas/page/31/", "source_name": "MarketData / Copaco", "summary": "据其新任总裁罗德里戈·费雷拉·坎波斯称，国有通信公司科帕科全资拥有移动运营商奥拉巴拉圭股份有限公司（沃克斯），该公司当前优先寻求私人资本，而非私有化；坎波斯将“共享风险”形容为正在考虑的选项之一。这种谨慎是有道理的：沃克斯在2025年净亏损 G. 33,314百万，净权益为负 G. 85,609百万，并欠科帕科超过 G. 178,316百万，科帕科一直在吸收这些亏损，这引发了对其持续经营能力的质疑。出任公司董事长的经济学家奥斯卡·斯塔克表示，科帕科的员工人数超过所需，并确认已有233名员工被裁员；他主张该实体必须重组，并将精力集中在仍具竞争力的服务上。全国电信工人工会（Sinattel）要求国家向科帕科投资100百万美元，并要求管理层在60天内提交救助计划，否则以罢工相威胁。总经理吉尔斯·加西亚在7月承认，沃克斯财务状况脆弱，但同时断然排除破产可能，并确认自2024年以来一直在寻找投资者或合作伙伴，且任何交易都必须保留公司100%的主权。对于设备和服务供应商而言，实际判断是，在没有外部资本事件的情况下，科帕科—沃克斯的采购将继续冻结；而任何进入的投资者都很可能重新审视整个网络路线图。", "image_url": "https://marketdata.com.py/wp-content/uploads/2024/01/sojer.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Copaco / Vox — state operator seeks capital, procurement frozen"}]}, {"title": "七、对企业经营的综合影响分析", "tier": 2, "events": [], "impact_analysis": "🟡 汇率之痛如今成为制约性瓶颈，而非通胀。瓜拉尼在9月25日当周收于1美元兑5,760/5,880瓜拉尼，创八年高点；12个月内升值约25%，年初至今升值12.34%。巴拉圭央行于9月22日连续第七次会议将政策利率维持在5.50%，整体通胀率为1.5%，核心通胀率为1.3%，而目标为3.5%；8月生产者价格环比持平，同比为-1.7%——这是一场教科书式的反通胀，却以可贸易部门受损为代价。巴拉圭央行拒绝干预即期市场，将调整压力转嫁给了出口商：巴拉圭农村协会估算，截至8月的12个月内畜牧业产值损失达3.49亿美元；巴拉圭可持续产业商会（Cispy）则认为均衡汇率应为6,300–6,600瓜拉尼。对于任何收入以美元计价、成本以瓜拉尼计价的经营活动而言，利润率每个月都在机械性地压缩。远期外汇窗口同比增长30%，达到20.5亿美元，它只是对单笔未来交易的对冲工具，而非解决已实现收入问题的办法。 🟡 公共部门工资支出正被自下而上地撬开，而2027年预算未能将其封堵。 9月中旬医生们达成的协议——200万瓜拉尼的统一加薪、为合同工和住院医师设定的200万瓜拉尼下限、2.6亿美元药品资金以及1,500个新岗位——现已成为其他所有卫生工会援引的模板。9月22日，全国卫生工作者联合会（FNTS）与代表45,000至49,000名非医生卫生工作者的28个组织向卫生部提出相同要求，要求加薪50%并建立卫生职业体系，并将谈判推迟至10月3日，同时继续开展动员。9月1日提交的2027年预算总额为166.3万亿瓜拉尼，且已请求国会将财政赤字上限提高至国内生产总值（GDP）的3.9%，远高于1.5%的法定上限，以清偿欠卫生供应商和道路承包商的约12.7亿美元累积欠款。2026财年已为药品专项安排2.6亿美元；2027财年安排约7.6亿美元。2026年9月达成的每一项额外统一加薪都会推高2027年的数字，而预算所假设的汇率——1美元兑6,458瓜拉尼——按美元衡量比实际通行的市场汇率坚挺约9%，前财政部长曼努埃尔·费雷拉估计这一差异相当于GDP的0.4%。 🟢 10月4日市政投票是红党内部公投，而非政策风险。在民调发布禁令生效的情况下，选举日前最后一个硬信号是收官竞选活动：卡米洛·佩雷斯以“亚松森可以改变”为口号，由副议长劳尔·拉托雷担任竞选负责人并得到奥拉西奥·卡特斯的公开支持，他将在9月28日以车队游行收尾，并声称党内领先20个百分点；索莱达·努涅斯则主打反对延续现状。最高选举法院从9月27日开始部署14,711套投票材料包，10月3日在首都完成部署。国际商界对市政选举结果没有实质性敞口，但这一结果将被解读为进入2028年之前卡特斯派与培尼亚派之间力量对比的替代指标，而这确实会影响投资激励和能源电价框架的持久性。\n\n🟡 5G的执法可信度才是关键问题。10月13日是努比科姆22个无线基站的截止期限，而目前仅有一个投入使用，且主计长发现国家电信委员会没有可核验的跟踪矩阵，这是巴拉圭频谱义务是否具有约束力的首次真正考验。总统已公开驳斥主计长，并为该运营商辩护。 答案的重要性超出努比科姆：蒂戈和个人电信刚刚接受了同样的牌照架构——技术方案90天，首个无线基站180天，四年内部署100个基站，合计8000万美元——而该频谱对他们的价值，取决于规则是否得到一视同仁的执行。"}, {"title": "八、对中资企业的专项影响与建议", "tier": 2, "events": [], "impact_analysis": "🟡 先对冲收入端，再考虑其他任何对冲。对于在巴拉圭拥有美元收入和瓜拉尼成本敞口的中国企业而言，当前最有价值的单一举措就是立即锁定远期合约。巴拉圭央行的远期窗口同比扩大30%，截至8月底达到20.5亿美元，正是因为当地出口商也得出了同样的结论；汇率已从9月初的6,000瓜拉尼上方变动至9月25日的5,880瓜拉尼。当地代理商对12月6,100瓜拉尼的预测似乎已难以实现；一些分析师如今讨论的是5,500瓜拉尼。2025年在6,300至6,600瓜拉尼汇率假设下签署的合同、工程总承包（EPC）里程碑和服务协议，在结汇时已经出现亏损。应当重新定价或重新确定计价货币。  \n🟡 将2026年10月至11月视为与公共部门在能源或数据中心领域开展任何合作的时间窗口。三重进程正在交汇。首先，巴拉圭国家电力管理局工程师提出，通过增价拍卖将数据中心、人工智能和加密挖矿的用电上限设为700兆瓦，并以56美元/兆瓦时作为底价；该方案要到2028年才会生效，且使2027年到期的现有高耗电合同仍悬而未决。 第二，政府关于新电价制度的工作组，以及新成立的能源部及行业监管机构，其成果原要求在9月初提交，现已逾期。第三，“伊瓜苏数字”项目各阶段，其中第一阶段（2亿至3亿美元，10兆瓦，2027年底）是唯一具有近期采购内容的阶段，第二阶段和第三阶段（50亿美元/400亿美元，100兆瓦/1吉瓦）只是预可行性描述。GCIE游说团体提出在18个月内将合同供电量增加数倍，以换取到2037年的十年合同和专门的人工智能电价——这一立场是资金雄厚的进入者可以认同的。但不要按照第二阶段或第三阶段的数字投入资金，也不要将2028年拍卖日期视为既定安排：这只是工会提案，并非政策。\n\n🔴 不要围绕努比科姆式的牌照假设制定计划。努比科姆案表明，纸面上的频谱义务与实际部署之间的差距可能持续整整一个牌照年度；监管机构会将一个已开通的无线基站描述为符合时间表；而行政部门会公开支持持牌人，反对本国总审计长。 无论人们在该争端中持何种立场，对供应商或合作伙伴而言，运营上的教训是，巴拉圭的频谱承诺应被视为可能随政治变化而修改的商业意向，而非可强制执行的需求。对于任何部署依赖监管宽容的运营商，应在价格、合同和风险敞口上分阶段安排。🟡 将本地内容与社区期望纳入任何东方市或上巴拉那省业务的人员配置中。这项由技术主导的新安全计划——包括100多台具备人脸和车牌识别功能的智能摄像头、四架无人机、随身摄像头、新的林塞小组总部以及45辆巡逻车——正在交付之际，当地出现了明显的犯罪潮，同一周内，明加瓜苏一家自来水公司发生1亿瓜拉尼保险箱抢劫案，东方市微型中心发生一起汽车盗窃案。该市的商业协会共同出资购置了无人机。在三国边境地区设有业务、仓库或人员的中国企业应直接与东方市商业与服务商会接触，按比例出资参与当地安全架构，并为场地加固编列预算： 这是一个预期由私营部门共同出资维护公共秩序的市场。🟢 将巴拉圭在联合国的定位作为预警信号源，而非风险事件。培尼亚9月23日在联合国大会的讲话重申了与台湾的同盟关系（“巴拉圭并非中立”），开辟了与加拉加斯的对话渠道，并呼吁由拉美人士出任联合国秘书长及改革安理会。与此同时，政府继续通过南方共同市场释放对华贸易开放信号，同时不与台北断绝关系，农业游说团体继续推动直接进入中国市场，并获得约90%的国内公众支持。外交路线目前保持稳定，2027年巴拉圭与台湾关系70周年正被筹备为经济联盟的一个里程碑。但国内经济逻辑指向一个方向，中国企业应追踪南方共同市场—中国渠道以及大豆和牛肉游说团体的立场，将其作为先行指标——而不是每年一次的联合国大会讲话，后者多年来一直保持一致。"}]}, "en": {"topic": "Paraguay Briefing", "time_span": "September 20 – September 27, 2026", "time_label": "Last week", "sections": [{"title": "I. Macroeconomic Developments", "tier": 1, "events": [{"title": "BCP Holds the Policy Rate at 5.50% for a Seventh Straight Meeting as Inflation Sits at 1.5% (2026-09-22)", "date": "2026-09-22", "source_url": "https://1000noticias.com.py/2026/09/22/bcp-mantiene-la-tasa-de-interes-en-550-anual-ante-la-baja-inflacion-y-riesgos-externos/", "source_name": "1000 Noticias / BCP", "summary": "The Central Bank of Paraguay's Monetary Policy Committee voted unanimously on 22 September to leave the benchmark rate at 5.50% annual, a seventh consecutive hold since the two 25bp cuts of January and February took it down from 6.00%. The BCP framed the decision as consistent with a neutral stance that neither stimulates nor brakes credit. Headline inflation ran at 1.5% year-on-year in August with core at 1.3%, far below the 3.5% ±2pp target, and the central bank projects a gradual climb to 3.3% by December 2026 before convergence at 3.5%. Activity remains the counterweight: the IMAEP monthly activity index is up 5.6% through July, in line with the 4.5% GDP growth forecast for 2026. The committee flagged Brent crude prices amid Middle East tensions, rising grain prices and a 'higher for longer' US Federal Reserve path as the main external risks. The next meeting is set for 23 October 2026.", "image_url": "https://1000noticias.com.py/wp-content/uploads/2026/09/banco-cenytral-del-paraguay.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Guaraní Breaks Through G. 5,900 to an Eight-Year High as the BCP Holds Its No-Intervention Line (2026-09-25)", "date": "2026-09-25", "source_url": "https://www.lanacion.com.py/negocios/2026/09/25/el-dolar-cierra-la-semana-a-la-baja-llegando-a-niveles-de-ocho-anos-atras/", "source_name": "La Nación", "summary": "The dollar closed the week of 25 September at G. 5,760 bid / G. 5,880 offered, comparable to levels last seen on 25 September 2018 and a fresh eight-year low. The slide accelerated through the week: G. 5,900 on 23 September (5,800/5,900, already the lowest of the year), then through the floor on 24 September at G. 5,780/5,890. The guaraní has appreciated roughly 25% against the dollar over twelve months, from above G. 8,000 in April 2025 and a 2026 opening above G. 6,600. Drivers cited by local analysts are a record 11-million-tonne soy harvest, foreign direct investment running above USD 1,000 million a year, guaraní-denominated sovereign bond issuance, border trade flows and roughly 100,000 new foreign residents a year. The BCP has refused to intervene in the spot market, offering forward contracts instead; forward volumes rose 30% year-on-year to USD 2,050 million by end-August. Analysts who had pencilled in G. 6,100 for December now concede that target looks out of reach, with some agents openly discussing a move toward G. 5,500 before any stabilisation.", "image_url": "https://www.lanacion.com.py/resizer/v2/D2M6KBCJLVF2VJQSG6Q47ATHD4.jpg?auth=76ac20dbb1162b89331cdf0c3f690a4e55b306df53d65b2676e57442bb523746&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Exporters Quantify the Damage: ARP Puts Livestock Losses at USD 349 Million and Cispy Demands a G. 6,300–6,600 Band (2026-09-24)", "date": "2026-09-24", "source_url": "https://www.abc.com.py/negocios/2026/09/23/dolar-en-paraguay-por-que-baja-la-cotizacion-pese-al-endurecimiento-de-tasas-de-la-fed/", "source_name": "ABC Color", "summary": "As the guaraní pushed to eight-year highs, Paraguay's export lobbies escalated their campaign against the BCP's hands-off exchange-rate policy. The Asociación Rural del Paraguay (ARP) estimated the appreciation destroyed G. 2.06 trillion — about USD 349 million — of livestock production value between September 2025 and August 2026, while the Cámara de Industrias Sustentables del Paraguay (Cispy) argued the equilibrium rate should sit between G. 6,300 and G. 6,600, roughly 7% to 12% weaker than spot. Both gremios formally asked the central bank to intervene. The BCP's answer has been the forward-contract window rather than spot purchases: forward negotiations grew 30% year-on-year to USD 2,050 million by end-August, a hedge that protects the exchange rate on a specific future operation but does nothing for already-realised revenue. The standoff matters for every dollar-earning exporter, including beef, soy and maquila operators, and marks the sharpest divergence yet between the government's disinflation success and the tradable sector's margin pressure.", "image_url": "https://www.ratioparaguay.com.py/wp-content/uploads/2025/12/692606d302b306d992e22fc3_dolar12.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Producer Prices Stall in August with the Index Down 1.7% Year-on-Year, Reinforcing the Disinflation Picture (2026-09-26)", "date": "2026-09-26", "source_url": "https://www.lanacion.com.py/negocios_edicion_impresa/2026/09/26/el-indice-de-precios-del-productor-se-estanco/", "source_name": "La Nación / BCP", "summary": "Paraguay's Producer Price Index was flat in August, with a 0.0% monthly variation, a cumulative -0.7% for the year to date and -1.7% year-on-year, according to BCP data published on 26 September. The stagnation upstream is the clearest confirmation yet that the disinflation running through the consumer index — headline CPI at 1.5% year-on-year in August, core at 1.3% — is not a one-off driven by a single volatile item but reflects genuine price weakness through the production chain. Combined with the appreciation of the guaraní, which mechanically lowers the local-currency cost of imported inputs, the reading explains why the BCP felt no pressure to move the policy rate at its 22 September meeting and why analysts cut their end-2026 inflation forecast to 3.0% in the September EVE survey. For industrial and agribusiness operators the signal is twofold: input costs are stable to falling, but so is the pricing power on output, squeezing margins from both directions in a strong-guaraní environment.", "image_url": "https://www.lanacion.com.py/resizer/v2/DCKYZJGJX5D7ROE762U3TYACJU.jpg?auth=c6974d66a7c80697537e126eb311772f2c186bbd5b7d55637d745a6f5d040b25&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}]}, {"title": "II. Political & Policy Developments", "tier": 1, "events": [{"title": "Cellphone Ban in Schools Becomes Law by Automatic Sanction After Deputies Fail to Reach Quorum (2026-09-25)", "date": "2026-09-25", "source_url": "https://www.hoy.com.py/nacionales/2026/09/25/queda-sancionada-la-ley-que-prohibe-celulares-en-las-escuelas", "source_name": "Diario HOY", "summary": "On Friday 25 September the bill banning cellphones in Paraguayan schools became law by sanción ficta — automatic sanction — after the Chamber of Deputies lost quorum and failed to act within the constitutional deadline. The law bans students from using phones, smartwatches, tablets and wireless earphones anywhere on school grounds, at any time, including breaks, and extends the prohibition to teachers and educational staff. It covers public, private and subsidised institutions from the initial level upward but excludes universities, and was diluted from the original total-prohibition text pushed by Deputy José Rodríguez into a lesser restriction in the Senate. Three exceptions apply: medical or security emergencies, planned pedagogical activities under direct teacher supervision with head-office authorisation, and accessibility support for students with disabilities. The text now sits with President Santiago Peña, who may promulgate it as is or issue a total or partial veto; the extension of the ban to adults is the provision most likely to attract a partial veto. Implementation falls to the MEC and MITIC, which must draft the enabling regulation for gradual rollout. Paraguay joins Brazil, Chile and France in restricting screens in classrooms.", "image_url": "https://www.lanacion.com.py/resizer/v2/P6CIOOKR55GBNDPGTFFXVII77E.jpg?auth=5960c986ffba7e85be6636ce7d0a103157bf1745f98cf7da919e411e6c2ac9d5&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Deputies Sanction the National Evangelical Church Day, Adding the Last Sunday of October to the School Calendar (2026-09-22)", "date": "2026-09-22", "source_url": "https://www.diputados.gov.py/noticias/noticias/2934", "source_name": "Cámara de Diputados", "summary": "The Chamber of Deputies sanctioned on 22 September the bill declaring the last Sunday of October each year as Paraguay's National Evangelical Church Day, completing congressional passage after the Senate approved it with modifications on 26 August. The original proposal set 31 October, coinciding with the Protestant Reformation, but was moved to the final Sunday of the month during Senate review. Sponsored by senators Orlando Penner, Lizarella Valiente, Blanca Ovelar and Gustavo Leite, the text instructs the Ministry of Education and Sciences (MEC) to incorporate the date into the national school calendar. The bill has been sent to the Executive for promulgation. The measure reflects the growing political weight of Paraguay's evangelical churches, a constituency that has expanded rapidly over the past two decades and now features prominently in Colorado Party electoral arithmetic ahead of the 4 October municipal vote and the 2028 general election. It is a low-cost, high-visibility concession that carries no fiscal impact.", "image_url": "https://cms.evangelicodigital.com/upload/imagenes/6ab2d6b1c2f0f_paraguaydiputadosG.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "Municipal Campaign Enters Its Final Week: Camilo Pérez Claims a 20-Point Lead in Asunción and the TSJE Begins Deploying 14,711 Ballot Kits (2026-09-27)", "date": "2026-09-27", "source_url": "https://www.latribuna.com.py/politica/2026/09/25/lt-breves-tsje-y-candidatos-ultiman-detalles-rumbo-al-4-de-octubre/", "source_name": "La Tribuna / TSJE", "summary": "With the 4 October municipal elections a week away, the campaign entered its closing phase and the electoral machinery began to move. The Superior Tribunal of Electoral Justice (TSJE) started loading 14,711 ballot kits on 27 September, with deployment beginning toward Alto Paraguay and finishing in the Capital on 3 October, using 539 medium vehicles, 130 vans and 25 heavy vehicles. In Asunción, Colorado Party candidate Camilo Pérez — running on the 'Asu puede cambiar' slogan under Lista 1, with Deputy Speaker Raúl Latorre as campaign chief and Turi Capello as deputy coordinator — is scheduled to close his campaign with a large motorcade on Monday 28 September. Latorre said internal polling gives Pérez an average lead of around 20 points in the capital, and Pérez claims a base of 81,446 votes. He met ANR president Horacio Cartes in the final stretch and received a public endorsement. Opposition candidate Soledad Núñez, of the Alianza Unidos por Asunción, is campaigning on anti-continuity, transparency, traffic, waste management and youth issues, and has demanded auditors be present. The vote will be the first nationwide electoral test since the 2023 general election and a bellwether for the internal balance of the Colorado Party ahead of 2028.", "image_url": "https://www.latribuna.com.py/resizer/v2/7ZV7KM6JOVECJKKFSAN45EPAVQ.jpeg?smart=true&auth=b5df189032da4dae8595eda95b75a8a4dcf12bbfcfee8ec9bf438f17b0d6697e&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}, {"title": "Nenecho Rodríguez Gives Soledad Núñez 24 Hours to Retract a 'Robbery' Accusation and Warns of 'Consequences' (2026-09-25)", "date": "2026-09-25", "source_url": "https://www.abc.com.py/politica/2026/09/25/molesto-por-acusacion-de-robo-nenecho-emplaza-a-soledad-nunez/", "source_name": "ABC Color", "summary": "The Asunción mayoral race took a sharply personal turn on 25 September when former mayor Óscar 'Nenecho' Rodríguez gave opposition candidate Soledad Núñez 24 hours to delete a campaign post accusing him of robbery, warning of 'consequences' if she did not. The confrontation injects the city's recent municipal administration — Rodríguez was suspended and later removed amid a corruption case over the handling of municipal bond proceeds — directly into the closing days of a campaign that had until then been fought largely on continuity versus change. It also cuts across the Colorado camp, since Rodríguez remains a polarising figure within the party while the official candidate, Camilo Pérez, campaigns on a clean-break platform with Cartes' backing. Núñez's team has framed the exchange as evidence that the outgoing administration wants to litigate rather than debate. With a poll-publication blackout in force until election day, statements like this are among the few remaining signals voters will see before 4 October.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/29db623/2147483647/strip/true/crop/765x430+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F11%2Fa2%2F6ed257fb47b6992b731effbf03b4%2Fuhpol20260926-005b-ph01-1054.jpg", "is_gov_source": false, "is_authoritative": true}]}, {"title": "III. Social & Security Landscape", "tier": 1, "events": [{"title": "Health Workers Escalate: 28 Organisations Demand a 50% Raise and a Health Career Path, Threaten a National Strike (2026-09-22)", "date": "2026-09-22", "source_url": "https://www.adndigital.com.py/trabajadores-de-salud-endurecen-protesta-y-analizan-ir-a-un-paro-nacional/", "source_name": "ADN Digital", "summary": "The Federación Nacional de Trabajadores de la Salud (FNTS) and 28 allied organisations mobilised outside the Ministry of Public Health in Asunción on 22 September, grouping biochemists, dentists, radiologists, physiotherapists, obstetricians and anaesthetists — a base of roughly 45,000 to 49,000 workers. Their demands are a 50% salary adjustment and implementation of the long-promised carrera sanitaria (health career ladder); they argue pay has been frozen for 14 years and has lost about 77% of its purchasing power. The protest temporarily closed Avenida Silvio Pettirossi and marched toward Congress, where leaders discussed calling a national strike and even shutting down laboratories. Representatives met newly appointed Health Minister Isaías Fretes, who cited budget constraints; negotiations were adjourned to 3 October while the mobilisations continue. The dispute is the direct sequel to the doctors' conflict that cost former minister María Teresa Barán her job in mid-September and forced a G. 2,000,000 flat raise for physicians — a settlement that non-physician health staff now cite as the precedent justifying their own claim. The fiscal cost of extending an equivalent raise across some 45,000-plus workers is precisely the pressure the 2027 budget does not accommodate.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/103643a/2147483647/strip/true/crop/1599x899+0+83/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F42%2Fd1%2F82e0754b481e9a679a0cfe458ecf%2Fhuelga-de-trabajadores-de-la-salud-1.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Interior Ministry Launches a Technology-Driven Security Plan for Ciudad del Este with Drones, Facial Recognition and 45 New Patrol Cars (2026-09-24)", "date": "2026-09-24", "source_url": "https://www.hoy.com.py/nacionales/2026/09/24/policia-lanza-plan-de-seguridad-para-contrarrestar-incesante-delincuencia-en-cde", "source_name": "Diario HOY", "summary": "Interior Minister Enrique Riera and National Police commander César Silguero presented the 'Plan de Seguridad para la Capital Departamental' in Ciudad del Este on 24 September, alongside Alto Paraná governor César 'Landy' Torres and the local chamber of commerce. The plan's core is technology: deeper integration with the 911 system including a new Ciudad del Este call centre due in November, an expanded video-surveillance grid of more than 100 smart cameras with facial and licence-plate recognition, geo-positioning of police resources, four donated drones (three covering the city centre, one at police headquarters, with 3,000-metre altitude and roughly 30 km range), body cameras for Grupo Lince motorcycle units, portable radios for the GEO tactical unit, and a 'Botón Lince' panic button. The force reinforcement adds 45 patrol vehicles and 40 officers plus motorcycles and 25 walkie-talkies. The same event inaugurated the new Grupo Lince tactical motorcycle headquarters on the Alto Paraná governorate site, a ground-plus-two-floor building for more than 80 officers to be completed within about 45 days. Riera separately announced a USD 92 million three-year police modernisation programme covering 500 patrol cars, 10,000 weapons and vests and 16 new police headquarters. The plan responds to a sustained crime wave in Alto Paraná — a water distributor in Minga Guazú was robbed of a safe, a shotgun and a pickup just before the presentation, and a car was stolen in the Ciudad del Este micro-centre.", "image_url": "https://www.lanacion.com.py/resizer/v2/X5VKDRCLLJD7BJRPMQQ3EBZBTY.jpg?auth=469f4a0a30210fb7df1e87ccd353c12061c8f455b004b6874e37b86fc805168d&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Operation Aurelia Dismantles a Gold-Trafficking Ring Routing Amazon Gold to Turkey via Panama, Seizing USD 7 Million and Jailing Four (2026-09-25)", "date": "2026-09-25", "source_url": "https://www.lanacion.com.py/pais/2026/09/24/operativo-aurelia-tras-serie-de-allanamientos-detienen-a-cuatro-personas-por-trafico-de-oro/", "source_name": "La Nación / Fiscalía", "summary": "On 24 September police and prosecutors executed Operation Aurelia, roughly eight to ten simultaneous raids across Asunción and the Central department — including the Carmelitas and Manorá neighbourhoods, Ypané, Limpio, Fernando de la Mora, Luque and Silvio Pettirossi International Airport — against an international gold-smuggling and money-laundering network. Four people were detained: Jessica Carolina Aguilera Riquelme (36, Paraguayan), Ali Kaied (19, Syrian-Paraguayan), Walid Kadhim (53, Swedish-Iraqi, with prior Brazilian record for irregular gold transport) and Karol Magalí Núñez Alarcón (23, Paraguayan). The alleged ringleader, Iraqi national Laith Alzayek, a 20-year resident of Paraguay with prior records for ingot theft in Turkey and contraband in Brazil, remains at large, with between three and nine further arrest warrants outstanding. The scheme moved high-purity (~99%) gold from illegal mines in the Brazilian Amazon through Paraguay as a transit country, then on to Panama and Dubai before reaching Istanbul on commercial flights, following an Asunción–Panamá–Estambul route with a return leg via Dubai and São Paulo. Investigators are probing links to Brazil's PCC and Comando Vermelho. Assets worth an estimated USD 7 million were seized, including luxury vehicles, multiple currencies, jewellery, weapons, precision scales, spectrometers and electronics. A judge ordered preventive detention for the four on 25 September on contraband and criminal-association charges. The case traces back to two earlier airport seizures of 22 kg in November 2025 and 27 kg in April 2026.", "image_url": "https://www.lanacion.com.py/resizer/v2/Q3SCUM4SDJEJHGBXBN42W53JGQ.png?auth=4d76a9c75fca4655297cf0d012a8b1e010cc8d966a00c3c5609ba24e2fcff071&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Armed Gang Steals a Safe and a Pickup from a Minga Guazú Water Company as Alto Paraná's Robbery Wave Continues (2026-09-24)", "date": "2026-09-24", "source_url": "https://www.lanacion.com.py/pais/2026/09/24/policia-analiza-imagenes-de-cctv-tras-robo-de-caja-fuerte-y-vehiculo-a-empresa/", "source_name": "La Nación", "summary": "Three to four armed men assaulted the Seltz water company in Minga Guazú, Alto Paraná, overpowering security guard Gabriel Paredes Miranda and escaping with a safe containing close to G. 100 million, a Mitsubishi Montero pickup and a shotgun. The vehicle was later found abandoned in Ciudad del Este; police are reviewing CCTV footage under prosecutor Osvaldo Zaracho. The robbery was one of a string of incidents across the department in the same week: a daylight motochorro robbery of roughly G. 11 million from a payment kiosk in J. Augusto Saldívar, an assault in Mariano Roque Alonso by three men posing as anti-narcotics police who robbed an 88-year-old woman and her grandson of G. 500,000 and two phones, and a recycler shot twice and hospitalised after being robbed of G. 15 million in Remansito, Villa Hayes. The pattern — small, violent, low-risk crews operating with impunity in the country's second economic pole — is what the new Ciudad del Este security plan is designed to reverse, and explains why business associations in Alto Paraná have been the loudest voices demanding the technology-led response.", "image_url": "https://www.lanacion.com.py/resizer/v2/DWJSZY55YNEWZK5UBQQCCGZOEE.jpg?auth=c83ad7ecb99c48532fbadef9f61308a374030116f6ff07b5d8979f202931083b&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}]}, {"title": "IV. International Relations & Diplomacy", "tier": 1, "events": [{"title": "Peña at the UN General Assembly: Security Council Reform, a Latin American Secretary-General, and Free Elections in Venezuela, Cuba, Nicaragua and Haiti (2026-09-23)", "date": "2026-09-23", "source_url": "https://www.hoy.com.py/nacionales/2026/09/23/venezuela-apertura-de-ormuz-y-apoyo-a-taiwan-el-discurso-de-pena-en-la-onu", "source_name": "Diario HOY / United Nations", "summary": "Addressing the General Debate of the 81st UN General Assembly in New York on 23 September, President Santiago Peña called for the next UN Secretary-General to come from Latin America and the Caribbean, and argued the Security Council must be reformed because it is 'directed by only a few' and 'must stop being a pretty photograph of the world of 1945'. He defended his recent visit to Caracas — made despite suspended diplomatic relations — as opening a dialogue channel aimed at a democratic transition and Venezuela's eventual reintegration into the international community and Mercosur, insisting 'I did not go to Venezuela to validate a regime', and called for free elections in Venezuela, Cuba, Nicaragua and Haiti. He urged an immediate halt to hostilities and full freedom of navigation through the Strait of Hormuz and Bab el-Mandeb, warning of the food and energy security consequences for the most vulnerable. On artificial intelligence he said AI must serve human dignity rather than replace it, and that human responsibility over decisions must be preserved. The overarching message was that 'people no longer want slogans, they want solutions', paired with domestic achievements he cited as proof: investment grade, falling unemployment and a historic reduction in poverty. Peña also thanked Taiwan's authorities, who publicly acknowledged the support.", "image_url": "https://www.lanacion.com.py/resizer/v2/BLSL5YICZFCDVGT6WQVPK2NEFE.jpg?auth=fe09cdb05166dba0b55e2ccbdde7e83d89e7b51f9f52554c8da92ea6f945cac3&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Taiwan Thanks Paraguay for UN Backing as Peña Meets TaiwanICDF in New York to Advance the Yguazú Digital AI Project (2026-09-24)", "date": "2026-09-24", "source_url": "https://www.lanacion.com.py/politica/2026/09/24/autoridades-de-taiwan-agradecen-respaldo-de-pena-en-discurso-ante-la-onu/", "source_name": "La Nación", "summary": "Taiwanese authorities including President Lai Ching-te publicly thanked Paraguay after Peña's UN General Assembly speech, in which he reiterated support for Taiwan's participation in the UN and its specialised agencies and said Paraguay 'is not neutral' on the Taiwan Strait. The endorsement was reinforced the previous day in a bilateral meeting in New York between Peña and Yun Lin Huang, secretary-general of the TaiwanICDF, at which the president described the 'strategic alliance' as strengthening and focused on the Yguazú Digital project — a 50/50 Paraguay–Taiwan joint venture modelled on Itaipú's governance, with Paraguay contributing land and hydroelectric power and Taiwan contributing computing capacity and semiconductors. TaiwanICDF support is directed at digital transformation, technology and talent formation. Paraguay remains South America's only country with diplomatic relations with Taipei, a tie dating to 1957, and the two will mark 70 years of relations in 2027. Industry and Commerce Minister Marco Riquelme has defended the alliance on the grounds that preferential access to the Taiwanese market — zero tariffs on numerous products including pork and wheat flour — builds productive capabilities before Paraguay pursues wider markets.", "image_url": "https://www.lanacion.com.py/resizer/v2/MLWGXZSHJ5CDVG7ULCR4IZCZQI.jpg?auth=5fa31335f0d361642a5b01dd9aaebef7d3fbb145d05153ee18404215b8027fa9&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Mercosur's Internal Split on EU Export Quotas Persists: Paraguay Holds to a 25% Equal Split as the Bloc Weighs First-Come, First-Served (2026-09-22)", "date": "2026-09-22", "source_url": "https://www.ultimahora.com/sugieren-fortalecer-cadenas-de-valor-para-negociar-cupos-con-ue", "source_name": "Última Hora", "summary": "The Mercosur–EU agreement is signed, ratified by all four members and in provisional application since 1 May 2026, but the bloc remains deadlocked on how to divide the export quotas Brussels granted. Paraguay proposes an equal 25% split for each member across a volume close to 100,000 tonnes; Argentina and Uruguay want quotas allocated on historical export averages to Europe; Brazil favours weighting by each country's share of world trade. At an informal foreign ministers' meeting in Montevideo the Paraguayan chancellor Rubén Ramírez Lezcano held the 25% line, and his Uruguayan counterpart Mario Lubetkin conceded there is 'no unanimity', noting that without agreed quotas the volumes are filled on a first-come, first-served basis. Economist Aldo Centurión illustrated the asymmetry with the beef Hilton quota of roughly 60,000 tonnes, where Argentina holds 29,389 tonnes, Brazil 10,000 and Paraguay just 1,000, and recommended negotiating product by product and strengthening value chains, targeting a gradual 15% share within five years and 20% within ten. Chancellors set a further in-person meeting in Montevideo in 45 to 60 days, ahead of the Mercosur Summit scheduled for 3–4 December in Uruguay. For Paraguayan exporters the practical stake is whether the country, which accounts for under 1% of Mercosur exports to the EU, gets a guaranteed slice or must compete on arrival order.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/40597a4/2147483647/strip/true/crop/777x437+0+60/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F8d%2F65%2Fd36148854ef7b486018a1057718a%2Fcarne-vacuna-jpg.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay Keeps the Door Open to Trade with China Without Breaking with Taiwan, as Farm Exporters Press for Direct Access (2026-09-24)", "date": "2026-09-24", "source_url": "https://www.newsofbahrain.com/world/136451.html", "source_name": "News of Bahrain / AFP", "summary": "Paraguayan officials reiterated that the country is willing to establish commercial relations with China without severing diplomatic ties to Taiwan, a formula Beijing has consistently rejected since it requires recognition of the One China principle. Foreign Minister Rubén Ramírez Lezcano has said Paraguay is open to a trade arrangement, and President Peña has described himself as 'completely open' to a commercial agreement pursued through Mercosur rather than bilaterally — a route that sidesteps the diplomatic question but is slow and requires consensus among all four members. The pressure is domestic and structural: soy and beef exporters cannot sell directly to China, which has nonetheless become Paraguay's largest supplier of goods, accounting for more than a third of imports, so the trade relationship runs heavily in China's favour with no offsetting export channel. One cited survey indicates close to 90% of Paraguayans would support a rapprochement with Beijing. The 2027 seventieth anniversary of Paraguay–Taiwan relations is being framed by the government as the moment to convert that tie into a full economic, technological and productive alliance, which is the political answer to the exporter lobby's arithmetic.", "image_url": "https://www.newsofbahrain.com/admin/post/upload/A_j2CJKksUiG_2026-07-01_1782898105resized_pic.jpg", "is_gov_source": false, "is_authoritative": true}]}, {"title": "V. Industry Focus: Telecom, Digital Energy & AI", "tier": 1, "events": [{"title": "Nubicom's 13 October Deadline Looms with a Single Radiobase on Air out of the 22 Required, as the Comptroller Warns of Possible Licence Revocation (2026-09-25)", "date": "2026-09-25", "source_url": "https://dplnews.com/paraguay-nubicom-debe-desplegar-22-radiobases-octubre/", "source_name": "DPL News / CONATEL / CGR", "summary": "Nubicom Paraguay S.A. must have at least 22 5G radiobases in service nationwide by 13 October 2026, the first anniversary of the licence awarded on 13 October 2025, and by CONATEL's own account the operator has exactly one operational base station, located at the Teisa data centre in Villa Morra, Asunción, serving a limited internet footprint. CONATEL director Víctor Martínez says deployment is gradual by nature, that the tender does not require subscribers in the opening months, and that compliance will be formally verified in October — even suggesting preliminary indications point to Nubicom exceeding the requirement. The Comptroller General's Office (CGR), conducting a Fiscalización Especial Inmediata into the award and operation, takes a different view: it found no sufficient evidence of deployment beyond one base station and the core network, and no detailed, measurable, up-to-date tracking mechanism at CONATEL — no matrix identifying the 22 sites, their location, progress, dates or beneficiary districts. The CGR stopped short of declaring non-compliance but called it a 'warning sign' evidencing weak control and traceability, and added that it could not verify Nubicom's claimed 100,000 Argentine subscribers or the minimum USD 10 million net worth required by the tender. It urged CONATEL to strengthen oversight, noting that eventual breach should trigger sanctioning procedures including revocation or rescission; Comptroller Camilo Benítez said the definitive report would come after October. President Peña has publicly discredited the Comptroller and defended the company as compliant with the tender. Nubicom's award, together with Claro's, came in the 2025 first auction of the 3.5 GHz band that excluded Huawei supply — a condition both Tigo and Personal declined to accept at the time.", "image_url": "https://dplnews.com/wp-content/uploads/2025/10/dplnews_nubicom_mc31025.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "ANDE Engineers Propose Capping Data Centres, AI and Crypto Mining at 700 MW Awarded by Ascending Auction with a USD 56/MWh Floor (2026-09-22)", "date": "2026-09-22", "source_url": "https://www.abc.com.py/economia/2026/07/22/ingenieros-de-ande-proponen-subasta-de-precios-y-limitar-energia-a-700-mw-a-criptomineras-y-data-centers/", "source_name": "ABC Color / UIA-ANDE", "summary": "The Union of ANDE Engineers (UIA) proposed limiting the total contractable power for 'converging industries' — data centres, AI and crypto mining — to 700 MW, roughly 10% of Paraguay's installed capacity, allocated through an ascending price auction with a floor of USD 56 per MWh, composed of USD 44 technical tariff plus USD 12 compensation for energy ceded to Brazil, on contracts of three to five years. Under that schedule the new framework would not take effect until 2028, after the 700 MW tranche is tendered; existing electro-intensive operators hold contracts expiring in 2027. The proposal lands in a policy vacuum: the government approved decrees 5306 and 5307 in January 2026 setting special tariffs of USD 26 to USD 32 per MWh for up to 15 years for high-consumption groups, then adjusted them in April through decrees 5860 and 5861, which capped 'Energy to X' projects at 250 MW, and finally repealed them altogether in June under pressure from ANDE's Sitrande union and technical sectors that argued the state was losing more than USD 40 per MWh. In parallel the government created a working group to redesign the tariff regime, plus a new Ministry of Energy and a supervisory regulator, with tariff clarity requested for early September. The Group of Special Intensive Consumption (GCIE) — crypto miners and AI data centres — is asking to extend contracts to ten years, out to 2037, and for a dedicated AI tariff, offering to multiply contracted power within 18 months if given predictability. The British firm Atome is treated as a distinct case, recognised as an existing customer under a 2022 PPA carrying roughly USD 33/MWh at 220 kV for its USD 665 million, 145 MW green fertiliser plant at Villeta.", "image_url": "https://www.ratioparaguay.com.py/wp-content/uploads/2026/07/6a6113cb59551e8c67dc0112_data-center2.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Yguazú Digital's Three Phases: USD 250 Million for a 10 MW Sovereign AI Centre, Then USD 5 Billion, Then USD 40 Billion and 1 GW (2026-09-24)", "date": "2026-09-24", "source_url": "https://www.bnamericas.com/en/news/paraguay-deepens-taiwan-ties-on-data-centers-and-ai", "source_name": "BNamericas", "summary": "The Paraguay–Taiwan Yguazú Digital venture, structured as an equal 50/50 partnership modelled on Itaipú's governance, is being presented in three escalating phases. Phase 1 requires USD 200 to 300 million for a 10 MW sovereign AI centre for government use — hospital records, tax registries, surveillance — with operation targeted for late 2027. Phase 2 would take USD 5,000 million and 100 MW of consumption, under 2% of national electricity, with an impact the government equates to 10% of GDP. Phase 3 is a USD 40,000 million investment consuming 1,000 MW — nearly five times the capacity of Acaray (210 MW) and approaching one and a half Itaipú turbines (each 700 MW). The pitch rests on Paraguay's surplus hydroelectricity: Bloomberg has highlighted the country as Latin America's only one whose electricity is 100% renewable, thanks to Itaipú and Yacyretá, at USD 0.055/kWh residential and USD 0.046/kWh business against world averages of USD 0.176 and USD 0.164. The objections are technical and human. Energy expert Victorio Oxilia Dávalos warns transmission networks are broadly saturated and ANDE's expansion plans are behind schedule, recommending data centres be sited at strategic nodes near Itaipú or the Yguazú and Valenzuela substations. The Paraguayan Society for Artificial Intelligence has called the proposal a 'delirium' for want of human capital. The government simultaneously faces controversy over the Atome tariff case. Separately, South Korean firm Ainocean signed a deal with the Itaipú Technology Park on 3 September for an AI education data centre with long-term plans to scale to 1 GW.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/4b10f08/2147483647/strip/true/crop/3552x1998+0+223/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F4f%2F52%2Fa0aaaf804f4ba6c9e3c761ffce4c%2Fvictorio-oxilia-docente-politecnica-46916341.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "UNA Orders Preventive DNS and IP Blocking and Gives CONATEL and the Four ISPs 24 Hours to Enforce It (2026-09-25)", "date": "2026-09-25", "source_url": "https://www.una.py/comunicado-oficial-del-rectorado-de-la-una-25-09-2026", "source_name": "Universidad Nacional de Asunción", "summary": "The National University of Asunción (UNA) issued a formal communiqué on 25 September ordering the preventive blocking, via DNS and IP, of domains and URLs named in a judicial ruling, from within Paraguayan territory. The rectorate notified CONATEL on an urgent basis and instructed the country's internet service providers — Copaco, Tigo, Personal and Claro — to implement the restriction technically within a maximum of 24 hours. The Public Ministry's Specialised Cybercrime Unit and the National Police's Cybercrime Department opened investigations to identify and sanction the authors, accomplices and accessories. UNA said it would exhaust all legal and administrative avenues to eradicate digital violence and protect the rights of its members. The episode is a live test of how fast, and how completely, Paraguay's four-operator access market can execute a court-ordered takedown, and it sets a precedent for content-blocking requests that will apply equally to the operators tracked in Section VI. It also puts CONATEL in the position of coordinating enforcement across private networks on a legally sensitive matter, an area where the regulator is simultaneously being criticised for not updating its own transparency portal since March under law 5282/14.", "image_url": "https://www.una.py/wp-content/uploads/2026/09/Portada-COMUNICADO-25_SEPT_2026.png", "is_gov_source": true, "is_authoritative": true}]}, {"title": "VI. Key Client Developments", "tier": 1, "events": [{"title": "Tigo/Millicom Commits a Further USD 500 Million Over Five Years to 'Digital Highways' and Completes the Sale-Leaseback of 281 Towers to Atis Group (2026-09-22)", "date": "2026-09-22", "source_url": "https://www.telesemana.com/blog/2026/08/19/el-organo-de-competencia-de-paraguay-aprobo-la-venta-de-281-torres-de-millicom-a-atis/", "source_name": "Telesemana / Millicom", "summary": "Tigo announced an additional USD 500 million investment over the next five years to strengthen its 'digital highways', timed around the visit to Paraguay of then Millicom CEO Mauricio Ramos and the company's 30 years in the country. The figure sits alongside a USD 100 million financing package from IDB Invest and Proparco supporting Millicom's fibre-coverage expansion and mobile network modernisation across Bolivia, Colombia, El Salvador, Guatemala, Honduras, Panama and Paraguay. On the passive infrastructure side, Paraguay's competition authority CONACOM approved in August the acquisition by Atis Group of 281 towers from Lati Paraguay, Millicom's infrastructure unit, under a 15-year sale-and-leaseback that leaves Tigo using the network while adding a commitment to build at least 200 further towers over 15 years for onward sale to Atis. Strategically, Millicom has narrowed to connectivity, infrastructure and data after divesting Tigo Money, with CEO Marcelo Benítez stating in May that 'the towers, antennas and electrical equipment are already 5G-ready' and pointing to the s
