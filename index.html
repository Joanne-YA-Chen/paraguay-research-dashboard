<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paraguay Briefing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#F0F4FF;color:#1E293B;line-height:1.6;min-height:100vh}
a{color:#3B82F6;text-decoration:none}a:hover{text-decoration:underline}
.header{background:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;border-bottom:3px solid #3B82F6}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;flex-shrink:0}
.header-left h1{font-size:20px;font-weight:700;color:#1E293B}
.header-left .subtitle{font-size:12px;color:#64748B;margin-top:2px}
.header-right{display:flex;gap:8px;align-items:center}
.btn-lang{background:#EEF2FF;color:#4F46E5;font-weight:700;font-size:12px;padding:8px 14px;border-radius:20px;border:none;cursor:pointer}
.btn-lang:hover{background:#E0E7FF}
.btn-primary{background:#3B82F6;color:#fff;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-primary:hover{background:#2563EB;transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.3)}
.btn-secondary{background:#F1F5F9;color:#475569;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:#E2E8F0}
.btn-sm{font-size:11px;padding:6px 12px}
.update-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:moFade .2s}
.update-modal{background:#fff;border-radius:14px;padding:24px 28px;width:440px;max-width:90vw;box-shadow:0 24px 80px rgba(0,0,0,.25);animation:moZoom .25s}
.update-modal h3{font-size:17px;font-weight:700;color:#1E293B;margin-bottom:16px}
.update-modal label{display:block;font-size:12px;font-weight:600;color:#64748B;margin-bottom:4px}
.update-modal select,.update-modal input{width:100%;padding:8px 12px;border:1px solid #CBD5E1;border-radius:8px;font-size:13px;margin-bottom:14px;color:#1E293B;background:#fff}
.update-modal .btn-row{display:flex;gap:8px;justify-content:flex-end}
.time-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.time-preset{padding:5px 12px;border-radius:14px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #CBD5E1;background:#fff;color:#64748B;transition:all .12s}
.time-preset:hover,.time-preset.active{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.history-list{max-height:300px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid #E2E8F0;border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.history-item:hover{background:#F8FAFC;border-color:#CBD5E1}
.history-item .hi-title{font-weight:600;font-size:13px;color:#1E293B}
.history-item .hi-meta{font-size:11px;color:#94A3B8}
.history-item .hi-count{font-size:11px;font-weight:600;color:#3B82F6;background:#EEF2FF;padding:2px 8px;border-radius:10px}
.loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid #CBD5E1;border-top-color:#3B82F6;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.standalone-banner{background:#FEF3C7;color:#92400E;text-align:center;padding:6px 16px;font-size:12px;border-bottom:1px solid #FDE68A;display:none}
.standalone-banner code{background:#FDE68A;padding:1px 5px;border-radius:3px;font-size:11px}

.stats-row{max-width:1400px;margin:0 auto;padding:12px 32px 16px;display:flex;flex-direction:column;gap:8px}
.stats-row-total{display:flex;justify-content:center}
.stats-row-sections{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:768px){.stats-row-sections{grid-template-columns:repeat(2,1fr)}}
.stat-pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;cursor:pointer;transition:all .2s;border:2px solid transparent;font-size:13px;font-weight:600;user-select:none;min-width:0}
.stat-pill:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.pill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pill-label{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-count{font-size:14px;font-weight:700;margin-left:auto;flex-shrink:0;background:rgba(255,255,255,.5);padding:1px 8px;border-radius:10px}
.stat-pill.pill-total{background:#1E293B;color:#fff;font-weight:700;border-radius:24px;display:inline-flex}
.stat-pill.pill-total .pill-count{background:rgba(255,255,255,.2)}

.content{max-width:1400px;margin:0 auto;padding:0 32px 60px}
.section{background:#fff;border-radius:14px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden;border-top:4px solid #3B82F6}
.section.s0{border-top-color:#3B82F6}.section.s1{border-top-color:#EF4444}.section.s2{border-top-color:#10B981}
.section.s3{border-top-color:#8B5CF6}.section.s4{border-top-color:#06B6D4}.section.s5{border-top-color:#F59E0B}
.section.s6{border-top-color:#6366F1}.section.s7{border-top-color:#EC4899}.section.tier2{background:#FAFBFC}
.section-header{padding:16px 22px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-header h2{font-size:16px;font-weight:700;color:#1E293B}
.section-header .badge{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;background:#F1F5F9;color:#64748B;white-space:nowrap}
.section-desc{padding:4px 22px 10px;font-size:12px;color:#94A3B8}
.events-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 22px 18px}
@media(max-width:860px){.events-grid{grid-template-columns:1fr}.event-card{flex-direction:column}.event-card .event-img{width:100%!important;min-height:120px;max-height:180px}}
.event-card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;transition:all .2s;display:flex}
.event-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-1px);border-color:#CBD5E1}
.event-card .event-img{width:160px;min-height:140px;flex-shrink:0;position:relative;overflow:hidden}
.event-card .event-img img{width:100%;height:100%;object-fit:cover;display:block}
.event-card .event-img .img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.event-card .event-body{padding:12px 15px;flex:1;min-width:0;display:flex;flex-direction:column}
.event-card .event-meta{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.event-card .event-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.event-tag.date{background:#F1F5F9;color:#64748B}.event-tag.gov{background:#DCFCE7;color:#15803D}
.event-tag.auth{background:#DBEAFE;color:#1D4ED8}.event-tag.source{background:#FEF3C7;color:#A16207}
.event-tag.client{background:#FCE7F3;color:#BE185D}
.event-card .event-preview{font-size:13px;color:#334155;line-height:1.6;flex:1;overflow:visible;max-height:none}
.event-card .event-link{font-size:11px;margin-top:6px;color:#3B82F6;font-weight:500}
.analysis-body{padding:4px 22px 20px;font-size:13px;line-height:1.8;color:#334155}
.analysis-body h3{font-size:15px;font-weight:700;margin:14px 0 6px;color:#1E293B}
.analysis-body ul{padding-left:0;list-style:none}
.analysis-body li{padding:2px 0 2px 18px;position:relative}
.analysis-body li::before{content:"•";position:absolute;left:2px;color:#3B82F6;font-weight:bold}
.tier-divider{text-align:center;padding:16px 0 8px;margin:8px 0}
.tier-divider span{background:linear-gradient(135deg,#3B82F6,#6366F1);color:#fff;padding:8px 28px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(59,130,246,.25)}
.footer{text-align:center;padding:20px 32px 40px;color:#94A3B8;font-size:12px;max-width:1400px;margin:0 auto}
.macro-dashboard{background:#fff;border-radius:14px;margin-bottom:18px;padding:16px 22px 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-top:4px solid #1E293B}
.macro-title{font-size:15px;font-weight:700;color:#1E293B;margin-bottom:2px}
.macro-period{font-size:11px;font-weight:400;color:#94A3B8;margin-left:6px}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media(max-width:900px){.macro-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.macro-grid{grid-template-columns:1fr}}
.macro-card{background:#F8FAFC;border-radius:8px;padding:10px 8px 4px;border:1px solid #E2E8F0}
.macro-card-title{font-size:10.5px;font-weight:600;color:#475569;margin-bottom:4px;text-align:center;line-height:1.3;min-height:28px;display:flex;align-items:center;justify-content:center}
.macro-card{position:relative}
.macro-source{position:absolute;top:6px;right:8px;font-size:7.5px;color:#94A3B8;font-weight:500;background:#fff;padding:1px 5px;border-radius:3px;border:1px solid #E2E8F0;z-index:1;pointer-events:none}
.macro-latest{display:flex;justify-content:center;align-items:baseline;gap:4px;margin-top:2px;padding:3px 0}
.macro-latest-label{font-size:9px;color:#94A3B8;font-weight:500}
.macro-latest-val{font-size:15px;font-weight:700;color:#1E293B}
.macro-latest-unit{font-size:9px;color:#64748B;font-weight:500}
.macro-latest-date{font-size:9px;color:#94A3B8}
.macro-note{font-size:9px;color:#94A3B8;margin-top:1px}
.macro-card{cursor:pointer;transition:transform .15s,box-shadow .15s}
.macro-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.macro-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:moFade .2s}
.macro-modal-card{background:#fff;border-radius:16px;padding:24px 28px 18px;width:680px;max-width:94vw;max-height:90vh;overflow-y:auto;cursor:default;box-shadow:0 24px 80px rgba(0,0,0,.25);position:relative;animation:moZoom .25s}
.macro-modal-card .macro-card{border:none;padding:0;background:transparent;cursor:default}
.macro-modal-card .macro-card:hover{transform:none;box-shadow:none}
.macro-modal-card .macro-card-title{font-size:15px;min-height:auto;margin-bottom:10px}
.macro-modal-card .macro-legend,.macro-modal-card [style*=legend]{font-size:11px!important}
.macro-modal-close{position:absolute;top:10px;right:16px;font-size:26px;cursor:pointer;color:#94A3B8;background:none;border:none;line-height:1;z-index:10;padding:4px 8px;border-radius:6px}
.macro-modal-close:hover{color:#475569;background:#F1F5F9}
.macro-data-section{margin-top:14px;border-top:1px solid #E2E8F0;padding-top:10px}
.macro-data-toggle{background:#F8FAFC;border:1px solid #CBD5E1;padding:6px 16px;border-radius:6px;font-size:12px;color:#64748B;cursor:pointer;font-weight:500}
.macro-data-toggle:hover{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.macro-data-table-wrap{margin-top:10px;max-height:340px;overflow-y:auto;border:1px solid #E2E8F0;border-radius:8px}
.macro-data-table{width:100%;border-collapse:collapse;font-size:12px}
.macro-data-table th{background:#F8FAFC;padding:7px 12px;text-align:right;font-weight:600;color:#475569;border-bottom:2px solid #E2E8F0;position:sticky;top:0}
.macro-data-table th:first-child{text-align:left}
.macro-data-table td{padding:5px 12px;text-align:right;border-bottom:1px solid #F1F5F9;color:#334155;font-variant-numeric:tabular-nums}
.macro-data-table td:first-child{text-align:left;color:#64748B;font-weight:500}
.macro-data-table tbody tr:hover td{background:#EEF2FF}
.macro-na{color:#CBD5E1!important}
@keyframes moFade{from{opacity:0}to{opacity:1}}
@keyframes moZoom{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:768px){.header{padding:14px 16px}.header-left h1{font-size:16px}.stats-row{padding:10px 14px;gap:6px}.stat-pill{padding:8px 12px;font-size:12px}.pill-label{font-size:11px}.content{padding:0 12px 40px}.section-header{padding:12px 14px 0}.events-grid{grid-template-columns:1fr;padding:4px 14px 14px}}
</style>
</head>
<body>

<div class="standalone-banner" id="standaloneBanner">Offline mode · Run <code>python3 web_app.py</code> for live updates</div>

<header class="header">
  <div class="header-left"><div class="header-logo">PY</div><div><h1>巴拉圭简报</h1><div class="subtitle" id="headerSubtitle"></div></div></div>

<script>

window.EMBEDDED_BRIEFINGS = {"zh": {"topic": "巴拉圭简报", "time_span": "July 4 – July 11, 2026", "tiers": [{"name": "第一部分：关键新闻与动态", "description": "巴拉圭宏观经济、政治、社会保障、国际关系、行业及关键客户动态"}, {"name": "第二部分：分析与建议", "description": "企业影响评估及针对中国的战略建议"}], "sections": [{"title": "一、宏观经济动态", "description": "GDP增长、通货膨胀、汇率、货币政策、财政状况、主要行业表现", "tier": 1, "events": [{"title": "国际货币基金组织预测巴拉圭2026年GDP增长率为4.4%，几乎为地区平均水平的两倍（2026年7月9日）", "date": "2026-07-09", "source_url": "https://www.lanacion.com.py/negocios/2026/07/09/pese-a-menor-expansion-de-la-economia-mundial-paraguay-crecera-casi-el-doble-segun-el-fmi/", "source_name": "La Nación / IMF", "summary": "国际货币基金组织（IMF）2026年7月《世界经济展望》更新报告预测，巴拉圭2026年GDP增长率为4.4%，几乎是拉丁美洲和加勒比地区平均水平（2.4%）的两倍。IMF强调，巴拉圭100%的可再生能源结构、强劲的大豆产量以及审慎的宏观经济管理是主要驱动力。增长得益于稳健的私人消费、信贷扩张以及大规模的外商直接投资（FDI）项目。", "image_url": "https://www.lanacion.com.py/resizer/v2/3X37YKS6FNBOLFINO2ZR6BG4TQ.jpg?auth=295b5b432110ac99f0ebbacc3b1cb1f8ca120d2ab9fda06584fe452761f140f9&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "BCP连续第四个月维持政策利率5.50%不变；下次会议定于7月23日（2026年7月10日）举行", "date": "2026-07-10", "source_url": "https://www.itau.com.br/itaubba-pt/analises-economicas/latam/paraguay-bcp-on-hold-again-at-5-50-as-expected", "source_name": "Itaú BBA / BCP", "summary": "巴拉圭央行(BCP)维持基准利率在5.50%不变，这是自2026年2月以来连续第四次按兵不动。6月CPI环比下降0.28%，年通胀率仅为2.09%，远低于3.5%的目标水平。BCP下一次货币政策会议定于7月23日举行。市场共识预计利率将在年底前维持在5.50%，实际事前利率（2.0%）处于中性区间。", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "瓜拉尼保持强势地位：美元/巴拉圭瓜拉尼汇率在6,060–6,200区间，年初至今对美元贬值8.56%（2026年7月10日）", "date": "2026-07-10", "source_url": "https://www.latribuna.com.py/negocios/economia/2026/07/09/el-guarani-sigue-fuerte-ante-el-dolar-y-tendencia-se-mantiene-hasta-fin-de-ano/", "source_name": "La Tribuna / Clarín", "summary": "瓜拉尼兑美元继续走强，7月10日汇率为1美元兑6060-6200瓜拉尼。年初至今，美元兑瓜拉尼已下跌8.56%（从2025年底的6628瓜拉尼）。巴拉圭中央银行（BCP）的经济变量预期调查（EVE）预测年底汇率为1美元兑6475瓜拉尼。主要驱动因素包括强劲的农业出口和能源外汇流入、金融体系流动性充足以及全球美元疲软。分析师建议BCP不要进行人为干预。", "image_url": "https://www.latribuna.com.py/resizer/v2/NZK24PDXVZAQPHI7GCM5GSYI3U.JPG?smart=true&auth=aa956079a7b1885f0324ed080589125adacf737b318e87b2c552897be8b36b53&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}, {"title": "MEF预测2026年GDP增长4.2%，连续第四年超过4%，但财政赤字将超出目标（2026-07-10）", "date": "2026-07-10", "source_url": "https://www.ultimahora.com/el-fmi-pidio-cuentas-completas", "source_name": "Última Hora / MEF / IMF", "summary": "经济部长奥斯卡·洛韦拉确认2026年GDP增长预期为4.2%，这将是连续第四年增长率超过4%。然而，国际货币基金组织6月29日的第四条磋商警告称，由于累积国内欠款（建筑企业2.2亿美元、制药行业约10亿美元）的规范化处理，财政赤字将超过1.5%的目标。国际货币基金组织预计要到2028年才能将赤字收敛至1.5%，并呼吁公共账目完全透明。国家税收总局上半年税收收入仅增长2.1%，远低于9%的预算目标；总统培尼亚已下令下半年加强征收力度。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/bfe1bc3/2147483647/strip/true/crop/3108x3108+0+0/resize/100x100!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F28%2F30%2Fcdd7e90c4b54abaecbdf925eded0%2Frodrigo-ibarrola.JPG", "is_gov_source": false, "is_authoritative": true}, {"title": "2026年上半年进口增长近10%，受强势瓜拉尼和世界杯消费提振（2026年7月10日）", "date": "2026-07-10", "source_url": "https://infonegocios.com.py/amp/y-ademas/importadores-cierran-primer-semestre-con-un-crecimiento-cercano-al-10-estiman-incremento-igual-o-superior-para-la-segunda-mitad-del-ano", "source_name": "InfoNegocios", "summary": "巴拉圭进口领域（不含燃料）在2026年上半年消费品增长近10%，得益于汇率稳定、本币瓜拉尼走强以及6月世界杯带动的消费热潮。电子产品、家电、汽车及大众消费品为主要增长品类。受年末补货需求推动，该领域预计下半年将保持同等或更高增速。4月贸易数据显示，进口额达15.899亿美元（同比增长13.7%），出口额为15.926亿美元（同比增长20.5%），实现270万美元的微弱贸易顺差。", "image_url": null, "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "二、政治与政策变化", "description": "重大立法、政策调整、外资监管、税制改革、投资激励措施", "tier": 1, "events": [{"title": "政府修改“零饥饿”法令：将学校供餐采购分配调整为7%直接生产者/3%加工品（2026年7月10日）", "date": "2026-07-10", "source_url": "https://www.hoy.com.py/nacionales/2026/07/09/medicos-anuncian-huelga-en-agosto-salud-blindara-servicios-criticos", "source_name": "Ministerio de Desarrollo Social", "su : "MTESS正式确定最低工资上调5%至3,044,000瓜拉尼，自7月1日起生效；新小时工资及行业工资标准已公布（2026-07-09）", "date": "2026-07-09", "source_url": "https://www.ip.gov.py/ip/2026/07/09/mtess-reglamenta-reajuste-de-salarios-para-trabajadores-del-sector-privado-y-rige-desde-el-1-de-julio/", "source_name": "Agencia IP / MTESS", "summary": "劳动部（MTESS）发布第670/2026号决议，正式依据第6225号法令将最低工资上调5%。新的月最低工资为3,044,000瓜拉尼（扣除9%社保缴费后净额为2,770,040瓜拉尼），日最低工资为117,077瓜拉尼。每个子女的家庭补贴也提高至152,200瓜拉尼。各行业最低工资标准同步更新。雇主若未遵守规定，将面临每名受影响员工10至30天日最低工资的罚款。", "image_url": "https://www.ip.gov.py/ip/wp-content/uploads/2025/01/obreros-mujeres-fabrica-trabajadores-trabajo-empleo.jpeg", "is_gov_source": true, "is_authoritative": true}, {"title": "医生工会宣布将于8月24日至28日举行全国罢工，要求加薪74.8%；卫生部将保障关键医疗服务（2026年7月9日）", "date": "2026-07-09", "source_url": "https://www.hoy.com.py/nacionales/2026/07/09/medicos-anuncian-huelga-en-agosto-salud-blindara-servicios-criticos", "source_name": "Diario HOY", "summary": "全国医生工会（Sinamed）近乎全票通过，决定于2026年8月24日至28日举行全国罢工，要求将74.8%的加薪幅度纳入2027年国家预算。工会指出，自2012年以来，基本工资500万瓜拉尼（约合650美元）相对于最低工资已大幅贬值，变得\"难以忍受\"。卫生部长和经济部长表示缺乏财政可行性。卫生部承诺将保障急诊室、重症监护室、紧急手术和救护车等关键服务。", "image_url": "https://www.lanacion.com.py/resizer/v2/PDWKSZCPUNDXLDDT5XCG5VAL6A.jpg?auth=1512391132b72a2e61d7d035edccfab4bccdb1a3eee03a245941350a70e489df&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "康塞普西翁冷藏厂工人在劳动部抗议：每周仅工作5-6小时，月薪低至50万瓜拉尼（2026年7月10日）", "date": "2026-07-10", "source_url": "https://conexionparaguay.com/nota/8216/crisis-en-frigorifico-concepcion", "source_name": "Conexión Paraguay", "summary": "约200名来自Frigorífico Concepción的工人在亚松森劳工部外抗议，谴责工时大幅缩减（每周仅5-6小时），月收入低至50万瓜拉尼（约合65美元），远低于最低工资标准。该公司曾承诺在低产期保障最低工资支付，但未能兑现。该肉类加工厂正深陷财务危机，屠宰业务量显著萎缩。", "image_url": "https://conexionparaguay.com/uploads/noticias/2/2026/07/20260710081017_images.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭河驳船爆炸致5名工人死亡；据报道该公司拖欠工资2-3个月（2026年7月8日）", "date": "2026-07-08", "source_url": "https://www.hoy.com.py/nacionales/2026/07/08/explosion-de-barcaza-empresa-arrastra-atraso-en-pago-de-salarios-denuncian", "source_name": "Diario HOY", "summary": "隶属于Grupo Líneas Panchita G S.A.的一艘驳船在亚松森南海岸的巴拉圭河上发生爆炸，导致五名正在进行清洁作业的工人死亡。家属反映该公司已拖欠工资2至3个月，外包工人也报告了欠薪及不稳定的工作条件。多名员工表示因无法养家糊口被迫辞职。", "image_url": "https://www.lanacion.com.py/resizer/v2/TWWSFNYM2JFIJBBNYLMJ336Y2A.jpeg?auth=bcb1a08da8f12972b56bc5da5b482c5bc01757039723625bf0a5049ce076a15c&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "安全强化：皮拉尔市911应急中心启用；巴里奥·奥布雷罗巡逻加强；卡萨帕一名警察遭枪击（2026年7月10日）", "date": "2026-07-10", "source_url": "https://www.ultimahora.com/ministerio-del-interior-implementa-centro-de-seguridad-y-emergencias-911-en-pilar-tras-hechos-delictivos", "source_name": "Última Hora / Frontera Seca News", "summary": "内政部在皮拉尔（涅恩布库省）设立新的911安全与应急中心，此前阿尔韦迪发生一起暴力抢劫未遂案，七名武装分子冒充警察突袭。阿尔韦迪每班仅四名警察执勤。亚松森奥布雷罗区已加强巡逻，社区反响积极。一名警察在圣胡安-内波穆塞诺（卡萨帕省）行动中肘部中弹；两名有犯罪前科的嫌疑人被捕。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/6cca5c4/2147483647/strip/true/crop/1440x810+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F59%2F64%2F980a248a4000914b5f2ad1d156d3%2F741948356-3030696707139795-9114224492124918491-n.jpg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "四、国际关系与外交动态", "description": "巴拉圭与大国关系、南共市动态、两岸关系、多边参与", "tier": 1, "events": [{"title": "巴拉圭完成历史性首批禽肉出口至台湾：150吨已启运，目标每月500吨（2026年7月8日）", "date": "2026-07-08", "source_url": "https://www.latribuna.com.py/negocios/economia/2026/07/08/paraguay-concreta-el-primer-envio-de-carne-aviar-a-taiwan/", "source_name": "La Tribuna", "summary": "巴拉圭完成对台湾首批禽肉出口：来自Granja Avícola La Blanca S.A.公司的150吨鸡肉，预计每月出口量可达500吨。总统培尼亚称其为\"历史性里程碑\"，并体现了两国间的\"深厚友谊\"。台湾地区代表指出，台湾地区每年进口鸡肉超过25万吨。此次出口标志着在2027年建交70周年之际，巴拉圭与台湾地区经济合作开启新篇章。", "image_url": "https://www.latribuna.com.py/resizer/v2/ZODQOBMZIJBDPI4DOQDIGV6IXY.jpeg?smart=true&auth=b5d17f5ebfbbf24976699d834e130ae42ff9997a43f1c78084459abffceac984&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}, {"title": "欧盟-南方共同市场配额争端升级：巴拉圭要求固定分配25%，培尼亚称现行制度\"不公平且不可接受\"（2026年7月6日）", "date": "2026-07-06", "source_url": "https://www.euractiv.com/news/eu-trade-deal-sparks-quota-tug-of-war-inside-mercosur-bloc/", "source_name": "Euractiv / BSS News", "summary": "欧盟-南方共同市场自贸协定配额分配争议持续升级。巴拉圭要求按产品类别固定分配25%的配额，认为现行\"先到先得\"制度偏向巴西和阿根廷。总统培尼亚形容该协定对巴拉圭而言\"滋味苦涩\"，指出内陆国家面临更高物流成本。乌拉圭不到一个月就用完60%以上大米配额；阿根廷一季度用掉80%蜂蜜配额。巴拉圭将配额问题与FOCEM结构趋同基金挂钩，要求获得更多基础设施补偿。", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭参议院重申要求外交部提供《部队地位协定》细节；反对派就美军豁免权提出宪法关切（2026年7月9日）", "date": "2026-07-09", "source_url": "https://www.ultimahora.com/senado-reitera-pedido-al-mre-sobre-detalles-del-acuerdo-sofa", "source_name": "Última Hora", "summary": "巴拉圭参议院再次要求外交部提供与美国签署的《部队地位协定》的详细信息。参议员何塞·奥维耶多（反对派）在5月8日初步回应被认为\"不充分\"后推动此项动议。主要关切包括：美军人员享有豁免权却无对等保障、免税条款、无线电频谱使用权，以及可能违反宪法第30、137、141和144条的问题。外交部须在10天内作出回应。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/a810375/2147483647/strip/true/crop/2944x1656+0+156/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fdc%2Fb3%2F0bb9cc7f47c895773f44185441c1%2Frvr-3665-68339335.JPG", "is_gov_source": false, "is_authoritative": true}, {"title": "南方共同市场峰会启动与日本贸易谈判，释放未来与中国对话信号；巴拉圭强化\"贸易可谈，不与台湾断交\"立场（2026年7月6日）", "date": "2026-07-06", "source_url": "https://www.tribuneindia.com/news/world/mercosur-leaders-defend-unity-amid-global-tensions-launch-new-trade-talks/", "source_name": "Tribune India / BSS News", "summary": "在7月1日于卢克举行的南方共同市场峰会上，该集团启动了与日本的正式贸易谈判，并释放出未来将与中国进行谈判的信号。乌拉圭接任轮值主席国。巴拉圭外长鲁本·拉米雷斯重申，巴拉圭对与中国开展贸易持开放态度，\"前提是不对与台湾的外交关系施加任何条件\"。巴西总统卢拉敦促南方共同市场与中国进行谈判，这给巴拉圭——南美洲唯一未与中国建交的国家——带来了更大压力。德国外长承认，在欧盟与南方共同市场协议全面批准之前，仍存在\"需要解决的问题\"。", "image_url": "https://www.tribuneindia.com/sortd-service/imaginary/v22-01/jpg/large/high?url=dGhldHJpYnVuZS1zb3J0ZC1wcm8tcHJvZC1zb3J0ZC9tZWRpYTg2ZGY3OGIwLTc2MTEtMTFmMS1hZmFlLTJkNzNlMTMwYzExYi5qcGc=", "is_gov_source": false, "is_authoritative": true}, {"title": "美台巴拉圭三方虚拟代表团探索可再生能源、电动汽车及智能电网机遇（2026年7月2日）", "date": "2026-07-02", "source_url": "https://hk.crntt.com/doc/1060/7/8/9/106078940_2.html", "source_name": "CRNTT / MIC Paraguay", "summary": "7月2日，一场虚拟商业机会任务汇集了美国、台湾和巴拉圭工商部的代表，共同探讨在可再生能源（绿色氢能、太阳能）、电动汽车及零部件、智能配电与储能系统方面的三方投资机会。该任务是深化美国-台湾-巴拉圭三方在人工智能、5G和网络安全领域合作框架的一部分。", "image_url": "http://hkpic.crntt.com/upload/202105/7/106078942.jpg", "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "五、行业聚焦：电信、数字能源与人工智能", "description": "5G频谱与商用部署、光纤基础设施、数字能源投资、AI数据中心建设、行业监管", "tier": 1, "events": [{"title": "巴拉圭第二次5G频谱拍卖启动：Tigo和Personal竞标2.3GHz/3.7GHz频段，最低投资4000万美元（2026年7月10日）", "date": "2026-07-10", "source_url": "https://www.telesemana.com/blog/2026/07/10/paraguay-avanza-con-la-segunda-subasta-5g-y-tigo-y-personal-aceptan-las-reglas-contra-equipos-de-origen-chino/", "source_name": "TeleSemana / BNamericas / DPL News", "summary": "CONATEL已开启2026年01号公开招标，这是巴拉圭第二次5G频谱拍卖。Tigo（Millicom）和Personal（阿根廷电信）已提交投标书——两家公司此前因中国设备限制抵制了2025年拍卖。待拍频谱包括：2.3GHz频段（每100MHz区块底价160万美元）和3.7GHz频段（底价100万美元）。最低投资承诺为4000万美元，用于从可信供应商处采购安全网络基础设施，且需兼容5G NR R15+标准。CONATEL将于下周公布通过资格预审的投标人名单。针对中国供应商（华为/中兴）的限制措施仍然有效。", "image_url": "https://www.telesemana.com/wp-content/uploads/2024/12/5G-Paraguay-1-e1733258458809.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "巴拉圭数字基础设施：光纤达18,000公里，星链设备部署1,600套，全国免费WiFi点404个（2026-07-09）", "date": "2026-07-09", "source_url": "https://www.lanacion.com.py/negocios/2026/07/09/el-crecimiento-economico-de-paraguay-impulsara-la-transformacion-del-sector-digital-en-2026/", "source_name": "La Nación / MITIC / DPL News", "summary": "MITIC报告了关键数字基础设施指标：国家光纤网络（RNFO）已达18,000公里；Copaco与MITIC正在为农村学校和医疗中心部署1,600套Starlink卫星设备，Copaco计划将覆盖范围扩大至8,000所学校；全国免费WiFi已覆盖所有市镇的404个公共场所；一座新的三级国家数据中心正在建设中。截至2025年底，互联网普及率已达68%的家庭（2023年为52%），2024至2025年间，互联网服务提供商在基础设施上的投资超过1.8亿美元。政府云平台NubePy已服务于113家公共机构。", "image_url": "https://www.lanacion.com.py/resizer/v2/FYOMPWF2EJHI7IA6NHQDHP4ZVY.jpg?auth=c38325e14e60cdcdb27ac0afed212a7c5594e9a15eefff026ee1b11188bee43e&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "HIVE Digital 计划在巴拉圭新增100兆瓦水电设施，目标2026年算力达35 EH/s，高性能计算/人工智能业务增长5倍（2026年7月8日）", "date": "2026-07-08", "source_url": "https://www.hivedigitaltechnologies.com/news/hive-digital-technologies-targets-35-ehs-in-2026-with-newly-signed-100-mw-hydroelectric-expansion-in-paraguay-and-a-5x-growth-in-hpc-and-ai-operations-through-strategic-partnerships-with-bell-canada/", "source_name": "HIVE Digital Technologies (NASDAQ)", "summary": "HIVE Digital Technologies（纳斯达克：HIVE）宣布在巴拉圭新增100兆瓦水电扩容项目，作为其2026年实现35 EH/s比特币挖矿产能目标的一部分，同时通过与加拿大贝尔公司的战略合作，推动高性能计算（HPC）和人工智能（AI）业务实现5倍增长。该公司已在巴拉圭运营约300兆瓦的一级数据中心，并于2026年第一季度推出BUZZ Cloud AI平台（三级数据中心，位于亚松森），而位于伊泰普附近的400兆瓦Yguazú三期项目预计于2026年第三季度投入运营。", "image_url": "https://www.hivedigitaltechnologies.com/static/hivesite/images/banner.webp", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭-台湾AI数据中心合资项目推进：一期（10MW）进展中，三期目标1GW，打造\"全球最大AI中心\"（2026-07-09）", "date": "2026-07-09", "source_url": "https://www.ferrere.com/en/news/paraguay-strengthens-its-positioning-for-data-centers-ai-and-advanced-energy/", "source_name": "Ferrere / Agencia IP", "summary": "巴拉圭持续推进其作为区域人工智能基础设施枢纽的定位。巴拉圭与台湾各占50%股份的人工智能数据中心合资企业正稳步推进，一期工程（10兆瓦）已启动，后续将扩展至二期（100兆瓦），并最终实现三期（约1吉瓦）。第5306/2026号法令为人工智能和云计算领域提供以美元计价的特惠电价，合同期限为15年。X8 Cloud的巨型项目（预计30年内投资100亿至500亿美元）将成为南美洲最大的人工智能数据中心综合体。美洲开发银行正为数字基础设施现代化项目提供1.3亿美元融资。", "image_url": "https://www.ferrere.com/public/html/img/share.png", "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "六、主要客户动态", "description": "跟踪巴拉圭主要电信客户的战略动向、投资计划、网络部署及技术选型", "tier": 1, "events": [{"title": "Claro — 首个商用5G，初始投资3500万美元，2026年借助诺基亚基础设施将覆盖范围扩展至亚松森以外（2026-07-10）", "date": "2026-07-10", "source_url": "https://www.bnamericas.com/en/news/paraguay-greenlights-claro-and-nubicom-to-ignite-5g-race", "source_name": "BNamericas / SAMENA", "summary": "Claro（América Móvil）于2025年12月在巴拉圭启用了首个商用5G网络，初期投资3500万美元，由诺基亚作为独家设备供应商。目前覆盖范围包括大亚松森、东方市、恩卡纳西翁、科罗内尔奥维耶多和佩德罗胡安卡瓦列罗。总经理阿尔弗雷多·阿尔卡拉兹确认，2026年将继续扩展至更多地区。Claro在2025年8月的拍卖中以200万美元许可费获得3.5GHz频段200MHz频谱，需每100MHz部署100个基站，其中10%服务于政府机构。Claro在巴拉圭移动市场排名第三，拥有约94.7万互联网用户。", "image_url": "https://cdnimg.bnamericas.com/POjyKcsMosNhPZELKycnexVTCIJVYkuGWGwnoaKLyxfeXJXJIBUyjNZapDzARxCo.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Claro"}, {"title": "Tigo — 在抵制2025年拍卖后参与第二次5G竞标；获IDB Invest+Proparco 1亿美元融资及7700万美元本地债券支持（2026-07-10）", "date": "2026-07-10", "source_url": "https://www.telesemana.com/blog/2026/07/10/paraguay-avanza-con-la-segunda-subasta-5g-y-tigo-y-personal-aceptan-las-reglas-contra-equipos-de-origen-chino/", "source_name": "TeleSemana / BNamericas / BID Invest", "summary": "Tigo（Millicom，市场领导者，拥有316万用户，市场份额47.3%）于7月10日提交了巴拉圭第二次5G拍卖的投标——这是其因中国设备限制抵制2025年拍卖后的重大战略逆转。Tigo获得了IDB Invest+Proparco 1亿美元私募债券（2026年3月）支持，用于巴拉圭等7个国家的4G/4.5G/5G及光纤扩展，并发行了历史性的7700万瓜拉尼计价本地债券（2026年1月）。Tigo持续推进FTTH扩展和3G向4G迁移。Millicom 2026年第一季度业绩显示，有机服务收入增长4.9%，调整后EBITDA利润率为43.2%。", "image_url": "https://www.telesemana.com/wp-content/uploads/2024/12/5G-Paraguay-1-e1733258458809.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo"}, {"title": "个人业务——参与第二次5G拍卖，在保持低成本定位的同时加速光纤到户扩张（2026-07-10）", "date": "2026-07-10", "source_url": "https://dplnews.com/tigo-personal-se-postulan-segunda-licitacion-5g-paraguay/", "source_name": "DPL News / BNamericas", "summary": "Personal（Núcleo S.A.，阿根廷电信子公司，拥有166万用户，市场份额35.5%）在2025年弃权后，也进入了第二次5G拍卖。该运营商正与Tigo一起积极扩展FTTH网络，以支持亚松森日益增长的科技初创企业生态系统（金融科技、农业科技、物流）。Personal专注于低成本市场，覆盖范围主要集中在城市地区，在亚松森以外的存在感较弱。参与5G拍卖表明，该运营商认识到不参与5G将面临失去其市场第二位置的风险，尤其是在Nubicom的5G部署仍处于停滞状态的情况下。", "image_url": "https://dplnews.com/wp-content/uploads/2026/06/Gemini_Generated_Image_2s4av12s4av12s4a-1024x572.png", "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal"}, {"title": "Nubicom——5G牌照正在接受调查；自2025年8月获得200MHz频谱以来，未见任何部署进展报告（2026-07-10）", "date": "2026-07-10", "source_url": "https://www.bnamericas.com/en/news/tigo-personal-bid-for-5g-spectrum-in-paraguay-auction", "source_name": "BNamericas", "summary": "Nubicom（阿根廷萨尔塔固网运营商）在2025年8月的拍卖中赢得200MHz的3.5GHz频谱，并宣布投资2亿美元从零开始建设巴拉圭最大的5G网络。然而十个月后，该公司报告部署进度为零，并因涉嫌未遵守参与要求而面临审计总署（CGR）的调查。Nubicom被要求在六周内成立本地子公司——目前尚不清楚是否完成。由于缺乏移动基础设施基础且无网络建设报告，Nubicom履行5G承诺的能力日益受到质疑。", "image_url": "https://cdnimg.bnamericas.com/bkdIGnUmfDWaddMMzYYwvGPHJhRMldDnODwuZJAsHSMHGKhPYJrVJhLHEQoEhbrb.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom"}], "impact_analysis": "", "user_notes": ""}, {"title": "七、对企业经营的综合影响分析", "description": "综合宏观趋势、行业动态及客户动向，从成本、市场、合规维度分析企业影响", "tier": 2, "events": [], "impact_analysis": "## 一、成本维度 🟡\n\n成本压力呈现分化态势，汇率波动对各行业产生不同影响：\n\n- **汇率影响**：瓜拉尼持续走强，汇率维持在6,060–6,200瓜拉尼/美元（年初至今下跌8.56%）。对于以瓜拉尼计价成本（本地薪资、服务）且以美元计收的企业，利润率持续承压。依赖进口的行业（电信设备、电子产品、数据中心硬件）受益于更便宜的进口投入品，部分抵消了其他成本压力。\n- **劳动力成本**：5%的最低工资上调（7月1日起生效，每月3,044,000瓜拉尼）与通胀基本持平（6月CPI同比2.09%），使实际单位劳动力成本保持稳定。然而，医生工会要求74.8%的涨幅，预示着公共部门潜在的工资压力可能外溢。各行业最低工资标准也已更新，需进行合规审查。\n- **能源成本**：第5307号法令（Atome购电协议）的废止给第5306/2026号法令确立的特殊电价框架带来不确定性。虽然人工智能/数据中心电价暂时维持不变，但国家电力管理局工会成功行使否决权表明，大型工业用户的能源定价在政治上具有可争议性。依赖长期固定价格美元电力合同的企业应模拟政策逆转风险。\n- **税收与财政压力**：国家税务与海关总局上半年收入仅增长2.1%，而预算目标为9%。培尼亚总统已下令下半年加强征收力度。鉴于财政赤字超过1.5%的目标（国际货币基金组织预计要到2028年才能实现收敛），企业应准备应对潜在的新税收执法措施，包括加强转让定价审查和进口估值调整。\n\n## 二、市场维度 🟢\n\n巴拉圭市场机遇显著扩大，尤其在数字基础设施和制造业领域：\n\n- **5G设备与服务市场**：2026年7月10日国家电信委员会第二次5G拍卖，Tigo和Personal参与其中，开启新一轮采购周期。每家运营商最低投资承诺4,000万美元，网络设备和服务总潜力超过8,000万美元。两家运营商必须使用非中国供应商（诺基亚、爱立信、三星为潜在受益方）。这为设备供应商、铁塔公司、光纤回传提供商和系统集成商创造了机遇。\n- **巴西制造业转移**：巴西制造商加速迁往巴拉圭（劳动力成本低30-50%，能源便宜2.8倍），带动工业园区开发、物流基础设施和B2B服务需求。加工贸易制度（增值税1%）现已有363多家企业入驻，2026年预计8万居留申请者中64%为巴西人。\n- **人工智能与数据中心供应链**：HIVE的100兆瓦扩建、台湾-巴拉圭人工智能合资项目（10兆瓦→1吉瓦）以及X8 Cloud的大型项目持续驱动以下需求：电气设备（变压器、不间断电源、开关柜）、冷却解决方案、光纤连接、网络安全服务以及数据中心建设/工程总承包。美洲开发银行1.3亿美元的数字基础设施融资提供了额外采购机会。\n- **欧盟市场准入不确定性**：欧盟-南方共同市场自贸协定配额争端尚未解决。巴拉圭要求25%固定分配，而非\"先到先得\"制度，这既带来风险（若巴拉圭失去配额份额），也蕴含机遇（若改革成功）。出口导向型农业和食品加工企业应关注配额谈判结果。\n\n## 三、合规维度 🟡\n\n合规环境呈现进展与新兴摩擦并存态势：\n\n- **劳动合规**：劳动、就业和社会保障部已正式确立新的最低工资标准，并配有明确执法机制（WhatsApp投诉热线，每名受影响工人罚款10-30天最低工资）。康塞普西翁冷库抗议和驳船爆炸劳动违规事件表明下半年劳动监察将加强。企业应立即完成薪资合规审查。\n- **投资便利化**：投资者通行证（工商部第0283/2026号决议）和更新后的移民要求持续简化外资进入流程。四条明确路径（生产性投资7万美元起、金融工具20万美元起、房地产20万美元起、旅游15万美元起），投资者签证5个工作日内签发。申请量激增（一季度同比增长85%）验证了该计划的吸引力。\n- **政策逆转风险**：第5307号法令（Atome购电协议）的废止构成重要先例：一项提供长期能源价格确定性的总统令在工会压力下被撤销。这提高了依赖特殊监管待遇的资本密集型项目的风险溢价。企业应在项目协议中加入政治风险条款，并超越行政部门开展多元化倡导。\n- **部队地位协定与国防合规**：参议院再次要求提供部队地位协定细节，并对豁免权、免税、频谱使用等宪法问题表示关切，表明立法机构对外国军事合作的积极性日益增强。国防相关行业的企业应关注部队地位协定批准进程。\n\n## 总体评估\n\n本周对24个事件（7个来自政府来源，10个来自权威媒体）的监测描绘了巴拉圭处于转折点的图景：宏观经济基本面依然强劲（国际货币基金组织预测增长4.4%，通胀率2.09%，穆迪和标普授予投资级评级），但三种紧张态势正在加剧——（1）国际货币基金组织指出的财政赤字透明度缺口，（2）Atome法令废止所开创的政策逆转先例，以及（3）考验巴拉圭在南方共同市场内影响力的欧盟-南方共同市场配额分配冲突。对电信/数字行业最具深远影响的发展是Tigo和Personal进入第二次5G拍卖，这将巴拉圭移动市场格局从两家运营商竞争（Claro + 停滞的Nubicom）转变为真正具有竞争力的三到四家运营商角逐。"}, {"title": "八、对中资企业的专项影响与建议", "description": "针对中国企业在巴拉圭经营或考虑进入巴拉圭市场的专项风险与机遇分析", "tier": 2, "events": [], "impact_analysis": "## 一、风险警示\n\n🔴 **高优先级：**\n\n- **第二次拍卖中5G设备排除制度化**：Tigo和Personal在7月10日第二次5G拍卖中接受非中国设备规则，标志着决定性时刻。两家运营商此前正是因这些限制抵制2025年拍卖，如今却\"别无选择\"——确认华为/中兴排除已结构性嵌入巴拉圭电信监管框架。随着所有四家运营商（Claro、Tigo、Personal及停滞的Nubicom）在此规则下运营，中国供应商排除已从一次性拍卖条件转变为事实上的永久行业标准。Tigo和Personal合计超8000万美元的最低投资，代表中国设备供应商完全无缘的市场机遇。\n- **美台巴三方架构深化**：7月2日可再生能源、电动汽车和智能电网领域的美台巴虚拟商务代表团，结合《部队地位协定》（参议院审议中但持续推进）及台湾家禽出口里程碑，展示出日益制度化的三方框架，系统性地将中国企业排除在敏感基础设施领域之外。这已非临时安排，而是涵盖国防、数字和能源领域的连贯战略架构。\n- **中巴外交僵局固化**：外长拉米雷斯7月1日在南方共同市场发表\"贸易可以，与台湾断交不行\"声明，加上总统培尼亚将家禽对台出口定性为\"历史性友谊\"，表明外交现状已根深蒂固。巴西卢拉推动南方共同市场-中国谈判增加压力，但短期内未动摇巴拉圭立场。中国企业不应预期外交正常化成为近期市场准入改善的催化剂。\n\n🟡 **中优先级：**\n\n- **政策稳定性风险**：第5307号法令（Atome绿色氢能购电协议）的废止开创先例，即便确立长期能源定价的总统令也可被推翻。对于评估巴拉圭资本密集型项目（能源、基础设施、制造业）的中国企业，这引入了超越传统主权/信用风险分析的新维度政策风险。ANDE工会对能源政策的影响是需监测的具体因素。\n- **货币升值影响**：瓜拉尼年内升值8.56%，意味着在巴拉圭有业务的中国企业以瓜拉尼计价的利润兑换人民币时缩水。企业应评估现有对冲策略是否足以应对持续强势瓜拉尼情景（BCP EVE调查预测年底汇率为6475瓜拉尼/美元）。\n- **财政执法风险**：DNIT上半年收入缺口（实际2.1% vs 预算9%）及培尼亚下令加强下半年征收，可能转化为更激进的税务审计，尤其针对进口估值实践和转让定价——中国贸易和制造企业历来受审查的领域。\n\n## 二、机遇分析\n\n🟢 **可操作机遇：**\n\n- **巴拉圭数字建设中的非设备角色**：虽然电信设备准入受阻，更广泛的数字基础设施建设为中国企业在非核心设备领域创造切入点：(a) 数据中心电气设备供应（变压器、UPS、配电盘、母线槽）；(b) AI数据中心冷却和暖通空调解决方案（HIVE的400MW Yguazú园区、台湾合资企业10MW→1GW）；(c) 补充水电的太阳能+储能混合系统；(d) 数据中心建设/EPC服务；(e) 光纤电缆和无源基础设施组件。\n- **巴西搬迁溢出效应**：巴西制造商迁往巴拉圭的浪潮创造工业机械、生产线设备和工厂自动化系统需求——中国供应商在这些领域具有全球竞争力。中国设备制造商可服务在巴拉圭设厂的巴西企业，无需直接参与巴拉圭政府采购。\n- **农业技术**：巴拉圭经济仍以农业为驱动（GDP增长由大豆、牛肉、现对台家禽出口引领）。中国农业技术解决方案——精准农业传感器、无人机作物监测、智能灌溉、冷链物流和食品加工设备——可最小化政治摩擦进入市场。\n- **绿色氢能供应链（非购电协议依赖）**：尽管Atome购电协议被废止，基本面（水电盈余、第5307/2026号法令Power-to-X框架）仍具吸引力。中国电解槽制造商可为未来项目周期布局，无需项目开发商所需的同等政策确定性。\n\n## 三、战略建议\n\n**立即行动（2026年7月）：**\n- 完成所有巴拉圭员工的最低工资合规审查（基于7月1日调整）。核实工资单、IPS缴款（9%）和家庭补贴是否反映新的3,044,000瓜拉尼最低工资及更新的行业特定费率。\n- 评估外汇风险：瓜拉尼年内升值8.56%，BCP EVE预测年底汇率为6475瓜拉尼/美元，评估对现有本币收入财务影响，若未建立对冲工具则考虑采用。\n- 关注CONATEL第二次5G拍卖资格预审公告（预计7月13日当周），识别各运营商目标具体频谱块及采购时间表。\n\n**短期（1-3个月）：**\n- 梳理Tigo和Personal 5G部署供应链（每家最低4000万美元）：铁塔公司、光纤回传、电力系统、土建工程。瞄准中国企业可竞争且不触发安全审查的非设备领域。\n- 接洽HIVE Digital、台巴AI合资企业及X8 Cloud项目开发商，寻求数据中心基础设施供应机会（电气、冷却、建设）。通过区域子公司或拉美参考项目定位。\n- 跟踪全国医生罢工（8月24-28日）对劳资关系的更广泛影响。大规模公共部门罢工成功可能鼓舞其他工会，改变针对外国雇主的政治氛围。\n\n**中期（3-12个月）：**\n- 评估南方共同市场间接进入策略：随着欧盟-南方共同市场自贸协定临时生效及南方共同市场-日本贸易谈判启动，在巴西或阿根廷已有业务的中国企业可借助这些框架间接进入巴拉圭市场。\n- 研究第5307号法令废止先例对中国能源和基础设施投资的影响。制定针对巴拉圭监管逆转风险的政治风险缓解框架，包括立法锚定（超越行政令）、多利益相关方联盟建设及国际仲裁条款。\n- 为最终绿色氢能/Power-to-X项目管线布局。尽管Atome受挫，巴拉圭5GW水电盈余仍是结构性资产。中国电解槽及辅助设备供应商应现在建立技术存在和本地合作伙伴关系。\n- 密切关注南方共同市场-中国贸易谈判进展。若巴西成功启动正式南方共同市场-中国谈判，巴拉圭将面临前所未有的压力重新考虑外交立场——这可能是12-24个月内为中国企业解锁更广泛市场准入的潜在转折点。"}]}, "en": {"topic": "Paraguay Briefing", "time_span": "July 4 – July 11, 2026", "tiers": [{"name": "Part I: Key News & Developments", "description": "Macro economy, politics, social security, international relations, industry, and key client movements in Paraguay"}, {"name": "Part II: Analysis & Recommendations", "description": "Enterprise impact assessment and China-specific strategic recommendations"}], "sections": [{"title": "I. Macroeconomic Developments", "description": "GDP growth, inflation, exchange rate, monetary policy, fiscal position, key industry performance", "tier": 1, "events": [{"title": "IMF projects Paraguay GDP growth at 4.4% for 2026, nearly double the regional average (2026-07-09)", "date": "2026-07-09", "source_url": "https://www.lanacion.com.py/negocios/2026/07/09/pese-a-menor-expansion-de-la-economia-mundial-paraguay-crecera-casi-el-doble-segun-el-fmi/", "source_name": "La Nación / IMF", "summary": "The IMF's July 2026 World Economic Outlook update projects Paraguay's GDP growth at 4.4% for 2026, nearly double the Latin America and Caribbean average of 2.4%. The IMF highlights Paraguay's 100% renewable energy matrix, strong soybean production, and prudent macroeconomic management as key drivers. Growth is supported by resilient private consumption, expanding credit, and large-scale FDI projects.", "image_url": "https://www.lanacion.com.py/resizer/v2/3X37YKS6FNBOLFINO2ZR6BG4TQ.jpg?auth=295b5b432110ac99f0ebbacc3b1cb1f8ca120d2ab9fda06584fe452761f140f9&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "BCP holds policy rate at 5.50% for fourth consecutive month; next meeting set for July 23 (2026-07-10)", "date": "2026-07-10", "source_url": "https://www.itau.com.br/itaubba-pt/analises-economicas/latam/paraguay-bcp-on-hold-again-at-5-50-as-expected", "source_name": "Itaú BBA / BCP", "summary": "The Central Bank of Paraguay (BCP) maintained the benchmark interest rate at 5.50%, marking the fourth consecutive hold since February 2026. June CPI fell 0.28% month-on-month with annual inflation at just 2.09%, well below the 3.5% target. The BCP's next monetary policy meeting is scheduled for July 23. Market consensus expects rates to remain at 5.50% through year-end, with the real ex-ante rate (2.0%) within the neutral range.", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "Guaraní maintains strong position: USD/PYG at 6,060–6,200, down 8.56% YTD against the dollar (2026-07-10)", "date": "2026-07-10", "source_url": "https://www.latribuna.com.py/negocios/economia/2026/07/09/el-guarani-sigue-fuerte-ante-el-dolar-y-tendencia-se-mantiene-hasta-fin-de-ano/", "source_name": "La Tribuna / Clarín", "summary": "The guaraní continues its strengthening trend against the dollar, trading at PYG 6,060–6,200 per USD on July 10. Year-to-date the dollar has fallen 8.56% against the guaraní (from PYG 6,628 at end-2025). The BCP's Survey of Economic Variable Expectations (EVE) projects year-end exchange rate at PYG 6,475. Key drivers include robust agro-export and energy foreign currency inflows, adequate financial system liquidity, and global dollar weakness. Analysts advise against artificial BCP intervention.", "image_url": "https://www.latribuna.com.py/resizer/v2/NZK24PDXVZAQPHI7GCM5GSYI3U.JPG?smart=true&auth=aa956079a7b1885f0324ed080589125adacf737b318e87b2c552897be8b36b53&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}, {"title": "MEF projects 4.2% GDP growth for 2026, fourth consecutive year above 4%, but fiscal deficit to exceed target (2026-07-10)", "date": "2026-07-10", "source_url": "https://www.ultimahora.com/el-fmi-pidio-cuentas-completas", "source_name": "Última Hora / MEF / IMF", "summary": "Economy Minister Óscar Lovera ratified the 4.2% GDP growth projection for 2026, which would mark the fourth consecutive year above 4%. However, the IMF's Article IV consultation (June 29) warned the fiscal deficit will exceed the 1.5% target due to regularization of accumulated domestic arrears (USD 220M to construction firms, ~USD 1B to pharmaceutical sector). The IMF projects convergence to 1.5% deficit only by 2028 and called for full transparency in public accounts. DNIT tax revenue grew only 2.1% in H1 vs. the 9% budgeted target; President Peña ordered intensified collection efforts for H2.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/bfe1bc3/2147483647/strip/true/crop/3108x3108+0+0/resize/100x100!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F28%2F30%2Fcdd7e90c4b54abaecbdf925eded0%2Frodrigo-ibarrola.JPG", "is_gov_source": false, "is_authoritative": true}, {"title": "Imports grow nearly 10% in H1 2026 driven by strong guaraní and World Cup consumption boost (2026-07-10)", "date": "2026-07-10", "source_url": "https://infonegocios.com.py/amp/y-ademas/importadores-cierran-primer-semestre-con-un-crecimiento-cercano-al-10-estiman-incremento-igual-o-superior-para-la-segunda-mitad-del-ano", "source_name": "InfoNegocios", "summary": "Paraguay's import sector (excluding fuels) reported nearly 10% growth in consumer goods during H1 2026, driven by exchange rate stability, a strong guaraní, and the FIFA World Cup-driven consumption surge in June. Electronics, appliances, automobiles, and mass consumer goods were key growth categories. The sector expects similar or stronger growth in H2, fueled by year-end restocking. April trade data showed imports of USD 1,589.9M (+13.7% YoY) against exports of USD 1,592.6M (+20.5% YoY), yielding a slim trade surplus of USD 2.7M.", "image_url": null, "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "II. Political & Policy Developments", "description": "Major legislation, policy adjustments, foreign investment regulation, tax reform, investment incentives", "tier": 1, "events": [{"title": "Government modifies Hambre Cero decree: redistributes school feeding procurement to 7% direct producer / 3% processed goods (2026-07-10)", "date": "2026-07-10", "source_url": "https://www.hoy.com.py/nacionales/2026/07/09/medicos-anuncian-huelga-en-agosto-salud-blindara-servicios-criticos", "source_name": "Ministerio de Desarrollo Social", "summary": "Social Development Minister Tadeo Rojas announced changes to the Hambre Cero (Zero Hunger) school feeding program executive decree. The reform maintains the 10% minimum procurement from family agriculture and MSMEs, but redistributes it: 7% for direct purchase from primary producers and 3% for processed products. The changes aim to strengthen transparency and traceability in invoicing while supporting smallholder farmers.", "image_url": "https://www.lanacion.com.py/resizer/v2/PDWKSZCPUNDXLDDT5XCG5VAL6A.jpg?auth=1512391132b72a2e61d7d035edccfab4bccdb1a3eee03a245941350a70e489df&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "Brazilian manufacturers accelerate relocation to Paraguay, drawn by low labor costs and tax breaks (2026-07-10)", "date": "2026-07-10", "source_url": "https://valorinternational.globo.com/business/news/2026/07/10/brazilian-manufacturers-eye-paraguays-low-labor-costs-and-tax-breaks.ghtml", "source_name": "Valor International", "summary": "Brazilian manufacturers are increasingly relocating production to Paraguay, attracted by labor costs 30-50% lower than Brazil, the 'Triple 10' tax system (10% corporate tax, 10% VAT, 10% personal income tax), and electricity costs up to 2.8x cheaper thanks to Itaipú and Yacyretá surpluses. The Maquila regime (Law 1064/97) offers special 1% taxation on value added in Paraguay, with over 363 companies operating under it. Foreign residency applications surged 85% YoY in Q1 2026, projected at 80,000 for the full year (64% Brazilian).", "image_url": "https://s2-valorinternational.glbimg.com/72ldTsXHsGrFf7WMJyH6258YMLI=/1153x0/filters:format(jpeg)/https://i.s3.glbimg.com/v1/AUTH_63b422c2caee4269b8b34177e8876b93/internal_photos/bs/2026/Z/m/ON2ADbTOufoHuHh76Oqg/foto10emp-101-paraguai-b1.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Atome green hydrogen project in limbo after President Peña annuls Decreto 5307 power purchase agreement (2026-07-08)", "date": "2026-07-08", "source_url": "https://www.hydrogeninsight.com/production/atome-shares-suspended-as-flagship-145mw-green-hydrogen-project-in-paraguay-remains-in-limbo/2-1-2012405", "source_name": "Hydrogen Insight", "summary": "Atome's flagship 145MW green hydrogen project in Villeta (USD 665M investment) remains suspended after President Peña unilaterally annulled Decreto 5307, which had established a fixed-price power purchase agreement (PPA). The ANDE labor union opposed the PPA, arguing the tariff was too low and represented an implicit subsidy. Atome shares were suspended on the London Stock Exchange. The episode highlights the political sensitivity of energy pricing policy and the influence of state-owned enterprise unions over industrial energy policy.", "image_url": "https://image.dngroup.com/global/nhst/binary/9f6b0b850babd5e56458c99be3a4d306?crop=1538%2C769%2Cx0%2Cy50%2Csafe&width=1200&format=webp&quality=80", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "III. Social & Security Situation", "description": "Labor market, social stability, public security, employment data", "tier": 1, "events": [{"title": "MTESS formalizes 5% minimum wage increase to Gs. 3,044,000 effective July 1; new hourly and sectoral rates published (2026-07-09)", "date": "2026-07-09", "source_url": "https://www.ip.gov.py/ip/2026/07/09/mtess-reglamenta-reajuste-de-salarios-para-trabajadores-del-sector-privado-y-rige-desde-el-1-de-julio/", "source_name": "Agencia IP / MTESS", "summary": "The Ministry of Labor (MTESS) issued Resolution No. 670/2026, formalizing the 5% minimum wage increase under Decree No. 6225. The new monthly minimum wage is Gs. 3,044,000 (net Gs. 2,770,040 after 9% IPS contribution). The daily minimum is Gs. 117,077. The family bonus per child also increased to Gs. 152,200. Sector-specific minimum wages were also updated. Employers face fines of 10–30 daily minimum wages per affected worker for non-compliance.", "image_url": "https://www.ip.gov.py/ip/wp-content/uploads/2025/01/obreros-mujeres-fabrica-trabajadores-trabajo-empleo.jpeg", "is_gov_source": true, "is_authoritative": true}, {"title": "Doctors' union announces national strike for August 24–28 demanding 74.8% salary increase; Health Ministry to protect critical services (2026-07-09)", "date": "2026-07-09", "source_url": "https://www.hoy.com.py/nacionales/2026/07/09/medicos-anuncian-huelga-en-agosto-salud-blindara-servicios-criticos", "source_name": "Diario HOY", "summary": "The National Doctors' Union (Sinamed) voted near-unanimously to hold a national strike from August 24 to 28, 2026, demanding a 74.8% salary increase to be included in the 2027 National Budget. The union argues the base salary of Gs. 5,000,000 (~USD 650) has become 'intolerable' after losing significant purchasing power since 2012 relative to the minimum wage. The Health and Economy Ministers cited lack of financial availability. The Health Ministry pledged to protect critical services (emergency rooms, ICUs, emergency surgeries, ambulances).", "image_url": "https://www.lanacion.com.py/resizer/v2/PDWKSZCPUNDXLDDT5XCG5VAL6A.jpg?auth=1512391132b72a2e61d7d035edccfab4bccdb1a3eee03a245941350a70e489df&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Frigorífico Concepción workers protest at Labor Ministry: working only 5–6 hours/week, earning as little as Gs. 500,000/month (2026-07-10)", "date": "2026-07-10", "source_url": "https://conexionparaguay.com/nota/8216/crisis-en-frigorifico-concepcion", "source_name": "Conexión Paraguay", "summary": "Approximately 200 workers from Frigorífico Concepción protested outside the Ministry of Labor in Asunción, denouncing drastic reduction of work hours (5–6 hours/week) and incomes as low as Gs. 500,000/month (~USD 65), far below the minimum wage. The company had promised to guarantee minimum wage payments during the low-productivity period but failed to deliver. The meatpacking plant is experiencing a deep financial crisis with significantly reduced slaughter activity.", "image_url": "https://conexionparaguay.com/uploads/noticias/2/2026/07/20260710081017_images.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Barge explosion on Paraguay River kills 5 workers; company reportedly 2–3 months behind on salary payments (2026-07-08)", "date": "2026-07-08", "source_url": "https://www.hoy.com.py/nacionales/2026/07/08/explosion-de-barcaza-empresa-arrastra-atraso-en-pago-de-salarios-denuncian", "source_name": "Diario HOY", "summary": "A barge belonging to Grupo Líneas Panchita G S.A. suffered an explosion on the Paraguay River at Costanera Sur, Asunción, killing five workers performing cleaning tasks. Family members reported the company was 2–3 months behind on salary payments, and outsourced workers also reported non-payment and precarious working conditions. Several employees said they were forced to resign as they could not feed their families.", "image_url": "https://www.lanacion.com.py/resizer/v2/TWWSFNYM2JFIJBBNYLMJ336Y2A.jpeg?auth=bcb1a08da8f12972b56bc5da5b482c5bc01757039723625bf0a5049ce076a15c&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Security reinforcement: 911 Emergency Center launched in Pilar; Barrio Obrero patrols intensified; police officer shot in Caazapá (2026-07-10)", "date": "2026-07-10", "source_url": "https://www.ultimahora.com/ministerio-del-interior-implementa-centro-de-seguridad-y-emergencias-911-en-pilar-tras-hechos-delictivos", "source_name": "Última Hora / Frontera Seca News", "summary": "The Interior Ministry established a new 911 Security and Emergency Center in Pilar (Ñeembucú) following a violent attempted robbery in Alberdi where seven armed men simulated a police raid. Alberdi has only four police officers per shift. Patrols were reinforced in Barrio Obrero, Asunción, with positive community response. A police officer was shot in the elbow during an operation in San Juan Nepomuceno (Caazapá); two suspects with criminal records were arrested.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/6cca5c4/2147483647/strip/true/crop/1440x810+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F59%2F64%2F980a248a4000914b5f2ad1d156d3%2F741948356-3030696707139795-9114224492124918491-n.jpg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "IV. International Relations & Foreign Affairs", "description": "Paraguay's relations with major powers, Mercosur dynamics, cross-strait relations, multilateral engagement", "tier": 1, "events": [{"title": "Paraguay completes historic first poultry meat export to Taiwan: 150 tons shipped, targeting 500 tons/month (2026-07-08)", "date": "2026-07-08", "source_url": "https://www.latribuna.com.py/negocios/economia/2026/07/08/paraguay-concreta-el-primer-envio-de-carne-aviar-a-taiwan/", "source_name": "La Tribuna", "summary": "Paraguay completed its first-ever poultry meat export to Taiwan: 150 tons of chicken from Granja Avícola La Blanca S.A., with projections of 500 tons/month. President Peña hailed it as a 'historic milestone' and a reflection of 'great friendship' between the two nations. Taiwan's ambassador noted that Taiwan imports over 250,000 tons of chicken annually. This export marks a new chapter in Paraguay-Taiwan economic cooperation ahead of the 70th anniversary of diplomatic relations in 2027.", "image_url": "https://www.latribuna.com.py/resizer/v2/ZODQOBMZIJBDPI4DOQDIGV6IXY.jpeg?smart=true&auth=b5d17f5ebfbbf24976699d834e130ae42ff9997a43f1c78084459abffceac984&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}, {"title": "EU-Mercosur quota dispute escalates: Paraguay demands 25% fixed allocation, Peña calls current system 'unfair and unacceptable' (2026-07-06)", "date": "2026-07-06", "source_url": "https://www.euractiv.com/news/eu-trade-deal-sparks-quota-tug-of-war-inside-mercosur-bloc/", "source_name": "Euractiv / BSS News", "summary": "The EU-Mercosur FTA quota distribution dispute continues to escalate. Paraguay demands a fixed 25% allocation by product category, insisting the current 'first-come, first-served' system favors Brazil and Argentina. President Peña described the deal as 'bitter taste' for Paraguay, arguing that landlocked countries face higher logistics costs. Uruguay used 60%+ of its rice quota in under a month; Argentina took 80% of honey quota in Q1. Paraguay links the quota issue to FOCEM structural convergence funds, demanding greater infrastructure compensation.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay Senate reiterates request for SOFA details from Foreign Ministry; opposition raises constitutional concerns over US military immunities (2026-07-09)", "date": "2026-07-09", "source_url": "https://www.ultimahora.com/senado-reitera-pedido-al-mre-sobre-detalles-del-acuerdo-sofa", "source_name": "Última Hora", "summary": "The Paraguayan Senate reiterated its request for detailed information from the Foreign Ministry on the Status of Forces Agreement (SOFA) signed with the United States. Senator José Oviedo (opposition) pushed the motion after the initial May 8 response was deemed 'insufficient.' Key concerns include immunity for US military personnel without reciprocal guarantees, tax exemptions, use of radio spectrum, and potential conflicts with Articles 30, 137, 141, and 144 of the Constitution. The Foreign Ministry has 10 days to respond.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/a810375/2147483647/strip/true/crop/2944x1656+0+156/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fdc%2Fb3%2F0bb9cc7f47c895773f44185441c1%2Frvr-3665-68339335.JPG", "is_gov_source": false, "is_authoritative": true}, {"title": "Mercosur summit launches trade negotiations with Japan, signals future talks with China; Paraguay reinforces 'trade yes, sever Taiwan no' stance (2026-07-06)", "date": "2026-07-06", "source_url": "https://www.tribuneindia.com/news/world/mercosur-leaders-defend-unity-amid-global-tensions-launch-new-trade-talks/", "source_name": "Tribune India / BSS News", "summary": "At the July 1 Mercosur Summit in Luque, the bloc launched formal trade negotiations with Japan and signaled future talks with China. Uruguay assumed the rotating presidency. Foreign Minister Rubén Ramírez reiterated Paraguay's openness to trade with China 'as long as no conditions are imposed regarding diplomatic relations with Taiwan.' Brazilian President Lula urged Mercosur to negotiate with China, increasing pressure on Paraguay — the only South American nation without Beijing ties. Germany's Foreign Minister acknowledged 'issues to resolve' before full EU-Mercosur ratification.", "image_url": "https://www.tribuneindia.com/sortd-service/imaginary/v22-01/jpg/large/high?url=dGhldHJpYnVuZS1zb3J0ZC1wcm8tcHJvZC1zb3J0ZC9tZWRpYTg2ZGY3OGIwLTc2MTEtMTFmMS1hZmFlLTJkNzNlMTMwYzExYi5qcGc=", "is_gov_source": false, "is_authoritative": true}, {"title": "US-Taiwan-Paraguay trilateral virtual mission explores renewable energy, EV, and smart grid opportunities (2026-07-02)", "date": "2026-07-02", "source_url": "https://hk.crntt.com/doc/1060/7/8/9/106078940_2.html", "source_name": "CRNTT / MIC Paraguay", "summary": "A virtual business opportunity mission on July 2 brought together representatives from the US, Taiwan, and Paraguay's Ministry of Industry and Commerce (MIC) to explore trilateral investment opportunities in renewable energy (green hydrogen, solar), electric vehicles and components, and smart electricity distribution and storage systems. The mission is part of the deepening US-Taiwan-Paraguay trilateral cooperation framework in AI, 5G, and cybersecurity.", "image_url": "http://hkpic.crntt.com/upload/202105/7/106078942.jpg", "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "V. Industry Focus: Telecom, Digital Energy & AI", "description": "5G spectrum and commercial deployment, fiber infrastructure, digital energy investment, AI data center development, industry regulation", "tier": 1, "events": [{"title": "Paraguay's second 5G auction opens: Tigo and Personal submit bids for 2.3GHz/3.7GHz spectrum, minimum investment $40M (2026-07-10)", "date": "2026-07-10", "source_url": "https://www.telesemana.com/blog/2026/07/10/paraguay-avanza-con-la-segunda-subasta-5g-y-tigo-y-personal-aceptan-las-reglas-contra-equipos-de-origen-chino/", "source_name": "TeleSemana / BNamericas / DPL News", "summary": "CONATEL opened bids for Public Tender 01/2026, Paraguay's second 5G spectrum auction. Tigo (Millicom) and Personal (Telecom Argentina) submitted proposals — both had boycotted the 2025 auction over Chinese equipment restrictions. Spectrum on offer: 2.3GHz band (USD 1.6M base per 100MHz block) and 3.7GHz band (USD 1.0M base). Minimum investment commitment of USD 40M in secure network infrastructure from trusted vendors, compatible with 5G NR Release 15+. CONATEL will announce pre-qualified bidders next week. Chinese vendor restrictions (Huawei/ZTE) remain in force.", "image_url": "https://www.telesemana.com/wp-content/uploads/2024/12/5G-Paraguay-1-e1733258458809.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "Paraguay's digital infrastructure reaches 18,000km fiber, 1,600 Starlink kits deployed, 404 free WiFi points nationwide (2026-07-09)", "date": "2026-07-09", "source_url": "https://www.lanacion.com.py/negocios/2026/07/09/el-crecimiento-economico-de-paraguay-impulsara-la-transformacion-del-sector-digital-en-2026/", "source_name": "La Nación / MITIC / DPL News", "summary": "MITIC reported key digital infrastructure metrics: national fiber optic network (RNFO) reaches 18,000km; Copaco and MITIC are deploying 1,600 Starlink satellite kits for rural schools and health centers, with Copaco targeting expansion to 8,000 schools; nationwide free WiFi covers 404 public spaces across all municipalities; a new Tier III state data center is under construction. Internet penetration reached 68% of households by end-2025 (up from 52% in 2023), with ISPs investing USD 180M+ in infrastructure over 2024–2025. Government cloud NubePy serves 113 public institutions.", "image_url": "https://www.lanacion.com.py/resizer/v2/FYOMPWF2EJHI7IA6NHQDHP4ZVY.jpg?auth=c38325e14e60cdcdb27ac0afed212a7c5594e9a15eefff026ee1b11188bee43e&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "HIVE Digital targets 35 EH/s in 2026 with new 100MW hydroelectric expansion in Paraguay and 5x growth in HPC/AI operations (2026-07-08)", "date": "2026-07-08", "source_url": "https://www.hivedigitaltechnologies.com/news/hive-digital-technologies-targets-35-ehs-in-2026-with-newly-signed-100-mw-hydroelectric-expansion-in-paraguay-and-a-5x-growth-in-hpc-and-ai-operations-through-strategic-partnerships-with-bell-canada/", "source_name": "HIVE Digital Technologies (NASDAQ)", "summary": "HIVE Digital Technologies (NASDAQ: HIVE) announced a new 100MW hydroelectric expansion in Paraguay as part of its target to reach 35 EH/s Bitcoin mining capacity in 2026, alongside 5x growth in HPC and AI operations through a strategic partnership with Bell Canada. The company already operates ~300MW across Tier I data centers in Paraguay, with BUZZ Cloud AI platform (Tier III, Asunción) launched in Q1 2026, and the 400MW Yguazú Phase 3 site near Itaipú expected online by Q3 2026.", "image_url": "https://www.hivedigitaltechnologies.com/static/hivesite/images/banner.webp", "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay-Taiwan AI data center JV progresses: Phase 1 (10MW) advancing, Phase 3 targets 1GW as 'world's largest AI center' (2026-07-09)", "date": "2026-07-09", "source_url": "https://www.ferrere.com/en/news/paraguay-strengthens-its-positioning-for-data-centers-ai-and-advanced-energy/", "source_name": "Ferrere / Agencia IP", "summary": "Paraguay continues to advance its positioning as a regional AI infrastructure hub. The 50/50 Paraguay-Taiwan AI data center joint venture progresses with Phase 1 (10MW), scaling to Phase 2 (100MW) and ultimately Phase 3 (~1GW). Decreto 5306/2026 provides USD-denominated special electricity tariffs with 15-year contract terms for AI and cloud computing. X8 Cloud's massive project (estimated USD 10–50B over 30 years) would be South America's largest AI data center complex. IDB is financing USD 130M for digital infrastructure modernization.", "image_url": "https://www.ferrere.com/public/html/img/share.png", "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "VI. Key Client Movements", "description": "Tracking strategic moves, investment plans, network deployment, and technology choices of Paraguay's major telecom clients", "tier": 1, "events": [{"title": "Claro — First to commercial 5G, $35M initial investment, expanding coverage beyond Asunción in 2026 with Nokia infrastructure (2026-07-10)", "date": "2026-07-10", "source_url": "https://www.bnamericas.com/en/news/paraguay-greenlights-claro-and-nubicom-to-ignite-5g-race", "source_name": "BNamericas / SAMENA", "summary": "Claro (América Móvil) activated Paraguay's first commercial 5G network in December 2025, investing USD 35M initially with Nokia as exclusive equipment provider. Current coverage includes Greater Asunción, Ciudad del Este, Encarnación, Coronel Oviedo, and Pedro Juan Caballero. General Manager Alfredo Alcaraz confirmed continued 2026 expansion to additional territories. Claro won 200MHz in the 3.5GHz band (USD 2M license fee) at the August 2025 auction and must deploy 100 base stations per 100MHz, with 10% serving government agencies. Claro holds third position in Paraguay's mobile market with ~947,000 internet users.", "image_url": "https://cdnimg.bnamericas.com/POjyKcsMosNhPZELKycnexVTCIJVYkuGWGwnoaKLyxfeXJXJIBUyjNZapDzARxCo.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Claro"}, {"title": "Tigo — Bids in second 5G auction after boycotting 2025 round; backed by $100M IDB Invest+Proparco financing and $77M local bond (2026-07-10)", "date": "2026-07-10", "source_url": "https://www.telesemana.com/blog/2026/07/10/paraguay-avanza-con-la-segunda-subasta-5g-y-tigo-y-personal-aceptan-las-reglas-contra-equipos-de-origen-chino/", "source_name": "TeleSemana / BNamericas / BID Invest", "summary": "Tigo (Millicom, market leader with 3.16M users, 47.3% share) submitted a bid in Paraguay's second 5G auction on July 10 — a major strategic reversal after boycotting the 2025 round over Chinese equipment restrictions. Tigo is backed by a USD 100M IDB Invest+Proparco private bond (March 2026) for 4G/4.5G/5G and fiber expansion across 7 countries including Paraguay, and a historic USD 77M guaraní-denominated local bond issuance (January 2026). Tigo continues FTTH expansion and 3G-to-4G migration. Millicom Q1 2026 results showed 4.9% organic service revenue growth with 43.2% adjusted EBITDA margin.", "image_url": "https://www.telesemana.com/wp-content/uploads/2024/12/5G-Paraguay-1-e1733258458809.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo"}, {"title": "Personal — Enters second 5G auction, maintains low-cost positioning while ramping up fiber-to-the-home expansion (2026-07-10)", "date": "2026-07-10", "source_url": "https://dplnews.com/tigo-personal-se-postulan-segunda-licitacion-5g-paraguay/", "source_name": "DPL News / BNamericas", "summary": "Personal (Núcleo S.A., Telecom Argentina subsidiary, 1.66M users, 35.5% market share) also entered the second 5G auction after abstaining in 2025. The operator is actively expanding FTTH networks alongside Tigo to support Asunción's growing tech startup ecosystem (fintech, agritech, logistics). Personal focuses on the low-cost market segment, with coverage concentrated in urban areas and weaker presence outside Asunción. Participation in the 5G auction signals recognition that staying out of 5G would risk losing its second-place market position, especially as Nubicom's 5G deployment remains stalled.", "image_url": "https://dplnews.com/wp-content/uploads/2026/06/Gemini_Generated_Image_2s4av12s4av12s4a-1024x572.png", "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal"}, {"title": "Nubicom — 5G license under investigation; zero reported deployment progress since winning 200MHz spectrum in August 2025 (2026-07-10)", "date": "2026-07-10", "source_url": "https://www.bnamericas.com/en/news/tigo-personal-bid-for-5g-spectrum-in-paraguay-auction", "source_name": "BNamericas", "summary": "Nubicom (Argentine fixed-line operator from Salta) won 200MHz of 3.5GHz spectrum in the August 2025 auction, announcing a USD 200M investment to build Paraguay's largest 5G network from scratch. However, ten months later, the company has reported zero deployment progress and faces an investigation by the Comptroller General (CGR) for potential non-compliance with participation requirements. Nubicom was required to establish a local subsidiary within six weeks — unclear if this occurred. With no prior mobile infrastructure and no reported network construction, Nubicom's ability to execute its 5G commitment is increasingly questioned.", "image_url": "https://cdnimg.bnamericas.com/bkdIGnUmfDWaddMMzYYwvGPHJhRMldDnODwuZJAsHSMHGKhPYJrVJhLHEQoEhbrb.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom"}], "impact_analysis": "", "user_notes": ""}, {"title": "VII. Comprehensive Enterprise Impact Analysis", "description": "Assessing Paraguay's enterprise operating environment through cost, market, and compliance dimensions", "tier": 2, "events": [], "impact_analysis": "## I. Cost Dimension 🟡\n\nCost pressures remain mixed, with exchange rate dynamics creating divergent impacts across sectors:\n\n- **Exchange Rate Impact**: The guaraní continues to strengthen, trading at PYG 6,060–6,200/USD (down 8.56% YTD). For enterprises with guaraní-denominated costs (local salaries, services) and dollar-denominated revenues, profit margins continue to compress. Import-dependent sectors (telecom equipment, electronics, data center hardware) benefit from cheaper imported inputs, partially offsetting other cost pressures.\n- **Labor Costs**: The 5% minimum wage increase (Gs. 3,044,000/month effective July 1) is broadly aligned with inflation (June CPI at 2.09% YoY), keeping real unit labor costs stable. However, the doctors' union demand for 74.8% increase signals latent wage pressure in the public sector that could spill over. Sector-specific minima were also updated, requiring compliance review.\n- **Energy Costs**: The annulment of Decreto 5307 (Atome PPA) introduces uncertainty into the special electricity tariff framework established by Decretos 5306/2026. While AI/data center tariffs remain in place for now, the ANDE union's successful veto demonstrates that energy pricing for large industrial users is politically contestable. Enterprises relying on long-term fixed-price USD electricity contracts should model policy reversal risk.\n- **Tax & Fiscal Pressure**: DNIT revenue grew only 2.1% in H1 vs. the 9% budgeted target. President Peña has ordered intensified collection efforts for H2. With the fiscal deficit exceeding the 1.5% target (IMF projects convergence only by 2028), enterprises should prepare for potential new tax enforcement measures, including strengthened transfer pricing reviews and import valuation adjustments.\n\n## II. Market Dimension 🟢\n\nParaguay's market opportunities are expanding significantly, particularly in digital infrastructure and manufacturing:\n\n- **5G Equipment & Services Market**: The second CONATEL 5G auction (July 10, 2026) with Tigo and Personal participating opens a new procurement cycle. Minimum USD 40M investment commitment per operator, with combined potential of USD 80M+ in network equipment and services. Both operators must use non-Chinese vendors (Nokia, Ericsson, Samsung as likely beneficiaries). This creates opportunities for equipment suppliers, tower companies, fiber backhaul providers, and system integrators.\n- **Brazilian Manufacturing Relocation**: The accelerated relocation of Brazilian manufacturers to Paraguay (labor costs 30–50% lower, energy 2.8x cheaper) creates demand for industrial park development, logistics infrastructure, and B2B services. The Maquila regime (1% tax on value added) now hosts 363+ companies, with 64% of 80,000 projected 2026 residency applicants being Brazilian.\n- **AI & Data Center Supply Chain**: HIVE's 100MW expansion, the Taiwan-Paraguay AI JV (10MW→1GW), and X8 Cloud's megaproject continue to drive demand for: electrical equipment (transformers, UPS, switchgear), cooling solutions, fiber optic connectivity, cybersecurity services, and data center construction/EPC. IDB's USD 130M digital infrastructure financing provides additional procurement opportunities.\n- **EU Market Access Uncertainty**: The EU-Mercosur FTA quota dispute is unresolved. Paraguay's demand for 25% fixed allocation vs. the 'first-come, first-served' system creates both risk (if Paraguay loses quota share) and opportunity (if reform succeeds). Export-oriented agribusiness and food processing enterprises should monitor the quota negotiation outcome.\n\n## III. Compliance Dimension 🟡\n\nThe compliance environment shows both progress and emerging friction:\n\n- **Labor Compliance**: The MTESS has formalized the new minimum wage with explicit enforcement mechanisms (WhatsApp complaint line, fines of 10–30 daily minimum wages per affected worker). The Frigorífico Concepción protest and barge explosion labor violations suggest intensified labor inspections in H2. Enterprises should complete payroll compliance reviews immediately.\n- **Investment Facilitation**: The Investor Pass (Res. MIC 0283/2026) and updated immigration requirements continue to streamline foreign investment entry. Four clear pathways (productive investment from USD 70K, financial instruments from USD 200K, real estate from USD 200K, tourism from USD 150K) with CIE issuance in 5 business days. The surge in applications (85% YoY Q1 growth) validates the program's attractiveness.\n- **Policy Reversal Risk**: The Decreto 5307 annulment (Atome PPA) represents a significant precedent: a presidential decree providing long-term energy price certainty was reversed under union pressure. This raises the risk premium for capital-intensive projects dependent on special regulatory treatment. Enterprises should incorporate political risk clauses in project agreements and diversify advocacy beyond the executive branch.\n- **SOFA & Defense Compliance**: The Senate's reiterated request for SOFA details and constitutional concerns (immunities, tax exemptions, spectrum usage) signals growing legislative activism on foreign military cooperation. Enterprises in defense-adjacent sectors should monitor the SOFA ratification process.\n\n## Overall Assessment\n\nThis week's monitoring of 24 events (7 from government sources, 10 from authoritative media) paints a picture of Paraguay at an inflection point: macroeconomic fundamentals remain strong (IMF 4.4% growth, 2.09% inflation, investment grade from Moody's and S&P), but three tensions are intensifying — (1) the fiscal deficit transparency gap flagged by the IMF, (2) the policy reversal precedent set by the Atome decree annulment, and (3) the EU-Mercosur quota allocation conflict that tests Paraguay's influence within the bloc. The most consequential development for the telecom/digital sector is Tigo and Personal's entry into the second 5G auction, which transforms Paraguay's mobile landscape from a two-player 5G market (Claro + stalled Nubicom) to a genuinely competitive three- or four-operator race."}, {"title": "VIII. China-Specific Enterprise Impact & Recommendations", "description": "Tailored analysis for Chinese enterprises operating in or considering entry to the Paraguayan market", "tier": 2, "events": [], "impact_analysis": "## I. Risk Warnings\n\n🔴 **High Priority:**\n\n- **5G Equipment Exclusion Institutionalized in Second Auction**: Tigo and Personal's acceptance of non-Chinese equipment rules in the July 10 second 5G auction marks a decisive moment. Both operators previously boycotted the 2025 auction precisely because of these restrictions, but now 'have no choice' — confirming that Huawei/ZTE exclusion is now structurally embedded in Paraguay's telecom regulatory framework. With all four operators (Claro, Tigo, Personal, and the stalled Nubicom) operating under these rules, the Chinese vendor exclusion has moved from a one-time auction condition to a de facto permanent industry standard. The USD 80M+ combined minimum investment from Tigo and Personal represents a market opportunity entirely closed to Chinese equipment suppliers.\n- **US-Taiwan-Paraguay Trilateral Architecture Deepening**: The July 2 virtual business mission (US-Taiwan-Paraguay) on renewable energy, EVs, and smart grids, combined with the SOFA agreement (under Senate scrutiny but progressing) and the Taiwan poultry export milestone, demonstrates an increasingly institutionalized trilateral framework that systematically excludes Chinese enterprises from sensitive infrastructure sectors. This is no longer ad hoc but represents a coherent strategic architecture spanning defense, digital, and energy domains.\n- **China-Paraguay Diplomatic Stalemate Hardens**: Foreign Minister Ramírez's July 1 'trade yes, break with Taiwan no' statement at Mercosur, coupled with President Peña's characterization of the poultry export to Taiwan as 'historic friendship,' signals that the diplomatic status quo is firmly entrenched. Brazil's Lula pushing Mercosur-China talks increases pressure but does not appear to be shifting Paraguay's position in the near term. Chinese enterprises should not anticipate diplomatic normalization as a near-term catalyst for market access improvement.\n\n🟡 **Medium Priority:**\n\n- **Policy Stability Risk**: The annulment of Decreto 5307 (Atome green hydrogen PPA) sets a precedent that even presidential decrees establishing long-term energy pricing can be reversed. For Chinese enterprises evaluating capital-intensive projects in Paraguay (energy, infrastructure, manufacturing), this introduces a new dimension of policy risk that goes beyond traditional sovereign/credit risk analysis. ANDE union influence over energy policy is a specific factor to monitor.\n- **Currency Appreciation Impact**: The 8.56% YTD guaraní appreciation means Chinese enterprises with existing Paraguay operations see their guaraní-denominated profits shrink when converted to RMB. Enterprises should assess whether existing hedging strategies are adequate for a sustained strong-guaraní scenario (BCP EVE survey projects PYG 6,475 by year-end).\n- **Fiscal Enforcement Risk**: DNIT's H1 revenue shortfall (2.1% actual vs. 9% budgeted) and Peña's order to intensify H2 collection could translate into more aggressive tax audits, particularly targeting import valuation practices and transfer pricing — areas where Chinese trading and manufacturing enterprises have historically faced scrutiny.\n\n## II. Opportunity Analysis\n\n🟢 **Actionable Opportunities:**\n\n- **Non-Equipment Roles in Paraguay's Digital Buildout**: While telecom equipment access is blocked, the broader digital infrastructure buildout creates entry points for Chinese enterprises in non-core-equipment roles: (a) electrical equipment supply for data centers (transformers, UPS, distribution panels, busways); (b) cooling and HVAC solutions for AI data centers (HIVE's 400MW Yguazú site, Taiwan JV's 10MW→1GW); (c) solar+storage hybrid systems complementing hydropower; (d) data center construction/EPC services; (e) fiber optic cable and passive infrastructure components.\n- **Brazil Relocation Spillover Benefits**: The wave of Brazilian manufacturers relocating to Paraguay creates demand for industrial machinery, production line equipment, and factory automation systems — areas where Chinese suppliers are globally competitive. Chinese equipment manufacturers can serve Brazilian companies setting up Paraguayan operations without direct engagement with Paraguayan government procurement.\n- **Agricultural Technology**: Paraguay's economy remains agro-driven (GDP growth led by soybeans, beef, now poultry exports to Taiwan). Chinese agritech solutions — precision agriculture sensors, drone-based crop monitoring, smart irrigation, cold chain logistics, and food processing equipment — can enter the market with minimal political friction.\n- **Green Hydrogen Supply Chain (Non-PPA Dependent)**: Although the Atome PPA was annulled, the underlying fundamentals (surplus hydropower, Decreto 5307/2026 Power-to-X framework) remain attractive. Chinese electrolyzer manufacturers can position for future project cycles without requiring the same policy certainty as project developers.\n\n## III. Strategic Recommendations\n\n**Immediate (July 2026):**\n- Complete minimum wage compliance review for all Paraguay-based employees following the July 1 adjustment. Verify that payroll, IPS contributions (9%), and family bonus payments reflect the new Gs. 3,044,000 minimum and updated sector-specific rates.\n- Assess FX exposure: with guaraní appreciation at 8.56% YTD and BCP EVE projecting PYG 6,475/USD year-end, evaluate the financial impact on existing local-currency revenues and consider hedging instruments if not already in place.\n- Monitor CONATEL's pre-qualification announcement (expected the week of July 13) for the second 5G auction to identify the specific spectrum blocks each operator targets and the procurement timelines.\n\n**Short-Term (1–3 months):**\n- Map the supply chain for Tigo and Personal's 5G deployment (USD 40M+ minimum each): tower companies, fiber backhaul, power systems, civil works. Target non-equipment segments where Chinese firms can compete without triggering security review.\n- Engage HIVE Digital, the Taiwan-Paraguay AI JV, and X8 Cloud project developers for data center infrastructure supply opportunities (electrical, cooling, construction). Position through regional subsidiaries or Latin American reference projects.\n- Track the National Doctors' strike (August 24–28) for broader labor relations implications. A successful large-scale public sector strike could embolden other unions and shift the political climate regarding foreign employers.\n\n**Medium-Term (3–12 months):**\n- Evaluate the Mercosur indirect entry strategy: with EU-Mercosur FTA provisionally in effect and Mercosur-Japan trade talks launched, Chinese enterprises with existing Brazil or Argentina operations can leverage these frameworks for indirect Paraguay market access.\n- Study the Decreto 5307 annulment precedent's implications for Chinese energy and infrastructure investments. Develop a political risk mitigation framework specific to Paraguayan regulatory reversal risk, including legislative anchoring (beyond executive decree), multi-stakeholder coalition building, and international arbitration clauses.\n- Position for the eventual green hydrogen/Power-to-X project pipeline. Despite the Atome setback, Paraguay's 5GW hydropower surplus remains a structural asset. Chinese electrolyzer and balance-of-plant suppliers should establish technical presence and local partnerships now.\n- Monitor Mercosur-China trade negotiation developments closely. If Brazil succeeds in launching formal Mercosur-China talks, Paraguay will face unprecedented pressure to reconsider its diplomatic stance — a potential turning point that could unlock broader market access for Chinese enterprises within 12–24 months."}]}};

function renderMacroDataTable(d,unit){

  h+='<div class="macro-data-table-wrap" style="display:none"><table class="macro-data-table"><thead><tr><th>'+L('月份','Month')+'</th><th>2023</th><th>2024</th><th>2025</th><th>2026*</th></tr></thead><tbody>';

    h+='</tr>';

}
function renderFXDailyTable(d,unit){
  var DM=[31,28,31,30,31,30,31,31,30,31,30,31],dl=d.line||[];

  h+='<div class="macro-data-table-wrap" style="display:none"><table class="macro-data-table"><thead><tr><th>'+L('日期','Date')+'</th><th>PYG/USD</th></tr></thead><tbody>';
  var dates=[],day=1,mo=0,yr=2023;
  for(var i=0;i<dl.length;i++){
    dates.push(yr+'-'+(mo<9?'0'+(mo+1):(mo+1))+'-'+(day<10?'0'+day:day));

function closeMacroModal(e){

function renderAll(){

  var sections=d.sections||[],tier1=[],tier2=[];

function renderSection(sec,idx){
  var events=sec.events||[],isT2=sec.tier===2;
  var g=GRAD[idx%8],icon=ICONS[idx%8];
  var body='';
  if(isT2||events.length===0){
    if(sec.impact_analysis)body='<div class="analysis-body">'+fmt(sec.impact_analysis)+'</div>';
    else if(!isT2)body='<div style="padding:4px 22px 16px;color:#94A3B8;font-size:13px;">'+L('暂无此时间段内的事件','No events in this period')+'</div>';
  }else{
    var cards='';
    for(var i=0;i<events.length;i++)cards+=renderCard(events[i],g[0],g[1],icon);

  }
  var badge=events.length>0?'<span class="badge">'+events.length+L(' 条事件',' events')+'</span>':'';
