<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paraguay Briefing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#F0F4FF;color:#1E293B;line-height:1.6;min-height:100vh}
a{color:#3B82F6;text-decoration:none}a:hover{text-decoration:underline}
.header{background:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;border-bottom:3px solid #3B82F6}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;flex-shrink:0}
.header-left h1{font-size:20px;font-weight:700;color:#1E293B}
.header-left .subtitle{font-size:12px;color:#64748B;margin-top:2px}
.header-right{display:flex;gap:8px;align-items:center}
.btn-lang{background:#EEF2FF;color:#4F46E5;font-weight:700;font-size:12px;padding:8px 14px;border-radius:20px;border:none;cursor:pointer}
.btn-lang:hover{background:#E0E7FF}
.btn-primary{background:#3B82F6;color:#fff;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-primary:hover{background:#2563EB;transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.3)}
.btn-secondary{background:#F1F5F9;color:#475569;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:#E2E8F0}
.btn-sm{font-size:11px;padding:6px 12px}
.update-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:moFade .2s}
.update-modal{background:#fff;border-radius:14px;padding:24px 28px;width:440px;max-width:90vw;box-shadow:0 24px 80px rgba(0,0,0,.25);animation:moZoom .25s}
.update-modal h3{font-size:17px;font-weight:700;color:#1E293B;margin-bottom:16px}
.update-modal label{display:block;font-size:12px;font-weight:600;color:#64748B;margin-bottom:4px}
.update-modal select,.update-modal input{width:100%;padding:8px 12px;border:1px solid #CBD5E1;border-radius:8px;font-size:13px;margin-bottom:14px;color:#1E293B;background:#fff}
.update-modal .btn-row{display:flex;gap:8px;justify-content:flex-end}
.time-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.time-preset{padding:5px 12px;border-radius:14px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #CBD5E1;background:#fff;color:#64748B;transition:all .12s}
.time-preset:hover,.time-preset.active{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.history-list{max-height:300px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid #E2E8F0;border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.history-item:hover{background:#F8FAFC;border-color:#CBD5E1}
.history-item .hi-title{font-weight:600;font-size:13px;color:#1E293B}
.history-item .hi-meta{font-size:11px;color:#94A3B8}
.history-item .hi-count{font-size:11px;font-weight:600;color:#3B82F6;background:#EEF2FF;padding:2px 8px;border-radius:10px}
.loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid #CBD5E1;border-top-color:#3B82F6;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.standalone-banner{background:#FEF3C7;color:#92400E;text-align:center;padding:6px 16px;font-size:12px;border-bottom:1px solid #FDE68A;display:none}
.standalone-banner code{background:#FDE68A;padding:1px 5px;border-radius:3px;font-size:11px}

.stats-row{max-width:1400px;margin:0 auto;padding:12px 32px 16px;display:flex;flex-direction:column;gap:8px}
.stats-row-total{display:flex;justify-content:center}
.stats-row-sections{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:768px){.stats-row-sections{grid-template-columns:repeat(2,1fr)}}
.stat-pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;cursor:pointer;transition:all .2s;border:2px solid transparent;font-size:13px;font-weight:600;user-select:none;min-width:0}
.stat-pill:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.pill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pill-label{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-count{font-size:14px;font-weight:700;margin-left:auto;flex-shrink:0;background:rgba(255,255,255,.5);padding:1px 8px;border-radius:10px}
.stat-pill.pill-total{background:#1E293B;color:#fff;font-weight:700;border-radius:24px;display:inline-flex}
.stat-pill.pill-total .pill-count{background:rgba(255,255,255,.2)}

.content{max-width:1400px;margin:0 auto;padding:0 32px 60px}
.section{background:#fff;border-radius:14px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden;border-top:4px solid #3B82F6}
.section.s0{border-top-color:#3B82F6}.section.s1{border-top-color:#EF4444}.section.s2{border-top-color:#10B981}
.section.s3{border-top-color:#8B5CF6}.section.s4{border-top-color:#06B6D4}.section.s5{border-top-color:#F59E0B}
.section.s6{border-top-color:#6366F1}.section.s7{border-top-color:#EC4899}.section.tier2{background:#FAFBFC}
.section-header{padding:16px 22px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-header h2{font-size:16px;font-weight:700;color:#1E293B}
.section-header .badge{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;background:#F1F5F9;color:#64748B;white-space:nowrap}
.section-desc{padding:4px 22px 10px;font-size:12px;color:#94A3B8}
.events-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 22px 18px}
@media(max-width:860px){.events-grid{grid-template-columns:1fr}.event-card{flex-direction:column}.event-card .event-img{width:100%!important;min-height:120px;max-height:180px}}
.event-card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;transition:all .2s;display:flex}
.event-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-1px);border-color:#CBD5E1}
.event-card .event-img{width:160px;min-height:140px;flex-shrink:0;position:relative;overflow:hidden}
.event-card .event-img img{width:100%;height:100%;object-fit:cover;display:block}
.event-card .event-img .img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.event-card .event-body{padding:12px 15px;flex:1;min-width:0;display:flex;flex-direction:column}
.event-card .event-meta{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.event-card .event-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.event-tag.date{background:#F1F5F9;color:#64748B}.event-tag.gov{background:#DCFCE7;color:#15803D}
.event-tag.auth{background:#DBEAFE;color:#1D4ED8}.event-tag.source{background:#FEF3C7;color:#A16207}
.event-tag.client{background:#FCE7F3;color:#BE185D}
.event-card .event-preview{font-size:13px;color:#334155;line-height:1.6;flex:1;overflow:visible;max-height:none}
.event-card .event-link{font-size:11px;margin-top:6px;color:#3B82F6;font-weight:500}
.analysis-body{padding:4px 22px 20px;font-size:13px;line-height:1.8;color:#334155}
.analysis-body h3{font-size:15px;font-weight:700;margin:14px 0 6px;color:#1E293B}
.analysis-body ul{padding-left:0;list-style:none}
.analysis-body li{padding:2px 0 2px 18px;position:relative}
.analysis-body li::before{content:"•";position:absolute;left:2px;color:#3B82F6;font-weight:bold}
.tier-divider{text-align:center;padding:16px 0 8px;margin:8px 0}
.tier-divider span{background:linear-gradient(135deg,#3B82F6,#6366F1);color:#fff;padding:8px 28px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(59,130,246,.25)}
.footer{text-align:center;padding:20px 32px 40px;color:#94A3B8;font-size:12px;max-width:1400px;margin:0 auto}
.macro-dashboard{background:#fff;border-radius:14px;margin-bottom:18px;padding:16px 22px 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-top:4px solid #1E293B}
.macro-title{font-size:15px;font-weight:700;color:#1E293B;margin-bottom:2px}
.macro-period{font-size:11px;font-weight:400;color:#94A3B8;margin-left:6px}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media(max-width:900px){.macro-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.macro-grid{grid-template-columns:1fr}}
.macro-card{background:#F8FAFC;border-radius:8px;padding:10px 8px 4px;border:1px solid #E2E8F0}
.macro-card-title{font-size:10.5px;font-weight:600;color:#475569;margin-bottom:4px;text-align:center;line-height:1.3;min-height:28px;display:flex;align-items:center;justify-content:center}
.macro-card{position:relative}
.macro-source{position:absolute;top:6px;right:8px;font-size:7.5px;color:#94A3B8;font-weight:500;background:#fff;padding:1px 5px;border-radius:3px;border:1px solid #E2E8F0;z-index:1;pointer-events:none}
.macro-latest{display:flex;justify-content:center;align-items:baseline;gap:4px;margin-top:2px;padding:3px 0}
.macro-latest-label{font-size:9px;color:#94A3B8;font-weight:500}
.macro-latest-val{font-size:15px;font-weight:700;color:#1E293B}
.macro-latest-unit{font-size:9px;color:#64748B;font-weight:500}
.macro-latest-date{font-size:9px;color:#94A3B8}
.macro-note{font-size:9px;color:#94A3B8;margin-top:1px}
.macro-card{cursor:pointer;transition:transform .15s,box-shadow .15s}
.macro-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.macro-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:moFade .2s}
.macro-modal-card{background:#fff;border-radius:16px;padding:24px 28px 18px;width:680px;max-width:94vw;max-height:90vh;overflow-y:auto;cursor:default;box-shadow:0 24px 80px rgba(0,0,0,.25);position:relative;animation:moZoom .25s}
.macro-modal-card .macro-card{border:none;padding:0;background:transparent;cursor:default}
.macro-modal-card .macro-card:hover{transform:none;box-shadow:none}
.macro-modal-card .macro-card-title{font-size:15px;min-height:auto;margin-bottom:10px}
.macro-modal-card .macro-legend,.macro-modal-card [style*=legend]{font-size:11px!important}
.macro-modal-close{position:absolute;top:10px;right:16px;font-size:26px;cursor:pointer;color:#94A3B8;background:none;border:none;line-height:1;z-index:10;padding:4px 8px;border-radius:6px}
.macro-modal-close:hover{color:#475569;background:#F1F5F9}
.macro-data-section{margin-top:14px;border-top:1px solid #E2E8F0;padding-top:10px}
.macro-data-toggle{background:#F8FAFC;border:1px solid #CBD5E1;padding:6px 16px;border-radius:6px;font-size:12px;color:#64748B;cursor:pointer;font-weight:500}
.macro-data-toggle:hover{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.macro-data-table-wrap{margin-top:10px;max-height:340px;overflow-y:auto;border:1px solid #E2E8F0;border-radius:8px}
.macro-data-table{width:100%;border-collapse:collapse;font-size:12px}
.macro-data-table th{background:#F8FAFC;padding:7px 12px;text-align:right;font-weight:600;color:#475569;border-bottom:2px solid #E2E8F0;position:sticky;top:0}
.macro-data-table th:first-child{text-align:left}
.macro-data-table td{padding:5px 12px;text-align:right;border-bottom:1px solid #F1F5F9;color:#334155;font-variant-numeric:tabular-nums}
.macro-data-table td:first-child{text-align:left;color:#64748B;font-weight:500}
.macro-data-table tbody tr:hover td{background:#EEF2FF}
.macro-na{color:#CBD5E1!important}
@keyframes moFade{from{opacity:0}to{opacity:1}}
@keyframes moZoom{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:768px){.header{padding:14px 16px}.header-left h1{font-size:16px}.stats-row{padding:10px 14px;gap:6px}.stat-pill{padding:8px 12px;font-size:12px}.pill-label{font-size:11px}.content{padding:0 12px 40px}.section-header{padding:12px 14px 0}.events-grid{grid-template-columns:1fr;padding:4px 14px 14px}}
</style>
</head>
<body>

<div class="standalone-banner" id="standaloneBanner">Offline mode · Run <code>python3 web_app.py</code> for live updates</div>

<header class="header">
  <div class="header-left"><div class="header-logo">PY</div><div><h1>巴拉圭简报</h1><div class="subtitle" id="headerSubtitle"></div></div></div>
  <div class="header-right"><button class="btn-secondary" id="btnMacro" onclick="openMacroModal()" title="Update CPI/RIN">Macro</button><button class="btn-secondary" id="btnHistory" onclick="showHistory()">History</button><button class="btn-primary" id="btnUpdate" onclick="refreshBriefing()">Refresh</button><button class="btn-lang" id="langBtn" onclick="switchLanguage()">中文</button></div>
</header>

<div class="stats-row" id="statsRow"></div>
<div class="content" id="contentArea"></div>

window.EMBEDDED_BRIEFINGS = {"zh": {"topic": "巴拉圭简报", "time_span": "2026年8月31日 — 2026年9月6日", "time_label": "最近一周", "sections": [{"title": "一、宏观经济动态", "tier": 1, "events": [{"title": "巴拉圭8月通胀持平，为0.0%；12个月通胀率回落至1.5%（2026-09-04）", "date": "2026-09-04", "source_url": "https://www.abc.com.py/economia/2026/09/04/inflacion-cero-en-agosto-pero-desde-que-asumio-pena-alimentos-subieron-23/", "source_name": "ABC Color", "summary": "巴拉圭央行报告称，2026年8月巴拉圭消费者价格指数环比持平（0.0%），使12个月通胀率降至1.5%——低于7月的1.6%，约为2025年8月4.6%的三分之一。这一读数使通胀率远低于央行目标区间，并在9月21日货币政策委员会会议前支撑了中性政策立场。在强势瓜拉尼的支撑下，可贸易商品通胀处于低位，这使巴拉圭央行有余地在出口商要求干预的呼声与货币稳定之间进行权衡，而食品价格仍是物价篮子中的主要上行压力。", "image_url": "https://www.abc.com.py/pf/resources/images/OG-Image-ABC.png?d=2590", "is_gov_source": false, "is_authoritative": true}, {"title": "截至8月底外汇远期合约激增30%至20.5亿美元，企业对冲瓜拉尼走强（2026-09-04）", "date": "2026-09-04", "source_url": "https://www.lanacion.com.py/negocios_edicion_impresa/2026/09/04/contratos-de-dolar-a-futuro-aumento-30-hasta-agosto/", "source_name": "La Nación", "summary": "据La Nación援引巴拉圭央行（BCP）数据报道，截至8月底，巴拉圭美元远期合约余额较此前增长约30%，达约20.5亿美元。该激增反映企业在瓜拉尼跌破每美元6,000关口后加大汇率对冲力度，本币外汇衍生品市场随之深化。对冲规模上升表明企业预期本币升值将持续，并进一步施压央行在维持不干预汇率立场的同时，回应出口商对竞争力的关切。", "image_url": "https://www.lanacion.com.py/resizer/v2/A2OTOCSRCFBYPJCUFD6XIEEU7E.jpg?auth=ea6aeb1939a1b626abc8de1d6a90d74570a5e0bd26c6e413de34fa39cb07caa8&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "8月税收收入仅增长2.4%，海关收入因瓜拉尼走强下降5.4%（2026-09-05）", "date": "2026-09-05", "source_url": "https://1000noticias.com.py/2026/09/05/recaudacion-tributaria-crecio-24-en-agosto/", "source_name": "1000 Noticias", "summary": "巴拉圭国家税收总局在2026年8月以现金形式征收了约3.116万亿瓜拉尼（约5.28亿美元），同比仅增长2.4%。国内税收收入增长9.3%——主要受增值税带动——而海关税收下降5.4%，受到瓜拉尼走强和进口货值走软的拖累。整体增长乏力加剧了2027年预算草案中可见的财政压力，并使医生及其他公共部门工会的工资和社会诉求融资更加复杂。", "image_url": "https://1000noticias.com.py/wp-content/uploads/2026/07/DNIT-FACHADA-2024-01-2.jpg", "is_gov_source": false, "is_authoritative": false}], "impact_analysis": "", "user_notes": "", "description": "🇵🇾 巴拉圭宏观经济日报\n\n📌 巴拉圭央行（BCP）在2025年3月货币政策会议上作出决定，将货币政策利率（MPR）维持在6.00%。这一决定符合市场预期。然而，货币政策委员会（CPM）的声明表明，这一决定并非一致通过——委员会内部存在分歧。此外，声明不再重复前几次会议中关于未来货币政策利率路径的指引。\n\n📌 支持将货币政策利率维持在6.00%的意见基于以下理由：在产出缺口为负、通胀预期与目标保持一致的环境下，2025年不会对货币政策利率进行调整。然而，反对意见则认为，考虑到国内需求表现、更高的财政刺激预期，以及全球货币宽松周期放缓，应及时评估将利率降至中性水平的可行性。\n\n📌 2月份消费者物价指数（CPI）环比上涨0.4%。同比通胀率上升至4.3%（1月份：4.1%）。这一水平已达到巴拉圭央行货币政策宽松周期的通胀目标上限。根据我们证券公司的估计，由于国内燃料价格上调以及食品篮子的特定项目（如牛肉）推动，3月份通胀可能维持在4.3%左右。这反映出，央行设定货币政策利率6.00%的名义参考利率仍明显高于其名义中性参考水平。该中性参考利率由央行估计，2025年的区间在3.80%至4.80%之间。\n\n📌 巴拉圭央行还公布了经济变量预期调查（EVE）。该调查每月在货币政策会议前进行，由本地和外国金融机构及咨询公司参与。3月份的EVE调查显示，市场预计货币政策利率将更快下降。一致预期是2025年内货币政策利率将从6.00%降至5.25%（比之前的调查低25个基点），到2026年底进一步降至5.00%。对于2026年，一致预期货币政策利率将保持在5.00%。CPI月度变化预期中位数为+0.2%，同比通胀率预计在2025年底达到4.0%。美元兑瓜拉尼汇率（₲/$）预计为7,950。GDP增长预期中位数维持在3.0%。财政赤字占GDP的比重上调至2.5%（此前：2.3%）。与此同时，预计财政部将发行总额为6.6万亿瓜拉尼的债券，2025年财政部所有来源的资金需求估计为14.9万亿瓜拉尼。中性货币政策利率预期值维持在4.0%。\n\n📌 市场动态方面，受假期影响，本周全球交易活动有所减少。大豆价格小幅反弹，与3.2%的涨幅保持一致，受美国种植面积减少的预期支撑。受美国对委内瑞拉石油进口国加征关税以及美国原油库存下降的影响，WTI原油价格升至70美元/桶。巴拉圭瓜拉尼在银行间外汇市场保持相对稳定，美元兑瓜拉尼汇率收于7,970。基准债券方面，2033年美元主权债收益率维持在6.90%，而2050年债券收益率收于7.15%。\n\n📌 信用评分：主权评级；\n\n📌 Basa银行观点：鉴于央行在数据依赖框架下继续实施宽松周期，维持2025年货币政策利率5.50%的预期，下一次货币政策会议定于5月。这次会议可能为讨论新的降息提供空间，原因是通胀最新增长部分是由于供给因素，而这些因素可能会在后续月份回落。"}, {"title": "二、政治与政策动态", "tier": 1, "events": [{"title": "国会预算委员会将开始审查按3.9%财政赤字编制的2027年预算（2026-09-06）", "date": "2026-09-06", "source_url": "https://www.lanacion.com.py/politica_edicion_impresa/2026/09/06/bicameral-de-presupuesto-iniciara-estudio-del-pgn/", "source_name": "La Nación", "summary": "巴拉圭两院预算委员会将于9月7日（星期一）开始审议2027年总预算（PGN），此前行政部门提交了一项建立在占GDP 3.9%的财政赤字基础上的法案——远高于2013年《财政责任法》规定的1.5%上限。分析人士警告，刚性支出（工资、养老金和强制性转移支付）正在挤出生产性投资，而医生和其他工会的加薪诉求进一步增加压力。随着国会审议该法案，围绕财政锚和公共债务上限的辩论将更加激烈。", "image_url": "https://www.lanacion.com.py/resizer/v2/SOXCMIKQH5BXLMLUYA52PU5Q6A.jpg?auth=d57fd0495c66d32701047fdf315c6fb52401a1bca7e194e6f73f398e72863535&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "培尼亚排除增税，并在财政压力加剧之际捍卫低税负（2026-09-04）", "date": "2026-09-04", "source_url": "https://www.latribuna.com.py/politica/2026/09/04/pena-ratifica-compromiso-de-no-alterar-la-politica-tributaria/", "source_name": "La Tribuna", "summary": "总统圣地亚哥·佩尼亚重申，其政府不会改变税收政策，拒绝了国会提出的加税提议，这些提议是为回应医生和其他社会薪酬诉求而提出的。佩尼亚在卡瓜苏与大豆生产者交谈时，捍卫巴拉圭的低税负作为竞争力支柱，并排除加税可能，即便财政收入增长放缓，且2027年预算草案将赤字目标设定为国内生产总值的3.9%。这一立场使支出纪律成为主要调整杠杆，并加大了国会预算辩论的风险。", "image_url": "https://www.latribuna.com.py/resizer/v2/6UHMCULDYZATFPXNUIA4NNC5BM.jpeg?smart=true&auth=f69a1f9f524857a74c4fbcf2c7bb51b8e8e39acab00fdb3efefea5234c1e5445&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭工业与贸易部及投资与出口促进局在蒙得维的亚商业论坛上争取乌拉圭投资者（2026-09-03）", "date": "2026-09-03", "source_url": "https://www.lanacion.com.py/negocios/2026/09/03/autoridades-del-mic-y-rediex-buscan-fortalecer-alianzas-con-empresarios-uruguayos/", "source_name": "La Nación", "summary": "工业与商务部长马尔科·里克尔梅和投资与出口促进局副局长爱德华多·古斯塔莱率领巴拉圭代表团，于9月初在蒙得维的亚举行的“连接巴拉圭与乌拉圭机遇”论坛上向约350名乌拉圭企业家推介巴拉圭。代表团宣传了巴拉圭的投资激励措施、贸易联系以及该国清洁能源优势，以加强双边经济联系，这是政府吸引传统伙伴以外外国直接投资的更广泛努力的一部分。", "image_url": "https://www.lanacion.com.py/resizer/v2/V3WWFI3UIVHUBKRK7ZSFODRUAA.jpeg?auth=8bdeeb463a45feda37c4ed3b150a02925bbac530cb4404a07795b23aa4ea0a9c&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": "", "description": "巴拉圭财政责任法拟议修改引发经济学家警告。巴拉圭的财政责任法拟议修改削弱了赤字目标，将引发更多公共债务并危及投资级评级。一家顶尖经济咨询公司警告称。\n\n上周，巴拉圭众议院批准了将年度财政赤字目标从GDP的1.5%改为1.9%的措施。该法案还规定，经常性支出的增长不得超过过去三年平均收入的增速，除非获得紧急状态或国会多数票的批准。\n\n该法案的发起人辩称，为基础设施投资筹集资金需要灵活调整赤字目标。\n\n但亚松森咨询公司MF经济研究所表示，改革通常会将年度赤字从历史平均水平推高GDP的0.7个百分点，因为过往的财政部长们都将支出最大化。因此，该咨询公司估计，公共债务在中期内可能升至GDP的40%左右。\n\n主权债券投资者密切关注的一直是巴拉圭公共债务的低水平。巴拉圭财政部预计公共部门债务占GDP的比例将从去年的36.4%升至38.3%。\n\n惠誉评级和穆迪评级均给予巴拉圭投资级评级，标普全球评级给予其BB+评级。\n\nMF经济研究所数据显示，在财政责任法于2015年实施前，巴拉圭财政赤字在2004-14年间平均占GDP的1.5%。在该法案实施后，2015-24年间赤字降至GDP的2.2%。\n\n该法案现已在参议院审议。如果原始版本获得通过（经济学家认为这很可能），财政部长将必须设定赤字上限为GDP的1.9%。\n\n基准预测是，财政部长们将按照法律允许的最大限额编制预算，这意味着债务在中期内可能会达到GDP的40%左右，MF经济研究所表示。\n\n然而，更大的风险源于“创造性会计”做法，这些做法近年来愈发普遍，例如根据最高法院裁决，利用一次性债券发行来偿还历史债务或支付欠承包商款项，该咨询公司补充道。\n\n巴拉圭财政责任法将年度赤字限制在GDP的1.5%，但允许例外。去年的赤字上限为2.6%，因为巴拉圭在2023年陷入衰退后触发了免责条款。\n\n巴拉圭官员去年一直表示，赤字将在2026年恢复到1.5%，总统圣地亚哥·培尼亚则希望基础设施投资接近GDP的2%。巴拉圭议员去年底批准了一项计划，允许发行价值高达40亿美元的债券用于基础设施，而培尼亚还通过公私合作模式吸引了投资。\n\n国际货币基金组织在最近一次于2月完成的评估中表示，中期赤字目标为GDP的1.5%，公共债务锚定在GDP的30%以下，“是维护宏观稳定和维持债务可持续性的关键财政支柱”。\n\n该基金组织还表示，公共投资需求可以通过提高支出效率来满足，而不是提高财政赤字目标。"}, {"title": "三、社会与安全形势", "tier": 1, "events": [{"title": "医生工会“全国医生工会”（SINAMED）一致拒绝政府薪酬方案，呼吁9月21日至22日举行48小时罢工（2026-09-03）", "date": "2026-09-03", "source_url": "https://www.abc.com.py/nacionales/2026/09/03/medicos-en-pie-de-guerra-rechazan-por-unanimidad-el-escalafon-y-la-oferta-del-gobierno/", "source_name": "ABC Color", "summary": "在一次特别大会上，巴拉圭全国医生工会（SINAMED）一致拒绝了政府提出的薪资与职业阶梯（escalafón）方案，并宣布于9月21日至22日发起新一轮48小时全国罢工。此前一周，该工会已进行了为期五天的停工。医生们要求调整自2012年以来被冻结的薪资，并规范合同关系，而政府则认为所提议的加薪幅度难以承受。此次罢工日期恰逢巴拉圭央行（BCP）9月21日的货币政策委员会（MPC）会议，使公共卫生服务中断问题继续留在国家议程之上。", "image_url": "https://www.abc.com.py/pf/resources/images/OG-Image-ABC.png?d=2590", "is_gov_source": false, "is_authoritative": true}, {"title": "公立医院专科医生大规模辞职人数达到126人，另有约350人正在酝酿中（2026-09-04）", "date": "2026-09-04", "source_url": "https://www.hoy.com.py/nacionales/2026/09/04/renuncias-medicas-totalizan-126-otras-350-estan-en-camino", "source_name": "Hoy", "summary": "席卷巴拉圭公共卫生系统的辞职潮进一步加深，已有126名专科医生正式辞职——包括阿科斯塔纽儿科医院、特立尼达医院、圣巴勃罗医院和创伤医院——据报道还有约350人正在准备辞职。这些人员流失可能导致公立医疗网络的专科服务空心化，并加剧政府与医疗工会之间工资争端的紧迫性，国会和行政部门仍在寻求解决危机的方案。", "image_url": "https://www.lanacion.com.py/resizer/v2/GLMU53SMLVCSNADHFBWY77XWUY.jpg?auth=975138b52219b566350054a45813a3e6df093eb4357d544fcc9a5f36819ad332&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "滴落行动：警方在瓜兰巴雷捣毁毒品微量贩运和洗钱团伙（2026-09-05）", "date": "2026-09-05", "source_url": "https://www.abc.com.py/policiales/2026/09/05/operacion-drop-quienes-son-los-detenidos-y-que-incautararon-las-autoridades-en-guarambare/", "source_name": "ABC Color", "summary": "在“滴落行动”中，针对瓜兰巴雷市圣米格尔社区五处房产的协调突袭捣毁了一个与可卡因、快克可卡因和大麻微量贩运及洗钱有关的网络。四名男子被捕，毒品、现金及其他证据被查获。此次行动凸显了当局在都会区打击毒品分销和金融犯罪的行动，这是针对有组织犯罪更广泛行动的一部分，该行动还瞄准了上巴拉那省等边境地区。", "image_url": "https://www.abc.com.py/pf/resources/images/OG-Image-ABC.png?d=2590", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭在卢克逮捕巴西“红色司令部”隧道专家桑德罗·洛科（2026-09-03）", "date": "2026-09-03", "source_url": "https://www.ultimahora.com/sorprenden-a-presunto-integrante-del-comando-vermelho-experto-en-tuneles-oculto-en-luque", "source_name": "Última Hora", "summary": "在“装甲连接行动”中，警方在卢克市（中央省）上松林区逮捕了巴西籍人士若昂·巴蒂斯塔·维埃拉·多斯桑托斯，外号“疯子桑德罗”。此人自2021年起被巴西司法部门通缉，是红色指挥部成员，以隧道专家著称，涉嫌策划通过地道越狱或抢劫银行。此次逮捕凸显了首都周边地区有组织跨境犯罪带来的压力，也反映出巴拉圭与巴西安全部队之间持续开展合作。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/0d8c1db/2147483647/strip/true/crop/1600x900+0+110/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F05%2F05%2Fdfffc70549f580d168571f28ed49%2Fallanamiento.jpg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": "", "description": "您提供的“英文内容”实际上是翻译指令本身，并没有包含需要翻译的英文原文。请发送您需要翻译成简体中文的英文内容，我会按照您的要求完成翻译。"}, {"title": "四、国际关系与外交", "tier": 1, "events": [{"title": "埃斯特法尼亚·拉特尔萨宣誓就任巴拉圭驻美国大使（2026-09-04）", "date": "2026-09-04", "source_url": "https://www.lanacion.com.py/politica/2026/09/04/estefania-laterza-juro-como-embajadora-de-paraguay-ante-ee-uu/", "source_name": "La Nación", "summary": "总统圣地亚哥·培尼亚在参议院依照宪法规定同意后，主持了埃斯特法尼娅·拉特尔萨·德洛斯里奥斯宣誓就任巴拉圭驻美国大使的仪式，接替古斯塔沃·莱特。拉特尔萨表示，巴拉圭与美国双边关系正处于“黄金时刻”，并誓言将其转化为一项持久议程。这一任命强化了巴拉圭在贸易、安全与投资合作方面向华盛顿的战略倾斜，这也是本届政府外交政策的一大支柱。", "image_url": "https://www.lanacion.com.py/resizer/v2/BMGSY3RAZZCYRISI2GNN3IUEAE.jpeg?auth=529ac6fe56e81557b2bb0e98c02d84fd368c599632b662ac780e4d51a062bdee&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "南方共同市场外长结束蒙得维的亚会谈，未就欧盟出口配额达成协议；巴拉圭坚持平等的25%份额（2026-09-03）", "date": "2026-09-03", "source_url": "https://www.lanacion.com.py/negocios/2026/09/03/paraguay-defiende-reparto-equitativo-de-cuotas-de-exportacion-a-la-ue/", "source_name": "La Nación", "summary": "由乌拉圭担任轮值主席国召集的南方共同市场外长非正式会议在蒙得维的亚（9月2日）举行，会议未就南方共同市场—欧盟协定过渡机制下欧盟出口配额的分配达成一致。巴拉圭继续坚持每个成员应均等获得25%的份额，而巴西和阿根廷则倾向于基于出口历史和经济权重的分配标准。由于乌拉圭已在先到先得规则下获取了大部分大米配额，巴拉圭警告称当前机制使不平等长期化；此事定于10月进行审议。", "image_url": "https://www.lanacion.com.py/resizer/v2/FFIZDCCD5ZFEFKFRUQ6BZOF64Q.webp?auth=6253713c291e09192c5801ae9be34cb54b8748125cc00e5f906434deef0b3e15&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭国会推动宣布以人工智能为核心的第三届台湾-巴拉圭科技论坛符合国家利益（2026-09-05）", "date": "2026-09-05", "source_url": "https://www.lanacion.com.py/politica/2026/09/05/proyectan-declarar-de-interes-nacional-la-tercera-edicion-del-taiwan-paraguay-technology-forum/", "source_name": "La Nación", "summary": "巴拉圭众议院的一项决议草案提议宣布第三届台湾—巴拉圭科技论坛——以人工智能为核心——具有国家、学术和技术意义。该论坛定于9月11日至12日在巴拉圭央行会议中心举行，并以“伊瓜苏数字”主权人工智能数据中心项目及相关合作为基础。此举凸显了在北京持续施压的背景下，人工智能和技术合作如何成为巴拉圭与台湾关系的核心。", "image_url": "https://www.lanacion.com.py/resizer/v2/QVZLCRWKONHAXPSS7QFV6VA54A.jpeg?auth=65f7725d291939fa18b78a36131dbec614b038d0296bbc5933880aa635a5a4aa&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭陆军代表团访问美国国防机构以深化安全合作（2026-09-06）", "date": "2026-09-06", "source_url": "https://www.lanacion.com.py/politica_edicion_impresa/2026/09/06/visita-a-ee-uu-apunta-a-fortalecer-cooperacion/", "source_name": "La Nación", "summary": "由美洲陆军会议（CEA）常任秘书罗萨利诺·埃斯科瓦尔准将率领的巴拉圭陆军代表团对美国国防机构进行了正式访问，旨在加强战略与安全合作。此行反映出与华盛顿不断深化的军队间联系，并补充了双边议程中的安全层面，包括针对影响巴拉圭边境地区的跨境有组织犯罪开展联合行动。", "image_url": "https://www.lanacion.com.py/resizer/v2/QTKSQNFTFFH47DA6IEWG2EQSQA.jpg?auth=852408ef12c335e2e3dd05b4eeccac51091c29f6f7048977a27ea1876a5813e5&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": "", "description": "我注意到您的消息中只包含了翻译指令，但没有附上需要翻译的英文内容。请发送您需要翻译的巴拉圭宏观经济简报英文内容，我会按照您的要求完整翻译为简体中文。"}, {"title": "五、行业聚焦：电信、数字能源与人工智能", "tier": 1, "events": [{"title": "国家电力管理局西特兰德工会因伊泰普电价谈判陷入僵局，号召周一抗议“电费暴涨”（2026-09-04）", "date": "2026-09-04", "source_url": "https://www.abc.com.py/nacionales/2026/09/04/trabajadores-de-la-ande-convocan-a-protesta-este-lunes-ante-riesgo-de-tarifazo-electrico/", "source_name": "ABC Color", "summary": "国家电力公司ANDE的工会Sitrande及盟友工会呼吁9月7日（周一）在亚松森举行抗议游行，反对可能出现的电价“暴涨”（tarifazo）。工会领袖Adolfo Villalba指责ANDE总裁Miguel Báez及管理层在伊泰普购电成本谈判陷入僵局之际推动上调电价。该动员为能源部门改革增添劳资摩擦，表明在ANDE财务状况与电力市场化改革备受审视之际，电价调整将遭遇阻力。", "image_url": "https://www.abc.com.py/pf/resources/images/OG-Image-ABC.png?d=2590", "is_gov_source": false, "is_authoritative": true, "client_tag": "国家电力管理局——电价与能源市场改革"}, {"title": "国家电力管理局“我们的节约”欠费追缴活动用户数突破50万；两期活动共清缴超过1.58亿美元（2026-09-06）", "date": "2026-09-06", "source_url": "https://www.lanacion.com.py/pais_edicion_impresa/2026/09/06/ande-mas-de-500000-usuarios-aprovecharon-nande-ahorro/", "source_name": "La Nación", "summary": "据La Nación报道，ANDE 2026年“Ñande Ahorro”欠费纾困活动惠及逾50万用户：约107,626户家庭对超过1.23亿美元的逾期欠费办理分期，另有约41.9万客户以现金结清欠款，两期合计核销欠费超1.58亿美元。该计划在电力市场化改革前夕增强了ANDE的回收能力与财务状况，在私营发电与电价改革讨论推进之际降低了公用事业对欠费的敞口。", "image_url": "https://www.lanacion.com.py/resizer/v2/FTUBGY2P4VCVBLGQKHXFTCBWZE.jpg?auth=c290bc97cb08e0783c25cea20fe90e4b88241af29fef835a78cb49b70cf85e4f&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true, "client_tag": "国家电力管理局——欠费收缴/财务健康"}, {"title": "韩国爱诺森与伊泰普科技园签署谅解备忘录，将在纳兰哈尔建设可扩展至1吉瓦的人工智能数据中心（2026-09-04）", "date": "2026-09-04", "source_url": "https://biz.chosun.com/industry/business_info/2026/09/04/EK44YZBENVCODGU5DSNX2C2PPE/", "source_name": "Chosun Biz", "summary": "韩国企业Ainocean在东方市与巴拉圭伊泰普科技园（PTI，执行董事Carlos Mercado Lotera）签署合作备忘录，拟在纳兰哈尔科技园区建设由伊泰普水电驱动的AI数据中心（AIDC），并规划模块化扩展至最高1吉瓦。本地伙伴ASTI Energy与ASTI Commercial & Negocios负责执行与本地协调。项目首个锚定需求是面向巴拉圭公共教育体系的“AI导师”，计划三年内覆盖约28万名学生，其后扩展至医疗、金融与能源领域的AI服务。（据韩国财经媒体报道。）", "image_url": "https://biz.chosun.com/resizer/v2/P4S645L7AZEF3I2XL374D752O4.jpg?auth=160d52f2c8000e16cc132c426cfd4c5db0d631ff5d60181005bd93cde1721347&width=700&height=367&smart=true", "is_gov_source": false, "is_authoritative": false, "client_tag": "艾诺海洋 / 伊泰普科技园——人工智能数据中心"}], "impact_analysis": "", "user_notes": "", "description": ""}, {"title": "六、关键客户动态", "tier": 1, "events": [], "impact_analysis": "", "user_notes": "", "description": "好的，请发送需要翻译的英文内容。"}, {"title": "VII. 商业运营综合影响分析", "tier": 2, "events": [], "impact_analysis": "🟢 低通胀巩固中性货币政策立场：8月CPI环比持平（同比1.5%，BCP），通胀远低于目标，支持央行在9月21日货币政策委员会会议前维持5.50%不变。瓜拉尼在早前跌破每美元6,000关口后企稳于约5,961瓜拉尼/美元（BCP官方，9月4日），而远期合约余额增长约30%至20.5亿美元——明确显示企业预期本币升值将持续，利好进口商购买力，却挤压出口商及美元收入业务。\n\n🟡 财政压力积聚：8月税收仅增长2.4%（海关收入下降5.4%），而政府2027年预算草案按GDP的3.9%赤字编制——远高于1.5%的财政责任法上限。由于Peña排除增税，可信度将取决于支出纪律；预算审批若延迟可能拖慢公共采购与合同付款。\n\n🔴 社会压力持续：医生全票拒绝政府方案，并号召9月21-22日再次举行48小时罢工；已有126名专科医生辞职，另有约350份在途。面向公众的运营及涉医项目应围绕该日期规划应对中断。\n\n🟡 能源部门劳资摩擦：ANDE工会Sitrande就伊泰普电价谈判僵局可能引发“电价暴涨”号召抗议——与此同时ANDE“Ñande Ahorro”活动（逾50万用户、核销超1.58亿美元）在市场化改革前强化了其财务。能源政策信号预计仍将反复。\n\n🟢 数字能源与AI动能：Ainocean-伊泰普PTI备忘录（拟在纳兰哈尔建设可扩展至1吉瓦的AI数据中心）为巴拉圭清洁能源-AI管线及数据中心电力需求再添新项目。客户侧电信动态本周平淡：Tigo与Personal正处于5G实施的90/180天窗口内（2027年2月前商用），Claro继续领先部署，Nubicom将于10月面临Conatel核查。", "user_notes": "", "description": "请提供需要翻译的英文内容，我会按照您的要求完整翻译为简体中文。"}, {"title": "八、对中国企业的针对性建议", "tier": 2, "events": [], "impact_analysis": "🔴 高风险——地缘政治与台湾轨道不变：巴拉圭持续推动与台湾的制度化合作——国会推进将第三届“台湾-巴拉圭科技论坛”（9月11-12日，以AI为主题）宣布为国家利益活动，新任驻美大使亦已就任。中资（含政府关联）直接参与公共5G、数据中心或关键基础设施招标的通道依然关闭；任何涉巴项目均须先行严格合规审查。\n\n🟢 机遇——间接设备与贸易通道：瓜拉尼企稳于约5,961瓜拉尼/美元、远期对冲规模达20.5亿美元，进口购买力稳定，利好经第三方集成商或巴西/阿根廷子公司进入市场的中国供应商——这是进入该市场既有的间接路径。\n\n🟡 谨慎——财政与社会敞口：2027年预算草案按GDP3.9%赤字、8月收入增长放缓（海关-5.4%），或致公共采购延迟；医生新一轮罢工（9月21-22日）与ANDE“电价暴涨”抗议叠加，需在排期与用工规划中计入劳资与社会摩擦。\n\n🟢 机遇——能源与AI数据中心建设：Ainocean-PTI项目、ANDE回收能力改善及电力市场开放共同支撑对变压器、电网设备、光伏组件与数据中心电力的需求。中国供应商可借助与非中国伙伴组建的联合体参与，聚焦受限程度低于电信的能源基础设施领域。", "user_notes": "", "description": "请发送需要翻译的英文内容。"}]}, "en": {"topic": "Paraguay Briefing", "time_span": "August 31 – September 6, 2026", "time_label": "Past Week", "sections": [{"title": "I. Macroeconomic Developments", "tier": 1, "events": [{"title": "Paraguay Inflation Flat at 0.0% in August; 12-Month Rate Eases to 1.5% (2026-09-04)", "date": "2026-09-04", "source_url": "https://www.abc.com.py/economia/2026/09/04/inflacion-cero-en-agosto-pero-desde-que-asumio-pena-alimentos-subieron-23/", "source_name": "ABC Color", "summary": "The BCP reported that Paraguay's consumer price index was unchanged (0.0%) month-on-month in August 2026, taking the 12-month inflation rate to 1.5% — down from 1.6% in July and roughly a third of the 4.6% recorded in August 2025. The reading keeps inflation far below the central bank's target zone and supports a neutral policy stance ahead of the September 21 MPC meeting. Low tradable-goods inflation, reinforced by the strong guaraní, gives the BCP room to balance exporters' calls for intervention against currency stability, while food prices remain the main upward pressure within the basket.", "image_url": "https://www.abc.com.py/pf/resources/images/OG-Image-ABC.png?d=2590", "is_gov_source": false, "is_authoritative": true}, {"title": "FX Forward Contracts Jump 30% by End-August to USD 2.05 Billion as Firms Hedge Guaraní Strength (2026-09-04)", "date": "2026-09-04", "source_url": "https://www.lanacion.com.py/negocios_edicion_impresa/2026/09/04/contratos-de-dolar-a-futuro-aumento-30-hasta-agosto/", "source_name": "La Nación", "summary": "The outstanding balance of dollar-forward (futuro) contracts in Paraguay rose roughly 30% through end-August to about USD 2.05 billion, according to BCP data reported by La Nación. The surge reflects companies stepping up currency-hedging after the guaraní broke below G. 6,000 per dollar, deepening the local FX derivatives market. Rising hedging volumes signal that corporates expect the appreciation to persist, and they reinforce pressure on the BCP to address exporter competitiveness concerns even as it maintains a hands-off exchange-rate stance.", "image_url": "https://www.lanacion.com.py/resizer/v2/A2OTOCSRCFBYPJCUFD6XIEEU7E.jpg?auth=ea6aeb1939a1b626abc8de1d6a90d74570a5e0bd26c6e413de34fa39cb07caa8&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Tax Revenue Up Only 2.4% in August as Customs Receipts Fall 5.4% on Strong Guaraní (2026-09-05)", "date": "2026-09-05", "source_url": "https://1000noticias.com.py/2026/09/05/recaudacion-tributaria-crecio-24-en-agosto/", "source_name": "1000 Noticias", "summary": "Paraguay's National Tax Revenue Directorate (DNIT) collected about G. 3,116 billion (roughly USD 528 million) in cash during August 2026, up just 2.4% year-on-year. Domestic tax revenue rose 9.3% — led by VAT — while customs receipts fell 5.4%, hurt by the strong guaraní and softer import values. The sluggish headline growth sharpens the fiscal strain visible in the 2027 budget draft and complicates the financing of wage and social demands from doctors and other public-sector unions.", "image_url": "https://1000noticias.com.py/wp-content/uploads/2026/07/DNIT-FACHADA-2024-01-2.jpg", "is_gov_source": false, "is_authoritative": false}], "impact_analysis": "", "user_notes": ""}, {"title": "II. Political & Policy Developments", "tier": 1, "events": [{"title": "Congress Budget Committee to Begin Review of 2027 Budget Drafted on a 3.9% Fiscal Deficit (2026-09-06)", "date": "2026-09-06", "source_url": "https://www.lanacion.com.py/politica_edicion_impresa/2026/09/06/bicameral-de-presupuesto-iniciara-estudio-del-pgn/", "source_name": "La Nación", "summary": "Paraguay's Bicameral Budget Commission will begin studying the 2027 General Budget (PGN) on Monday, September 7, after the Executive submitted a bill built on a 3.9%-of-GDP fiscal deficit — well above the 1.5% cap of the 2013 Fiscal Responsibility Law. Analysts warn that rigid spending (salaries, pensions and mandatory transfers) is crowding out productive investment, while wage demands from doctors and other unions add pressure. The debate over the fiscal anchor and the public-debt ceiling will intensify as Congress reviews the bill.", "image_url": "https://www.lanacion.com.py/resizer/v2/SOXCMIKQH5BXLMLUYA52PU5Q6A.jpg?auth=d57fd0495c66d32701047fdf315c6fb52401a1bca7e194e6f73f398e72863535&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Peña Rules Out Tax Hikes and Defends Low Tax Burden as Fiscal Strain Mounts (2026-09-04)", "date": "2026-09-04", "source_url": "https://www.latribuna.com.py/politica/2026/09/04/pena-ratifica-compromiso-de-no-alterar-la-politica-tributaria/", "source_name": "La Tribuna", "summary": "President Santiago Peña reaffirmed that his government will not alter tax policy, rejecting congressional proposals to raise taxes floated as a response to doctors' and other social pay demands. Speaking with soybean producers in Caaguazú, Peña defended Paraguay's low tax burden as a competitiveness pillar and ruled out tax hikes even as fiscal revenue growth slows and the 2027 budget draft targets a 3.9%-of-GDP deficit. The stance leaves spending discipline as the main adjustment lever and raises the stakes for the congressional budget debate.", "image_url": "https://www.latribuna.com.py/resizer/v2/6UHMCULDYZATFPXNUIA4NNC5BM.jpeg?smart=true&auth=f69a1f9f524857a74c4fbcf2c7bb51b8e8e39acab00fdb3efefea5234c1e5445&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay's MIC and Rediex Court Uruguayan Investors at Montevideo Business Forum (2026-09-03)", "date": "2026-09-03", "source_url": "https://www.lanacion.com.py/negocios/2026/09/03/autoridades-del-mic-y-rediex-buscan-fortalecer-alianzas-con-empresarios-uruguayos/", "source_name": "La Nación", "summary": "Industry and Commerce Minister Marco Riquelme and Rediex vice-minister Eduardo Gustale led Paraguay's pitch to about 350 Uruguayan entrepreneurs at the 'Conectando Oportunidades Paraguay-Uruguay' forum in Montevideo in early September. The delegation promoted Paraguayan investment incentives, trade links and the country's clean-energy advantages to strengthen bilateral economic ties, part of the government's broader drive to attract foreign direct investment beyond traditional partners.", "image_url": "https://www.lanacion.com.py/resizer/v2/V3WWFI3UIVHUBKRK7ZSFODRUAA.jpeg?auth=8bdeeb463a45feda37c4ed3b150a02925bbac530cb4404a07795b23aa4ea0a9c&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "III. Social & Security Landscape", "tier": 1, "events": [{"title": "Doctors' Union SINAMED Unanimously Rejects Government Pay Offer, Calls 48-Hour Strike for Sep 21-22 (2026-09-03)", "date": "2026-09-03", "source_url": "https://www.abc.com.py/nacionales/2026/09/03/medicos-en-pie-de-guerra-rechazan-por-unanimidad-el-escalafon-y-la-oferta-del-gobierno/", "source_name": "ABC Color", "summary": "In an extraordinary assembly, Paraguay's national doctors' union (SINAMED) unanimously rejected the government's salary and career-ladder (escalafón) offer and called a fresh 48-hour national strike for September 21-22, following a five-day stoppage the prior week. Doctors demand salary adjustments frozen since 2012 and regularization of contracts, while the government calls the proposed increases unaffordable. The strike date coincides with the BCP's September 21 MPC meeting and keeps public-health disruption on the national agenda.", "image_url": "https://www.abc.com.py/pf/resources/images/OG-Image-ABC.png?d=2590", "is_gov_source": false, "is_authoritative": true}, {"title": "Mass Resignations of Public-Hospital Specialists Reach 126 with Some 350 More in the Pipeline (2026-09-04)", "date": "2026-09-04", "source_url": "https://www.hoy.com.py/nacionales/2026/09/04/renuncias-medicas-totalizan-126-otras-350-estan-en-camino", "source_name": "Hoy", "summary": "The resignation wave sweeping Paraguay's public health system deepened, with 126 specialists having formally resigned — including at the Acosta Ñu pediatric hospital, Trinidad, San Pablo and the Trauma hospital — and roughly 350 more resignations reportedly in the pipeline. The departures threaten to hollow out specialized care in the public network and add urgency to the wage dispute between the government and medical unions, with Congress and the Executive still seeking a formula to resolve the crisis.", "image_url": "https://www.lanacion.com.py/resizer/v2/GLMU53SMLVCSNADHFBWY77XWUY.jpg?auth=975138b52219b566350054a45813a3e6df093eb4357d544fcc9a5f36819ad332&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Operation Drop: Police Dismantle Drug Micro-Trafficking and Money-Laundering Ring in Guarambaré (2026-09-05)", "date": "2026-09-05", "source_url": "https://www.abc.com.py/policiales/2026/09/05/operacion-drop-quienes-son-los-detenidos-y-que-incautararon-las-autoridades-en-guarambare/", "source_name": "ABC Color", "summary": "In 'Operation Drop', coordinated raids on five properties in Guarambaré's San Miguel neighborhood dismantled a network linked to micro-trafficking of cocaine, crack and marijuana as well as money laundering. Four men were arrested and drugs, cash and other evidence were seized. The operation underscores the authorities' campaign against drug distribution and financial crime in the metropolitan area, part of a broader push on organized crime that has also targeted border departments in Alto Paraná and elsewhere.", "image_url": "https://www.abc.com.py/pf/resources/images/OG-Image-ABC.png?d=2590", "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay Arrests Brazilian Comando Vermelho 'Tunnel Expert' Sandro Louco in Luque (2026-09-03)", "date": "2026-09-03", "source_url": "https://www.ultimahora.com/sorprenden-a-presunto-integrante-del-comando-vermelho-experto-en-tuneles-oculto-en-luque", "source_name": "Última Hora", "summary": "In 'Operation Conexión Armadillo', police arrested Brazilian national João Batista Vieira Dos Santos, alias 'Sandro Louco', in the Alto Pinar neighborhood of Luque (Central department). A fugitive from Brazilian justice since 2021 and a Comando Vermelho member known as a tunnel expert, he is suspected of planning tunnel-based escapes or bank robberies. The arrest highlights cross-border organized-crime pressure around the capital and continued cooperation between Paraguayan and Brazilian security forces.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/0d8c1db/2147483647/strip/true/crop/1600x900+0+110/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F05%2F05%2Fdfffc70549f580d168571f28ed49%2Fallanamiento.jpg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "IV. International Relations & Diplomacy", "tier": 1, "events": [{"title": "Estefanía Laterza Sworn In as Paraguay's Ambassador to the US (2026-09-04)", "date": "2026-09-04", "source_url": "https://www.lanacion.com.py/politica/2026/09/04/estefania-laterza-juro-como-embajadora-de-paraguay-ante-ee-uu/", "source_name": "La Nación", "summary": "President Santiago Peña administered the oath to Estefanía Laterza de los Ríos as Paraguay's ambassador to the United States, following Senate constitutional agreement, replacing Gustavo Leite. Laterza said Paraguay and the US are living a 'golden moment' in bilateral ties and vowed to turn it into a lasting agenda. The appointment reinforces Paraguay's strategic tilt toward Washington across trade, security and investment cooperation, a pillar of the administration's foreign policy.", "image_url": "https://www.lanacion.com.py/resizer/v2/BMGSY3RAZZCYRISI2GNN3IUEAE.jpeg?auth=529ac6fe56e81557b2bb0e98c02d84fd368c599632b662ac780e4d51a062bdee&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Mercosur Foreign Ministers End Montevideo Talks Without EU Export-Quota Deal; Paraguay Insists on Equal 25% Share (2026-09-03)", "date": "2026-09-03", "source_url": "https://www.lanacion.com.py/negocios/2026/09/03/paraguay-defiende-reparto-equitativo-de-cuotas-de-exportacion-a-la-ue/", "source_name": "La Nación", "summary": "An informal Mercosur foreign ministers' meeting in Montevideo (September 2), convened by Uruguay's pro-tempore presidency, ended without agreement on allocating EU export quotas under the Mercosur-EU deal's transitional mechanism. Paraguay continues to insist on an equal 25% share per member, while Brazil and Argentina favor criteria based on export history and economic weight. With Uruguay already capturing much of the rice quota under first-come, first-served rules, Paraguay warns the current mechanism perpetuates inequity; the matter is set for review in October.", "image_url": "https://www.lanacion.com.py/resizer/v2/FFIZDCCD5ZFEFKFRUQ6BZOF64Q.webp?auth=6253713c291e09192c5801ae9be34cb54b8748125cc00e5f906434deef0b3e15&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay Congress Moves to Declare 3rd Taiwan-Paraguay Technology Forum, Centered on AI, of National Interest (2026-09-05)", "date": "2026-09-05", "source_url": "https://www.lanacion.com.py/politica/2026/09/05/proyectan-declarar-de-interes-nacional-la-tercera-edicion-del-taiwan-paraguay-technology-forum/", "source_name": "La Nación", "summary": "A draft resolution in Paraguay's Chamber of Deputies proposes declaring the third edition of the Taiwan-Paraguay Technology Forum — centered on artificial intelligence — of national, academic and technological interest. The forum is scheduled for September 11-12 at the BCP's convention center and builds on the 'Yguazú Digital' sovereign AI data-center project and related cooperation. The move underscores how AI and technology cooperation has become the centerpiece of Paraguay's relationship with Taiwan amid continued pressure from Beijing.", "image_url": "https://www.lanacion.com.py/resizer/v2/QVZLCRWKONHAXPSS7QFV6VA54A.jpeg?auth=65f7725d291939fa18b78a36131dbec614b038d0296bbc5933880aa635a5a4aa&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguayan Army Delegation Visits US Defense Institutions to Deepen Security Cooperation (2026-09-06)", "date": "2026-09-06", "source_url": "https://www.lanacion.com.py/politica_edicion_impresa/2026/09/06/visita-a-ee-uu-apunta-a-fortalecer-cooperacion/", "source_name": "La Nación", "summary": "A Paraguayan Army delegation headed by Brigadier General Rosalino Escobar, permanent secretary of the Conference of American Armies (CEA), carried out an official visit to United States defense institutions aimed at strengthening strategic and security cooperation. The trip reflects deepening military-to-military ties with Washington and complements the security dimension of the bilateral agenda, including joint operations against cross-border organized crime affecting Paraguay's border regions.", "image_url": "https://www.lanacion.com.py/resizer/v2/QTKSQNFTFFH47DA6IEWG2EQSQA.jpg?auth=852408ef12c335e2e3dd05b4eeccac51091c29f6f7048977a27ea1876a5813e5&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "V. Industry Focus: Telecom, Digital Energy & AI", "tier": 1, "events": [{"title": "ANDE Union Sitrande Calls Monday Protest Against 'Tarifazo' as Itaipú Tariff Talks Stall (2026-09-04)", "date": "2026-09-04", "source_url": "https://www.abc.com.py/nacionales/2026/09/04/trabajadores-de-la-ande-convocan-a-protesta-este-lunes-ante-riesgo-de-tarifazo-electrico/", "source_name": "ABC Color", "summary": "Sitrande and allied unions of state power utility ANDE called a protest and march in Asunción for Monday, September 7 over the risk of a 'tarifazo' (sharp electricity rate increase). Union leader Adolfo Villalba accused ANDE president Miguel Báez and management of moving toward higher tariffs as Itaipú power-cost negotiations stall. The mobilization adds labor friction to the energy-sector overhaul and signals resistance to tariff adjustments at a time when ANDE's finances and the market-opening reform are under scrutiny.", "image_url": "https://www.abc.com.py/pf/resources/images/OG-Image-ABC.png?d=2590", "is_gov_source": false, "is_authoritative": true, "client_tag": "ANDE — tariff & energy-market reform"}, {"title": "ANDE 'Ñande Ahorro' Arrears Campaign Tops 500,000 Users; Over USD 158 Million Regularized Across Two Editions (2026-09-06)", "date": "2026-09-06", "source_url": "https://www.lanacion.com.py/pais_edicion_impresa/2026/09/06/ande-mas-de-500000-usuarios-aprovecharon-nande-ahorro/", "source_name": "La Nación", "summary": "More than 500,000 users benefited from ANDE's 2026 'Ñande Ahorro' debt-regularization campaign, according to La Nación: some 107,626 families financed overdue debts exceeding USD 123 million, while roughly 419,000 clients settled outstanding bills in cash, together regularizing over USD 158 million across the two editions. The program strengthens ANDE's collections and financial position ahead of the electricity-market opening, reducing the utility's exposure to arrears as private generation and tariff-reform debates proceed.", "image_url": "https://www.lanacion.com.py/resizer/v2/FTUBGY2P4VCVBLGQKHXFTCBWZE.jpg?auth=c290bc97cb08e0783c25cea20fe90e4b88241af29fef835a78cb49b70cf85e4f&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true, "client_tag": "ANDE — arrears collection / financial health"}, {"title": "South Korea's Ainocean Signs MoU with Itaipú's PTI to Build AI Data Center Expandable to 1 GW in Naranjal (2026-09-04)", "date": "2026-09-04", "source_url": "https://biz.chosun.com/industry/business_info/2026/09/04/EK44YZBENVCODGU5DSNX2C2PPE/", "source_name": "Chosun Biz", "summary": "South Korean firm Ainocean signed a mutual-cooperation memorandum with Paraguay's Parque Tecnológico Itaipú (PTI, led by executive director Carlos Mercado Lotera) in Ciudad del Este to develop an AI data center (AIDC) at the Naranjal technology park, with modular expansion envisioned toward up to 1 GW, powered by Itaipú hydropower. Local partners ASTI Energy and ASTI Commercial & Negocios would handle execution and local coordination. The project's first anchor demand is an 'AI tutor' for Paraguay's public education system, targeting roughly 280,000 students within three years, before expanding into health, finance and energy AI services. (Reported by Korean business media.)", "image_url": "https://biz.chosun.com/resizer/v2/P4S645L7AZEF3I2XL374D752O4.jpg?auth=160d52f2c8000e16cc132c426cfd4c5db0d631ff5d60181005bd93cde1721347&width=700&height=367&smart=true", "is_gov_source": false, "is_authoritative": false, "client_tag": "Ainocean / PTI-Itaipú — AI data center"}], "impact_analysis": "", "user_notes": ""}, {"title": "VI. Key Client Developments", "tier": 1, "events": [], "impact_analysis": "", "user_notes": ""}, {"title": "VII. Integrated Impact Analysis for Business Operations", "tier": 2, "events": [], "impact_analysis": "🟢 Disinflation Cements a Neutral Stance: August CPI came in flat (1.5% y/y, BCP), keeping inflation far below target and backing the BCP's hold at 5.50% ahead of its September 21 MPC. The guaraní steadied near G. 5,961/USD (BCP official, Sep 4) after its earlier break below G. 6,000, while FX-forward balances jumped ~30% to USD 2.05 billion — a clear signal that corporates expect appreciation to persist, supporting importers' purchasing power but squeezing exporters and USD-revenue businesses.\n\n🟡 Fiscal Strain Is Building: Tax revenue rose only 2.4% in August (customs −5.4%), while the Executive's 2027 budget draft targets a 3.9%-of-GDP deficit — far above the 1.5% fiscal-responsibility cap. With Peña ruling out tax hikes, credibility now hinges on spending discipline; delays in budget approval could slow public procurement and contract payments.\n\n🔴 Social Pressure Persists: Doctors unanimously rejected the government's offer and called a new 48-hour strike for September 21–22, with 126 specialist resignations and ~350 more pending. Public-facing operations and health-linked projects should plan for renewed disruption around that date.\n\n🟡 Energy-Sector Labor Friction: ANDE's Sitrande union called a protest over a feared 'tarifazo' tied to stalled Itaipú tariff talks — even as ANDE's 'Ñande Ahorro' campaign (500,000+ users, >USD 158 million regularized) strengthens its finances before the market opening. Expect continued volatility in energy policy signals.\n\n🟢 Digital Energy & AI Momentum: The Ainocean–PTI/Itaipú MoU (AI data center expandable toward 1 GW in Naranjal) adds to Paraguay's clean-energy-AI pipeline and data-center power demand. Client-side telecom news was quiet this week: Tigo and Personal are inside their 90/180-day 5G implementation windows (commercial launch by Feb 2027), Claro continues to lead deployment, and Nubicom faces Conatel verification in October.", "user_notes": ""}, {"title": "VIII. Targeted Recommendations for Chinese Enterprises", "tier": 2, "events": [], "impact_analysis": "🔴 High Risk — Geopolitics & Taiwan Track Unchanged: Paraguay continues to institutionalize ties with Taiwan — Congress moved to declare the AI-centered 3rd Taiwan–Paraguay Technology Forum (Sept 11–12) of national interest, and a new ambassador took post in Washington. Direct Chinese-government-linked participation in public 5G, data-center or critical-infrastructure tenders remains closed; rigorous compliance review is mandatory before any Paraguay-linked engagement.\n\n🟢 Opportunity — Indirect Equipment & Trade Channels: With the guaraní steady near G. 5,961/USD and FX hedging at USD 2.05 billion, import-driven purchasing power is stable for Chinese suppliers serving operators and utilities through third-party integrators or Brazilian/Argentine subsidiaries — the established indirect route into the market.\n\n🟡 Caution — Fiscal & Social Exposure: The 3.9%-of-GDP 2027 budget draft and slow August revenue growth (customs −5.4%) may delay public procurement; the renewed doctors' strike (Sept 21–22) and ANDE 'tarifazo' protests add labor and social friction to factor into schedules and workforce planning.\n\n🟢 Opportunity — Energy & AI Data-Center Buildout: The Ainocean–PTI project, ANDE's improving collections and the electricity-market opening sustain demand for transformers, grid equipment, solar modules and data-center power. Chinese suppliers can participate via consortiums with non-Chinese partners, focusing on energy infrastructure where trusted-vendor restrictions are less binding than in telecom.", "user_notes": ""}]}};

  var xlabels=opts.labels||MACRO_ML;for(var l=0;l<xlabels.length;l++){var xx=mL+Math.round(l*step*gap+gap/2);s+='<text x="'+xx+'" y="'+(H-mB+13)+'" text-anchor="middle" font-size="7" fill="#94A3B8">'+xlabels[l]+'</text>';}
  if(opts.dual){s+='<rect x="'+(mL+2)+'" y="4" width="10" height="10" fill="'+d.bc+'" rx="2" opacity="0.85"/>';s+='<text x="'+(mL+14)+'" y="13" font-size="8" fill="#475569">'+L(d.yl[0],d.yl[1])+'</text>';s+='<line x1="'+(mL+50)+'" y1="9" x2="'+(mL+64)+'" y2="9" stroke="'+d.lc+'" stroke-width="2"/>';s+='<circle cx="'+(mL+57)+'" cy="9" r="3" fill="#fff" stroke="'+d.lc+'" stroke-width="2"/>';s+='<text x="'+(mL+68)+'" y="13" font-size="8" fill="#475569">'+L(d.yr[0],d.yr[1])+'</text>';if(opts.forecastFrom!=null){s+='<rect x="'+(mL+108)+'" y="5" width="8" height="8" fill="'+d.bc+'" rx="1.5" opacity="0.4" stroke="'+d.bc+'" stroke-width="1" stroke-dasharray="2,2"/>';s+='<text x="'+(mL+119)+'" y="13" font-size="7" fill="#94A3B8">'+L('预测','F')+'</text>';}}
  s+='</svg>';return s;

function renderMacroDataTable(d,unit){

  h+='<div class="macro-data-table-wrap" style="display:none"><table class="macro-data-table"><thead><tr><th>'+L('月份','Month')+'</th><th>2023</th><th>2024</th><th>2025</th><th>2026*</th></tr></thead><tbody>';

    h+='</tr>';

function renderFXDailyTable(d,unit){
  var DM=[31,28,31,30,31,30,31,31,30,31,30,31],dl=d.line||[];
  var h='<div class="macro-data-section"><button class="macro-data-toggle" onclick="toggleDataTable(this)">'+L('查看每日源数据 ▼','View Daily Data ▼')+'</button>';
  h+='<div class="macro-data-table-wrap" style="display:none"><table class="macro-data-table"><thead><tr><th>'+L('日期','Date')+'</th><th>PYG/USD</th></tr></thead><tbody>';
  var dates=[],day=1,mo=0,yr=2023;
  for(var i=0;i<dl.length;i++){
    dates.push(yr+'-'+(mo<9?'0'+(mo+1):(mo+1))+'-'+(day<10?'0'+day:day));
    day++;var dim=DM[mo];if(mo===1&&yr%4===0)dim=29;

    h+='<tr><td>'+dates[i]+'</td><td>'+Math.round(dl[i])+(unit||'')+'</td></tr>';

function renderAll(){

  var sections=d.sections||[],tier1=[],tier2=[];

function renderSection(sec,idx){
  var events=sec.events||[],isT2=sec.tier===2;
  var g=GRAD[idx%8],icon=ICONS[idx%8];
  var body='';
  if(isT2||events.length===0){
    if(sec.impact_analysis)body='<div class="analysis-body">'+fmt(sec.impact_analysis)+'</div>';
    else if(!isT2)body='<div style="padding:4px 22px 16px;color:#94A3B8;font-size:13px;">'+L('暂无此时间段内的事件','No events in this period')+'</div>';
  }else{
    var cards='';
    for(var i=0;i<events.length;i++)cards+=renderCard(events[i],g[0],g[1],icon);

  }
  var badge=events.length>0?'<span class="badge">'+events.length+L(' 条事件',' events')+'</span>':'';
  return '<div class="section s'+(idx%8)+(isT2?' tier2':'')+'" id="sec-'+idx+'"><div class="section-header"><h2>'+esc(sec.title||'')+'</h2>'+badge+'</div>'+(sec.description?'<div class="section-desc">'+esc(sec.description)+'</div>':'')+body+'</div>';

function renderCard(evt,phFrom,phTo,icon){
  var img=evt.image_url,hasImg=img&&img.indexOf('http')===0;
  var ih='';
  if(hasImg)ih='<img src="'+esc(img)+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">';
  ih+='<div class="img-placeholder" style="background:linear-gradient(135deg,'+phFrom+','+phTo+');'+(hasImg?'display:none':'display:flex')+';font-size:32px;color:#fff;">'+icon+'</div>';

  var tags='';
  if(evt.date)tags+='<span class="event-tag date">'+esc(evt.date)+'</span>';
  if(evt.client_tag)tags+='<span class="event-tag client">'+esc(evt.client_tag)+'</span>';
  if(evt.is_gov_source)tags+='<span class="event-tag gov">'+L('政府官网','Government')+'</span>';
  else if(evt.is_authoritative)tags+='<span class="event-tag auth">'+L('权威媒体','Authoritative')+'</span>';
  if(evt.source_name)tags+='<span class="event-tag source">'+esc(evt.source_name)+'</span>';

  var link=evt.source_url?'<a class="event-link" href="'+esc(evt.source_url)+'" target="_blank" rel="noopener">'+L('查看原文 →','Read more →')+'</a>':'';
  var preview=evt.summary||'';if(!preview&&evt.title)preview=evt.title;
  return '<div class="event-card"><div class="event-img">'+ih+'</div><div class="event-body"><div class="event-meta">'+tags+'</div><div class="event-preview">'+esc(preview)+'</div>'+link+'</div></div>';
}

function fmt(text){
  var h=esc(text);
  h=h.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
  h=h.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
  h=h.replace(/\n/g,'<br>');
  return h;
}

function scrollToSec(idx){
  var pills=document.querySelectorAll('.stat-pill');
  for(var i=0;i<pills.length;i++)pills[i].style.outline='';
  if(idx===null||idx===undefined){window.scrollTo({top:0,behavior:'smooth'});return;}
  var el=document.getElementById('sec-'+idx);
  if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.style.boxShadow='0 0 0 3px #3B82F6';
  setTimeout(function(){el.style.boxShadow='';},1500);
}

    if(data.cpi_error)msgs.push(L('CPI错误: ','CPI error: ')+data.cpi_error);
    if(data.rin&&data.rin.length){MACRO_RIN.line=data.rin;msgs.push(L('RIN已更新('+data.rin.length+'个月)','RIN updated ('+data.rin.length+' mo)'));}
    if(data.rin_error)msgs.push(L('RIN错误: ','RIN error: ')+data.rin_error);
    if(msgs.length){renderAll();st.innerHTML='<span style="color:#10B981">'+msgs.join('; ')+'</span>';}
    else st.innerHTML='<span style="color:#EF4444">'+L('更新失败','Update failed')+'</span>';
  }).catch(function(){st.innerHTML='<span style="color:#EF4444">'+L('更新失败，请确保 Flask 服务器已启动','Failed. Make sure Flask server is running.')+'</span>';});
}
function closeUpdateModal(id){
  var m=document.getElementById(id||'updateModal');if(m)m.remove();
  var h=document.getElementById('histModal');if(h&&id!=='histModal')h.remove();
}
document.addEventListener('DOMContentLoaded',function(){
  if(window.IS_STANDALONE)document.getElementById('standaloneBanner').style.display='block';
  if(MACRO_FX.monthly&&!MACRO_FX.line)MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
  fetch('/api/briefing/briefing_en.json').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    DATA['en']=data;briefingData=data;currentLang='en';renderAll();updateLangBtn();
    fetch('/api/briefing/briefing.json').then(function(r){if(r.ok)return r.json();}).then(function(zh){if(zh)DATA['zh']=zh;}).catch(function(){});
    if(!window.IS_STANDALONE)fetchLiveFX();
  }).catch(function(){
    briefingData=DATA['en'];currentLang='en';renderAll();updateLangBtn();
  });
});
function fetchLiveFX(){
  fetch('/api/macro/fx').then(function(r){if(!r.ok)return;return r.json();}).then(function(d){
    if(!d||!d.rate)return;
    var arr=MACRO_FX.monthly||MACRO_FX.line||[];
    arr[arr.length-1]=d.rate;
    window.MACRO_FX_DATE=(d.date||'').replace(/-/g,'.');
    MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
    renderAll();
  }).catch(function(){});
}
</script>
