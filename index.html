<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paraguay Briefing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#F0F4FF;color:#1E293B;line-height:1.6;min-height:100vh}
a{color:#3B82F6;text-decoration:none}a:hover{text-decoration:underline}
.header{background:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;border-bottom:3px solid #3B82F6}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;flex-shrink:0}
.header-left h1{font-size:20px;font-weight:700;color:#1E293B}
.header-left .subtitle{font-size:12px;color:#64748B;margin-top:2px}
.header-right{display:flex;gap:8px;align-items:center}
.btn-lang{background:#EEF2FF;color:#4F46E5;font-weight:700;font-size:12px;padding:8px 14px;border-radius:20px;border:none;cursor:pointer}
.btn-lang:hover{background:#E0E7FF}
.btn-primary{background:#3B82F6;color:#fff;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-primary:hover{background:#2563EB;transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.3)}
.btn-secondary{background:#F1F5F9;color:#475569;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:#E2E8F0}
.btn-sm{font-size:11px;padding:6px 12px}
.update-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:moFade .2s}
.update-modal{background:#fff;border-radius:14px;padding:24px 28px;width:440px;max-width:90vw;box-shadow:0 24px 80px rgba(0,0,0,.25);animation:moZoom .25s}
.update-modal h3{font-size:17px;font-weight:700;color:#1E293B;margin-bottom:16px}
.update-modal label{display:block;font-size:12px;font-weight:600;color:#64748B;margin-bottom:4px}
.update-modal select,.update-modal input{width:100%;padding:8px 12px;border:1px solid #CBD5E1;border-radius:8px;font-size:13px;margin-bottom:14px;color:#1E293B;background:#fff}
.update-modal .btn-row{display:flex;gap:8px;justify-content:flex-end}
.time-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.time-preset{padding:5px 12px;border-radius:14px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #CBD5E1;background:#fff;color:#64748B;transition:all .12s}
.time-preset:hover,.time-preset.active{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.history-list{max-height:300px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid #E2E8F0;border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.history-item:hover{background:#F8FAFC;border-color:#CBD5E1}
.history-item .hi-title{font-weight:600;font-size:13px;color:#1E293B}
.history-item .hi-meta{font-size:11px;color:#94A3B8}
.history-item .hi-count{font-size:11px;font-weight:600;color:#3B82F6;background:#EEF2FF;padding:2px 8px;border-radius:10px}
.loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid #CBD5E1;border-top-color:#3B82F6;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.standalone-banner{background:#FEF3C7;color:#92400E;text-align:center;padding:6px 16px;font-size:12px;border-bottom:1px solid #FDE68A;display:none}
.standalone-banner code{background:#FDE68A;padding:1px 5px;border-radius:3px;font-size:11px}

.stats-row{max-width:1400px;margin:0 auto;padding:12px 32px 16px;display:flex;flex-direction:column;gap:8px}
.stats-row-total{display:flex;justify-content:center}
.stats-row-sections{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:768px){.stats-row-sections{grid-template-columns:repeat(2,1fr)}}
.stat-pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;cursor:pointer;transition:all .2s;border:2px solid transparent;font-size:13px;font-weight:600;user-select:none;min-width:0}
.stat-pill:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.pill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pill-label{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-count{font-size:14px;font-weight:700;margin-left:auto;flex-shrink:0;background:rgba(255,255,255,.5);padding:1px 8px;border-radius:10px}
.stat-pill.pill-total{background:#1E293B;color:#fff;font-weight:700;border-radius:24px;display:inline-flex}
.stat-pill.pill-total .pill-count{background:rgba(255,255,255,.2)}

.content{max-width:1400px;margin:0 auto;padding:0 32px 60px}
.section{background:#fff;border-radius:14px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden;border-top:4px solid #3B82F6}
.section.s0{border-top-color:#3B82F6}.section.s1{border-top-color:#EF4444}.section.s2{border-top-color:#10B981}
.section.s3{border-top-color:#8B5CF6}.section.s4{border-top-color:#06B6D4}.section.s5{border-top-color:#F59E0B}
.section.s6{border-top-color:#6366F1}.section.s7{border-top-color:#EC4899}.section.tier2{background:#FAFBFC}
.section-header{padding:16px 22px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-header h2{font-size:16px;font-weight:700;color:#1E293B}
.section-header .badge{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;background:#F1F5F9;color:#64748B;white-space:nowrap}
.section-desc{padding:4px 22px 10px;font-size:12px;color:#94A3B8}
.events-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 22px 18px}
@media(max-width:860px){.events-grid{grid-template-columns:1fr}.event-card{flex-direction:column}.event-card .event-img{width:100%!important;min-height:120px;max-height:180px}}
.event-card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;transition:all .2s;display:flex}
.event-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-1px);border-color:#CBD5E1}
.event-card .event-img{width:160px;min-height:140px;flex-shrink:0;position:relative;overflow:hidden}
.event-card .event-img img{width:100%;height:100%;object-fit:cover;display:block}
.event-card .event-img .img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.event-card .event-body{padding:12px 15px;flex:1;min-width:0;display:flex;flex-direction:column}
.event-card .event-meta{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.event-card .event-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.event-tag.date{background:#F1F5F9;color:#64748B}.event-tag.gov{background:#DCFCE7;color:#15803D}
.event-tag.auth{background:#DBEAFE;color:#1D4ED8}.event-tag.source{background:#FEF3C7;color:#A16207}
.event-tag.client{background:#FCE7F3;color:#BE185D}
.event-card .event-preview{font-size:13px;color:#334155;line-height:1.6;flex:1;overflow:visible;max-height:none}
.event-card .event-link{font-size:11px;margin-top:6px;color:#3B82F6;font-weight:500}
.analysis-body{padding:4px 22px 20px;font-size:13px;line-height:1.8;color:#334155}
.analysis-body h3{font-size:15px;font-weight:700;margin:14px 0 6px;color:#1E293B}
.analysis-body ul{padding-left:0;list-style:none}
.analysis-body li{padding:2px 0 2px 18px;position:relative}
.analysis-body li::before{content:"•";position:absolute;left:2px;color:#3B82F6;font-weight:bold}
.tier-divider{text-align:center;padding:16px 0 8px;margin:8px 0}
.tier-divider span{background:linear-gradient(135deg,#3B82F6,#6366F1);color:#fff;padding:8px 28px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(59,130,246,.25)}
.footer{text-align:center;padding:20px 32px 40px;color:#94A3B8;font-size:12px;max-width:1400px;margin:0 auto}
.macro-dashboard{background:#fff;border-radius:14px;margin-bottom:18px;padding:16px 22px 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-top:4px solid #1E293B}
.macro-title{font-size:15px;font-weight:700;color:#1E293B;margin-bottom:2px}
.macro-period{font-size:11px;font-weight:400;color:#94A3B8;margin-left:6px}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media(max-width:900px){.macro-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.macro-grid{grid-template-columns:1fr}}
.macro-card{background:#F8FAFC;border-radius:8px;padding:10px 8px 4px;border:1px solid #E2E8F0}
.macro-card-title{font-size:10.5px;font-weight:600;color:#475569;margin-bottom:4px;text-align:center;line-height:1.3;min-height:28px;display:flex;align-items:center;justify-content:center}
.macro-card{position:relative}
.macro-source{position:absolute;top:6px;right:8px;font-size:7.5px;color:#94A3B8;font-weight:500;background:#fff;padding:1px 5px;border-radius:3px;border:1px solid #E2E8F0;z-index:1;pointer-events:none}
.macro-latest{display:flex;justify-content:center;align-items:baseline;gap:4px;margin-top:2px;padding:3px 0}
.macro-latest-label{font-size:9px;color:#94A3B8;font-weight:500}
.macro-latest-val{font-size:15px;font-weight:700;color:#1E293B}
.macro-latest-unit{font-size:9px;color:#64748B;font-weight:500}
.macro-latest-date{font-size:9px;color:#94A3B8}
.macro-note{font-size:9px;color:#94A3B8;margin-top:1px}
.macro-card{cursor:pointer;transition:transform .15s,box-shadow .15s}
.macro-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.macro-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:moFade .2s}
.macro-modal-card{background:#fff;border-radius:16px;padding:24px 28px 18px;width:680px;max-width:94vw;max-height:90vh;overflow-y:auto;cursor:default;box-shadow:0 24px 80px rgba(0,0,0,.25);position:relative;animation:moZoom .25s}
.macro-modal-card .macro-card{border:none;padding:0;background:transparent;cursor:default}
.macro-modal-card .macro-card:hover{transform:none;box-shadow:none}
.macro-modal-card .macro-card-title{font-size:15px;min-height:auto;margin-bottom:10px}
.macro-modal-card .macro-legend,.macro-modal-card [style*=legend]{font-size:11px!important}
.macro-modal-close{position:absolute;top:10px;right:16px;font-size:26px;cursor:pointer;color:#94A3B8;background:none;border:none;line-height:1;z-index:10;padding:4px 8px;border-radius:6px}
.macro-modal-close:hover{color:#475569;background:#F1F5F9}
.macro-data-section{margin-top:14px;border-top:1px solid #E2E8F0;padding-top:10px}
.macro-data-toggle{background:#F8FAFC;border:1px solid #CBD5E1;padding:6px 16px;border-radius:6px;font-size:12px;color:#64748B;cursor:pointer;font-weight:500}
.macro-data-toggle:hover{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.macro-data-table-wrap{margin-top:10px;max-height:340px;overflow-y:auto;border:1px solid #E2E8F0;border-radius:8px}
.macro-data-table{width:100%;border-collapse:collapse;font-size:12px}
.macro-data-table th{background:#F8FAFC;padding:7px 12px;text-align:right;font-weight:600;color:#475569;border-bottom:2px solid #E2E8F0;position:sticky;top:0}
.macro-data-table th:first-child{text-align:left}
.macro-data-table td{padding:5px 12px;text-align:right;border-bottom:1px solid #F1F5F9;color:#334155;font-variant-numeric:tabular-nums}
.macro-data-table td:first-child{text-align:left;color:#64748B;font-weight:500}
.macro-data-table tbody tr:hover td{background:#EEF2FF}
.macro-na{color:#CBD5E1!important}
@keyframes moFade{from{opacity:0}to{opacity:1}}
@keyframes moZoom{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:768px){.header{padding:14px 16px}.header-left h1{font-size:16px}.stats-row{padding:10px 14px;gap:6px}.stat-pill{padding:8px 12px;font-size:12px}.pill-label{font-size:11px}.content{padding:0 12px 40px}.section-header{padding:12px 14px 0}.events-grid{grid-template-columns:1fr;padding:4px 14px 14px}}
</style>
</head>
<body>

<div class="standalone-banner" id="standaloneBanner">Offline mode · Run <code>python3 web_app.py</code> for live updates</div>

<header class="header">
  <div class="header-left"><div class="header-logo">PY</div><div><h1>巴拉圭简报</h1><div class="subtitle" id="headerSubtitle"></div></div></div>
  <div class="header-right"><button class="btn-secondary" id="btnMacro" onclick="openMacroModal()" title="Update CPI/RIN">Macro</button><button class="btn-secondary" id="btnHistory" onclick="showHistory()">History</button><button class="btn-primary" id="btnUpdate" onclick="refreshBriefing()">Refresh</button><button class="btn-lang" id="langBtn" onclick="switchLanguage()">中文</button></div>

<div class="stats-row" id="statsRow"></div>
<div class="content" id="contentArea"></div>

oritative": true}, {"title": "护士争取到7,000个正式编制，推进用工正规化（2026-08-21）", "date": "2026-08-21", "source_url": "https://www.ultimahora.com/enfermeros-consiguen-7-000-cargos-para-avanzar-en-la-desprecarizacion", "source_name": "Última Hora", "summary": "巴拉圭护理协会与当局达成协议，设立7,000个正式编制，推进护理人员的“去不稳定化”。受益者将转为第一级工资（约430万瓜拉尼），这是将长期依赖短期合同、实现用工正规化的重要一步。该协议是政府在社会和劳资矛盾上升背景下推动公共医疗就业正规化的更大行动的一部分。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/ad759c0/2147483647/strip/true/crop/1080x608+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fe6%2Fdc%2Fa7062a724d3f9119d98800e263e5%2F1002134813.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "缉毒署Canindeyú'救赎行动'：教师与土著领袖身亡，双方说法相左（2026-08-16）", "date": "2026-08-16", "source_url": "https://www.ultimahora.com/que-paso-en-corpus-christi", "source_name": "Última Hora", "summary": "8月16日，缉毒署（Senad）在Canindeyú省Corpus Christi的Ava Guaraní社区Tekoha Y'apo开展'救赎行动'，导致当地教师Catalino Correa和土著领袖Antonio Carrillo身亡。缉毒署称两人是逃亡毒枭Felipe Santiago Acosta'马乔'团伙的'高价值目标'，并称发生交火、公布了视频。社区和家属否认发生交火，指控受害者被诱骗至Estancia América的土地纠纷会议后遭酷刑和处决、事后被放置枪支；根本冲突是土地问题，约300户土著家庭对涉诉的1.1万公顷土地主张权利。", "image_url": "https://www.abc.com.py/resizer/v2/UAOCYFXEYZDFZHHEYZ2FXJJN5Y.jpeg?auth=0e37595e2f815bd51e808e5a2e4caf366cefa13546eb62315b3aae7b39ef76b6&width=770&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "教师工会要求逐步加薪至每班500万瓜拉尼，视谈判结果决定是否游行（2026-08-21）", "date": "2026-08-21", "source_url": "https://1140am.com.py/docentes-reclaman-reajuste-salarial-y-condicionan-manifestacion-tras-resultado-de-reunion-con-el-gobierno/", "source_name": "Radio 1140 AM", "summary": "巴拉圭教育工作者联合会（FEP）要求逐步加薪至每班500万瓜拉尼——2027年上调8%、2028年上调9%——并要求为教师职级晋升、校长代表补贴和免费教育相关支出提供资金。该诉求覆盖约8万名教师（约6.2万工会会员）。以Silvio Piris为首的工会领导人表示，是否发动游行取决于政府的回应，与教育部和财政部的后续会议尚未举行。", "image_url": "https://1140am.com.py/wp-content/uploads/2026/08/r-1.jpg", "is_gov_source": false, "is_authoritative": false}], "impact_analysis": "", "user_notes": ""}, {"title": "四、国际关系与外交动态", "tier": 1, "events": [{"title": "日本秋筱宫文仁亲王与纪子王妃开始对巴拉圭进行正式访问（2026-08-21）", "date": "2026-08-21", "source_url": "https://internationalpress.jp/2026/08/21/akishino-y-kiko-inician-su-visita-a-paraguay-con-homenaje-a-los-heroes-nacionales/", "source_name": "International Press", "summary": "日本秋筱宫文仁亲王与纪子王妃开始对巴拉圭进行正式访问，以纪念日本移民90周年，并在外交部长鲁本·拉米雷斯·莱斯卡诺陪同下向国家英雄祠敬献花圈。此次访问凸显了两国深厚的历史渊源以及日本侨民在巴拉圭的经济和社会分量，并与推动日本市场向巴拉圭牛肉开放的努力相呼应。", "image_url": "https://cdn.internationalpress.jp/2026/08/El-principe-Akishino-y-la-princesa-Kikko-en-el-Panteon-de-los-Heroes-de-Paraguay.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "培尼亚与日本大臣木内推进牛肉市场准入议程（2026-08-22）", "date": "2026-08-22", "source_url": "https://www.latribuna.com.py/politica/2026/08/22/pena-y-ministro-japones-abordan-agenda-de-la-carne/", "source_name": "La Tribuna", "summary": "总统圣地亚哥·培尼亚会见日本国务大臣木内稔，推动巴拉圭牛肉进入日本市场的准入事宜，同时讨论投资以及国防和安全合作。日本作为高价值牛肉进口国，是巴拉圭肉类出口商寻求在现有市场之外多元化、获取溢价价格的战略目标，与已有的JICA基础设施融资形成互补。", "image_url": "https://www.latribuna.com.py/resizer/v2/OOV5CXV3YZGDHGQBSKJIJBWGGM.jpg?smart=true&auth=c1024fbf7c748de01678adae5f01e7d6c9c847ed3dd5a0ff4ec4803399c65cd8&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}, {"title": "南共市–欧盟：牛肉出口配额未达成协议，巴拉圭坚持25%份额（2026-08-19）", "date": "2026-08-19", "source_url": "https://www.ultimahora.com/sin-acuerdo-los-cupos-seguiran-por-orden-de-llegada-hasta-2027", "source_name": "Última Hora", "summary": "南共市成员国尚未就《南共市–欧盟贸易协定》下牛肉出口配额的分配方式达成一致，巴拉圭坚持每个成员国均分25%的份额，这一立场得到生产商协会（ARP、CPC、Capeco、UGP）的支持。若无共识，现有的“先到先得”制度将继续保留，该议题将推迟到2027年10月再审，给巴拉圭牧场的这一关键出口渠道留下不确定性。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/25a72be/2147483647/strip/true/crop/2362x1329+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fadjuntos%2F161%2Fimagenes%2F008%2F774%2F0008774574.jpg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "五、行业专题：通讯、运营商、数字能源与AI", "tier": 1, "events": [{"title": "HIVE：哥伦比亚大学验证巴拉圭AI GPU性能；100兆瓦变电站定于9月通电（2026-08-18）", "date": "2026-08-18", "source_url": "https://www.proactiveinvestors.com/companies/news/1094258/hive-digital-technologies-reports-successful-ai-training-trial-using-paraguay-based-gpus-1094258.html", "source_name": "Proactive Investors", "summary": "HIVE数字技术公司完成了首个使用亚松森GPU的AI研究试验，与哥伦比亚大学工业工程与运筹学系合作——纽约的研究人员远程对5,000多英里外的GPU进行迭代AI训练，验证了跨洲AI算力的可行性。研究发现，经优化后HIVE的Nvidia A40 GPU性能可媲美新一代H100系统，该研究已提交至NeurIPS会议。公司位于伊瓜苏“超级工厂”的100兆瓦变电站已完工，定于2026年9月通电，三级（Tier III）数据中心将于秋季动工。", "image_url": "https://cdn.proactiveinvestors.com/eyJidWNrZXQiOiJwYS1jZG4iLCJrZXkiOiJ1cGxvYWRcL05ld3NcL0ltYWdlXC8yMDI2XzA2XC8yMDI1LTA0LTA3LTA4LTM5LTQwLTBmZWUxMjhhM2FkN2FlNmVjMjY4YzU4ZjFmZDkxZTdkLmpwZyIsImVkaXRzIjp7InJlc2l6ZSI6eyJ3aWR0aCI6MTIwMCwiaGVpZ2h0Ijo2MzAsImZpdCI6ImNvdmVyIn19fQ==", "is_gov_source": false, "is_authoritative": true, "client_tag": "HIVE — AI/HPC数据中心、100兆瓦变电站、GPU算力"}, {"title": "Atome为其2022年ANDE购电协议辩护，宣布研究300兆瓦光伏电站（2026-08-19）", "date": "2026-08-19", "source_url": "https://enparaguay.net/atome-defiende-su-contrato-vigente-desde-2022-con-la-ande-y-anuncia-estudio-para-una-planta-solar-de-300-mwp/", "source_name": "En Paraguay Net", "summary": "能源公司Atome为其与ANDE自2022年起生效的145兆瓦保底容量购电协议（PPA）进行辩护——该公司称该协议已纳入国有电力公司到2050年的预测——并宣布研究一座300兆瓦（MWp）光伏电站。这一表态凸显了在政府电力改革推进、ANDE潜在客户名单日益以AI和数据中心运营商为主的背景下，排队等待明确规则的私人能源项目（超6,000兆瓦）不断增加。", "image_url": "https://www.abc.com.py/resizer/cASGP0ctgapLiipfDA-sKjhgIDk=/cloudfront-us-east-1.images.arcpublishing.com/abccolor/7HZUINSHZBB4TFC3V4CSSRYF5E.jpg", "is_gov_source": false, "is_authoritative": false, "client_tag": "Atome — 145兆瓦PPA、300兆瓦光伏；能源行业改革"}, {"title": "里克尔梅赴智利争取能源出口和AI数据中心投资（2026-08-20）", "date": "2026-08-20", "source_url": "https://www.lapoliticaonline.com/paraguay/energia-py/riquelme-quiere-venderle-energia-a-chile-socio-clave-de-paraguay-en-el-corredor-bioceanico/", "source_name": "La Política Online", "summary": "工业和贸易部长马可·里克尔梅奉培尼亚总统之命出访智利招商引资，重点是出口巴拉圭能源、区域电力互联以及AI数据中心。此次访问将巴拉圭的清洁能源富余与两洋走廊（Corredor Bioceánico）联系起来，并把巴拉圭定位为关键伙伴智利的潜在能源供应国。此举也配合了政府推动电力市场向私人发电开放的立法努力。", "image_url": "https://www.lapoliticaonline.com/files/image/296/296937/6a87742330a50_1200_630!.jpg?s=75b89a3f2b33eed103df3099a6b6bc90&d=1787194800", "is_gov_source": false, "is_authoritative": true, "client_tag": "数字能源 — 区域互联、AI数据中心"}, {"title": "电力市场将向私人资本开放，ANDE让渡监管职能（2026-08-20）", "date": "2026-08-20", "source_url": "https://infonegocios.com.py/nota-principal/el-mercado-electrico-podria-abrirse-al-capital-privado-y-la-ande-dejaria-de-concentrar-la-regulacion", "source_name": "InfoNegocios", "summary": "巴拉圭电力市场将向私人资本开放，国有电力公司ANDE着手让渡其集中的监管职能。私人发电商将可为自用发电并出售剩余电力（包括回售给ANDE），初始方案为国家从私人电厂收购约140兆瓦，重点发展太阳能等可再生能源。此举正值电力需求年增超18%、超6,000兆瓦私人项目排队等待更明确规则的背景下。", "image_url": "https://infonegocios.com.py/images/resize/720600-1200x675.webp", "is_gov_source": false, "is_authoritative": true, "client_tag": "数字能源 — 私人发电、太阳能、140兆瓦方案"}], "impact_analysis": "", "user_notes": ""}, {"title": "六、主要客户动向", "tier": 1, "events": [{"title": "Tigo（Millicom）：2026年二季度巴拉圭EBITDA利润率56.9%领跑集团（2026-08-06）", "date": "2026-08-06", "source_url": "https://finance.yahoo.com/markets/stocks/articles/millicom-international-cellular-sa-tigo-190553957.html", "source_name": "Yahoo Finance", "summary": "Millicom（Tigo）公布创纪录的2026年二季度业绩：集团服务收入20亿美元（有机增长5%）、调整后EBITDA创纪录达10亿美元（利润率46.3%）、股权自由现金流创纪录达3.27亿美元。巴拉圭贡献了集团8%的服务收入（1.69亿美元，有机增长3.4%），并录得集团最高的调整后EBITDA利润率56.9%，得益于瓜拉尼升值降低了内容和体育版权（足球）的美元成本。管理层提示，若汇率逆转，这一利润率可能不可持续。", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Millicom/Tigo — 5G 2.3GHz部署；网络设备、基站"}, {"title": "Personal（阿根廷电信）：上半年资本开支增47.3%至6.31亿美元，FTTH占宽带36%（2026-08-14）", "date": "2026-08-14", "source_url": "https://www.bnamericas.com/en/news/argentinas-personal-ramps-up-capex-toward-us13bn-target", "source_name": "BNamericas", "summary": "阿根廷电信（Personal）2026年上半年资本开支加速至9,464.7亿比索（约6.31亿美元），同比增长47.3%，相当于合并销售额的18.6%，朝着全年最高13亿美元的目标迈进。投资投向固定和移动数据、4G站点现代化、5G部署和FTTH光纤，FTTH现占宽带用户基数的36%（超150万连接）。在巴拉圭，子公司Núcleo（Personal）持有3.7GHz频段两个标段，并以166万移动用户领跑FTTH市场。", "image_url": "https://cdnimg.bnamericas.com/PFkTUwVUcCZTSZCGcXpVfHyzSMPMJWoLdoowaAHTeoPeVCuyGINVnfEypEMUjplC.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "阿根廷电信/Personal — 5G 3.7GHz部署；FTTH、光纤"}], "impact_analysis": "", "user_notes": ""}, {"title": "七、对企业经营的综合影响分析", "tier": 2, "events": [], "impact_analysis": "🟡 汇率压力——瓜拉尼走强挤压出口商、利好进口商：美元再度滑向6,000瓜拉尼关口（8月21日银行间6,009瓜拉尼）是本周核心宏观主题。对于资本品和电信/能源设备的进口商而言，瓜拉尼走强降低了到岸成本、增强了购买力；对于畜牧业、大豆和来料加工出口商而言，则压缩了瓜拉尼计价的利润，牛肉价格涨21%却数量降25%即为例证。有美元收入的企业应维持套期保值，呼应央行对远期合约的推动。\n\n🟢 增长动能稳固：CEPAL对2026年4.3%的预测得到IMF/世界银行（4.4%）和央行（4.5%）的印证，确认巴拉圭仍是地区增长最快的经济体之一。强劲的内需以及向制造业和服务业的多元化，支撑着电信和数字基础设施需求，尽管增长仍以农业为锚。\n\n🔴 劳资与社会风险——医疗行业罢工：全国性五日医生罢工（8月24–28日）以及政府并行批准1.1万名卫生工作者转正，表明在强劲的宏观数据背后社会矛盾尖锐。社保基金（IPS）危机和“去不稳定化”诉求与此前数周抗议所反映的广泛不满一脉相承。有面向公众业务或医疗领域合同的企业，应为本周末服务中断做好准备。另一个风险点是Canindeyú省“救赎行动”事件（8月16日），一名教师和一名土著领袖在官方与社区对土地纠纷说法相左中身亡——提醒企业，农村土地和原住民权利紧张仍是内陆地区一项独立的安全风险。\n\n🟢 结构性能源改革——长期机遇：将ANDE拆分为六家公司的法案与创建能源、矿业和碳氢化合物部及独立监管机构的法案并行，是本周期最具分量的政策变化。在电力需求年增18%、超6,000兆瓦私人项目排队等待的背景下，改革有望为数据中心和AI运营商（HIVE、台湾“伊瓜苏数字”枢纽）带来更清晰的规则。HIVE 100兆瓦变电站9月通电是近期具体里程碑。\n\n🟡 客户多元化与汇率敏感性：Millicom披露巴拉圭56.9%的EBITDA利润率部分由汇率驱动（且“可能不可持续”），提醒运营商在巴拉圭的盈利能力对货币高度敏感。四家5G牌照方（Claro、Nubicom、Tigo、Personal）仍处于部署期限之内，近期设备需求持续，但鉴于市场集中且由外资控制，供应商应在运营商之间以及向企业/专网领域多元化布局。", "user_notes": ""}, {"title": "八、对中资企业的专项影响与建议", "tier": 2, "events": [], "impact_analysis": "🔴 高风险——外交约束未变：巴拉圭仍是台湾在南美洲的唯一盟友，本周与北京之间未出现任何外交解冻。中资企业应继续预期被排除在公共5G和基础设施招标之外——可信供应商规则将华为和中兴排除在外，第二次5G拍卖再次确认了这一约束——并须在任何涉巴拉圭合作前进行严格的合规审查。\n\n🟡 中风险——仅可间接进入：中国仍是巴拉圭最大的商品供应国（手机、电脑、轮胎），中资企业仍可通过巴西、阿根廷或智利的子公司或贸易中介间接服务该市场。日本—巴拉圭牛肉议程和南共市—欧盟配额谈判是值得关注的区域渠道，但敏感领域（电信、能源）的中资品牌直接交易仍受政治约束。\n\n🟢 机遇——能源与数字基础设施：电力改革（ANDE拆分、能源部、独立监管机构）以及18%的年需求增长，创造了电力设备、输电和电网现代化需求，中国供应商（变压器、特高压直流、光伏组件）可通过与非中国伙伴组建联合体的方式参与。Atome的300兆瓦光伏研究和6,000兆瓦项目队列，意味着具体的采购机会。\n\n🟢 机遇——借道第三方的设备：5G建设——Nubicom携手爱立信/诺基亚的2亿美元独立组网，加上Tigo和Personal的部署期限——需要无线设备、光纤和边缘基础设施。中国设备厂商虽被排除在公开拍卖之外，但可争取企业/专网、批发光纤，以及与已在服务Claro、Tigo和Personal的拉美集成商（Datawaves式供应商）合作。\n\n🟡 审慎——劳资与汇率风险：医生罢工、IPS危机和持续的“去不稳定化”诉求，指向宏观增长表象下的劳资摩擦；瓜拉尼走强（一年升值约20%）同时侵蚀任何美元挂钩收入的人民币折算价值。有本地业务的中资企业应审查劳动合规、为本周医疗行业罢工做好安排，并主动对冲汇率风险。", "user_notes": ""}]}, "en": {"topic": "Paraguay Briefing", "time_span": "August 15 – August 22, 2026", "time_label": "Past Week", "sections": [{"title": "I. Macroeconomic Developments", "tier": 1, "events": [{"title": "Dollar Eases Again Toward G. 6,000 as Exporters Press BCP for Intervention (2026-08-21)", "date": "2026-08-21", "source_url": "https://www.abc.com.py/negocios/2026/08/21/el-dolar-vuelve-a-ceder-en-el-cierre-de-la-semana-y-se-acerca-de-nuevo-a-los-g-6000/", "source_name": "ABC Color", "summary": "The US dollar closed the week of August 21 at G. 6,010 in the retail market and G. 6,009 at the interbank level, again approaching the G. 6,000 threshold after touching G. 5,950 two weeks earlier. The guaraní's sustained appreciation — roughly 20% over the past year — is eroding dollar-linked revenue, prompting exporters, led by the cattle and agricultural sectors, to demand that the Central Bank (BCP) intervene to 'balance' the market. The BCP has so far maintained a hands-off stance.", "image_url": "https://www.abc.com.py/resizer/v2/Y7Q45WHQVNCB3NXHWQ75WYTHLI.jpg?auth=d4f7d4e7bcfae1b9b7e3a37fce51ee4b0340e1e70a007b7d17c73ffad837f1ea&width=770&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "CEPAL Projects Paraguay to Grow 4.3% in 2026, Among South America's Most Dynamic (2026-08-20)", "date": "2026-08-20", "source_url": "https://infonegocios.com.py/infofinanzas/cepal-proyecta-que-paraguay-crecera-4-3-en-2026-y-se-mantendra-entre-las-economias-mas-dinamicas-de-sudamerica", "source_name": "InfoNegocios", "summary": "The UN Economic Commission for Latin America and the Caribbean (CEPAL) projects Paraguay's economy will grow 4.3% in 2026, keeping it among South America's most dynamic economies, ahead of the regional average. The forecast aligns closely with the IMF and World Bank (4.4%) and the BCP's own upgraded estimate of 4.5%, reflecting sustained strength in agriculture, manufacturing and services. CEPAL also sees Paraguay growing around 4.0% in 2027.", "image_url": "https://infonegocios.com.py/images/resize/723087-1200x675.webp", "is_gov_source": false, "is_authoritative": true}, {"title": "Economist Proposes Raising Public Debt Ceiling to 70% of GDP for Development (2026-08-19)", "date": "2026-08-19", "source_url": "https://www.ultimahora.com/economista-plantea-elevar-deuda-al-70-del-pib-para-el-desarrollo", "source_name": "Última Hora", "summary": "A leading Paraguayan economist argued that the country should raise its public debt ceiling to 70% of GDP to finance infrastructure and development, well above the current legal framework which caps debt near 40% of GDP under the Fiscal Responsibility Law. Proponents contend that Paraguay's low debt load and investment-grade trajectory give it ample fiscal space, while critics warn that loosening the anchor could jeopardize the hard-won macroeconomic credibility that underpins cheap financing.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/feaafd3/2147483647/strip/true/crop/2048x1152+0+3/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Feb%2Fcc%2Fda766ec84fc38e479cd965a997de%2Fministerio-de-economia-y-finanzas-mef.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Beef Sector: Export Price Up 21% but Volume Down 25% Amid Strong Guaraní (2026-08-20)", "date": "2026-08-20", "source_url": "https://dende.org.py/la-ganaderia-en-el-paraguay-el-sector-carnico-vive-una-oportunidad-excepcional-que-desafios-limitan-su-crecimiento/", "source_name": "DENDE", "summary": "Paraguay's cattle sector faces a classic currency squeeze: average beef export prices rose from about USD 4,500 to USD 6,900–7,000 per tonne (peaking near USD 7,500 in July), but export volumes fell 25%. The higher prices (+21%) only partially offset the volume decline, leaving foreign-exchange earnings down roughly 9%. The United States has become the top destination, followed by Israel and Taiwan, while the 9.9% seven-month depreciation of the dollar against the guaraní has compressed producer margins.", "image_url": "https://dende.org.py/wp-content/uploads/2026/08/Captura-de-pantalla-2026-08-20-162705.png", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "II. Political & Policy Developments", "tier": 1, "events": [{"title": "Energy Reform Advances: Bill to Split ANDE into Six Companies Presented (2026-08-21)", "date": "2026-08-21", "source_url": "https://www.abc.com.py/economia/2026/08/21/presentan-proyecto-de-ley-que-plantea-partir-a-la-ande-en-seis-empresas/", "source_name": "ABC Color", "summary": "Senator Enrique Salyn Buzarquis presented a 'General Electricity Industry Law' that would split state utility ANDE into six separate companies and create a Superintendency of Electricity. The proposal runs parallel to the executive's own reform — creating a Ministry of Energy, Mines and Hydrocarbons plus an independent regulator — reflecting a broad consensus that the sector must be restructured. The bill is slated for debate as electricity demand grows more than 18% annually versus ANDE's 10% projection.", "image_url": "https://www.abc.com.py/resizer/v2/QWBXUGFGJZHXLLYS6FLBINH4MY.jpg?auth=4574556f45fdb3ba6360d8b04ead8d7fdaa37ffc3ecb72cd34e6f97d2405dfe6&width=770&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Peña Promulgates JICA Loan of USD 224M for the Yabebyry–Pilar Road Corridor (2026-08-21)", "date": "2026-08-21", "source_url": "https://enparaguay.net/pena-promulga-prestamo-del-japon-de-us-224-millones-para-ruta-yabebyry-pilar/", "source_name": "En Paraguay Net", "summary": "President Santiago Peña promulgated Law No. 7713, approving a JICA loan of up to ¥36.38 billion (about USD 224 million) to improve the Yabebyry–Pilar corridor, a road project executed by the Ministry of Public Works (MOPC). The financing deepens Japan's role in Paraguayan infrastructure and complements the ongoing Japanese bilateral agenda, including beef market access and the 90th anniversary of Japanese immigration.", "image_url": "https://www.abc.com.py/resizer/WPacRc6BvCab8qnHhShfxHjf_bQ=/cloudfront-us-east-1.images.arcpublishing.com/abccolor/PNLJLECVKFCK5N42TS5NQPVVFI.jpg", "is_gov_source": false, "is_authoritative": false}, {"title": "Executive Authorizes G. 73.7B in PGN 2026 Modifications via 14 Decrees (2026-08-22)", "date": "2026-08-22", "source_url": "https://www.ultimahora.com/poder-ejecutivo-autoriza-mas-modificaciones-en-pgn-2026", "source_name": "Última Hora", "summary": "The executive issued 14 decrees (No. 6581–6662) authorizing modifications to the 2026 national budget (PGN 2026): increases of G. 59,302 million and reprogramming of G. 14,404.8 million, totaling G. 73,707 million (about USD 12.2 million). Funds were directed to health, the Ministry of Finance, MITIC, social development, agriculture, labor, defense, the anti-drug secretariat (Senad), the Boquerón governorate and the National University of Asunción, among others.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/deef0ba/2147483647/strip/true/crop/2560x1440+0+266/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F1d%2F3c%2F148bacdc4ccf8f540b7d00c4f713%2Ffirma-decreto-santiago-pena-scaled.jpg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "III. Social & Security Landscape", "tier": 1, "events": [{"title": "Doctors Ratify Five-Day National Strike for August 24–28 (2026-08-22)", "date": "2026-08-22", "source_url": "https://www.lanacion.com.py/pais/2026/08/22/medicos-reclaman-mejoras-laborales-y-salariales-con-una-movilizacion-nacional/", "source_name": "La Nación", "summary": "The National Doctors Union (SINAMED) ratified a five-day national strike from August 24–28 after negotiations with the government broke down. Scheduled consultations and elective surgeries in public hospitals will be suspended, while emergency and essential services remain guaranteed. Doctors demand a G. 3,000,000 salary adjustment per post, double pay for holidays worked, and the regularisation (deprecarización) of precarious contracts, noting they have had no wage increase for 12 years.", "image_url": "https://www.lanacion.com.py/resizer/v2/JRE67OX3IVB45MEVLX446YXAFE.jpg?auth=01fa7422092d8d8bcdd55362ad62666cac79af1ed7fb72c91ae1745540ceb6e4&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Government Formalizes Appointment of 11,000 Health Workers Ahead of Strike (2026-08-21)", "date": "2026-08-21", "source_url": "https://www.infobae.com/america/agencias/2026/08/21/gobierno-paraguayo-avala-nombramiento-de-11000-empleados-de-salud-ante-amenaza-de-huelga/", "source_name": "Infobae", "summary": "Facing the looming doctors' strike, the government formalized the appointment of roughly 11,000 health-sector workers — 9,755 medical staff (doctors, dentists, biochemists, nurses, technicians and auxiliaries) plus 1,345 administrative positions. The move is part of a broader effort to 'deprecarizar' (convert precarious contracts into permanent posts) the public health workforce and defuse labor unrest, though unions say salary and conditions demands remain unmet.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Nurses Secure 7,000 Permanent Posts in Labor Regularization Push (2026-08-21)", "date": "2026-08-21", "source_url": "https://www.ultimahora.com/enfermeros-consiguen-7-000-cargos-para-avanzar-en-la-desprecarizacion", "source_name": "Última Hora", "summary": "The Paraguayan Nursing Association reached agreement with authorities to create 7,000 permanent posts, advancing the deprecarización of nursing staff. Beneficiaries will move to salary level 1 (about G. 4.3 million), a significant step toward formalizing a workforce that has long relied on short-term contracts. The agreement is part of a broader government drive to regularize public-health employment amid rising social and labor tensions.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/ad759c0/2147483647/strip/true/crop/1080x608+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fe6%2Fdc%2Fa7062a724d3f9119d98800e263e5%2F1002134813.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Senad 'Operation Redemption' in Canindeyú: Teacher and Indigenous Leader Killed, Accounts Clash (2026-08-16)", "date": "2026-08-16", "source_url": "https://www.ultimahora.com/que-paso-en-corpus-christi", "source_name": "Última Hora", "summary": "On August 16, a Senad (anti-drug agency) 'Operation Redemption' in the Ava Guaraní community Tekoha Y'apo (Corpus Christi, Canindeyú) resulted in the deaths of Catalino Correa, a local teacher, and Antonio Carrillo, an indigenous leader. Senad called both 'high-value targets' linked to fugitive Felipe Santiago Acosta 'Macho' and said a shootout occurred, releasing a video. The community and family deny any shootout, alleging the victims were lured to a meeting over a land dispute at Estancia América, tortured and executed, with weapons planted afterward; the underlying conflict is territorial, with some 300 indigenous families claiming 11,000 hectares in litigation.", "image_url": "https://www.abc.com.py/resizer/v2/UAOCYFXEYZDFZHHEYZ2FXJJN5Y.jpeg?auth=0e37595e2f815bd51e808e5a2e4caf366cefa13546eb62315b3aae7b39ef76b6&width=770&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Teachers' Union Demands Gradual Pay Rise to G. 5M per Shift, Conditions Mobilization (2026-08-21)", "date": "2026-08-21", "source_url": "https://1140am.com.py/docentes-reclaman-reajuste-salarial-y-condicionan-manifestacion-tras-resultado-de-reunion-con-el-gobierno/", "source_name": "Radio 1140 AM", "summary": "The Federation of Educators of Paraguay (FEP) pressed for a gradual salary increase to G. 5 million per shift — 8% in 2027 and 9% in 2028 — plus resources for the teaching career ladder, directors' representation expenses and free-education payments. The demand covers roughly 80,000 teachers (about 62,000 unionized). Union leaders, led by Silvio Piris, conditioned a possible mobilization on the government's response, with a follow-up meeting with the Education and Finance ministries pending.", "image_url": "https://1140am.com.py/wp-content/uploads/2026/08/r-1.jpg", "is_gov_source": false, "is_authoritative": false}], "impact_analysis": "", "user_notes": ""}, {"title": "IV. International Relations & Diplomacy", "tier": 1, "events": [{"title": "Japan's Crown Prince Akishino and Princess Kiko Begin Official Visit to Paraguay (2026-08-21)", "date": "2026-08-21", "source_url": "https://internationalpress.jp/2026/08/21/akishino-y-kiko-inician-su-visita-a-paraguay-con-homenaje-a-los-heroes-nacionales/", "source_name": "International Press", "summary": "Crown Prince Akishino and Princess Kiko of Japan began an official visit to Paraguay to mark the 90th anniversary of Japanese immigration, laying a wreath at the National Pantheon of Heroes alongside Foreign Minister Rubén Ramírez Lezcano. The visit underscores the deep historical ties between the two countries and the Japanese community's economic and social weight in Paraguay, and coincides with a push to open the Japanese market to Paraguayan beef.", "image_url": "https://cdn.internationalpress.jp/2026/08/El-principe-Akishino-y-la-princesa-Kikko-en-el-Panteon-de-los-Heroes-de-Paraguay.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Peña and Japanese Minister Kiuchi Advance Beef Market Access Agenda (2026-08-22)", "date": "2026-08-22", "source_url": "https://www.latribuna.com.py/politica/2026/08/22/pena-y-ministro-japones-abordan-agenda-de-la-carne/", "source_name": "La Tribuna", "summary": "President Santiago Peña met with Japanese State Minister Minoru Kiuchi to advance access for Paraguayan beef to the Japanese market, alongside discussions on investment and defense and security cooperation. Japan, a high-value beef importer, is a strategic target for Paraguayan meat exporters seeking to diversify beyond current markets and capture premium prices, complementing the JICA infrastructure financing already in place.", "image_url": "https://www.latribuna.com.py/resizer/v2/OOV5CXV3YZGDHGQBSKJIJBWGGM.jpg?smart=true&auth=c1024fbf7c748de01678adae5f01e7d6c9c847ed3dd5a0ff4ec4803399c65cd8&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}, {"title": "Mercosur–EU: No Deal on Beef Export Quotas; Paraguay Holds Out for 25% (2026-08-19)", "date": "2026-08-19", "source_url": "https://www.ultimahora.com/sin-acuerdo-los-cupos-seguiran-por-orden-de-llegada-hasta-2027", "source_name": "Última Hora", "summary": "Mercosur members have yet to agree on how to distribute the beef export quotas under the Mercosur–EU trade agreement, with Paraguay insisting on an equitable 25% share for each member state, a position backed by producer unions (ARP, CPC, Capeco, UGP). Without consensus, the existing 'first-come, first-served' system would remain in place and the issue would be revisited in October 2027, leaving uncertainty over a key export channel for Paraguayan ranchers.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/25a72be/2147483647/strip/true/crop/2362x1329+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fadjuntos%2F161%2Fimagenes%2F008%2F774%2F0008774574.jpg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "V. Industry Focus: Telecom, Digital Energy & AI", "tier": 1, "events": [{"title": "HIVE: Columbia Validates Paraguay AI GPUs; 100 MW Substation Energization Set for September (2026-08-18)", "date": "2026-08-18", "source_url": "https://www.proactiveinvestors.com/companies/news/1094258/hive-digital-technologies-reports-successful-ai-training-trial-using-paraguay-based-gpus-1094258.html", "source_name": "Proactive Investors", "summary": "HIVE Digital Technologies completed its first AI research trial using GPUs in Asunción, in collaboration with Columbia University's Department of Industrial Engineering and Operations Research — researchers in New York remotely ran iterative AI training on GPUs over 5,000 miles away, a proof of concept for intercontinental AI compute. The study found HIVE's Nvidia A40 GPUs matched newer-generation H100 performance after optimization and was submitted to NeurIPS. The company's 100 MW substation at its Yguazú 'Gigafactory' is complete, with energization targeted for September 2026 and Tier III data-center construction starting in autumn.", "image_url": "https://cdn.proactiveinvestors.com/eyJidWNrZXQiOiJwYS1jZG4iLCJrZXkiOiJ1cGxvYWRcL05ld3NcL0ltYWdlXC8yMDI2XzA2XC8yMDI1LTA0LTA3LTA4LTM5LTQwLTBmZWUxMjhhM2FkN2FlNmVjMjY4YzU4ZjFmZDkxZTdkLmpwZyIsImVkaXRzIjp7InJlc2l6ZSI6eyJ3aWR0aCI6MTIwMCwiaGVpZ2h0Ijo2MzAsImZpdCI6ImNvdmVyIn19fQ==", "is_gov_source": false, "is_authoritative": true, "client_tag": "HIVE — AI/HPC data center, 100 MW substation, GPU compute"}, {"title": "Atome Defends 2022 ANDE PPA, Announces Study for a 300 MWp Solar Plant (2026-08-19)", "date": "2026-08-19", "source_url": "https://enparaguay.net/atome-defiende-su-contrato-vigente-desde-2022-con-la-ande-y-anuncia-estudio-para-una-planta-solar-de-300-mwp/", "source_name": "En Paraguay Net", "summary": "Atome, an energy company, defended its power purchase agreement (PPA) with ANDE in force since 2022 for 145 MW of reserved capacity — which it says is already incorporated into the state utility's projections to 2050 — and announced studies for a 300 MWp solar plant. The announcement highlights the growing queue of private energy projects (over 6,000 MW) awaiting clear rules as the government's electricity reform advances and ANDE's list of potential customers becomes dominated by AI and data-center operators.", "image_url": "https://www.abc.com.py/resizer/cASGP0ctgapLiipfDA-sKjhgIDk=/cloudfront-us-east-1.images.arcpublishing.com/abccolor/7HZUINSHZBB4TFC3V4CSSRYF5E.jpg", "is_gov_source": false, "is_authoritative": false, "client_tag": "Atome — 145 MW PPA, 300 MWp solar; energy-sector reform"}, {"title": "Riquelme Courts Chile for Energy Exports and AI Data Centers (2026-08-20)", "date": "2026-08-20", "source_url": "https://www.lapoliticaonline.com/paraguay/energia-py/riquelme-quiere-venderle-energia-a-chile-socio-clave-de-paraguay-en-el-corredor-bioceanico/", "source_name": "La Política Online", "summary": "Industry and Commerce Minister Marco Riquelme traveled to Chile at President Peña's request to attract investment, focused on exporting Paraguayan energy, regional electricity interconnection and AI data centers. The visit ties Paraguay's clean-energy surplus to the Bioceanic Corridor and positions the country as a potential energy supplier to Chile, a key partner. It also supports the government's legislative push to open the electricity market to private generation.", "image_url": "https://www.lapoliticaonline.com/files/image/296/296937/6a87742330a50_1200_630!.jpg?s=75b89a3f2b33eed103df3099a6b6bc90&d=1787194800", "is_gov_source": false, "is_authoritative": true, "client_tag": "Digital energy — regional interconnection, AI data centers"}, {"title": "Electricity Market Set to Open to Private Capital as ANDE Cedes Regulatory Role (2026-08-20)", "date": "2026-08-20", "source_url": "https://infonegocios.com.py/nota-principal/el-mercado-electrico-podria-abrirse-al-capital-privado-y-la-ande-dejaria-de-concentrar-la-regulacion", "source_name": "InfoNegocios", "summary": "Paraguay's electricity market is set to open to private capital as state utility ANDE moves to shed its regulatory concentration. Private generators would be able to produce power for self-consumption and sell surpluses — including back to ANDE — under an initial scheme for the state to acquire some 140 MW from private plants, with emphasis on solar and other renewables. The opening comes amid electricity demand growing more than 18% annually and a queue of over 6,000 MW of private projects awaiting clearer rules.", "image_url": "https://infonegocios.com.py/images/resize/720600-1200x675.webp", "is_gov_source": false, "is_authoritative": true, "client_tag": "Digital energy — private generation, solar, 140 MW scheme"}], "impact_analysis": "", "user_notes": ""}, {"title": "VI. Key Client Developments", "tier": 1, "events": [{"title": "Tigo (Millicom): Q2 2026 — Paraguay Posts Group-Leading 56.9% EBITDA Margin (2026-08-06)", "date": "2026-08-06", "source_url": "https://finance.yahoo.com/markets/stocks/articles/millicom-international-cellular-sa-tigo-190553957.html", "source_name": "Yahoo Finance", "summary": "Millicom (Tigo) reported record Q2 2026 results: group service revenue of USD 2.0 billion (+5% organic), record adjusted EBITDA of USD 1.0 billion (46.3% margin) and record equity free cash flow of USD 327 million. Paraguay contributed 8% of group service revenue (USD 169 million, +3.4% organic) and posted the group's highest adjusted EBITDA margin at 56.9%, boosted by the guaraní's appreciation which lowered the dollar cost of content and sports rights. Management flagged the FX-driven margin as potentially unsustainable if the currency reverses.", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Millicom/Tigo — 5G 2.3 GHz deployment; network equipment, base stations"}, {"title": "Personal (Telecom Argentina): H1 Capex Up 47.3% to USD 631M; FTTH Now 36% of Base (2026-08-14)", "date": "2026-08-14", "source_url": "https://www.bnamericas.com/en/news/argentinas-personal-ramps-up-capex-toward-us13bn-target", "source_name": "BNamericas", "summary": "Telecom Argentina (Personal) accelerated capital expenditure in H1 2026 to ARS 946.47 billion (about USD 631 million), up 47.3% year-on-year and equivalent to 18.6% of consolidated sales, toward a full-year target of up to USD 1.3 billion. Investment is directed at fixed and mobile data, 4G site modernization, 5G deployment and FTTH fiber, with FTTH now 36% of the broadband base (over 1.5 million connections). In Paraguay, subsidiary Núcleo (Personal) holds two 3.7 GHz lots and leads the FTTH market with 1.66 million mobile users.", "image_url": "https://cdnimg.bnamericas.com/PFkTUwVUcCZTSZCGcXpVfHyzSMPMJWoLdoowaAHTeoPeVCuyGINVnfEypEMUjplC.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Telecom Argentina/Personal — 5G 3.7 GHz deployment; FTTH, fiber"}], "impact_analysis": "", "user_notes": ""}, {"title": "VII. Integrated Impact Analysis for Business Operations", "tier": 2, "events": [], "impact_analysis": "🟡 FX Pressure — Strong Guaraní Squeezes Exporters, Benefits Importers: The dollar's renewed slide toward G. 6,000 (G. 6,009 interbank on Aug 21) is the week's defining macro theme. For importers of capital goods and telecom/energy equipment, the strong guaraní lowers landed costs and boosts purchasing power. For exporters — cattle, soy and maquila — it compresses guaraní margins, visible in beef's 25% volume drop despite a 21% price rise. Businesses with USD-denominated revenue should maintain hedging, echoing the BCP's push on forward contracts.\n\n🟢 Growth Momentum Intact: CEPAL's 4.3% projection for 2026, corroborated by the IMF/World Bank (4.4%) and the BCP (4.5%), confirms Paraguay remains one of the region's fastest-growing economies. Strong domestic demand and diversification into manufacturing and services support telecom and digital-infrastructure demand, though growth is still anchored in agriculture.\n\n🔴 Labor & Social Risk — Health Sector Strike: The five-day national doctors' strike (Aug 24–28) and the government's parallel appointment of 11,000 health workers signal acute social tension despite solid macro numbers. The IPS crisis and precarización demands mirror the broader discontent seen in prior weeks' protests. Firms with public-facing operations or health-sector contracts should plan for service disruptions this week. A separate flashpoint is the Canindeyú 'Operation Redemption' incident (Aug 16), in which a teacher and an indigenous leader were killed amid clashing official and community accounts over a land dispute — a reminder that rural land and indigenous-rights tensions remain a distinct security risk in the interior.\n\n🟢 Structural Energy Reform — Long-Term Opportunity: The parallel bills to split ANDE into six companies and create a Ministry of Energy, Mines and Hydrocarbons plus an independent regulator mark the most consequential policy shift of the period. With demand growing 18% annually and over 6,000 MW of private projects queued, the reform promises clearer rules for data centers and AI operators (HIVE, the Taiwan Yguazú Digital hub). The 100 MW HIVE substation energization in September is a concrete near-term milestone.\n\n🟡 Client Diversification & FX Sensitivity: Millicom's disclosure that Paraguay's 56.9% EBITDA margin was partly FX-driven (and 'potentially unsustainable') is a reminder that operator profitability in Paraguay is currency-sensitive. All four 5G licensees (Claro, Nubicom, Tigo, Personal) remain under deployment deadlines, sustaining near-term equipment demand, but suppliers should diversify across operators and into enterprise/private networks given the concentrated, foreign-controlled market.", "user_notes": ""}, {"title": "VIII. Targeted Recommendations for Chinese Enterprises", "tier": 2, "events": [], "impact_analysis": "🔴 High Risk — Diplomatic Constraints Unchanged: Paraguay remains Taiwan's sole South American ally, and no diplomatic thaw with Beijing occurred this week. Chinese enterprises should continue to expect exclusion from public 5G and infrastructure tenders — the trusted-vendor rules bar Huawei and ZTE, a constraint reaffirmed by the second 5G auction — and must run rigorous compliance reviews before any Paraguay-linked engagement.\n\n🟡 Medium Risk — Indirect Access Only: China remains Paraguay's largest goods supplier (phones, computers, tires), and Chinese firms can still serve the market indirectly through Brazilian, Argentine or Chilean subsidiaries or trading intermediaries. The Japan-Paraguay beef agenda and Mercosur-EU quota talks are regional channels to monitor, but direct Chinese-branded deals in sensitive sectors (telecom, energy) stay politically constrained.\n\n🟢 Opportunity — Energy & Digital Infrastructure: The electricity reform (ANDE split, Ministry of Energy, independent regulator) and the 18%-annual demand growth create demand for power equipment, transmission and grid modernization where Chinese suppliers (transformers, HVDC, solar modules) can participate through consortiums with non-Chinese partners. Atome's 300 MWp solar study and the 6,000 MW project queue signal concrete procurement opportunities.\n\n🟢 Opportunity — Equipment via Third Parties: The 5G buildout — Nubicom's USD 200 million standalone network with Ericsson/Nokia, plus Tigo and Personal deployment deadlines — requires radios, fiber and edge infrastructure. Chinese equipment vendors, though barred from public auctions, can pursue enterprise/private networks, wholesale fiber, and partnerships with Latin American integrators (Datawaves-style suppliers) already serving Claro, Tigo and Personal.\n\n🟡 Caution — Labor & FX Risk: The doctors' strike, IPS crisis and persistent precarización point to labor friction despite headline growth; the strong guaraní (about 20% appreciation over a year) simultaneously erodes the renminbi value of any USD-linked revenue. Chinese firms with local operations should review labor compliance, plan around this week's health-sector strike, and hedge FX exposure proactively.", "user_notes": ""}]}};

  var fnMap={GDP:renderMacroCardGDP,CPI:renderMacroCardCPI,FX:renderMacroCardFX,RIN:renderMacroCardRIN};
  var fn=fnMap[type];if(!fn)return;

    if(type==='FX')dataSection=renderFXDailyTable(MACRO_FX,MACRO_FX.lu);
    else{var dMap={CPI:MACRO_CPI,RIN:MACRO_RIN};var unitMap={CPI:MACRO_CPI.lu,RIN:L(MACRO_RIN.lu[0],MACRO_RIN.lu[1])};dataSection=renderMacroDataTable(dMap[type],unitMap[type]);}

    h+='</tr>';

}
function renderFXDailyTable(d,unit){
  var DM=[31,28,31,30,31,30,31,31,30,31,30,31],dl=d.line||[];

  h+='<div class="macro-data-table-wrap" style="display:none"><table class="macro-data-table"><thead><tr><th>'+L('日期','Date')+'</th><th>PYG/USD</th></tr></thead><tbody>';
  var dates=[],day=1,mo=0,yr=2023;
  for(var i=0;i<dl.length;i++){
    dates.push(yr+'-'+(mo<9?'0'+(mo+1):(mo+1))+'-'+(day<10?'0'+day:day));
    day++;var dim=DM[mo];if(mo===1&&yr%4===0)dim=29;

function renderAll(){
  if(!briefingData)return;

  var sections=d.sections||[],tier1=[],tier2=[];

  var pills='<div class="stats-row-total"><div class="stat-pill pill-total" onclick="scrollToSec(null)"><span class="pill-label">'+L('全部事件','All Events')+'</span><span class="pill-count">'+total+'</span></div></div>';
  for(var row=0;row<2;row++){
    pills+='<div class="stats-row-sections">';

      pills+='<div class="stat-pill" style="background:'+c.bg+';color:'+c.text+';" onclick="scrollToSec('+idx+')"><span class="pill-dot" style="background:'+c.dot+'"></span><span class="pill-label">'+stripNum(sec.title)+'</span><span class="pill-count">'+cnt+'</span></div>';

function renderSection(sec,idx){
  var events=sec.events||[],isT2=sec.tier===2;
  var g=GRAD[idx%8],icon=ICONS[idx%8];
  var body='';
  if(isT2||events.length===0){
    if(sec.impact_analysis)body='<div class="analysis-body">'+fmt(sec.impact_analysis)+'</div>';
    else if(!isT2)body='<div style="padding:4px 22px 16px;color:#94A3B8;font-size:13px;">'+L('暂无此时间段内的事件','No events in this period')+'</div>';
  }else{
    var cards='';
    for(var i=0;i<events.length;i++)cards+=renderCard(events[i],g[0],g[1],icon);
    body='<div class="events-grid">'+cards+'</div>';
  }
  var badge=events.length>0?'<span class="badge">'+events.length+L(' 条事件',' events')+'</span>':'';
  return '<div class="section s'+(idx%8)+(isT2?' tier2':'')+'" id="sec-'+idx+'"><div class="section-header"><h2>'+esc(sec.title||'')+'</h2>'+badge+'</div>'+(sec.description?'<div class="section-desc">'+esc(sec.description)+'</div>':'')+body+'</div>';

function renderCard(evt,phFrom,phTo,icon){
  var img=evt.image_url,hasImg=img&&img.indexOf('http')===0;
  var ih='';
  if(hasImg)ih='<img src="'+esc(img)+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">';
  ih+='<div class="img-placeholder" style="background:linear-gradient(135deg,'+phFrom+','+phTo+');'+(hasImg?'display:none':'display:flex')+';font-size:32px;color:#fff;">'+icon+'</div>';

  var tags='';
  if(evt.date)tags+='<span class="event-tag date">'+esc(evt.date)+'</span>';
  if(evt.client_tag)tags+='<span class="event-tag client">'+esc(evt.client_tag)+'</span>';
  if(evt.is_gov_source)tags+='<span class="event-tag gov">'+L('政府官网','Government')+'</span>';
  else if(evt.is_authoritative)tags+='<span class="event-tag auth">'+L('权威媒体','Authoritative')+'</span>';
  if(evt.source_name)tags+='<span class="event-tag source">'+esc(evt.source_name)+'</span>';

  var link=evt.source_url?'<a class="event-link" href="'+esc(evt.source_url)+'" target="_blank" rel="noopener">'+L('查看原文 →','Read more →')+'</a>':'';
  var preview=evt.summary||'';if(!preview&&evt.title)preview=evt.title;
  return '<div class="event-card"><div class="event-img">'+ih+'</div><div class="event-body"><div class="event-meta">'+tags+'</div><div class="event-preview">'+esc(preview)+'</div>'+link+'</div></div>';
}

function fmt(text){
  var h=esc(text);
  h=h.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
  h=h.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
  h=h.replace(/\n/g,'<br>');
  return h;
}

function scrollToSec(idx){
  var pills=document.querySelectorAll('.stat-pill');
  for(var i=0;i<pills.length;i++)pills[i].style.outline='';
  if(idx===null||idx===undefined){window.scrollTo({top:0,behavior:'smooth'});return;}
  var el=document.getElementById('sec-'+idx);
  if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.style.boxShadow='0 0 0 3px #3B82F6';
  setTimeout(function(){el.style.boxShadow='';},1500);
}

}
function openMacroModal(){
  var h='<div class="update-modal-overlay" id="macroModal" onclick="closeUpdateModal(\'macroModal\')"><div class="update-modal" onclick="event.stopPropagation()"><h3>'+L('更新宏观数据','Update Macro Data')+'</h3>';
  h+='<p style="font-size:11px;color:#94A3B8;margin-bottom:12px">'+L('下载最新 BCP Excel 后填入文件名','Fill in latest BCP Excel filenames')+'</p>';
  h+='<input type="text" id="cpiFileName" placeholder="'+L('CPI文件，如 AE_IPC-26.6.xlsx','CPI file, e.g. AE_IPC-26.6.xlsx')+'" style="width:100%;font-size:12px;padding:8px 10px;border:1px solid #CBD5E1;border-radius:6px;margin-bottom:8px">';
  h+='<input type="text" id="rinFileName" placeholder="'+L('RIN文件，如 reservas...xlsx','RIN file, e.g. reservas...xlsx')+'" style="width:100%;font-size:12px;padding:8px 10px;border:1px solid #CBD5E1;border-radius:6px;margin-bottom:12px">';
  h+='<div class="btn-row"><button class="btn-secondary" onclick="closeUpdateModal(\'macroModal\')">'+L('取消','Cancel')+'</button><button class="btn-primary" onclick="refreshMacroData()">'+L('更新','Update')+'</button></div>';
  h+='<div id="genStatus" style="margin-top:10px;font-size:12px;color:#64748B;display:none"></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
}
function refreshMacroData(){
  var cpiFile=document.getElementById('cpiFileName').value.trim();
  var rinFile=document.getElementById('rinFileName').value.trim();
  if(!cpiFile&&!rinFile){alert(L('请至少输入一个文件名','Please enter at least one filename.'));return;}
  var st=document.getElementById('genStatus');
  st.style.display='block';st.innerHTML='<span class="loading-spinner"></span>'+L('正在读取宏观数据文件…','Reading macro data files…');
  fetch('/api/update-macro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cpi_file:cpiFile,rin_file:rinFile})}).then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    var msgs=[];
    if(data.cpi&&data.cpi.length){MACRO_CPI.line=data.cpi;msgs.push(L('CPI已更新('+data.cpi.length+'个月)','CPI updated ('+data.cpi.length+' mo)'));}
    if(data.cpi_error)msgs.push(L('CPI错误: ','CPI error: ')+data.cpi_error);
    if(data.rin&&data.rin.length){MACRO_RIN.line=data.rin;msgs.push(L('RIN已更新('+data.rin.length+'个月)','RIN updated ('+data.rin.length+' mo)'));}
    if(data.rin_error)msgs.push(L('RIN错误: ','RIN error: ')+data.rin_error);
    if(msgs.length){renderAll();st.innerHTML='<span style="color:#10B981">'+msgs.join('; ')+'</span>';}
    else st.innerHTML='<span style="color:#EF4444">'+L('更新失败','Update failed')+'</span>';
  }).catch(function(){st.innerHTML='<span style="color:#EF4444">'+L('更新失败，请确保 Flask 服务器已启动','Failed. Make sure Flask server is running.')+'</span>';});
}
function closeUpdateModal(id){
  var m=document.getElementById(id||'updateModal');if(m)m.remove();
  var h=document.getElementById('histModal');if(h&&id!=='histModal')h.remove();
}
document.addEventListener('DOMContentLoaded',function(){
  if(window.IS_STANDALONE)document.getElementById('standaloneBanner').style.display='block';
  if(MACRO_FX.monthly&&!MACRO_FX.line)MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
  fetch('/api/briefing/briefing_en.json').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    DATA['en']=data;briefingData=data;currentLang='en';renderAll();updateLangBtn();
    fetch('/api/briefing/briefing.json').then(function(r){if(r.ok)return r.json();}).then(function(zh){if(zh)DATA['zh']=zh;}).catch(function(){});
    if(!window.IS_STANDALONE)fetchLiveFX();
  }).catch(function(){
    briefingData=DATA['en'];currentLang='en';renderAll();updateLangBtn();
  });
});
function fetchLiveFX(){
  fetch('/api/macro/fx').then(function(r){if(!r.ok)return;return r.json();}).then(function(d){
    if(!d||!d.rate)return;
    var arr=MACRO_FX.monthly||MACRO_FX.line||[];
    arr[arr.length-1]=d.rate;
    window.MACRO_FX_DATE=(d.date||'').replace(/-/g,'.');
    MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
    renderAll();
  }).catch(function(){});
}
</script>
