<title>Paraguay Briefing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#F0F4FF;color:#1E293B;line-height:1.6;min-height:100vh}
a{color:#3B82F6;text-decoration:none}a:hover{text-decoration:underline}
.header{background:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;border-bottom:3px solid #3B82F6}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;flex-shrink:0}
.header-left h1{font-size:20px;font-weight:700;color:#1E293B}
.header-left .subtitle{font-size:12px;color:#64748B;margin-top:2px}
.header-right{display:flex;gap:8px;align-items:center}
.btn-lang{background:#EEF2FF;color:#4F46E5;font-weight:700;font-size:12px;padding:8px 14px;border-radius:20px;border:none;cursor:pointer}
.btn-lang:hover{background:#E0E7FF}
.btn-primary{background:#3B82F6;color:#fff;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-primary:hover{background:#2563EB;transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.3)}
.btn-secondary{background:#F1F5F9;color:#475569;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:#E2E8F0}
.btn-sm{font-size:11px;padding:6px 12px}
.update-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:moFade .2s}
.update-modal{background:#fff;border-radius:14px;padding:24px 28px;width:440px;max-width:90vw;box-shadow:0 24px 80px rgba(0,0,0,.25);animation:moZoom .25s}
.update-modal h3{font-size:17px;font-weight:700;color:#1E293B;margin-bottom:16px}
.update-modal label{display:block;font-size:12px;font-weight:600;color:#64748B;margin-bottom:4px}
.update-modal select,.update-modal input{width:100%;padding:8px 12px;border:1px solid #CBD5E1;border-radius:8px;font-size:13px;margin-bottom:14px;color:#1E293B;background:#fff}
.update-modal .btn-row{display:flex;gap:8px;justify-content:flex-end}
.time-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.time-preset{padding:5px 12px;border-radius:14px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #CBD5E1;background:#fff;color:#64748B;transition:all .12s}
.time-preset:hover,.time-preset.active{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.history-list{max-height:300px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid #E2E8F0;border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.history-item:hover{background:#F8FAFC;border-color:#CBD5E1}
.history-item .hi-title{font-weight:600;font-size:13px;color:#1E293B}
.history-item .hi-meta{font-size:11px;color:#94A3B8}
.history-item .hi-count{font-size:11px;font-weight:600;color:#3B82F6;background:#EEF2FF;padding:2px 8px;border-radius:10px}
.loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid #CBD5E1;border-top-color:#3B82F6;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.standalone-banner{background:#FEF3C7;color:#92400E;text-align:center;padding:6px 16px;font-size:12px;border-bottom:1px solid #FDE68A;display:none}
.standalone-banner code{background:#FDE68A;padding:1px 5px;border-radius:3px;font-size:11px}

.stats-row{max-width:1400px;margin:0 auto;padding:12px 32px 16px;display:flex;flex-direction:column;gap:8px}
.stats-row-total{display:flex;justify-content:center}
.stats-row-sections{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:768px){.stats-row-sections{grid-template-columns:repeat(2,1fr)}}
.stat-pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;cursor:pointer;transition:all .2s;border:2px solid transparent;font-size:13px;font-weight:600;user-select:none;min-width:0}
.stat-pill:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.pill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pill-label{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-count{font-size:14px;font-weight:700;margin-left:auto;flex-shrink:0;background:rgba(255,255,255,.5);padding:1px 8px;border-radius:10px}
.stat-pill.pill-total{background:#1E293B;color:#fff;font-weight:700;border-radius:24px;display:inline-flex}
.stat-pill.pill-total .pill-count{background:rgba(255,255,255,.2)}

.content{max-width:1400px;margin:0 auto;padding:0 32px 60px}
.section{background:#fff;border-radius:14px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden;border-top:4px solid #3B82F6}
.section.s0{border-top-color:#3B82F6}.section.s1{border-top-color:#EF4444}.section.s2{border-top-color:#10B981}
.section.s3{border-top-color:#8B5CF6}.section.s4{border-top-color:#06B6D4}.section.s5{border-top-color:#F59E0B}
.section.s6{border-top-color:#6366F1}.section.s7{border-top-color:#EC4899}.section.tier2{background:#FAFBFC}
.section-header{padding:16px 22px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-header h2{font-size:16px;font-weight:700;color:#1E293B}
.section-header .badge{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;background:#F1F5F9;color:#64748B;white-space:nowrap}
.section-desc{padding:4px 22px 10px;font-size:12px;color:#94A3B8}
.events-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 22px 18px}
@media(max-width:860px){.events-grid{grid-template-columns:1fr}.event-card{flex-direction:column}.event-card .event-img{width:100%!important;min-height:120px;max-height:180px}}
.event-card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;transition:all .2s;display:flex}
.event-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-1px);border-color:#CBD5E1}
.event-card .event-img{width:160px;min-height:140px;flex-shrink:0;position:relative;overflow:hidden}
.event-card .event-img img{width:100%;height:100%;object-fit:cover;display:block}
.event-card .event-img .img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.event-card .event-body{padding:12px 15px;flex:1;min-width:0;display:flex;flex-direction:column}
.event-card .event-meta{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.event-card .event-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.event-tag.date{background:#F1F5F9;color:#64748B}.event-tag.gov{background:#DCFCE7;color:#15803D}
.event-tag.auth{background:#DBEAFE;color:#1D4ED8}.event-tag.source{background:#FEF3C7;color:#A16207}
.event-tag.client{background:#FCE7F3;color:#BE185D}
.event-card .event-preview{font-size:13px;color:#334155;line-height:1.6;flex:1;overflow:visible;max-height:none}
.event-card .event-link{font-size:11px;margin-top:6px;color:#3B82F6;font-weight:500}
.analysis-body{padding:4px 22px 20px;font-size:13px;line-height:1.8;color:#334155}
.analysis-body h3{font-size:15px;font-weight:700;margin:14px 0 6px;color:#1E293B}
.analysis-body ul{padding-left:0;list-style:none}
.analysis-body li{padding:2px 0 2px 18px;position:relative}
.analysis-body li::before{content:"•";position:absolute;left:2px;color:#3B82F6;font-weight:bold}
.tier-divider{text-align:center;padding:16px 0 8px;margin:8px 0}
.tier-divider span{background:linear-gradient(135deg,#3B82F6,#6366F1);color:#fff;padding:8px 28px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(59,130,246,.25)}
.footer{text-align:center;padding:20px 32px 40px;color:#94A3B8;font-size:12px;max-width:1400px;margin:0 auto}
.macro-dashboard{background:#fff;border-radius:14px;margin-bottom:18px;padding:16px 22px 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-top:4px solid #1E293B}
.macro-title{font-size:15px;font-weight:700;color:#1E293B;margin-bottom:2px}
.macro-period{font-size:11px;font-weight:400;color:#94A3B8;margin-left:6px}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media(max-width:900px){.macro-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.macro-grid{grid-template-columns:1fr}}
.macro-card{background:#F8FAFC;border-radius:8px;padding:10px 8px 4px;border:1px solid #E2E8F0}
.macro-card-title{font-size:10.5px;font-weight:600;color:#475569;margin-bottom:4px;text-align:center;line-height:1.3;min-height:28px;display:flex;align-items:center;justify-content:center}
.macro-card{position:relative}
.macro-source{position:absolute;top:6px;right:8px;font-size:7.5px;color:#94A3B8;font-weight:500;background:#fff;padding:1px 5px;border-radius:3px;border:1px solid #E2E8F0;z-index:1;pointer-events:none}
.macro-latest{display:flex;justify-content:center;align-items:baseline;gap:4px;margin-top:2px;padding:3px 0}
.macro-latest-label{font-size:9px;color:#94A3B8;font-weight:500}
.macro-latest-val{font-size:15px;font-weight:700;color:#1E293B}
.macro-latest-unit{font-size:9px;color:#64748B;font-weight:500}
.macro-latest-date{font-size:9px;color:#94A3B8}
.macro-note{font-size:9px;color:#94A3B8;margin-top:1px}
.macro-card{cursor:pointer;transition:transform .15s,box-shadow .15s}
.macro-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.macro-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:moFade .2s}
.macro-modal-card{background:#fff;border-radius:16px;padding:24px 28px 18px;width:680px;max-width:94vw;max-height:90vh;overflow-y:auto;cursor:default;box-shadow:0 24px 80px rgba(0,0,0,.25);position:relative;animation:moZoom .25s}
.macro-modal-card .macro-card{border:none;padding:0;background:transparent;cursor:default}
.macro-modal-card .macro-card:hover{transform:none;box-shadow:none}
.macro-modal-card .macro-card-title{font-size:15px;min-height:auto;margin-bottom:10px}
.macro-modal-card .macro-legend,.macro-modal-card [style*=legend]{font-size:11px!important}
.macro-modal-close{position:absolute;top:10px;right:16px;font-size:26px;cursor:pointer;color:#94A3B8;background:none;border:none;line-height:1;z-index:10;padding:4px 8px;border-radius:6px}
.macro-modal-close:hover{color:#475569;background:#F1F5F9}
.macro-data-section{margin-top:14px;border-top:1px solid #E2E8F0;padding-top:10px}
.macro-data-toggle{background:#F8FAFC;border:1px solid #CBD5E1;padding:6px 16px;border-radius:6px;font-size:12px;color:#64748B;cursor:pointer;font-weight:500}
.macro-data-toggle:hover{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.macro-data-table-wrap{margin-top:10px;max-height:340px;overflow-y:auto;border:1px solid #E2E8F0;border-radius:8px}
.macro-data-table{width:100%;border-collapse:collapse;font-size:12px}
.macro-data-table th{background:#F8FAFC;padding:7px 12px;text-align:right;font-weight:600;color:#475569;border-bottom:2px solid #E2E8F0;position:sticky;top:0}
.macro-data-table th:first-child{text-align:left}
.macro-data-table td{padding:5px 12px;text-align:right;border-bottom:1px solid #F1F5F9;color:#334155;font-variant-numeric:tabular-nums}
.macro-data-table td:first-child{text-align:left;color:#64748B;font-weight:500}
.macro-data-table tbody tr:hover td{background:#EEF2FF}
.macro-na{color:#CBD5E1!important}
@keyframes moFade{from{opacity:0}to{opacity:1}}
@keyframes moZoom{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:768px){.header{padding:14px 16px}.header-left h1{font-size:16px}.stats-row{padding:10px 14px;gap:6px}.stat-pill{padding:8px 12px;font-size:12px}.pill-label{font-size:11px}.content{padding:0 12px 40px}.section-header{padding:12px 14px 0}.events-grid{grid-template-columns:1fr;padding:4px 14px 14px}}
</style>
</head>

<script>
window.IS_STANDALONE = true;
window.EMBEDDED_BRIEFINGS = {"zh": {"topic": "巴拉圭简报", "time_span": "2026年8月22日 — 2026年8月29日", "time_label": "最近一周", "sections": [{"title": "一、宏观经济动态", "tier": 1, "events": [{"title": "瓜拉尼跌破6,000瓜拉尼关口，出口商施压央行干预（2026-08-28）", "date": "2026-08-28", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/negocios/2026/08/27/gremio-pide-medidas-urgentes-al-bcp-ante-caida-del-dolar/", "source_name": "La Nación", "summary": "美元自2018年以来首次跌破6,000瓜拉尼关口，央行参考汇率于8月27日收在5,929.69瓜拉尼、8月28日收在5,922.01瓜拉尼。瓜拉尼12个月内升值超20%，巴拉圭出口商协会（Capex）和可持续工业协会（Cispy）紧急要求央行干预，警告竞争力受损、出口下降和失业风险。央行至今保持不干预立场，将跌势归因于市场基本面和套息交易资金流入。", "image_url": "https://www.lanacion.com.py/resizer/v2/7ED2737NQBBDHDXJHZS2U2AJWM.jpeg?auth=3481fb2d2211a73e7e257bd194f6681a07e03ad63fdf701025a72092847edb5d&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "国际货币基金组织完成2026年第四条款磋商：增速4.4%，通胀向目标靠拢（2026-08-28）", "date": "2026-08-28", "source_url": "https://www.imf.org/es/news/articles/2026/08/28/pr26280-paraguay-imf-executive-board-concludes-2026-article-iv-consultation", "source_name": "IMF", "summary": "国际货币基金组织执董会完成了对巴拉圭的2026年第四条款磋商，预计2026年增速4.4%（2025年为6.6%），通胀正向3.5%的目标靠拢，财政赤字将扩大至GDP的3.5%。基金组织强调了巴拉圭经济的韧性、瓜拉尼的大幅实际升值以及接近1,100亿美元的净国际储备，并建议继续实施财政纪律和汇率灵活性。", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "央行一致决定维持5.50%政策利率不变（2026-08-27）", "date": "2026-08-27", "source_url": "https://www.ultimahora.com/tasa-de-politica-monetaria-se-mantiene-en-zona-neutral", "source_name": "Última Hora", "summary": "央行货币政策委员会一致决定将基准利率维持在5.50%的中性区间，背景是国际市场动荡、油价逼近每桶90美元以及国内货币持续升值。下次货币政策委员会定于9月21日召开。央行正在平衡下行的通胀（7月同比1.6%）与出口商要求干预以遏制瓜拉尼升值的呼声。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/6cf3edf/2147483647/strip/true/crop/2048x1152+0+108/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fe4%2Feb%2F3c73f94f42999cdec82060e353ec%2Fbanco-central-del-paraguay-foto-nueva.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "公共债务超210亿美元（占GDP 34%），财政刚性加剧（2026-08-29）", "date": "2026-08-29", "source_url": "https://www.latribuna.com.py/negocios/economia/2026/08/29/creciente-rigidez-del-gasto-publico-amenaza-la-estabilidad-financiera/", "source_name": "La Tribuna", "summary": "巴拉圭公共债务已超210亿美元，约合GDP的34%，公共开支刚性加剧正在威胁金融稳定。分析人士警告，工资、养老金和强制性转移等刚性开支正在挤占生产性投资，而国际货币基金组织第四条款磋商也指出2026年财政赤字占GDP的3.5%。随着提高债务上限的提议出台，围绕财政锚定的争论进一步加剧。", "image_url": "https://www.latribuna.com.py/resizer/v2/VCFGFFQEMREJZH5CR7MHF4OQMU.jpg?smart=true&auth=d130f5e47885beb3ddb8fff456c8813a28af16f187c2f9728c09def349553859&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "二、政治与政策变化", "tier": 1, "events": [{"title": "新电力监管机构将由ANDE、Petropar及私营部门缴纳的规费供资（2026-08-25）", "date": "2026-08-25", "source_url": "https://www.ultimahora.com/petropar-ande-y-sector-privado-pagaran-tasas-a-nuevo-ente-regulador", "source_name": "Última Hora", "summary": "拟议中的独立电力监管机构（Ente Regulador Eléctrico）将通过国有电力公司ANDE、Petropar以及私营部门强制缴纳的监管规费供资，上限为电力服务报酬额的2%。这一措施是培尼亚政府推动分离电力行业政策、监管与运营职能的一部分，结束ANDE长达六十年对这些职能的集中。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/8e470fa/2147483647/strip/true/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fb9%2Fba%2F4e229c94403691132aedd775578c%2Fpetropar.webp", "is_gov_source": false, "is_authoritative": true}, {"title": "参议院半批准将侵占土地定为刑事犯罪、最高判处10年的法案（2026-08-22）", "date": "2026-08-22", "source_url": "https://www.abc.com.py/tag/ley-anti-invasion/", "source_name": "ABC Color", "summary": "参议院对一项将侵占土地定为刑事犯罪、最高可判处10年监禁的法案给予半批准，并将其退回众议院。荣耀科罗拉多党团表示将力争把该法案列入8月29日的会议议程，称已有足够票数促其最终通过。此法案出台之前数日，Canindeyú省“救赎行动”导致教师和土著领袖身亡，其根源是土著家庭主张权利的1.1万公顷土地纠纷，凸显土地冲突已成为立法议程的优先事项。", "image_url": "https://www.abc.com.py/pf/resources/images/OG-Image-ABC.png?d=2590", "is_gov_source": false, "is_authoritative": true}, {"title": "能源部之争加剧：“设部可行，ANDE不可行”（2026-08-26）", "date v_source": false, "is_authoritative": true}, {"title": "边境安全：东方市百万劫案第二名嫌疑人被捕（2026-08-27）", "date": "2026-08-27", "source_url": "https://www.latribuna.com.py/sucesos/policiales/2026/08/27/detienen-a-segundo-implicado-en-asalto-millonario-en-ciudad-del-este/", "source_name": "La Tribuna", "summary": "警方逮捕了8月18日东方市Brisas del Paraná仓库百万劫案的第二名嫌疑人，缴获一把9毫米手枪、可卡因和4,000万瓜拉尼。当局还确认了另外7名涉嫌实施人员，这一案例凸显上巴拉那州有组织犯罪压力持续；巴西与巴拉圭已加强对PCC犯罪团伙的联合围堵，美国国务院近期也建议在上巴拉那州等边境地区“提高警惕”。", "image_url": "https://www.latribuna.com.py/resizer/v2/MD3ZEGPH6JET3IA3XGCWQZBJNM.jpg?smart=true&auth=49e1ee8e747a2af556f0812d6a433702071f202bc561e4955bfa773a33ca416f&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "四、国际关系与外交动态", "tier": 1, "events": [{"title": "南共市–欧盟配额僵局加剧：乌拉圭拿走63%的大米配额（2026-08-23）", "date": "2026-08-23", "source_url": "https://www.abc.com.py/politica/2026/08/18/mercosur-ue-aun-no-hay-acuerdo-sobre-las-cuotas-de-exportacion/", "source_name": "ABC Color", "summary": "南共市成员国仍在就欧盟出口配额的分配陷入僵局，巴拉圭坚持每国均分25%的份额，而巴西和阿根廷倾向于基于出口历史和经济权重的标准。在过渡期的“先到先得”机制下，乌拉圭已拿走63%的大米配额，巴拉圭将此作为不公平的证据。总统培尼亚概括这一立场：“我们要的不是特权，而是公平”，该议题定于2026年10月复议。", "image_url": "https://www.abc.com.py/resizer/v2/33TMGOVGJFHFVKQ55HLNJH25X4.jpg?auth=e33e2eea7a24c6c156281d14cbe4570a0308c42d1bfdd86f03f6bb042c1173c2&width=770&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "台湾寻求扩大与巴拉圭的AI与科技合作（2026-08-26）", "date": "2026-08-26", "source_url": "https://www.lanacion.com.py/politica/2026/08/26/taiwan-busca-ampliar-cooperacion-en-ia-y-tecnologia-con-paraguay/", "source_name": "La Nación", "summary": "台湾表示有意扩大与巴拉圭在AI和科技领域的合作，涉及亚松森数字园区、Chaco'i双边AI数据中心以及上巴拉那州台湾工业园区的智慧科技枢纽升级。这一计划建立在“伊瓜苏数字”主权AI数据中心基础上，强化了台湾作为巴拉圭关键科技合作伙伴的角色，背景是北京持续向亚松森施压要求其断绝与台湾关系。", "image_url": "https://www.lanacion.com.py/resizer/v2/OVP7NAKQQFHQBMWHFHIR6G3CXI.webp?auth=8e3b2b869ddc9dbd5ff8e67af183b8b3d4019f6f8d5dfca361fb17b2cae89602&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭在欧盟协议下于农业、林业和能源领域具有竞争优势（2026-08-28）", "date": "2026-08-28", "source_url": "https://www.lanacion.com.py/negocios/2026/08/28/acuerdo-con-ue-paraguay-corre-con-ventaja-en-el-sector-agricola-forestal-y-de-energias-afirman/", "source_name": "La Nación", "summary": "在巴拉圭工业联盟（UIP）与CAF举办的“欧盟–南共市出口之路”研讨会上，专家指出巴拉圭在农业、可再生能源、林业、塑料和轻制造业方面具有竞争优势。与会专家也警告，欧洲市场在卫生、环保、劳动、认证和可追溯性标准上要求严格，随着协议贸易章节生效，中小企业面临的国际化挑战最大。", "image_url": "https://www.lanacion.com.py/resizer/v2/SSJA4R2TT5G33PSN7QRKWMUZRU.jpg?auth=ada175af398b82c3ebb940da85126e3401d6d1376317fc932919e3bd83c2d0d7&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "五、行业专题：通讯、运营商、数字能源与AI", "tier": 1, "events": [{"title": "Dominion将在巴拉圭建设拉美首个地下数据中心（2026-08-28）", "date": "2026-08-28", "source_url": "https://diarioparaguayo.com/noticia/dominion-desarrolla-el-primer-data-center-subterraneo-de-america-latina-en-paraguay", "source_name": "Diario Paraguayo", "summary": "西班牙企业Dominion宣布将在巴拉圭建设拉美地区首个地下数据中心，利用当地充沛的清洁能源，并通过地下建设降低制冷成本。该项目被定位为“通过数据出口能源”的模式，充分利用巴拉圭100%可再生能源电网和地区最低电价，迎合AI算力需求的增长。", "image_url": "https://diarioparaguayo.com/uploads/news/news_1776308436_8018d4fd.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Dominion — 地下数据中心、AI/算力"}, {"title": "ANDE拒绝Atome绿色氢能协议，称“数字算不过来”（2026-08-26）", "date": "2026-08-26", "source_url": "https://www.lapoliticaonline.com/paraguay/empresas-py/la-ande-rechaza-el-acuerdo-con-la-empresa-atome-al-considerar-que-los-numeros-no-cierran-6508/", "source_name": "La Política Online", "summary": "国有电力公司ANDE拒绝了与英国Atome公司在Villeta建设绿色氢能厂的协议，理由是“数字算不过来”，且无法保证15年固定电价。此次反转发生在Atome为其2022年的145兆瓦PPA辩护并宣布研究300兆瓦光伏项目的数日之后，凸显电力市场改革前私营能源和氢能项目面临的监管不确定性。", "image_url": "https://www.lapoliticaonline.com/files/image/295/295149/6a73928159421_1200_630!.jpg?s=4983c526d57032cacf34a8eace4a9b42&d=1786653971", "is_gov_source": false, "is_authoritative": true, "client_tag": "Atome — 绿色氢能、145兆瓦PPA；能源改革"}, {"title": "电力市场开放推进：ANDE结束62年垄断（2026-08-26）", "date": "2026-08-26", "source_url": "https://elnacional.com.py/politica/paraguay-prepara-dejar-atras-62-anos-monopolio-electrico-n110605", "source_name": "El Nacional", "summary": "巴拉圭正在准备撤掉ANDE长达62年的电力垄断，政府正在推动设立能源部、独立监管机构，并依据第7599/2025号法律开放私营发电。私营发电商将可自用发电并出售剩余电力（包括回售给ANDE），电力需求年增超18%，超6,000兆瓦的私营项目排队等待明确规则。", "image_url": "https://statics.elnacional.com.py/2026/08/6a8175e44f123.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "数字能源 — 电力市场开放、私营发电"}], "impact_analysis": "", "user_notes": ""}, {"title": "六、主要客户动向", "tier": 1, "events": [{"title": "Tigo与Personal的5G部署时间表确定：2027年2月前实现商用（2026-08-28）", "date": "2026-08-28", "source_url": "https://dplnews.com/paraguay-conatel-adjudico-segunda-licitacion-5g-cuando-deberan-ofrecer-servicio-nuevas-licenciatarias/", "source_name": "DPL News", "summary": "Tigo（Telecel）和Personal（Núcleo）需在90天内提交详细工程方案，并在许可生效后180天内启用首个基站——也就是最迟2027年2月实现商用5G。每家运营商须在四年内部署至少100个基站，两年内为国家机构启用10个基站，双方承诺合计投资约8,000万美元、五年内建设约750个基站。这5年的许可期在拉美独一无二、异常短暂。", "image_url": "https://dplnews.com/wp-content/uploads/2021/01/conatel.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Millicom/Tigo + 阿根廷电信/Personal — 5G 2.3/3.7GHz部署"}, {"title": "Nubicom 5G：仍未实现商用，腐败疑云加剧（2026-08-28）", "date": "2026-08-28", "source_url": "https://nanduti.com.py/5g-nubicom-sigue-sin-aparecer-y-aumentan-las-sospechas-de-corrupcion", "source_name": "Nandutí", "summary": "Nubicom在首次5G拍卖中获3.5GHz频段200兆赫兹，但其180天限期于2026年4月已过，近一年来仍无可见的网络部署或商用启动，总审计署的调查仍在进行。Conatel一名官员近日称Nubicom已安装首个基站并在亚松森测试，但未公布商用时间；与之形成对比的是，Claro自2025年12月启动以来已运营约100个基站。", "image_url": null, "is_gov_source": false, "is_authoritative": false, "client_tag": "Nubicom — 5G 3.5GHz、未实现商用、遭调查"}], "impact_analysis": "", "user_notes": ""}, {"title": "七、对企业经营的综合影响分析", "tier": 2, "events": [], "impact_analysis": "🟡 汇率压力——瓜拉尼跌破6,000瓜拉尼关口：美元跌破6,000瓜拉尼（8月28日银行间5,922）是本周核心主题，进一步加剧对出口商和美元收入企业的挤压，同时提升进口商的购买力。Capex和Cispy现在要求央行干预，警告失业和竞争力下降——汇率敏感行业（电信内容成本、设备进口）须密切关注。\n\n🟢 增长与通胀基本面稳固：国际货币基金组织的第四条款磋商（增速4.4%）以及央行一致维持5.50%的利率，确认了宏观背景稳定，通胀正向目标靠拢（7月为1.6%）。公共债务超210亿美元（34%的GDP）和占GDP 3.5%的财政赤字仍是财政信誉的关注点。\n\n🔴 劳资与社会风险——医疗罢工升级：医生罢工进入第四天，86%的Acosta Ñu专家递交辞呈，并有无限期罢工的讨论，国会居中调停，Latorre称体系“陈旧”。面向公众的业务和医疗领域合同应为长时间中断做好准备；反侵占法的推进反映出土地纠纷上的并行收紧。\n\n🟢 结构性能源改革——具体步骤：新电力监管机构的供资模式（对ANDE、Petropar和私营部门征费）以及能源部之争，标志着结束62年垄断的实质进展。Dominion的地下数据中心和台湾扩大AI合作，凸显巴拉圭正在崛起为清洁能源AI目的地，但ANDE拒绝Atome也表明监管条件仍未明朗。\n\n🟡 客户与5G部署时间表：Tigo和Personal面临2027年2月的商用启动最后期限（四年内各100个基站），近期设备需求得以维持，而Nubicom的持续未部署和总审计署调查增加了执行不确定性。供应商应在四家5G许可方之间以及向私有网络和数据中心电力多元化布局。", "user_notes": ""}, {"title": "八、对中资企业的专项影响与建议", "tier": 2, "events": [], "impact_analysis": "🔴 高风险——外交约束未变：巴拉圭仍是台湾在南美的唯一盟友，北京的施压持续。台湾反而在深化其科技布局（AI合作、Chaco'i数据中心、台湾工业园区）。中资企业应预期继续被排除在公共5G和基础设施招标之外——可信供应商规则（TIA SCS9001认证）实际上将华为和中兴排除在外——并须在任何涉巴拉圭合作前进行严格的合规审查。\n\n🟡 中风险——仅可间接进入：中国仍是巴拉圭的主要商品供应国，中资企业可通过巴西、阿根廷或智利的子公司或贸易中介间接服务该市场。南共市–欧盟配额之争（乌拉圭拿走63%的大米份额）和日本的牛肉市场推进，是值得关注的区域渠道，但敏感领域的中资品牌直接交易仍受政治约束。\n\n🟢 机遇——能源与数字基础设施：电力市场开放（第7599/2025号法律、私营发电向ANDE售电）和18%的年需求增长，创造了电力设备、输电和电网现代化需求，中国供应商（变压器、特高压直流、光伏组件）可通过与非中国合作伙伴组建联合体的方式参与。Dominion的地下数据中心和6,000兆瓦的项目队列意味着具体的采购机会。\n\n🟢 机遇——借道第三方的设备：5G建设——Tigo和Personal的2027年2月启动最后期限以及Claro已启动的网络——需要无线设备、光纤和边缘基础设施。中国设备厂商虽被排除在公开拍卖之外，但可争取企业/私有网络、批发光纤，并与已在服务Claro、Tigo和Personal的拉美集成商合作。\n\n🟡 审慎——劳资与汇率风险：不断升级的医生罢工和持续的“去不稳定化”诉求，指向强劲增长表象下的劳资摩擦；瓜拉尼跌破6,000瓜拉尼（12个月升值超20%）侵蚀任何美元挂钩收入的人民币折算价值。有本地业务的中资企业应审查劳动合规、为医疗罢工做好安排，并主动对冲汇率风险。", "user_notes": ""}]}, "en": {"topic": "Paraguay Briefing", "time_span": "August 22 – August 29, 2026", "time_label": "Past Week", "sections": [{"title": "I. Macroeconomic Developments", "tier": 1, "events": [{"title": "Guaraní Breaks Below G. 6,000; Exporters Urge BCP Intervention (2026-08-28)", "date": "2026-08-28", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/negocios/2026/08/27/gremio-pide-medidas-urgentes-al-bcp-ante-caida-del-dolar/", "source_name": "La Nación", "summary": "The dollar broke below G. 6,000 for the first time since 2018, with the BCP reference rate closing at G. 5,929.69 on August 27 and G. 5,922.01 on August 28. The guaraní's appreciation — over 20% in 12 months — triggered urgent demands from the Exporters Chamber (Capex) and the Sustainable Industries Chamber (Cispy) for the BCP to intervene, warning of lost competitiveness, falling exports and job losses. The BCP has so far held a hands-off stance, attributing the slide to market fundamentals and carry-trade inflows.", "image_url": "https://www.lanacion.com.py/resizer/v2/7ED2737NQBBDHDXJHZS2U2AJWM.jpeg?auth=3481fb2d2211a73e7e257bd194f6681a07e03ad63fdf701025a72092847edb5d&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "IMF Concludes 2026 Article IV: 4.4% Growth, Inflation Converging to Target (2026-08-28)", "date": "2026-08-28", "source_url": "https://www.imf.org/es/news/articles/2026/08/28/pr26280-paraguay-imf-executive-board-concludes-2026-article-iv-consultation", "source_name": "IMF", "summary": "The IMF Executive Board concluded its 2026 Article IV consultation with Paraguay, projecting growth of 4.4% in 2026 (after 6.6% in 2025), with inflation converging to the 3.5% target and the fiscal deficit widening to 3.5% of GDP. The Fund highlighted the economy's resilience, the guaraní's sharp real appreciation, and net international reserves near USD 11 billion, while recommending continued fiscal discipline and exchange-rate flexibility.", "image_url": null, "is_gov_source": true, "is_authoritative": true}, {"title": "BCP Holds Policy Rate Unanimously at 5.50% (2026-08-27)", "date": "2026-08-27", "source_url": "https://www.ultimahora.com/tasa-de-politica-monetaria-se-mantiene-en-zona-neutral", "source_name": "Última Hora", "summary": "The BCP's Monetary Policy Committee voted unanimously to hold the benchmark rate at 5.50%, in a neutral zone, against a backdrop of international volatility, oil near USD 90 per barrel and persistent domestic currency appreciation. The next MPC meeting is set for September 21. The BCP is balancing falling inflation (July: 1.6% year-on-year) against exporters' calls for intervention to stem the guaraní's rise.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/6cf3edf/2147483647/strip/true/crop/2048x1152+0+108/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fe4%2Feb%2F3c73f94f42999cdec82060e353ec%2Fbanco-central-del-paraguay-foto-nueva.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Public Debt Tops USD 21 Billion (34% of GDP) as Fiscal Rigidity Mounts (2026-08-29)", "date": "2026-08-29", "source_url": "https://www.latribuna.com.py/negocios/economia/2026/08/29/creciente-rigidez-del-gasto-publico-amenaza-la-estabilidad-financiera/", "source_name": "La Tribuna", "summary": "Paraguay's public debt surpassed USD 21 billion, equivalent to about 34% of GDP, as the growing rigidity of public spending threatens financial stability. Analysts warn that rigid expenditures — salaries, pensions and mandatory transfers — are crowding out productive investment, while the IMF's Article IV flagged a fiscal deficit of 3.5% of GDP for 2026. The debate over fiscal anchors has intensified alongside proposals to raise the debt ceiling.", "image_url": "https://www.latribuna.com.py/resizer/v2/VCFGFFQEMREJZH5CR7MHF4OQMU.jpg?smart=true&auth=d130f5e47885beb3ddb8fff456c8813a28af16f187c2f9728c09def349553859&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "II. Political & Policy Developments", "tier": 1, "events": [{"title": "New Electricity Regulator to Be Funded by Rates on ANDE, Petropar and Private Sector (2026-08-25)", "date": "2026-08-25", "source_url": "https://www.ultimahora.com/petropar-ande-y-sector-privado-pagaran-tasas-a-nuevo-ente-regulador", "source_name": "Última Hora", "summary": "The proposed independent electricity regulator (Ente Regulador Eléctrico) would be financed through regulatory rates paid mandatorily by state utilities ANDE and Petropar plus the private sector, capped at 2% of the remunerated service value in electricity. The measure is part of the Peña administration's push to separate policy, regulation and operation of the electricity sector, ending ANDE's six-decade concentration of these functions.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/8e470fa/2147483647/strip/true/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fb9%2Fba%2F4e229c94403691132aedd775578c%2Fpetropar.webp", "is_gov_source": false, "is_authoritative": true}, {"title": "Senate Half-Sanctions Bill Criminalizing Land Invasion with Up to 10 Years' Prison (2026-08-22)", "date": "2026-08-22", "source_url": "https://www.abc.com.py/tag/ley-anti-invasion/", "source_name": "ABC Color", "summary": "The Senate gave half-sanction to a bill that criminalizes land invasion with prison sentences of up to 10 years, returning it to the Chamber of Deputies. The Honor Colorado caucus signaled it would seek to schedule the bill for the August 29 session, claiming sufficient votes for final sanction. The measure comes days after the Canindeyú 'Operation Redemption' deaths, which stemmed from a territorial dispute over 11,000 hectares claimed by indigenous families, underscoring how land conflict has moved to the top of the legislative agenda.", "image_url": "https://www.abc.com.py/pf/resources/images/OG-Image-ABC.png?d=2590", "is_gov_source": false, "is_authoritative": true}, {"title": "Energy Ministry Debate Deepens: 'Ministry Yes, ANDE No' (2026-08-26)", "date": "2026-08-26", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/politica/2026/08/26/mateo-balmelli-fustiga-al-sindicato-de-la-ande-quieren-disenar-la-politica-energetica/", "source_name": "La Nación", "summary": "The debate over creating a Ministry of Energy, Mines and Hydrocarbons sharpened as political analyst Carlos Mateo Balmelli criticized the ANDE union for opposing the ministry, arguing that the state utility's monopoly model has ended and that new generation sources are needed. Meanwhile, energy expert Fabián Cáceres warned that creating new ministries could divert attention from the energy crisis, urging ANDE to be strengthened and solar tenders (120–140 MW in the Chaco) to be launched urgently.", "image_url": "https://www.lanacion.com.py/resizer/v2/QUOFBULXCBBM3GTJBNSZZAYGLE.jpg?auth=575e8480f65310310aca76adeaba58481672462c7c9b4a918bbf328ebf07e0cc&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "III. Social & Security Landscape", "tier": 1, "events": [{"title": "Doctors' Strike Escalates: 86% of Acosta Ñu Pediatric Specialists Resign (2026-08-28)", "date": "2026-08-28", "source_url": "https://www.lanacion.com.py/pais/2026/08/28/huelga-de-medicos-el-86-del-plantel-de-especialistas-del-hospital-acosta-nu-renuncio/", "source_name": "La Nación", "summary": "The national doctors' strike (SINAMED) entered its fourth day without agreement, with 141 of 164 specialists (86%) at the Acosta Ñu pediatric hospital signing resignations. Pediatric surgeons across the public network announced they would resign en masse (90% willing), and some 200 anesthesiologists could follow. Unions warn the strike — over salary freezes since 2012, double pay for holidays and regularization of contracts — could become indefinite; the government has opened dialogue but calls the 76% pay rise impossible to finance.", "image_url": "https://www.lanacion.com.py/resizer/v2/7CFQE7PIDVDNPBNVKGB6QN4A2E.jpg?auth=dbcc011d62024da95b1e21b8d4981f88c135fd5cd38bae1e533f1d3dc014d9c3&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Congress Mediates Health Crisis; Latorre Calls System Obsolete (2026-08-26)", "date": "2026-08-26", "source_url": "https://www.abc.com.py/nacionales/2026/08/26/huelga-de-medicos-latorre-admite-que-el-sistema-de-salud-es-obsoleto/", "source_name": "ABC Color", "summary": "The Chamber of Deputies, led by Raúl Latorre, assumed an active mediation role in the doctors' strike, with Latorre acknowledging that Paraguay's health system is obsolete and proposing a medical-career law and comprehensive reform. President Santiago Peña expressed willingness to dialogue, while Economy Minister Óscar Lovera called the 76% wage adjustment impossible and proposed a sanitary career with raises tied to training. Wage demands may be channeled into the 2027 budget via an executive addendum.", "image_url": "https://www.abc.com.py/resizer/v2/WYDVZOC7HRGDJCZMYLF5A63XSU.jpg?auth=f33e37dc1efccce4b89fec6f38737009fb3e5b1144fff051212ee86370aa4095&width=770&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Border Security: Second Suspect Held in Ciudad del Este Millionaire Robbery (2026-08-27)", "date": "2026-08-27", "source_url": "https://www.latribuna.com.py/sucesos/policiales/2026/08/27/detienen-a-segundo-implicado-en-asalto-millonario-en-ciudad-del-este/", "source_name": "La Tribuna", "summary": "Police arrested a second suspect in the August 18 millionaire robbery of the Brisas del Paraná depot in Ciudad del Este, seizing a 9mm pistol, cocaine and G. 40 million. The case, in which authorities identified seven other alleged material authors, illustrates persistent organized-crime pressure in Alto Paraná, where Brazil and Paraguay have intensified a joint siege against PCC cells; the US State Department recently advised increased caution in Alto Paraná and other border departments.", "image_url": "https://www.latribuna.com.py/resizer/v2/MD3ZEGPH6JET3IA3XGCWQZBJNM.jpg?smart=true&auth=49e1ee8e747a2af556f0812d6a433702071f202bc561e4955bfa773a33ca416f&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "IV. International Relations & Diplomacy", "tier": 1, "events": [{"title": "Mercosur–EU Quota Deadlock Deepens: Uruguay Took 63% of Rice Quota (2026-08-23)", "date": "2026-08-23", "source_url": "https://www.abc.com.py/politica/2026/08/18/mercosur-ue-aun-no-hay-acuerdo-sobre-las-cuotas-de-exportacion/", "source_name": "ABC Color", "summary": "Mercosur members remain deadlocked on distributing EU export quotas, with Paraguay insisting on an equal 25% share per country while Brazil and Argentina favor criteria based on export history and economic weight. Under the transitional first-come, first-served mechanism, Uruguay already captured 63% of the rice quota, a setback Paraguay cites as proof of inequity. President Peña summarized the position: 'We are not asking for privileges; we are asking for equity,' with the issue set for review in October 2026.", "image_url": "https://www.abc.com.py/resizer/v2/33TMGOVGJFHFVKQ55HLNJH25X4.jpg?auth=e33e2eea7a24c6c156281d14cbe4570a0308c42d1bfdd86f03f6bb042c1173c2&width=770&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Taiwan Seeks to Expand AI and Technology Cooperation with Paraguay (2026-08-26)", "date": "2026-08-26", "source_url": "https://www.lanacion.com.py/politica/2026/08/26/taiwan-busca-ampliar-cooperacion-en-ia-y-tecnologia-con-paraguay/", "source_name": "La Nación", "summary": "Taiwan expressed interest in expanding AI and technology cooperation with Paraguay, citing the Digital District in Asunción, the binational AI Data Center in Chaco'i and the revitalization of the Taiwan Industrial Park in Alto Paraná as a smart technology hub. The initiative builds on the 'Yguazú Digital' sovereign AI data center and reinforces Taiwan's role as Paraguay's key technology partner amid Beijing's sustained pressure on Asunción to sever ties.", "image_url": "https://www.lanacion.com.py/resizer/v2/OVP7NAKQQFHQBMWHFHIR6G3CXI.webp?auth=8e3b2b869ddc9dbd5ff8e67af183b8b3d4019f6f8d5dfca361fb17b2cae89602&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay Holds Competitive Advantage in Agriculture, Forestry and Energy Under EU Deal (2026-08-28)", "date": "2026-08-28", "source_url": "https://www.lanacion.com.py/negocios/2026/08/28/acuerdo-con-ue-paraguay-corre-con-ventaja-en-el-sector-agricola-forestal-y-de-energias-afirman/", "source_name": "La Nación", "summary": "At the UIP and CAF 'Ruta Exportadora UE–Mercosur' seminar, experts highlighted Paraguay's competitive advantages under the EU–Mercosur agreement in agriculture, renewable energy, forestry, plastics and light manufacturing. Speakers also warned that the European market is demanding on sanitary, environmental, labor, certification and traceability standards, and that SMEs face the greatest challenges to internationalize as the deal's commercial chapter enters into force.", "image_url": "https://www.lanacion.com.py/resizer/v2/SSJA4R2TT5G33PSN7QRKWMUZRU.jpg?auth=ada175af398b82c3ebb940da85126e3401d6d1376317fc932919e3bd83c2d0d7&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "V. Industry Focus: Telecom, Digital Energy & AI", "tier": 1, "events": [{"title": "Dominion to Develop Latin America's First Underground Data Center in Paraguay (2026-08-28)", "date": "2026-08-28", "source_url": "https://diarioparaguayo.com/noticia/dominion-desarrolla-el-primer-data-center-subterraneo-de-america-latina-en-paraguay", "source_name": "Diario Paraguayo", "summary": "Spanish firm Dominion announced it will develop Latin America's first underground data center in Paraguay, leveraging the country's abundant clean energy and reducing cooling costs through subterranean construction. The project is framed as a model of exporting energy through data, capitalizing on Paraguay's 100% renewable electricity matrix and some of the region's lowest tariffs as AI-driven compute demand grows.", "image_url": "https://diarioparaguayo.com/uploads/news/news_1776308436_8018d4fd.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Dominion — underground data center, AI/compute"}, {"title": "ANDE Rejects Atome Green-Hydrogen Deal, Saying the Numbers Don't Close (2026-08-26)", "date": "2026-08-26", "source_url": "https://www.lapoliticaonline.com/paraguay/empresas-py/la-ande-rechaza-el-acuerdo-con-la-empresa-atome-al-considerar-que-los-numeros-no-cierran-6508/", "source_name": "La Política Online", "summary": "State utility ANDE rejected a proposed agreement with British firm Atome for a green-hydrogen plant in Villeta, arguing the numbers don't close and that it cannot guarantee a fixed tariff for 15 years. The reversal comes days after Atome defended its 2022 PPA for 145 MW and announced a 300 MWp solar study, illustrating the regulatory uncertainty facing private energy and hydrogen projects ahead of the electricity-market reform.", "image_url": "https://www.lapoliticaonline.com/files/image/295/295149/6a73928159421_1200_630!.jpg?s=4983c526d57032cacf34a8eace4a9b42&d=1786653971", "is_gov_source": false, "is_authoritative": true, "client_tag": "Atome — green hydrogen, 145 MW PPA; energy reform"}, {"title": "Electricity Market Opening Advances: End of the 62-Year ANDE Monopoly (2026-08-26)", "date": "2026-08-26", "source_url": "https://elnacional.com.py/politica/paraguay-prepara-dejar-atras-62-anos-monopolio-electrico-n110605", "source_name": "El Nacional", "summary": "Paraguay is preparing to leave behind 62 years of ANDE's electricity monopoly, with the government advancing a Ministry of Energy, an independent regulator and private generation under Law No. 7599/2025. Private generators would produce for self-consumption and sell surpluses — including back to ANDE — as demand grows more than 18% annually and over 6,000 MW of private projects queue for clear rules.", "image_url": "https://statics.elnacional.com.py/2026/08/6a8175e44f123.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Digital energy — electricity market opening, private generation"}], "impact_analysis": "", "user_notes": ""}, {"title": "VI. Key Client Developments", "tier": 1, "events": [{"title": "Tigo & Personal 5G Rollout Timelines Set: Commercial Launch by February 2027 (2026-08-28)", "date": "2026-08-28", "source_url": "https://dplnews.com/paraguay-conatel-adjudico-segunda-licitacion-5g-cuando-deberan-ofrecer-servicio-nuevas-licenciatarias/", "source_name": "DPL News", "summary": "Tigo (Telecel) and Personal (Núcleo) must present detailed engineering in 90 days and activate their first base stations within 180 days of license entry into force — commercial 5G launch by February 2027 — under the second 5G auction. Each must deploy at least 100 base stations in four years and 10 for state agencies in two years, with a joint investment commitment of about USD 80 million and 750 base stations over five years. The 5-year license term is unusually short and unique in Latin America.", "image_url": "https://dplnews.com/wp-content/uploads/2021/01/conatel.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Millicom/Tigo + Telecom Argentina/Personal — 5G 2.3/3.7 GHz deployment"}, {"title": "Nubicom 5G: Still No Commercial Launch as Corruption Suspicions Grow (2026-08-28)", "date": "2026-08-28", "source_url": "https://nanduti.com.py/5g-nubicom-sigue-sin-aparecer-y-aumentan-las-sospechas-de-corrupcion", "source_name": "Nandutí", "summary": "Nubicom, winner of 200 MHz in the 3.5 GHz band in the first 5G auction, still has no visible network deployment or commercial launch nearly a year after its 180-day deadline lapsed in April 2026, with the Comptroller General's investigation ongoing. A Conatel official recently said Nubicom has installed its first base station and is testing in Asunción, but no commercial service date has been announced, contrasting with Claro, which already operates about 100 base stations since its December 2025 launch.", "image_url": null, "is_gov_source": false, "is_authoritative": false, "client_tag": "Nubicom — 5G 3.5 GHz, no commercial launch, under investigation"}], "impact_analysis": "", "user_notes": ""}, {"title": "VII. Integrated Impact Analysis for Business Operations", "tier": 2, "events": [], "impact_analysis": "🟡 FX Pressure — Guaraní Breaks Below G. 6,000: The dollar's slide below G. 6,000 (G. 5,922 interbank on Aug 28) is the week's defining theme, intensifying the squeeze on exporters and dollar-revenue businesses while boosting importers' purchasing power. Capex and Cispy now demand BCP intervention, warning of job losses and lost competitiveness — a risk that FX-sensitive sectors (telecom content costs, equipment imports) must monitor closely.\n\n🟢 Growth & Inflation Fundamentals Firm: The IMF's Article IV (4.4% growth) and the BCP's unanimous hold at 5.50% confirm a stable macro backdrop with inflation converging to target (1.6% in July). Public debt topping USD 21 billion (34% of GDP) and a 3.5%-of-GDP fiscal deficit remain the watch items on fiscal credibility.\n\n🔴 Labor & Social Risk — Health Strike Escalates: The doctors' strike entered a fourth day with 86% of Acosta Ñu specialists resigning and talk of an indefinite strike, while Congress mediates and Latorre calls the system obsolete. Public-facing operations and health-sector contracts should plan for extended disruption; the anti-invasion law's advance signals a parallel hardening on land disputes.\n\n🟢 Structural Energy Reform — Concrete Steps: The new electricity regulator's funding model (rates on ANDE, Petropar and the private sector) and the Ministry of Energy debate mark tangible progress toward ending the 62-year monopoly. Dominion's underground data center and Taiwan's expanded AI cooperation underscore Paraguay's emergence as a clean-energy AI destination, though ANDE's rejection of Atome shows regulatory terms remain unsettled.\n\n🟡 Client & 5G Deployment Timeline: Tigo and Personal face a February 2027 commercial-launch deadline (100 base stations each in four years), sustaining near-term equipment demand, while Nubicom's continued non-deployment and Comptroller investigation add execution uncertainty. Suppliers should diversify across the four 5G licensees and into private networks and data-center power.", "user_notes": ""}, {"title": "VIII. Targeted Recommendations for Chinese Enterprises", "tier": 2, "events": [], "impact_analysis": "🔴 High Risk — Diplomatic Constraints Unchanged: Paraguay remains Taiwan's sole South American ally, and Beijing's pressure continues. Taiwan is instead deepening its technology footprint (AI cooperation, Chaco'i data center, Taiwan Industrial Park). Chinese enterprises should expect continued exclusion from public 5G and infrastructure tenders — trusted-vendor rules (TIA SCS9001 certification) effectively bar Huawei and ZTE — and must run rigorous compliance reviews before any Paraguay-linked engagement.\n\n🟡 Medium Risk — Indirect Access Only: China remains a major goods supplier, and Chinese firms can serve Paraguay indirectly through Brazilian, Argentine or Chilean subsidiaries or trading intermediaries. The Mercosur–EU quota fight (Uruguay's 63% rice share) and Japan's beef-market push are regional channels to monitor, but direct Chinese-branded deals in sensitive sectors stay politically constrained.\n\n🟢 Opportunity — Energy & Digital Infrastructure: The electricity-market opening (Law 7599/2025, private generation selling surpluses to ANDE) and 18%-annual demand growth create demand for power equipment, transmission and grid modernization where Chinese suppliers (transformers, HVDC, solar modules) can participate through consortiums with non-Chinese partners. Dominion's underground data center and the 6,000 MW project queue signal concrete procurement opportunities.\n\n🟢 Opportunity — Equipment via Third Parties: The 5G buildout — Tigo and Personal's February 2027 launch deadline plus Claro's live network — requires radios, fiber and edge infrastructure. Chinese vendors, though barred from public auctions, can pursue enterprise/private networks, wholesale fiber and partnerships with Latin American integrators already serving Claro, Tigo and Personal.\n\n🟡 Caution — Labor & FX Risk: The escalating doctors' strike and persistent precarización point to labor friction beneath strong headline growth; the guaraní's break below G. 6,000 (over 20% appreciation in 12 months) erodes the value of any USD-linked revenue in renminbi terms. Chinese firms with local operations should review labor compliance, plan around the health-sector strike and hedge FX exposure proactively.", "user_notes": ""}]}};

function renderFXDailyTable(d,unit){

function renderAll(){

  var sections=d.sections||[],tier1=[],tier2=[];

function renderSection(sec,idx){
  var events=sec.events||[],isT2=sec.tier===2;
  var g=GRAD[idx%8],icon=ICONS[idx%8];
  var body='';
  if(isT2||events.length===0){
    if(sec.impact_analysis)body='<div class="analysis-body">'+fmt(sec.impact_analysis)+'</div>';
    else if(!isT2)body='<div style="padding:4px 22px 16px;color:#94A3B8;font-size:13px;">'+L('暂无此时间段内的事件','No events in this period')+'</div>';
  }else{
    var cards='';
    for(var i=0;i<events.length;i++)cards+=renderCard(events[i],g[0],g[1],icon);

  }
  var badge=events.length>0?'<span class="badge">'+events.length+L(' 条事件',' events')+'</span>':'';
  return '<div class="section s'+(idx%8)+(isT2?' tier2':'')+'" id="sec-'+idx+'"><div class="section-header"><h2>'+esc(sec.title||'')+'</h2>'+badge+'</div>'+(sec.description?'<div class="section-desc">'+esc(sec.description)+'</div>':'')+body+'</div>';

function renderCard(evt,phFrom,phTo,icon){
  var img=evt.image_url,hasImg=img&&img.indexOf('http')===0;
  var ih='';
  if(hasImg)ih='<img src="'+esc(img)+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">';
  ih+='<div class="img-placeholder" style="background:linear-gradient(135deg,'+phFrom+','+phTo+');'+(hasImg?'display:none':'display:flex')+';font-size:32px;color:#fff;">'+icon+'</div>';

  var tags='';
  if(evt.date)tags+='<span class="event-tag date">'+esc(evt.date)+'</span>';
  if(evt.client_tag)tags+='<span class="event-tag client">'+esc(evt.client_tag)+'</span>';
  if(evt.is_gov_source)tags+='<span class="event-tag gov">'+L('政府官网','Government')+'</span>';
  else if(evt.is_authoritative)tags+='<span class="event-tag auth">'+L('权威媒体','Authoritative')+'</span>';
  if(evt.source_name)tags+='<span class="event-tag source">'+esc(evt.source_name)+'</span>';

  var link=evt.source_url?'<a class="event-link" href="'+esc(evt.source_url)+'" target="_blank" rel="noopener">'+L('查看原文 →','Read more →')+'</a>':'';
  var preview=evt.summary||'';if(!preview&&evt.title)preview=evt.title;
  return '<div class="event-card"><div class="event-img">'+ih+'</div><div class="event-body"><div class="event-meta">'+tags+'</div><div class="event-preview">'+esc(preview)+'</div>'+link+'</div></div>';
}

function fmt(text){
  var h=esc(text);
  h=h.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
  h=h.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
  h=h.replace(/\n/g,'<br>');
  return h;
}

function scrollToSec(idx){
  var pills=document.querySelectorAll('.stat-pill');
  for(var i=0;i<pills.length;i++)pills[i].style.outline='';
  if(idx===null||idx===undefined){window.scrollTo({top:0,behavior:'smooth'});return;}
  var el=document.getElementById('sec-'+idx);
  if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.style.boxShadow='0 0 0 3px #3B82F6';
  setTimeout(function(){el.style.boxShadow='';},1500);
}

  fetch('/api/briefing/briefing_en.json').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    DATA['en']=data;briefingData=data;renderAll();
    fetch('/api/briefing/briefing.json').then(function(r){if(r.ok)return r.json();}).then(function(zh){if(zh)DATA['zh']=zh;}).catch(function(){});
  }).catch(function(){alert(L('刷新失败','Refresh failed'));}).finally(function(){
    btn.disabled=false;btn.textContent=L('刷新简报','Refresh');
  });
}
function openMacroModal(){
  var h='<div class="update-modal-overlay" id="macroModal" onclick="closeUpdateModal(\'macroModal\')"><div class="update-modal" onclick="event.stopPropagation()"><h3>'+L('更新宏观数据','Update Macro Data')+'</h3>';
  h+='<p style="font-size:11px;color:#94A3B8;margin-bottom:12px">'+L('下载最新 BCP Excel 后填入文件名','Fill in latest BCP Excel filenames')+'</p>';
  h+='<input type="text" id="cpiFileName" placeholder="'+L('CPI文件，如 AE_IPC-26.6.xlsx','CPI file, e.g. AE_IPC-26.6.xlsx')+'" style="width:100%;font-size:12px;padding:8px 10px;border:1px solid #CBD5E1;border-radius:6px;margin-bottom:8px">';
  h+='<input type="text" id="rinFileName" placeholder="'+L('RIN文件，如 reservas...xlsx','RIN file, e.g. reservas...xlsx')+'" style="width:100%;font-size:12px;padding:8px 10px;border:1px solid #CBD5E1;border-radius:6px;margin-bottom:12px">';
  h+='<div class="btn-row"><button class="btn-secondary" onclick="closeUpdateModal(\'macroModal\')">'+L('取消','Cancel')+'</button><button class="btn-primary" onclick="refreshMacroData()">'+L('更新','Update')+'</button></div>';
  h+='<div id="genStatus" style="margin-top:10px;font-size:12px;color:#64748B;display:none"></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
}
function refreshMacroData(){
  var cpiFile=document.getElementById('cpiFileName').value.trim();
  var rinFile=document.getElementById('rinFileName').value.trim();
  if(!cpiFile&&!rinFile){alert(L('请至少输入一个文件名','Please enter at least one filename.'));return;}
  var st=document.getElementById('genStatus');
  st.style.display='block';st.innerHTML='<span class="loading-spinner"></span>'+L('正在读取宏观数据文件…','Reading macro data files…');
  fetch('/api/update-macro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cpi_file:cpiFile,rin_file:rinFile})}).then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    var msgs=[];
    if(data.cpi&&data.cpi.length){MACRO_CPI.line=data.cpi;msgs.push(L('CPI已更新('+data.cpi.length+'个月)','CPI updated ('+data.cpi.length+' mo)'));}
    if(data.cpi_error)msgs.push(L('CPI错误: ','CPI error: ')+data.cpi_error);
    if(data.rin&&data.rin.length){MACRO_RIN.line=data.rin;msgs.push(L('RIN已更新('+data.rin.length+'个月)','RIN updated ('+data.rin.length+' mo)'));}
    if(data.rin_error)msgs.push(L('RIN错误: ','RIN error: ')+data.rin_error);
    if(msgs.length){renderAll();st.innerHTML='<span style="color:#10B981">'+msgs.join('; ')+'</span>';}
    else st.innerHTML='<span style="color:#EF4444">'+L('更新失败','Update failed')+'</span>';
  }).catch(function(){st.innerHTML='<span style="color:#EF4444">'+L('更新失败，请确保 Flask 服务器已启动','Failed. Make sure Flask server is running.')+'</span>';});
}
function closeUpdateModal(id){
  var m=document.getElementById(id||'updateModal');if(m)m.remove();
  var h=document.getElementById('histModal');if(h&&id!=='histModal')h.remove();
}
document.addEventListener('DOMContentLoaded',function(){
  if(window.IS_STANDALONE)document.getElementById('standaloneBanner').style.display='block';
  if(MACRO_FX.monthly&&!MACRO_FX.line)MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
  fetch('/api/briefing/briefing_en.json').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    DATA['en']=data;briefingData=data;currentLang='en';renderAll();updateLangBtn();
    fetch('/api/briefing/briefing.json').then(function(r){if(r.ok)return r.json();}).then(function(zh){if(zh)DATA['zh']=zh;}).catch(function(){});
    if(!window.IS_STANDALONE)fetchLiveFX();
  }).catch(function(){
    briefingData=DATA['en'];currentLang='en';renderAll();updateLangBtn();
  });
});
function fetchLiveFX(){
  fetch('/api/macro/fx').then(function(r){if(!r.ok)return;return r.json();}).then(function(d){
    if(!d||!d.rate)return;
    var arr=MACRO_FX.monthly||MACRO_FX.line||[];
    arr[arr.length-1]=d.rate;
    window.MACRO_FX_DATE=(d.date||'').replace(/-/g,'.');
    MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
    renderAll();
  }).catch(function(){});
}
</script>
</body>
