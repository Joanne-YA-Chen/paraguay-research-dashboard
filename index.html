window.EMBEDDED_BRIEFINGS = {"zh": {"topic": "巴拉圭简报", "time_span": "2026年10月19日 — 2026年10月26日", "time_label": "最近一周", "tiers": [{"name": "Part I: Key News & Developments", "description": "Macro economy, politics, social security, international relations, industry and key client movements in Paraguay"}, {"name": "Part II: Analysis & Recommendations", "description": "Enterprise impact assessment and China-specific strategic recommendations"}], "sections": [{"title": "一、宏观经济动态", "tier": 1, "events": [{"title": "巴拉圭央行将政策利率维持在5.50%，通胀保持在1.7%，2026年增长预测上调至5.0%（2026-10-23）", "date": "2026-10-23", "source_url": "https://www.hoy.com.py/nacionales/2026/10/24/inflacion-controlada-bcp-mantiene-tasa-de-politica-monetaria", "source_name": "Diario HOY / BCP", "summary": "巴拉圭央行货币政策委员会于10月23日一致投票决定将政策利率维持在5.50%，理由是9月年通胀率为1.7%（核心通胀率1.5%，月度通胀率0.1%），以及按月度经济活动指数衡量的8月经济活动同比增长6.7%。巴拉圭央行将2026年国内生产总值增长预测从4.5%上调至5.0%，并将2026年底通胀预测从3.3%下调至3.0%，核心通胀预测从2.8%下调至2.2%。通胀预期仍锚定在3.5%，即目标区间的中心。委员会指出外部风险来自中东地缘政治紧张局势、高油价和美国利率上升的前景。下次政策会议定于11月20日召开。", "image_url": "https://www.lanacion.com.py/resizer/v2/LAI3FQURIJADFFTOVHL5M3W5VI.jpg?auth=4f30086262b51152251f00be9c2c3dca7a3ca47952f8ea7eb09d1b127bf2da92&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭央行10月调查维持2026年通胀率为3.0%，并将年末汇率预测下调至5,905瓜拉尼/美元（2026-10-19）", "date": "2026-10-19", "source_url": "https://www.lanacion.com.py/negocios/2026/10/19/mercado-financiero-mantiene-prevision-de-inflacion-en-3-y-un-dolar-a-g-5905-para-fin-de-ano/", "source_name": "La Nación / BCP", "summary": "巴拉圭央行的10月份经济变量预期调查（数据收集截至10月9日）将2026年底通胀率中位数维持在3.0%，2027年及12个月期通胀率中位数维持在3.5%。受访者预计10月月度通胀率为0.2%，11月为0.3%；2026年国内生产总值增长4.5%，2027年增长4.0%；政策利率在2026年底前维持5.50%，随后在2027年底降至5.25%。汇率中位数被大幅下调，10月为5,815瓜拉尼，11月为5,850瓜拉尼，2026年底为5,905瓜拉尼，2027年底为6,185瓜拉尼，而9月调查中2026年底为6,100瓜拉尼，反映了瓜拉尼的持续升值。", "image_url": "https://www.lanacion.com.py/resizer/v2/XFS46ES2PVCL5PUAQNBLN2ROOU.jpg?auth=8e3732ac4ca06ae27c8c4736ca5cedd396376adb3f397e7582cb24743c90c647&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "截至9月财政赤字达到国内生产总值的2.0%，年化3.0%，因收入仅增长1.6%（2026-10-20）", "date": "2026-10-20", "source_url": "https://www.mef.gov.py/sites/default/files/2026-10/Pres%20SITUFIN%20Sept-26_vf.pdf", "source_name": "Ministry of Economy and Finance (MEF)", "summary": "9月份公共财政报告显示，1-9月中央政府赤字为7.82万亿瓜拉尼（12.578亿美元），相当于GDP的2.0%，而2025年同期为0.9%。按年化口径，缺口达到GDP的3.0%左右，接近20亿美元，财政部预计全年为3.2%，而原定目标为1.5%。收入仅增长1.6%，贸易相关税收下降11%，伊泰普水电站特许权使用费和补偿下降25.9%，均受到瓜拉尼截至9月升值11.9%的冲击。工资、养老金和偿债支出占公共融资的近70%，财政养老金体系的赤字超过其年度预算的43%。", "image_url": "https://www.latribuna.com.py/resizer/v2/4FRYCYCLRZD6ZAJU5BDX7NBOGE.png?smart=true&auth=2b202d8328612e0325b868d993e8f1f30ba2047f700814e8c83cc6cfff6d211c&width=1200&height=630", "is_gov_source": true, "is_authoritative": true}, {"title": "瓜拉尼本周收于1美元兑5,776瓜拉尼附近，此前触及多年低点，挤压出口商和财政收入（2026-10-23）", "date": "2026-10-23", "source_url": "https://www.lanacion.com.py/negocios/2026/10/23/el-dolar-vive-una-jornada-con-fluctuaciones-y-cierra-a-la-baja/", "source_name": "La Nación / BCP", "summary": "巴拉圭央行的加权平均参考汇率在10月23日为1美元兑5,764.73瓜拉尼，13:00报价为5,776.68瓜拉尼，此前10月22日为5,801.08瓜拉尼，10月13日曾触及约5,694瓜拉尼的多年低点。截至9月，瓜拉尼年内已升值11.9%，为地区内最强表现之一，央行未在即期市场进行干预。出口商警告称，利润率正受到挤压，美元收入兑换成瓜拉尼后已不足以覆盖当地成本，同时财政部因贸易税和伊泰普特许权使用费而损失瓜拉尼收入。10月调查仍预计2026年底汇率为5,905瓜拉尼，意味着相对于当前水平仅会出现温和回调。", "image_url": "https://www.lanacion.com.py/resizer/v2/JZDK55VSOVEYBMS6WW6YFHGTXQ.jpg?auth=06912091bd769eb2f95c7a71b0e2a0a93b59ec77c40472049a6bf40f243f0927&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "9月出口增长25.4%，达到18.34亿美元，但当月贸易逆差扩大至1.182亿美元；1-9月顺差达到7.12亿美元（2026-10-20）", "date": "2026-10-20", "source_url": "https://www.bcp.gov.py/en/web/institucional/w/reporte-de-comercio-exterior-septiembre-2026/-/categories/111282", "source_name": "Central Bank of Paraguay (BCP)", "summary": "巴拉圭9月出口18.341亿美元，同比增长25.4%，其中初级产品增长20.9%，农工制成品增长23.4%，工业制成品增长41.6%。进口达到19.522亿美元，增长23.5%，受消费品（+20.9%）、中间产品（+41.4%）和资本货物（+11.7%）推动，当月逆差为1.1816亿美元，略高于上年同期的1.1773亿美元缺口。1-9月，出口总额159.726亿美元（+25.7%），进口总额152.606亿美元（+15%），累计顺差7.12亿美元，而2025年为5.555亿美元逆差。大豆及其制品占出口的41%，增长45.1%，达到31.072亿美元。", "image_url": "https://marketdata.com.py/wp-content/uploads/2026/10/portada_web_MD-03.jpg-45.jpeg", "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "二、政治与政策变化", "tier": 1, "events": [{"title": "经济与财政部向国会两院委员会提交了总额为166.3万亿瓜拉尼的2027年预算，赤字率为3.9%，新增债务21亿美元（2026年10月22日）", "date": "2026-10-22", "source_url": "https://www.lanacion.com.py/politica/2026/10/22/pgn-2027-titular-del-mef-expone-sus-prioridades-ante-la-bicameral/", "source_name": "La Nación", "summary": "经济部长奥斯卡·洛韦拉于10月22日向两院预算委员会提交了2027年预算优先事项。该草案总额为166.32万亿瓜拉尼（约合257.5亿美元），比2026年批准预算高出11.2%，并预计在例外突破1.5%财政责任上限的情况下，财政赤字占GDP的3.9%。新增借款约为21亿美元，包括再融资在内的总融资需求接近28亿美元。卫生部门获得支出增量的62%（超过12亿美元，其中78%用于清偿累积欠款），养老金增长20%，增编还包括教师加薪5%、金额为4700万美元。该法案仍停留在委员会，两院均未进行全体投票。", "image_url": "https://www.lanacion.com.py/resizer/v2/2XZDWLEGBVGA7GWCMCAI35BKGU.jpeg?auth=5fabc857fe077db9184c2c448c0d5357385cffce42fae5e397cea41ea561e3f9&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "培尼亚捍卫巴拉圭央行独立性，并承诺在最后22个月与反对派市长合作（2026-10-20）", "date": "2026-10-20", "source_url": "https://www.lapoliticaonline.com/paraguay/politica-py/pena-insiste-en-la-autonomia-del-bcp-y-promete-no-relegar-a-los-intendentes-opositores-2444/", "source_name": "La Política Online", "summary": "在10月20日举行的部长会议上，圣地亚哥·培尼亚总统在国会就货币和汇率政策施压的背景下，捍卫了中央银行的自主权，并承诺在剩余22个月任期内不会将反对派市长排除在外。他设定目标，要在投资和公共管理方面“迈出坚定步伐”，同时承认执政党红党内部在2027年预算和2028年接班问题上存在紧张关系。这一表态对投资者意义重大，因为它表明巴拉圭央行将保持连续性，并愿意在地方和全国选举周期到来前，让其他政党的市长继续留在公共投资管道中。", "image_url": "https://www.lapoliticaonline.com/files/image/303/303369/6ad7cb1fd1739_1200_630!.jpg?s=175654059d314a5864d128791c2266b9&d=1792465200", "is_gov_source": false, "is_authoritative": true}, {"title": "培尼亚阐述太阳能和小型模块化核能计划，将能源定位为下一投资周期的锚点（2026-10-22）", "date": "2026-10-22", "source_url": "https://www.lanacion.com.py/politica/2026/10/22/pena-proyecta-energia-solar-y-nuclear-para-asegurar-el-futuro-energetico-de-paraguay/", "source_name": "La Nación", "summary": "培尼亚总统表示，其政府将发展太阳能发电和小型模块化反应堆，以保障长期电力供应，并证实一家美国公司正在勘探铀矿。该计划被定位为伊泰普水电的补充，并面向数据中心和工业需求，此前已有克鲁索—阿拉伊科公告和伊瓜苏数字项目。国家电力管理局已为一个数据中心签署了为期15年、最高286兆瓦的供电合同。包括国家电力管理局工人工会和巴西政界人士在内的批评者警告称，优惠电价和大规模用电可能加速到2030年前后的能源短缺，而且相关协议缺乏公开披露。", "image_url": "https://www.lanacion.com.py/resizer/v2/ICG7I22XXFD7PCKPNBXJNBOPEQ.jpg?auth=4ad6e6301c12cbf5ee7fb683f1c22f2ad1557f509ce6db35c8301f45afa7a06c&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "众议员快速推进一项最高可判处90年监禁的法案；另一项金融恐慌法案在审查担忧中推进（2026-10-23）", "date": "2026-10-23", "source_url": "https://elnacional.com.py/politica/cadena-perpetua-rubin-logra-prioridad-tratar-su-proyecto-asesinos-violadores-n113936", "source_name": "El Nacional", "summary": "众议院对众议员鲁本·鲁宾提出的一项法案给予了15天优先审议动议。该法案拟对加重杀人罪判处最高90年监禁，服刑满50年后可复审；加重杀人罪包括杀害女性、弑亲、雇凶杀人和恐怖主义，以及性犯罪、加重抢劫和某些诈骗罪。另外，执政党众议员亚历杭德罗·阿吉莱拉提出一项法案，对故意散布可能引发银行挤兑的虚假信息者处以最高10年监禁；反对派称这是审查。参议院立法委员会还建议将有组织偷牛罪的刑罚提高至15年，并扩大性犯罪条款中的年龄范围。上述法案均尚未成为法律。", "image_url": "https://www.lapoliticaonline.com/files/image/302/302355/6acd1da36817c_1200_630!.jpg?s=e626c450735c1324a7d87902f04964e2&d=1791828936", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "三、社会与安全形势", "tier": 1, "events": [{"title": "与“首都第一司令部”有关联的突击队在佩德罗胡安卡瓦列罗杀害一名女子并绑架一名男子；尸体稍后被发现（2026-10-19）", "date": "2026-10-19", "source_url": "https://www.ultimahora.com/rastrean-a-soldados-del-pcc-tras-mortal-ataque-en-pedro-juan-caballero", "source_name": "Última Hora", "summary": "大约十名武装人员于10月19日（星期一）闯入佩德罗·胡安·卡瓦列罗工人区的一处住宅，杀害了27岁的卡罗琳娜·贝尼特斯·阿尔塞，并绑架了26岁的马塞洛·鲁安·奥尔蒂斯·拉萨罗；后者的尸体后来在一条乡间道路上被发现。检察官和凶杀案调查部门突击搜查了卡库佩圣母区的一栋公寓楼，查获了大楼的数字视频录像机（DVR），其中显示一辆白色丰田福图纳载着杀手小组离开。嫌疑人埃德尔·埃利希奥·戈麦斯·托雷斯已被确认身份，目前仍在逃。调查人员认为，这起袭击与贩毒团伙之间的纠纷有关，这些团伙与“首都第一司令部”（PCC）存在联系，凸显出巴西边境有组织犯罪暴力的持续存在。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/31e9a66/2147483647/strip/true/crop/1280x720+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fed%2F05%2Fea45885045718c4b3b7290390571%2Famambay-pjc-pcc.jpeg", "is_gov_source": false, "is_authoritative": true}, {"title": "明加瓜苏开展三次突击搜查，调查巴西家庭遇袭案；两名嫌疑人被捕（2026-10-20）", "date": "2026-10-20", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/pais/2026/10/20/allanan-tres-casas-y-detienen-a-dos-supuestos-miembros-de-la-banda-que-ejecuto-dos-asaltos/", "source_name": "La Nación", "summary": "10月20日，警方突击搜查了上巴拉那省明加瓜苏的三处房产，调查涉及对一户巴西家庭的武装袭击及另一起抢劫案，逮捕了两名涉嫌团伙成员。警员缴获了弹药、战术服装、手机、一台数字视频录像机、一辆菲亚特斯特拉达皮卡、一架无人机、车牌及登记文件。此次行动是更广泛打击三国边境地区持械抢劫网络行动的一部分，该地区的犯罪团伙利用与合法贸易相同的物流走廊。这起案件加剧了上巴拉那省一连串暴力事件，已引发要求在该省加强警察和军事部署的呼声。", "image_url": "https://www.lanacion.com.py/resizer/v2/OZ3YRGHTUVAPHGDL5XBNGJJIKY.jfif?auth=a53092510681df4ad88f7dc91c83df55f41380ab1f06cbd4ca65af53119e46dd&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "国家禁毒局“伊格尼斯”行动在卡宁德尤逮捕一名据称是“马乔”（Macho）的亲密手下（2026-10-22）", "date": "2026-10-22", "source_url": "https://www.lanacion.com.py/pais/2026/10/22/cayo-jose-ignacio-hermoza-mano-derecha-y-nexo-logistico-de-macho-en-canindeyu/", "source_name": "La Nación", "summary": "10月22日，国家禁毒秘书处在国内防御行动指挥部特种部队、联合特遣部队、第5空中警察分队和摩托化步兵营的支援下，在卡宁德尤省科珀斯克里斯蒂地区美洲殖民地的一处农村地产上逮捕了何塞·伊格纳西奥·埃尔莫萨·莱德斯马，人称“纳乔”。他被指控是费利佩·圣地亚哥·阿科斯塔·里韦罗斯（别名“马乔”）的密切合作者，后者是该国最受通缉的涉嫌贩毒者之一。行动中缴获了两部手机。此次行动是在打击“马乔”网络的一系列突袭之后开展的，表明北部边境省份大麻和可卡因贩运通道持续面临压力，该地区非法武装团体与盗窃牲畜活动相互交织。", "image_url": "https://www.lanacion.com.py/resizer/v2/AX4RDRJAWZHHLB74TCY5HIS3UQ.jpg?auth=3c5c6eb9cdb3a3d0094f29b7cd24a641be377299ac0567d2e3c3627146802803&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉那河洪水使1,988户家庭流离失所，影响四个省的4,253人（2026-10-21）", "date": "2026-10-21", "source_url": "https://www.lanacion.com.py/pais_edicion_impresa/2026/10/21/unas-4200-familias-afectadas-por-crecida/", "source_name": "La Nación / SEN", "summary": "国家应急秘书处10月20日至21日报告称，巴拉那河洪水已导致伊塔普阿、米西奥内斯、上巴拉那和涅恩布库等省4,253个家庭受灾。其中1,988个家庭已被疏散，1,369个家庭正在接受援助，2,672个家庭仍在等待救助；上巴拉那省受灾最严重，其次是涅恩布库省。在阿约拉斯，巴拉那河水位接近6.40米，3,438人住在14个避难所。伊泰普水电站和亚西雷塔水电站开启溢洪道，14个移民检查站暂时关闭，预报称周末还可能有多达150毫米降雨，可能导致灾情进一步恶化。此次洪水正在扰乱南部和东部的道路通行和港口运营。", "image_url": "https://www.lanacion.com.py/resizer/v2/XQBI4SN4XBGIBLDNCQKB5CM7YU.jpg?auth=420e05f8d74ee33cc2fd4cc91c4ba198a16df6c0eb434b392634b257db103cc3&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "国家缉毒总局突袭亚松森一家被用作可卡因掩护的理发店兼纹身工作室；查获199克（2026-10-23）", "date": "2026-10-23", "source_url": "https://www.lanacion.com.py/pais/2026/10/22/entre-tijeras-y-cocaina-cae-un-barbero-sospechoso-de-vender-drogas/", "source_name": "La Nación", "summary": "10月23日，国家缉毒局特工突击搜查了亚松森奥布雷罗区的一家理发店兼纹身工作室，该店据称被用作可卡因零售的掩护。执法人员缴获了199克可卡因、现金及其他证据，并拘留了一人。该案件是打击首都中心社区零星贩毒点行动的一部分，随着大型贩毒网络分裂为零售分销，这些贩毒点不断增多。对于在亚松森经营的企业而言，此次突袭提醒人们，轻微犯罪和毒品零售仍集中在特定的中心及近中心社区。", "image_url": "https://www.lanacion.com.py/resizer/v2/GQMG7VMA7ZDBVK24T7GK4YMNQY.jpg?auth=15e2ef17c6088f60180748f9fd7e71f44bc4ae5a82c5910fafa7ad339c6117a3&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "四、国际关系与外交动态", "tier": 1, "events": [{"title": "美国在亚松森开设美国国务院国际麻醉品和执法事务局（INL）禁毒办公室，作为其首个南锥体区域中心，并配套1175万美元一揽子计划（2026-10-21）", "date": "2026-10-21", "source_url": "https://www.abc.com.py/politica/2026/10/21/eeuu-abrira-en-paraguay-la-oficina-de-asuntos-internacionales-de-narcoticos-y-donara-us-65-millones/", "source_name": "ABC Color / US State Department", "summary": "在副国务卿克里斯托弗·兰道10月19日至21日访问结束时，华盛顿宣布在亚松森设立首个国际麻醉品和执法事务局办公室，该办公室还将协调该局在南锥体地区的项目。该一揽子计划总额为1175万美元：625万美元用于打击跨国有组织犯罪，550万美元用于打击恐怖主义融资和毒品恐怖主义，其中包括新建一个反恐中心。两国政府签署了一项空中拦截援助协议和一份关于实施用于移民和边境管控的个人身份安全比对与评估系统的备忘录。一名区域反恐顾问将首次派驻亚松森。这些举措属于华盛顿“美洲之盾”框架。", "image_url": "https://www.lanacion.com.py/resizer/v2/4LRIJB75BFFY3GIJ4T6WR3ZOWE.jpg?auth=804acf82f64643866618748f6e01cc6fef1d54bf3014f0f25277ad1be9cf4b17&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭成为美国主导的“硅和平”人工智能供应链联盟第26个签署国（2026-10-23）", "date": "2026-10-23", "source_url": "https://www.abc.com.py/internacionales/2026/10/23/paraguay-se-une-a-pax-silica-la-alianza-de-eeuu-para-la-cadena-de-suministro-de-la-ia/", "source_name": "ABC Color", "summary": "总统佩尼亚于10月23日宣布，巴拉圭已加入美国主导的人工智能供应链联盟“硅基和平”，成为其第26个签署方。外交部长鲁本·拉米雷斯·莱斯卡诺和美国负责经济事务的副国务卿雅各布·赫尔伯格在美国国务院签署了该宣言。佩尼亚将此举定位为“从技术消费者转变为技术生产者”转型的一部分，利用巴拉圭的水电和关键矿产。加入该联盟补充了他在访问华盛顿期间举行的数据中心和半导体供应讨论，并使巴拉圭进一步向美国技术政策靠拢，这一立场在其与中国的关系中带有明确风险。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/3db6e14/2147483647/strip/true/crop/1120x630+32+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fde%2F5d%2F682717d345b19349c07683188a15%2Fruben-ramirez-lezcano-y-el-subsecretario-de-estado-e-eeuu-jacob-helberg.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "培尼亚承诺与美国财政部长贝森特开展关键矿产供应合作（2026-10-22）", "date": "2026-10-22", "source_url": "https://www.abc.com.py/internacionales/2026/10/22/presidente-de-paraguay-se-compromete-a-fortalecer-suministro-de-minerales-criticos-de-eeuu/", "source_name": "ABC Color", "summary": "在10月21日至23日访问华盛顿期间，培尼亚总统会见了财政部长斯科特·贝森特，并承诺巴拉圭将加强面向美国的关键矿产供应链。他还在乔治·华盛顿大学以及美洲国家组织举行的美洲对话活动上发表讲话。美国官员确认铀能源公司在巴拉圭投资1200万美元，并讨论了铀和稀土元素的勘探。据报道，此次访问包括与中央情报局局长约翰·拉特克利夫就即将在亚松森设立的禁毒办公室举行私人会晤。矿产议程是同一周宣布的安全与人工智能供应链协议在商业领域的对应内容。", "image_url": "https://www.lanacion.com.py/resizer/v2/EVEOXASOW5C33DV2M3CYSSW4DA.jpg?auth=aead038e12320e0552a2d6a7abd27d3f357b9fa20769e5c79af262fbebb2c7e0&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "巴西质疑巴拉圭将伊泰普水电站用于数据中心；国家电力管理局局长称亚松森无需咨询巴西利亚（2026-10-23）", "date": "2026-10-23", "source_url": "https://www.abc.com.py/economia/2026/10/23/paraguay-tiene-que-comunicarle-a-brasil-baez-responde-a-las-criticas-brasilenas-por-decisiones-sobre-itaipu/", "source_name": "ABC Color", "summary": "在巴拉圭国家电力管理局与昆图尔（阿拉伊科）公司签署了一份为期15年、最高286兆瓦的数据中心供电合同后，巴西媒体和政界人士称，巴拉圭正在将伊泰普的剩余电力从巴西市场转移走，有人声称该国“卖掉了伊泰普的一半”。国家电力管理局局长米格尔·巴埃斯驳斥了上述批评，称巴拉圭使用自己在该双边水电站中50%份额的电力不需要巴西授权。伊泰普方面澄清说，各方均可接待外国当局，条约保障两国各获得一半电力。培尼亚总统表示，附件C电价审查没有取得进展；2024至2026年临时电价仍为每千瓦月19.28美元，而巴拉圭寻求从2027年起实行三至五年的中期电价。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/6831e6b/2147483647/strip/true/crop/762x429+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F28%2Ff3%2Fd2fc9b1b414298faef6bb6e72726%2Flula-da-silva-y-santiago-pena-negocian-la-tarifa.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "台湾-巴拉圭理工学院在卢克推进，2000万美元无偿合作；定于2027年7月启用（2026-10-24）", "date": "2026-10-24", "source_url": "https://www.lanacion.com.py/politica_edicion_impresa/2026/10/24/avanza-la-construccion-de-la-universidad-politecnica-taiwan-paraguay-en-luque/", "source_name": "La Nación", "summary": "位于卢克的台湾-巴拉圭理工大学建设正在推进：面积2万平方米、约40间教室和13个实验室，由约2000万美元的台湾无偿合作资金资助。该项目于2018年与国立台湾科技大学商定，定于2027年7月启用。目前该校培训约300名学生，超过800名巴拉圭人已获得赴台湾奖学金。该校园是技术合作一揽子计划的一部分，该计划还包括伊瓜苏数字项目和台湾-巴拉圭工业园。此时正值亚松森在中国于10月12日对信息与通信技术部部长古斯塔沃·比利亚特实施制裁后，重申对台北的外交承认。", "image_url": "https://www.lanacion.com.py/resizer/v2/5T3PHKGXZVAY3KT2CQGBJIGRI4.jpg?auth=ec55a7e0d98db52fac5b9a1faacffb0f3a1b1fc436a1975c0af593daa8e3fd41&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "五、行业专题：通讯、运营商、数字能源与AI", "tier": 1, "events": [{"title": "克鲁索与 Araico 宣布在巴拉圭建设拉丁美洲首个克鲁索人工智能数据中心，由伊泰普供电，可扩展至280兆瓦（2026-10-22）", "date": "2026-10-22", "source_url": "https://www.infobae.com/america/agencias/2026/10/22/la-fabrica-de-ia-crusoe-construira-en-paraguay-un-centro-de-datos-alimentado-con-itaipu/", "source_name": "Infobae / EFE", "summary": "美国克鲁索能源公司与巴拉圭Araico 集团于10月22日宣布，将建设克鲁索在拉丁美洲的首个数据中心，该中心由伊泰普能源供电，并接入巴拉圭国家电力公司电网。一期工程预计投资3亿美元，建设6兆瓦容量，配置约2,000个英伟达布莱克韦尔人工智能处理器，计划2027年3月开工，2027年年中投入初步运营。该数据中心设计可扩展至106兆瓦技术基础设施，长期最高可达280兆瓦，位于上巴拉那省伊瓜苏镇附近的“伊瓜苏人工智能城”园区内，靠近伊瓜苏变电站。该项目得到与巴拉圭国家电力公司签订的购电协议支持，据报道电价为45-48美元/兆瓦时，电压等级为220千伏，每年调整2.5%。美国官员称，这可能是巴拉圭历史上规模最大的私人投资之一。", "image_url": "https://www.infomoney.com.br/wp-content/uploads/2026/10/Santiago-Pena-_-Itaipu.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭国家电力局与昆图尔（阿拉伊科）签署为期15年的购电协议，最高286兆瓦，价格为48.91至56.39美元/兆瓦时（2026-10-21）", "date": "2026-10-21", "source_url": "https://rcc.com.py/nacionales/negocio-rentable-o-techo-legal-ajustado-ande-compromete-280-mw-para-centro-de-datos-en-medio-de-advertencias-sindicales/", "source_name": "RCC", "summary": "国家电力管理局正式通过了第52552/2026号决议，批准与阿拉伊科旗下关联公司昆图尔签订一份为期15年、最高286兆瓦的购电合同，用于为数据中心园区供电，电价为48.91至56.39美元/兆瓦时。该合同是这家国有电力公司有史以来签署的最大规模长期电力承诺之一，并与克鲁索-阿拉伊科项目相关联。国家电力管理局工人工会西特兰德质疑这一优惠待遇，并警告其对电网和能源主权的影响；巴西相关方则对使用伊泰普盈余电力表示关切。该决议还引发疑问：这一承诺是否符合国家电力管理局长期合同的法定上限，以及电网扩容成本由谁承担。", "image_url": "https://cdn.rcc.com.py/2026/10/ANDE-EMPRESA-IA.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "培尼亚会见Anthropic 公司的特蕾莎·卡尔森，并推介伊瓜苏数字10兆瓦至1吉瓦人工智能园区（2026-10-23）", "date": "2026-10-23", "source_url": "https://www.lanacion.com.py/politica/2026/10/23/santiago-pena-explora-alianzas-de-inteligencia-artificial-con-anthropic-en-ee-uu/", "source_name": "La Nación", "summary": "10月23日，培尼亚总统会见了Anthropic 公司公共部门全球负责人特蕾莎·卡尔森，探讨在人工智能领域开展合作，并介绍了与台湾共同开发的伊瓜苏数字项目。该园区计划分三个阶段建设，运营容量分别为10兆瓦、100兆瓦和1,000兆瓦，将巴拉圭能源与台湾技术和投资结合起来。此次会晤是在培尼亚访问华盛顿期间举行的，同一行程还包括加入“硅和平”倡议和关键矿产谈判。巴拉圭信息与通信技术部部长古斯塔沃·比利亚特表示，尽管中国于10月12日对他采取了反制措施，但包括伊瓜苏数字项目、科技园区和理工大学在内的台湾科技项目仍将继续推进。", "image_url": "https://www.lanacion.com.py/resizer/v2/ZN6AS3VCDNHHTNPWN7ZPCDUMDU.jpeg?auth=e923d70cf28a1ae09370d921973db26ac758a78f23b0d5761e76d631787d6553&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "众议员要求国家电力管理局提交关于电信运营商使用其电线杆进行光纤和架空布线的报告（2026-10-22）", "date": "2026-10-22", "source_url": "https://diputados.gov.py/noticias/noticias/3145", "source_name": "Chamber of Deputies", "summary": "众议院批准了一项向国家电力公司提出的信息请求，涉及电信、光纤、有线电视和互联网公司对其电线杆的使用情况，涵盖合同、收入、维护成本以及架空布线的风险。该请求反映出，随着光纤和5G部署加速、运营商寻求更快、更便宜的方式进入新区域，对共享基础设施制度的审查日益加强。对运营商而言，结果可能影响电线杆接入费率和部署时间表；对国家电力公司而言，这是将基本非正式的收入流正式化的机会。该信息请求尚未改变规则，但表明国会打算就无源基础设施立法。", "image_url": "https://diputados.gov.py/storage/noticias/lHaemPnaGfbFxdquPCBF0qzC5iBxVyt70ZXBN1zE.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "国家电信委员会延长2026-2030年国家电信计划的公众咨询，目标是实现30%的5G覆盖率和23.1亿美元的资本支出（2026-10-22）", "date": "2026-10-22", "source_url": "https://dplnews.com/conatel-amplia-consulta-publica-plan-nacional-telecomunicaciones-2026-2030-paraguay/", "source_name": "DPL News", "summary": "国家电信委员会延长了《2026-2030年国家电信计划》草案的公开征求意见期，该计划建立在三大支柱之上：基础设施与覆盖、质量与监管、可负担性与数字包容。该计划的目标是到2030年实现5G人口覆盖率30%、4G覆盖率95.6%，并将265个区接入光纤骨干网，预计资本支出为23.13亿美元。此次延期使运营商和行业团体有更多时间就频谱、部署义务和无源基础设施规则发表意见。此前，移动运营商商会对3.5 GHz频段八个子频段的划分以及5G招标排除中国设备提出了批评。", "image_url": "https://dplnews.com/wp-content/uploads/2026/06/Gemini_Generated_Image_2s4av12s4av12s4a-1024x572.png", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "六、主要客户动向", "tier": 1, "events": [{"title": "努比康激活了34个5G站点，但依赖Ufinet 光纤和Copaco/Vox站点；仅有两名用户（2026-10-23）", "date": "2026-10-23", "source_url": "https://www.telesemana.com/blog/2026/10/23/nubicom-despliega-5g-en-paraguay-con-infraestructura-de-terceros-pese-a-las-controversias/", "source_name": "Telesemana", "summary": "努比康已启用34个5G无线基站，高于其第一年所需的20至22个：其中28个在亚松森，2个在兰巴雷，2个在费尔南多·德拉莫拉，2个在卢克。33个站点使用诺基亚设备，1个使用乐天（Rakuten）旗下 Tejas Networks的设备，表明其可能采用开放无线接入网架构。该公司从Ufinet租用100 Gbps骨干链路，并使用Copaco/Vox的站址，因此其大部分传输网络和站址资源均由第三方提供。努比康已申报2400万美元用于核心网和157个无线基站，其中1350万美元对应已验收的34个站点及核心网。该公司持有3.5 GHz频段200 MHz频谱，但仅有2个活跃用户，可能为固定无线接入用户，且在前五年内没有义务提供移动电话服务。", "image_url": "https://www.telesemana.com/wp-content/uploads/2014/01/antena7.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom"}, {"title": "总审计长质疑努比康的商业运营；国家电信委员会称若服务无法得到证实，许可证或将被吊销（2026-10-21）", "date": "2026-10-21", "source_url": "https://www.nanduti.com.py/contraloria-podria-impulsar-la-cancelacion-de-la-licencia-5g-de-nubicom", "source_name": "Ñandutí / ABC Color", "summary": "国家电信委员会宣布，努比康公司已履行其5G部署的初期义务，但承认覆盖范围有限，且该公司仅有2名用户。总审计署质疑商业服务是否在有效提供，并警告称，如果努比康公司未能证明这一点，其牌照可能被吊销。参议员拉斐尔·菲利索拉指控招标过程中存在腐败，并表示巴拉圭可能损失近2亿美元的预期投资。国家电信委员会维护其自主权，并表示正在监督此案。这一争议对市场很重要，因为努比康公司是四家5G牌照持有者之一，若其失败，将导致一大块3.5 GHz频段频谱闲置。", "image_url": "https://cloudfront-us-east-1.images.arcpublishing.com/abccolor/ZJOLM2JHM5CF7IQH6BCI7AOS7U.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom"}, {"title": "个人电信公司在阿约拉斯和东方市的洪水避难所提供15天免费通话和互联网服务（2026-10-21）", "date": "2026-10-21", "source_url": "https://diarioparaguayo.com/noticia/personal-habilita-llamadas-gratuitas-por-15-dias-y-ofrece-internet-en-albergues-de-zonas-afectadas-por-inundaciones", "source_name": "Diario Paraguayo", "summary": "由努克莱奥股份公司运营的佩尔索纳尔公司为阿约拉斯和埃斯特城避难所中受巴拉那河和阿卡赖米溪洪水影响的家庭提供了15天免费通话和互联网连接。该措施覆盖其移动和固定网络，是该公司应急响应协议的一部分。除社会层面外，此次事件还考验了南部和东部地区的网络韧性，洪水已导致道路和电力中断。此外，佩尔索纳尔公司还必须在8月获得牌照后90天内提交详细的5G工程计划，并在2027年2月前启用其首个5G无线基站。", "image_url": "https://diarioparaguayo.com/uploads/news/news_1792382452_6476a423.webp", "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal"}, {"title": "克拉罗在巴拉圭的5G覆盖率领先，全国为23.75%，亚松森为77.7%（最新可得数据，2026年10月）。", "date": "2026-10-23", "source_url": "https://mobiletime.la/noticias/23/09/2026/claro-4g-y-5g-en-paraguay/", "source_name": "Mobile Time / nPerf", "summary": "恩佩尔夫晴雨表将克拉罗在巴拉圭的4G和5G覆盖均排在首位，其全国4G覆盖率为86.67%，全国5G覆盖率为23.75%，亚松森5G覆盖率为77.7%。克拉罗于2025年12月投资3500万美元并使用诺基亚设备推出了该国首个商用5G网络，并已将覆盖扩展至12个城市，包括大亚松森、东方市、恩卡纳西翁、奥维多上校镇、佩德罗·胡安·卡瓦列罗、比亚里卡、埃尔南达里亚斯和坎比雷塔。该公司表示，其在中部地区已超出许可义务。目前，大规模普及的主要制约因素不再是网络覆盖，而是支持5G设备的保有量。", "image_url": "https://mobiletime.la/wp-content/uploads/2026/01/pilot-infra1RDZ.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Claro"}], "impact_analysis": "", "user_notes": ""}, {"title": "七、对企业经营的综合影响分析", "tier": 2, "events": [], "impact_analysis": "🟡 现在的约束性因素是汇率，而不是通胀。瓜拉尼本周兑美元收于 G. 5,764.73-5,776.68（巴拉圭央行，10月23日），此前在10月13日一度触及约 G. 5,694，截至9月年内已升值11.9%。巴拉圭央行于10月23日将政策利率维持在5.50%，通胀率为1.7%，核心通胀率为1.5%；其10月调查将2026年底汇率预测从一个月前的 G. 6,100 下调至 G. 5,905。对于任何以美元计收入、以瓜拉尼计成本的业务而言，利润率每月都会机械性压缩；对财政部而言，同样的升值使截至9月的贸易税减少11%，伊泰普权利金减少25.9%。对冲已不再是可选项，而在2025年以 G. 6,300-6,600 定价的合同在汇兑时已经亏损。\n🟡 财政恶化是结构性的，2027年预算无法弥补这一缺口。1-9月赤字达到国内生产总值的2.0%（G. 7.82万亿，12.578亿美元），年化后约为3.0%，而最初目标为1.5%；经济财政部预计2026年为3.2%，2027年预算草案假定在财政规则例外豁免下为3.9%。 财政收入仅增长1.6%，工资、养老金和偿债支出占用近70%的财政资金，财政储蓄基金赤字超过其年度预算的43%。2027年预算新增21亿美元债务，并安排4700万美元用于教师加薪5%。公共部门供应商应预计付款周期放缓，并面临更大压力接受国库券或重新谈判条款。🟡 数据中心和能源热潮确实存在，但带有监管和政治风险。克鲁索公司和阿拉伊科公司宣布一期投资3亿美元（6兆瓦，约2000块英伟达布莱克韦尔处理器，自2027年年中投入运营），可扩展至280兆瓦，由国家电力管理局一份15年期、最高286兆瓦的合同支持，电价为48.91至56.39美元/兆瓦时。该项目是巴拉圭历史上最大的私人投资之一，但国家电力管理局工会、巴西政界人士和主计长均对优惠电价、电网容量以及使用伊泰普水电站剩余电力提出质疑。附件C电价审查仍未解决，暂行的19.28美元/千瓦·月费率延长至2024—2026年，巴拉圭寻求自2027年起实行三至五年的中期电价。 任何能源密集型项目都应模拟电价重新谈判情景，并确保获得可靠的输电容量。\n\n🟡 安全与气候风险集中在上巴拉那省和南部地区。10月19日发生在佩德罗胡安·卡瓦列罗、与“首都第一司令部”有关的袭击，10月20日在明加瓜苏的突袭行动，以及国家禁毒局在卡宁德尤和亚松森开展的行动表明，有组织犯罪在巴西边境沿线和首都的零售毒品交易中依然活跃。巴拉那河洪水影响了四个省的4,253户家庭，造成1,988人流离失所，并关闭了14个移民检查站，扰乱了道路和港口通行。美国国际禁毒和执法事务局办公室以及10月21日宣布的1,175万美元安全援助计划可能会逐步改善协调，但不会改变未来两个季度的行动局面。\n\n🟢 电信行业提供了最明确的近期商业机会。克拉罗以23.75%的全国覆盖率和77.7%的亚松森覆盖率在5G覆盖方面领先；蒂戈和个人移动必须在2027年2月之前启动其首批5G无线基站，并计划建设250至500个站点，联合投资约7,900万美元；努比康拥有34个站点，但仅有2名用户，并正受到总审计长办公室的审查； 《2026-2030年国家电信计划》设定了30%的5G覆盖率和23.13亿美元的资本支出目标。3.5 GHz子频段拍卖和排除中国设备仍是中国供应商面临的主要结构性障碍，而无源基础设施规则（国家电力管理局电线杆）和国家电信计划磋商则是近期政策杠杆。", "user_notes": ""}, {"title": "八、对中资企业的专项影响与建议", "tier": 2, "events": [], "impact_analysis": "🔴 首先保护收入。在瓜拉尼兑美元汇率为 G. 5,764-5,777、且巴拉圭央行预计到 12 月仅为 G. 5,905 的情况下，美元收入业务应立即锁定远期合约，对按 G. 6,300-6,600 签署的 2025 年期合同重新定价或重新计价，并在新的工程总承包、服务和供应协议中加入汇率条款。随着本地出口商得出相同结论，巴拉圭央行的远期窗口已经扩大；对冲成本远低于再承受 5-10% 升值的成本。对于瓜拉尼收入业务，同样的操作可在美国利率更长时间维持高位时防范汇率反弹对利润率的冲击。\n\n🟡 将公共部门敞口视为信用风险。1-9 月赤字占 GDP 的 2.0%（年化为 3.0%），2027 年预算假设为 3.9%，经济财政部预计 2026 年为 3.2%，而财政规则为 1.5%。付款延迟、国库券和重新谈判要求可能出现。优先私营客户，对公共合同要求担保或托管，并对 90-180 天延迟进行应收账款压力测试。2027 年预算中的卫生拨款（占增量的 62%，其中 78% 用于欠款）可能释放部分卫生部门付款，但整体财政紧缩并未缓解。 🟡 尽早介入能源和数据中心项目储备，并按政治风险定价。克鲁索-阿拉伊科项目（一期3亿美元，长期280兆瓦）以及国家电力管理局为期15年、电价48.91至56.39美元/兆瓦时的购电协议，将催生对变电站、制冷、光纤、备用电源和施工服务的采购需求。但国家电力管理局工会、巴西政界人士和主计长正在对优惠电价和伊泰普使用提出异议，且附件C的审查仍未解决。仅在具备确定的输电容量、明确的限电规则和电价重新谈判情景下投标；避免签订假设当前优惠电价能维持到2030年的合同。  \n🔴 明确管控台湾—中国这一断层线。中国于10月12日以与台湾有关系为由制裁了信息与通信技术部部长古斯塔沃·比利亚特，巴拉圭则于10月23日重申承认台北，并加入由美国主导的“硅和平”联盟作为回应。中国企业应避免与受制裁个人产生任何商业或个人接触，且不应假设巴拉圭与台湾的关系会在短期内改变。中国设备被排除在5G招标之外是一项结构性障碍； 🟢 重点聚焦限制不涉及的无线接入网以外领域（光纤、电力、数据中心配套、企业信息技术），并针对美国二级制裁风险保存清晰的合规档案。优先安排电信网络部署和数字基础设施供应链。蒂戈和个人电信必须在2027年2月前启动首批5G基站，并规划250至500个站点和约7900万美元投资；克拉罗正从12个城市向外扩张；努比康姆有157个无线基站待部署，但仅有2个用户且面临监管风险。《2026—2030年国家电信计划》的目标是265个区拥有光纤骨干网，4G覆盖率达到95.6%，5G覆盖率达到30%，资本支出为23.13亿美元。国家电力管理局的电杆接入审查和国家电信计划磋商是当前的政策窗口；应围绕无源基础设施、光纤、电力和运维工作布局，而非依赖频谱的无线接入网。\n\n🟡 将安全和气候应急措施纳入交付时间表。上巴拉那省（佩德罗·胡安·卡瓦列罗、明加瓜苏）和南部洪水走廊是主要运营风险；巴拉那河洪水已导致1,988户家庭流离失所，并关闭了14个移民检查站。 现场安保、车队规则、保险及备用物流路线应作为这些地区项目的标准配置，且交付时间表应为11月至4月的雨季预留天气和道路通行缓冲。", "user_notes": ""}]}, "en": {"topic": "Paraguay Briefing", "time_span": "October 19 – October 26, 2026", "time_label": "Last week", "tiers": [{"name": "Part I: Key News & Developments", "description": "Macro economy, politics, social security, international relations, industry and key client movements in Paraguay"}, {"name": "Part II: Analysis & Recommendations", "description": "Enterprise impact assessment and China-specific strategic recommendations"}], "sections": [{"title": "I. Macroeconomic Developments", "tier": 1, "events": [{"title": "BCP holds policy rate at 5.50% as inflation stays at 1.7% and the 2026 growth forecast is raised to 5.0% (2026-10-23)", "date": "2026-10-23", "source_url": "https://www.hoy.com.py/nacionales/2026/10/24/inflacion-controlada-bcp-mantiene-tasa-de-politica-monetaria", "source_name": "Diario HOY / BCP", "summary": "The Central Bank's Monetary Policy Committee voted unanimously on 23 October to keep the policy rate at 5.50%, citing annual inflation of 1.7% in September (core 1.5%, monthly 0.1%) and activity growth of 6.7% year-on-year in August as measured by the IMAEP. The BCP raised its 2026 GDP growth projection from 4.5% to 5.0% and cut its end-2026 inflation forecast from 3.3% to 3.0%, with the core forecast lowered from 2.8% to 2.2%. Expectations remain anchored at 3.5%, the centre of the target range. The committee flagged external risks from Middle East geopolitical tensions, high oil prices and the prospect of higher US rates. The next policy meeting is scheduled for 20 November.", "image_url": "https://www.lanacion.com.py/resizer/v2/LAI3FQURIJADFFTOVHL5M3W5VI.jpg?auth=4f30086262b51152251f00be9c2c3dca7a3ca47952f8ea7eb09d1b127bf2da92&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "October BCP survey keeps 2026 inflation at 3.0% and cuts the end-year exchange-rate forecast to G. 5,905/USD (2026-10-19)", "date": "2026-10-19", "source_url": "https://www.lanacion.com.py/negocios/2026/10/19/mercado-financiero-mantiene-prevision-de-inflacion-en-3-y-un-dolar-a-g-5905-para-fin-de-ano/", "source_name": "La Nación / BCP", "summary": "The BCP's October Survey of Economic Variables Expectations, collected to 9 October, keeps median end-2026 inflation at 3.0% and the 2027 and twelve-month horizons at 3.5%. Respondents expect monthly inflation of 0.2% in October and 0.3% in November, GDP growth of 4.5% in 2026 and 4.0% in 2027, and a policy rate of 5.50% through end-2026 before easing to 5.25% at end-2027. The exchange-rate median was cut sharply to G. 5,815 for October, G. 5,850 for November, G. 5,905 at end-2026 and G. 6,185 at end-2027, from G. 6,100 for end-2026 in the September survey, reflecting the guaraní's continued appreciation.", "image_url": "https://www.lanacion.com.py/resizer/v2/XFS46ES2PVCL5PUAQNBLN2ROOU.jpg?auth=8e3732ac4ca06ae27c8c4736ca5cedd396376adb3f397e7582cb24743c90c647&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Fiscal deficit reaches 2.0% of GDP through September, 3.0% annualised, as revenues grow only 1.6% (2026-10-20)", "date": "2026-10-20", "source_url": "https://www.mef.gov.py/sites/default/files/2026-10/Pres%20SITUFIN%20Sept-26_vf.pdf", "source_name": "Ministry of Economy and Finance (MEF)", "summary": "The September public-finance report puts the January-September central-government deficit at G. 7.82 trillion (USD 1,257.8 million), equal to 2.0% of GDP versus 0.9% in the same period of 2025. On an annualised basis the gap reaches about 3.0% of GDP, close to USD 2.0 billion, and the MEF projects 3.2% for the full year against an original 1.5% target. Revenue rose only 1.6% while trade-related taxes fell 11% and Itaipú royalties and compensation dropped 25.9%, both hit by the guaraní's 11.9% appreciation through September. Wages, pensions and debt service absorb close to 70% of public financing, and the Caja Fiscal pension scheme shows a deficit above 43% of its annual budget.", "image_url": "https://www.latribuna.com.py/resizer/v2/4FRYCYCLRZD6ZAJU5BDX7NBOGE.png?smart=true&auth=2b202d8328612e0325b868d993e8f1f30ba2047f700814e8c83cc6cfff6d211c&width=1200&height=630", "is_gov_source": true, "is_authoritative": true}, {"title": "Guaraní closes the week near G. 5,776/USD after touching a multi-year low, squeezing exporters and fiscal revenue (2026-10-23)", "date": "2026-10-23", "source_url": "https://www.lanacion.com.py/negocios/2026/10/23/el-dolar-vive-una-jornada-con-fluctuaciones-y-cierra-a-la-baja/", "source_name": "La Nación / BCP", "summary": "The BCP's weighted-average reference rate was G. 5,764.73 per dollar on 23 October, with the 13:00 quote at G. 5,776.68, after G. 5,801.08 on 22 October and a multi-year low of about G. 5,694 on 13 October. The guaraní has appreciated 11.9% year-to-date through September, one of the strongest performances in the region, and the central bank has not intervened in the spot market. Exporters warn that margins are being compressed and that dollar revenues converted into guaraníes no longer cover local costs, while the Treasury loses guaraní revenue from trade taxes and Itaipú royalties. The October survey still sees G. 5,905 at end-2026, implying only a modest correction from current levels.", "image_url": "https://www.lanacion.com.py/resizer/v2/JZDK55VSOVEYBMS6WW6YFHGTXQ.jpg?auth=06912091bd769eb2f95c7a71b0e2a0a93b59ec77c40472049a6bf40f243f0927&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "September exports rise 25.4% to USD 1,834M but the monthly trade deficit widens to USD 118.2M; January-September surplus reaches USD 712M (2026-10-20)", "date": "2026-10-20", "source_url": "https://www.bcp.gov.py/en/web/institucional/w/reporte-de-comercio-exterior-septiembre-2026/-/categories/111282", "source_name": "Central Bank of Paraguay (BCP)", "summary": "Paraguay exported USD 1,834.1 million in September, up 25.4% year-on-year, with primary products up 20.9%, agro-industrial manufactures up 23.4% and industrial manufactures up 41.6%. Imports reached USD 1,952.2 million, up 23.5%, driven by consumption goods (+20.9%), intermediate goods (+41.4%) and capital goods (+11.7%), leaving a monthly deficit of USD 118.16 million, slightly above the USD 117.73 million gap a year earlier. For January-September, exports totalled USD 15,972.6 million (+25.7%) and imports USD 15,260.6 million (+15%), producing a cumulative surplus of USD 712 million compared with a USD 555.5 million deficit in 2025. Soy and its derivatives account for 41% of exports and rose 45.1% to USD 3,107.2 million.", "image_url": "https://marketdata.com.py/wp-content/uploads/2026/10/portada_web_MD-03.jpg-45.jpeg", "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "II. Political & Policy Developments", "tier": 1, "events": [{"title": "MEF presents a G. 166.3 trillion 2027 budget to the bicameral committee, with a 3.9% deficit and USD 2.1 billion of new debt (2026-10-22)", "date": "2026-10-22", "source_url": "https://www.lanacion.com.py/politica/2026/10/22/pgn-2027-titular-del-mef-expone-sus-prioridades-ante-la-bicameral/", "source_name": "La Nación", "summary": "Economy Minister Óscar Lovera presented the 2027 budget priorities to the bicameral budget committee on 22 October. The draft totals G. 166.32 trillion (about USD 25.75 billion), 11.2% above the 2026 approved budget, and projects a 3.9% of GDP deficit under an exceptional escape from the 1.5% fiscal-responsibility limit. New borrowing is about USD 2.1 billion, with total financing needs including refinancing near USD 2.8 billion. Health receives 62% of the spending increase (over USD 1.2 billion, 78% of it to clear accumulated arrears), pensions rise 20%, and an addendum includes a 5% teacher pay increase worth USD 47 million. The bill remained in committee with no floor vote in either chamber.", "image_url": "https://www.lanacion.com.py/resizer/v2/2XZDWLEGBVGA7GWCMCAI35BKGU.jpeg?auth=5fabc857fe077db9184c2c448c0d5357385cffce42fae5e397cea41ea561e3f9&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Peña defends BCP independence and promises to work with opposition mayors during his final 22 months (2026-10-20)", "date": "2026-10-20", "source_url": "https://www.lapoliticaonline.com/paraguay/politica-py/pena-insiste-en-la-autonomia-del-bcp-y-promete-no-relegar-a-los-intendentes-opositores-2444/", "source_name": "La Política Online", "summary": "At the Council of Ministers on 20 October, President Santiago Peña defended the Central Bank's autonomy amid congressional pressure over monetary and exchange-rate policy, and pledged not to sideline opposition mayors in the remaining 22 months of his term. He set a goal of advancing \"with a firm step\" on investment and public management, while acknowledging tensions within the ruling Colorado Party over the 2027 budget and the 2028 succession. The statement is significant for investors because it signals continuity at the BCP and a willingness to keep mayors of other parties inside the public-investment pipeline ahead of the municipal and general electoral cycle.", "image_url": "https://www.lapoliticaonline.com/files/image/303/303369/6ad7cb1fd1739_1200_630!.jpg?s=175654059d314a5864d128791c2266b9&d=1792465200", "is_gov_source": false, "is_authoritative": true}, {"title": "Peña outlines solar and small modular nuclear plans, positioning energy as the anchor of the next investment cycle (2026-10-22)", "date": "2026-10-22", "source_url": "https://www.lanacion.com.py/politica/2026/10/22/pena-proyecta-energia-solar-y-nuclear-para-asegurar-el-futuro-energetico-de-paraguay/", "source_name": "La Nación", "summary": "President Peña said his government will develop solar generation and small modular reactors to guarantee long-term electricity supply, and confirmed that a US company is exploring uranium deposits. The plan is presented as complementary to Itaipú hydropower and aimed at data-centre and industrial demand, following the Crusoe-Araico announcement and the Yguazú Digital project. The ANDE has already signed a 15-year supply contract of up to 286 MW for a data centre. Critics, including the ANDE workers' union and Brazilian politicians, warn that preferential tariffs and large-scale consumption could accelerate an energy deficit toward 2030 and that the agreements lack public disclosure.", "image_url": "https://www.lanacion.com.py/resizer/v2/ICG7I22XXFD7PCKPNBXJNBOPEQ.jpg?auth=4ad6e6301c12cbf5ee7fb683f1c22f2ad1557f509ce6db35c8301f45afa7a06c&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Deputies fast-track a bill imposing up to 90 years in prison; a separate financial-panic bill advances amid censorship concerns (2026-10-23)", "date": "2026-10-23", "source_url": "https://elnacional.com.py/politica/cadena-perpetua-rubin-logra-prioridad-tratar-su-proyecto-asesinos-violadores-n113936", "source_name": "El Nacional", "summary": "The Chamber of Deputies granted a 15-day priority motion to a bill by Deputy Rubén Rubín that would impose sentences of up to 90 years, with review after 50 years served, for aggravated homicide including femicide, parricide, contract killing and terrorism, as well as sexual crimes, aggravated robbery and certain frauds. Separately, ruling-party Deputy Alejandro Aguilera presented a bill punishing with up to 10 years anyone who deliberately spreads false information capable of triggering bank runs; the opposition called it censorship. The Senate legislation committee also recommended raising penalties for organised cattle rustling to 15 years and expanding the age range in sexual-crime articles. None of the bills is law yet.", "image_url": "https://www.lapoliticaonline.com/files/image/302/302355/6acd1da36817c_1200_630!.jpg?s=e626c450735c1324a7d87902f04964e2&d=1791828936", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "III. Social & Security Landscape", "tier": 1, "events": [{"title": "PCC-linked commando kills a woman and abducts a man in Pedro Juan Caballero; the body is found later (2026-10-19)", "date": "2026-10-19", "source_url": "https://www.ultimahora.com/rastrean-a-soldados-del-pcc-tras-mortal-ataque-en-pedro-juan-caballero", "source_name": "Última Hora", "summary": "About ten armed men stormed a home in Barrio Obrero, Pedro Juan Caballero, on Monday 19 October, killing Carolina Benítez Arce, 27, and abducting Marcelo Ruan Ortiz Lázaro, 26, whose body was later found on a rural road. Prosecutors and the homicide department raided an apartment complex in Virgen de Caacupé and seized the building's DVR, which showed a white Toyota Fortuner leaving with the hit squad. A suspect, Eder Eligio Gómez Torres, was identified and remains at large. Investigators link the attack to a dispute between drug-trafficking groups with ties to the First Capital Command (PCC), underlining the persistence of organised-crime violence on the Brazilian border.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/31e9a66/2147483647/strip/true/crop/1280x720+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fed%2F05%2Fea45885045718c4b3b7290390571%2Famambay-pjc-pcc.jpeg", "is_gov_source": false, "is_authoritative": true}, {"title": "Three raids in Minga Guazú over an assault on a Brazilian family; two suspects arrested (2026-10-20)", "date": "2026-10-20", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/pais/2026/10/20/allanan-tres-casas-y-detienen-a-dos-supuestos-miembros-de-la-banda-que-ejecuto-dos-asaltos/", "source_name": "La Nación", "summary": "Police raided three properties in Minga Guazú, Alto Paraná, on 20 October in connection with an armed assault on a Brazilian family and a second robbery, arresting two alleged gang members. Officers seized ammunition, tactical clothing, mobile phones, a DVR, a Fiat Strada pickup, a drone, vehicle plates and registration documents. The operation is part of a broader push against armed robbery networks operating in the tri-border area, where criminal groups exploit the same logistics corridors used by legitimate trade. The case adds to a run of violent incidents in Alto Paraná that has prompted calls for a stronger police and military presence in the department.", "image_url": "https://www.lanacion.com.py/resizer/v2/OZ3YRGHTUVAPHGDL5XBNGJJIKY.jfif?auth=a53092510681df4ad88f7dc91c83df55f41380ab1f06cbd4ca65af53119e46dd&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "SENAD Operation IGNIS arrests an alleged close operative of \"Macho\" in Canindeyú (2026-10-22)", "date": "2026-10-22", "source_url": "https://www.lanacion.com.py/pais/2026/10/22/cayo-jose-ignacio-hermoza-mano-derecha-y-nexo-logistico-de-macho-en-canindeyu/", "source_name": "La Nación", "summary": "On 22 October the anti-drug secretariat SENAD, supported by the CODI special forces, the FTC, SAP 5 and BIMI, detained José Ignacio Hermoza Ledesma, known as \"Nacho\", on a rural property in Colonia Americana, Corpus Christi department of Canindeyú. He is accused of being a close collaborator of Felipe Santiago Acosta Riveros, alias \"Macho\", one of the country's most wanted alleged traffickers. Two mobile phones were seized. The operation follows a series of raids against the \"Macho\" network and signals continuing pressure on cannabis and cocaine routes in the northern border departments, a region where illegal armed groups and cattle rustling overlap.", "image_url": "https://www.lanacion.com.py/resizer/v2/AX4RDRJAWZHHLB74TCY5HIS3UQ.jpg?auth=3c5c6eb9cdb3a3d0094f29b7cd24a641be377299ac0567d2e3c3627146802803&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Paraná floods displace 1,988 families and affect 4,253 across four departments (2026-10-21)", "date": "2026-10-21", "source_url": "https://www.lanacion.com.py/pais_edicion_impresa/2026/10/21/unas-4200-familias-afectadas-por-crecida/", "source_name": "La Nación / SEN", "summary": "The National Emergency Secretariat reported on 20-21 October that 4,253 families had been affected by the Paraná river flood in Itapúa, Misiones, Alto Paraná and Ñeembucú. Of these, 1,988 families had been evacuated, 1,369 were receiving assistance and 2,672 were still waiting for help; Alto Paraná was the hardest-hit department, followed by Ñeembucú. In Ayolas the river stood near 6.40 metres with 3,438 people in 14 shelters. Itaipú and Yacyretá opened spillways, 14 migration posts were temporarily closed, and forecasts of up to 150 millimetres of additional rain threatened to worsen conditions over the weekend. The flood is disrupting road access and port operations in the south and east.", "image_url": "https://www.lanacion.com.py/resizer/v2/XQBI4SN4XBGIBLDNCQKB5CM7YU.jpg?auth=420e05f8d74ee33cc2fd4cc91c4ba198a16df6c0eb434b392634b257db103cc3&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "SENAD raids an Asunción barbershop-tattoo studio used as a cocaine front; 199 grams seized (2026-10-23)", "date": "2026-10-23", "source_url": "https://www.lanacion.com.py/pais/2026/10/22/entre-tijeras-y-cocaina-cae-un-barbero-sospechoso-de-vender-drogas/", "source_name": "La Nación", "summary": "On 23 October SENAD agents raided a barbershop and tattoo studio in Barrio Obrero, Asunción, that was allegedly used as a front for retail cocaine sales. Officers seized 199 grams of cocaine, cash and other evidence and detained one person. The case is part of a push against micro-trafficking points in the capital's central neighbourhoods, which have multiplied as larger trafficking networks fragment into retail distribution. For companies operating in Asunción, the raid is a reminder that petty crime and drug retailing remain concentrated in specific central and peri-central neighbourhoods.", "image_url": "https://www.lanacion.com.py/resizer/v2/GQMG7VMA7ZDBVK24T7GK4YMNQY.jpg?auth=15e2ef17c6088f60180748f9fd7e71f44bc4ae5a82c5910fafa7ad339c6117a3&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "IV. International Relations & Diplomacy", "tier": 1, "events": [{"title": "US opens an INL anti-narcotics office in Asunción, its first Southern Cone regional hub, with a USD 11.75 million package (2026-10-21)", "date": "2026-10-21", "source_url": "https://www.abc.com.py/politica/2026/10/21/eeuu-abrira-en-paraguay-la-oficina-de-asuntos-internacionales-de-narcoticos-y-donara-us-65-millones/", "source_name": "ABC Color / US State Department", "summary": "At the end of Under Secretary Christopher Landau's visit on 19-21 October, Washington announced the creation of the first INL (Bureau of International Narcotics and Law Enforcement Affairs) office in Asunción, which will also coordinate INL programmes across the Southern Cone. The package totals USD 11.75 million: USD 6.25 million against transnational organised crime and USD 5.5 million against terrorist financing and narco-terrorism, including a new counter-terrorism centre. The two governments signed an air-interdiction assistance agreement and a memorandum to implement the PISCES migration and border-control system. A regional counter-terrorism adviser will be posted to Asunción for the first time. The moves sit under Washington's \"Shield of the Americas\" framework.", "image_url": "https://www.lanacion.com.py/resizer/v2/4LRIJB75BFFY3GIJ4T6WR3ZOWE.jpg?auth=804acf82f64643866618748f6e01cc6fef1d54bf3014f0f25277ad1be9cf4b17&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay becomes the 26th signatory of the US-led Pax Silica AI supply-chain coalition (2026-10-23)", "date": "2026-10-23", "source_url": "https://www.abc.com.py/internacionales/2026/10/23/paraguay-se-une-a-pax-silica-la-alianza-de-eeuu-para-la-cadena-de-suministro-de-la-ia/", "source_name": "ABC Color", "summary": "President Peña announced on 23 October that Paraguay had joined Pax Silica, the US-led coalition on artificial-intelligence supply chains, becoming its 26th signatory. Foreign Minister Rubén Ramírez Lezcano and US Under Secretary for Economic Affairs Jacob Helberg signed the declaration at the State Department. Peña framed the move as part of a shift \"from being technology consumers to technology producers\", leveraging Paraguay's hydropower and critical minerals. The accession complements the data-centre and semiconductor-supply discussions held during his Washington visit and deepens Paraguay's alignment with US technology policy, a stance that carries explicit risk in its relations with China.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/3db6e14/2147483647/strip/true/crop/1120x630+32+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fde%2F5d%2F682717d345b19349c07683188a15%2Fruben-ramirez-lezcano-y-el-subsecretario-de-estado-e-eeuu-jacob-helberg.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Peña pledges critical-minerals supply cooperation with US Treasury Secretary Bessent (2026-10-22)", "date": "2026-10-22", "source_url": "https://www.abc.com.py/internacionales/2026/10/22/presidente-de-paraguay-se-compromete-a-fortalecer-suministro-de-minerales-criticos-de-eeuu/", "source_name": "ABC Color", "summary": "During his 21-23 October visit to Washington, President Peña met Treasury Secretary Scott Bessent and committed Paraguay to strengthening critical-minerals supply chains for the United States. He also spoke at George Washington University and at the Inter-American Dialogue at the OAS. US officials confirmed a USD 12 million investment by Uranium Energy Corp in Paraguay and discussed the exploration of uranium and rare-earth elements. The visit included a reported private meeting with CIA Director John Ratcliffe on the anti-drug office to be installed in Asunción. The minerals agenda is the commercial counterpart to the security and AI-supply-chain agreements announced the same week.", "image_url": "https://www.lanacion.com.py/resizer/v2/EVEOXASOW5C33DV2M3CYSSW4DA.jpg?auth=aead038e12320e0552a2d6a7abd27d3f357b9fa20769e5c79af262fbebb2c7e0&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Brazil questions Paraguay's use of Itaipú for data centres; ANDE chief says Asunción need not consult Brasília (2026-10-23)", "date": "2026-10-23", "source_url": "https://www.abc.com.py/economia/2026/10/23/paraguay-tiene-que-comunicarle-a-brasil-baez-responde-a-las-criticas-brasilenas-por-decisiones-sobre-itaipu/", "source_name": "ABC Color", "summary": "After ANDE signed a 15-year supply contract of up to 286 MW with Kuntur (Araico) for a data centre, Brazilian media and politicians argued that Paraguay was diverting Itaipú surplus away from the Brazilian market, with some claiming the country had \"sold half of Itaipú\". ANDE president Miguel Báez rejected the criticism, saying Paraguay does not need Brazil's authorisation to use its own 50% share of the binational plant. Itaipú clarified that each margin may receive foreign authorities and that the treaty guarantees each country half of the energy. President Peña said there had been no progress on the Annex C tariff review; the provisional tariff remains USD 19.28 per kW-month for 2024-2026, while Paraguay seeks a three-to-five-year medium-term tariff from 2027.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/6831e6b/2147483647/strip/true/crop/762x429+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F28%2Ff3%2Fd2fc9b1b414298faef6bb6e72726%2Flula-da-silva-y-santiago-pena-negocian-la-tarifa.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Taiwan-Paraguay Polytechnic University advances in Luque with USD 20 million in non-reimbursable cooperation; opening set for July 2027 (2026-10-24)", "date": "2026-10-24", "source_url": "https://www.lanacion.com.py/politica_edicion_impresa/2026/10/24/avanza-la-construccion-de-la-universidad-politecnica-taiwan-paraguay-en-luque/", "source_name": "La Nación", "summary": "Construction of the Taiwan-Paraguay Polytechnic University in Luque is advancing: 20,000 square metres, about 40 classrooms and 13 laboratories, financed with roughly USD 20 million of non-reimbursable Taiwanese cooperation. The project was agreed in 2018 with National Taiwan University of Science and Technology and is due to open in July 2027. It currently trains about 300 students, and more than 800 Paraguayans have received scholarships in Taiwan. The campus is part of the technological cooperation package that includes Yguazú Digital and the Taiwan-Paraguay industrial park, and it comes as Asunción reaffirms its diplomatic recognition of Taipei after China's 12 October sanctions on MITIC minister Gustavo Villate.", "image_url": "https://www.lanacion.com.py/resizer/v2/5T3PHKGXZVAY3KT2CQGBJIGRI4.jpg?auth=ec55a7e0d98db52fac5b9a1faacffb0f3a1b1fc436a1975c0af593daa8e3fd41&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "V. Industry Focus: Telecom, Digital Energy & AI", "tier": 1, "events": [{"title": "Crusoe and Araico announce Latin America's first Crusoe AI data centre in Paraguay, powered by Itaipú and scalable to 280 MW (2026-10-22)", "date": "2026-10-22", "source_url": "https://www.infobae.com/america/agencias/2026/10/22/la-fabrica-de-ia-crusoe-construira-en-paraguay-un-centro-de-datos-alimentado-con-itaipu/", "source_name": "Infobae / EFE", "summary": "US firm Crusoe Energy and Paraguayan group Araico announced on 22 October the construction of Crusoe's first Latin American data centre, powered by Itaipú energy and connected to the ANDE grid. The first phase is estimated at USD 300 million for 6 MW and about 2,000 Nvidia Blackwell AI processors, with construction starting in March 2027 and initial operation in mid-2027. Capacity is designed to scale to 106 MW of technology infrastructure and up to 280 MW in the long term, within the \"Iguazú AI City\" campus in Colonia Yguazú, Alto Paraná, near the Yguazú substation. The project is backed by a power-purchase agreement with ANDE at a reported USD 45-48/MWh at 220 kV with a 2.5% annual adjustment. US officials called it potentially one of the largest private investments in Paraguay's history.", "image_url": "https://www.infomoney.com.br/wp-content/uploads/2026/10/Santiago-Pena-_-Itaipu.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "ANDE signs a 15-year PPA with Kuntur (Araico) for up to 286 MW at USD 48.91-56.39/MWh (2026-10-21)", "date": "2026-10-21", "source_url": "https://rcc.com.py/nacionales/negocio-rentable-o-techo-legal-ajustado-ande-compromete-280-mw-para-centro-de-datos-en-medio-de-advertencias-sindicales/", "source_name": "RCC", "summary": "ANDE formalised resolution 52552/2026 approving a 15-year power-purchase contract with Kuntur, an Araico affiliate, for up to 286 MW to supply a data-centre campus, at tariffs of USD 48.91-56.39/MWh. The contract is one of the largest long-term electricity commitments ever signed by the state utility and is tied to the Crusoe-Araico project. The ANDE workers' union Sitrande questioned the preferential treatment and warned about the impact on the grid and on energy sovereignty, while Brazilian actors raised concerns about the use of Itaipú surplus. The resolution also raises questions about whether the commitment fits within the legal ceiling for ANDE's long-term contracts and about who bears the cost of network reinforcements.", "image_url": "https://cdn.rcc.com.py/2026/10/ANDE-EMPRESA-IA.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Peña meets Anthropic's Teresa Carlson and presents the Yguazú Digital 10 MW to 1 GW AI campus (2026-10-23)", "date": "2026-10-23", "source_url": "https://www.lanacion.com.py/politica/2026/10/23/santiago-pena-explora-alianzas-de-inteligencia-artificial-con-anthropic-en-ee-uu/", "source_name": "La Nación", "summary": "On 23 October President Peña met Teresa Carlson, Anthropic's global head of public sector, to explore cooperation on artificial intelligence and presented the Yguazú Digital project developed with Taiwan. The campus is planned in three phases of 10 MW, 100 MW and 1,000 MW of operating capacity, combining Paraguayan energy with Taiwanese technology and investment. The meeting took place during Peña's Washington visit, alongside the Pax Silica accession and the critical-minerals talks. MITIC minister Gustavo Villate has said the Taiwan technology projects, including Yguazú Digital, the technology park and the polytechnic university, will continue despite China's 12 October countermeasures against him.", "image_url": "https://www.lanacion.com.py/resizer/v2/ZN6AS3VCDNHHTNPWN7ZPCDUMDU.jpeg?auth=e923d70cf28a1ae09370d921973db26ac758a78f23b0d5761e76d631787d6553&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Deputies request ANDE reports on telecom operators' use of its poles for fibre and aerial cabling (2026-10-22)", "date": "2026-10-22", "source_url": "https://diputados.gov.py/noticias/noticias/3145", "source_name": "Chamber of Deputies", "summary": "The Chamber of Deputies approved a request for information to ANDE on the use of its poles by telecom, fibre-optic, cable and internet companies, covering contracts, revenue, maintenance costs and the risks of aerial cabling. The request reflects growing scrutiny of the shared-infrastructure regime as fibre and 5G deployments accelerate and operators seek faster, cheaper ways to reach new areas. For operators, the outcome could affect pole-access fees and deployment timelines; for ANDE, it is an opportunity to formalise a revenue stream that has been largely informal. The information request does not change the rules yet but signals that Congress intends to legislate on passive infrastructure.", "image_url": "https://diputados.gov.py/storage/noticias/lHaemPnaGfbFxdquPCBF0qzC5iBxVyt70ZXBN1zE.jpg", "is_gov_source": true, "is_authoritative": true}, {"title": "Conatel extends the public consultation on the 2026-2030 National Telecom Plan, targeting 30% 5G coverage and USD 2.31 billion in capex (2026-10-22)", "date": "2026-10-22", "source_url": "https://dplnews.com/conatel-amplia-consulta-publica-plan-nacional-telecomunicaciones-2026-2030-paraguay/", "source_name": "DPL News", "summary": "Conatel extended the public consultation on the draft 2026-2030 National Telecommunications Plan, which is built on three pillars: infrastructure and coverage, quality and regulation, and affordability and digital inclusion. The plan targets 30% population coverage for 5G, 95.6% for 4G and 265 districts connected to a fibre-optic backbone by 2030, with estimated capital expenditure of USD 2.313 billion. The extension gives operators and industry groups more time to comment on spectrum, deployment obligations and passive-infrastructure rules. It follows criticism from the mobile operators' chamber over the design of the eight sub-bands in the 3.5 GHz band and the exclusion of Chinese equipment from the 5G tender.", "image_url": "https://dplnews.com/wp-content/uploads/2026/06/Gemini_Generated_Image_2s4av12s4av12s4a-1024x572.png", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "VI. Key Client Developments", "tier": 1, "events": [{"title": "Nubicom activates 34 5G sites but relies on Ufinet fibre and Copaco/Vox sites; only two subscribers (2026-10-23)", "date": "2026-10-23", "source_url": "https://www.telesemana.com/blog/2026/10/23/nubicom-despliega-5g-en-paraguay-con-infraestructura-de-terceros-pese-a-las-controversias/", "source_name": "Telesemana", "summary": "Nubicom has activated 34 5G radio bases, above the 20-22 required for its first year: 28 in Asunción, two in Lambaré, two in Fernando de la Mora and two in Luque. Thirty-three sites use Nokia equipment and one uses Tejas Networks, a Rakuten subsidiary, pointing to a possible Open RAN architecture. The company leases 100 Gbps backbone links from Ufinet and uses Copaco/Vox sites, so most of its transport and real estate is third-party. Nubicom has declared USD 24 million for its core and 157 radio bases, of which USD 13.5 million corresponds to the 34 inspected sites and the core. It holds 200 MHz in 3.5 GHz but has only two active subscribers, probably fixed-wireless access, and is not obliged to offer mobile telephony during its first five years.", "image_url": "https://www.telesemana.com/wp-content/uploads/2014/01/antena7.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom"}, {"title": "Comptroller questions Nubicom's commercial operation; Conatel says the licence could be revoked if service is not proven (2026-10-21)", "date": "2026-10-21", "source_url": "https://www.nanduti.com.py/contraloria-podria-impulsar-la-cancelacion-de-la-licencia-5g-de-nubicom", "source_name": "Ñandutí / ABC Color", "summary": "Conatel declared that Nubicom had met its initial 5G deployment obligation, but admitted that coverage is limited and that the company had only two subscribers. The Comptroller General's Office questioned whether commercial service is effectively being provided and warned that the licence could be revoked if Nubicom fails to demonstrate it. Senator Rafael Filizzola alleged corruption in the award and said Paraguay could lose close to USD 200 million in expected investment. Conatel defended its autonomy and said it is monitoring the case. The dispute matters for the market because Nubicom is one of four 5G licence holders and its failure would leave a large block of 3.5 GHz spectrum underused.", "image_url": "https://cloudfront-us-east-1.images.arcpublishing.com/abccolor/ZJOLM2JHM5CF7IQH6BCI7AOS7U.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom"}, {"title": "Personal offers 15 days of free calls and internet in flood shelters in Ayolas and Ciudad del Este (2026-10-21)", "date": "2026-10-21", "source_url": "https://diarioparaguayo.com/noticia/personal-habilita-llamadas-gratuitas-por-15-dias-y-ofrece-internet-en-albergues-de-zonas-afectadas-por-inundaciones", "source_name": "Diario Paraguayo", "summary": "Personal, operated by Núcleo S.A., enabled 15 days of free calls and provided internet connectivity in shelters in Ayolas and Ciudad del Este for families affected by the Paraná river and Acaraymí stream floods. The measure covers both its mobile and fixed networks and is part of the operator's emergency-response protocol. Beyond the social dimension, the episode tests network resilience in the south and east, where flooding has disrupted roads and power. Personal is also the operator that must present its detailed 5G engineering plan within 90 days of its August licence and activate its first 5G radio base by February 2027.", "image_url": "https://diarioparaguayo.com/uploads/news/news_1792382452_6476a423.webp", "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal"}, {"title": "Claro leads Paraguay's 5G coverage with 23.75% nationally and 77.7% in Asunción (latest available data, October 2026)", "date": "2026-10-23", "source_url": "https://mobiletime.la/noticias/23/09/2026/claro-4g-y-5g-en-paraguay/", "source_name": "Mobile Time / nPerf", "summary": "The nPerf barometer places Claro first in both 4G and 5G coverage in Paraguay, with 86.67% national 4G coverage, 23.75% national 5G coverage and 77.7% 5G coverage in Asunción. Claro launched the country's first commercial 5G network in December 2025 with a USD 35 million investment and Nokia equipment, and has extended coverage to 12 cities including Gran Asunción, Ciudad del Este, Encarnación, Coronel Oviedo, Pedro Juan Caballero, Villarrica, Hernandarias and Cambyretá. The company says it has exceeded its licence obligations in the central area. The main constraint on mass adoption is now the installed base of 5G-compatible devices rather than network coverage.", "image_url": "https://mobiletime.la/wp-content/uploads/2026/01/pilot-infra1RDZ.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Claro"}], "impact_analysis": "", "user_notes": ""}, {"title": "VII. Integrated Impact Analysis for Business Operations", "tier": 2, "events": [], "impact_analysis": "🟡 The exchange rate is now the binding constraint, not inflation. The guaraní closed the week at G. 5,764.73-5,776.68 per dollar (BCP, 23 October), after touching about G. 5,694 on 13 October, and has appreciated 11.9% year-to-date through September. The BCP held the policy rate at 5.50% on 23 October with inflation at 1.7% and core at 1.5%, and its October survey cut the end-2026 rate forecast to G. 5,905 from G. 6,100 a month earlier. For any operation with dollar revenue and guaraní costs, margins compress mechanically every month; for the Treasury, the same appreciation cut trade taxes by 11% and Itaipú royalties by 25.9% through September. Hedging is no longer optional, and contracts priced at G. 6,300-6,600 in 2025 are already loss-making on conversion.\n\n🟡 The fiscal deterioration is structural and the 2027 budget does not close it. The January-September deficit reached 2.0% of GDP (G. 7.82 trillion, USD 1,257.8 million), or about 3.0% annualised, against an original 1.5% target; the MEF projects 3.2% for 2026 and the 2027 draft assumes 3.9% under an exceptional escape from the fiscal rule. Revenue grew only 1.6%, wages, pensions and debt service absorb close to 70% of financing, and the Caja Fiscal deficit exceeds 43% of its annual budget. The 2027 budget adds USD 2.1 billion of new debt and a 5% teacher raise worth USD 47 million. Suppliers to the public sector should expect slower payment cycles and more pressure to accept Treasury paper or renegotiated terms.\n\n🟡 The data-centre and energy boom is real but carries regulatory and political risk. Crusoe and Araico announced a USD 300 million first phase (6 MW, about 2,000 Nvidia Blackwell processors, operating from mid-2027) scalable to 280 MW, backed by an ANDE 15-year contract of up to 286 MW at USD 48.91-56.39/MWh. The project is one of the largest private investments in Paraguay's history, but the ANDE union, Brazilian politicians and the Comptroller have all raised questions about preferential tariffs, grid capacity and the use of Itaipú surplus. The Annex C tariff review remains unresolved, with the provisional USD 19.28/kW-month rate extended for 2024-2026 and Paraguay seeking a three-to-five-year medium-term tariff from 2027. Any energy-intensive project should model a tariff renegotiation scenario and secure firm transmission capacity.\n\n🟡 Security and climate risks are concentrated in Alto Paraná and the south. The PCC-linked attack in Pedro Juan Caballero on 19 October, the Minga Guazú raids on 20 October and the SENAD operations in Canindeyú and Asunción show that organised crime remains active along the Brazilian border and in the capital's retail drug trade. The Paraná flood affected 4,253 families in four departments, displaced 1,988 and closed 14 migration posts, disrupting roads and port access. The US INL office and the USD 11.75 million security package announced on 21 October may improve coordination over time but will not change the operating picture in the next two quarters.\n\n🟢 Telecom offers the clearest near-term commercial opportunity. Claro leads 5G coverage at 23.75% nationally and 77.7% in Asunción; Tigo and Personal must activate their first 5G radio bases by February 2027 and plan 250-500 sites and about USD 79 million of joint investment; Nubicom has 34 sites but only two subscribers and is under Comptroller scrutiny; the 2026-2030 National Telecom Plan targets 30% 5G coverage and USD 2.313 billion of capex. The 3.5 GHz sub-band auction and the exclusion of Chinese equipment remain the main structural barriers for Chinese vendors, while passive-infrastructure rules (ANDE poles) and the PNT consultation are the near-term policy levers.", "user_notes": ""}, {"title": "VIII. Targeted Recommendations for Chinese Enterprises", "tier": 2, "events": [], "impact_analysis": "🔴 Protect revenue before anything else. With the guaraní at G. 5,764-5,777 and the BCP forecasting only G. 5,905 by December, dollar-revenue operations should lock in forward contracts now, re-price or re-denominate 2025-vintage contracts signed at G. 6,300-6,600, and add exchange-rate clauses to new EPC, service and supply agreements. The BCP's forward window has grown as local exporters reach the same conclusion; the cost of hedging is far below the cost of realising another 5-10% appreciation. For guaraní-revenue operations, the same move protects margins against a rebound if US rates stay higher for longer.\n\n🟡 Treat public-sector exposure as credit risk. The January-September deficit is 2.0% of GDP (3.0% annualised), the 2027 budget assumes 3.9%, and the MEF projects 3.2% for 2026 against a 1.5% rule. Payment delays, Treasury paper and renegotiation requests are likely. Prioritise private clients, require guarantees or escrow for public contracts, and stress-test receivables against a 90-180 day delay. The 2027 budget's health allocation (62% of the increase, 78% to arrears) may unlock some health-sector payments, but the overall fiscal squeeze is not easing.\n\n🟡 Engage the energy and data-centre pipeline early, with political-risk pricing. The Crusoe-Araico project (USD 300 million first phase, 280 MW long-term) and the ANDE 15-year PPA at USD 48.91-56.39/MWh create procurement demand for substations, cooling, fibre, backup power and construction services. But the ANDE union, Brazilian politicians and the Comptroller are contesting preferential tariffs and Itaipú use, and the Annex C review is unresolved. Bid only with firm transmission capacity, clear curtailment rules and a tariff-renegotiation scenario; avoid contracts that assume the current preferential rate survives to 2030.\n\n🔴 Manage the Taiwan-China fault line explicitly. China sanctioned MITIC minister Gustavo Villate on 12 October over his Taiwan ties, and Paraguay responded by reaffirming its recognition of Taipei and joining the US-led Pax Silica coalition on 23 October. Chinese enterprises should avoid any commercial or personal exposure to sanctioned individuals and should not assume that Paraguay's Taiwan relationship will change in the near term. The exclusion of Chinese equipment from the 5G tender is a structural barrier; focus on non-RAN segments (fibre, power, data-centre fit-out, enterprise IT) where the restriction does not bind, and keep a clear compliance file for US secondary-sanctions exposure.\n\n🟢 Prioritise the telecom rollout and digital-infrastructure supply chain. Tigo and Personal must activate their first 5G sites by February 2027 and plan 250-500 sites and about USD 79 million; Claro is expanding from 12 cities; Nubicom has 157 radio bases to deploy but only two subscribers and regulatory risk. The PNT 2026-2030 targets 265 districts with fibre backbone, 95.6% 4G and 30% 5G coverage, with USD 2.313 billion of capex. The ANDE pole-access review and the PNT consultation are the immediate policy windows; position for passive infrastructure, fibre, power and O&M work rather than spectrum-dependent RAN.\n\n🟡 Build security and climate contingency into delivery schedules. Alto Paraná (Pedro Juan Caballero, Minga Guazú) and the southern flood corridor are the main operational risks; the Paraná flood displaced 1,988 families and closed 14 migration posts. Site security, convoy rules, insurance and alternate logistics routes should be standard for projects in those areas, and delivery schedules should carry weather and road-access buffers for the November-April rainy season.", "user_notes": ""}]}};

function renderFXDailyTable(d,unit){
  var DM=[31,28,31,30,31,30,31,31,30,31,30,31],dl=d.line||[];

  var dates=[],day=1,mo=0,yr=2023;

    day++;var dim=DM[mo];if(mo===1&&yr%4===0)dim=29;

function toggleDataTable(btn){
  var wrap=btn.nextElementSibling;
  if(wrap.style.display==='none'){wrap.style.display='block';btn.innerHTML=btn.innerHTML.replace('查看','隐藏').replace('View','Hide').replace(' ▼',' ▲');}
  else{wrap.style.display='none';btn.innerHTML=btn.innerHTML.replace('隐藏','查看').replace('Hide','View').replace(' ▲',' ▼');}
}
function closeMacroModal(e){
  if(e&&e.type==='keydown'){if(e.key!=='Escape')return;}
  else if(e&&e.target&&!e.target.closest('#macroModal'))return;
  var m=document.getElementById('macroModal');if(m){m.remove();document.removeEventListener('keydown',onMacroModalKey);}
}
function onMacroModalKey(e){if(e.key==='Escape')closeMacroModal(e);}

function renderAll(){
  if(!briefingData)return;
  var d=briefingData;
  document.getElementById('headerSubtitle').textContent=(d.topic||'')+' · '+(d.time_span||'');

  var sections=d.sections||[],tier1=[],tier2=[];
  for(var i=0;i<sections.length;i++){
    if(sections[i].tier===2)tier2.push(sections[i]);else tier1.push(sections[i]);
  }
  var total=0;
  for(var i=0;i<tier1.length;i++)total+=(tier1[i].events||[]).length;

  var pills='<div class="stats-row-total"><div class="stat-pill pill-total" onclick="scrollToSec(null)"><span class="pill-label">'+L('全部事件','All Events')+'</span><span class="pill-count">'+total+'</span></div></div>';
  for(var row=0;row<2;row++){
    pills+='<div class="stats-row-sections">';
    for(var col=0;col<3;col++){
      var idx=row*3+col;if(idx>=tier1.length)break;
      var sec=tier1[idx],c=PCOL[idx],cnt=(sec.events||[]).length;
      pills+='<div class="stat-pill" style="background:'+c.bg+';color:'+c.text+';" onclick="scrollToSec('+idx+')"><span class="pill-dot" style="background:'+c.dot+'"></span><span class="pill-label">'+stripNum(sec.title)+'</span><span class="pill-count">'+cnt+'</span></div>';
    }
    pills+='</div>';
  }
  document.getElementById('statsRow').innerHTML=pills;

  var html=renderMacroDashboard();
  for(var i=0;i<tier1.length;i++)html+=renderSection(tier1[i],i);
  if(tier2.length>0&&tier1.length>0){
    html+='<div class="tier-divider"><span>'+L('形势分析与行动建议','Analysis & Recommendations')+'</span></div>';
  }
  for(var j=0;j<tier2.length;j++)html+=renderSection(tier2[j],tier1.length+j);
  document.getElementById('contentArea').innerHTML=html;
}

function renderSection(sec,idx){
  var events=sec.events||[],isT2=sec.tier===2;
  var g=GRAD[idx%8],icon=ICONS[idx%8];
  var body='';
  if(isT2||events.length===0){
    if(sec.impact_analysis)body='<div class="analysis-body">'+fmt(sec.impact_analysis)+'</div>';
    else if(!isT2)body='<div style="padding:4px 22px 16px;color:#94A3B8;font-size:13px;">'+L('暂无此时间段内的事件','No events in this period')+'</div>';
  }else{
    var cards='';
    for(var i=0;i<events.length;i++)cards+=renderCard(events[i],g[0],g[1],icon);
    body='<div class="events-grid">'+cards+'</div>';
  }
  var badge=events.length>0?'<span class="badge">'+events.length+L(' 条事件',' events')+'</span>':'';
  return '<div class="section s'+(idx%8)+(isT2?' tier2':'')+'" id="sec-'+idx+'"><div class="section-header"><h2>'+esc(sec.title||'')+'</h2>'+badge+'</div>'+(sec.description?'<div class="section-desc">'+esc(sec.description)+'</div>':'')+body+'</div>';
}
