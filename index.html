<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paraguay Briefing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#F0F4FF;color:#1E293B;line-height:1.6;min-height:100vh}
a{color:#3B82F6;text-decoration:none}a:hover{text-decoration:underline}
.header{background:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;border-bottom:3px solid #3B82F6}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;flex-shrink:0}
.header-left h1{font-size:20px;font-weight:700;color:#1E293B}
.header-left .subtitle{font-size:12px;color:#64748B;margin-top:2px}
.header-right{display:flex;gap:8px;align-items:center}
.btn-lang{background:#EEF2FF;color:#4F46E5;font-weight:700;font-size:12px;padding:8px 14px;border-radius:20px;border:none;cursor:pointer}
.btn-lang:hover{background:#E0E7FF}
.btn-primary{background:#3B82F6;color:#fff;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-primary:hover{background:#2563EB;transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.3)}
.btn-secondary{background:#F1F5F9;color:#475569;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:#E2E8F0}
.btn-sm{font-size:11px;padding:6px 12px}
.update-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:moFade .2s}
.update-modal{background:#fff;border-radius:14px;padding:24px 28px;width:440px;max-width:90vw;box-shadow:0 24px 80px rgba(0,0,0,.25);animation:moZoom .25s}
.update-modal h3{font-size:17px;font-weight:700;color:#1E293B;margin-bottom:16px}
.update-modal label{display:block;font-size:12px;font-weight:600;color:#64748B;margin-bottom:4px}
.update-modal select,.update-modal input{width:100%;padding:8px 12px;border:1px solid #CBD5E1;border-radius:8px;font-size:13px;margin-bottom:14px;color:#1E293B;background:#fff}
.update-modal .btn-row{display:flex;gap:8px;justify-content:flex-end}
.time-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.time-preset{padding:5px 12px;border-radius:14px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #CBD5E1;background:#fff;color:#64748B;transition:all .12s}
.time-preset:hover,.time-preset.active{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.history-list{max-height:300px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid #E2E8F0;border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.history-item:hover{background:#F8FAFC;border-color:#CBD5E1}
.history-item .hi-title{font-weight:600;font-size:13px;color:#1E293B}
.history-item .hi-meta{font-size:11px;color:#94A3B8}
.history-item .hi-count{font-size:11px;font-weight:600;color:#3B82F6;background:#EEF2FF;padding:2px 8px;border-radius:10px}
.loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid #CBD5E1;border-top-color:#3B82F6;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.standalone-banner{background:#FEF3C7;color:#92400E;text-align:center;padding:6px 16px;font-size:12px;border-bottom:1px solid #FDE68A;display:none}
.standalone-banner code{background:#FDE68A;padding:1px 5px;border-radius:3px;font-size:11px}

.stats-row{max-width:1400px;margin:0 auto;padding:12px 32px 16px;display:flex;flex-direction:column;gap:8px}
.stats-row-total{display:flex;justify-content:center}
.stats-row-sections{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:768px){.stats-row-sections{grid-template-columns:repeat(2,1fr)}}
.stat-pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;cursor:pointer;transition:all .2s;border:2px solid transparent;font-size:13px;font-weight:600;user-select:none;min-width:0}
.stat-pill:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.pill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pill-label{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-count{font-size:14px;font-weight:700;margin-left:auto;flex-shrink:0;background:rgba(255,255,255,.5);padding:1px 8px;border-radius:10px}
.stat-pill.pill-total{background:#1E293B;color:#fff;font-weight:700;border-radius:24px;display:inline-flex}
.stat-pill.pill-total .pill-count{background:rgba(255,255,255,.2)}

.content{max-width:1400px;margin:0 auto;padding:0 32px 60px}
.section{background:#fff;border-radius:14px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden;border-top:4px solid #3B82F6}
.section.s0{border-top-color:#3B82F6}.section.s1{border-top-color:#EF4444}.section.s2{border-top-color:#10B981}
.section.s3{border-top-color:#8B5CF6}.section.s4{border-top-color:#06B6D4}.section.s5{border-top-color:#F59E0B}
.section.s6{border-top-color:#6366F1}.section.s7{border-top-color:#EC4899}.section.tier2{background:#FAFBFC}
.section-header{padding:16px 22px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-header h2{font-size:16px;font-weight:700;color:#1E293B}
.section-header .badge{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;background:#F1F5F9;color:#64748B;white-space:nowrap}
.section-desc{padding:4px 22px 10px;font-size:12px;color:#94A3B8}
.events-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 22px 18px}
@media(max-width:860px){.events-grid{grid-template-columns:1fr}.event-card{flex-direction:column}.event-card .event-img{width:100%!important;min-height:120px;max-height:180px}}
.event-card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;transition:all .2s;display:flex}
.event-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-1px);border-color:#CBD5E1}
.event-card .event-img{width:160px;min-height:140px;flex-shrink:0;position:relative;overflow:hidden}
.event-card .event-img img{width:100%;height:100%;object-fit:cover;display:block}
.event-card .event-img .img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.event-card .event-body{padding:12px 15px;flex:1;min-width:0;display:flex;flex-direction:column}
.event-card .event-meta{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.event-card .event-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.event-tag.date{background:#F1F5F9;color:#64748B}.event-tag.gov{background:#DCFCE7;color:#15803D}
.event-tag.auth{background:#DBEAFE;color:#1D4ED8}.event-tag.source{background:#FEF3C7;color:#A16207}
.event-tag.client{background:#FCE7F3;color:#BE185D}
.event-card .event-preview{font-size:13px;color:#334155;line-height:1.6;flex:1;overflow:visible;max-height:none}
.event-card .event-link{font-size:11px;margin-top:6px;color:#3B82F6;font-weight:500}
.analysis-body{padding:4px 22px 20px;font-size:13px;line-height:1.8;color:#334155}
.analysis-body h3{font-size:15px;font-weight:700;margin:14px 0 6px;color:#1E293B}
.analysis-body ul{padding-left:0;list-style:none}
.analysis-body li{padding:2px 0 2px 18px;position:relative}
.analysis-body li::before{content:"•";position:absolute;left:2px;color:#3B82F6;font-weight:bold}
.tier-divider{text-align:center;padding:16px 0 8px;margin:8px 0}
.tier-divider span{background:linear-gradient(135deg,#3B82F6,#6366F1);color:#fff;padding:8px 28px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(59,130,246,.25)}
.footer{text-align:center;padding:20px 32px 40px;color:#94A3B8;font-size:12px;max-width:1400px;margin:0 auto}
.macro-dashboard{background:#fff;border-radius:14px;margin-bottom:18px;padding:16px 22px 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-top:4px solid #1E293B}
.macro-title{font-size:15px;font-weight:700;color:#1E293B;margin-bottom:2px}
.macro-period{font-size:11px;font-weight:400;color:#94A3B8;margin-left:6px}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media(max-width:900px){.macro-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.macro-grid{grid-template-columns:1fr}}
.macro-card{background:#F8FAFC;border-radius:8px;padding:10px 8px 4px;border:1px solid #E2E8F0}
.macro-card-title{font-size:10.5px;font-weight:600;color:#475569;margin-bottom:4px;text-align:center;line-height:1.3;min-height:28px;display:flex;align-items:center;justify-content:center}
.macro-card{position:relative}
.macro-source{position:absolute;top:6px;right:8px;font-size:7.5px;color:#94A3B8;font-weight:500;background:#fff;padding:1px 5px;border-radius:3px;border:1px solid #E2E8F0;z-index:1;pointer-events:none}
.macro-latest{display:flex;justify-content:center;align-items:baseline;gap:4px;margin-top:2px;padding:3px 0}
.macro-latest-label{font-size:9px;color:#94A3B8;font-weight:500}
.macro-latest-val{font-size:15px;font-weight:700;color:#1E293B}
.macro-latest-unit{font-size:9px;color:#64748B;font-weight:500}
.macro-latest-date{font-size:9px;color:#94A3B8}
.macro-note{font-size:9px;color:#94A3B8;margin-top:1px}
.macro-card{cursor:pointer;transition:transform .15s,box-shadow .15s}
.macro-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.macro-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:moFade .2s}
.macro-modal-card{background:#fff;border-radius:16px;padding:24px 28px 18px;width:680px;max-width:94vw;max-height:90vh;overflow-y:auto;cursor:default;box-shadow:0 24px 80px rgba(0,0,0,.25);position:relative;animation:moZoom .25s}
.macro-modal-card .macro-card{border:none;padding:0;background:transparent;cursor:default}
.macro-modal-card .macro-card:hover{transform:none;box-shadow:none}
.macro-modal-card .macro-card-title{font-size:15px;min-height:auto;margin-bottom:10px}
.macro-modal-card .macro-legend,.macro-modal-card [style*=legend]{font-size:11px!important}
.macro-modal-close{position:absolute;top:10px;right:16px;font-size:26px;cursor:pointer;color:#94A3B8;background:none;border:none;line-height:1;z-index:10;padding:4px 8px;border-radius:6px}
.macro-modal-close:hover{color:#475569;background:#F1F5F9}
.macro-data-section{margin-top:14px;border-top:1px solid #E2E8F0;padding-top:10px}
.macro-data-toggle{background:#F8FAFC;border:1px solid #CBD5E1;padding:6px 16px;border-radius:6px;font-size:12px;color:#64748B;cursor:pointer;font-weight:500}
.macro-data-toggle:hover{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.macro-data-table-wrap{margin-top:10px;max-height:340px;overflow-y:auto;border:1px solid #E2E8F0;border-radius:8px}
.macro-data-table{width:100%;border-collapse:collapse;font-size:12px}
.macro-data-table th{background:#F8FAFC;padding:7px 12px;text-align:right;font-weight:600;color:#475569;border-bottom:2px solid #E2E8F0;position:sticky;top:0}
.macro-data-table th:first-child{text-align:left}
.macro-data-table td{padding:5px 12px;text-align:right;border-bottom:1px solid #F1F5F9;color:#334155;font-variant-numeric:tabular-nums}
.macro-data-table td:first-child{text-align:left;color:#64748B;font-weight:500}
.macro-data-table tbody tr:hover td{background:#EEF2FF}
.macro-na{color:#CBD5E1!important}
@keyframes moFade{from{opacity:0}to{opacity:1}}
@keyframes moZoom{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:768px){.header{padding:14px 16px}.header-left h1{font-size:16px}.stats-row{padding:10px 14px;gap:6px}.stat-pill{padding:8px 12px;font-size:12px}.pill-label{font-size:11px}.content{padding:0 12px 40px}.section-header{padding:12px 14px 0}.events-grid{grid-template-columns:1fr;padding:4px 14px 14px}}
</style>
</head>
<body>

<div class="standalone-banner" id="standaloneBanner">Offline mode · Run <code>python3 web_app.py</code> for live updates</div>

<header class="header">
  <div class="header-left"><div class="header-logo">PY</div><div><h1>巴拉圭简报</h1><div class="subtitle" id="headerSubtitle"></div></div></div>
  <div class="header-right"><button class="btn-secondary" id="btnMacro" onclick="openMacroModal()" title="Update CPI/RIN">Macro</button><button class="btn-secondary" id="btnHistory" onclick="showHistory()">History</button><button class="btn-primary" id="btnUpdate" onclick="refreshBriefing()">Refresh</button><button class="btn-lang" id="langBtn" onclick="switchLanguage()">中文</button></div>
</header>

<div class="stats-row" id="statsRow"></div>
<div class="content" id="contentArea"></div>
<div class="footer">Paraguay Briefing · Data sourced from public news and government websites</div>

<script>

window.EMBEDDED_BRIEFINGS = {"zh": {"topic": "巴拉圭简报", "time_span": "2026年10月26日 — 2026年10月31日", "time_label": "最近一周", "tiers": [{"name": "Part I: Key News & Developments", "description": "Macro economy, politics, social security, international relations, industry and key client movements in Paraguay"}, {"name": "Part II: Analysis & Recommendations", "description": "Enterprise impact assessment and China-specific strategic recommendations"}], "sections": [{"title": "一、宏观经济动态", "tier": 1, "events": [{"title": "巴拉圭央行将政策利率维持在5.50%，并将2026年增长预测上调至5.0%（2026-10-30）", "date": "2026-10-30", "source_url": "https://www.lanacion.com.py/negocios/2026/10/30/bcp-reafirma-neutralidad-de-su-politica-monetaria-ante-economia-dinamica-y-precios-controlados/", "source_name": "La Nación / BCP", "summary": "巴拉圭央行货币政策委员会将政策利率维持在5.50%，并重申中性立场，9月年通胀率为1.7%（月度0.1%，核心通胀率1.5%），根据月度经济活动指数（IMAEP）衡量，8月经济活动同比增长6.7%。巴拉圭央行将其2026年GDP增长预测从4.5%上调至5.0%，受服务业、电力与供水推动，并将2026年底通胀预测从3.3%下调至3.0%，核心通胀预测从2.8%下调至2.2%。中期预期仍锚定在3.5%。委员会指出外部风险来自中东地缘政治紧张局势、能源价格和美国利率上升，并将下次会议定于11月20日。稳定的利率和强劲的经济活动支持内需、信贷和电信/数据消费。", "image_url": "https://www.lanacion.com.py/resizer/v2/A6X6CR3KQZEQXPMHUR3DSSSLFQ.jpg?auth=6360e928b9bba35b138e75665d398dad03ce9e9d8a3123ef5eba0193734673af&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "瓜拉尼反弹，政府与企业团体设立常设外汇技术工作组（2026-10-30）", "date": "2026-10-30", "source_url": "https://www.ultimahora.com/gobierno-y-gremios-buscan-una-solucion-a-baja-del-dolar", "source_name": "Última Hora", "summary": "在连续多个交易日上涨后，美元再次回落，零售市场收盘买入价约为5,750瓜拉尼、卖出价约为5,900瓜拉尼，而银行间汇率维持在5,912至5,945瓜拉尼附近。瓜拉尼年初至今已升值约11%，同比升值17%，自2025年4月美元触及8,006瓜拉尼高点以来升值28%。出口商、房地产和生产部门警告称，强势货币正在削减瓜拉尼收入和竞争力。国家经济团队与各商业行会设立了一个常设技术圆桌会议，以设计汇率可预测性机制，同时参议院要求巴拉圭央行就汇率下跌及其干预标准提交报告。这场辩论引发了政策应对可能改变当前自由浮动框架的风险。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/e4ccf74/2147483647/strip/true/crop/1179x663+3+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fe2%2Fe1%2F3a0bd8e14d1fa196726d2bca3f4e%2Fgremios.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "两院预算委员会将2027年国家总预算维持在166.3万亿瓜拉尼，并重新分配1857亿瓜拉尼（2026-10-29）。", "date": "2026-10-29", "source_url": "https://www.lanacion.com.py/politica/2026/10/29/bicameral-mantiene-monto-del-pgn-2027-y-plantea-reasignaciones-presupuestarias/", "source_name": "La Nación", "summary": "国会两院预算委员会发布了关于2027年国家预算的意见书，维持总额为G. 166.3万亿（约257亿美元），并批准了由削减债务偿还重新规划资金提供财源的G. 185,745.7百万（约2870万美元）的重新分配。案文包括自2027年7月起为28,691名公共卫生工作者每月增加G. 500,000，以及为劳工部、经济财政部（前阿塞帕尔公司工人的遣散费）、公设辩护人办公室、迪本、塞纳迪斯、公立大学和原住民教育追加资金。该预算草案仍包含相当于国内生产总值3.9%的赤字，以及对《财政责任法》的特别豁免。该草案现将提交众议院，众议院定于11月9日进行逐条辩论。", "image_url": "https://www.lanacion.com.py/resizer/v2/U7DXQ22PLRERHGOEWQAQGW62ZI.jpeg?auth=8082d39fec5a88f773abc08e2451fb17f0b590a1ff47dc9ee250bff498a4bed4&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭手机支出超过汽车或柴油，中国占其进口比重达36.4%（2026-10-28）", "date": "2026-10-28", "source_url": "https://www.abc.com.py/negocios/2026/10/28/paraguay-gasto-mas-en-importar-celulares-que-en-automoviles-y-gasoil/", "source_name": "ABC Color / BCP", "summary": "巴拉圭央行1月至9月数据显示，智能手机进口额为10.452亿美元，超过进口汽车或柴油的金额，尽管手机采购额按价值仅增长2.4%。电气机械达到4.776亿美元（增长51.2%），笔记本电脑为4.282亿美元（增长53.9%），是增长最快的品类。总进口增长15%至152.60亿美元，其中中国供应54.476亿美元，占总额的36.4%，同比增长22.4%，远高于巴西（21.3%）和美国（6.7%）。巴拉圭录得7.12亿美元贸易顺差，扭转了去年5.55亿美元的逆差。尽管没有外交关系，这些数据仍凸显了消费者需求的韧性和中国供应链的深度。", "image_url": "https://www.lapoliticaonline.com/files/image/252/252893/67fd3a964aa7c_1200_630!.jpg?s=4ea8580d0523015d7e2655f356449970&d=1792551600", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "二、政治与政策变化", "tier": 1, "events": [{"title": "两院联席会议闭门审议2027年预算并驱离记者（2026-10-26）", "date": "2026-10-26", "source_url": "https://www.ultimahora.com/pgn-2027-bicameral-delibera-en-sesion-secreta-y-retira-a-periodistas-de-la-cobertura", "source_name": "Última Hora", "summary": "两院预算委员会宣布其10月26日的审议会议不公开，并要求记者离开会议室，当时该委员会正在辩论行政部门提出的一项398,778百万瓜拉尼（约合6170万美元）的追加案，主要用于教育和卫生领域的加薪。这一决定招致新闻协会和反对派议员的批评，他们认为一项影响全体公民的预算应当公开辩论。该委员会已于10月完成各部门听证，包括经济财政部、国家税收总局、最高选举法院、最高法院和公共部。三天后，委员会发布意见书，维持166.3万亿瓜拉尼的总规模。这一事件表明，在11月9日众议院辩论之前，预算进程将更具争议性且透明度下降。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/575ee7c/2147483647/strip/true/crop/1280x720+0+67/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F72%2Fab%2F37d605284ccdbbb7fa0c3053c4f9%2Fbicameral-de-presupuesto-2.jpeg", "is_gov_source": false, "is_authoritative": true}, {"title": "卡特斯将其忠实支持者从培尼亚阵营中拉出，组建独立的“荣誉科罗拉多”党团（2026-10-28）", "date": "2026-10-28", "source_url": "https://www.lapoliticaonline.com/paraguay/asuncion/cartes-aparta-a-sus-leales-y-abre-un-nuevo-capitulo-del-penismo-en-el-congreso-9729/", "source_name": "La Política Online", "summary": "奥拉西奥·卡特斯将数名忠于他的参议员和众议员——包括安东尼奥·“托尼”·巴里奥斯、古斯塔沃·莱特和莉萨雷拉·瓦连特——从与总统圣地亚哥·佩尼亚结盟的国会党团中除名，并另设了科罗拉多荣誉派的小型议席团体。此举是在卡特斯选定的总统候选人胡安·卡洛斯·巴鲁哈于10月18日退选以及卡特斯决定不再寻求连任全国共和联盟（红党）主席之后做出的。参议员巴雷拉警告说，佩尼亚已经失去了他在参议院“铁杆且受控”的多数席位，迫使行政部门逐案谈判支持，而自由党反对派议员则认为2028年有了更好的机会。这次分裂并不会让佩尼亚下台，但会在预算和任命投票之前瓦解执政党的立法机器。", "image_url": "https://www.lapoliticaonline.com/files/image/243/243763/676313fd7e786_1200_630!.jpg?s=9eb1d0cbdfd35fcb7edad04b6aa9e8cb&d=1792081473", "is_gov_source": false, "is_authoritative": true}, {"title": "新监狱长公布一项30/60/90天计划，力争在恩博斯卡达越狱事件后重新掌控局面（2026-10-30）", "date": "2026-10-30", "source_url": "https://www.adndigital.com.py/nuevo-director-penitenciario-anuncia-un-plan-para-recuperar-el-control-de-las-carceles/", "source_name": "ADN Digital", "summary": "监狱系统新任局长奥斯卡·佩雷拉宣布了一项计划，旨在恢复对巴拉圭各监狱的控制，内容包括在30天、60天和90天时进行评估、加强管控、开展行政调查以及采取措施防止内部串通。该计划是在恩博斯卡达“马丁·门多萨”监狱发生囚犯越狱事件后出台的，正值司法部进行人事调整之际。佩雷拉表示，将调查相关责任，并强化安全规程。这一事件加剧了更广泛的安全讨论，涉及有组织犯罪、贩毒和年终警方行动，并可能引发司法与内政部门的进一步机构改组。", "image_url": "https://www.lanacion.com.py/resizer/v2/NXXGW7YK4ZBYNPO5RDFIY6RPDI.jpg?auth=786c89fd9edfe560da526438e89d409fbc7286124c775a15240654f8350d22be&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "三、社会与安全形势", "tier": 1, "events": [{"title": "生物化学家们在收到50万瓜拉尼（G. 500,000）的提议后，宣布举行第二次为期10天的全国罢工（2026-10-30）", "date": "2026-10-30", "source_url": "https://www.hoy.com.py/nacionales/2026/10/30/bioquimicos-anuncian-nueva-huelga-nacional-de-10-dias", "source_name": "Diario HOY", "summary": "巴拉圭生物化学家工会结束了在约177家公共实验室举行的为期三天的罢工，并宣布将在政府仅提出500,000瓜拉尼的调整后，举行第二次为期10天的全国罢工。该工会要求增加2,000,000瓜拉尼、提供物资和正式任命，并称工资已被冻结14年，合同制人员为360万瓜拉尼，正式在编人员为430万瓜拉尼，购买力损失了77%。这场争端是更广泛的卫生部门工资冲突的一部分，涉及医生、护士和行政人员，在扰乱公立医院实验室服务的同时，加大了对2027年预算的压力。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/1364209/2147483647/strip/true/crop/1512x851+0+78/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fd0%2F14%2F3da4b3d44d9398e6612a4fe0cf6e%2Fwhatsapp-image-2026-08-13-at-08-41-48.jpeg", "is_gov_source": false, "is_authoritative": true}, {"title": "卫生工会向财政部施压，要求为4,300名护士和10,000名工人追加2027年预算（2026-10-29）", "date": "2026-10-29", "source_url": "https://elnacional.com.py/nacionales/medicos-enfermeros-presionan-mef-reajuste-10000-trabajadores-n114362", "source_name": "El Nacional", "summary": "由辛纳迪普斯工会召集的医生和护士在经济与财政部外举行抗议，要求对2027年国家总预算作出预算增补，其中包括为4300名合同制护士设定最低工资档位——这些护士目前月收入约 G. 2.7 million，低于最低工资标准——并为约1万名卫生工作者提供薪资调整。卫生跨工会联合会另寻求为近2.6万名公共卫生雇员进行50%的薪资重组，据其估算该措施将耗资1.4亿美元。这些抗议活动是在10月24日于经济财政部外搭建帐篷之后进行的，并直接影响到两院预算谈判；在两院预算谈判中，议员们已经为28,691名卫生工作者增加了自2027年7月起生效的 G. 500,000 加薪。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/b11cc52/2147483647/strip/true/crop/1280x720+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F1c%2F9a%2F83c731a54890957b69f0fdcc2d31%2Fenfermeras-ips.jpeg", "is_gov_source": false, "is_authoritative": true}, {"title": "第三季度失业率降至4.1%，就业人数达到329万（2026-10-30）", "date": "2026-10-30", "source_url": "https://www.infobae.com/america/agencias/2026/10/30/el-desempleo-en-paraguay-se-mantiene-en-el-41-en-el-tercer-trimestre-de-2026/", "source_name": "Infobae / INE", "summary": "国家统计研究所报告称，2026年7月至9月失业率为4.1%，与上一季度持平，但比去年同期的4.9%下降0.8个百分点。失业人口为141,250人，比2025年同期减少24,176人；女性失业率从6.3%降至4.7%，男性失业率则从3.8%微降至3.7%。就业率达到70%，就业人数为3,290,206人，同比增加66,149人，主要集中在商业、餐馆和酒店。城市失业率为4.4%，农村为3.2%；就业不足率小幅上升至4.2%，即143,181人。培尼亚总统称这一结果为历史纪录，尽管非正规就业和就业不足仍是结构性挑战。", "image_url": "https://www.latribuna.com.py/resizer/v2/ZEQFBBEBB5A4HD2PQ5GIYBYCMQ.jpg?smart=true&auth=4a83084d134d65c1b7b1e161fd20ceb9e3042920dc72dec7e08e367ee4e1dcda&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}, {"title": "警方启动“年末”早期行动，保护银行和商店（2026-10-27）", "date": "2026-10-27", "source_url": "https://www.lanacion.com.py/pais_edicion_impresa/2026/10/27/policia-lanza-operativo-ano-paha-anticipado/", "source_name": "La Nación", "summary": "国家警察在年终岁末季来临前启动了一项特别安全部署，在薄弱地点设控，投入战术人员、林塞小组摩托化巡逻队、爆炸物专家和巡逻车中的狙击手。已宣布对中央省、上巴拉那省、阿曼拜省、卡宁德尤省和亚松森进行增援，5000名新警员定于12月18日毕业。此次行动因圣洛伦索发生一起未遂自动取款机抢劫案而启动，旨在保护银行、商店、自动取款机和商业走廊。这既反映出武装抢劫的季节性上升，也反映出在2027年市政与政党日程临近之际，公民安全议题在政治上的突出地位。", "image_url": "https://www.lanacion.com.py/resizer/v2/GP232D3ZRNBNVD64ETDKWNIZIQ.jpg?auth=ec6d86039ef7deea4b0939e5319b6b2d5fc095cc78a248be34854878cf79dd27&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "波尔帕尔鸡肉加工厂氨气泄漏影响48名工人（2026-10-30）", "date": "2026-10-30", "source_url": "https://www.infobae.com/america/agencias/2026/10/30/cerca-de-50-trabajadores-afectados-por-fuga-amoniaco-en-una-planta-de-pollos-en-paraguay/", "source_name": "Infobae / EFE", "summary": "据公司和卫生当局称，巴拉圭马里亚诺·罗克·阿隆索的波尔帕尔股份有限公司鸡肉加工厂发生氨气泄漏，约48人受影响。30名工人被送往社保局中央医院治疗，18人在伊伦达格诊所接受治疗；大多数已出院，4名女性留院吸氧观察。劳工部和社保局已对事故原因及工厂安全条件展开调查。此次事件凸显巴拉圭食品加工和冷链行业的职业安全漏洞——氨制冷在该行业十分普遍，并可能促使当局对亚松森附近的工业设施加强检查。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/b3693d2/2147483647/strip/true/crop/1280x720+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F04%2F40%2F970496744daeb848bcda4fd98deb%2Ffuga-de-amoniaco.jpg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "四、国际关系与外交动态", "tier": 1, "events": [{"title": "佩尼亚祝贺卢拉在巴西决选中获胜，并承诺继续携手合作（2026-10-26）", "date": "2026-10-26", "source_url": "https://www.infobae.com/america/agencias/2026/10/26/pena-felicita-a-lula-por-su-triunfo-electoral-y-promete-seguir-trabajando-juntos/", "source_name": "Infobae / EFE", "summary": "圣地亚哥·培尼亚总统祝贺路易斯·伊纳西奥·卢拉·达席尔瓦在巴西10月25日的第二轮投票中击败弗拉维奥·博索纳罗，称两国有着共同的一体化与发展议程，并将继续携手合作。巴拉圭与大多数右倾的南美国家政府一道承认了这一结果，阿根廷的哈维尔·米莱是显著的例外。这一结果使注意力重新转向伊泰普附件C的审查以及将于2026年12月到期的每千瓦月19.28美元电价。分析人士认为，卢拉历来对巴拉圭的诉求更为积极响应，但他将面临一个艰难的国会；培尼亚在竞选期间一直避免支持任何一位候选人。", "image_url": "https://www.lanacion.com.py/resizer/v2/DSCJ3GLVFZH73G5XZMAJTCMOYA.jpg?auth=fa558b5355f4ce63d0bb35f9d122aba76a1aea00d869a534ef3d4b7e784e6f1b&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "迪亚斯-巴拉特强调美国与巴拉圭在安全与技术领域的战略联盟（2026-10-27）", "date": "2026-10-27", "source_url": "https://www.lanacion.com.py/politica/2026/10/27/diaz-balart-resalta-alianza-estrategica-entre-ee-uu-y-paraguay-en-seguridad-y-tecnologia/", "source_name": "La Nación", "summary": "美国国会议员马里奥·迪亚斯-巴拉特强调了华盛顿与亚松森之间在安全和技术领域的战略联盟，指出巴拉圭加入“硅和平”倡议成为其第26个伙伴、其用于人工智能基础设施的关键矿产和水电资源，以及美国国务院国际麻醉品和执法事务局在亚松森新设的禁毒办公室作为南锥体地区的区域枢纽。他的上述言论是在副国务卿克里斯托弗·兰道10月19日至21日访问之后发表的，期间签署了空中拦截和边境安全文书，并宣布提供1175万美元的安全援助。这种战略协同深化了美国的投资和情报合作，但也增加了巴拉圭在美中科技竞争中的风险敞口。", "image_url": "https://www.lanacion.com.py/resizer/v2/OWZFO45HPNGJXJWXCVK5ZJMFP4.jpg?auth=d98e5f6242705fd3dce932f5bfafc8a075bf270737d765d838b7e033a6466cc8&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭、玻利维亚和乌拉圭在亚松森加强乌巴玻合作（2026-10-30）", "date": "2026-10-30", "source_url": "http://spanish.xinhuanet.com/20261030/50a52fffc9fd49928b2bdcae8912873d/c.html", "source_name": "Xinhua", "summary": "巴拉圭、玻利维亚和乌拉圭的外长及官员在亚松森举行乌巴玻集团会议，会议由巴拉圭外长鲁文·拉米雷斯·莱斯卡诺主持，旨在加强区域合作。议程涵盖物流与港口一体化、巴拉圭—巴拉那水道的通航、航空互联互通、多式联运走廊以及生产、商业和能源一体化。对于内陆国家巴拉圭而言，该集团是对南方共同市场的补充平台，有助于降低出口物流成本、改善通往大西洋和太平洋航线的通道。此次会议未产生具有约束力的承诺，但强化了亚松森在2027—2028年选举周期前推动基础设施协调的努力。", "image_url": "https://www.latribuna.com.py/resizer/v2/PNRP6XQJ5VD6LE76EJL3AM2SGI.jpeg?smart=true&auth=4679b544c7b42ad1da04a0d91fed0d2b8571bf1d3823b77de984ef71b80f002c&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭企业参加在雷西斯滕西亚举行的第四届南方共同市场—欧盟商务洽谈会（2026-10-29）", "date": "2026-10-29", "source_url": "https://www.ultimahora.com/ronda-de-negocios-mercosur-ue-se-realizara-en-el-chaco-argentino", "source_name": "Última Hora", "summary": "超过250家企业，包括巴拉圭代表团，参加了在阿根廷查科省雷西斯滕西亚举行的第四届南方共同市场—欧盟商务对接会，重点领域涵盖面向超市的食品、建筑和木材、贸易、服务、软件和知识经济。南方共同市场—欧盟临时贸易协定自2026年5月1日起临时适用，政府估计巴拉圭目前及潜在出口中至少95%将免关税或享受优惠待遇进入欧洲。尚未解决的主要问题是内部配额分配：巴拉圭要求获得25%，而乌拉圭和阿根廷主张按历史贸易额分配，巴西主张按全球贸易额分配。五年过渡期和认证要求将决定企业能以多快速度利用这些优惠待遇。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/9b1218b/2147483647/strip/true/crop/1177x662+4+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F0e%2Fbf%2Fb77ba58343e29fb0faf5b4b8b3e1%2Fronda-de-negocios-mercosur.jpg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "五、行业专题：通讯、运营商、数字能源与AI", "tier": 1, "events": [{"title": "巴拉圭在加入“硅基和平”后，将主办一座120亿美元的人工智能园区（2026-10-30）", "date": "2026-10-30", "source_url": "https://www.lanacion.com.py/politica/2026/10/30/paraguay-atraera-historico-proyecto-de-ia-por-usd-12000-millones-tras-unirse-a-pax-silica/", "source_name": "La Nación", "summary": "巴拉圭将在上巴拉那省伊瓜苏市建设“伊瓜苏人工智能城”，这是一个由美国克鲁索公司和巴拉圭阿拉伊科公司开发的数据中心园区，头三年总投资额为120亿美元，约相当于国内生产总值的四分之一，合同用电需求约为280兆瓦。一期规模仅为6兆瓦，投资约3亿美元，计划于2026年底或2027年初投运；二期将在2028年第二季度新增130兆瓦和55亿美元投资，三期将在2029年增加类似规模。电力价格为每兆瓦时45美元，接入220千伏电压，并按年度指数调整，容量将从2027年第一季度起通过克鲁索云平台出售。该项目是在巴拉圭成为第26个“硅和平”伙伴之后对外展示的。", "image_url": "https://www.lanacion.com.py/resizer/v2/CNPHMAIR7BGB7JT3JNT5WUCTK4.jpeg?auth=618aefa7ec71e77f1e1e5e1d31cd31fad6fae045670ba972498993c2b45a4dd7&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "能源专家警告2030–31年供应紧缩，并称重新谈判《附件C》是‘乌托邦’（2026-10-29）", "date": "2026-10-29", "source_url": "https://www.latribuna.com.py/negocios/economia/2026/10/29/fabian-caceres-advierte-de-crisis-energetica-y-el-futuro-de-itaipu-tras-elecciones-en-brasil/", "source_name": "La Tribuna", "summary": "前国家电力管理局（ANDE）经理兼能源专家法比安·卡塞雷斯警告称，巴拉圭将在2030至2031年前后面临严重的供应问题，可能需要从巴西进口电力，因为国内消费正接近伊泰普、亚西雷塔和阿卡赖三座水电站的总发电量，而目前没有新的发电招标在进行，输电基础设施也已过时。他称全面重新谈判伊泰普附件C是“乌托邦”，并表示巴拉圭“错过了列车”，因为不断增长的国内需求将很快吸收其份额。他还警告说，该国已向一家数据中心开发商承诺286兆瓦电力，却不知道2027年的最终电价，并敦促建立单一指挥单位并与巴西达成双边协议。目前每千瓦月19.28美元的费率将于2026年12月到期。", "image_url": "https://www.latribuna.com.py/resizer/v2/RI4MMVHDBVA2DCN5263ESMJSTI.jpg?smart=true&auth=8e50b9988e0e2cabb0fb1c213fa4d5361e386133365b613fd980f82bc81a7c90&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭国家电力管理局伊泰普运营协议到期威胁廉价剩余电力（2026-10-29）", "date": "2026-10-29", "source_url": "https://www.ultimahora.com/se-pronostica-el-fin-del-acuerdo-operativo-que-beneficia-a-la-ande", "source_name": "Última Hora", "summary": "允许国家电力管理局获取伊泰普廉价剩余电力的运营协议将于2026年底到期，失去该协议可能严重影响该国有公用事业企业的财务状况，并最终影响消费者电价。2025年，巴拉圭从伊泰普消费了25,768吉瓦时电力，比上一年增长26.4%，同时仍将其分得的一半发电量中的约四分之一让给巴西。该协议的到期恰逢附件C审查、面向电力密集型数据中心客户的新45至49美元/兆瓦时电价，以及人工智能项目需求的上升。如果剩余电力机制在新的发电和输电设施投运之前消失，国家电力管理局可能不得不以更高成本购买替代电力，从而削弱能源密集型投资的理由。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/ca532df/2147483647/strip/true/crop/3168x1782+0+207/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Ff1%2F3f%2Ffb47242b49929003b6a9ec50b92b%2Flocales-1044741-jpg-2757254.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "国家电信委员会结束2026—2030年国家电信计划公开咨询（2026-10-26）", "date": "2026-10-26", "source_url": "https://www.conatel.gov.py/prorroga-consulta-publica-borrador-del-plan-nacional-de-telecomunicaciones-2026-2030/", "source_name": "CONATEL", "summary": "国家电信委员会结束了《2026–2030年国家电信计划》草案的公开磋商，将截止日期延长至10月26日。该计划建立在三大支柱之上：基础设施与覆盖、服务质量，以及可负担性与数字包容。2030年的目标包括：265个区接入光纤骨干网，4G人口覆盖率达到95.6%、5G覆盖率达到30%，移动网络平均下载速度达到35 Mbps、固定网络平均下载速度达到160 Mbps，固定连接中光纤占比达到80%，60%的家庭拥有固定接入，每移动千兆字节平均价格降低40%。预计资本支出为23.13亿美元，其中包括用于5,543公里骨干网的1.13亿美元。最终计划将塑造频谱、物联网和设备认证规则以及下一轮招标安排。", "image_url": "https://dplnews.com/wp-content/uploads/2026/06/Gemini_Generated_Image_2s4av12s4av12s4a-1024x572.png", "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "六、主要客户动向", "tier": 1, "events": [{"title": "克拉罗的5G网络覆盖27个城市和300万人口（2026-10-29）", "date": "2026-10-29", "source_url": "https://foco.lanacion.com.py/2026/10/29/5g-acelera-su-expansion-y-alcanza-a-3-millones-de-paraguayos/", "source_name": "Revista FOCO", "summary": "巴拉圭克拉罗的5G网络目前覆盖10个省的27个城市，潜在覆盖人口超过300万，该运营商预计到2026年底投入运营的基站将超过100个。网络部署于2025年启动，最初覆盖中部地区的12个战略地点，此后又新增了奥维多上校城、比亚里卡、佩德罗·胡安·卡瓦列罗、埃尔南达里亚斯、东方市、恩卡纳西翁和坎比雷塔。独立机构恩珀夫9月的测量结果仍显示，全国5G覆盖率为23.75%，且高度集中在亚松森（77.7%），这表明营销宣传的覆盖范围与真实用户体验之间仍相去甚远。克拉罗正抢在蒂戈和个人电信于2027年初推出服务之前，将自己定位为5G覆盖领先者。", "image_url": "https://www.lanacion.com.py/resizer/v2/YBOBP2EFFFETFFPOQD4QS43UAI.webp?auth=11d3ff61b20e384e8927a9513af6f86afcd653c6928a267e1ba5f31f51cc6445&width=924&height=485&smart=true", "is_gov_source": false, "is_authoritative": true, "client_tag": "Claro"}, {"title": "佩尔索纳尔公司推出 SIM 卡交换应用程序接口，以打击 SIM 卡交换欺诈（2026-10-30）", "date": "2026-10-30", "source_url": "https://www.latribuna.com.py/negocios/marcas/2026/10/30/personal-ofrece-una-solucion-para-reforzar-la-seguridad-digital-y-prevenir-fraudes-por-cambio-de-sim/", "source_name": "La Tribuna", "summary": "个人企业公司推出了SIM卡更换服务，这是一个API，可让银行、金融科技公司和商户实时核实客户SIM卡最近一次更换的时间，以防止SIM卡调换欺诈。该服务增设身份核查，旨在帮助受监管客户遵守央行关于数字安全的“A”7783号通知。此次发布表明，该公司正从连接业务拓展至企业对企业数字信任服务领域，这一细分市场的利润率和客户粘性均高于消费者数据业务。对技术供应商而言，这预示着在移动核心网之上叠加用户数据集成、API网关、欺诈分析和安全编排的需求。", "image_url": "https://www.latribuna.com.py/resizer/v2/HMJFEPZBXRAUDPP5OEZPYNNWOQ.png?smart=true&auth=b28618a7bb483f42a48c4d0cd8251cec96c8fd7897f01752791c15864a595664&width=1200&height=630", "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal"}, {"title": "Personal公司首席执行官警告“完美风暴”来临，并推动电信公司以13个数据中心发展人工智能（2026-10-28）", "date": "2026-10-28", "source_url": "https://www.lavoz.com.ar/negocios/dilema-inversion-digital-proyectan-lideres-telecomunicaciones-region_0_mtlBe9AYPR.html", "source_name": "La Voz", "summary": "阿根廷个人电信与阿根廷电信公司首席执行官罗伯托·诺比莱在一个区域论坛上表示，电信行业正面临一场“完美风暴”：每用户收入持平或下降，而光纤和5G独立组网投资沉重，加上人工智能驱动的流量增长，将使投资缺口转化为容量缺口。他表示，超过75%的移动流量由少数几家超大规模云服务商产生，但它们并不承担容量成本；他提出行业整合、公平分摊出资、对称监管、面向企业客户的网络切片，以及基于该集团13个数据中心的“面向人工智能的电信公司”战略。这一议程对巴拉圭很重要，因为个人电信必须在2027年2月前推出5G，并且正在权衡将边缘计算和人工智能基础设施投资投向何处。", "image_url": "https://www.convergencia.com/files/image/206/206916/69a5a60da7316_600_315!.jpg?s=17100b1e7f02b47a803cfeef9543ccbc&d=1772472756", "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal"}, {"title": "米雷康姆（提戈）将第三季度业绩公布时间定于11月5日（2026年10月28日）", "date": "2026-10-28", "source_url": "https://stockhouse.com/news/press-releases/2026/10/28/millicom-tigo-notice-of-third-quarter-2026-results-and-video-conference", "source_name": "Millicom / Stockhouse", "summary": "米雷康姆公司是巴拉圭蒂戈公司的母公司，宣布将于11月5日发布2026年第三季度业绩，随后面向金融界举行视频会议。集团层面的市场一致预期营收约为22.3亿美元，不过巴拉圭的数据并未单独披露。由于蒂戈准备在2027年2月之前在2.3 GHz频段推出5G，并承诺在四年内建设至少100个无线基站，且与佩索纳尔共同实施8000万美元的项目，此次业绩中的资本开支指引将受到关注。若集团资本开支有任何上调，或就光纤和数据中心机遇发表评论，都将成为巴拉圭2027年供应商订单的先行指标。", "image_url": "https://manilatimes.net/manilatimes/uploads/images/2026/10/29/1281739.png", "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo"}], "impact_analysis": "", "user_notes": ""}, {"title": "七、对企业经营的综合影响分析", "tier": 2, "events": [], "impact_analysis": "🟡 汇率目前是宏观政策的主要风险点。根据巴拉圭央行10月30日的牌价表，瓜拉尼收于1美元兑约5,945瓜拉尼，年内升值约11%，同比升值约17%；政府和企业协会已成立常设技术工作组，讨论汇率可预测性问题。瓜拉尼走强降低了以本币计价的进口网络设备和手机成本，但挤压了出口商和本地合作伙伴，并增加了行政性或准财政应对措施的风险。合同应以美元计价或与美元挂钩，加入明确的外汇条款，并针对季节性美元供应消退后汇率可能回升至6,100至6,200瓜拉尼的情况进行情景规划。\n\n🟢 实体经济仍具支撑性。巴拉圭央行10月30日将政策利率维持在5.50%，将2026年增长预测上调至5.0%，并将2026年底通胀预期下调至3.0%；同时，国家统计局报告失业率为4.1%，就业人数为329万。稳定的利率、低通胀和创纪录的就业支撑了消费者对连接服务、智能手机和数字服务的需求。 需要指出的是，经济增长日益由服务业驱动，且就业不足（4.2%）和非正规性限制了内陆地区的可支配收入增长，而该地区的5G变现能力最弱。\n\n🔴 财政刚性正在积累。两院预算委员会将2027年国家总预算维持在166.3万亿瓜拉尼，赤字占GDP的3.9%，并例外豁免了《财政责任法》；同时在一场闭门会议中讨论增加一项3988亿瓜拉尼的工资补充条款，并从偿债资金中重新划拨1857亿瓜拉尼。截至9月，税收收入仅增长2.3%，而目标为8%；且国家仍拖欠医疗供应商和公共工程与通信部承包商大量欠款。公共部门的信息通信技术、能源和基础设施项目面临付款延迟和重新谈判风险，因此对巴拉圭国家电力管理局（ANDE）、公共工程与通信部（MOPC）及医疗实体的风险敞口应予以担保或规避。\n\n🟡 政治更加碎片化，但并非不稳定。卡特斯决定将其忠实支持者拉入独立的“荣誉科罗拉多”党团，这削弱了培尼亚在参议院可掌控的多数席位，并使预算、任命和改革投票需要逐案争取。 2028年继任之争将占用立法机构的议程空间，而政府向美国靠拢（“硅基和平”计划、国际麻醉品和执法事务局办公室、1175万美元安全一揽子计划）仍是为数不多的稳定主轴之一。对投资者而言，实际影响是决策放缓和更需要本地政治情报，而非政策立即断裂。\n\n🔴 能源是数据中心叙事面临的最大结构性风险。伊泰普运营协议将于2026年底到期，每千瓦月19.28美元的电价有待修订，专家还警告2030–31年将出现供应紧张。耗资120亿美元的伊瓜苏人工智能城项目真实存在，但投入后置：一期仅6兆瓦、约3亿美元，97.5%的项目总规模取决于后续阶段、国家电力管理局的电价待遇以及附件C结果。数据中心需求对电力设备、制冷、光纤和信息通信技术是真实机遇，但供应商应逐阶段评估，避免将宣传数字视为已承诺资本开支。\n\n🟢 电信资本开支正进入新周期。 巴拉圭国家电信委员会2026—2030年计划的目标是，到2030年实现30%的5G人口覆盖率和23.13亿美元投资；克拉罗已称覆盖27个城市和300万人口，蒂戈和个人电信必须在2027年2月前启动5G，并在四年内各自建设至少100个基站。与此同时，5G招标保留了“可信供应商”限制，使中国设备处于不利地位；努比通信公司疲弱的商业表现（建成34个基站后仅有两名用户）表明，获得牌照并不能保证有效需求。最终胜出的将是那些能够将无线接入、光纤、能效和本地集成结合起来，而非仅靠单纯设备销售的供应商。\n\n🔴 中国因素是一把双刃剑。1—9月，中国占巴拉圭进口的36.4%（54.5亿美元），仅智能手机一项就构成10.5亿美元的品类，因此中国供应链仍不可或缺。但亚松森承认台湾地区，北京于10月对信息与通信技术部部长古斯塔沃·比利亚特实施制裁，美国则正将投资与安全合作同技术路线绑定。 中国企业应保持低调的政治姿态，做好合规记录，避免两用物项风险敞口，并尽可能利用南方共同市场—欧盟原产地规则和本地组装，以实现市场准入多元化。", "user_notes": ""}, {"title": "八、对中资企业的专项影响与建议", "tier": 2, "events": [], "impact_analysis": "🟡 将外汇作为首要商业条款。在瓜拉尼接近5,945、年初至今升值约11%的情况下，应以美元为合同计价，或将其与巴拉圭央行汇率挂钩；缩短瓜拉尼计价应收账款的付款期限，并对反弹至6,100–6,200瓜拉尼进行压力测试。政府—行业公会技术工作组可能出台干预或税收措施；应关注巴拉圭央行的沟通和参议院的要求，而不是假设自由浮动汇率保持不变。\n\n🟢 建立5G和光纤项目储备，而不是一次性招标策略。巴拉圭国家电信委员会2026–2030年计划预计资本支出23.13亿美元，到2030年建成265个拥有光纤骨干网的地区，5G人口覆盖率达30%；克拉罗计划到2026年底建设超过100个基站，蒂戈和佩尔索纳尔必须在2027年2月前推出服务，并在四年内各达到100个基站。应尽早与运营商就工程、开放式无线接入网、节能射频和光纤回传进行接洽，并与本地集成商合作以应对可信供应商规则。定位为多厂商、符合标准的供应商，而不是单一设备供应商。\n\n🟢 瞄准数据中心供应链，但须分阶段承保。 伊瓜苏人工智能城对外宣称的规模为120亿美元和280兆瓦，但第一阶段仅为6兆瓦、约3亿美元，且面向2027年的286兆瓦巴拉圭国家电力公司购电协议电价尚未敲定。重点放在第一、二阶段设备——不间断电源、冷却系统、开关设备、预制模块、光纤和数据中心基础设施管理——并要求在扩大规模前落实里程碑式付款、履约保证，并明确巴拉圭国家电力公司电价和附件C。避免基于整体宣传规模作出库存或产能承诺。\n\n🔴 保障公共部门现金流。2027年预算存在占国内生产总值3.9%的赤字和《财政责任法》的豁免，财政收入目前仅为2.3%，而目标为8%，并且拖欠卫生供应商和公共工程与通信部承包商的款项规模很大。对于巴拉圭国家电力公司、公共工程与通信部、卫生和市政项目，应要求主权或多边担保、托管或里程碑付款，并关注11月9日众议院辩论和随后的参议院表决。不要假设国家总预算会按批准的内容执行。\n\n🟡 审慎管理政治和制裁风险。巴拉圭对台湾的承认以及10月对信息与通信技术部部长古斯塔沃·比利亚特的制裁表明，技术问题也可能演变为外交问题； 美国对受信任供应商施压以及网络安全指控增加了摩擦。应保持低调的公开姿态，加强合规和出口管制筛查，聘用当地法律顾问，并避免为项目配备面临签证或制裁风险的人员。在可能的情况下，将组装或服务本地化，以创造巴拉圭就业机会并获得政治掩护。\n\n🟢 利用南方共同市场—欧盟和乌拉圭—巴拉圭—玻利维亚三边机制渠道进入市场。南方共同市场—欧盟临时协定自2026年5月起适用，覆盖至少95%的巴拉圭出口产品，实行零关税或优惠关税；乌拉圭—巴拉圭—玻利维亚三边机制会议则聚焦于巴拉圭—巴拉那水道、港口和多式联运一体化。对于具有区域成分的项目，应设计符合原产地规则的供应链，并考虑将巴拉圭作为面向南方共同市场的轻型组装或分销基地，同时监测尚未解决的配额分配问题（巴拉圭要求获得25%）。\n\n🟡 为社会和安全扰乱制定预案。卫生部门罢工（生物化学家为期10天的罢工、护士抗议）、恩博斯卡达监狱越狱事件以及年初的阿尼奥帕哈警方行动，可能扰乱物流、现场通行和公共服务支付。 维护员工和仓库的安全规程，为第四季度建立缓冲库存，并避免项目时间表依赖公共实验室或卫生设施。", "user_notes": ""}]}, "en": {"topic": "Paraguay Briefing", "time_span": "October 26 – October 31, 2026", "time_label": "Last week", "tiers": [{"name": "Part I: Key News & Developments", "description": "Macro economy, politics, social security, international relations, industry and key client movements in Paraguay"}, {"name": "Part II: Analysis & Recommendations", "description": "Enterprise impact assessment and China-specific strategic recommendations"}], "sections": [{"title": "I. Macroeconomic Developments", "tier": 1, "events": [{"title": "BCP holds policy rate at 5.50% and raises the 2026 growth forecast to 5.0% (2026-10-30)", "date": "2026-10-30", "source_url": "https://www.lanacion.com.py/negocios/2026/10/30/bcp-reafirma-neutralidad-de-su-politica-monetaria-ante-economia-dinamica-y-precios-controlados/", "source_name": "La Nación / BCP", "summary": "The Central Bank's Monetary Policy Committee kept the policy rate at 5.50% and reaffirmed a neutral stance, with annual inflation at 1.7% in September (monthly 0.1%, core 1.5%) and activity growing 6.7% year-on-year in August as measured by the IMAEP. The BCP raised its 2026 GDP growth projection from 4.5% to 5.0%, driven by services, electricity and water, and cut its end-2026 inflation forecast from 3.3% to 3.0%, with the core forecast lowered from 2.8% to 2.2%. Medium-term expectations remain anchored at 3.5%. The committee flagged external risks from Middle East geopolitical tensions, energy prices and higher US rates, and set the next meeting for 20 November. Stable rates and strong activity support domestic demand, credit and telecom/data consumption.", "image_url": "https://www.lanacion.com.py/resizer/v2/A6X6CR3KQZEQXPMHUR3DSSSLFQ.jpg?auth=6360e928b9bba35b138e75665d398dad03ce9e9d8a3123ef5eba0193734673af&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Guaraní rebounds as government and business groups set up a permanent FX technical table (2026-10-30)", "date": "2026-10-30", "source_url": "https://www.ultimahora.com/gobierno-y-gremios-buscan-una-solucion-a-baja-del-dolar", "source_name": "Última Hora", "summary": "After several sessions of gains the dollar retreated again, closing around G. 5,750 bid and G. 5,900 offered in the retail market, while the interbank rate stood near G. 5,912–5,945. The guaraní has appreciated about 11% year-to-date, 17% year-on-year and 28% since April 2025, when the dollar peaked at G. 8,006. Exporters, real-estate and productive sectors warn that the strong currency cuts guaraní revenue and competitiveness. The National Economic Team and business guilds installed a permanent technical table to design exchange-rate predictability mechanisms, while the Senate requested reports from the BCP on the fall and its intervention criteria. The debate raises the risk of policy responses that could alter the current free-float framework.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/e4ccf74/2147483647/strip/true/crop/1179x663+3+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fe2%2Fe1%2F3a0bd8e14d1fa196726d2bca3f4e%2Fgremios.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Bicameral budget committee keeps PGN 2027 at G. 166.3tn and reallocates G. 185.7bn (2026-10-29)", "date": "2026-10-29", "source_url": "https://www.lanacion.com.py/politica/2026/10/29/bicameral-mantiene-monto-del-pgn-2027-y-plantea-reasignaciones-presupuestarias/", "source_name": "La Nación", "summary": "The Congressional Bicameral Budget Committee issued its dictamen on the 2027 national budget, keeping the global amount at G. 166.3 trillion (about USD 25.7 billion) and approving reallocations of G. 185,745.7 million (around USD 28.7 million) financed by a cut in the debt-repayment reprogramming. The text includes a G. 500,000 monthly increase for 28,691 public-health workers from July 2027 and additional funds for the Labour Ministry, the MEF (severance for former Acepar workers), the Public Defender's Office, Diben, Senadis, public universities and indigenous education. The project still carries a 3.9%-of-GDP deficit and an exceptional waiver of the Fiscal Responsibility Law. It now goes to the Chamber of Deputies, which scheduled the article-by-article debate for 9 November.", "image_url": "https://www.lanacion.com.py/resizer/v2/U7DXQ22PLRERHGOEWQAQGW62ZI.jpeg?auth=8082d39fec5a88f773abc08e2451fb17f0b590a1ff47dc9ee250bff498a4bed4&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay spent more on mobile phones than on cars or diesel as China reaches 36.4% of imports (2026-10-28)", "date": "2026-10-28", "source_url": "https://www.abc.com.py/negocios/2026/10/28/paraguay-gasto-mas-en-importar-celulares-que-en-automoviles-y-gasoil/", "source_name": "ABC Color / BCP", "summary": "BCP data for January–September show smartphone imports of USD 1,045.2 million, more than the value of imported automobiles or diesel, although phone purchases grew only 2.4% in value. Electrical machinery reached USD 477.6 million (+51.2%) and notebooks USD 428.2 million (+53.9%), the fastest-growing category. Total imports rose 15% to USD 15,260 million, with China supplying USD 5,447.6 million, or 36.4% of the total and 22.4% more than a year earlier, far ahead of Brazil (21.3%) and the United States (6.7%). Paraguay recorded a USD 712 million trade surplus, reversing last year's USD 555 million deficit. The figures underline both resilient consumer demand and the depth of Chinese supply chains despite the absence of diplomatic relations.", "image_url": "https://www.lapoliticaonline.com/files/image/252/252893/67fd3a964aa7c_1200_630!.jpg?s=4ea8580d0523015d7e2655f356449970&d=1792551600", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "II. Political & Policy Developments", "tier": 1, "events": [{"title": "Bicameral deliberates the 2027 budget behind closed doors and removes journalists (2026-10-26)", "date": "2026-10-26", "source_url": "https://www.ultimahora.com/pgn-2027-bicameral-delibera-en-sesion-secreta-y-retira-a-periodistas-de-la-cobertura", "source_name": "Última Hora", "summary": "The Bicameral Budget Committee declared its 26 October deliberative session secret and asked journalists to leave the room while it debated an executive addendum of G. 398,778 million (about USD 61.7 million), mainly for salary increases in Education and Health. The decision drew criticism from press associations and opposition legislators, who argued that a budget affecting all citizens should be debated publicly. The committee had completed sector hearings in October, including the MEF, DNIT, TSJE, Supreme Court and Public Ministry. Three days later it issued its dictamen keeping the G. 166.3 trillion total. The episode signals a more contentious and less transparent budget process ahead of the 9 November debate in the Chamber of Deputies.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/575ee7c/2147483647/strip/true/crop/1280x720+0+67/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F72%2Fab%2F37d605284ccdbbb7fa0c3053c4f9%2Fbicameral-de-presupuesto-2.jpeg", "is_gov_source": false, "is_authoritative": true}, {"title": "Cartes pulls his loyalists from Peña's bloc and forms an independent Honor Colorado bench (2026-10-28)", "date": "2026-10-28", "source_url": "https://www.lapoliticaonline.com/paraguay/asuncion/cartes-aparta-a-sus-leales-y-abre-un-nuevo-capitulo-del-penismo-en-el-congreso-9729/", "source_name": "La Política Online", "summary": "Horacio Cartes removed several loyal senators and deputies — including Antonio 'Tony' Barrios, Gustavo Leite and Lizarella Valiente — from the congressional bloc aligned with President Santiago Peña and set up a separate Honor Colorado mini-bench. The move follows the withdrawal of Cartes's chosen presidential candidate, Juan Carlos Baruja, on 18 October and Cartes's decision not to seek re-election as ANR party president. Senator Varela warned that Peña has lost his 'hard and captive' Senate majority, forcing the Executive to negotiate support case by case, while Liberal opposition legislators see a better opening for 2028. The split does not remove Peña from office but fragments the ruling party's legislative machine ahead of budget and appointment votes.", "image_url": "https://www.lapoliticaonline.com/files/image/243/243763/676313fd7e786_1200_630!.jpg?s=9eb1d0cbdfd35fcb7edad04b6aa9e8cb&d=1792081473", "is_gov_source": false, "is_authoritative": true}, {"title": "New prison director unveils a 30/60/90-day plan to regain control after the Emboscada escape (2026-10-30)", "date": "2026-10-30", "source_url": "https://www.adndigital.com.py/nuevo-director-penitenciario-anuncia-un-plan-para-recuperar-el-control-de-las-carceles/", "source_name": "ADN Digital", "summary": "The new director of the prison system, Óscar Pereira, announced a plan to recover control of Paraguay's penitentiaries, with assessments at 30, 60 and 90 days, tighter controls, administrative investigations and measures to prevent internal complicity. The plan follows the escape of inmates from the Emboscada 'Martín Mendoza' penitentiary and comes amid changes at the Ministry of Justice. Pereira said responsibilities will be investigated and that security protocols will be reinforced. The episode adds to a broader security debate that includes organised crime, drug trafficking and the year-end police operation, and could trigger further institutional reshuffles in the justice and interior sectors.", "image_url": "https://www.lanacion.com.py/resizer/v2/NXXGW7YK4ZBYNPO5RDFIY6RPDI.jpg?auth=786c89fd9edfe560da526438e89d409fbc7286124c775a15240654f8350d22be&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "III. Social & Security Landscape", "tier": 1, "events": [{"title": "Biochemists announce a second 10-day national strike after a G. 500,000 offer (2026-10-30)", "date": "2026-10-30", "source_url": "https://www.hoy.com.py/nacionales/2026/10/30/bioquimicos-anuncian-nueva-huelga-nacional-de-10-dias", "source_name": "Diario HOY", "summary": "The Union of Biochemists of Paraguay ended a three-day strike in some 177 public laboratories and announced a second, 10-day national strike after the government offered only a G. 500,000 adjustment. The guild is demanding a G. 2,000,000 increase, supplies and appointments, saying salaries have been frozen for 14 years at G. 3.6 million for contract staff and G. 4.3 million for appointed staff, a 77% loss of purchasing power. The dispute is part of a wider health-sector wage conflict that includes doctors, nurses and administrative staff, and it increases pressure on the 2027 budget while disrupting laboratory services for public hospitals.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/1364209/2147483647/strip/true/crop/1512x851+0+78/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fd0%2F14%2F3da4b3d44d9398e6612a4fe0cf6e%2Fwhatsapp-image-2026-08-13-at-08-41-48.jpeg", "is_gov_source": false, "is_authoritative": true}, {"title": "Health unions press the MEF for a 2027 budget addendum for 4,300 nurses and 10,000 workers (2026-10-29)", "date": "2026-10-29", "source_url": "https://elnacional.com.py/nacionales/medicos-enfermeros-presionan-mef-reajuste-10000-trabajadores-n114362", "source_name": "El Nacional", "summary": "Doctors and nurses convened by Sinadips protested outside the Ministry of Economy and Finance to demand a budget addendum to the 2027 PGN that includes a minimum salary band for 4,300 contracted nurses, who earn about G. 2.7 million, below the minimum wage, and an adjustment for some 10,000 health workers. The Intergremial de Salud is separately seeking a 50% salary recomposition for nearly 26,000 public-health employees, a measure it estimates would cost USD 140 million. The protests follow a tent installation outside the MEF on 24 October and feed directly into the Bicameral budget negotiations, where legislators already added a G. 500,000 raise for 28,691 health workers from July 2027.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/b11cc52/2147483647/strip/true/crop/1280x720+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F1c%2F9a%2F83c731a54890957b69f0fdcc2d31%2Fenfermeras-ips.jpeg", "is_gov_source": false, "is_authoritative": true}, {"title": "Unemployment falls to 4.1% in Q3 as employment reaches 3.29 million (2026-10-30)", "date": "2026-10-30", "source_url": "https://www.infobae.com/america/agencias/2026/10/30/el-desempleo-en-paraguay-se-mantiene-en-el-41-en-el-tercer-trimestre-de-2026/", "source_name": "Infobae / INE", "summary": "The National Statistics Institute reported unemployment of 4.1% in July–September 2026, unchanged from the previous quarter but down 0.8 percentage points from 4.9% a year earlier. There were 141,250 unemployed people, 24,176 fewer than in the same period of 2025; female unemployment fell from 6.3% to 4.7%, while male unemployment edged down from 3.8% to 3.7%. The employment rate reached 70%, with 3,290,206 people employed, 66,149 more year-on-year, concentrated in commerce, restaurants and hotels. Urban unemployment was 4.4% and rural 3.2%; underemployment rose slightly to 4.2%, or 143,181 people. President Peña called the result a historic record, though informality and underemployment remain structural challenges.", "image_url": "https://www.latribuna.com.py/resizer/v2/ZEQFBBEBB5A4HD2PQ5GIYBYCMQ.jpg?smart=true&auth=4a83084d134d65c1b7b1e161fd20ceb9e3042920dc72dec7e08e367ee4e1dcda&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}, {"title": "Police launch an early Año Paha operation to protect banks and shops (2026-10-27)", "date": "2026-10-27", "source_url": "https://www.lanacion.com.py/pais_edicion_impresa/2026/10/27/policia-lanza-operativo-ano-paha-anticipado/", "source_name": "La Nación", "summary": "The National Police launched a special security device ahead of the year-end Año Paha season, with controls at vulnerable points, tactical personnel, Grupo Lince motorised patrols, explosives specialists and snipers in patrol cars. Reinforcements were announced for Central, Alto Paraná, Amambay, Canindeyú and Asunción, and 5,000 new officers are due to graduate on 18 December. The operation was triggered by an attempted ATM robbery in San Lorenzo and aims to protect banks, shops, cash machines and commercial corridors. It reflects both the seasonal rise in armed robbery and the political salience of citizen security ahead of the 2027 municipal and party calendar.", "image_url": "https://www.lanacion.com.py/resizer/v2/GP232D3ZRNBNVD64ETDKWNIZIQ.jpg?auth=ec6d86039ef7deea4b0939e5319b6b2d5fc095cc78a248be34854878cf79dd27&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Ammonia leak at the Pollpar chicken plant affects 48 workers (2026-10-30)", "date": "2026-10-30", "source_url": "https://www.infobae.com/america/agencias/2026/10/30/cerca-de-50-trabajadores-afectados-por-fuga-amoniaco-en-una-planta-de-pollos-en-paraguay/", "source_name": "Infobae / EFE", "summary": "An ammonia leak at the Pollpar S.A. chicken-processing plant in Mariano Roque Alonso affected about 48 people, according to the company and health authorities. Thirty workers were treated at the IPS Central Hospital and 18 at the Yrendague clinic; most were discharged, while four women remained under observation with oxygen. The Labour Ministry and the IPS opened investigations into the cause and into safety conditions at the plant. The incident highlights occupational-safety gaps in Paraguay's food-processing and cold-chain sector, where ammonia refrigeration is common, and may prompt tighter inspections of industrial facilities near Asunción.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/b3693d2/2147483647/strip/true/crop/1280x720+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F04%2F40%2F970496744daeb848bcda4fd98deb%2Ffuga-de-amoniaco.jpg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "IV. International Relations & Diplomacy", "tier": 1, "events": [{"title": "Peña congratulates Lula on his Brazil runoff victory and pledges to keep working together (2026-10-26)", "date": "2026-10-26", "source_url": "https://www.infobae.com/america/agencias/2026/10/26/pena-felicita-a-lula-por-su-triunfo-electoral-y-promete-seguir-trabajando-juntos/", "source_name": "Infobae / EFE", "summary": "President Santiago Peña congratulated Luiz Inácio Lula da Silva after his victory over Flávio Bolsonaro in Brazil's 25 October runoff, saying the two countries share an integration and development agenda and will keep working together. Paraguay joined most right-leaning South American governments in recognising the result, with Argentina's Javier Milei the notable exception. The outcome shifts attention back to the Itaipú Annex C review and the tariff of USD 19.28 per kW-month that expires in December 2026. Analysts argue Lula has historically been more responsive to Paraguayan demands, but he will face a difficult Congress; Peña had avoided endorsing either candidate during the campaign.", "image_url": "https://www.lanacion.com.py/resizer/v2/DSCJ3GLVFZH73G5XZMAJTCMOYA.jpg?auth=fa558b5355f4ce63d0bb35f9d122aba76a1aea00d869a534ef3d4b7e784e6f1b&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Díaz-Balart highlights the US–Paraguay strategic alliance in security and technology (2026-10-27)", "date": "2026-10-27", "source_url": "https://www.lanacion.com.py/politica/2026/10/27/diaz-balart-resalta-alianza-estrategica-entre-ee-uu-y-paraguay-en-seguridad-y-tecnologia/", "source_name": "La Nación", "summary": "US Congressman Mario Díaz-Balart stressed the strategic alliance between Washington and Asunción in security and technology, citing Paraguay's accession to the Pax Silica initiative as its 26th partner, its critical minerals and hydroelectric resources for AI infrastructure, and the new INL anti-narcotics office in Asunción as a regional hub for the Southern Cone. His remarks followed the 19–21 October visit of Deputy Secretary of State Christopher Landau, the signing of air-interception and border-security instruments, and the announcement of USD 11.75 million in security assistance. The alignment deepens US investment and intelligence cooperation but also raises Paraguay's exposure to US–China technology competition.", "image_url": "https://www.lanacion.com.py/resizer/v2/OWZFO45HPNGJXJWXCVK5ZJMFP4.jpg?auth=d98e5f6242705fd3dce932f5bfafc8a075bf270737d765d838b7e033a6466cc8&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay, Bolivia and Uruguay strengthen Urupabol cooperation in Asunción (2026-10-30)", "date": "2026-10-30", "source_url": "http://spanish.xinhuanet.com/20261030/50a52fffc9fd49928b2bdcae8912873d/c.html", "source_name": "Xinhua", "summary": "Foreign ministers and officials from Paraguay, Bolivia and Uruguay met in Asunción under the Urupabol group, chaired by Paraguayan Foreign Minister Rubén Ramírez Lezcano, to strengthen regional cooperation. The agenda covered logistics and port integration, navigability of the Paraguay–Paraná Hidrovía, air connectivity, multimodal corridors and productive, commercial and energy integration. For landlocked Paraguay, the group is a complementary platform to Mercosur for reducing export logistics costs and improving access to Atlantic and Pacific routes. The meeting produced no binding commitments but reinforces Asunción's push for infrastructure coordination ahead of the 2027–2028 election cycle.", "image_url": "https://www.latribuna.com.py/resizer/v2/PNRP6XQJ5VD6LE76EJL3AM2SGI.jpeg?smart=true&auth=4679b544c7b42ad1da04a0d91fed0d2b8571bf1d3823b77de984ef71b80f002c&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguayan firms join the fourth Mercosur–EU business round in Resistencia (2026-10-29)", "date": "2026-10-29", "source_url": "https://www.ultimahora.com/ronda-de-negocios-mercosur-ue-se-realizara-en-el-chaco-argentino", "source_name": "Última Hora", "summary": "More than 250 companies, including a Paraguayan delegation, took part in the fourth Mercosur–EU business round in Resistencia, Chaco, Argentina, focused on food for supermarkets, construction and wood, trade, services, software and the knowledge economy. The interim Mercosur–EU trade agreement has applied provisionally since 1 May 2026, and the government estimates that at least 95% of Paraguay's current and potential exports will enter Europe tariff-free or with preferences. The main unresolved issue is the internal distribution of quotas: Paraguay is asking for 25%, while Uruguay and Argentina want allocation based on historical trade and Brazil on global trade. A five-year phase-in and certification requirements will determine how quickly firms can use the preferences.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/9b1218b/2147483647/strip/true/crop/1177x662+4+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F0e%2Fbf%2Fb77ba58343e29fb0faf5b4b8b3e1%2Fronda-de-negocios-mercosur.jpg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "V. Industry Focus: Telecom, Digital Energy & AI", "tier": 1, "events": [{"title": "Paraguay to host a USD 12bn AI campus after joining Pax Silica (2026-10-30)", "date": "2026-10-30", "source_url": "https://www.lanacion.com.py/politica/2026/10/30/paraguay-atraera-historico-proyecto-de-ia-por-usd-12000-millones-tras-unirse-a-pax-silica/", "source_name": "La Nación", "summary": "Paraguay is set to host 'Iguazú AI City', a data-centre campus in Yguazú, Alto Paraná, developed by US-based Crusoe and Paraguayan Araico, with a headline investment of USD 12 billion over its first three years, equivalent to roughly a quarter of GDP, and about 280 MW of contracted demand. Phase 1 is only 6 MW and around USD 300 million, with commissioning targeted for late 2026 or early 2027; Phase 2 adds 130 MW and USD 5.5 billion in Q2 2028, and Phase 3 a similar amount in 2029. Power is priced at USD 45/MWh at 220 kV with annual indexation, and capacity will be sold through Crusoe Cloud from Q1 2027. The project was showcased after Paraguay became the 26th Pax Silica partner.", "image_url": "https://www.lanacion.com.py/resizer/v2/CNPHMAIR7BGB7JT3JNT5WUCTK4.jpeg?auth=618aefa7ec71e77f1e1e5e1d31cd31fad6fae045670ba972498993c2b45a4dd7&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Energy expert warns of a 2030–31 supply crunch and calls Annex C renegotiation a 'utopia' (2026-10-29)", "date": "2026-10-29", "source_url": "https://www.latribuna.com.py/negocios/economia/2026/10/29/fabian-caceres-advierte-de-crisis-energetica-y-el-futuro-de-itaipu-tras-elecciones-en-brasil/", "source_name": "La Tribuna", "summary": "Former ANDE manager and energy specialist Fabián Cáceres warned that Paraguay will face severe supply problems around 2030–2031 and may need to import electricity from Brazil, because domestic consumption is approaching the combined output of Itaipú, Yacyretá and Acaray while no new generation tenders are under way and transmission infrastructure is outdated. He called a full renegotiation of Itaipú's Annex C a 'utopia' and said Paraguay 'missed the train', since rising domestic demand will soon absorb its share. He also warned that the country committed 286 MW to a data-centre developer without knowing the final 2027 energy price, and urged a single command unit plus bilateral deals with Brazil. The current USD 19.28/kW-month tariff expires in December 2026.", "image_url": "https://www.latribuna.com.py/resizer/v2/RI4MMVHDBVA2DCN5263ESMJSTI.jpg?smart=true&auth=8e50b9988e0e2cabb0fb1c213fa4d5361e386133365b613fd980f82bc81a7c90&width=1200&height=630", "is_gov_source": false, "is_authoritative": true}, {"title": "Expiry of ANDE's Itaipú operating agreement threatens cheap surplus energy (2026-10-29)", "date": "2026-10-29", "source_url": "https://www.ultimahora.com/se-pronostica-el-fin-del-acuerdo-operativo-que-beneficia-a-la-ande", "source_name": "Última Hora", "summary": "The operating agreement that allows ANDE to access cheap surplus energy from Itaipú expires at the end of 2026, and its loss could significantly affect the state utility's finances and eventually consumer tariffs. Paraguay consumed 25,768 GWh from Itaipú in 2025, 26.4% more than the previous year, while still ceding about a quarter of its half of the output to Brazil. The expiry coincides with the Annex C review, the new USD 45–49/MWh tariff for electro-intensive data-centre clients and rising demand from AI projects. If the surplus mechanism disappears before new generation and transmission come online, ANDE may have to buy replacement power at higher cost, weakening the case for energy-intensive investment.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/ca532df/2147483647/strip/true/crop/3168x1782+0+207/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Ff1%2F3f%2Ffb47242b49929003b6a9ec50b92b%2Flocales-1044741-jpg-2757254.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Conatel closes the public consultation on the 2026–2030 National Telecom Plan (2026-10-26)", "date": "2026-10-26", "source_url": "https://www.conatel.gov.py/prorroga-consulta-publica-borrador-del-plan-nacional-de-telecomunicaciones-2026-2030/", "source_name": "CONATEL", "summary": "Conatel closed the public consultation on the draft National Telecommunications Plan 2026–2030, extending the deadline to 26 October. The plan rests on three pillars: infrastructure and coverage, service quality, and affordability and digital inclusion. Targets for 2030 include 265 districts connected to a fibre backbone, 95.6% population coverage for 4G and 30% for 5G, average mobile download speeds of 35 Mbps and fixed speeds of 160 Mbps, 80% fibre in fixed connections, 60% of homes with fixed access and a 40% reduction in the average price per mobile gigabyte. Estimated capex is USD 2.313 billion, including USD 113 million for a 5,543 km backbone. The final plan will shape spectrum, IoT and homologation rules and the next tender pipeline.", "image_url": "https://dplnews.com/wp-content/uploads/2026/06/Gemini_Generated_Image_2s4av12s4av12s4a-1024x572.png", "is_gov_source": true, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "VI. Key Client Developments", "tier": 1, "events": [{"title": "Claro's 5G network reaches 27 cities and 3 million people (2026-10-29)", "date": "2026-10-29", "source_url": "https://foco.lanacion.com.py/2026/10/29/5g-acelera-su-expansion-y-alcanza-a-3-millones-de-paraguayos/", "source_name": "Revista FOCO", "summary": "Claro Paraguay's 5G network now covers 27 cities across 10 departments, with potential coverage for more than 3 million people, and the operator expects to exceed 100 operational sites by the end of 2026. The rollout began in 2025 with 12 strategic localities covering the central area and has since added Coronel Oviedo, Villarrica, Pedro Juan Caballero, Hernandarias, Ciudad del Este, Encarnación and Cambyretá. Independent nPerf measurements in September still showed national 5G coverage of 23.75%, heavily concentrated in Asunción (77.7%), indicating that marketing coverage and real user experience remain far apart. Claro is positioning itself as the 5G coverage leader before Tigo and Personal launch in early 2027.", "image_url": "https://www.lanacion.com.py/resizer/v2/YBOBP2EFFFETFFPOQD4QS43UAI.webp?auth=11d3ff61b20e384e8927a9513af6f86afcd653c6928a267e1ba5f31f51cc6445&width=924&height=485&smart=true", "is_gov_source": false, "is_authoritative": true, "client_tag": "Claro"}, {"title": "Personal launches a SIM Swap API to fight SIM-swap fraud (2026-10-30)", "date": "2026-10-30", "source_url": "https://www.latribuna.com.py/negocios/marcas/2026/10/30/personal-ofrece-una-solucion-para-reforzar-la-seguridad-digital-y-prevenir-fraudes-por-cambio-de-sim/", "source_name": "La Tribuna", "summary": "Personal Empresas launched SIM Swap, an API that lets banks, fintechs and merchants verify in real time when a customer's SIM card was last changed, in order to prevent SIM-swapping fraud. The service adds identity checks and is designed to help regulated clients comply with the Central Bank's Communication 'A' 7783 on digital security. The launch shows Personal moving beyond connectivity into B2B digital-trust services, a segment with higher margins and stickiness than consumer data. For technology suppliers, it signals demand for subscriber-data integration, API gateways, fraud analytics and security orchestration layered on top of the mobile core.", "image_url": "https://www.latribuna.com.py/resizer/v2/HMJFEPZBXRAUDPP5OEZPYNNWOQ.png?smart=true&auth=b28618a7bb483f42a48c4d0cd8251cec96c8fd7897f01752791c15864a595664&width=1200&height=630", "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal"}, {"title": "Personal's CEO warns of a 'perfect storm' and pitches Telco for AI with 13 data centres (2026-10-28)", "date": "2026-10-28", "source_url": "https://www.lavoz.com.ar/negocios/dilema-inversion-digital-proyectan-lideres-telecomunicaciones-region_0_mtlBe9AYPR.html", "source_name": "La Voz", "summary": "Roberto Nobile, CEO of Personal and Telecom Argentina, told a regional panel that telecommunications faces a 'perfect storm': flat or falling revenue per user against heavy fibre and 5G Standalone investment, with AI-driven traffic growth set to turn the investment gap into a capacity gap. He said more than 75% of mobile traffic is generated by a few hyperscalers that do not bear capacity costs, and proposed consolidation, fair-share contributions, symmetric regulation, network slicing for enterprise customers and a 'Telco for AI' strategy built on the group's 13 data centres. The agenda matters for Paraguay because Personal must launch 5G by February 2027 and is weighing where to invest in edge and AI infrastructure.", "image_url": "https://www.convergencia.com/files/image/206/206916/69a5a60da7316_600_315!.jpg?s=17100b1e7f02b47a803cfeef9543ccbc&d=1772472756", "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal"}, {"title": "Millicom (Tigo) schedules third-quarter results for 5 November (2026-10-28)", "date": "2026-10-28", "source_url": "https://stockhouse.com/news/press-releases/2026/10/28/millicom-tigo-notice-of-third-quarter-2026-results-and-video-conference", "source_name": "Millicom / Stockhouse", "summary": "Millicom, the parent of Tigo Paraguay, announced that it will publish third-quarter 2026 results on 5 November, followed by a video conference for the financial community. Consensus revenue is around USD 2.23 billion at group level, although Paraguay is not reported separately. The results will be watched for capex guidance as Tigo prepares to launch 5G in the 2.3 GHz band by February 2027, with a commitment to at least 100 radio bases within four years and a joint USD 80 million programme with Personal. Any upgrade in group capex or commentary on fibre and data-centre opportunities would be a leading indicator for 2027 vendor orders in Paraguay.", "image_url": "https://manilatimes.net/manilatimes/uploads/images/2026/10/29/1281739.png", "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo"}], "impact_analysis": "", "user_notes": ""}, {"title": "VII. Integrated Impact Analysis for Business", "tier": 2, "events": [], "impact_analysis": "🟡 The exchange rate is now the main macro-policy fault line. The guaraní closed around G. 5,945 per dollar on the BCP's 30 October planilla, after appreciating roughly 11% year-to-date and 17% year-on-year, and the government and business guilds have created a permanent technical table to discuss predictability. A stronger guaraní lowers the local-currency cost of imported network equipment and handsets, but it squeezes exporters and local partners and raises the risk of administrative or quasi-fiscal responses. Contracts should be denominated or indexed in USD, with explicit FX clauses and scenario planning for a move back toward G. 6,100–6,200 if seasonal dollar supply fades.\n\n🟢 The real economy remains supportive. The BCP held the policy rate at 5.50% on 30 October, raised its 2026 growth forecast to 5.0% and cut end-2026 inflation to 3.0%, while INE reported unemployment at 4.1% and employment at 3.29 million. Stable rates, low inflation and record employment support consumer demand for connectivity, smartphones and digital services. The caveat is that growth is increasingly services-led and that underemployment (4.2%) and informality limit disposable-income gains in the interior, where 5G monetisation is weakest.\n\n🔴 Fiscal rigidities are building. The Bicameral budget committee kept the 2027 PGN at G. 166.3 trillion with a 3.9%-of-GDP deficit and an exceptional waiver of the Fiscal Responsibility Law, while adding a G. 398.8 billion salary addendum debated in a closed session and reallocating G. 185.7 billion from debt repayment. Tax revenue grew only 2.3% through September against an 8% target, and the state still owes large arrears to health suppliers and MOPC contractors. Public-sector ICT, energy and infrastructure projects face payment-delay and renegotiation risk, so exposure to ANDE, MOPC and health entities should be secured or avoided.\n\n🟡 Politics is more fragmented but not unstable. Cartes's decision to pull his loyalists into an independent Honor Colorado bench weakens Peña's captive Senate majority and makes budget, appointments and reform votes case-by-case. The 2028 succession fight will absorb legislative bandwidth, while the government's US alignment (Pax Silica, INL office, USD 11.75 million security package) remains one of the few stable axes. For investors, the practical effect is slower decision-making and more need for local political intelligence, not an immediate policy rupture.\n\n🔴 Energy is the biggest structural risk to the data-centre story. The Itaipú operating agreement expires at the end of 2026, the USD 19.28/kW-month tariff is due for revision, and experts warn of a 2030–31 supply crunch. The USD 12 billion Iguazú AI City project is real but back-loaded: Phase 1 is only 6 MW and about USD 300 million, with 97.5% of the headline dependent on later phases, ANDE tariff treatment and the Annex C outcome. Data-centre demand is a genuine opportunity for power equipment, cooling, fibre and ICT, but suppliers should underwrite phase-by-phase and avoid treating the headline number as committed capex.\n\n🟢 Telecom capex is entering a new cycle. Conatel's 2026–2030 plan targets 30% 5G population coverage and USD 2.313 billion of investment, Claro already claims 27 cities and 3 million people covered, and Tigo and Personal must activate 5G by February 2027 with at least 100 sites each within four years. At the same time, the 5G tenders retain trusted-vendor restrictions that disadvantage Chinese equipment, and Nubicom's weak commercial performance (two subscribers after 34 sites) shows that licences do not guarantee viable demand. The winners will be vendors that combine radio access, fibre, energy efficiency and local integration rather than box sales alone.\n\n🔴 The China angle cuts both ways. China supplied 36.4% of Paraguay's imports in January–September (USD 5.45 billion), and smartphones alone were a USD 1.05 billion category, so Chinese supply chains remain indispensable. But Asunción recognizes Taiwan, Beijing sanctioned MITIC minister Gustavo Villate in October, and the US is tying investment and security cooperation to technology alignment. Chinese firms should keep a low political profile, document compliance, avoid dual-use exposure and use Mercosur–EU rules of origin and local assembly where possible to diversify market access.", "user_notes": ""}, {"title": "VIII. Targeted Recommendations for Chinese Enterprises", "tier": 2, "events": [], "impact_analysis": "🟡 Make FX a first-order commercial term. With the guaraní near G. 5,945 and appreciation of about 11% year-to-date, price contracts in USD or index them to the BCP rate, shorten payment terms for guaraní-denominated receivables and stress-test a rebound to G. 6,100–6,200. The government–guild technical table could produce intervention or tax measures; monitor BCP communications and Senate requests rather than assuming the free float continues unchanged.\n\n🟢 Build a 5G and fibre pipeline, not a one-off tender strategy. Conatel's 2026–2030 plan envisages USD 2.313 billion of capex, 265 districts with fibre backbone and 30% 5G population coverage by 2030; Claro plans more than 100 sites by end-2026, and Tigo and Personal must launch by February 2027 and reach 100 sites each within four years. Engage early with operators on engineering, Open RAN, energy-efficient radio and fibre backhaul, and partner with local integrators to navigate trusted-vendor rules. Position as a multi-vendor, standards-compliant supplier rather than a single-box vendor.\n\n🟢 Target the data-centre supply chain, but underwrite it phase by phase. The Iguazú AI City headline is USD 12 billion and 280 MW, yet Phase 1 is only 6 MW and about USD 300 million, and the 286 MW ANDE PPA price is not yet settled for 2027. Focus on Phase 1 and 2 equipment—UPS, cooling, switchgear, prefabricated modules, fibre and DCIM—and require milestone-based payment, performance guarantees and clarity on the ANDE tariff and Annex C before scaling. Avoid inventory or capacity commitments based on the full headline.\n\n🔴 Protect public-sector cash flow. The 2027 budget carries a 3.9%-of-GDP deficit and a Fiscal Responsibility Law waiver, revenue is running at 2.3% versus an 8% target, and arrears to health suppliers and MOPC contractors are large. For ANDE, MOPC, health and municipal projects, require sovereign or multilateral guarantees, escrow or milestone payments, and monitor the 9 November Deputy debate and subsequent Senate vote. Do not assume the PGN will be executed as approved.\n\n🟡 Manage political and sanctions risk deliberately. Paraguay's Taiwan recognition and the October sanctions on MITIC minister Gustavo Villate show that technology issues can become diplomatic ones; US pressure on trusted vendors and cyber-security accusations add friction. Keep a low public profile, strengthen compliance and export-control screening, use local counsel and avoid staffing projects with personnel exposed to visa or sanctions risk. Where possible, localise assembly or services to create Paraguayan jobs and political cover.\n\n🟢 Use Mercosur–EU and Urupabol channels for market access. The interim Mercosur–EU agreement has applied since May 2026 and covers at least 95% of Paraguayan exports at zero or preferential tariffs, while the Urupabol meeting focused on Hidrovía, port and multimodal integration. For projects with regional content, design rules-of-origin-compliant supply chains and consider Paraguay as a light assembly or distribution base for Mercosur, while monitoring the unresolved quota allocation (Paraguay is asking for 25%).\n\n🟡 Plan for social and security disruption. Health-sector strikes (biochemists' 10-day walkout, nurses' protests), the Emboscada prison escape and the early Año Paha police operation can disrupt logistics, site access and public-services payment. Maintain security protocols for staff and warehouses, build buffer stock for Q4, and avoid relying on public laboratories or health facilities for project timelines.", "user_notes": ""}]}};

function renderSection(sec,idx){
  var events=sec.events||[],isT2=sec.tier===2;
  var g=GRAD[idx%8],icon=ICONS[idx%8];
  var body='';
  if(isT2||events.length===0){
    if(sec.impact_analysis)body='<div class="analysis-body">'+fmt(sec.impact_analysis)+'</div>';
    else if(!isT2)body='<div style="padding:4px 22px 16px;color:#94A3B8;font-size:13px;">'+L('暂无此时间段内的事件','No events in this period')+'</div>';
  }else{
    var cards='';
    for(var i=0;i<events.length;i++)cards+=renderCard(events[i],g[0],g[1],icon);

  }
  var badge=events.length>0?'<span class="badge">'+events.length+L(' 条事件',' events')+'</span>':'';
  return '<div class="section s'+(idx%8)+(isT2?' tier2':'')+'" id="sec-'+idx+'"><div class="section-header"><h2>'+esc(sec.title||'')+'</h2>'+badge+'</div>'+(sec.description?'<div class="section-desc">'+esc(sec.description)+'</div>':'')+body+'</div>';
