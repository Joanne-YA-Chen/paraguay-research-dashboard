<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paraguay Briefing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#F0F4FF;color:#1E293B;line-height:1.6;min-height:100vh}
a{color:#3B82F6;text-decoration:none}a:hover{text-decoration:underline}
.header{background:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;border-bottom:3px solid #3B82F6}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;flex-shrink:0}
.header-left h1{font-size:20px;font-weight:700;color:#1E293B}
.header-left .subtitle{font-size:12px;color:#64748B;margin-top:2px}
.header-right{display:flex;gap:8px;align-items:center}
.btn-lang{background:#EEF2FF;color:#4F46E5;font-weight:700;font-size:12px;padding:8px 14px;border-radius:20px;border:none;cursor:pointer}
.btn-lang:hover{background:#E0E7FF}
.btn-primary{background:#3B82F6;color:#fff;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-primary:hover{background:#2563EB;transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.3)}
.btn-secondary{background:#F1F5F9;color:#475569;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:#E2E8F0}
.btn-sm{font-size:11px;padding:6px 12px}
.update-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:moFade .2s}
.update-modal{background:#fff;border-radius:14px;padding:24px 28px;width:440px;max-width:90vw;box-shadow:0 24px 80px rgba(0,0,0,.25);animation:moZoom .25s}
.update-modal h3{font-size:17px;font-weight:700;color:#1E293B;margin-bottom:16px}
.update-modal label{display:block;font-size:12px;font-weight:600;color:#64748B;margin-bottom:4px}
.update-modal select,.update-modal input{width:100%;padding:8px 12px;border:1px solid #CBD5E1;border-radius:8px;font-size:13px;margin-bottom:14px;color:#1E293B;background:#fff}
.update-modal .btn-row{display:flex;gap:8px;justify-content:flex-end}
.time-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.time-preset{padding:5px 12px;border-radius:14px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #CBD5E1;background:#fff;color:#64748B;transition:all .12s}
.time-preset:hover,.time-preset.active{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.history-list{max-height:300px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid #E2E8F0;border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.history-item:hover{background:#F8FAFC;border-color:#CBD5E1}
.history-item .hi-title{font-weight:600;font-size:13px;color:#1E293B}
.history-item .hi-meta{font-size:11px;color:#94A3B8}
.history-item .hi-count{font-size:11px;font-weight:600;color:#3B82F6;background:#EEF2FF;padding:2px 8px;border-radius:10px}
.loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid #CBD5E1;border-top-color:#3B82F6;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.standalone-banner{background:#FEF3C7;color:#92400E;text-align:center;padding:6px 16px;font-size:12px;border-bottom:1px solid #FDE68A;display:none}
.standalone-banner code{background:#FDE68A;padding:1px 5px;border-radius:3px;font-size:11px}

.stats-row{max-width:1400px;margin:0 auto;padding:12px 32px 16px;display:flex;flex-direction:column;gap:8px}
.stats-row-total{display:flex;justify-content:center}
.stats-row-sections{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:768px){.stats-row-sections{grid-template-columns:repeat(2,1fr)}}
.stat-pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;cursor:pointer;transition:all .2s;border:2px solid transparent;font-size:13px;font-weight:600;user-select:none;min-width:0}
.stat-pill:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.pill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pill-label{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-count{font-size:14px;font-weight:700;margin-left:auto;flex-shrink:0;background:rgba(255,255,255,.5);padding:1px 8px;border-radius:10px}
.stat-pill.pill-total{background:#1E293B;color:#fff;font-weight:700;border-radius:24px;display:inline-flex}
.stat-pill.pill-total .pill-count{background:rgba(255,255,255,.2)}

.content{max-width:1400px;margin:0 auto;padding:0 32px 60px}
.section{background:#fff;border-radius:14px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden;border-top:4px solid #3B82F6}
.section.s0{border-top-color:#3B82F6}.section.s1{border-top-color:#EF4444}.section.s2{border-top-color:#10B981}
.section.s3{border-top-color:#8B5CF6}.section.s4{border-top-color:#06B6D4}.section.s5{border-top-color:#F59E0B}
.section.s6{border-top-color:#6366F1}.section.s7{border-top-color:#EC4899}.section.tier2{background:#FAFBFC}
.section-header{padding:16px 22px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-header h2{font-size:16px;font-weight:700;color:#1E293B}
.section-header .badge{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;background:#F1F5F9;color:#64748B;white-space:nowrap}
.section-desc{padding:4px 22px 10px;font-size:12px;color:#94A3B8}
.events-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 22px 18px}
@media(max-width:860px){.events-grid{grid-template-columns:1fr}.event-card{flex-direction:column}.event-card .event-img{width:100%!important;min-height:120px;max-height:180px}}
.event-card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;transition:all .2s;display:flex}
.event-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-1px);border-color:#CBD5E1}
.event-card .event-img{width:160px;min-height:140px;flex-shrink:0;position:relative;overflow:hidden}
.event-card .event-img img{width:100%;height:100%;object-fit:cover;display:block}
.event-card .event-img .img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.event-card .event-body{padding:12px 15px;flex:1;min-width:0;display:flex;flex-direction:column}
.event-card .event-meta{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.event-card .event-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.event-tag.date{background:#F1F5F9;color:#64748B}.event-tag.gov{background:#DCFCE7;color:#15803D}
.event-tag.auth{background:#DBEAFE;color:#1D4ED8}.event-tag.source{background:#FEF3C7;color:#A16207}
.event-tag.client{background:#FCE7F3;color:#BE185D}
.event-card .event-preview{font-size:13px;color:#334155;line-height:1.6;flex:1;overflow:visible;max-height:none}
.event-card .event-link{font-size:11px;margin-top:6px;color:#3B82F6;font-weight:500}
.analysis-body{padding:4px 22px 20px;font-size:13px;line-height:1.8;color:#334155}
.analysis-body h3{font-size:15px;font-weight:700;margin:14px 0 6px;color:#1E293B}
.analysis-body ul{padding-left:0;list-style:none}
.analysis-body li{padding:2px 0 2px 18px;position:relative}
.analysis-body li::before{content:"•";position:absolute;left:2px;color:#3B82F6;font-weight:bold}
.tier-divider{text-align:center;padding:16px 0 8px;margin:8px 0}
.tier-divider span{background:linear-gradient(135deg,#3B82F6,#6366F1);color:#fff;padding:8px 28px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(59,130,246,.25)}
.footer{text-align:center;padding:20px 32px 40px;color:#94A3B8;font-size:12px;max-width:1400px;margin:0 auto}
.macro-dashboard{background:#fff;border-radius:14px;margin-bottom:18px;padding:16px 22px 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-top:4px solid #1E293B}
.macro-title{font-size:15px;font-weight:700;color:#1E293B;margin-bottom:2px}
.macro-period{font-size:11px;font-weight:400;color:#94A3B8;margin-left:6px}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media(max-width:900px){.macro-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.macro-grid{grid-template-columns:1fr}}
.macro-card{background:#F8FAFC;border-radius:8px;padding:10px 8px 4px;border:1px solid #E2E8F0}
.macro-card-title{font-size:10.5px;font-weight:600;color:#475569;margin-bottom:4px;text-align:center;line-height:1.3;min-height:28px;display:flex;align-items:center;justify-content:center}
.macro-card{position:relative}
.macro-source{position:absolute;top:6px;right:8px;font-size:7.5px;color:#94A3B8;font-weight:500;background:#fff;padding:1px 5px;border-radius:3px;border:1px solid #E2E8F0;z-index:1;pointer-events:none}
.macro-latest{display:flex;justify-content:center;align-items:baseline;gap:4px;margin-top:2px;padding:3px 0}
.macro-latest-label{font-size:9px;color:#94A3B8;font-weight:500}
.macro-latest-val{font-size:15px;font-weight:700;color:#1E293B}
.macro-latest-unit{font-size:9px;color:#64748B;font-weight:500}
.macro-latest-date{font-size:9px;color:#94A3B8}
.macro-note{font-size:9px;color:#94A3B8;margin-top:1px}
.macro-card{cursor:pointer;transition:transform .15s,box-shadow .15s}
.macro-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.macro-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:moFade .2s}
.macro-modal-card{background:#fff;border-radius:16px;padding:24px 28px 18px;width:680px;max-width:94vw;max-height:90vh;overflow-y:auto;cursor:default;box-shadow:0 24px 80px rgba(0,0,0,.25);position:relative;animation:moZoom .25s}
.macro-modal-card .macro-card{border:none;padding:0;background:transparent;cursor:default}
.macro-modal-card .macro-card:hover{transform:none;box-shadow:none}
.macro-modal-card .macro-card-title{font-size:15px;min-height:auto;margin-bottom:10px}
.macro-modal-card .macro-legend,.macro-modal-card [style*=legend]{font-size:11px!important}
.macro-modal-close{position:absolute;top:10px;right:16px;font-size:26px;cursor:pointer;color:#94A3B8;background:none;border:none;line-height:1;z-index:10;padding:4px 8px;border-radius:6px}
.macro-modal-close:hover{color:#475569;background:#F1F5F9}
.macro-data-section{margin-top:14px;border-top:1px solid #E2E8F0;padding-top:10px}
.macro-data-toggle{background:#F8FAFC;border:1px solid #CBD5E1;padding:6px 16px;border-radius:6px;font-size:12px;color:#64748B;cursor:pointer;font-weight:500}
.macro-data-toggle:hover{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.macro-data-table-wrap{margin-top:10px;max-height:340px;overflow-y:auto;border:1px solid #E2E8F0;border-radius:8px}
.macro-data-table{width:100%;border-collapse:collapse;font-size:12px}
.macro-data-table th{background:#F8FAFC;padding:7px 12px;text-align:right;font-weight:600;color:#475569;border-bottom:2px solid #E2E8F0;position:sticky;top:0}
.macro-data-table th:first-child{text-align:left}
.macro-data-table td{padding:5px 12px;text-align:right;border-bottom:1px solid #F1F5F9;color:#334155;font-variant-numeric:tabular-nums}
.macro-data-table td:first-child{text-align:left;color:#64748B;font-weight:500}
.macro-data-table tbody tr:hover td{background:#EEF2FF}
.macro-na{color:#CBD5E1!important}
@keyframes moFade{from{opacity:0}to{opacity:1}}
@keyframes moZoom{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:768px){.header{padding:14px 16px}.header-left h1{font-size:16px}.stats-row{padding:10px 14px;gap:6px}.stat-pill{padding:8px 12px;font-size:12px}.pill-label{font-size:11px}.content{padding:0 12px 40px}.section-header{padding:12px 14px 0}.events-grid{grid-template-columns:1fr;padding:4px 14px 14px}}
</style>
</head>

<div class="standalone-banner" id="standaloneBanner">Offline mode · Run <code>python3 web_app.py</code> for live updates</div>

<header class="header">
  <div class="header-left"><div class="header-logo">PY</div><div><h1>巴拉圭简报</h1><div class="subtitle" id="headerSubtitle"></div></div></div>

window.EMBEDDED_BRIEFINGS = {"zh": {"topic": "巴拉圭简报", "time_span": "2026年11月7日 — 2026年11月14日", "time_label": "最近一周", "tiers": [{"name": "Part I: Key News & Developments", "description": "Macro economy, politics, social security, international relations, industry and key client movements in Paraguay"}, {"name": "Part II: Analysis & Recommendations", "description": "Enterprise impact assessment and China-specific strategic recommendations"}], "sections": [{"title": "一、宏观经济动态", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "巴拉圭央行在美元飙升之际于2026年首次干预外汇市场（2026-11-11）", "date": "2026-11-11", "source_url": "https://www.lanacion.com.py/negocios_edicion_impresa/2026/11/11/bcp-intervino-en-el-mercado-cambiario-por-primera-vez/", "source_name": "La Nación", "summary": "央行于11月5日（周四）卖出1470万美元，11月6日（周五）卖出1270万美元，这是其2026年首次外汇干预，旨在抑制圣地亚哥·佩尼亚遭弹劾期间美元飙升。美元在乌埃诺银行挤兑期间触及G. 6,600，随后回落至约G. 6,200至G. 6,300；巴拉圭央行11月13日（周五）的汇率表将参考汇率定为每美元G. 6,215.89，较10月30日的每美元G. 5,944.76上涨约4.5%。此举打破了此前一年巴拉圭央行仅进行干预以减缓瓜拉尼升值的做法。参议院还要求就乌埃诺银行决议对汇率的影响以及干预标准提交一份报告。", "image_url": "https://www.lanacion.com.py/resizer/v2/QR7H2V2B4VDYJGONCSSLTJOLMI.jpg?auth=4d9cc82c9ce41ef35fcfa1b404bc58085b4918818f6ad3b439213df8fa986ce1&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "参议院确认豪尔赫·施赖纳出任巴拉圭央行行长，举报人里瓦罗拉进入董事会（2026-11-09）", "date": "2026-11-09", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/politica/2026/11/09/senado-presta-acuerdo-para-schreiner-al-frente-del-bcp-y-a-rivarola-en-el-directorio/", "source_name": "La Nación / Senate", "summary": "参议院在一次特别会议上以31票赞成、1票反对、1票弃权批准豪尔赫·路易斯·施赖纳·马伦戈担任中央银行行长，并以33票赞成、0票反对批准费尔南多·哈维尔·里瓦罗拉·安古洛担任董事会正式成员。施赖纳曾任证券监管机构国家证券委员会负责人和巴拉圭央行董事会成员，接替在乌埃诺银行倒闭后辞职的卡洛斯·卡瓦略；里瓦罗拉是前监管经理，曾指出乌埃诺银行的违规行为。施赖纳表示，其首要任务是恢复巴拉圭央行的公信力，并将运用第489/95号法律第50条，对剧烈、非基本面驱动的汇率波动进行干预，包括在瓜拉尼汇率超调时买入美元。这些任命由总统佩德罗·阿利亚纳提出。", "image_url": "https://www.lanacion.com.py/resizer/v2/MPWETF5JWNCTND3G3MBAGHAI3M.jpg?auth=bc30fb87888fa91bb868821c144a53ce602d454c14dc8e775436295ceedb9816&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "截至10月出口额突破178亿美元，大豆产业链创下纪录（2026-11-11）", "date": "2026-11-11", "source_url": "https://www.ultimahora.com/balanza-comercial-registra-un-superavit-comercial-de-usd-668-millones-a-octubre", "source_name": "Última Hora / BCP", "summary": "1月至10月，巴拉圭出口额达到178.156亿美元，同比增长25%，实现6.686亿美元贸易顺差，而2025年同期为约7.2亿美元贸易逆差。大豆产业链创收66.24亿美元，几乎是2025年33.3亿美元的两倍，其中大豆籽粒830万吨、豆油595,298吨、豆粕颗粒209万吨、生物柴油31,172吨。2025/26年度大豆产量达到创纪录的1260万吨。阿根廷占大豆籽粒出口的85%至87%，巴西约占11%。巴拉圭央行数据显示，仅大豆籽粒一项出口额就达33.169亿美元，金额同比增长45.7%，数量同比增长35.7%。这一纪录是对银行业危机所引发信心冲击的最有力对冲。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/9eadfe7/2147483647/strip/true/crop/1666x937+0+18/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Ffb%2F25%2F749af32740099484a2c71cabef77%2Fsoja.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭央行已向170万乌埃诺储户返还3.35亿至3.55亿美元，但保障基金仅覆盖27%（2026-11-11）", "date": "2026-11-11", "source_url": "https://www.emol.com/noticias/Economia/2026/11/11/1216757/ueno-bank-devolucion-dinero-banco.html", "source_name": "Emol / BCP", "summary": "截至11月10日至11日，巴拉圭央行已根据一项紧急法律，向约170万至178万名乌埃诺银行储户返还了约3.35亿至3.55亿美元，该法律加快了最高40个月最低工资（约19,500美元）的赔付进度，覆盖了第一阶段符合条件储户的约93%至97%。乌埃诺银行持有28亿至28.4亿美元存款，其中71%为私人存款，其余为公共实体存款，主要是社会保障协会养老金机构。存款保障基金为每位储户提供最高75个月最低工资的保障，约2.283亿瓜拉尼（37,000至38,300美元），预计将支付约7.4亿美元，仅占存款总额的27%。其余部分取决于资产出售和清算，养老基金享有优先权。巴拉圭央行坚称该事件属个别情况，并非系统性风险。", "image_url": "https://static.emol.cl/emol50/Fotos/2026/11/11/file_20261111112032.jpg", "is_gov_source": false, "is_authoritative": true}]}, {"title": "二、政治与政策变化", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "阿利亚纳在参议院因乌埃诺银行倒闭罢免培尼亚后就职（2026-11-06）", "date": "2026-11-06", "source_url": "https://www.lanacion.com.py/politica/2026/11/05/diputados-aprueban-por-unanimidad-libelo-acusatorio-para-juicio-politico-de-santiago-pena/", "source_name": "La Nación", "summary": "副总统佩德罗·阿利亚纳于11月6日就任总统，此前参议院在弹劾审判中以44票判定圣地亚哥·佩尼亚有罪，而一天前众议院以78票对0票批准了相关指控。佩尼亚已于11月5日宣布辞职，但由于科罗拉多党议员退场，国会联席会议未能达到法定人数，反对派继续推进，剥夺了他的终身参议员特权。指控主要围绕他曾持有的乌埃诺控股集团股份所涉利益冲突、监管操纵以及养老基金损失。法院下令对佩尼亚实行软禁，并拘留了八名乌埃诺集团高管，包括前银行行长胡安·曼努埃尔·古斯塔莱和费德里科·米格尔·巴斯克斯·比利亚桑蒂。科罗拉多党领导人阿利亚纳将任职至2028年8月。", "image_url": "https://www.lanacion.com.py/resizer/v2/6Z5RYESSPVG5FGOZ22MFK2OKKM.jpeg?auth=43d0019c8422950a811a7fab60422e419848d25d5cc82bf95a302ea725d6b152&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "阿利亚纳要求全体部长辞职并改组内阁和军事指挥体系（2026-11-09）", "date": "2026-11-09", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/politica_edicion_impresa/2026/11/10/alliana-mueve-mas-piezas-dentro-del-gabinete-y-designa-a-nuevos-titulares/", "source_name": "La Nación", "summary": "在上任后的第一个工作周一，阿利亚纳指示新任办公室主任罗兰多·德巴罗斯·巴雷托，要求所有部长、执行秘书和公共机构负责人将职位交由他安排，并警告称“没有任何职位是有保障的”。他任命阿里尔·马丁内斯为内政部长，胡安·卡洛斯·巴鲁哈为公共工程与通信部（MOPC）部长，在解除古斯塔沃·比利亚特职务后任命胡安·巴勃罗·科斯普为信息与通信技术部（MITIC）临时负责人，维克托·冈萨雷斯·贝多亚为环境与可持续发展部（MADES）部长，爱德华多·冈萨雷斯·巴埃斯为总统法律顾问。他确认奥斯卡·洛维拉继续担任财政部长，马科·里克尔梅继续担任工业部长，鲁文·拉米雷斯·莱斯卡诺继续担任外交部长，伊萨亚斯·弗雷特斯继续担任卫生部长。曼努埃尔·罗德里格斯·索萨将军被任命为武装部队司令，陆军、空军和军事内阁的新任临时负责人也已确定。预计还将有更多人事调整。", "image_url": "https://www.lanacion.com.py/resizer/v2/BTMONGW6UJCLRIDXS2CMLUQNBA.jpg?auth=f5b3f8e64d7aaad211042acf1f22ade1c2229b157c7b84a0484a62c30dfc1a78&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "阿利亚纳向国会提交一项法案，要求将与乌埃诺有关联的公司置于临时国家管理之下（2026-11-12）", "date": "2026-11-12", "source_url": "http://spanish.xinhuanet.com/20261113/12cd01b6078240528c9d5d4df89903db/c.html", "source_name": "Xinhua / Última Hora", "summary": "行政部门向国会提交了一项法案，以维持与倒闭的乌埃诺银行有关联的公司继续运营并保护就业。该法案将任命一名临时管理人，任期八个月，撤换现任董事和经理，并设立一个由财政部、工业部和劳动部组成的监督委员会。国家不会承担这些公司的债务，该措施将排除正在接受刑事调查或由资产扣押机构塞纳维科掌控的公司；资产转让、股息及向股东付款将受到限制。官员们表示，目标是保住5000多个工作岗位。巴拉圭工业联盟警告称“没有犯错余地”，并敦促控制支出而非增税；与此同时，工业和贸易部、财政部与巴拉圭银行协会成立了一个工作组，处理11月和12月的营运资金融资问题。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/0f25a61/2147483647/strip/true/crop/2560x1440+0+187/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fec%2F15%2F7420a2d547abaec9791559277a7f%2Frolando-de-barros-y-gabinete-presidencia.jpg", "is_gov_source": true, "is_authoritative": true}]}, {"title": "三、社会与安全形势", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "教师因受乌埃诺冲击的养老基金发起无限期全国罢工（2026-11-09）", "date": "2026-11-09", "source_url": "https://www.lanacion.com.py/pais/2026/11/09/arranca-movilizacion-nacional-de-docentes/", "source_name": "La Nación", "summary": "公立学校教师于11月9日开始无限期全国罢工，此次罢工由巴拉圭教育工作者联合会、全国教育工作者联盟—全国工会、巴拉圭教育工作者组织—真正派、巴拉圭教育工作者组织—全国工会和全国校长工会发起，主要集会在国会对面的武器广场举行。他们要求归还滞留在乌埃诺银行的大约6000万美元财政储蓄银行资金和3.5亿美元社会保障局养老金基金，要求国家为养老金提供担保、制定一部保护这两项基金的法律、加薪8%，并在2027年预算中增加教育支出。全国停课，“零饥饿”校餐计划在亚松森、中央省、海斯总统省和圣佩德罗省暂停。政府同日启动对话，随后同意将加薪幅度下限从5%提高到8%，清理积压的退休申请，并将每日上课时间延长30分钟，以换取不扣工资。", "image_url": "https://www.lanacion.com.py/resizer/v2/EHS6R2X5OZD5VGXX754ROA6CKA.jpg?auth=3454ff7fee28dd75a8460283d92c082fd615dfb49875551c6d0eb3becc200250&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭请求阿根廷、卢森堡和美国追查乌埃诺银行资产（2026-11-10）", "date": "2026-11-10", "source_url": "https://www.elnacional.com/2026/11/que-paso-con-el-dinero-de-ueno-bank-en-paraguay-y-cuanto-falta-recuperar/", "source_name": "El Nacional (Venezuela)", "summary": "巴拉圭政府证实，已请求阿根廷、卢森堡和美国提供司法合作，以追踪乌埃诺银行在境外的可能资金和资产。检察官已拘留八名高管，包括前银行行长胡安·曼努埃尔·古斯塔莱和控股股东费德里科·米格尔·巴斯克斯·比利亚桑蒂，并实施了7000万美元和1.62万亿瓜拉尼的预防性查封。社会保障局称，有3.28亿至3.8亿美元的养老金资金受到波及，致使约3.2万名退休人员的福利面临风险，并已提起刑事控告。该银行的公共部门存款估计为8.5亿至8.69亿美元，约占6月份存款的29%。该案已成为巴拉圭跨境追回资产能力的一次考验。", "image_url": "https://elnacional-uploads.nyc3.digitaloceanspaces.com/wp-content/uploads/2026/11/10155024/AFP__20261110__D73J6TP__v1__HighRes__ParaguayPoliticsBankingCrisis-2560x1691.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "警方将年终“阿尼奥帕哈”行动提前，在首都地区投入5900名警员（2026-11-11）", "date": "2026-11-11", "source_url": "https://www.adndigital.com.py/policia-adelanta-operativo-de-fin-de-ano-con-controles-patrullas-y-agentes-tacticos/", "source_name": "ADN Digital", "summary": "在圣洛伦索发生一系列持械抢劫和一起未遂自动取款机撬窃案后，国家警察提前启动了年底“年终”安全行动。该行动在亚松森部署约2,347名警员、在中央省部署3,550名警员，另配备持长武器的战术小组、利马40小组、摩托车、巡逻队和调查人员。银行、购物区、自动取款机和居民区被列为优先目标，覆盖范围扩大至上巴拉那省（尤其是东方市）、阿曼拜省、卡宁德尤省、库鲁瓜蒂和萨尔托斯德尔瓜伊拉。警方为现金转运提供免费护送，包括12月奖金，另有5,000名新警官将于12月18日毕业。官员将提前部署与银行业危机期间风险上升联系起来。", "image_url": "https://www.lanacion.com.py/resizer/v2/DV25FKSXGFGKHENVGSBJ73NTBI.jpg?auth=95e075c81134f6b697150b6bed45786a7c9921fd8295016870659f1449a2f9e0&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "东方市枪战致一名嫌疑人死亡，另一人受伤（2026-11-11）", "date": "2026-11-11", "source_url": "https://www.lanacion.com.py/pais/2026/11/11/policia-frustro-asalto-persiguio-a-los-sospechosos-abatio-a-uno-e-hirio-a-otro-en-cde/", "source_name": "La Nación", "summary": "11月11日，一名休班警察在埃斯特城挫败了一起摩托车抢劫案，追击嫌疑人并与之交火，击毙一名袭击者，击伤另一名。两名嫌疑人都有犯罪前科。此事件发生之际，有报道称上巴拉那省出现一波不安全浪潮，埃斯特城、明加瓜苏、弗朗哥总统市和埃尔南达里亚斯接连发生车辆盗窃和抢劫，而在此之前，“阿尼奥帕哈”行动已提前启动。三国边境地区的商业团体长期抱怨私人安保成本以及犯罪对零售和物流造成的影响；新任内政部长阿列尔·马丁内斯承诺采取更强硬立场，并与公共部加强协调。", "image_url": "https://www.lanacion.com.py/resizer/v2/S7MW36RBGFBQ5GMEYZ6NDCNFLY.png?auth=b4716a0afc9ed4d96d49b9c1d692c1fcd23e6a8a8b50dbb5ecd6c0ae46b8b6a8&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}]}, {"title": "四、国际关系与外交动态", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "阿利亚纳延续培尼亚的外交政策，并表示与美国、以色列和台湾的关系保持不变（2026-11-08）", "date": "2026-11-08", "source_url": "https://www.lanacion.com.py/politica/2026/11/05/alliana-mantendra-la-politica-exterior-de-pena-y-ratificara-alianzas-con-ee-uu-israel-y-taiwan/", "source_name": "La Nación", "summary": "据政府官员在权力交接后透露，阿利亚纳总统将维持圣地亚哥·佩尼亚的外交政策，并重申与美国、以色列和台湾的盟友关系。台湾是巴拉圭在南美洲唯一的外交盟友，11月6日表示政府更迭不会影响双边关系，亚松森方面也表示与华盛顿、耶路撒冷和台北的关系保持不变。这种延续性涵盖2026年3月签署的《部队地位协定》（SOFA）、参与美国主导的“美洲之盾”安全倡议以及打击跨国犯罪合作。原定11月14日佩尼亚与唐纳德·特朗普的会晤是否举行仍不确定；官员称可能改为与阿利亚纳举行视频会议。北京方面10月因信息与通信技术部（MITIC）部长古斯塔沃·比利亚特支持台湾而对他实施制裁。", "image_url": "https://www.lanacion.com.py/resizer/v2/PT3DOCXHLZBWPBSEGIYENDWF2E.jpeg?auth=9fce9066187c8a7fc8a1c93a2e5e6726dbd6827b4f45278f39b868959ba9eb41&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "阿利亚纳暂停其前往台湾的正式访问，以专注应对国内危机（2026-11-09）", "date": "2026-11-09", "source_url": "https://www.ultimahora.com/alliana-suspende-viaje-a-taiwan-el-presidente-gobernara-en-paraguay", "source_name": "Última Hora", "summary": "幕僚长罗兰多·德巴罗斯·巴雷托证实，阿利亚纳已暂停原定于11月24日对台湾的正式访问，该访问包括与赖清德总统会面，以优先处理国内议程。这位官员表示：“他不是一个经常出访的人；现在他的优先事项在国内。”这一决定使阿利亚纳与培尼亚拉开距离，后者因出访70多次而受到批评；此前总统就职演说也未提及台湾。台北方面称双边关系未受影响，但这一事件重新引发了有关巴拉圭外交承认的辩论。自2023年底以来，至少19名巴拉圭议员访问过中国，红党内一个务实、倾向北京的派系正在推动开启贸易关系，不过预计不会立即转向。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/3f61671/2147483647/strip/true/crop/1440x810+0+70/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F7d%2F9d%2F170750a441aa8263bba33542d438%2Fgabinete-alliana.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "卢拉祝贺阿利亚纳并邀请其前往巴西利亚，伊泰普附件C成为首要议程（2026-11-07）", "date": "2026-11-07", "source_url": "https://www.opovo.com.br/noticias/mundo/2026/11/07/lula-deseja-exito-a-pedro-alliana-como-presidente-do-paraguai.html", "source_name": "O Povo / El Nacional", "summary": "巴西总统路易斯·伊纳西奥·卢拉·达席尔瓦于10月再次当选，他向佩德罗·阿利亚纳表示祝贺，并邀请他前往巴西利亚，以审查双边议程并为两国关系注入“新的动力”；阿利亚纳表示，他期待双方建立“非常富有成效”的关系。核心问题是《伊泰普条约》附件C的修订：大坝债务已于2023年2月偿清，审查原定于2024年12月前完成，但未能达成协议。目前每千瓦19.28美元的电价将持续到2026年底；巴拉圭抵制大幅降价，因为希望将这笔收入用于基础设施和社会项目，而巴西反对提高受监管用户的电价。新任国家电力管理局局长费利克斯·索萨称此次审查是“根本性的战略优先事项”，阿利亚纳计划在2026年底前前往巴西利亚。", "image_url": "https://elnacional-uploads.nyc3.digitaloceanspaces.com/wp-content/uploads/2026/09/13203208/Lula-Brasil.jpg", "is_gov_source": false, "is_authoritative": true}]}, {"title": "五、行业专题：通讯、运营商、数字能源与AI", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "总审计署建议吊销努比科姆的5G许可证，国家电信委员会启动调查程序（2026-11-09）", "date": "2026-11-09", "source_url": "https://www.latribuna.com.py/nacionales/locales/2026/11/09/nubicom-contraloria-pide-evaluar-el-retiro-de-la-licencia-5g/", "source_name": "La Tribuna", "summary": "总审计长建议国家电信委员会（Conatel）评估注销努比科姆巴拉圭公司依据第2635/2025号决议获得的5G牌照，因为总审计长认定该公司无法证明其第一年网络部署计划。国家电信委员会此前已启动行政调查程序（第2816/2026号决议），原因是阿根廷股东努比科姆有限责任公司通报了11月5日至6日发生的一起未经授权的股份转让，且未能指明买方，导致监管机构无法确定该持牌公司由谁控制。媒体报道将努比科姆与巴斯克斯集团和乌埃诺银行联系起来；国家电信委员会于10月向乌埃诺银行划转了700亿瓜拉尼（10月13日从因特菲萨银行划转500亿瓜拉尼，10月15日从国家开发银行划转200亿瓜拉尼），乌埃诺银行为该牌照出具了75,000美元的投标保函。国家电信委员会称，努比科姆已通过检查的34个无线基站完成了初步建设，但仅有2个用户。", "image_url": "https://www.latribuna.com.py/resizer/v2/BZEXKVYBWNEMJI5A5VN5U55DAY.png?smart=true&auth=0d270967f9d33afec97ed75258b93534de14ec3f59af85d144c4b31e8dbae6b6&width=1200&height=630", "is_gov_source": true, "is_authoritative": true}, {"title": "国家电力管理局将在2027年让加密货币挖矿合同到期，并将伊泰普水电站的剩余电力转用于人工智能数据中心（2026-11-13）", "date": "2026-11-13", "source_url": "https://www.diariobitcoin.com/mineria/paraguay-pondra-fecha-de-vencimiento-a-los-contratos-electricos-especiales-para-mineros-de-bitcoin/", "source_name": "Diario Bitcoin", "summary": "巴拉圭国家电力管理局表示，所有面向加密矿工的特殊电力合同将于2027年12月31日到期且不再续期。截至4月，矿工签约容量约为944兆瓦，接近巴拉圭伊泰普份额的13%，并在2026年创造约3.5亿美元收入。剩余电力正被重新导向人工智能数据中心：与阿莱科公司及价值120亿美元的伊瓜苏人工智能城项目有关联的昆图尔公司赢得了一份为期15年、最高286兆瓦的合同，从2026年12月1日起以6兆瓦起步，到2029年增至286兆瓦，据报道电价为每兆瓦时48.91至56.39美元。克鲁索能源公司和阿莱科公司计划初期建设106兆瓦，并可选择扩建至约280兆瓦，首批设施于2027年年中投产。蜂巢公司约77%的挖矿产能位于巴拉圭，也将在2027年底失去其200兆瓦和100兆瓦的合同。2026年前八个月，全国电力需求增长17.9%。", "image_url": "https://diariobitcoin.b-cdn.net/wp-content/uploads/2026/11/canuto-imagine-1794618182.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "巴拉圭商业周在东方市开幕，设260个展位，目标6亿美元（2026-11-12）", "date": "2026-11-12", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/negocios_edicion_impresa/2026/11/12/se-inicio-la-mayor-feria-integrada-en-el-este/", "source_name": "La Nación", "summary": "巴拉圭规模最大的一体化贸易博览会在东方市开幕，汇集了第17届巴拉圭-巴西博览会、第10届出口加工博览会、上巴拉那投资论坛和中小微企业广场。展会设有260个展位、300多家参展商和约2000场商务洽谈，主办方预计成交额将超过6亿美元，参观人数将达1.2万人次。该活动由巴拉圭-巴西商会在工业部通过投资与出口促进局的支持下主办。1月至10月双边贸易额达67亿美元，同比增长8%，但在乌埃诺银行危机后，约320家在巴拉圭设厂的巴西公司（其中90家从事纺织业）正谨慎关注信贷和支付条件。", "image_url": "https://www.lanacion.com.py/resizer/v2/A52M3DWJANHNHJDPFCC55WXSZ4.jpg?auth=8cb75542f1a3e8cbb4f4aee40b6ce886b388d237fa6de52cd49af48c2baabe31&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "阿利亚纳暂停断电至12月31日，并冻结电价一年（2026-11-13）", "date": "2026-11-13", "source_url": "http://spanish.xinhuanet.com/20261113/a019de9fa8df41e5a248f4c3233ff149/c.html", "source_name": "Xinhua", "summary": "阿利亚纳总统暂停了对低压和中压用户因欠费实施的断电措施，直至12月31日，并允许欠款最多分24期免息支付且不收取罚金。他还表示，电价至少一年内不会上涨。这些措施旨在帮助受乌埃诺银行危机和瓜拉尼突然贬值冲击的家庭和小企业，但也给国家电力管理局（ANDE）增加了财政压力；当前电力需求增长17.9%，政府正与巴西就伊泰普水电站附件C电价进行谈判。分析人士警告，在成本上升之际冻结电价，会将负担转嫁给该电力公司的资产负债表，并可能推迟亟需的电网投资。", "image_url": "https://www.lanacion.com.py/resizer/v2/PB4PJQNBYJAGVJERJFYDCMNYZA.jpg?auth=e69ba96ffe8273aab9f3ed0fe61c0ac82ee439ee8457e6e3fdd076611dae7ffe&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}]}, {"title": "六、主要客户动向", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "米雷康姆（蒂戈）报告巴拉圭服务收入1.75亿美元，第三季度EBITDA利润率为54.8%（2026-11-05）", "date": "2026-11-05", "source_url": "https://stockanalysis.com/filings/TIGO/3938358/", "source_name": "Millicom / SEC filing", "summary": "米雷康姆于11月5日发布的第三季度业绩显示，巴拉圭服务收入为1.75亿美元，受后付费用户增长推动，同比有机增长3.6%；调整后息税折旧摊销前利润为1.01亿美元，同比有机增长11%，利润率为54.8%，为集团最高水平之一。集团层面，服务收入约为21亿美元（有机增长5.4%），调整后息税折旧摊销前利润创纪录地达到10.9亿美元（增长7.7%），利润率为48%，股权自由现金流为3.16亿美元，使全年指引保持在11亿美元附近。杠杆率降至2.53倍。巴拉圭与危地马拉、巴拿马和厄瓜多尔同被归为中等增长、高利润率市场。蒂戈持有2.3吉赫兹频段中的100兆赫频谱，必须在2027年2月之前推出商用5G服务。", "image_url": "https://www.telesemana.com/wp-content/uploads/2025/04/FWA.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo"}, {"title": "阿根廷电信：佩尔索纳尔巴拉圭收入第三季度实际增长8.3%（2026-11-12）", "date": "2026-11-12", "source_url": "http://archive.fast-edgar.com/20261112/ACBZ822D8M22B2ZU222R2MZZGNLLZ2V2ZV82/", "source_name": "Telecom Argentina / SEC filing", "summary": "阿根廷电信通过努克莱奥股份公司以佩尔索纳尔品牌在巴拉圭运营，该公司报告第三季度巴拉圭移动服务收入为 P. 66,324百万，按实际值计算同比增长8.3%；前九个月为 P. 191,752百万，按实际值计算增长16.7%。该集团本季度录得净亏损 P. 56,615百万，但前九个月录得净利润 P. 862,959百万。阿根廷、乌拉圭和巴拉圭的电视订户数达到3.6百万户，增长4.3%。努克莱奥公司于7月以100万美元赢得3.7-3.8 GHz频段的5G I段和J段频谱，其中70万美元已支付，且必须在2027年2月前启动5G商用。佩尔索纳尔还计划商用推出5G独立组网。", "image_url": "https://dplnews.com/wp-content/uploads/2026/06/Gemini_Generated_Image_2s4av12s4av12s4a-1024x572.png", "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal"}, {"title": "克拉罗仍是唯一在运营的5G网络，蒂戈和个人电信正在竞逐2027年2月的最后期限（2026-11-12）", "date": "2026-11-12", "source_url": "https://www.rdn.com.py/2026/10/02/cuando-llegara-la-conectividad-5g-a-todo-el-pais/", "source_name": "RDN / Conatel", "summary": "克拉罗公司在首轮拍卖中获得3.5 GHz频段200 MHz频谱，并于2025年底启动商用，目前仍是巴拉圭唯一拥有在运营5G的运营商，覆盖10个省的27个城市和300多万人口，其五年计划投资3500万美元，预计到2026年底建成100多个站点。蒂戈和佩索纳尔在2026年8月第二次拍卖中各获得100 MHz频谱，自收到通知起有180天时间启动商用服务，这一截止日期为2027年2月；它们还须在四年内各自部署至少100个基站，其中10个须在两年内供国有实体使用。它们的项目计划建设250至500个站点，投资约7900万至8000万美元。截至11月中旬，两家均尚未启动商用服务。", "image_url": "https://www.rdn.com.py/i/jpeg/1200/2026/10/5gplazospy.jpg?v=jpeg92", "is_gov_source": false, "is_authoritative": true, "client_tag": "Claro / Tigo / Personal"}]}, {"title": "七、对企业经营的综合影响分析", "tier": 2, "events": [], "impact_analysis": "🔴 巴拉圭已从一个宏观叙事转向偿付能力与治理叙事。乌埃诺银行的处置冻结了约28亿美元存款，其中包括3.28亿至3.80亿美元的社会保险协会养老金资金和约6000万美元的财政基金资金，并引发培尼亚总统被免职、新政府组建、巴拉圭央行新一届董事会成立以及2026年首次外汇干预。瓜拉尼从10月30日的5,945瓜拉尼一路走贬，盘中触及6,600瓜拉尼，最终在11月13日官方汇率表收于6,215.89瓜拉尼，两周内贬值约4.5%，回吐了年初至今11%升值幅度中的一部分。宏观基本面依然强劲：截至10月出口额创纪录达到178亿美元，贸易顺差为6.686亿美元，通胀率为1.7%，增长预测为5.0%。但信心如今已成为关键制约因素。对企业而言：（1）外汇波动是首要风险，年底前实际区间预计为6,000至6,600瓜拉尼；（2）银行对手方风险上升，存款保障仅覆盖乌埃诺银行存款的约27%；（3）国家对乌埃诺关联企业的临时接管可能扰乱供应商、租户和服务合同；（4）财政压力——截至9月赤字占GDP的2.0%，全年预测为3.2%——限制了减税空间；（5）2027年2月的5G截止期限以及国家电力局向AI数据中心转向带来了资本支出机会，但也带来监管不确定性；（6）新政府正在审查合同并重组各部委，因此公共招标将会推迟。", "user_notes": ""}, {"title": "八、对中资企业的专项影响与建议", "tier": 2, "events": [], "impact_analysis": "🟡 中国企业应将下一季度视为流动性与合同风险应对期。(1) 资金管理：将闲置瓜拉尼余额转移至顶级银行或兑换为美元，并梳理对乌埃诺关联的巴斯克斯集团旗下公司以及对依赖社会保险局或财政公积金付款的交易对手的风险敞口。(2) 合同：将价格与巴拉圭央行工资指数挂钩，加入外汇调整条款和银行假日条款，并尽可能缩短应收账款账期。(3) 供应链：约 320 家在巴拉圭设厂的巴西企业（其中 90 家为纺织企业）面临信贷收紧；预计付款将放缓，供应商融资请求将增多。(4) 能源密集型项目：在 2027-2028 年供应紧张之前锁定长期购电协议；国家电力局 286 兆瓦昆图尔合同以及 2027 年底加密货币截止期限表明，优先接入权将流向人工智能数据中心，而电价则冻结一年。(5) 电信：克拉罗已在 27 个城市上线，而蒂戈和佩尔索纳尔必须在 2027 年 2 月前推出服务；设备、集成和数据中心方面存在机会，但技术规则仍排除中国 5G 供应商，因此应聚焦非无线接入网层和企业解决方案。(6) 公共部门：随着新政府审查合同，预计公共工程与通信部、信息与通信技术部和国家电力局将出现延迟和重新招标。(7) 政治风险：阿利亚纳在红党内部分裂、街头动员活跃的背景下执政；对台湾和美国的政策连续性可能较大，但不能排除对北京开放，因此避免将涉台承诺作为商业交易的条件。", "user_notes": ""}]}, "en": {"topic": "Paraguay Briefing", "time_span": "November 7 – November 14, 2026", "time_label": "Last week", "tiers": [{"name": "Part I: Key News & Developments", "description": "Macro economy, politics, social security, international relations, industry and key client movements in Paraguay"}, {"name": "Part II: Analysis & Recommendations", "description": "Enterprise impact assessment and China-specific strategic recommendations"}], "sections": [{"title": "I. Macroeconomic Developments", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "BCP intervenes in the FX market for the first time in 2026 as the dollar spikes (2026-11-11)", "date": "2026-11-11", "source_url": "https://www.lanacion.com.py/negocios_edicion_impresa/2026/11/11/bcp-intervino-en-el-mercado-cambiario-por-primera-vez/", "source_name": "La Nación", "summary": "The Central Bank sold USD 14.7 million on Thursday 5 November and USD 12.7 million on Friday 6 November, its first currency intervention of 2026, to damp a spike in the dollar during the impeachment of Santiago Peña. The dollar touched G. 6,600 during the Ueno Bank run and then retreated to about G. 6,200-6,300; the BCP planilla of Friday 13 November fixed the reference rate at G. 6,215.89 per dollar, up roughly 4.5% from G. 5,944.76 on 30 October. The move marks a break with a year in which the BCP had intervened only to slow the guaraní's appreciation. The Senate also requested a report on the exchange-rate impact of the Ueno resolution and on the criteria for intervention.", "image_url": "https://www.lanacion.com.py/resizer/v2/QR7H2V2B4VDYJGONCSSLTJOLMI.jpg?auth=4d9cc82c9ce41ef35fcfa1b404bc58085b4918818f6ad3b439213df8fa986ce1&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Senate confirms Jorge Schreiner as BCP president and whistleblower Rivarola to the board (2026-11-09)", "date": "2026-11-09", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/politica/2026/11/09/senado-presta-acuerdo-para-schreiner-al-frente-del-bcp-y-a-rivarola-en-el-directorio/", "source_name": "La Nación / Senate", "summary": "In an extraordinary session the Senate approved Jorge Luis Schreiner Marengo as president of the Central Bank by 31 votes to 1 with 1 abstention, and Fernando Javier Rivarola Angulo as a full board member by 33 votes to nil. Schreiner, a former head of the securities regulator CNV and BCP board member, replaces Carlos Carvallo, who resigned after the Ueno Bank collapse; Rivarola is the former supervision manager who flagged Ueno's irregularities. Schreiner said his priority is to restore the BCP's credibility and that he will use Article 50 of Law 489/95 to intervene against abrupt, non-fundamental currency moves, including buying dollars if the guaraní overshoots. The appointments were proposed by President Pedro Alliana.", "image_url": "https://www.lanacion.com.py/resizer/v2/MPWETF5JWNCTND3G3MBAGHAI3M.jpg?auth=bc30fb87888fa91bb868821c144a53ce602d454c14dc8e775436295ceedb9816&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "Exports top USD 17.8bn through October as the soy complex sets a record (2026-11-11)", "date": "2026-11-11", "source_url": "https://www.ultimahora.com/balanza-comercial-registra-un-superavit-comercial-de-usd-668-millones-a-octubre", "source_name": "Última Hora / BCP", "summary": "Paraguayan exports reached USD 17,815.6 million between January and October, up 25% year-on-year, producing a trade surplus of USD 668.6 million after a deficit of about USD 720 million in the same period of 2025. The soy complex generated USD 6,624 million, almost double the USD 3,330 million of 2025, on 8.3 million tonnes of grain, 595,298 tonnes of oil, 2.09 million tonnes of pellets and 31,172 tonnes of biodiesel. The 2025/26 harvest hit a record 12.6 million tonnes. Argentina took 85-87% of grain exports and Brazil about 11%. The BCP put grain soy alone at USD 3,316.9 million, up 45.7% in value and 35.7% in volume. The record is the strongest counterweight to the confidence shock from the banking crisis.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/9eadfe7/2147483647/strip/true/crop/1666x937+0+18/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Ffb%2F25%2F749af32740099484a2c71cabef77%2Fsoja.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "BCP has returned USD 335-355m to 1.7m Ueno depositors, but the guarantee fund covers only 27% (2026-11-11)", "date": "2026-11-11", "source_url": "https://www.emol.com/noticias/Economia/2026/11/11/1216757/ueno-bank-devolucion-dinero-banco.html", "source_name": "Emol / BCP", "summary": "By 10-11 November the BCP had returned about USD 335-355 million to between 1.7 and 1.78 million Ueno Bank depositors, roughly 93-97% of those eligible in the first phase, under an emergency law that sped up payouts of up to 40 minimum wages (about USD 19,500). Ueno held USD 2.8-2.84 billion in deposits, 71% private and the rest public entities, mainly the IPS pension institute. The Deposit Guarantee Fund covers up to 75 minimum wages, about G. 228.3 million (USD 37,000-38,300) per depositor, and expects to pay about USD 740 million, only 27% of total deposits. The remainder depends on asset sales and liquidation, with pension funds given priority. The BCP insists the case is idiosyncratic and not systemic.", "image_url": "https://static.emol.cl/emol50/Fotos/2026/11/11/file_20261111112032.jpg", "is_gov_source": false, "is_authoritative": true}]}, {"title": "II. Political & Policy Developments", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "Alliana takes office after the Senate removes Peña over the Ueno Bank collapse (2026-11-06)", "date": "2026-11-06", "source_url": "https://www.lanacion.com.py/politica/2026/11/05/diputados-aprueban-por-unanimidad-libelo-acusatorio-para-juicio-politico-de-santiago-pena/", "source_name": "La Nación", "summary": "Vice-President Pedro Alliana became president on 6 November after the Senate convicted Santiago Peña in an impeachment trial with 44 votes, one day after the Chamber of Deputies approved the charges 78-0. Peña had announced his resignation on 5 November, but a joint congressional session lost quorum when Colorado legislators walked out, and the opposition pressed ahead to strip him of lifetime Senate privileges. The charges centred on conflicts of interest from his former shareholding in the Ueno holding group, regulatory manipulation and the loss of pension funds. The courts ordered Peña held under house arrest and detained eight Ueno executives, including former bank president Juan Manuel Gustale and Federico Miguel Vázquez Villasanti. Alliana, a Colorado leader, will serve until August 2028.", "image_url": "https://www.lanacion.com.py/resizer/v2/6Z5RYESSPVG5FGOZ22MFK2OKKM.jpeg?auth=43d0019c8422950a811a7fab60422e419848d25d5cc82bf95a302ea725d6b152&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Alliana asks every minister to resign and reshuffles the cabinet and military command (2026-11-09)", "date": "2026-11-09", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/politica_edicion_impresa/2026/11/10/alliana-mueve-mas-piezas-dentro-del-gabinete-y-designa-a-nuevos-titulares/", "source_name": "La Nación", "summary": "On his first working Monday Alliana instructed new chief of staff Rolando de Barros Barreto to ask all ministers, executive secretaries and heads of public entities to place their posts at his disposal, warning that 'no job is guaranteed.' He named Ariel Martínez at the Interior Ministry, Juan Carlos Baruja at Public Works (MOPC), Juan Pablo Cosp as interim head of MITIC after removing Gustavo Villate, Víctor González Bedoya at environment agency MADES and Eduardo González Báez as presidential legal adviser. He ratified Óscar Lovera at the Treasury, Marco Riquelme at Industry, Rubén Ramírez Lezcano at Foreign Affairs and Isaías Fretes at Health. General Manuel Rodríguez Sosa was named commander of the armed forces, with new interim chiefs for the army, air force and military cabinet. More changes are expected.", "image_url": "https://www.lanacion.com.py/resizer/v2/BTMONGW6UJCLRIDXS2CMLUQNBA.jpg?auth=f5b3f8e64d7aaad211042acf1f22ade1c2229b157c7b84a0484a62c30dfc1a78&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Alliana sends Congress a bill to place Ueno-linked companies under temporary state administration (2026-11-12)", "date": "2026-11-12", "source_url": "http://spanish.xinhuanet.com/20261113/12cd01b6078240528c9d5d4df89903db/c.html", "source_name": "Xinhua / Última Hora", "summary": "The executive sent Congress a bill to keep companies linked to the collapsed Ueno Bank operating and protect jobs. It would appoint a temporary administrator for eight months, remove incumbent directors and managers, and create a supervisory council with the Treasury, Industry and Labour ministries. The state would not assume the companies' debts and the measure would exclude firms under criminal investigation or in the hands of the asset-seizure agency Senabico; asset transfers, dividends and payments to shareholders would be restricted. Officials say the aim is to preserve more than 5,000 jobs. The industrial union UIP warned there is 'no margin for error' and urged spending discipline rather than tax increases, while the MIC, Treasury and bankers' association Asoban set up a working group on working-capital finance for November and December.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/0f25a61/2147483647/strip/true/crop/2560x1440+0+187/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fec%2F15%2F7420a2d547abaec9791559277a7f%2Frolando-de-barros-y-gabinete-presidencia.jpg", "is_gov_source": true, "is_authoritative": true}]}, {"title": "III. Social & Security Landscape", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "Teachers launch an indefinite national strike over Ueno-hit pension funds (2026-11-09)", "date": "2026-11-09", "source_url": "https://www.lanacion.com.py/pais/2026/11/09/arranca-movilizacion-nacional-de-docentes/", "source_name": "La Nación", "summary": "Public-school teachers began an indefinite national strike on 9 November, called by the FEP, UNE-SN, OTEP-Auténtica, OTEP-SN and the school directors' union SINADI, with the main rally at the Plaza de Armas facing Congress. They demand the return of about USD 60 million of Caja Fiscal money and USD 350 million of IPS pension funds caught in Ueno Bank, state guarantees for pensions, a law shielding the two funds, an 8% salary rise and more education spending in the 2027 budget. Classes were suspended nationwide and the Hambre Cero school-meals programme was paused in Asunción, Central, Presidente Hayes and San Pedro. The government opened talks the same day and later agreed to lift the salary floor from 5% to 8%, clear pending retirements and extend the school day by 30 minutes in exchange for no pay deductions.", "image_url": "https://www.lanacion.com.py/resizer/v2/EHS6R2X5OZD5VGXX754ROA6CKA.jpg?auth=3454ff7fee28dd75a8460283d92c082fd615dfb49875551c6d0eb3becc200250&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay asks Argentina, Luxembourg and the US to trace Ueno Bank assets (2026-11-10)", "date": "2026-11-10", "source_url": "https://www.elnacional.com/2026/11/que-paso-con-el-dinero-de-ueno-bank-en-paraguay-y-cuanto-falta-recuperar/", "source_name": "El Nacional (Venezuela)", "summary": "The Paraguayan government confirmed it asked Argentina, Luxembourg and the United States for judicial cooperation to trace possible Ueno Bank funds and assets abroad. Prosecutors have detained eight executives, including former bank president Juan Manuel Gustale and controlling shareholder Federico Miguel Vázquez Villasanti, and imposed preventive embargoes of USD 70 million and G. 1.62 trillion. The IPS says USD 328-380 million of pension money was exposed, putting benefits for about 32,000 retirees at risk, and has filed a criminal complaint. Public-sector deposits in the bank are estimated at USD 850-869 million, about 29% of deposits at June. The case has become a test of Paraguay's ability to recover assets across borders.", "image_url": "https://elnacional-uploads.nyc3.digitaloceanspaces.com/wp-content/uploads/2026/11/10155024/AFP__20261110__D73J6TP__v1__HighRes__ParaguayPoliticsBankingCrisis-2560x1691.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Police bring forward the year-end 'Año Paha' operation with 5,900 officers in the capital region (2026-11-11)", "date": "2026-11-11", "source_url": "https://www.adndigital.com.py/policia-adelanta-operativo-de-fin-de-ano-con-controles-patrullas-y-agentes-tacticos/", "source_name": "ADN Digital", "summary": "After a run of armed robberies and an attempted ATM break-in in San Lorenzo, the National Police brought forward its year-end 'Año Paha' security operation. It deploys about 2,347 officers in Asunción and 3,550 in Central department, plus tactical units with long weapons, the Lima 40 group, motorcycles, patrols and investigators. Banks, shopping areas, ATMs and residential neighbourhoods are prioritised, with coverage extended to Alto Paraná (especially Ciudad del Este), Amambay, Canindeyú, Curuguaty and Saltos del Guairá. The police offer free escorts for cash transfers, including the December bonus, and 5,000 new officers are due to graduate on 18 December. Officials link the early deployment to the heightened risk during the banking crisis.", "image_url": "https://www.lanacion.com.py/resizer/v2/DV25FKSXGFGKHENVGSBJ73NTBI.jpg?auth=95e075c81134f6b697150b6bed45786a7c9921fd8295016870659f1449a2f9e0&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}, {"title": "Shootout in Ciudad del Este leaves one suspect dead and another wounded (2026-11-11)", "date": "2026-11-11", "source_url": "https://www.lanacion.com.py/pais/2026/11/11/policia-frustro-asalto-persiguio-a-los-sospechosos-abatio-a-uno-e-hirio-a-otro-en-cde/", "source_name": "La Nación", "summary": "An off-duty police officer foiled a motorcycle robbery in Ciudad del Este on 11 November, pursued the suspects and exchanged gunfire, killing one attacker and wounding another. Both suspects had criminal records. The incident came amid reports of an insecurity wave in Alto Paraná, with vehicle thefts and robberies in Ciudad del Este, Minga Guazú, Presidente Franco and Hernandarias, and follows the early launch of the Año Paha operation. Business groups in the triple-border area have long complained about the cost of private security and the impact of crime on retail and logistics; the new Interior Minister, Ariel Martínez, has promised a harder line and tighter coordination with the Public Ministry.", "image_url": "https://www.lanacion.com.py/resizer/v2/S7MW36RBGFBQ5GMEYZ6NDCNFLY.png?auth=b4716a0afc9ed4d96d49b9c1d692c1fcd23e6a8a8b50dbb5ecd6c0ae46b8b6a8&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}]}, {"title": "IV. International Relations & Diplomacy", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "Alliana keeps Peña's foreign policy and says US, Israel and Taiwan ties remain intact (2026-11-08)", "date": "2026-11-08", "source_url": "https://www.lanacion.com.py/politica/2026/11/05/alliana-mantendra-la-politica-exterior-de-pena-y-ratificara-alianzas-con-ee-uu-israel-y-taiwan/", "source_name": "La Nación", "summary": "President Alliana will maintain Santiago Peña's foreign policy and reaffirm alliances with the United States, Israel and Taiwan, according to government officials quoted after the transition. Taiwan, Paraguay's only diplomatic ally in South America, said on 6 November that the change of government would not affect relations, and Asunción signalled that ties with Washington, Jerusalem and Taipei remain intact. The continuity covers the SOFA status-of-forces agreement signed in March 2026, participation in the US-led 'Shield of the Americas' security initiative and cooperation against transnational crime. A planned meeting between Peña and Donald Trump on 14 November was left in doubt; officials said it could be held by videoconference with Alliana. Beijing sanctioned MITIC minister Gustavo Villate in October over his Taiwan support.", "image_url": "https://www.lanacion.com.py/resizer/v2/PT3DOCXHLZBWPBSEGIYENDWF2E.jpeg?auth=9fce9066187c8a7fc8a1c93a2e5e6726dbd6827b4f45278f39b868959ba9eb41&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Alliana suspends his official trip to Taiwan to focus on the domestic crisis (2026-11-09)", "date": "2026-11-09", "source_url": "https://www.ultimahora.com/alliana-suspende-viaje-a-taiwan-el-presidente-gobernara-en-paraguay", "source_name": "Última Hora", "summary": "Chief of staff Rolando de Barros Barreto confirmed that Alliana suspended his official visit to Taiwan, scheduled for 24 November with a meeting with President Lai Ching-te, to prioritise the domestic agenda. 'He is not one to travel much; his priority is here in the country now,' the official said. The decision distances Alliana from Peña, who was criticised for more than 70 trips, and follows a presidential inauguration speech that did not mention Taiwan. Taipei said the relationship is unaffected, but the episode has revived debate over Paraguay's diplomatic recognition. At least 19 Paraguayan legislators have visited China since late 2023, and a pragmatic, Beijing-leaning faction of the Colorado Party is pressing to open trade ties, though no immediate switch is expected.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/3f61671/2147483647/strip/true/crop/1440x810+0+70/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F7d%2F9d%2F170750a441aa8263bba33542d438%2Fgabinete-alliana.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Lula congratulates Alliana and invites him to Brasilia as Itaipú Annex C tops the agenda (2026-11-07)", "date": "2026-11-07", "source_url": "https://www.opovo.com.br/noticias/mundo/2026/11/07/lula-deseja-exito-a-pedro-alliana-como-presidente-do-paraguai.html", "source_name": "O Povo / El Nacional", "summary": "Brazilian President Luiz Inácio Lula da Silva, re-elected in October, congratulated Pedro Alliana and invited him to Brasilia to review the bilateral agenda and give 'renewed impetus' to relations; Alliana said he expects a 'very fruitful' relationship. The central issue is the revision of Annex C of the Itaipú Treaty: the dam's debt was paid off in February 2023 and the review was due by December 2024, but no agreement was reached. The current tariff of USD 19.28 per kW runs to the end of 2026; Paraguay resists a sharp cut because it wants the revenue for infrastructure and social programmes, while Brazil opposes an increase for regulated consumers. The new ANDE head, Félix Sosa, called the review a 'fundamental strategic priority' and Alliana plans to travel to Brasilia before the end of 2026.", "image_url": "https://elnacional-uploads.nyc3.digitaloceanspaces.com/wp-content/uploads/2026/09/13203208/Lula-Brasil.jpg", "is_gov_source": false, "is_authoritative": true}]}, {"title": "V. Industry Focus: Telecom, Digital Energy & AI", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "Contraloría recommends revoking Nubicom's 5G licence as Conatel opens a sumario (2026-11-09)", "date": "2026-11-09", "source_url": "https://www.latribuna.com.py/nacionales/locales/2026/11/09/nubicom-contraloria-pide-evaluar-el-retiro-de-la-licencia-5g/", "source_name": "La Tribuna", "summary": "The Comptroller General recommended that Conatel evaluate extinguishing Nubicom Paraguay's 5G licence, awarded by Resolution 2635/2025, after finding it could not prove the first-year rollout plan. Conatel had already opened an administrative sumario (Resolution 2816/2026) after Argentine shareholder Nubicom SRL notified an unauthorised transfer of shares on 5-6 November and failed to identify the buyer, leaving the regulator unsure who controls the licensee. Press reports link Nubicom to the Grupo Vázquez and Ueno Bank; Conatel transferred G. 70 billion to Ueno in October (G. 50 billion from Interfisa on 13 October and G. 20 billion from BNF on 15 October) and Ueno issued a USD 75,000 bid bond for the licence. Conatel says Nubicom met the initial build with 34 radio bases inspected, but has only two subscribers.", "image_url": "https://www.latribuna.com.py/resizer/v2/BZEXKVYBWNEMJI5A5VN5U55DAY.png?smart=true&auth=0d270967f9d33afec97ed75258b93534de14ec3f59af85d144c4b31e8dbae6b6&width=1200&height=630", "is_gov_source": true, "is_authoritative": true}, {"title": "ANDE will let crypto-mining contracts expire in 2027 and redirect Itaipú surplus to AI data centres (2026-11-13)", "date": "2026-11-13", "source_url": "https://www.diariobitcoin.com/mineria/paraguay-pondra-fecha-de-vencimiento-a-los-contratos-electricos-especiales-para-mineros-de-bitcoin/", "source_name": "Diario Bitcoin", "summary": "ANDE says all special electricity contracts for crypto miners will expire on 31 December 2027 and will not be extended. Miners contracted about 944 MW until April, close to 13% of Paraguay's Itaipú share, and generated about USD 350 million of revenue in 2026. The surplus is being redirected to AI data centres: Kuntur, linked to Araico and the USD 12 billion Iguazú AI City project, won a 15-year contract for up to 286 MW, starting with 6 MW on 1 December 2026 and scaling to 286 MW by 2029, at a reported tariff of USD 48.91-56.39 per MWh. Crusoe Energy and Araico plan an initial 106 MW with an option to expand to about 280 MW, with first facilities in mid-2027. HIVE, which has about 77% of its mining capacity in Paraguay, also loses its 200 MW and 100 MW contracts at end-2027. National demand rose 17.9% in the first eight months of 2026.", "image_url": "https://diariobitcoin.b-cdn.net/wp-content/uploads/2026/11/canuto-imagine-1794618182.jpg", "is_gov_source": false, "is_authoritative": true}, {"title": "Paraguay Business Week opens in Ciudad del Este with 260 stands and USD 600m target (2026-11-12)", "date": "2026-11-12", "source_url": "https://cdn-www.lanacionpy.arcpublishing.com/negocios_edicion_impresa/2026/11/12/se-inicio-la-mayor-feria-integrada-en-el-este/", "source_name": "La Nación", "summary": "The largest integrated trade fair in Paraguay opened in Ciudad del Este, combining the 17th Paraguay-Brazil Expo, the 10th Expo Maquila, the Alto Paraná Forum Invest and Plaza MiPYMEs. It has 260 stands, more than 300 exhibitors and about 2,000 business meetings, with organisers expecting more than USD 600 million in deals and 12,000 visitors. The Paraguay-Brazil chamber of commerce organised the event with support from the Industry Ministry through Rediex. Bilateral trade reached USD 6,700 million between January and October, up 8% year-on-year, but about 320 Brazilian companies with Paraguayan plants, 90 of them in textiles, are watching credit and payment conditions cautiously after the Ueno crisis.", "image_url": "https://www.lanacion.com.py/resizer/v2/A52M3DWJANHNHJDPFCC55WXSZ4.jpg?auth=8cb75542f1a3e8cbb4f4aee40b6ce886b388d237fa6de52cd49af48c2baabe31&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Alliana suspends power cuts until 31 December and freezes electricity tariffs for a year (2026-11-13)", "date": "2026-11-13", "source_url": "http://spanish.xinhuanet.com/20261113/a019de9fa8df41e5a248f4c3233ff149/c.html", "source_name": "Xinhua", "summary": "President Alliana suspended electricity cut-offs for non-payment until 31 December for low- and medium-voltage users and allowed debts to be paid in up to 24 interest-free instalments without penalties. He also said the electricity tariff will not rise for at least a year. The measures are aimed at households and small firms hit by the Ueno Bank crisis and the sudden depreciation of the guaraní, and they add to fiscal pressure on ANDE at a time when demand is growing 17.9% and the government is negotiating the Itaipú Annex C tariff with Brazil. Analysts warn that freezing tariffs while costs rise shifts the burden to the utility's balance sheet and may delay needed grid investment.", "image_url": "https://www.lanacion.com.py/resizer/v2/PB4PJQNBYJAGVJERJFYDCMNYZA.jpg?auth=e69ba96ffe8273aab9f3ed0fe61c0ac82ee439ee8457e6e3fdd076611dae7ffe&width=1200&height=630&smart=true", "is_gov_source": true, "is_authoritative": true}]}, {"title": "VI. Key Client Developments", "tier": 1, "impact_analysis": "", "user_notes": "", "events": [{"title": "Millicom (Tigo) reports USD 175m Paraguay service revenue and a 54.8% EBITDA margin in Q3 (2026-11-05)", "date": "2026-11-05", "source_url": "https://stockanalysis.com/filings/TIGO/3938358/", "source_name": "Millicom / SEC filing", "summary": "Millicom's third-quarter results, published on 5 November, show Paraguay service revenue of USD 175 million, up 3.6% organically year-on-year on postpaid growth, and adjusted EBITDA of USD 101 million, up 11% organically, for a 54.8% margin, one of the highest in the group. At group level service revenue was about USD 2.1 billion (+5.4% organic), adjusted EBITDA a record USD 1.09 billion (+7.7%) at a 48% margin, and equity free cash flow USD 316 million, keeping the full-year guidance near USD 1.1 billion. Leverage fell to 2.53x. Paraguay is grouped with Guatemala, Panama and Ecuador as moderate-growth, high-margin markets. Tigo holds 100 MHz of 2.3 GHz spectrum and must launch commercial 5G by February 2027.", "image_url": "https://www.telesemana.com/wp-content/uploads/2025/04/FWA.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo"}, {"title": "Telecom Argentina: Personal's Paraguay revenue rises 8.3% in real terms in Q3 (2026-11-12)", "date": "2026-11-12", "source_url": "http://archive.fast-edgar.com/20261112/ACBZ822D8M22B2ZU222R2MZZGNLLZ2V2ZV82/", "source_name": "Telecom Argentina / SEC filing", "summary": "Telecom Argentina, which operates in Paraguay through Núcleo S.A. under the Personal brand, reported third-quarter mobile service revenue in Paraguay of P. 66,324 million, up 8.3% in real terms year-on-year, and P. 191,752 million for the first nine months, up 16.7% in real terms. The group posted a net loss of P. 56,615 million in the quarter but a net profit of P. 862,959 million for the nine months. TV subscribers across Argentina, Uruguay and Paraguay reached 3.6 million, up 4.3%. Núcleo won 5G lots I and J in the 3.7-3.8 GHz band for USD 1 million in July, of which USD 0.7 million has been paid, and must start commercial 5G by February 2027. Personal also plans to launch 5G standalone commercially.", "image_url": "https://dplnews.com/wp-content/uploads/2026/06/Gemini_Generated_Image_2s4av12s4av12s4a-1024x572.png", "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal"}, {"title": "Claro remains the only live 5G network as Tigo and Personal race the February 2027 deadline (2026-11-12)", "date": "2026-11-12", "source_url": "https://www.rdn.com.py/2026/10/02/cuando-llegara-la-conectividad-5g-a-todo-el-pais/", "source_name": "RDN / Conatel", "summary": "Claro, which won 200 MHz in the 3.5 GHz band in the first auction and launched commercially in late 2025, remains the only operator with live 5G in Paraguay, covering 27 cities in 10 departments and more than 3 million people with a USD 35 million five-year plan and more than 100 sites expected by the end of 2026. Tigo and Personal, which won 100 MHz each in the August 2026 second auction, have 180 days from notification to start commercial service, a deadline that falls in February 2027, and must deploy at least 100 radio bases each in four years, 10 of them for state entities within two years. Their projects foresee 250-500 sites and about USD 79-80 million of investment. Neither had launched commercially as of mid-November.", "image_url": "https://www.rdn.com.py/i/jpeg/1200/2026/10/5gplazospy.jpg?v=jpeg92", "is_gov_source": false, "is_authoritative": true, "client_tag": "Claro / Tigo / Personal"}]}, {"title": "VII. Integrated Impact Analysis for Business", "tier": 2, "events": [], "impact_analysis": "🔴 Paraguay has moved from a macro story to a solvency-and-governance story. The resolution of Ueno Bank froze about USD 2.8 billion of deposits, including USD 328-380 million of IPS pension money and about USD 60 million of Caja Fiscal funds, and triggered the removal of President Peña, a new government, a new BCP board and the first FX intervention of 2026. The guaraní swung from G. 5,945 on 30 October to G. 6,600 intraday before settling at G. 6,215.89 on the 13 November planilla, a depreciation of roughly 4.5% in two weeks that reverses part of the 11% year-to-date appreciation. The macro fundamentals remain strong: record exports of USD 17.8 billion through October, a USD 668.6 million trade surplus, 1.7% inflation and a 5.0% growth forecast. But confidence is now the binding constraint. For business: (1) FX volatility is the first-order risk, with a realistic range of G. 6,000-6,600 through year-end; (2) bank counterparty risk is elevated, and the deposit guarantee covers only about 27% of Ueno's deposits; (3) the state's temporary administration of Ueno-linked firms may disrupt suppliers, tenants and service contracts; (4) fiscal pressure, with a 2.0%-of-GDP deficit to September and a 3.2% forecast, limits room for tax relief; (5) the February 2027 5G deadline and ANDE's pivot to AI data centres create capex opportunities but also regulatory uncertainty; (6) the new government is reviewing contracts and reshuffling ministries, so public tenders will slip.", "user_notes": ""}, {"title": "VIII. Targeted Recommendations for Chinese Enterprises", "tier": 2, "events": [], "impact_analysis": "🟡 Chinese enterprises should treat the next quarter as a liquidity and contract-risk exercise. (1) Treasury: move idle guaraní balances to top-tier banks or into USD, and map exposure to Ueno-linked Grupo Vázquez companies and to counterparties dependent on IPS or Caja Fiscal payments. (2) Contracts: index prices to the BCP planilla, add FX-adjustment and banking-holiday clauses, and shorten receivables where possible. (3) Supply chain: about 320 Brazilian firms with Paraguayan plants, 90 in textiles, face tighter credit; expect slower payments and more requests for supplier financing. (4) Energy-intensive projects: secure long-term PPAs before the 2027-28 supply crunch; ANDE's 286 MW Kuntur contract and the end-2027 crypto deadline show priority access is going to AI data centres, while tariffs are frozen for a year. (5) Telecom: Claro is live in 27 cities while Tigo and Personal must launch by February 2027; equipment, integration and data-centre opportunities exist, but the technical rules still exclude Chinese 5G vendors, so focus on non-RAN layers and enterprise solutions. (6) Public sector: expect delays and re-tendering at MOPC, MITIC and ANDE as the new government reviews contracts. (7) Political risk: Alliana governs with a fragmented Colorado Party and a mobilised street; continuity on Taiwan and the US is likely, but a Beijing opening cannot be excluded, so avoid making Taiwan-related commitments a condition of commercial deals.", "user_notes": ""}]}};

function renderMacroCardRIN(){var d=MACRO_RIN,v=d.line[d.line.length-1];var unit=L(d.lu[0],d.lu[1]);var lastH='<div class="macro-latest"><span class="macro-latest-label">'+L('最新','Latest')+'</span><span class="macro-latest-val">'+Math.round(v).toLocaleString()+'</span><span class="macro-latest-unit">'+unit+'</span><span class="macro-latest-date">(2026.11.06)</span></div>';return'<div class="macro-card" onclick="expandMacroCard(\'RIN\')" title="'+L('点击放大','Click to enlarge')+'"><span class="macro-source">BCP</span><div class="macro-card-title">'+esc(L(d.t[0],d.t[1]))+'</div>'+renderMacroSVG(d,{line:true,lineMax:12500,lineMin:9000,step:6})+lastH+renderMacroLegend(d)+'</div>';}
function renderMacroLegend(d){return'<div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:2px;font-size:8px;color:#64748B"><span style="display:inline-block;width:12px;height:2px;background:'+d.lc+';vertical-align:middle;border-radius:1px"></span> '+L(d.yl[0],d.yl[1])+'</div>';}
function renderMacroLegend2(d){return'<div style="display:flex;justify-content:center;gap:14px;margin-top:2px;font-size:8px;color:#64748B"><span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:'+d.lc+';vertical-align:middle;margin-right:3px"></span>'+L(d.yl[0],d.yl[1])+'</span><span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:'+d.lc2+';vertical-align:middle;margin-right:3px"></span>'+L(d.yl2[0],d.yl2[1])+'</span></div>';}
function expandMacroCard(type){
  var fnMap={GDP:renderMacroCardGDP,CPI:renderMacroCardCPI,FX:renderMacroCardFX,RIN:renderMacroCardRIN};
  var fn=fnMap[type];if(!fn)return;
  var inner=fn().replace(' class="macro-card"',' class="macro-card" style="cursor:default"');
  var dataSection='';
  if(type!=='GDP'){
    if(type==='FX')dataSection=renderFXDailyTable(MACRO_FX,MACRO_FX.lu);
    else{var dMap={CPI:MACRO_CPI,RIN:MACRO_RIN};var unitMap={CPI:MACRO_CPI.lu,RIN:L(MACRO_RIN.lu[0],MACRO_RIN.lu[1])};dataSection=renderMacroDataTable(dMap[type],unitMap[type]);}
  }
  var h='<div class="macro-modal-overlay" id="macroModal" onclick="closeMacroModal(event)"><div class="macro-modal-card" onclick="event.stopPropagation()"><button class="macro-modal-close" onclick="closeMacroModal()">&times;</button>'+inner+dataSection+'</div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
  document.addEventListener('keydown',onMacroModalKey);
}
function renderMacroDataTable(d,unit){
  var MONTHS_L=[['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']];
  var h='<div class="macro-data-section"><button class="macro-data-toggle" onclick="toggleDataTable(this)">'+L('查看月度源数据 ▼','View Monthly Data ▼')+'</button>';
  h+='<div class="macro-data-table-wrap" style="display:none"><table class="macro-data-table"><thead><tr><th>'+L('月份','Month')+'</th><th>2023</th><th>2024</th><th>2025</th><th>2026*</th></tr></thead><tbody>';
  for(var m=0;m<12;m++){
    h+='<tr><td>'+L(MONTHS_L[0][m],MONTHS_L[1][m])+'</td>';
    var src=d.monthly||d.line;for(var y=0;y<4;y++){var idx=y*12+m,v=src[idx];if(v!=null)h+='<td>'+(v>=100?Math.round(v):v.toFixed(1))+(unit||'')+'</td>';else h+='<td class="macro-na">—</td>';}
    h+='</tr>';
  }
  h+='</tbody></table><div style="font-size:9px;color:#94A3B8;margin-top:4px">* 2026 '+L('为1–5月数据','Jan–May YTD')+'</div></div></div>';
  return h;
}
function renderFXDailyTable(d,unit){
  var DM=[31,28,31,30,31,30,31,31,30,31,30,31],dl=d.line||[];
  var h='<div class="macro-data-section"><button class="macro-data-toggle" onclick="toggleDataTable(this)">'+L('查看每日源数据 ▼','View Daily Data ▼')+'</button>';
  h+='<div class="macro-data-table-wrap" style="display:none"><table class="macro-data-table"><thead><tr><th>'+L('日期','Date')+'</th><th>PYG/USD</th></tr></thead><tbody>';
  var dates=[],day=1,mo=0,yr=2023;
  for(var i=0;i<dl.length;i++){
    dates.push(yr+'-'+(mo<9?'0'+(mo+1):(mo+1))+'-'+(day<10?'0'+day:day));
    day++;var dim=DM[mo];if(mo===1&&yr%4===0)dim=29;
    if(day>dim){day=1;mo++;if(mo>11){mo=0;yr++;}}
  }
  for(var i=dl.length-1;i>=0;i--){
    h+='<tr><td>'+dates[i]+'</td><td>'+Math.round(dl[i])+(unit||'')+'</td></tr>';
  }
  h+='</tbody></table></div></div>';
  return h;
}
function toggleDataTable(btn){
  var wrap=btn.nextElementSibling;
  if(wrap.style.display==='none'){wrap.style.display='block';btn.innerHTML=btn.innerHTML.replace('查看','隐藏').replace('View','Hide').replace(' ▼',' ▲');}
  else{wrap.style.display='none';btn.innerHTML=btn.innerHTML.replace('隐藏','查看').replace('Hide','View').replace(' ▲',' ▼');}
}
function closeMacroModal(e){
  if(e&&e.type==='keydown'){if(e.key!=='Escape')return;}
  else if(e&&e.target&&!e.target.closest('#macroModal'))return;
  var m=document.getElementById('macroModal');if(m){m.remove();document.removeEventListener('keydown',onMacroModalKey);}
}
function onMacroModalKey(e){if(e.key==='Escape')closeMacroModal(e);}
function renderMacroDashboard(){return'<div class="macro-dashboard"><div class="macro-title">'+L('巴拉圭宏观数据看板','Paraguay Macro Dashboard')+'<span class="macro-period">2023–2026</span></div><div class="macro-note">'+L('数据来源：BCP，月度数据为趋势估算值','Sources: BCP; monthly figures are trend estimates')+'</div><div class="macro-grid">'+renderMacroCardGDP()+renderMacroCardCPI()+renderMacroCardFX()+renderMacroCardRIN()+'</div></div>';}
function renderAll(){
  if(!briefingData)return;
  var d=briefingData;
  document.getElementById('headerSubtitle').textContent=(d.topic||'')+' · '+(d.time_span||'');

  var sections=d.sections||[],tier1=[],tier2=[];
  for(var i=0;i<sections.length;i++){
    if(sections[i].tier===2)tier2.push(sections[i]);else tier1.push(sections[i]);
  }
  var total=0;
  for(var i=0;i<tier1.length;i++)total+=(tier1[i].events||[]).length;

  var pills='<div class="stats-row-total"><div class="stat-pill pill-total" onclick="scrollToSec(null)"><span class="pill-label">'+L('全部事件','All Events')+'</span><span class="pill-count">'+total+'</span></div></div>';
  for(var row=0;row<2;row++){
    pills+='<div class="stats-row-sections">';
    for(var col=0;col<3;col++){
      var idx=row*3+col;if(idx>=tier1.length)break;
      var sec=tier1[idx],c=PCOL[idx],cnt=(sec.events||[]).length;
      pills+='<div class="stat-pill" style="background:'+c.bg+';color:'+c.text+';" onclick="scrollToSec('+idx+')"><span class="pill-dot" style="background:'+c.dot+'"></span><span class="pill-label">'+stripNum(sec.title)+'</span><span class="pill-count">'+cnt+'</span></div>';
    }
    pills+='</div>';
  }
  document.getElementById('statsRow').innerHTML=pills;

  var html=renderMacroDashboard();
  for(var i=0;i<tier1.length;i++)html+=renderSection(tier1[i],i);
  if(tier2.length>0&&tier1.length>0){
    html+='<div class="tier-divider"><span>'+L('形势分析与行动建议','Analysis & Recommendations')+'</span></div>';
  }
  for(var j=0;j<tier2.length;j++)html+=renderSection(tier2[j],tier1.length+j);
  document.getElementById('contentArea').innerHTML=html;
}

function renderSection(sec,idx){
  var events=sec.events||[],isT2=sec.tier===2;
  var g=GRAD[idx%8],icon=ICONS[idx%8];
  var body='';
  if(isT2||events.length===0){
    if(sec.impact_analysis)body='<div class="analysis-body">'+fmt(sec.impact_analysis)+'</div>';
    else if(!isT2)body='<div style="padding:4px 22px 16px;color:#94A3B8;font-size:13px;">'+L('暂无此时间段内的事件','No events in this period')+'</div>';
  }else{
    var cards='';
    for(var i=0;i<events.length;i++)cards+=renderCard(events[i],g[0],g[1],icon);
    body='<div class="events-grid">'+cards+'</div>';
  }
  var badge=events.length>0?'<span class="badge">'+events.length+L(' 条事件',' events')+'</span>':'';
  return '<div class="section s'+(idx%8)+(isT2?' tier2':'')+'" id="sec-'+idx+'"><div class="section-header"><h2>'+esc(sec.title||'')+'</h2>'+badge+'</div>'+(sec.description?'<div class="section-desc">'+esc(sec.description)+'</div>':'')+body+'</div>';
}

function renderCard(evt,phFrom,phTo,icon){
  var img=evt.image_url,hasImg=img&&img.indexOf('http')===0;
  var ih='';
  if(hasImg)ih='<img src="'+esc(img)+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">';
  ih+='<div class="img-placeholder" style="background:linear-gradient(135deg,'+phFrom+','+phTo+');'+(hasImg?'display:none':'display:flex')+';font-size:32px;color:#fff;">'+icon+'</div>';

  var tags='';
  if(evt.date)tags+='<span class="event-tag date">'+esc(evt.date)+'</span>';
  if(evt.client_tag)tags+='<span class="event-tag client">'+esc(evt.client_tag)+'</span>';
  if(evt.is_gov_source)tags+='<span class="event-tag gov">'+L('政府官网','Government')+'</span>';
  else if(evt.is_authoritative)tags+='<span class="event-tag auth">'+L('权威媒体','Authoritative')+'</span>';
  if(evt.source_name)tags+='<span class="event-tag source">'+esc(evt.source_name)+'</span>';

  var link=evt.source_url?'<a class="event-link" href="'+esc(evt.source_url)+'" target="_blank" rel="noopener">'+L('查看原文 →','Read more →')+'</a>':'';
  var preview=evt.summary||'';if(!preview&&evt.title)preview=evt.title;
  return '<div class="event-card"><div class="event-img">'+ih+'</div><div class="event-body"><div class="event-meta">'+tags+'</div><div class="event-preview">'+esc(preview)+'</div>'+link+'</div></div>';
}

function fmt(text){
  var h=esc(text);
  h=h.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
  h=h.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
  h=h.replace(/\n/g,'<br>');
  return h;
}

function scrollToSec(idx){
  var pills=document.querySelectorAll('.stat-pill');
  for(var i=0;i<pills.length;i++)pills[i].style.outline='';
  if(idx===null||idx===undefined){window.scrollTo({top:0,behavior:'smooth'});return;}
  var el=document.getElementById('sec-'+idx);
  if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.style.boxShadow='0 0 0 3px #3B82F6';
  setTimeout(function(){el.style.boxShadow='';},1500);
}

function showHistory(){
  fetch('/api/briefings').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(list){
    if(!list||!list.length){alert(L('没有找到历史简报','No saved briefings found.'));return;}
    var h='<div class="update-modal-overlay" id="histModal" onclick="closeUpdateModal(\'histModal\')"><div class="update-modal" onclick="event.stopPropagation()"><h3>'+L('历史简报','Saved Briefings')+'</h3><div class="history-list">';
    for(var i=0;i<list.length;i++){var b=list[i];h+='<div class="history-item" onclick="loadBriefing(\''+esc(b.filename)+'\')"><div><div class="hi-title">'+esc(b.topic||b.filename)+'</div><div class="hi-meta">'+esc(b.time_span||'')+'</div></div><span class="hi-count">'+(b.event_count||0)+L(' 条',' evts')+'</span></div>';}
    h+='</div><div class="btn-row" style="margin-top:12px"><button class="btn-secondary" onclick="closeUpdateModal(\'histModal\')">'+L('关闭','Close')+'</button></div></div></div>';
    document.body.insertAdjacentHTML('beforeend',h);
  }).catch(function(){
    alert(L('此功能需要启动 Flask 服务器。\n请在终端运行: python3 web_app.py\n然后访问 http://127.0.0.1:5000','This feature requires the Flask server.\nRun: python3 web_app.py\nThen visit http://127.0.0.1:5000'));
  });
}
function loadBriefing(filename){
  fetch('/api/briefing/'+encodeURIComponent(filename)).then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    DATA['zh']=data;DATA['en']=data;briefingData=data;renderAll();closeUpdateModal('histModal');
  }).catch(function(){alert(L('加载失败','Failed to load briefing.'));});
}
function refreshBriefing(){
  var btn=document.getElementById('btnUpdate');
  btn.disabled=true;btn.textContent='...';
  fetch('/api/briefing/briefing_en.json').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    DATA['en']=data;briefingData=data;renderAll();
    fetch('/api/briefing/briefing.json').then(function(r){if(r.ok)return r.json();}).then(function(zh){if(zh)DATA['zh']=zh;}).catch(function(){});
  }).catch(function(){alert(L('刷新失败','Refresh failed'));}).finally(function(){
    btn.disabled=false;btn.textContent=L('刷新简报','Refresh');
  });
}
function openMacroModal(){
  var h='<div class="update-modal-overlay" id="macroModal" onclick="closeUpdateModal(\'macroModal\')"><div class="update-modal" onclick="event.stopPropagation()"><h3>'+L('更新宏观数据','Update Macro Data')+'</h3>';
  h+='<p style="font-size:11px;color:#94A3B8;margin-bottom:12px">'+L('下载最新 BCP Excel 后填入文件名','Fill in latest BCP Excel filenames')+'</p>';
  h+='<input type="text" id="cpiFileName" placeholder="'+L('CPI文件，如 AE_IPC-26.6.xlsx','CPI file, e.g. AE_IPC-26.6.xlsx')+'" style="width:100%;font-size:12px;padding:8px 10px;border:1px solid #CBD5E1;border-radius:6px;margin-bottom:8px">';
  h+='<input type="text" id="rinFileName" placeholder="'+L('RIN文件，如 reservas...xlsx','RIN file, e.g. reservas...xlsx')+'" style="width:100%;font-size:12px;padding:8px 10px;border:1px solid #CBD5E1;border-radius:6px;margin-bottom:12px">';
  h+='<div class="btn-row"><button class="btn-secondary" onclick="closeUpdateModal(\'macroModal\')">'+L('取消','Cancel')+'</button><button class="btn-primary" onclick="refreshMacroData()">'+L('更新','Update')+'</button></div>';
  h+='<div id="genStatus" style="margin-top:10px;font-size:12px;color:#64748B;display:none"></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
}
function refreshMacroData(){
  var cpiFile=document.getElementById('cpiFileName').value.trim();
  var rinFile=document.getElementById('rinFileName').value.trim();
  if(!cpiFile&&!rinFile){alert(L('请至少输入一个文件名','Please enter at least one filename.'));return;}
  var st=document.getElementById('genStatus');
  st.style.display='block';st.innerHTML='<span class="loading-spinner"></span>'+L('正在读取宏观数据文件…','Reading macro data files…');
  fetch('/api/update-macro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cpi_file:cpiFile,rin_file:rinFile})}).then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    var msgs=[];
    if(data.cpi&&data.cpi.length){MACRO_CPI.line=data.cpi;msgs.push(L('CPI已更新('+data.cpi.length+'个月)','CPI updated ('+data.cpi.length+' mo)'));}
    if(data.cpi_error)msgs.push(L('CPI错误: ','CPI error: ')+data.cpi_error);
    if(data.rin&&data.rin.length){MACRO_RIN.line=data.rin;msgs.push(L('RIN已更新('+data.rin.length+'个月)','RIN updated ('+data.rin.length+' mo)'));}
    if(data.rin_error)msgs.push(L('RIN错误: ','RIN error: ')+data.rin_error);
    if(msgs.length){renderAll();st.innerHTML='<span style="color:#10B981">'+msgs.join('; ')+'</span>';}
    else st.innerHTML='<span style="color:#EF4444">'+L('更新失败','Update failed')+'</span>';
  }).catch(function(){st.innerHTML='<span style="color:#EF4444">'+L('更新失败，请确保 Flask 服务器已启动','Failed. Make sure Flask server is running.')+'</span>';});
}
function closeUpdateModal(id){
  var m=document.getElementById(id||'updateModal');if(m)m.remove();
  var h=document.getElementById('histModal');if(h&&id!=='histModal')h.remove();
}
document.addEventListener('DOMContentLoaded',function(){
  if(window.IS_STANDALONE)document.getElementById('standaloneBanner').style.display='block';
  if(MACRO_FX.monthly&&!MACRO_FX.line)MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
  fetch('/api/briefing/briefing_en.json').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    DATA['en']=data;briefingData=data;currentLang='en';renderAll();updateLangBtn();
    fetch('/api/briefing/briefing.json').then(function(r){if(r.ok)return r.json();}).then(function(zh){if(zh)DATA['zh']=zh;}).catch(function(){});
    if(!window.IS_STANDALONE)fetchLiveFX();
  }).catch(function(){
    briefingData=DATA['en'];currentLang='en';renderAll();updateLangBtn();
  });
});
function fetchLiveFX(){
  fetch('/api/macro/fx').then(function(r){if(!r.ok)return;return r.json();}).then(function(d){
    if(!d||!d.rate)return;
    var arr=MACRO_FX.monthly||MACRO_FX.line||[];
    arr[arr.length-1]=d.rate;
    window.MACRO_FX_DATE=(d.date||'').replace(/-/g,'.');
    MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
    renderAll();
  }).catch(function(){});
}
</script>
</body>
