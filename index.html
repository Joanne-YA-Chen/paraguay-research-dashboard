<title>Paraguay Briefing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#F0F4FF;color:#1E293B;line-height:1.6;min-height:100vh}
a{color:#3B82F6;text-decoration:none}a:hover{text-decoration:underline}
.header{background:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;border-bottom:3px solid #3B82F6}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;flex-shrink:0}
.header-left h1{font-size:20px;font-weight:700;color:#1E293B}
.header-left .subtitle{font-size:12px;color:#64748B;margin-top:2px}
.header-right{display:flex;gap:8px;align-items:center}
.btn-lang{background:#EEF2FF;color:#4F46E5;font-weight:700;font-size:12px;padding:8px 14px;border-radius:20px;border:none;cursor:pointer}
.btn-lang:hover{background:#E0E7FF}
.btn-primary{background:#3B82F6;color:#fff;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-primary:hover{background:#2563EB;transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,.3)}
.btn-secondary{background:#F1F5F9;color:#475569;font-weight:600;font-size:12px;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:#E2E8F0}
.btn-sm{font-size:11px;padding:6px 12px}
.update-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:moFade .2s}
.update-modal{background:#fff;border-radius:14px;padding:24px 28px;width:440px;max-width:90vw;box-shadow:0 24px 80px rgba(0,0,0,.25);animation:moZoom .25s}
.update-modal h3{font-size:17px;font-weight:700;color:#1E293B;margin-bottom:16px}
.update-modal label{display:block;font-size:12px;font-weight:600;color:#64748B;margin-bottom:4px}
.update-modal select,.update-modal input{width:100%;padding:8px 12px;border:1px solid #CBD5E1;border-radius:8px;font-size:13px;margin-bottom:14px;color:#1E293B;background:#fff}
.update-modal .btn-row{display:flex;gap:8px;justify-content:flex-end}
.time-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.time-preset{padding:5px 12px;border-radius:14px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #CBD5E1;background:#fff;color:#64748B;transition:all .12s}
.time-preset:hover,.time-preset.active{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.history-list{max-height:300px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid #E2E8F0;border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.history-item:hover{background:#F8FAFC;border-color:#CBD5E1}
.history-item .hi-title{font-weight:600;font-size:13px;color:#1E293B}
.history-item .hi-meta{font-size:11px;color:#94A3B8}
.history-item .hi-count{font-size:11px;font-weight:600;color:#3B82F6;background:#EEF2FF;padding:2px 8px;border-radius:10px}
.loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid #CBD5E1;border-top-color:#3B82F6;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.standalone-banner{background:#FEF3C7;color:#92400E;text-align:center;padding:6px 16px;font-size:12px;border-bottom:1px solid #FDE68A;display:none}
.standalone-banner code{background:#FDE68A;padding:1px 5px;border-radius:3px;font-size:11px}

.stats-row{max-width:1400px;margin:0 auto;padding:12px 32px 16px;display:flex;flex-direction:column;gap:8px}
.stats-row-total{display:flex;justify-content:center}
.stats-row-sections{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:768px){.stats-row-sections{grid-template-columns:repeat(2,1fr)}}
.stat-pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;cursor:pointer;transition:all .2s;border:2px solid transparent;font-size:13px;font-weight:600;user-select:none;min-width:0}
.stat-pill:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.pill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pill-label{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-count{font-size:14px;font-weight:700;margin-left:auto;flex-shrink:0;background:rgba(255,255,255,.5);padding:1px 8px;border-radius:10px}
.stat-pill.pill-total{background:#1E293B;color:#fff;font-weight:700;border-radius:24px;display:inline-flex}
.stat-pill.pill-total .pill-count{background:rgba(255,255,255,.2)}

.content{max-width:1400px;margin:0 auto;padding:0 32px 60px}
.section{background:#fff;border-radius:14px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden;border-top:4px solid #3B82F6}
.section.s0{border-top-color:#3B82F6}.section.s1{border-top-color:#EF4444}.section.s2{border-top-color:#10B981}
.section.s3{border-top-color:#8B5CF6}.section.s4{border-top-color:#06B6D4}.section.s5{border-top-color:#F59E0B}
.section.s6{border-top-color:#6366F1}.section.s7{border-top-color:#EC4899}.section.tier2{background:#FAFBFC}
.section-header{padding:16px 22px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-header h2{font-size:16px;font-weight:700;color:#1E293B}
.section-header .badge{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;background:#F1F5F9;color:#64748B;white-space:nowrap}
.section-desc{padding:4px 22px 10px;font-size:12px;color:#94A3B8}
.events-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 22px 18px}
@media(max-width:860px){.events-grid{grid-template-columns:1fr}.event-card{flex-direction:column}.event-card .event-img{width:100%!important;min-height:120px;max-height:180px}}
.event-card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;transition:all .2s;display:flex}
.event-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-1px);border-color:#CBD5E1}
.event-card .event-img{width:160px;min-height:140px;flex-shrink:0;position:relative;overflow:hidden}
.event-card .event-img img{width:100%;height:100%;object-fit:cover;display:block}
.event-card .event-img .img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.event-card .event-body{padding:12px 15px;flex:1;min-width:0;display:flex;flex-direction:column}
.event-card .event-meta{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.event-card .event-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.event-tag.date{background:#F1F5F9;color:#64748B}.event-tag.gov{background:#DCFCE7;color:#15803D}
.event-tag.auth{background:#DBEAFE;color:#1D4ED8}.event-tag.source{background:#FEF3C7;color:#A16207}
.event-tag.client{background:#FCE7F3;color:#BE185D}
.event-card .event-preview{font-size:13px;color:#334155;line-height:1.6;flex:1;overflow:visible;max-height:none}
.event-card .event-link{font-size:11px;margin-top:6px;color:#3B82F6;font-weight:500}
.analysis-body{padding:4px 22px 20px;font-size:13px;line-height:1.8;color:#334155}
.analysis-body h3{font-size:15px;font-weight:700;margin:14px 0 6px;color:#1E293B}
.analysis-body ul{padding-left:0;list-style:none}
.analysis-body li{padding:2px 0 2px 18px;position:relative}
.analysis-body li::before{content:"•";position:absolute;left:2px;color:#3B82F6;font-weight:bold}
.tier-divider{text-align:center;padding:16px 0 8px;margin:8px 0}
.tier-divider span{background:linear-gradient(135deg,#3B82F6,#6366F1);color:#fff;padding:8px 28px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(59,130,246,.25)}
.footer{text-align:center;padding:20px 32px 40px;color:#94A3B8;font-size:12px;max-width:1400px;margin:0 auto}
.macro-dashboard{background:#fff;border-radius:14px;margin-bottom:18px;padding:16px 22px 14px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-top:4px solid #1E293B}
.macro-title{font-size:15px;font-weight:700;color:#1E293B;margin-bottom:2px}
.macro-period{font-size:11px;font-weight:400;color:#94A3B8;margin-left:6px}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media(max-width:900px){.macro-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.macro-grid{grid-template-columns:1fr}}
.macro-card{background:#F8FAFC;border-radius:8px;padding:10px 8px 4px;border:1px solid #E2E8F0}
.macro-card-title{font-size:10.5px;font-weight:600;color:#475569;margin-bottom:4px;text-align:center;line-height:1.3;min-height:28px;display:flex;align-items:center;justify-content:center}
.macro-card{position:relative}
.macro-source{position:absolute;top:6px;right:8px;font-size:7.5px;color:#94A3B8;font-weight:500;background:#fff;padding:1px 5px;border-radius:3px;border:1px solid #E2E8F0;z-index:1;pointer-events:none}
.macro-latest{display:flex;justify-content:center;align-items:baseline;gap:4px;margin-top:2px;padding:3px 0}
.macro-latest-label{font-size:9px;color:#94A3B8;font-weight:500}
.macro-latest-val{font-size:15px;font-weight:700;color:#1E293B}
.macro-latest-unit{font-size:9px;color:#64748B;font-weight:500}
.macro-latest-date{font-size:9px;color:#94A3B8}
.macro-note{font-size:9px;color:#94A3B8;margin-top:1px}
.macro-card{cursor:pointer;transition:transform .15s,box-shadow .15s}
.macro-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.macro-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:moFade .2s}
.macro-modal-card{background:#fff;border-radius:16px;padding:24px 28px 18px;width:680px;max-width:94vw;max-height:90vh;overflow-y:auto;cursor:default;box-shadow:0 24px 80px rgba(0,0,0,.25);position:relative;animation:moZoom .25s}
.macro-modal-card .macro-card{border:none;padding:0;background:transparent;cursor:default}
.macro-modal-card .macro-card:hover{transform:none;box-shadow:none}
.macro-modal-card .macro-card-title{font-size:15px;min-height:auto;margin-bottom:10px}
.macro-modal-card .macro-legend,.macro-modal-card [style*=legend]{font-size:11px!important}
.macro-modal-close{position:absolute;top:10px;right:16px;font-size:26px;cursor:pointer;color:#94A3B8;background:none;border:none;line-height:1;z-index:10;padding:4px 8px;border-radius:6px}
.macro-modal-close:hover{color:#475569;background:#F1F5F9}
.macro-data-section{margin-top:14px;border-top:1px solid #E2E8F0;padding-top:10px}
.macro-data-toggle{background:#F8FAFC;border:1px solid #CBD5E1;padding:6px 16px;border-radius:6px;font-size:12px;color:#64748B;cursor:pointer;font-weight:500}
.macro-data-toggle:hover{background:#EEF2FF;color:#4F46E5;border-color:#C7D2FE}
.macro-data-table-wrap{margin-top:10px;max-height:340px;overflow-y:auto;border:1px solid #E2E8F0;border-radius:8px}
.macro-data-table{width:100%;border-collapse:collapse;font-size:12px}
.macro-data-table th{background:#F8FAFC;padding:7px 12px;text-align:right;font-weight:600;color:#475569;border-bottom:2px solid #E2E8F0;position:sticky;top:0}
.macro-data-table th:first-child{text-align:left}
.macro-data-table td{padding:5px 12px;text-align:right;border-bottom:1px solid #F1F5F9;color:#334155;font-variant-numeric:tabular-nums}
.macro-data-table td:first-child{text-align:left;color:#64748B;font-weight:500}
.macro-data-table tbody tr:hover td{background:#EEF2FF}
.macro-na{color:#CBD5E1!important}
@keyframes moFade{from{opacity:0}to{opacity:1}}
@keyframes moZoom{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:768px){.header{padding:14px 16px}.header-left h1{font-size:16px}.stats-row{padding:10px 14px;gap:6px}.stat-pill{padding:8px 12px;font-size:12px}.pill-label{font-size:11px}.content{padding:0 12px 40px}.section-header{padding:12px 14px 0}.events-grid{grid-template-columns:1fr;padding:4px 14px 14px}}
</style>
</head>

<script>
window.IS_STANDALONE = true;
window.EMBEDDED_BRIEFINGS = {"zh": {"topic": "巴拉圭简报", "time_span": "2026年8月8日 — 2026年8月15日", "time_label": "最近一周", "sections": [{"title": "一、宏观经济动态", "tier": 1, "events": [{"title": "上半年经济增速5.6%，央行上调2026年GDP预测至4.5%（2026-08-14）", "date": "2026-08-14", "source_url": "https://www.lanacion.com.py/editorial/2026/08/14/sube-el-optimismo-por-el-alza-creciente-de-la-actividad-economica-del-pais/", "source_name": "La Nación", "summary": "巴拉圭月度经济活动指数（IMAEP）6月同比增长5.6%，上半年累计增长5.6%，由第一产业（+9.8%）、第二产业（+4.7%）和服务业（+5.1%）共同拉动。央行将2026年GDP增速预测从4.2%上调至4.5%，并将通胀预测下调至3.3%，理由是农业、制造业、公用事业和服务业表现均超预期。", "image_url": "https://lanacionpy.nyc3.digitaloceanspaces.com/img/ln-fb-share.png", "is_gov_source": false, "is_authoritative": true}, {"title": "出口激增25.2%至121.34亿美元，贸易逆差逆转为6.79亿美元顺差（2026-08-13）", "date": "2026-08-13", "source_url": "https://www.lanacion.com.py/negocios/2026/08/12/exportacion-crece-25-al-ritmo-de-los-envios-de-soja-sus-derivados-y-la-maquila/", "source_name": "La Nación", "summary": "巴拉圭2026年1-7月出口达121.337亿美元（同比增长25.2%），进口增长12.8%至114.546亿美元，实现6.791亿美元贸易顺差——较上年同期4.629亿美元逆差大幅逆转。大豆出口以26.486亿美元领涨（+49%），随后是来料加工（maquila）出口（+32.1%）和工业制成品（+35%）。", "image_url": "https://www.lanacion.com.py/resizer/v2/UBTGBQSY5RD4ZC6LHWBVVZGHLA.jpg?auth=85549e9a8d77d09ba66c3a3c33d5f31228dc31240ff1c39c4f055b2e0dc917ba&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "美元回升至6000瓜拉尼上方，远期合约增长22.8%，央行强调对冲（2026-08-14）", "date": "2026-08-14", "source_url": "https://www.lanacion.com.py/negocios/2026/08/14/valor-de-contratos-forward-crece-228-y-bcp-destaca-su-relevancia-ante-el-escenario-cambiario/", "source_name": "La Nación", "summary": "美元在跌破G. 6,000关口（8月1日低点G. 5,944.39）后回升至G. 6,027（央行8月14日参考汇率），属瓜拉尼整体升值趋势中的温和回调。央行报告远期合约同比增长22.8%，强调在瓜拉尼十个月升值约25%的汇率波动背景下，对冲工具至关重要。", "image_url": "https://www.lanacion.com.py/resizer/v2/LXR3T5MBDNAXFFE2WVAOEN3C7Y.jpeg?auth=683661889502ba8985510ff0f92ade59b4b17acae4048c3f3e7b3a6f5f1079a4&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "培尼亚执政三年：贫困率降至16%、失业率3.6%、新增24.2万就业（2026-08-14）", "date": "2026-08-14", "source_url": "https://www.ultimahora.com/tres-anos-de-gobierno-con-buenos-numeros-pero-que-no-llegan-a-todos", "source_name": "Última Hora", "summary": "在总统培尼亚执政三周年（8月15日）前夕，政府公布货币贫困率从21.6%（2023年）降至16%（2025年），失业率从4.5%降至3.6%，新增24.2万个就业岗位。但批评者认为增长'并未惠及所有人'，指出IPS（社保机构）危机持续、用工不稳定和农村被边缘化等问题。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/f756207/2147483647/strip/true/crop/2048x1152+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fd4%2F9e%2F8cb8e0154eb28032a2ac75782f74%2Fgw0ikooxkaarike.jpeg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "二、政治与政策动态", "tier": 1, "events": [{"title": "培尼亚推出能源改革：设立矿业与能源部 + 独立电力监管机构（2026-08-13）", "date": "2026-08-13", "source_url": "https://www.lanacion.com.py/politica/2026/08/13/gobierno-presenta-proyectos-para-crear-ministerio-de-minas-y-ente-regulador-electrico/", "source_name": "La Nación", "summary": "总统培尼亚提交两项法案并开启15天公开征求意见：设立矿业与能源部（将该领域从目前隶属于公共工程部（MOPC）的副部级提升为部级），以及设立独立的电力监管机构。改革源于激增的能源需求——私营企业正式申请达15,000兆瓦，相当于伊泰普水电站全部装机容量，未来13-15年该领域需投资约110亿美元。", "image_url": "https://www.lanacion.com.py/resizer/v2/JPB3OUGB7ZDAVCXQHYX4J5JTQU.png?auth=62fd8b386beb0965b90fb46e8c920c63012986eaf820fe605f5a421b43296850&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "推出'投资者通行证'：通过投资直接获得永久居留权（2026-08-04）", "date": "2026-08-04", "source_url": "https://www.mersanlaw.com/en/whats-new/paraguay-promotes-foreign-investment-with-the-new-investor-pass/", "source_name": "Mersan Law", "summary": "根据第0283/2026号决议，巴拉圭推出'投资者通行证'（Investor Pass），通过外国投资者证书（CIE）直接授予永久居留权，设四条投资路径：工业/制造业7万美元起、房地产20万美元起、金融工具20万美元起、旅游15万美元起。该计划将居民股息税从15%降至8%，流程基本数字化，CIE五个工作日内签发。", "image_url": "https://www.mersanlaw.com/wp-content/uploads/2026/04/Paraguay-impulsa-inversion-extranjera-con-el-nuevo-investor-pass-MERSAN.png", "is_gov_source": false, "is_authoritative": false}, {"title": "专家支持新设能源部，但要求保障ANDE职能不受削弱（2026-08-14）", "date": "2026-08-14", "source_url": "https://www.lanacion.com.py/politica/2026/08/14/expertos-avalan-nuevo-ministerio-de-energia-pero-exigen-blindar-funciones-de-la-ande/", "source_name": "La Nación", "summary": "能源专家普遍支持拟议的能源部和电力监管机构，但警告新机构不得剥离ANDE（国家电力管理局）的职能，其组织章程应在不削弱其地位的前提下更新。此番讨论正值Sitrande工会指控政府对Atome公司在电价政策上偏袒，凸显改革中的治理敏感问题。", "image_url": "https://www.lanacion.com.py/resizer/v2/H5MMAXW3FNAH7E2HUXBJKYIK7A.jpeg?auth=591883c9eb57372ac620ecf3cf130f5c751d90a1092d02c7f709cc2c234de324&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "三、社会与安全形势", "tier": 1, "events": [{"title": "培尼亚执政三周年前夕爆发'巴拉圭之痛'抗议与敲锅示威（2026-08-14）", "date": "2026-08-14", "source_url": "https://www.infobae.com/america/agencias/2026/08/14/gremios-y-campesinos-protestan-en-asuncion-en-vispera-de-los-3-anos-del-gobierno-de-pena/", "source_name": "Infobae", "summary": "工会和农民组织（阶级斗争潮流、OTEP、IPS工会、全国农民联合会）在亚松森游行，口号为'巴拉圭之痛'（Paraguay duele），回击培尼亚'我们会更好'的竞选口号。在姆布鲁比查·罗加（总统官邸）附近爆发的敲锅示威被大批警察封锁。示威者谴责劳工、医疗和社会保障状况恶化以及抗议被刑事化。", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "执政三年：宏观数据强劲却'未惠及所有人'（2026-08-14）", "date": "2026-08-14", "source_url": "https://www.ultimahora.com/tres-anos-de-gobierno-con-buenos-numeros-pero-que-no-llegan-a-todos", "source_name": "Última Hora", "summary": "尽管2025年GDP增长6.6%（地区最高），《最后时刻报》报道繁荣并未均衡分配。抗议领袖指出IPS危机——药品短缺、床位不足、超过11,000名不稳定合同工（包括收入低于最低工资的护士）——以及土地集中导致的农民和原住民社区被驱逐，凸显宏观增长与真实生活状况的脱节。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/f756207/2147483647/strip/true/crop/2048x1152+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fd4%2F9e%2F8cb8e0154eb28032a2ac75782f74%2Fgw0ikooxkaarike.jpeg", "is_gov_source": false, "is_authoritative": true}, {"title": "'农村和城市都没有工作'，农村青年外流加剧（2026-08-14）", "date": "2026-08-14", "source_url": "https://www.ultimahora.com/paraguay-duele-responden-campesinos-a-los-3-anos-de-gobierno-de-santiago-pena", "source_name": "Última Hora", "summary": "回应政府执政三周年的农民和青年领袖表示，由于缺乏就业和机会，成千上万年轻人正从农村流向亚松森、巴西和西班牙。他们指出工作、住房和土地短缺，教师处境艰难，而集中在农业综合企业的增长未能创造农村就业。", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/cc1a36b/2147483647/strip/true/crop/1599x899+0+83/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F56%2F32%2F571501f44d3cae5735d08805d43e%2Fmarcha-ppp.jpeg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "四、国际关系与外交动态", "tier": 1, "events": [{"title": "巴拉圭重申愿与中国大陆开展贸易但不断交台湾（2026-08-11）", "date": "2026-08-11", "source_url": "https://www.swissinfo.ch/chi/%e5%b7%b4%e6%8b%89%e5%9c%ad%ef%bc%9a%e4%b8%8d%e8%ae%be%e5%a4%96%e4%ba%a4%e6%9d%a1%e4%bb%b6%e4%b8%8b%e3%80%80%e6%84%bf%e4%b8%8e%e4%b8%ad%e5%9b%bd%e7%bb%8f%e8%b4%b8%e5%be%80%e6%9d%a5/91678643", "source_name": "SWI swissinfo.ch", "summary": "在第七次中国-南方共同市场对话期间，巴拉圭重申'只要不附加条件'，愿与中国大陆开展贸易，即不涉及其与台湾的外交关系。外长鲁本·拉米雷斯此前表示，在这些条件下巴拉圭'没有任何限制'。巴拉圭仍是台湾在南美洲的唯一盟友，也是南方共同市场中唯一未与中国建交的成员。", "image_url": "https://www.swissinfo.ch/content/wp-content/uploads/sites/13/2026/07/null-91678630.jpg?ver=701955e6", "is_gov_source": false, "is_authoritative": true}, {"title": "中国拒绝巴拉圭'两头下注'贸易主张，斥为'一厢情愿'（2026-08-12）", "date": "2026-08-12", "source_url": "https://www.globaltimes.cn/page/202607/1364857.shtml", "source_name": "Global Times", "summary": "中国官员和专家拒绝巴拉圭既与中国开展贸易、又维持与台湾关系的诉求，斥之为'一厢情愿'，强调经济合作不能与一个中国原则割裂。外交部发言人郭嘉昆敦促巴拉圭'站在历史正确的一边'。尽管未建交，中国仍是巴拉圭最大的商品供应国（手机、电脑、轮胎）。", "image_url": "https://www.globaltimes.cn/Portals/0/attachment/2026/2026-06-22/30379c50-a0ee-4234-93f7-d73a8602a6af.jpeg", "is_gov_source": false, "is_authoritative": true}, {"title": "南共市-日本EPA谈判推进，日本任命首席谈判代表（2026-08-14）", "date": "2026-08-14", "source_url": "https://www.observatorioasiapacifico.org/en/news/mercosur-and-japan-formally-launch-negotiations-for-an-economic-partnership-agreement/", "source_name": "Observatorio Asia-Pacífico", "summary": "日本任命前驻巴西大使、TPP谈判代表林祯二为南共市-日本经济伙伴关系协定（EPA）首席谈判代表，谈判预计2026年秋季启动。该EPA在6月30日亚松森南共市峰会上正式启动，将覆盖约4亿人口、合计GDP约7万亿美元的市场。", "image_url": "https://www.observatorioasiapacifico.org/wp-content/uploads/2026/07/141.jpg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "五、行业专题：通讯、运营商、数字能源与AI", "tier": 1, "events": [{"title": "第二轮5G拍卖落定：Tigo（2.3GHz）与Personal（3.7GHz）承诺建设750个基站（2026-08-12）", "date": "2026-08-12", "source_url": "https://www.infobae.com/america/agencias/2026/08/12/operadoras-de-capitales-extranjeros-ganan-licencias-para-desplegar-la-red-5g-en-paraguay/", "source_name": "Infobae", "summary": "CONATEL（国家电信委员会）完成第二轮5G拍卖：Tigo获得2.3-2.4GHz频段（160万美元），Personal获得3.7-3.8GHz频段（100万美元）。运营商须在90天内提交技术部署方案、180天内安装首个基站；四年内每家至少部署100个基站，合计承诺投资8000万美元、五年内建设约750个基站（5G NR Release 15及以上标准）。", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo、Personal——5G部署，合计8000万美元，750个基站"}, {"title": "CONATEL为Nubicom辩护，确认首基站已安装；培尼亚将批评归因于中国施压（2026-08-12）", "date": "2026-08-12", "source_url": "https://dplnews.com/paraguay-conatel-adjudico-segunda-licitacion-5g-cuando-deberan-ofrecer-servicio-nuevas-licenciatarias/", "source_name": "DPL News", "summary": "CONATEL否认Nubicom违约的报道，称这家阿根廷互联网服务商已安装首个基站并在亚松森测试，此前其承诺投资2亿美元。总统培尼亚将对第一次5G拍卖的批评归因于来自中国的所谓施压，并指出招标要求使用与巴拉圭有外交关系国家的设备。", "image_url": "https://dplnews.com/wp-content/uploads/2021/01/conatel.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom——5G部署，2亿美元承诺；监管辩护"}, {"title": "Datawaves向巴拉圭Claro交付边缘数据中心模块（2026-08-11）", "date": "2026-08-11", "source_url": "https://www.sdxcentral.com/news/datawaves-delivers-edge-data-center-modules-to-claro-paraguay/", "source_name": "SDxCentral", "summary": "阿根廷制造商Datawaves向巴拉圭Claro交付模块化边缘数据中心单元（含模块化FTTH光纤到户模块），至此已向美洲移动旗下Claro在阿根廷和巴拉圭供应超过25个模块，其中巴拉圭4个。模块含冷却系统、7个机架和自然冷却，支持Claro的光纤与网络扩展。", "image_url": "https://media.datacenterdynamics.com/media/images/datawaves_claro_paraguay.2e16d0ba.fill-1200x630.png", "is_gov_source": false, "is_authoritative": false, "client_tag": "Claro——边缘数据中心/FTTH基础设施"}], "impact_analysis": "", "user_notes": ""}, {"title": "六、主要客户动向", "tier": 1, "events": [{"title": "Tigo（Telecel）：160万美元获2.3GHz 5G牌照，四年内建100个基站（2026-08-12）", "date": "2026-08-12", "source_url": "https://www.infobae.com/america/agencias/2026/08/12/operadoras-de-capitales-extranjeros-ganan-licencias-para-desplegar-la-red-5g-en-paraguay/", "source_name": "Infobae", "summary": "Tigo（Telecel SAE，Millicom旗下）在第二轮5G拍卖中以160万美元获得2.3-2.4GHz频段。须在90天内提交技术方案、180天内安装首个基站，并在合计8000万美元投资承诺下四年内至少部署100个基站。", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Millicom/Tigo——5G 2.3GHz部署；网络设备、基站"}, {"title": "Personal（Núcleo）：100万美元获3.7GHz 5G牌照（2026-08-12）", "date": "2026-08-12", "source_url": "https://dplnews.com/paraguay-conatel-adjudico-segunda-licitacion-5g-cuando-deberan-ofrecer-servicio-nuevas-licenciatarias/", "source_name": "DPL News", "summary": "Personal（Núcleo SA，阿根廷电信旗下）以100万美元获得3.7-3.8GHz频段——与其阿根廷母公司使用的黄金频段相同。Personal在巴拉圭FTTH市场领先，是拥有166万用户的第二大移动运营商，有望在180天首基站期限下加速城市5G部署。", "image_url": "https://dplnews.com/wp-content/uploads/2021/01/conatel.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "阿根廷电信/Personal——5G 3.7GHz部署；FTTH、光纤"}, {"title": "Claro（美洲移动）：Datawaves边缘模块助力光纤与数据基础设施（2026-08-11）", "date": "2026-08-11", "source_url": "https://www.sdxcentral.com/news/datawaves-delivers-edge-data-center-modules-to-claro-paraguay/", "source_name": "SDxCentral", "summary": "巴拉圭Claro接收Datawaves模块化边缘数据中心单元，扩展其光纤和网络基础设施。Claro于2025年12月启用巴拉圭首个5G网络，采用诺基亚设备、初始投资3500万美元，正持续在大亚松森及主要城市扩张，服务94.7万移动用户。", "image_url": "https://media.datacenterdynamics.com/media/images/datawaves_claro_paraguay.2e16d0ba.fill-1200x630.png", "is_gov_source": false, "is_authoritative": false, "client_tag": "美洲移动/Claro——边缘数据中心、FTTH、5G扩展"}, {"title": "Nubicom：首个5G基站获确认，2亿美元承诺仍受关注（2026-08-12）", "date": "2026-08-12", "source_url": "https://dplnews.com/paraguay-conatel-adjudico-segunda-licitacion-5g-cuando-deberan-ofrecer-servicio-nuevas-licenciatarias/", "source_name": "DPL News", "summary": "Nubicom在2025年拍卖中以2亿美元承诺获得3.5GHz频段200MHz频谱，CONATEL确认其首个基站已安装并在亚松森测试，否认此前的违约报道。该运营商的进展被视为检验巴拉圭5G市场新进入者生存能力的试金石。", "image_url": "https://dplnews.com/wp-content/uploads/2021/01/conatel.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom——5G部署验证；潜在设备供应商"}], "impact_analysis": "", "user_notes": ""}, {"title": "七、对企业经营的综合影响分析", "tier": 2, "events": [], "impact_analysis": "🟢 宏观利好——增长与贸易：巴拉圭上半年经济增长5.6%，促使央行将2026年GDP预测上调至4.5%；1-7月出口激增25.2%，实现6.79亿美元顺差。对企业而言，这意味着内需稳健、外部账户改善。但增长仍集中于农业综合企业（大豆+49%）和来料加工（+32%），通讯和数字基础设施供应商需顺应一个虽在多元化但仍以大宗商品为主导的经济。\n\n🟡 汇率波动——对冲紧迫：美元在跌破G. 6,000（2018年低点）后于8月14日回升至G. 6,027，央行报告远期合约增长22.8%，企业纷纷对冲。资本品进口商受益于瓜拉尼走强，但任何以美元计收的业务都面临利润空间风险。央行中性立场叠加十个月约25%的升值，要求企业在运营中主动进行汇率对冲。\n\n🟢 能源改革——结构性机遇：培尼亚提议设立矿业与能源部及独立监管机构，背后是15,000兆瓦的私营需求申请和未来13-15年约110亿美元的投资需求，这是对数字能源领域最具分量的政策信号。数据中心和AI运营商（HIVE、台湾AI枢纽）有望从更清晰的规则和电价可预期性中获益，尽管ANDE的职能边界需审慎界定。\n\n🟡 监管与社会摩擦：培尼亚执政三周年前夕的'巴拉圭之痛'抗议和敲锅示威，叠加未解的IPS危机（11,000多名不稳定合同工），表明尽管宏观数据强劲，社会不满仍在上升。5G部署按计划推进，但CONATEL对Nubicom的处理——以及培尼亚将批评定性为中国施压——给一个本已面临排除华为和中兴的可信供应商限制的行业增添了政治噪音。\n\n🔴 集中度风险——客户敞口：四家持牌5G运营商（Claro、Nubicom、Tigo、Personal）现都面临部署期限（首个基站180天、四年内100个基站），产生近期设备需求。但随着市场向三家外资控股集团集中，供应商面临集中的对手方风险，应跨运营商分散，并进入企业/专网领域。", "user_notes": ""}, {"title": "八、对中资企业的专项影响与建议", "tier": 2, "events": [], "impact_analysis": "🔴 高风险——外交约束持续：巴拉圭仍是台湾在南美洲的唯一盟友，8月的第七次中国-南共市对话未改变这一局面。中国外交部和官方媒体明确拒绝巴拉圭'不断交台湾也要开展贸易'的立场，斥为'一厢情愿'，重申一个中国原则是前提。中资企业应预期在公开5G招标中被持续排除（华为和中兴因可信供应商条款被禁止），并在任何涉巴拉圭业务前进行严格的合规审查。\n\n🟡 中风险——仅限间接进入：中国是巴拉圭最大的商品供应国（手机、电脑、轮胎），中资企业仍可通过巴西、阿根廷或智利的子公司或贸易中间商间接服务该市场。南共市-日本EPA和中国-南共市对话打开了区域渠道，但在敏感领域（通讯、能源）的直接中国品牌基础设施交易仍受政治制约。\n\n🟢 机遇——能源与数字基础设施：能源改革（矿业与能源部、独立监管机构）和110亿美元的投资需求，为电力设备、输变电和电网现代化创造了需求，中国供应商（变压器、特高压直流、可再生能源）可通过与非中国伙伴的联合体参与。数据中心增长（HIVE的100兆瓦扩建、台湾AI枢纽最高1吉瓦的路线图）同样需要大量电力和制冷基础设施。\n\n🟢 机遇——借第三方供应设备：5G建设（750个基站、合计8000万美元承诺）需要射频设备、光纤和边缘基础设施。中国设备供应商虽被排除在公开拍卖之外，但可切入企业/专网、光纤批发，以及与已服务Claro、Tigo和Personal的拉美集成商（如Datawaves式模块供应商）合作。\n\n🟡 谨慎——劳工与社会风险：社会不满上升（'巴拉圭之痛'抗议）、IPS危机和农村青年外流，表明尽管总体增长亮眼，劳动力市场仍存在摩擦。在巴有实地业务的中资企业应审查安保与用工合规，计入3,044,000瓜拉尼的最低工资（2026年7月起+5%）和16.5%的IPS雇主缴款，并关注罢工风险（医生罢工仍定于8月24-28日）。", "user_notes": ""}]}, "en": {"topic": "Paraguay Briefing", "time_span": "August 8 – August 15, 2026", "time_label": "Past Week", "sections": [{"title": "I. Macroeconomic Developments", "tier": 1, "events": [{"title": "Economy Grows 5.6% in H1 2026; BCP Raises 2026 GDP Forecast to 4.5% (2026-08-14)", "date": "2026-08-14", "source_url": "https://www.lanacion.com.py/editorial/2026/08/14/sube-el-optimismo-por-el-alza-creciente-de-la-actividad-economica-del-pais/", "source_name": "La Nación", "summary": "Paraguay's Monthly Economic Activity Indicator (IMAEP) grew 5.6% year-on-year in June and accumulated 5.6% in H1 2026, driven by the primary sector (+9.8%), secondary (+4.7%) and services (+5.1%). The BCP raised its 2026 GDP growth projection from 4.2% to 4.5% and cut its inflation forecast to 3.3%, citing stronger-than-expected activity across agriculture, manufacturing, utilities and services.", "image_url": "https://lanacionpy.nyc3.digitaloceanspaces.com/img/ln-fb-share.png", "is_gov_source": false, "is_authoritative": true}, {"title": "Exports Surge 25.2% to USD 12.13B, Reversing Trade Deficit to USD 679M Surplus (2026-08-13)", "date": "2026-08-13", "source_url": "https://www.lanacion.com.py/negocios/2026/08/12/exportacion-crece-25-al-ritmo-de-los-envios-de-soja-sus-derivados-y-la-maquila/", "source_name": "La Nación", "summary": "Paraguay's exports reached USD 12,133.7 million in January-July 2026 (+25.2% year-on-year), while imports grew 12.8% to USD 11,454.6 million, producing a USD 679.1 million trade surplus — a sharp reversal from the USD 462.9 million deficit a year earlier. Soybeans led the expansion at USD 2,648.6 million (+49%), followed by maquila exports (+32.1%) and industrial manufactures (+35%).", "image_url": "https://www.lanacion.com.py/resizer/v2/UBTGBQSY5RD4ZC6LHWBVVZGHLA.jpg?auth=85549e9a8d77d09ba66c3a3c33d5f31228dc31240ff1c39c4f055b2e0dc917ba&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Dollar Rebounds Above G. 6,000; Forward Contracts Grow 22.8% as BCP Urges Hedging (2026-08-14)", "date": "2026-08-14", "source_url": "https://www.lanacion.com.py/negocios/2026/08/14/valor-de-contratos-forward-crece-228-y-bcp-destaca-su-relevancia-ante-el-escenario-cambiario/", "source_name": "La Nación", "summary": "After breaking below G. 6,000 for the first time since 2018 (low of G. 5,944.39 on August 1), the US dollar rebounded to G. 6,027 (BCP reference rate, August 14), a mild correction within an overall appreciating-guaraní trend. The BCP reported forward contracts grew 22.8% year-on-year, highlighting hedging instruments as essential amid exchange-rate volatility that has seen the guaraní appreciate roughly 25% over ten months.", "image_url": "https://www.lanacion.com.py/resizer/v2/LXR3T5MBDNAXFFE2WVAOEN3C7Y.jpeg?auth=683661889502ba8985510ff0f92ade59b4b17acae4048c3f3e7b3a6f5f1079a4&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Three Years of Peña: Poverty Down to 16%, Unemployment 3.6%, 242,000 New Jobs (2026-08-14)", "date": "2026-08-14", "source_url": "https://www.ultimahora.com/tres-anos-de-gobierno-con-buenos-numeros-pero-que-no-llegan-a-todos", "source_name": "Última Hora", "summary": "On the eve of President Santiago Peña's third anniversary (August 15), the government reported monetary poverty fell from 21.6% (2023) to 16% (2025), unemployment dropped from 4.5% to 3.6%, and 242,000 new jobs were created. However, critics argue the growth 'does not reach everyone', citing the persistent IPS crisis, precarious labor and rural exclusion.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/f756207/2147483647/strip/true/crop/2048x1152+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fd4%2F9e%2F8cb8e0154eb28032a2ac75782f74%2Fgw0ikooxkaarike.jpeg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "II. Political & Policy Developments", "tier": 1, "events": [{"title": "Peña Unveils Energy Reform: Ministry of Mines and Energy + Independent Electricity Regulator (2026-08-13)", "date": "2026-08-13", "source_url": "https://www.lanacion.com.py/politica/2026/08/13/gobierno-presenta-proyectos-para-crear-ministerio-de-minas-y-ente-regulador-electrico/", "source_name": "La Nación", "summary": "President Peña presented two draft bills opening a 15-day public consultation: creation of a Ministry of Mines and Energy (elevating the sector from its current vice-ministry status under MOPC) and an independent electricity regulator. The reform responds to surging demand — private companies have formally requested 15,000 MW, equal to Itaipú's entire capacity, and the sector needs an estimated USD 11 billion over 13-15 years.", "image_url": "https://www.lanacion.com.py/resizer/v2/JPB3OUGB7ZDAVCXQHYX4J5JTQU.png?auth=62fd8b386beb0965b90fb46e8c920c63012986eaf820fe605f5a421b43296850&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}, {"title": "Investor Pass Grants Direct Permanent Residency via Investment (2026-08-04)", "date": "2026-08-04", "source_url": "https://www.mersanlaw.com/en/whats-new/paraguay-promotes-foreign-investment-with-the-new-investor-pass/", "source_name": "Mersan Law", "summary": "Through Resolution 0283/2026, Paraguay launched the 'Investor Pass', granting direct permanent residency via the Foreign Investor Certificate (CIE) with four investment routes: industrial/manufacturing from USD 70,000, real estate from USD 200,000, financial instruments from USD 200,000, and tourism from USD 150,000. The program cuts dividend tax for residents from 15% to 8% and is largely digital, with the CIE issued in five business days.", "image_url": "https://www.mersanlaw.com/wp-content/uploads/2026/04/Paraguay-impulsa-inversion-extranjera-con-el-nuevo-investor-pass-MERSAN.png", "is_gov_source": false, "is_authoritative": false}, {"title": "Experts Endorse New Energy Ministry but Demand ANDE Functions Be Protected (2026-08-14)", "date": "2026-08-14", "source_url": "https://www.lanacion.com.py/politica/2026/08/14/expertos-avalan-nuevo-ministerio-de-energia-pero-exigen-blindar-funciones-de-la-ande/", "source_name": "La Nación", "summary": "Energy specialists broadly backed the proposed Ministry of Energy and electricity regulator but warned the new entity must not strip functions from ANDE, whose organic charter should be updated without weakening it. The debate unfolded amid a Sitrande union complaint alleging favoritism toward the company Atome in tariff policy, underscoring governance sensitivities in the reform.", "image_url": "https://www.lanacion.com.py/resizer/v2/H5MMAXW3FNAH7E2HUXBJKYIK7A.jpeg?auth=591883c9eb57372ac620ecf3cf130f5c751d90a1092d02c7f709cc2c234de324&width=1200&height=630&smart=true", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "III. Social & Security Landscape", "tier": 1, "events": [{"title": "'Paraguay duele' Protests and Cacerolazo on Eve of Peña's Third Anniversary (2026-08-14)", "date": "2026-08-14", "source_url": "https://www.infobae.com/america/agencias/2026/08/14/gremios-y-campesinos-protestan-en-asuncion-en-vispera-de-los-3-anos-del-gobierno-de-pena/", "source_name": "Infobae", "summary": "Unions and peasant organizations (Corriente Clasista y Combativa, OTEP, the IPS union, Federación Nacional Campesina) marched in Asunción under the slogan 'Paraguay duele' (Paraguay hurts), a rebuttal to Peña's 'Vamos a estar mejor' campaign. A cacerolazo near Mburuvicha Róga was blocked by a heavy police cordon. Demonstrators denounced deteriorating labor, health and social-security conditions and the criminalization of protest.", "image_url": null, "is_gov_source": false, "is_authoritative": true}, {"title": "Three Years of Government: Strong Macro Numbers 'Don't Reach Everyone' (2026-08-14)", "date": "2026-08-14", "source_url": "https://www.ultimahora.com/tres-anos-de-gobierno-con-buenos-numeros-pero-que-no-llegan-a-todos", "source_name": "Última Hora", "summary": "Despite GDP growth of 6.6% in 2025 (the region's highest), Última Hora reports that prosperity is unevenly distributed. Protest leaders highlighted the IPS crisis — medicine shortages, lack of beds, over 11,000 precarious contractors including nurses earning below the minimum wage — and the concentration of land with evictions of peasant and indigenous communities, framing the disconnect between headline growth and lived conditions.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/f756207/2147483647/strip/true/crop/2048x1152+0+0/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2Fd4%2F9e%2F8cb8e0154eb28032a2ac75782f74%2Fgw0ikooxkaarike.jpeg", "is_gov_source": false, "is_authoritative": true}, {"title": "Rural Youth Migration Rises as 'There Are No Jobs in the Countryside or City' (2026-08-14)", "date": "2026-08-14", "source_url": "https://www.ultimahora.com/paraguay-duele-responden-campesinos-a-los-3-anos-de-gobierno-de-santiago-pena", "source_name": "Última Hora", "summary": "Peasant and youth leaders responding to the government's third anniversary said thousands of young people are migrating from the countryside to Asunción, Brazil and Spain due to lack of employment and opportunities. They cited shortages of work, housing and land, and precarious conditions for teachers, as growth concentrated in agribusiness fails to generate rural jobs.", "image_url": "https://grupovierci.brightspotcdn.com/dims4/default/cc1a36b/2147483647/strip/true/crop/1599x899+0+83/resize/1440x810!/quality/90/?url=https%3A%2F%2Fk2-prod-grupo-vierci.s3.us-east-1.amazonaws.com%2Fbrightspot%2F56%2F32%2F571501f44d3cae5735d08805d43e%2Fmarcha-ppp.jpeg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "IV. International Relations & Diplomacy", "tier": 1, "events": [{"title": "Paraguay Reaffirms Openness to China Trade Without Breaking Taiwan Ties (2026-08-11)", "date": "2026-08-11", "source_url": "https://www.swissinfo.ch/chi/%e5%b7%b4%e6%8b%89%e5%9c%ad%ef%bc%9a%e4%b8%8d%e8%ae%be%e5%a4%96%e4%ba%a4%e6%9d%a1%e4%bb%b6%e4%b8%8b%e3%80%80%e6%84%bf%e4%b8%8e%e4%b8%ad%e5%9b%bd%e7%bb%8f%e8%b4%b8%e5%be%80%e6%9d%a5/91678643", "source_name": "SWI swissinfo.ch", "summary": "During the 7th China-Mercosur dialogue, Paraguay reiterated it is open to trade with mainland China 'as long as there are no conditions' regarding its diplomatic ties with Taiwan. Foreign Minister Rubén Ramírez previously stated Paraguay 'has no restrictions' under those terms. Paraguay remains Taiwan's sole ally in South America and the only Mercosur member without diplomatic relations with China.", "image_url": "https://www.swissinfo.ch/content/wp-content/uploads/sites/13/2026/07/null-91678630.jpg?ver=701955e6", "is_gov_source": false, "is_authoritative": true}, {"title": "China Rejects Paraguay's 'Wishful Thinking' on Two-Track Trade (2026-08-12)", "date": "2026-08-12", "source_url": "https://www.globaltimes.cn/page/202607/1364857.shtml", "source_name": "Global Times", "summary": "Chinese officials and experts rejected Paraguay's bid to trade with China while maintaining ties with Taiwan as 'wishful thinking', insisting that economic cooperation cannot be separated from the One-China principle. Foreign Ministry spokesperson Guo Jiakun urged Paraguay to 'stand on the right side of history'. China remains Paraguay's largest supplier of goods (phones, computers, tires) despite the absence of diplomatic relations.", "image_url": "https://www.globaltimes.cn/Portals/0/attachment/2026/2026-06-22/30379c50-a0ee-4234-93f7-d73a8602a6af.jpeg", "is_gov_source": false, "is_authoritative": true}, {"title": "Mercosur-Japan EPA Talks Advance as Japan Names Chief Negotiator (2026-08-14)", "date": "2026-08-14", "source_url": "https://www.observatorioasiapacifico.org/en/news/mercosur-and-japan-formally-launch-negotiations-for-an-economic-partnership-agreement/", "source_name": "Observatorio Asia-Pacífico", "summary": "Japan appointed Hayashi Teiji, former ambassador to Brazil and TPP negotiator, as chief negotiator for the Mercosur-Japan Economic Partnership Agreement, with talks expected to begin in autumn 2026. The EPA, formally launched at the June 30 Mercosur summit in Asunción, would cover a market of roughly 400 million people and a combined GDP of about USD 7 trillion.", "image_url": "https://www.observatorioasiapacifico.org/wp-content/uploads/2026/07/141.jpg", "is_gov_source": false, "is_authoritative": true}], "impact_analysis": "", "user_notes": ""}, {"title": "V. Industry Focus: Telecom, Digital Energy & AI", "tier": 1, "events": [{"title": "Second 5G Auction Finalized: Tigo (2.3 GHz) and Personal (3.7 GHz) Commit to 750 Base Stations (2026-08-12)", "date": "2026-08-12", "source_url": "https://www.infobae.com/america/agencias/2026/08/12/operadoras-de-capitales-extranjeros-ganan-licencias-para-desplegar-la-red-5g-en-paraguay/", "source_name": "Infobae", "summary": "CONATEL finalized the second 5G auction: Tigo won 2.3-2.4 GHz (USD 1.6 million) and Personal won 3.7-3.8 GHz (USD 1 million). Operators have 90 days to submit technical deployment plans and 180 days to install the first base station; each must deploy at least 100 base stations within four years, with a combined commitment of USD 80 million and about 750 base stations in five years (5G NR Release 15 or higher).", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo, Personal — 5G deployment, USD 80M combined, 750 base stations"}, {"title": "Conatel Defends Nubicom, Confirms First Base Station Installed; Peña Links Criticism to China Pressure (2026-08-12)", "date": "2026-08-12", "source_url": "https://dplnews.com/paraguay-conatel-adjudico-segunda-licitacion-5g-cuando-deberan-ofrecer-servicio-nuevas-licenciatarias/", "source_name": "DPL News", "summary": "CONATEL denied reports of Nubicom's non-compliance, stating the Argentine ISP has installed its first base station and is conducting tests in Asunción, following its USD 200 million investment pledge. President Peña attributed criticism of the first 5G auction to alleged pressure from China, noting the tender required equipment from countries with diplomatic relations with Paraguay.", "image_url": "https://dplnews.com/wp-content/uploads/2021/01/conatel.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom — 5G deployment, USD 200M pledge; regulatory defense"}, {"title": "Datawaves Delivers Edge Data Center Modules to Claro Paraguay (2026-08-11)", "date": "2026-08-11", "source_url": "https://www.sdxcentral.com/news/datawaves-delivers-edge-data-center-modules-to-claro-paraguay/", "source_name": "SDxCentral", "summary": "Argentine manufacturer Datawaves delivered modular edge data center units (including a modular FTTH module) to Claro Paraguay, adding to more than 25 modules supplied to América Móvil's Claro across Argentina and Paraguay, including four for Paraguay. The modules include cooling, seven racks and free cooling, supporting Claro's fiber and network expansion.", "image_url": "https://media.datacenterdynamics.com/media/images/datawaves_claro_paraguay.2e16d0ba.fill-1200x630.png", "is_gov_source": false, "is_authoritative": false, "client_tag": "Claro — edge data center / FTTH infrastructure"}], "impact_analysis": "", "user_notes": ""}, {"title": "VI. Key Client Developments", "tier": 1, "events": [{"title": "Tigo (Telecel): Wins 2.3 GHz 5G License for USD 1.6M; 100 Base Stations in Four Years (2026-08-12)", "date": "2026-08-12", "source_url": "https://www.infobae.com/america/agencias/2026/08/12/operadoras-de-capitales-extranjeros-ganan-licencias-para-desplegar-la-red-5g-en-paraguay/", "source_name": "Infobae", "summary": "Tigo (Telecel SAE, Millicom) won the 2.3-2.4 GHz band for USD 1.6 million in the second 5G auction. It must submit technical plans within 90 days, install its first base station within 180 days, and deploy at least 100 base stations within four years under the combined USD 80 million investment commitment.", "image_url": null, "is_gov_source": false, "is_authoritative": true, "client_tag": "Millicom/Tigo — 5G 2.3 GHz deployment; network equipment, base stations"}, {"title": "Personal (Núcleo): Wins 3.7 GHz 5G License for USD 1M (2026-08-12)", "date": "2026-08-12", "source_url": "https://dplnews.com/paraguay-conatel-adjudico-segunda-licitacion-5g-cuando-deberan-ofrecer-servicio-nuevas-licenciatarias/", "source_name": "DPL News", "summary": "Personal (Núcleo SA, Telecom Argentina) won the 3.7-3.8 GHz band for USD 1 million — the same prime band used by its Argentine parent. Personal leads Paraguay's FTTH market and is the second-largest mobile operator with 1.66 million users, positioning it to accelerate 5G in urban centers under the 180-day first-base-station deadline.", "image_url": "https://dplnews.com/wp-content/uploads/2021/01/conatel.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Telecom Argentina/Personal — 5G 3.7 GHz deployment; FTTH, fiber"}, {"title": "Claro (América Móvil): Datawaves Edge Modules Bolster Fiber and Data Infrastructure (2026-08-11)", "date": "2026-08-11", "source_url": "https://www.sdxcentral.com/news/datawaves-delivers-edge-data-center-modules-to-claro-paraguay/", "source_name": "SDxCentral", "summary": "Claro Paraguay received modular edge data center units from Datawaves, expanding its fiber and network infrastructure. Claro, which activated the country's first 5G network in December 2025 with Nokia equipment and an initial USD 35 million investment, continues its expansion across Greater Asunción and key cities, serving 947,000 mobile users.", "image_url": "https://media.datacenterdynamics.com/media/images/datawaves_claro_paraguay.2e16d0ba.fill-1200x630.png", "is_gov_source": false, "is_authoritative": false, "client_tag": "América Móvil/Claro — edge data center, FTTH, 5G expansion"}, {"title": "Nubicom: First 5G Base Station Confirmed, USD 200M Pledge Under Scrutiny (2026-08-12)", "date": "2026-08-12", "source_url": "https://dplnews.com/paraguay-conatel-adjudico-segunda-licitacion-5g-cuando-deberan-ofrecer-servicio-nuevas-licenciatarias/", "source_name": "DPL News", "summary": "Nubicom, the Argentine ISP that won 200 MHz in the 3.5 GHz band in the 2025 auction with a USD 200 million pledge, saw CONATEL confirm its first base station is installed with testing underway in Asunción, denying earlier non-compliance reports. The operator's progress is closely watched as a test of new-entrant viability in Paraguay's 5G market.", "image_url": "https://dplnews.com/wp-content/uploads/2021/01/conatel.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom — 5G rollout validation; potential equipment suppliers"}], "impact_analysis": "", "user_notes": ""}, {"title": "VII. Integrated Impact Analysis for Business Operations", "tier": 2, "events": [], "impact_analysis": "🟢 Macro Tailwind — Growth & Trade: Paraguay's economy expanded 5.6% in H1 2026, prompting the BCP to raise its 2026 GDP forecast to 4.5%, while January-July exports surged 25.2% to a USD 679 million surplus. For businesses, this signals robust domestic demand and improving external accounts. However, growth remains concentrated in agribusiness (soybeans +49%) and maquila (+32%), so telecom and digital-infrastructure vendors must align with a diversifying but still commodity-led economy.\n\n🟡 FX Volatility — Hedging Urgency: After breaking below G. 6,000 (a 2018 low), the dollar rebounded to G. 6,027 by August 14, and BCP-reported forward contracts grew 22.8% as firms rushed to hedge. Importers of capital goods benefit from the strong guaraní, but any USD-revenue business faces margin risk. The BCP's neutral stance and the ~25% ten-month appreciation argue for proactive FX hedging across operations.\n\n🟢 Energy Reform — Structural Opportunity: Peña's proposal to create a Ministry of Mines and Energy plus an independent regulator, backed by 15,000 MW of private demand requests and an estimated USD 11 billion investment need over 13-15 years, is the most consequential policy signal for the digital-energy sector. Data-center and AI operators (HIVE, the Taiwan hub) stand to gain from clearer rules and tariff predictability, though ANDE's role must be carefully delineated.\n\n🟡 Regulatory & Social Friction: The 'Paraguay duele' protests and cacerolazo on the eve of Peña's third anniversary, plus the unresolved IPS crisis (11,000+ precarious workers), signal rising social discontent despite strong macro numbers. The 5G rollout remains on track, but CONATEL's handling of Nubicom — and Peña's framing of criticism as Chinese pressure — adds political noise to a sector already navigating trusted-vendor restrictions that exclude Huawei and ZTE.\n\n🔴 Concentration Risk — Client Exposure: All four licensed 5G operators (Claro, Nubicom, Tigo, Personal) now face deployment deadlines (180 days for the first base station, 100 base stations in four years), creating near-term equipment demand. But with the market consolidating around three foreign-controlled groups, suppliers face concentrated counterparty risk and should diversify across operators and into enterprise/private-network segments.", "user_notes": ""}, {"title": "VIII. Targeted Recommendations for Chinese Enterprises", "tier": 2, "events": [], "impact_analysis": "🔴 High Risk — Diplomatic Constraints Persist: Paraguay remains Taiwan's sole South American ally, and the 7th China-Mercosur dialogue in August did not shift this. China's Foreign Ministry and state media explicitly rejected Paraguay's 'trade without breaking Taiwan ties' stance as 'wishful thinking', reaffirming the One-China principle as a precondition. Chinese enterprises should expect continued exclusion from public 5G tenders (Huawei and ZTE are barred under trusted-vendor clauses) and conduct rigorous compliance reviews before any Paraguay-linked engagement.\n\n🟡 Medium Risk — Indirect Access Only: China is Paraguay's largest goods supplier (phones, computers, tires), and Chinese firms can still serve the market indirectly via Brazilian, Argentine or Chilean subsidiaries or trading intermediaries. The Mercosur-Japan EPA and the China-Mercosur dialogue open regional channels, but direct Chinese-branded infrastructure deals in sensitive sectors (telecom, energy) remain politically constrained.\n\n🟢 Opportunity — Energy & Digital Infrastructure: The energy reform (Ministry of Mines and Energy, independent regulator) and the USD 11 billion investment need create demand for power equipment, transmission and grid modernization where Chinese suppliers (transformers, HVDC, renewables) can participate through consortiums with non-Chinese partners. Data-center growth (HIVE's 100 MW expansion, the Taiwan AI hub's up-to-1-GW roadmap) similarly requires massive electrical and cooling infrastructure.\n\n🟢 Opportunity — Equipment via Third Parties: The 5G buildout (750 base stations, USD 80 million combined commitment) requires radios, fiber and edge infrastructure. Chinese equipment vendors, though barred from the public auction, can pursue enterprise/private networks, wholesale fiber, and partnerships with Latin American integrators (e.g., Datawaves-style module suppliers) that already serve Claro, Tigo and Personal.\n\n🟡 Caution — Labor & Social Risk: Rising social discontent ('Paraguay duele' protests), the IPS crisis and rural youth migration point to labor-market friction despite headline growth. Chinese firms with field operations should review security and labor compliance, account for the PYG 3,044,000 minimum wage (+5% from July 2026) and the 16.5% IPS employer contribution, and monitor strike risk (the doctors' strike remains scheduled for August 24-28).", "user_notes": ""}]}};

function renderMacroSVG(d,opts){
  var W=290,H=170,mL=42,mR=opts.dual?42:10,mT=20,mB=30,cW=W-mL-mR,cH=H-mT-mB;

    else{var dMap={CPI:MACRO_CPI,RIN:MACRO_RIN};var unitMap={CPI:MACRO_CPI.lu,RIN:L(MACRO_RIN.lu[0],MACRO_RIN.lu[1])};dataSection=renderMacroDataTable(dMap[type],unitMap[type]);}

function renderFXDailyTable(d,unit){

function renderAll(){

  var sections=d.sections||[],tier1=[],tier2=[];

function renderSection(sec,idx){
  var events=sec.events||[],isT2=sec.tier===2;
  var g=GRAD[idx%8],icon=ICONS[idx%8];
  var body='';
  if(isT2||events.length===0){
    if(sec.impact_analysis)body='<div class="analysis-body">'+fmt(sec.impact_analysis)+'</div>';
    else if(!isT2)body='<div style="padding:4px 22px 16px;color:#94A3B8;font-size:13px;">'+L('暂无此时间段内的事件','No events in this period')+'</div>';
  }else{
    var cards='';
    for(var i=0;i<events.length;i++)cards+=renderCard(events[i],g[0],g[1],icon);

  }
  var badge=events.length>0?'<span class="badge">'+events.length+L(' 条事件',' events')+'</span>':'';
  return '<div class="section s'+(idx%8)+(isT2?' tier2':'')+'" id="sec-'+idx+'"><div class="section-header"><h2>'+esc(sec.title||'')+'</h2>'+badge+'</div>'+(sec.description?'<div class="section-desc">'+esc(sec.description)+'</div>':'')+body+'</div>';

function renderCard(evt,phFrom,phTo,icon){
  var img=evt.image_url,hasImg=img&&img.indexOf('http')===0;
  var ih='';
  if(hasImg)ih='<img src="'+esc(img)+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">';
  ih+='<div class="img-placeholder" style="background:linear-gradient(135deg,'+phFrom+','+phTo+');'+(hasImg?'display:none':'display:flex')+';font-size:32px;color:#fff;">'+icon+'</div>';

  var tags='';
  if(evt.date)tags+='<span class="event-tag date">'+esc(evt.date)+'</span>';
  if(evt.client_tag)tags+='<span class="event-tag client">'+esc(evt.client_tag)+'</span>';
  if(evt.is_gov_source)tags+='<span class="event-tag gov">'+L('政府官网','Government')+'</span>';
  else if(evt.is_authoritative)tags+='<span class="event-tag auth">'+L('权威媒体','Authoritative')+'</span>';
  if(evt.source_name)tags+='<span class="event-tag source">'+esc(evt.source_name)+'</span>';

  var link=evt.source_url?'<a class="event-link" href="'+esc(evt.source_url)+'" target="_blank" rel="noopener">'+L('查看原文 →','Read more →')+'</a>':'';
  var preview=evt.summary||'';if(!preview&&evt.title)preview=evt.title;
  return '<div class="event-card"><div class="event-img">'+ih+'</div><div class="event-body"><div class="event-meta">'+tags+'</div><div class="event-preview">'+esc(preview)+'</div>'+link+'</div></div>';
}

function fmt(text){
  var h=esc(text);
  h=h.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
  h=h.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
  h=h.replace(/\n/g,'<br>');
  return h;
}

function scrollToSec(idx){
  var pills=document.querySelectorAll('.stat-pill');
  for(var i=0;i<pills.length;i++)pills[i].style.outline='';
  if(idx===null||idx===undefined){window.scrollTo({top:0,behavior:'smooth'});return;}
  var el=document.getElementById('sec-'+idx);
  if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.style.boxShadow='0 0 0 3px #3B82F6';
  setTimeout(function(){el.style.boxShadow='';},1500);
}

  fetch('/api/briefing/briefing_en.json').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    DATA['en']=data;briefingData=data;renderAll();
    fetch('/api/briefing/briefing.json').then(function(r){if(r.ok)return r.json();}).then(function(zh){if(zh)DATA['zh']=zh;}).catch(function(){});
  }).catch(function(){alert(L('刷新失败','Refresh failed'));}).finally(function(){
    btn.disabled=false;btn.textContent=L('刷新简报','Refresh');
  });
}
function openMacroModal(){
  var h='<div class="update-modal-overlay" id="macroModal" onclick="closeUpdateModal(\'macroModal\')"><div class="update-modal" onclick="event.stopPropagation()"><h3>'+L('更新宏观数据','Update Macro Data')+'</h3>';
  h+='<p style="font-size:11px;color:#94A3B8;margin-bottom:12px">'+L('下载最新 BCP Excel 后填入文件名','Fill in latest BCP Excel filenames')+'</p>';
  h+='<input type="text" id="cpiFileName" placeholder="'+L('CPI文件，如 AE_IPC-26.6.xlsx','CPI file, e.g. AE_IPC-26.6.xlsx')+'" style="width:100%;font-size:12px;padding:8px 10px;border:1px solid #CBD5E1;border-radius:6px;margin-bottom:8px">';
  h+='<input type="text" id="rinFileName" placeholder="'+L('RIN文件，如 reservas...xlsx','RIN file, e.g. reservas...xlsx')+'" style="width:100%;font-size:12px;padding:8px 10px;border:1px solid #CBD5E1;border-radius:6px;margin-bottom:12px">';
  h+='<div class="btn-row"><button class="btn-secondary" onclick="closeUpdateModal(\'macroModal\')">'+L('取消','Cancel')+'</button><button class="btn-primary" onclick="refreshMacroData()">'+L('更新','Update')+'</button></div>';
  h+='<div id="genStatus" style="margin-top:10px;font-size:12px;color:#64748B;display:none"></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
}
function refreshMacroData(){
  var cpiFile=document.getElementById('cpiFileName').value.trim();
  var rinFile=document.getElementById('rinFileName').value.trim();
  if(!cpiFile&&!rinFile){alert(L('请至少输入一个文件名','Please enter at least one filename.'));return;}
  var st=document.getElementById('genStatus');
  st.style.display='block';st.innerHTML='<span class="loading-spinner"></span>'+L('正在读取宏观数据文件…','Reading macro data files…');
  fetch('/api/update-macro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cpi_file:cpiFile,rin_file:rinFile})}).then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    var msgs=[];
    if(data.cpi&&data.cpi.length){MACRO_CPI.line=data.cpi;msgs.push(L('CPI已更新('+data.cpi.length+'个月)','CPI updated ('+data.cpi.length+' mo)'));}
    if(data.cpi_error)msgs.push(L('CPI错误: ','CPI error: ')+data.cpi_error);
    if(data.rin&&data.rin.length){MACRO_RIN.line=data.rin;msgs.push(L('RIN已更新('+data.rin.length+'个月)','RIN updated ('+data.rin.length+' mo)'));}
    if(data.rin_error)msgs.push(L('RIN错误: ','RIN error: ')+data.rin_error);
    if(msgs.length){renderAll();st.innerHTML='<span style="color:#10B981">'+msgs.join('; ')+'</span>';}
    else st.innerHTML='<span style="color:#EF4444">'+L('更新失败','Update failed')+'</span>';
  }).catch(function(){st.innerHTML='<span style="color:#EF4444">'+L('更新失败，请确保 Flask 服务器已启动','Failed. Make sure Flask server is running.')+'</span>';});
}
function closeUpdateModal(id){
  var m=document.getElementById(id||'updateModal');if(m)m.remove();
  var h=document.getElementById('histModal');if(h&&id!=='histModal')h.remove();
}
document.addEventListener('DOMContentLoaded',function(){
  if(window.IS_STANDALONE)document.getElementById('standaloneBanner').style.display='block';
  if(MACRO_FX.monthly&&!MACRO_FX.line)MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
  fetch('/api/briefing/briefing_en.json').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    DATA['en']=data;briefingData=data;currentLang='en';renderAll();updateLangBtn();
    fetch('/api/briefing/briefing.json').then(function(r){if(r.ok)return r.json();}).then(function(zh){if(zh)DATA['zh']=zh;}).catch(function(){});
    if(!window.IS_STANDALONE)fetchLiveFX();
  }).catch(function(){
    briefingData=DATA['en'];currentLang='en';renderAll();updateLangBtn();
  });
});
function fetchLiveFX(){
  fetch('/api/macro/fx').then(function(r){if(!r.ok)return;return r.json();}).then(function(d){
    if(!d||!d.rate)return;
    var arr=MACRO_FX.monthly||MACRO_FX.line||[];
    arr[arr.length-1]=d.rate;
    window.MACRO_FX_DATE=(d.date||'').replace(/-/g,'.');
    MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
    renderAll();
  }).catch(function(){});
}
</script>
</body>
