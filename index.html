pectrum auction, 5G deployment and new data centre investment as the next targets. Millicom closed 2025 with record profits of USD 850 million.", "image_url": "https://www.telesemana.com/wp-content/uploads/2023/02/torres-antenas-kabiur-rahman-riyad-YzZJUXjb9aw-unsplash-e1676670022939.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Tigo / Millicom — USD 500M capex, tower sale-leaseback, 5G readiness"}, {"title": "Personal Wins the 3.7 GHz Band for USD 1 Million and Faces a 180-Day First-Radiobase Clock Marking Its Entry into 5G (2026-09-22)", "date": "2026-09-22", "source_url": "https://dplnews.com/personal-tigo-licencias-5g-paraguay/", "source_name": "DPL News / CONATEL", "summary": "Núcleo S.A., which trades as Personal and is a subsidiary of Telecom Argentina, was awarded the 3,700–3,800 MHz block in CONATEL's second 5G spectrum tender for USD 1 million, formalised through Board Resolution 1628/2026. Tigo took the paired 2,300–2,400 MHz block for USD 1.6 million. The two were the only bidders in a process where both had sat out the 2025 first auction. The tender rules give each licence-holder 90 days to submit detailed technical deployment plans and 180 days to install the first radiobase and begin commercial service, plus an obligation to deploy at least 100 radiobases within four years. Combined commitments are USD 80 million and roughly 750 radiobases in the first five years, with mandatory passive infrastructure sharing of towers and sites where technically viable. The 180-day clock is the operative near-term milestone for vendor engagement: Personal's 3.7 GHz band points to a capacity-layer deployment for dense urban coverage, while Tigo's 2.3 GHz allocation is better suited to broader coverage. Personal has also extended its lead in fixed internet for a fifth consecutive period.", "image_url": "https://dplnews.com/wp-content/uploads/2026/06/Gemini_Generated_Image_2s4av12s4av12s4a-1024x572.png", "is_gov_source": false, "is_authoritative": true, "client_tag": "Personal / Núcleo — 3.7 GHz licence, 100 radiobases in four years"}, {"title": "Claro Operates 5G in Eight Cities from 100 Radiobases as a Senate Resolution Requests a Full CONATEL Report on All Four Operators (2026-09-22)", "date": "2026-09-22", "source_url": "https://www.telesemana.com/panorama-de-mercado/paraguay/", "source_name": "Telesemana / CONATEL / Senado", "summary": "Claro Paraguay, first to launch commercial 5G in December 2025, reports coverage now spanning the central zone plus Coronel Oviedo, Villarrica, Pedro Juan Caballero, Hernandarias, Ciudad del Este, Encarnación and Cambyretá, built on 100 radiobases with Nokia AirScale equipment, ReefShark chipsets, Massive MIMO radios and IPAA+ antennas — fulfilling the radiobase obligation attached to its 200 MHz in the 3.5 GHz band, of which 10% is reserved for state institutions. Technology director Raúl Aguilera and general manager Alfredo Alcaraz have cited handset availability as the main barrier to mass adoption and the five-year licence term as the company's principal regulatory complaint, against a total planned investment of USD 35 million over the first licence period. AMX Paraguay holds 100% Mexican capital. In parallel, Senate Resolution No. 534 formally requests CONATEL to report on services provided by Tigo Paraguay S.A., Personal Paraguay, AMX Paraguay S.A. (Claro) and Hola Paraguay S.A. (Vox), covering regulations, contracts, permits, active lines, declared revenue, fees and electronic financial services. Senator Rafael Filizzola has separately alleged the main 5G band award was steered, leaving out Tigo and Personal which together hold roughly 70% of mobile subscribers, and warning users would have to switch operators to access the technology.", "image_url": "https://statics.forbes.com.py/2026/05/6a1b0b9a1d012.png", "is_gov_source": false, "is_authoritative": true, "client_tag": "Claro / AMX Paraguay — 5G coverage, Nokia build, Senate scrutiny"}, {"title": "Nubicom Enters October with One Live Radiobase Against a 22-Site Obligation and an Open Comptroller Audit (2026-09-25)", "date": "2026-09-25", "source_url": "https://dplnews.com/paraguay-nubicom-debe-desplegar-22-radiobases-octubre/", "source_name": "DPL News / CONATEL / CGR", "summary": "Nubicom Paraguay S.A., backed by the Vázquez Group and awarded 3.5 GHz spectrum in the 2025 first auction for USD 2 million, faces a 13 October 2026 deadline to have 22 5G radiobases deployed nationally and currently operates one, at the Teisa data centre in Villa Morra, Asunción. CONATEL maintains the company is within its contractual timeline and that the tender imposes no subscriber requirement in the opening months; the Comptroller General's Office, conducting an immediate special audit, has found insufficient evidence of deployment, no measurable tracking matrix at the regulator, and has been unable to verify either the claimed 100,000 Argentine subscribers or the USD 10 million minimum net worth the tender demanded. The CGR stops short of declaring breach but flags weak control and traceability and warns that non-compliance should trigger sanctions up to licence revocation or contract rescission. President Peña has publicly sided with the company and dismissed the Comptroller. The outcome sets the enforcement precedent for the entire 5G framework: whether a licence obligation is a binding commitment or a target that can be renegotiated.", "image_url": "https://dplnews.com/wp-content/uploads/2025/10/dplnews_nubicom_mc31025.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Nubicom — 22-radiobase deadline, licence at risk"}, {"title": "Copaco and Vox Seek Private Capital Rather Than Privatisation as Vox's Negative Equity Reaches G. 85,609 Million and 233 Staff Are Cut (2026-09-22)", "date": "2026-09-22", "source_url": "https://marketdata.com.py/secciones/laboratorio/entrevistas/page/31/", "source_name": "MarketData / Copaco", "summary": "Copaco, the state-owned communications company that wholly owns mobile operator Hola Paraguay S.A. (Vox), is prioritising a search for private capital rather than privatisation, according to its new president Rodrigo Ferreira Campos, who described 'shared risk' as one option under consideration. The caution is warranted: Vox posted a net loss of G. 33,314 million in 2025, carries negative net equity of G. 85,609 million and owes Copaco more than G. 178,316 million, which Copaco has been absorbing, raising doubts about going-concern status. Economist Óscar Stark, who took the chair of the company, said Copaco has more staff than it needs and confirmed 233 employees have been made redundant, arguing the entity must restructure and concentrate on the services where it can still be competitive. The Sindicato Nacional de Trabajadores de Telecomunicaciones (Sinattel) is demanding the state invest USD 100 million in Copaco and that management present a rescue plan within 60 days, under threat of strike. General manager Gilles García admitted in July that Vox is in a delicate financial position while flatly ruling out bankruptcy, and confirmed the search for investors or partners has been running since 2024, with any deal required to preserve 100% of the company's sovereignty. For equipment and services suppliers, the practical read is that Copaco-Vox procurement will remain frozen absent an external capital event, while any investor entering would likely re-examine the entire network roadmap.", "image_url": "https://marketdata.com.py/wp-content/uploads/2024/01/sojer.jpg", "is_gov_source": false, "is_authoritative": true, "client_tag": "Copaco / Vox — state operator seeks capital, procurement frozen"}]}, {"title": "VII. Integrated Impact Analysis for Business Operations", "tier": 2, "events": [], "impact_analysis": "🟡 Exchange-Rate Pain Is Now the Binding Constraint, Not Inflation. The guaraní closed the week of 25 September at G. 5,760/5,880 to the dollar, an eight-year high, having appreciated roughly 25% in twelve months and 12.34% year-to-date. The BCP held the policy rate at 5.50% on 22 September for a seventh consecutive meeting with headline inflation at 1.5% and core at 1.3% against a 3.5% target, and producer prices flat in August at -1.7% year-on-year — a textbook disinflation that is being delivered at the tradable sector's expense. The BCP's refusal to intervene in the spot market has pushed the adjustment onto exporters: the ARP quantifies USD 349 million of lost livestock production value in the twelve months to August, and Cispy argues the equilibrium rate is G. 6,300–6,600. For any operation whose revenue is dollar-denominated and whose costs are in guaraníes, margins are compressing mechanically every month. The forward window, up 30% year-on-year to USD 2,050 million, is a hedge for individual future transactions, not a solution to realised revenue.\n\n🟡 The Public-Sector Wage Bill Is Being Opened from Below and the 2027 Budget Does Not Close It. The doctors' settlement of mid-September — a G. 2,000,000 flat raise, a G. 2 million floor for contractors and residents, USD 260 million for medicines and 1,500 new posts — has become the template every other health union now cites. On 22 September the FNTS and 28 organisations representing 45,000 to 49,000 non-physician health workers took the same demand to the Ministry of Health, asking for 50% plus a carrera sanitaria, and adjourned negotiations to 3 October with mobilisations continuing. The 2027 budget submitted on 1 September totals G. 166.3 trillion and already asks Congress to raise the fiscal deficit ceiling to 3.9% of GDP, well above the 1.5% statutory limit, to clear roughly USD 1,270 million of accumulated arrears with health suppliers and road contractors. FY2026 has USD 260 million earmarked for medicines; FY2027 allocates around USD 760 million. Every additional flat raise agreed in September 2026 compounds the 2027 figure, and the exchange rate the budget assumes — G. 6,458 — is about 9% stronger in dollar terms than the market rate actually prevailing, a discrepancy former finance minister Manuel Ferreira puts at 0.4% of GDP.\n\n🟢 The 4 October Municipal Vote Is a Colorado Internal Referendum, Not a Policy Risk. With a poll-publication blackout in force, the last hard signal before election day is the closing campaign: Camilo Pérez, running on 'Asu puede cambiar' with Deputy Speaker Raúl Latorre as campaign chief and Horacio Cartes' public endorsement, closes with a motorcade on 28 September and claims a 20-point internal lead; Soledad Núñez campaigns against continuity. The TSJE begins deploying 14,711 ballot kits on 27 September, finishing in the Capital on 3 October. International business has no material exposure to the outcome of a municipal race, but the result will be read as a proxy for the balance between the Cartes and Peña wings heading into 2028, which does affect the durability of the investment-incentive and energy-tariff framework.\n\n🟡 Enforcement Credibility Is the Live Question in 5G. The 13 October deadline for Nubicom's 22 radiobases, against one currently live and a Comptroller finding of no verifiable tracking matrix at CONATEL, is the first real test of whether Paraguay's spectrum obligations bind. The president has publicly dismissed the Comptroller and defended the operator. The answer matters beyond Nubicom: Tigo and Personal have just accepted the same licence architecture — 90 days for technical plans, 180 days to first radiobase, 100 radiobases in four years, USD 80 million combined — and the value of that spectrum to them is a function of whether the rules are enforced evenly."}, {"title": "VIII. Targeted Recommendations for Chinese Enterprises", "tier": 2, "events": [], "impact_analysis": "🟡 Hedge the Revenue Side Before Hedging Anything Else. The single most valuable action available to a Chinese enterprise with dollar revenues and guaraní cost exposure in Paraguay is to lock in forward contracts now. The BCP's forward window grew 30% year-on-year to USD 2,050 million by end-August precisely because local exporters have reached the same conclusion, and the rate has moved from above G. 6,000 in early September to G. 5,880 by 25 September. Local agent projections of G. 6,100 for December look unreachable; some analysts now discuss G. 5,500. Contracts, EPC milestones and service agreements signed in 2025 at G. 6,300–6,600 assumptions are already loss-making on conversion. Re-price or re-denominate.\n\n🟡 Treat October–November 2026 as the Window for Any Public-Sector Energy or Data-Centre Engagement. Three processes converge. First, the ANDE engineer proposal to cap data centres, AI and crypto at 700 MW through an ascending auction with a USD 56/MWh floor, which would not take effect until 2028 and leaves existing electro-intensive contracts expiring in 2027 unresolved. Second, the government's working group on the new tariff regime, plus the new Ministry of Energy and supervisory regulator, whose output was requested for early September and is now overdue. Third, the Yguazú Digital phases, where phase 1 (USD 200–300 million, 10 MW, late 2027) is the only one with any near-term procurement content and phases 2 and 3 (USD 5 billion / USD 40 billion, 100 MW / 1 GW) are pre-feasibility narratives. The GCIE lobby is offering to multiply contracted power within 18 months in exchange for ten-year contracts to 2037 and a dedicated AI tariff — a position a well-capitalised entrant can align with. But do not commit capital against phase 2 or 3 numbers, and do not treat the 2028 auction date as settled: it is a union proposal, not policy.\n\n🔴 Do Not Build a Plan Around Nubicom-Style Licence Assumptions. The Nubicom case demonstrates that the gap between a spectrum obligation on paper and deployment on the ground can persist for a full licence year, that the regulator will describe one live radiobase as consistent with the timetable, and that the executive will publicly back the licensee against its own Comptroller. Whatever side of that dispute one takes, the operational lesson for a supplier or partner is that spectrum commitments in Paraguay should be treated as commercial intentions subject to political revision, not as enforceable demand. Price, contract and stage your exposure to any operator whose deployment depends on regulatory forbearance.\n\n🟡 Staff Local Content and Community Expectations into Any Ciudad del Este or Alto Paraná Presence. The new technology-led security plan — 100-plus smart cameras with facial and licence-plate recognition, four drones, body cameras, a new Grupo Lince headquarters and 45 patrol vehicles — is being delivered alongside a visible crime wave that included a G. 100 million safe robbery at a Minga Guazú water company and a car theft in the Ciudad del Este micro-centre in the same week. Business associations in the city co-financed the drones. Chinese enterprises with operations, warehouses or staff in the tri-border area should engage the Cámara de Comercio y Servicios de Ciudad del Este directly, contribute proportionately to the local security architecture, and budget for site-hardening: this is a market where the private sector is expected to co-fund public order.\n\n🟢 Use Paraguay's UN Positioning as an Early-Warning Feed, Not a Risk Event. Peña's 23 September UN General Assembly speech reaffirmed the Taiwan alliance ('Paraguay is not neutral'), opened a dialogue channel with Caracas, and called for a Latin American UN Secretary-General and Security Council reform. Simultaneously the government keeps signalling openness to China trade through Mercosur without breaking with Taipei, and farm lobbies continue pressing for direct Chinese market access with roughly 90% domestic public support. The diplomatic line is stable for now and the 2027 seventieth anniversary of Paraguay–Taiwan relations is being prepared as an economic alliance milestone. But the domestic economic logic points one way, and Chinese enterprises should track the Mercosur–China channel and the soy and beef lobbies' position as the leading indicators — not the annual UN speech, which has been consistent for years."}]}};

function renderMacroDataTable(d,unit){
  var MONTHS_L=[['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']];
  var h='<div class="macro-data-section"><button class="macro-data-toggle" onclick="toggleDataTable(this)">'+L('查看月度源数据 ▼','View Monthly Data ▼')+'</button>';
  h+='<div class="macro-data-table-wrap" style="display:none"><table class="macro-data-table"><thead><tr><th>'+L('月份','Month')+'</th><th>2023</th><th>2024</th><th>2025</th><th>2026*</th></tr></thead><tbody>';
  for(var m=0;m<12;m++){
    h+='<tr><td>'+L(MONTHS_L[0][m],MONTHS_L[1][m])+'</td>';
    var src=d.monthly||d.line;for(var y=0;y<4;y++){var idx=y*12+m,v=src[idx];if(v!=null)h+='<td>'+(v>=100?Math.round(v):v.toFixed(1))+(unit||'')+'</td>';else h+='<td class="macro-na">—</td>';}
    h+='</tr>';
  }
  h+='</tbody></table><div style="font-size:9px;color:#94A3B8;margin-top:4px">* 2026 '+L('为1–5月数据','Jan–May YTD')+'</div></div></div>';
  return h;
}
function renderFXDailyTable(d,unit){
  var DM=[31,28,31,30,31,30,31,31,30,31,30,31],dl=d.line||[];
  var h='<div class="macro-data-section"><button class="macro-data-toggle" onclick="toggleDataTable(this)">'+L('查看每日源数据 ▼','View Daily Data ▼')+'</button>';
  h+='<div class="macro-data-table-wrap" style="display:none"><table class="macro-data-table"><thead><tr><th>'+L('日期','Date')+'</th><th>PYG/USD</th></tr></thead><tbody>';
  var dates=[],day=1,mo=0,yr=2023;
  for(var i=0;i<dl.length;i++){
    dates.push(yr+'-'+(mo<9?'0'+(mo+1):(mo+1))+'-'+(day<10?'0'+day:day));
    day++;var dim=DM[mo];if(mo===1&&yr%4===0)dim=29;
    if(day>dim){day=1;mo++;if(mo>11){mo=0;yr++;}}
  }
  for(var i=dl.length-1;i>=0;i--){
    h+='<tr><td>'+dates[i]+'</td><td>'+Math.round(dl[i])+(unit||'')+'</td></tr>';
  }
  h+='</tbody></table></div></div>';
  return h;
}
function toggleDataTable(btn){
  var wrap=btn.nextElementSibling;
  if(wrap.style.display==='none'){wrap.style.display='block';btn.innerHTML=btn.innerHTML.replace('查看','隐藏').replace('View','Hide').replace(' ▼',' ▲');}
  else{wrap.style.display='none';btn.innerHTML=btn.innerHTML.replace('隐藏','查看').replace('Hide','View').replace(' ▲',' ▼');}
}
function closeMacroModal(e){
  if(e&&e.type==='keydown'){if(e.key!=='Escape')return;}
  else if(e&&e.target&&!e.target.closest('#macroModal'))return;
  var m=document.getElementById('macroModal');if(m){m.remove();document.removeEventListener('keydown',onMacroModalKey);}
}
function onMacroModalKey(e){if(e.key==='Escape')closeMacroModal(e);}
function renderMacroDashboard(){return'<div class="macro-dashboard"><div class="macro-title">'+L('巴拉圭宏观数据看板','Paraguay Macro Dashboard')+'<span class="macro-period">2023–2026</span></div><div class="macro-note">'+L('数据来源：BCP，月度数据为趋势估算值','Sources: BCP; monthly figures are trend estimates')+'</div><div class="macro-grid">'+renderMacroCardGDP()+renderMacroCardCPI()+renderMacroCardFX()+renderMacroCardRIN()+'</div></div>';}
function renderAll(){
  if(!briefingData)return;
  var d=briefingData;
  document.getElementById('headerSubtitle').textContent=(d.topic||'')+' · '+(d.time_span||'');

  var sections=d.sections||[],tier1=[],tier2=[];
  for(var i=0;i<sections.length;i++){
    if(sections[i].tier===2)tier2.push(sections[i]);else tier1.push(sections[i]);
  }
  var total=0;
  for(var i=0;i<tier1.length;i++)total+=(tier1[i].events||[]).length;

  var pills='<div class="stats-row-total"><div class="stat-pill pill-total" onclick="scrollToSec(null)"><span class="pill-label">'+L('全部事件','All Events')+'</span><span class="pill-count">'+total+'</span></div></div>';
  for(var row=0;row<2;row++){
    pills+='<div class="stats-row-sections">';
    for(var col=0;col<3;col++){
      var idx=row*3+col;if(idx>=tier1.length)break;
      var sec=tier1[idx],c=PCOL[idx],cnt=(sec.events||[]).length;
      pills+='<div class="stat-pill" style="background:'+c.bg+';color:'+c.text+';" onclick="scrollToSec('+idx+')"><span class="pill-dot" style="background:'+c.dot+'"></span><span class="pill-label">'+stripNum(sec.title)+'</span><span class="pill-count">'+cnt+'</span></div>';
    }
    pills+='</div>';
  }
  document.getElementById('statsRow').innerHTML=pills;

  var html=renderMacroDashboard();
  for(var i=0;i<tier1.length;i++)html+=renderSection(tier1[i],i);
  if(tier2.length>0&&tier1.length>0){
    html+='<div class="tier-divider"><span>'+L('形势分析与行动建议','Analysis & Recommendations')+'</span></div>';
  }
  for(var j=0;j<tier2.length;j++)html+=renderSection(tier2[j],tier1.length+j);
  document.getElementById('contentArea').innerHTML=html;
}

function renderSection(sec,idx){
  var events=sec.events||[],isT2=sec.tier===2;
  var g=GRAD[idx%8],icon=ICONS[idx%8];
  var body='';
  if(isT2||events.length===0){
    if(sec.impact_analysis)body='<div class="analysis-body">'+fmt(sec.impact_analysis)+'</div>';
    else if(!isT2)body='<div style="padding:4px 22px 16px;color:#94A3B8;font-size:13px;">'+L('暂无此时间段内的事件','No events in this period')+'</div>';
  }else{
    var cards='';
    for(var i=0;i<events.length;i++)cards+=renderCard(events[i],g[0],g[1],icon);
    body='<div class="events-grid">'+cards+'</div>';
  }
  var badge=events.length>0?'<span class="badge">'+events.length+L(' 条事件',' events')+'</span>':'';
  return '<div class="section s'+(idx%8)+(isT2?' tier2':'')+'" id="sec-'+idx+'"><div class="section-header"><h2>'+esc(sec.title||'')+'</h2>'+badge+'</div>'+(sec.description?'<div class="section-desc">'+esc(sec.description)+'</div>':'')+body+'</div>';
}

function renderCard(evt,phFrom,phTo,icon){
  var img=evt.image_url,hasImg=img&&img.indexOf('http')===0;
  var ih='';
  if(hasImg)ih='<img src="'+esc(img)+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">';
  ih+='<div class="img-placeholder" style="background:linear-gradient(135deg,'+phFrom+','+phTo+');'+(hasImg?'display:none':'display:flex')+';font-size:32px;color:#fff;">'+icon+'</div>';

  var tags='';
  if(evt.date)tags+='<span class="event-tag date">'+esc(evt.date)+'</span>';
  if(evt.client_tag)tags+='<span class="event-tag client">'+esc(evt.client_tag)+'</span>';
  if(evt.is_gov_source)tags+='<span class="event-tag gov">'+L('政府官网','Government')+'</span>';
  else if(evt.is_authoritative)tags+='<span class="event-tag auth">'+L('权威媒体','Authoritative')+'</span>';
  if(evt.source_name)tags+='<span class="event-tag source">'+esc(evt.source_name)+'</span>';

  var link=evt.source_url?'<a class="event-link" href="'+esc(evt.source_url)+'" target="_blank" rel="noopener">'+L('查看原文 →','Read more →')+'</a>':'';
  var preview=evt.summary||'';if(!preview&&evt.title)preview=evt.title;
  return '<div class="event-card"><div class="event-img">'+ih+'</div><div class="event-body"><div class="event-meta">'+tags+'</div><div class="event-preview">'+esc(preview)+'</div>'+link+'</div></div>';
}

function fmt(text){
  var h=esc(text);
  h=h.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
  h=h.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
  h=h.replace(/\n/g,'<br>');
  return h;
}

function scrollToSec(idx){
  var pills=document.querySelectorAll('.stat-pill');
  for(var i=0;i<pills.length;i++)pills[i].style.outline='';
  if(idx===null||idx===undefined){window.scrollTo({top:0,behavior:'smooth'});return;}
  var el=document.getElementById('sec-'+idx);
  if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.style.boxShadow='0 0 0 3px #3B82F6';
  setTimeout(function(){el.style.boxShadow='';},1500);
}

function showHistory(){
  fetch('/api/briefings').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(list){
    if(!list||!list.length){alert(L('没有找到历史简报','No saved briefings found.'));return;}
    var h='<div class="update-modal-overlay" id="histModal" onclick="closeUpdateModal(\'histModal\')"><div class="update-modal" onclick="event.stopPropagation()"><h3>'+L('历史简报','Saved Briefings')+'</h3><div class="history-list">';
    for(var i=0;i<list.length;i++){var b=list[i];h+='<div class="history-item" onclick="loadBriefing(\''+esc(b.filename)+'\')"><div><div class="hi-title">'+esc(b.topic||b.filename)+'</div><div class="hi-meta">'+esc(b.time_span||'')+'</div></div><span class="hi-count">'+(b.event_count||0)+L(' 条',' evts')+'</span></div>';}
    h+='</div><div class="btn-row" style="margin-top:12px"><button class="btn-secondary" onclick="closeUpdateModal(\'histModal\')">'+L('关闭','Close')+'</button></div></div></div>';
    document.body.insertAdjacentHTML('beforeend',h);
  }).catch(function(){
    alert(L('此功能需要启动 Flask 服务器。\n请在终端运行: python3 web_app.py\n然后访问 http://127.0.0.1:5000','This feature requires the Flask server.\nRun: python3 web_app.py\nThen visit http://127.0.0.1:5000'));
  });
}
function loadBriefing(filename){
  fetch('/api/briefing/'+encodeURIComponent(filename)).then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    DATA['zh']=data;DATA['en']=data;briefingData=data;renderAll();closeUpdateModal('histModal');
  }).catch(function(){alert(L('加载失败','Failed to load briefing.'));});
}
function refreshBriefing(){
  var btn=document.getElementById('btnUpdate');
  btn.disabled=true;btn.textContent='...';
  fetch('/api/briefing/briefing_en.json').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    DATA['en']=data;briefingData=data;renderAll();
    fetch('/api/briefing/briefing.json').then(function(r){if(r.ok)return r.json();}).then(function(zh){if(zh)DATA['zh']=zh;}).catch(function(){});
  }).catch(function(){alert(L('刷新失败','Refresh failed'));}).finally(function(){
    btn.disabled=false;btn.textContent=L('刷新简报','Refresh');
  });
}
function openMacroModal(){
  var h='<div class="update-modal-overlay" id="macroModal" onclick="closeUpdateModal(\'macroModal\')"><div class="update-modal" onclick="event.stopPropagation()"><h3>'+L('更新宏观数据','Update Macro Data')+'</h3>';
  h+='<p style="font-size:11px;color:#94A3B8;margin-bottom:12px">'+L('下载最新 BCP Excel 后填入文件名','Fill in latest BCP Excel filenames')+'</p>';
  h+='<input type="text" id="cpiFileName" placeholder="'+L('CPI文件，如 AE_IPC-26.6.xlsx','CPI file, e.g. AE_IPC-26.6.xlsx')+'" style="width:100%;font-size:12px;padding:8px 10px;border:1px solid #CBD5E1;border-radius:6px;margin-bottom:8px">';
  h+='<input type="text" id="rinFileName" placeholder="'+L('RIN文件，如 reservas...xlsx','RIN file, e.g. reservas...xlsx')+'" style="width:100%;font-size:12px;padding:8px 10px;border:1px solid #CBD5E1;border-radius:6px;margin-bottom:12px">';
  h+='<div class="btn-row"><button class="btn-secondary" onclick="closeUpdateModal(\'macroModal\')">'+L('取消','Cancel')+'</button><button class="btn-primary" onclick="refreshMacroData()">'+L('更新','Update')+'</button></div>';
  h+='<div id="genStatus" style="margin-top:10px;font-size:12px;color:#64748B;display:none"></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
}
function refreshMacroData(){
  var cpiFile=document.getElementById('cpiFileName').value.trim();
  var rinFile=document.getElementById('rinFileName').value.trim();
  if(!cpiFile&&!rinFile){alert(L('请至少输入一个文件名','Please enter at least one filename.'));return;}
  var st=document.getElementById('genStatus');
  st.style.display='block';st.innerHTML='<span class="loading-spinner"></span>'+L('正在读取宏观数据文件…','Reading macro data files…');
  fetch('/api/update-macro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cpi_file:cpiFile,rin_file:rinFile})}).then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    var msgs=[];
    if(data.cpi&&data.cpi.length){MACRO_CPI.line=data.cpi;msgs.push(L('CPI已更新('+data.cpi.length+'个月)','CPI updated ('+data.cpi.length+' mo)'));}
    if(data.cpi_error)msgs.push(L('CPI错误: ','CPI error: ')+data.cpi_error);
    if(data.rin&&data.rin.length){MACRO_RIN.line=data.rin;msgs.push(L('RIN已更新('+data.rin.length+'个月)','RIN updated ('+data.rin.length+' mo)'));}
    if(data.rin_error)msgs.push(L('RIN错误: ','RIN error: ')+data.rin_error);
    if(msgs.length){renderAll();st.innerHTML='<span style="color:#10B981">'+msgs.join('; ')+'</span>';}
    else st.innerHTML='<span style="color:#EF4444">'+L('更新失败','Update failed')+'</span>';
  }).catch(function(){st.innerHTML='<span style="color:#EF4444">'+L('更新失败，请确保 Flask 服务器已启动','Failed. Make sure Flask server is running.')+'</span>';});
}
function closeUpdateModal(id){
  var m=document.getElementById(id||'updateModal');if(m)m.remove();
  var h=document.getElementById('histModal');if(h&&id!=='histModal')h.remove();
}
document.addEventListener('DOMContentLoaded',function(){
  if(window.IS_STANDALONE)document.getElementById('standaloneBanner').style.display='block';
  if(MACRO_FX.monthly&&!MACRO_FX.line)MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
  fetch('/api/briefing/briefing_en.json').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(data){
    DATA['en']=data;briefingData=data;currentLang='en';renderAll();updateLangBtn();
    fetch('/api/briefing/briefing.json').then(function(r){if(r.ok)return r.json();}).then(function(zh){if(zh)DATA['zh']=zh;}).catch(function(){});
    if(!window.IS_STANDALONE)fetchLiveFX();
  }).catch(function(){
    briefingData=DATA['en'];currentLang='en';renderAll();updateLangBtn();
  });
});
function fetchLiveFX(){
  fetch('/api/macro/fx').then(function(r){if(!r.ok)return;return r.json();}).then(function(d){
    if(!d||!d.rate)return;
    var arr=MACRO_FX.monthly||MACRO_FX.line||[];
    arr[arr.length-1]=d.rate;
    window.MACRO_FX_DATE=(d.date||'').replace(/-/g,'.');
    MACRO_FX.line=expandToDaily(MACRO_FX.monthly,MACRO_FX_MONTHDAYS);
    renderAll();
  }).catch(function(){});
}
</script>
